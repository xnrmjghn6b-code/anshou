<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>保存の診断</title>
<style>
  :root{color-scheme:light}
  body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;
       margin:0;padding:16px;background:#fff;color:#111;line-height:1.7;font-size:16px}
  h1{font-size:20px;margin:0 0 4px}
  p.lead{margin:0 0 16px;color:#555;font-size:14px}
  table{border-collapse:collapse;width:100%;margin:0 0 16px;font-size:15px}
  th,td{border:1px solid #ddd;padding:7px 9px;text-align:left;vertical-align:top}
  th{background:#f6f6f6;width:44%;font-weight:600}
  td{word-break:break-all}
  .ok{color:#0a7a2f;font-weight:700}
  .ng{color:#c00;font-weight:700}
  .box{border:2px solid #111;border-radius:8px;padding:12px;margin:0 0 16px}
  .box h2{font-size:16px;margin:0 0 6px}
  button{font-size:16px;padding:10px 16px;border:1px solid #111;background:#111;color:#fff;
         border-radius:6px;margin:0 8px 8px 0}
  button.sub{background:#fff;color:#111}
  textarea{width:100%;height:180px;font-size:12px;font-family:ui-monospace,monospace}
</style>
</head>
<body>

<h1>保存の診断</h1>
<p class="lead">このページを開くと、ブラウザに小さな印を書き込みます。<b>一度閉じてから開き直す</b>と、印が残っているかどうかが分かります。</p>

<div class="box">
  <h2 id="verdict">調べています…</h2>
  <div id="verdictNote"></div>
</div>

<table id="tbl"></table>

<button id="btnReload">開き直して確かめる</button>
<button class="sub" id="btnCopy">結果をコピー</button>
<button class="sub" id="btnClear">印を消してやり直す</button>

<textarea id="dump" readonly></textarea>

<script>
"use strict";
const KEY_DIAG = "diag_probe_v1";
const KEY_APP  = "gomo_anshou_v1";
const rows = [];
function add(k, v, cls){ rows.push([k, v, cls||""]); }
function esc(s){ return String(s).replace(/[<>&]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;"}[c])); }

const now = new Date();
const stamp = now.toISOString();

/* --- 1. localStorage が触れるか --- */
let lsAvailable = false, lsError = "", prev = null;
try{
  const t = "__t" + Math.random();
  localStorage.setItem(t, "1");
  localStorage.removeItem(t);
  lsAvailable = true;
}catch(e){ lsError = e.name + ": " + e.message; }
add("localStorage が使えるか", lsAvailable ? "使える" : "使えない（" + lsError + "）",
    lsAvailable ? "ok" : "ng");

/* --- 2. 前回の印が残っているか --- */
if(lsAvailable){
  try{ prev = JSON.parse(localStorage.getItem(KEY_DIAG) || "null"); }catch(e){}
}
let survived = null;
if(!lsAvailable){
  add("前回の印", "調べられない", "ng");
}else if(!prev){
  add("前回の印", "無い（このページは初めて、または消された）");
}else{
  survived = true;
  const mins = Math.round((now - new Date(prev.at)) / 60000);
  add("前回の印", "残っている（" + prev.at + " ／ " + mins + "分前 ／ 通算 " + prev.n + " 回目）", "ok");
}

/* --- 3. 暗唱アプリ本体の記録 --- */
let appRaw = null;
if(lsAvailable){ try{ appRaw = localStorage.getItem(KEY_APP); }catch(e){} }
if(appRaw){
  let cnt = "?", upd = "?";
  try{ const o = JSON.parse(appRaw); cnt = Object.keys(o.cards||{}).length; upd = o.updated || "?"; }catch(e){}
  add("暗唱アプリの記録", "有り（" + appRaw.length + " 文字 ／ カード " + cnt + " 枚 ／ 最終更新 " + upd + "）", "ok");
}else{
  add("暗唱アプリの記録", lsAvailable ? "無い" : "調べられない", "ng");
}

/* --- 4. 周辺の手がかり --- */
add("Cookie が使えるか", navigator.cookieEnabled ? "使える" : "使えない",
    navigator.cookieEnabled ? "ok" : "ng");
try{
  document.cookie = "diagc=1; path=/; max-age=3600; SameSite=Lax";
  add("Cookie の書き込み", document.cookie.indexOf("diagc=1") >= 0 ? "書けた" : "書けない",
      document.cookie.indexOf("diagc=1") >= 0 ? "ok" : "ng");
}catch(e){ add("Cookie の書き込み", "例外: " + e.message, "ng"); }

add("画面の出どころ", location.origin);
add("iframe の中か", (window.top === window.self) ? "いいえ（直接開いている）" : "はい（枠の中）",
    (window.top === window.self) ? "ok" : "ng");
add("ホーム画面から起動しているか",
    (window.navigator.standalone === true) ? "はい" :
    (window.navigator.standalone === false ? "いいえ（Safariのタブ）" : "判定できない端末"));
add("端末", navigator.userAgent);

/* 保存できる量（プライベートブラウズだと極端に小さいことがある） */
if(navigator.storage && navigator.storage.estimate){
  navigator.storage.estimate().then(function(est){
    const q = est.quota ? Math.round(est.quota/1048576) + " MB" : "不明";
    const u = est.usage ? Math.round(est.usage/1024) + " KB" : "0 KB";
    addLate("保存できる量", "上限 " + q + " ／ 使用 " + u,
            (est.quota && est.quota < 20*1048576) ? "ng" : "");
  }).catch(function(){ addLate("保存できる量", "調べられない"); });
}
if(navigator.storage && navigator.storage.persisted){
  navigator.storage.persisted().then(function(p){
    addLate("消されない保証", p ? "あり" : "なし（ブラウザの判断で消される可能性）");
  }).catch(function(){});
}

/* --- 5. 新しい印を書く --- */
let wroteBack = null;
if(lsAvailable){
  const rec = { at: stamp, n: (prev && prev.n ? prev.n : 0) + 1 };
  try{
    localStorage.setItem(KEY_DIAG, JSON.stringify(rec));
    const back = localStorage.getItem(KEY_DIAG);
    wroteBack = (back === JSON.stringify(rec));
    add("今回の印を書けたか", wroteBack ? "書けた（読み直しても同じ）" : "書いた直後に読むと違う",
        wroteBack ? "ok" : "ng");
  }catch(e){ add("今回の印を書けたか", "例外: " + e.name + " " + e.message, "ng"); }
}

/* --- 描画 --- */
function render(){
  document.getElementById("tbl").innerHTML = rows.map(function(r){
    return "<tr><th>" + esc(r[0]) + "</th><td class='" + r[2] + "'>" + esc(r[1]) + "</td></tr>";
  }).join("");
  document.getElementById("dump").value = rows.map(r => r[0] + ": " + r[1]).join("\n");
}
function addLate(k, v, cls){ add(k, v, cls); render(); }
render();

/* --- 判定 --- */
const vd = document.getElementById("verdict"), vn = document.getElementById("verdictNote");
if(!lsAvailable){
  vd.textContent = "保存そのものが禁止されています";
  vd.className = "ng";
  vn.innerHTML = "設定 → アプリ → Safari → <b>「すべてのCookieをブロック」</b>が入っていると、"
    + "この状態になります。または<b>プライベートブラウズ</b>で開いています。";
}else if(prev){
  vd.textContent = "残っていました（通算 " + prev.n + " 回目）";
  vd.className = "ok";
  vn.textContent = "このページの印は生き延びています。暗唱アプリの記録の行も見てください。";
}else{
  vd.textContent = "印を書きました。いったん閉じて開き直してください";
  vn.innerHTML = "Safariを完全に閉じて（タブを閉じる／アプリを終了する）、もう一度このURLを開きます。"
    + "そのとき<b>「残っていました」</b>と出れば保存は効いています。";
}

document.getElementById("btnReload").onclick = function(){ location.reload(); };
document.getElementById("btnClear").onclick = function(){
  try{ localStorage.removeItem(KEY_DIAG); }catch(e){}
  location.reload();
};
document.getElementById("btnCopy").onclick = function(){
  const ta = document.getElementById("dump");
  ta.select(); ta.setSelectionRange(0, 99999);
  try{ document.execCommand("copy"); this.textContent = "コピーした"; }
  catch(e){ this.textContent = "コピーできない（下の枠を長押しで選んでください）"; }
};
</script>
</body>
</html>
