case":"最二小判平成10・3・26 民集52巻2号483頁","gist":"一般債権者の差押えとの優劣は、差押命令の第三債務者への送達と抵当権設定登記の先後による"}],"law":"","cites":[],"rate":0,"designed":true,"ref":false,"hash":"3f8c1478c1db"},{"id":"民法/抵当権の物上代位_差押えの趣旨と目的債権の処分#5","block":"第5〔賃借人の相殺との優劣〕","kind":"cloze","masked":"⦅抵当権者が物上代位により賃料債権を差し押さえた後は、賃借人は、抵当権設定登記の⟦ア⟧賃貸人に対して取得した債権を自働債権とする相殺をもって、抵当権者に⟦イ⟧⦆⟨1⟩。\n物上代位により抵当権の効力が賃料債権に及ぶことは抵当権設定登記により公示されているのであるから、登記後に取得した債権による相殺への賃借人の⟦ウ⟧を、抵当権の効力に⟦エ⟧からである。\nこれに対し、登記⟦オ⟧に取得した債権を自働債権とする相殺は、抵当権者に⟦カ⟧。","body":"⦅抵当権者が物上代位により賃料債権を差し押さえた後は、賃借人は、抵当権設定登記の⟪後に⟫賃貸人に対して取得した債権を自働債権とする相殺をもって、抵当権者に⟪対抗することができない⟫⦆⟨1⟩。\n物上代位により抵当権の効力が賃料債権に及ぶことは抵当権設定登記により公示されているのであるから、登記後に取得した債権による相殺への賃借人の⟪期待⟫を、抵当権の効力に⟪優先させる理由はない⟫からである。\nこれに対し、登記⟪前⟫に取得した債権を自働債権とする相殺は、抵当権者に⟪対抗することができる⟫。","answers":["後に","対抗することができない","期待","優先させる理由はない","前","対抗することができる"],"check":"登記**後**に取得した債権による相殺は対抗不可／登記**前**なら対抗可／理由＝登記による公示 ／ **反対債権の取得 vs 登記**の先後","notes":[{"n":1,"label":"最一小判平成13・3・13","case":"最一小判平成13・3・13 民集55巻2号363頁","gist":"物上代位による差押え後は、賃借人は抵当権設定登記後に取得した債権を自働債権とする相殺を抵当権者に対抗できない"}],"law":"","cites":[],"rate":0,"designed":true,"ref":false,"hash":"e4957dae15bb"}],"setsurei":["AはXに融資し、その担保としてX所有の甲建物に抵当権の設定を受け、**登記を経由した**。Xは甲建物をYに賃貸して賃料債権を有していた。その後、 1. Xがこの賃料債権をCに譲渡し、確定日付ある証書によるYの承諾を得た。 2. Xの一般債権者DがXの賃料債権について転付命令を得て、これがYに送達された。 Aは、賃料がYから払い渡される前に賃料債権を差し押さえて物上代位したい。1・2それぞれの場合、Aは優先弁済を受けられるか。","BはPに5000万円を貸し付け、その担保としてP所有の乙倉庫に抵当権の設定を受けた。Pは乙倉庫をQに賃貸している。 1. Pの一般債権者Sが乙倉庫の賃料債権を差し押さえ、その差押命令がQに送達された。**その後に**Bが抵当権設定登記を経由し、物上代位により同じ賃料債権を差し押さえた。Bは配当を受けられるか。 2. Bの抵当権設定登記の後、QがPに対して1000万円の貸金債権を取得した。Bが物上代位により賃料債権を差し押さえた後、Qはこの貸金債権を自働債権として賃料債務と相殺し、Bに対抗できるか。仮にQが**登記前**にこの債権を取得していた場合はどうか。"],"full":"抵当権の効力は、目的物の売却・賃貸等により債務者が受けるべき金銭にも及ぶが、抵当権者は、その払渡し又は引渡しの前に差押えをしなければならない（372条・⟪304条1項ただし書⟫）。\nこの差押えを要求する趣旨は、抵当権者の⟪優先権を保全⟫する点にも、目的債権の⟪特定性を維持⟫する点にもない。抵当権の効力が目的債権に及ぶことは⟪抵当権設定登記⟫によって公示されているのであるから、第三者の保護は登記に委ねれば足りる。⦅差押えの趣旨は、主として、第三債務者が⟪二重弁済⟫を強いられる危険から第三債務者を保護する点にあると解する⦆⟨1⟩。\n\nそこで、⦅目的債権が譲渡され第三者対抗要件が備えられた後であっても、抵当権者は目的債権を差し押さえて物上代位権を行使することができると解する⦆⟨1⟩。\nなぜなら、(1) 304条1項の「⟪払渡し又は引渡し⟫」という文言は当然には債権譲渡を含まず、目的債権が譲渡されたことから必然的に抵当権の効力が及ばなくなるものでもない。(2) 第三債務者は、差押命令の送達を受ける前に譲受人に弁済した分はその⟪消滅を対抗⟫でき、弁済していない分は⟪供託⟫すれば免責されるから、その利益は害されない。(3) 抵当権の効力が目的債権に及ぶことは抵当権設定登記により公示されている。(4) 譲渡が優先すると解すると、抵当権設定者は差押え前に⟪債権を譲渡⟫するだけで容易に物上代位を免れることができ、抵当権者の利益を不当に害するからである。\nよって、⟪抵当権設定登記⟫が債権譲渡の⟪対抗要件具備⟫より先である限り、抵当権者が⟪優先する⟫。\n\nこれに対し、⦅目的債権について転付命令が第三債務者に送達された後は、抵当権者は物上代位権を⟪行使することができない⟫⦆⟨1⟩。\n転付命令は、その送達時に他の債権者が差押え等をしていないことを条件として、差押債権者に⟪独占的満足⟫を与えるものであり（⟪民執159条3項⟫）、この「差押え」には⟪物上代位による差押え⟫も含まれる。したがって、送達前に物上代位による差押えがされていれば転付命令は⟪効力を生じない⟫が、そうでない場合には、送達時に被転付債権が差押債権者の債権の⟪弁済に充当⟫されたものとみなされる（民執160条）。弁済されたものとみなされる以上、もはや⟪代位の目的⟫となる債権は存在しないからである。\n\n一般債権者による差押えとの競合においては、一般債権者の処分禁止効は⟪差押命令⟫の第三債務者への⟪送達⟫によって生じ、抵当権者が抵当権を第三者に対抗するには⟪抵当権設定登記⟫を要する。\nしたがって、⦅両者の優劣は、一般債権者の申立てによる差押命令の第三債務者への送達と、抵当権設定登記との⟪先後⟫によって決せられる⦆⟨1⟩。送達が登記より先であれば、抵当権者は⟪配当を受けることができない⟫。\n\n⦅抵当権者が物上代位により賃料債権を差し押さえた後は、賃借人は、抵当権設定登記の⟪後に⟫賃貸人に対して取得した債権を自働債権とする相殺をもって、抵当権者に⟪対抗することができない⟫⦆⟨1⟩。\n物上代位により抵当権の効力が賃料債権に及ぶことは抵当権設定登記により公示されているのであるから、登記後に取得した債権による相殺への賃借人の⟪期待⟫を、抵当権の効力に⟪優先させる理由はない⟫からである。\nこれに対し、登記⟪前⟫に取得した債権を自働債権とする相殺は、抵当権者に⟪対抗することができる⟫。","kata":"","hanrei":[["最二小判平成元・10・27 民集43巻9号1070頁","抵当権に基づき賃料債権（供託金還付請求権を含む）に物上代位できる","**百選Ⅰ〔第9版〕83番＝〔第8版〕87番**（解説 中山知己）"],["最二小判平成10・1・30 民集52巻1号1頁","目的債権が譲渡され対抗要件が備えられた後でも、抵当権者は差し押さえて物上代位できる。差押えの趣旨＝第三債務者保護","**百選Ⅰ〔第9版〕84番＝〔第8版〕88番**（解説 今尾真）。**本論証の主判例**"],["最一小判平成13・3・13 民集55巻2号363頁","物上代位による差押え後は、賃借人は抵当権設定登記後に取得した債権を自働債権とする相殺を抵当権者に対抗できない","**百選Ⅰ〔第9版〕85番**（**第9版で新規収録**。第8版・第7版には無い）"],["最二小判平成10・3・26 民集52巻2号483頁","一般債権者の差押えとの優劣は、差押命令の第三債務者への送達と抵当権設定登記の先後による","民法百選Ⅰには不掲載"],["最一小判平成14・3・12 民集56巻3号555頁","転付命令が第三債務者に送達された後は、先に物上代位の差押えがない限り物上代位できない","民法百選Ⅰには不掲載"],["最一小判平成13・10・25 民集55巻6号975頁","物上代位権者は、差押えをせずに配当要求をすることはできない","民法百選Ⅰには不掲載"],["最決平成12・4・14 民集54巻4号1552頁","転貸賃料債権への物上代位は原則不可。法人格濫用・賃貸借の仮装等で賃借人を所有者と同視すべき場合は例外","民法百選Ⅰには不掲載"],["最判平成14・3・28 民集56巻3号689頁","賃貸借終了・明渡し後は、残存賃料債権は敷金の限度で当然に消滅し、物上代位は対象を失う","民法百選Ⅰ〔第9版〕3番は同日の**別事件**（信義則——賃貸借契約の終了と転借人への対抗）。**混同注意**"]],"field":"抵当権","order":18},{"name":"抵当権侵害_妨害排除請求","subject":"民法","rank":"A","path":"まとめ/民法/論証/抵当権侵害_妨害排除請求.md","cards":[{"id":"民法/抵当権侵害_妨害排除請求#1","block":"第1〔（原則）〕","kind":"cloze","masked":"抵当権は、目的不動産の占有を設定者のもとに留めたまま、その⟦ア⟧を把握する⟦イ⟧である（369条1項）。したがって抵当権者は、設定者が抵当不動産について行う使用収益に干渉することは⟦ウ⟧のが原則である。","body":"抵当権は、目的不動産の占有を設定者のもとに留めたまま、その⟪交換価値⟫を把握する⟪非占有担保⟫である（369条1項）。したがって抵当権者は、設定者が抵当不動産について行う使用収益に干渉することは⟪できない⟫のが原則である。","answers":["交換価値","非占有担保","できない"],"check":"","notes":[],"law":"","cites":["民法/369"],"rate":7,"designed":true,"ref":true,"hash":"83141f873bb4"},{"id":"民法/抵当権侵害_妨害排除請求#2","block":"第2〔（侵害の判断基準）〕","kind":"cloze","masked":"もっとも、抵当権が非占有担保であることは、抵当権者が設定者の使用収益権能を妨げ得ないことを意味するにすぎず、占有の態様による⟦ア⟧まで甘受すべきことを意味しない。そこで、⦅第三者の占有により、⟦イ⟧が害され適正な価額よりも⟦ウ⟧するおそれがあるなど、抵当不動産の⟦エ⟧が妨げられ、抵当権者の⟦オ⟧となるような状態があるときは、これを抵当権に対する侵害と評価することができると解する⦆⟨1⟩。この場合、抵当権者は、抵当権に基づく⟦カ⟧として、当該状態の排除を求めることができる。","body":"もっとも、抵当権が非占有担保であることは、抵当権者が設定者の使用収益権能を妨げ得ないことを意味するにすぎず、占有の態様による⟪換価価値の低下⟫まで甘受すべきことを意味しない。そこで、⦅第三者の占有により、⟪競売手続の進行⟫が害され適正な価額よりも⟪売却価額が下落⟫するおそれがあるなど、抵当不動産の⟪交換価値の実現⟫が妨げられ、抵当権者の⟪優先弁済請求権の行使が困難⟫となるような状態があるときは、これを抵当権に対する侵害と評価することができると解する⦆⟨1⟩。この場合、抵当権者は、抵当権に基づく⟪妨害排除請求⟫として、当該状態の排除を求めることができる。","answers":["換価価値の低下","競売手続の進行","売却価額が下落","交換価値の実現","優先弁済請求権の行使が困難","妨害排除請求"],"check":"","notes":[{"n":1,"label":"最大判平11・11・24","case":"**最大判平11・11・24**（民集53巻8号1899頁）","gist":"不法占有により交換価値の実現が妨げられ優先弁済請求権の行使が困難となる状態があれば抵当権侵害。**担保価値維持請求権を被保全債権とし、423条の法意により所有者の妨害排除請求権を代位行使**できる。抵当権に基づく妨害排除請求は**傍論**で言及"}],"law":"","cites":[],"rate":0,"designed":true,"ref":false,"hash":"c2685267b85a"},{"id":"民法/抵当権侵害_妨害排除請求#3","block":"第3〔（占有権原がある場合の加重）〕","kind":"cloze","masked":"これに対し、抵当権設定登記後に抵当不動産の所有者から⟦ア⟧を受けて占有する者については、なお加重した要件を要すると解する。抵当権に対抗できない賃借人にすら買受けの時から⟦イ⟧が認められている以上（⟦ウ⟧）、約定に従って占有しているにすぎない者を直ちに排除することはできないからである。すなわち、⦅その⟦ア⟧に抵当権の実行としての⟦エ⟧が認められ、かつ、その占有により⟦オ⟧があるときに限り、抵当権に基づく妨害排除請求ができると解する⦆⟨1⟩。","body":"これに対し、抵当権設定登記後に抵当不動産の所有者から⟪占有権原の設定⟫を受けて占有する者については、なお加重した要件を要すると解する。抵当権に対抗できない賃借人にすら買受けの時から⟪6か月の明渡猶予⟫が認められている以上（⟪395条1項⟫）、約定に従って占有しているにすぎない者を直ちに排除することはできないからである。すなわち、⦅その占有権原の設定に抵当権の実行としての⟪競売手続を妨害する目的⟫が認められ、かつ、その占有により⟪第2の客観的状態⟫があるときに限り、抵当権に基づく妨害排除請求ができると解する⦆⟨1⟩。","answers":["占有権原の設定","6か月の明渡猶予","395条1項","競売手続を妨害する目的","第2の客観的状態"],"check":"","notes":[{"n":1,"label":"最判平17・3・10","case":"**最判平17・3・10**（民集59巻2号356頁）","gist":"占有権原の設定を受けた占有者についても、①客観的要件＋②占有権原の設定に競売手続妨害目的があれば、**抵当権に基づく妨害排除請求**ができる。所有者に適切な維持管理が期待できない場合は**直接自己への明渡し**を請求できる。**賃料相当損害金は否定**"}],"law":"","cites":["民法/395"],"rate":5,"designed":true,"ref":false,"hash":"4872cdb9041f"},{"id":"民法/抵当権侵害_妨害排除請求#4","block":"第4〔（誰に明け渡させるか）〕","kind":"cloze","masked":"抵当権者には占有権原がないから、明渡しは本来⟦ア⟧させるべきである。もっとも、⦅所有者において抵当権に対する侵害が生じないように抵当不動産を⟦イ⟧することが⟦ウ⟧場合には、抵当権者は、占有者に対し、⟦エ⟧を求めることができると解する⦆⟨1⟩。この場合の占有は、所有者に代わって抵当不動産を維持管理することを目的とする⟦オ⟧にとどまり、使用収益を目的とするものではない。","body":"抵当権者には占有権原がないから、明渡しは本来⟪所有者に対して⟫させるべきである。もっとも、⦅所有者において抵当権に対する侵害が生じないように抵当不動産を⟪適切に維持管理⟫することが⟪期待できない⟫場合には、抵当権者は、占有者に対し、⟪直接自己への明渡し⟫を求めることができると解する⦆⟨1⟩。この場合の占有は、所有者に代わって抵当不動産を維持管理することを目的とする⟪管理占有⟫にとどまり、使用収益を目的とするものではない。","answers":["所有者に対して","適切に維持管理","期待できない","直接自己への明渡し","管理占有"],"check":"","notes":[{"n":1,"label":"最判平17・3・10","case":"**最判平17・3・10**（民集59巻2号356頁）","gist":"占有権原の設定を受けた占有者についても、①客観的要件＋②占有権原の設定に競売手続妨害目的があれば、**抵当権に基づく妨害排除請求**ができる。所有者に適切な維持管理が期待できない場合は**直接自己への明渡し**を請求できる。**賃料相当損害金は否定**"}],"law":"","cites":[],"rate":0,"designed":true,"ref":false,"hash":"4407b32e7a85"},{"id":"民法/抵当権侵害_妨害排除請求#5","block":"第5〔（損害賠償）〕","kind":"cloze","masked":"他方、⦅抵当権者は、第三者の占有により⟦ア⟧を被るものではない⦆⟨1⟩。抵当権者は抵当不動産を⟦イ⟧、民事執行法上の手続によらずにその⟦ウ⟧を取得することもできないからである。","body":"他方、⦅抵当権者は、第三者の占有により⟪賃料額相当の損害⟫を被るものではない⦆⟨1⟩。抵当権者は抵当不動産を⟪自ら使用できず⟫、民事執行法上の手続によらずにその⟪使用による利益⟫を取得することもできないからである。","answers":["賃料額相当の損害","自ら使用できず","使用による利益"],"check":"","notes":[{"n":1,"label":"最判平17・3・10","case":"**最判平17・3・10**（民集59巻2号356頁）","gist":"占有権原の設定を受けた占有者についても、①客観的要件＋②占有権原の設定に競売手続妨害目的があれば、**抵当権に基づく妨害排除請求**ができる。所有者に適切な維持管理が期待できない場合は**直接自己への明渡し**を請求できる。**賃料相当損害金は否定**"}],"law":"","cites":[],"rate":0,"designed":true,"ref":false,"hash":"643b1850c3a4"},{"id":"民法/抵当権侵害_妨害排除請求#6","block":"第6〔（分離・搬出された動産）〕","kind":"cloze","masked":"抵当権の効力の及ぶ物が、設定者の⟦ア⟧を超えて分離された場合、抵当権者は、なお抵当不動産上にある分離物について、さらなる⟦イ⟧を求めることができる。⦅搬出された後についても、⟦ウ⟧に対してなお抵当権の効力を対抗できる限り、抵当権者は、抵当権に基づく妨害排除請求として、当該動産を⟦エ⟧を求めることができると解する⦆⟨1⟩。抵当権は非占有担保であるから、⟦オ⟧を求めることはできない。\n※⟦ウ⟧に対する対抗力の有無は争いがある（資料の〔補〕参照）。答案では立場を選んで一言で処理する。","body":"抵当権の効力の及ぶ物が、設定者の⟪通常の使用収益の範囲⟫を超えて分離された場合、抵当権者は、なお抵当不動産上にある分離物について、さらなる⟪分離・搬出の差止め⟫を求めることができる。⦅搬出された後についても、⟪搬出後の第三者⟫に対してなお抵当権の効力を対抗できる限り、抵当権者は、抵当権に基づく妨害排除請求として、当該動産を⟪元の備付場所に戻すこと⟫を求めることができると解する⦆⟨1⟩。抵当権は非占有担保であるから、⟪自己への引渡し⟫を求めることはできない。\n※搬出後の第三者に対する対抗力の有無は争いがある（資料の〔補〕参照）。答案では立場を選んで一言で処理する。","answers":["通常の使用収益の範囲","分離・搬出の差止め","搬出後の第三者","元の備付場所に戻すこと","自己への引渡し"],"check":"","notes":[{"n":1,"label":"最判昭57・3・12","case":"**最判昭57・3・12**（民集36巻3号349頁）","gist":"**工場抵当法2条**により抵当権の目的とされた動産が同意なく搬出された場合、第三者が即時取得しない限り、抵当権者は**元の備付場所に戻すこと**を求めることができる"}],"law":"","cites":[],"rate":0,"designed":true,"ref":false,"hash":"3a7335c2fe87"}],"setsurei":["AはBに融資し、B所有の甲建物に抵当権の設定を受け、その旨の登記を経由した。Bが弁済を怠ったのでAが競売を申し立てたところ、甲建物にはCが何らの権原もなく居座っており、内覧もできない状態のため最低売却価額を下げても買受申出人が現れない。AはCに対し、甲建物の明渡しを請求できるか。またAは、Cに対し占有期間中の賃料相当額の支払を請求できるか。","AはBに融資し、B所有の乙建物に抵当権の設定を受け、その旨の登記を経由した。その後Bは、役員の一部が共通するD社との間で、適正賃料の5分の1という低額の賃料・高額の敷金という条件で乙建物を賃貸し、Dに引き渡した。Aが競売を申し立てたが、Dの占有を理由に買受申出人が現れない。さらにDは、乙建物に備え付けられていたB所有の高額な空調設備一式を建物から搬出し、事情を知らないEに売却して引き渡した（Eには過失があるものとする）。 (1) AはDに対し、乙建物の明渡しを請求できるか。 (2) AはEに対し、空調設備について何を請求できるか。"],"full":"第1（原則）\n抵当権は、目的不動産の占有を設定者のもとに留めたまま、その⟪交換価値⟫を把握する⟪非占有担保⟫である（369条1項）。したがって抵当権者は、設定者が抵当不動産について行う使用収益に干渉することは⟪できない⟫のが原則である。\n\n第2（侵害の判断基準）\nもっとも、抵当権が非占有担保であることは、抵当権者が設定者の使用収益権能を妨げ得ないことを意味するにすぎず、占有の態様による⟪換価価値の低下⟫まで甘受すべきことを意味しない。そこで、⦅第三者の占有により、⟪競売手続の進行⟫が害され適正な価額よりも⟪売却価額が下落⟫するおそれがあるなど、抵当不動産の⟪交換価値の実現⟫が妨げられ、抵当権者の⟪優先弁済請求権の行使が困難⟫となるような状態があるときは、これを抵当権に対する侵害と評価することができると解する⦆⟨1⟩。この場合、抵当権者は、抵当権に基づく⟪妨害排除請求⟫として、当該状態の排除を求めることができる。\n\n第3（占有権原がある場合の加重）\nこれに対し、抵当権設定登記後に抵当不動産の所有者から⟪占有権原の設定⟫を受けて占有する者については、なお加重した要件を要すると解する。抵当権に対抗できない賃借人にすら買受けの時から⟪6か月の明渡猶予⟫が認められている以上（⟪395条1項⟫）、約定に従って占有しているにすぎない者を直ちに排除することはできないからである。すなわち、⦅その占有権原の設定に抵当権の実行としての⟪競売手続を妨害する目的⟫が認められ、かつ、その占有により⟪第2の客観的状態⟫があるときに限り、抵当権に基づく妨害排除請求ができると解する⦆⟨1⟩。\n\n第4（誰に明け渡させるか）\n抵当権者には占有権原がないから、明渡しは本来⟪所有者に対して⟫させるべきである。もっとも、⦅所有者において抵当権に対する侵害が生じないように抵当不動産を⟪適切に維持管理⟫することが⟪期待できない⟫場合には、抵当権者は、占有者に対し、⟪直接自己への明渡し⟫を求めることができると解する⦆⟨1⟩。この場合の占有は、所有者に代わって抵当不動産を維持管理することを目的とする⟪管理占有⟫にとどまり、使用収益を目的とするものではない。\n\n第5（損害賠償）\n他方、⦅抵当権者は、第三者の占有により⟪賃料額相当の損害⟫を被るものではない⦆⟨1⟩。抵当権者は抵当不動産を⟪自ら使用できず⟫、民事執行法上の手続によらずにその⟪使用による利益⟫を取得することもできないからである。\n\n第6（分離・搬出された動産）\n抵当権の効力の及ぶ物が、設定者の⟪通常の使用収益の範囲⟫を超えて分離された場合、抵当権者は、なお抵当不動産上にある分離物について、さらなる⟪分離・搬出の差止め⟫を求めることができる。⦅搬出された後についても、⟪搬出後の第三者⟫に対してなお抵当権の効力を対抗できる限り、抵当権者は、抵当権に基づく妨害排除請求として、当該動産を⟪元の備付場所に戻すこと⟫を求めることができると解する⦆⟨1⟩。抵当権は非占有担保であるから、⟪自己への引渡し⟫を求めることはできない。\n※搬出後の第三者に対する対抗力の有無は争いがある（資料の〔補〕参照）。答案では立場を選んで一言で処理する。","kata":"| # | 落としてはいけない要素 | キーワード |\n|---|---|---|\n| 1 | 原則＝非占有担保だから占有関係に干渉できない | 369条1項・「占有を移転しないで」 |\n| 2 | 例外の理由付け（非占有性は使用収益権能を妨げ得ない意味にすぎず、占有態様による換価価値の低下まで甘受する意味ではない） | 換価価値／受忍しない |\n| 3 | 客観的要件（2つでワンセット） | ①交換価値の実現が妨げられ ②優先弁済請求権の行使が困難 |\n| 4 | 不法占有者＝客観的要件のみ | — |\n| 5 | 占有権原あり＝＋主観的要件 | 占有権原の**設定**に競売手続を**妨害する目的** |\n| 6 | 加重の理由 | 395条1項・買受けの時から6か月の明渡猶予 |\n| 7 | 明渡先の原則と例外 | 原則＝所有者／例外＝適切な維持管理が期待できない場合に直接自己へ |\n| 8 | 明渡しを受けた占有の性質 | 管理占有・使用収益できない |\n| 9 | 賃料相当損害金は否定＋その理由 | 自ら使用できず、民事執行法上の手続によらずに使用利益を取得できない |\n| 10 | 搬出動産＝元の場所に戻せ（妨害排除）、自己へ渡せ（返還）ではない | 原状回復／非占有担保 |\n| 11 | 搬出**後**の第三者への対抗力には争いがあると留保できるか | 対抗力限定説／即時取得説 |\n\n- 〔主〕判例ルートのみが暗唱対象。〔副〕（要件②不要説）と〔補〕（搬出後の対抗力）は**「存在と決め手が言えれば可」**。\n- 判例の年月日・百選番号は暗唱対象外。\n\n**勝負どころ**\n1. **占有権原の有無で要件が変わる**ことに気づき、切り替えられるか（設例2(1)）。ここを外すと事案の中心を落とす。\n2. **主観的要件の対象は「占有」ではなく「占有権原の設定」**であること。「Dに妨害目的があった」ではなく「BD間の賃貸借契約の設定に妨害目的があった」と書く。\n3. **明渡しは通るが賃料相当損害金は通らない**という非対称を、理由（使用収益権限がない）とセットで書けるか。\n\n> ⚠️ **間違えやすい点**\n> - **「担保価値」の二義性**。占有で下がるのは物の客観的価値ではなく**換価価値**（競売で実現できる値打ち）。「Cが占有すると建物の値打ちが下がる」と書くと誤り。\n> - **妨害排除に担保割れ（被担保債権額との比較）は要らない**。見るのは「占有によって競売そのものが回るか」。担保余力が大きくても、買手がつかなければ要件を満たす。**損害賠償（価値毀損型）とは判断の対象が違う**（換価段階 vs 配当段階）。搬出動産についても、減価が被担保債権額を下回る必要はないとするのが大勢（百選Ⅰ〔第8版〕p.183）。\n> - **平11・11・24 が採用したのは代位構成**。「平11が抵当権に基づく妨害排除請求を認めた」と書くと不正確（傍論）。抵当権に基づく構成を正面から認めたのは平17。\n> - **占有権原がある場合に代位構成は使えない**（被代位権利が存在しない）。\n> - **昭57・3・12 は工場抵当法2条の事案**。「判例は民法上の抵当権について搬出動産の返還を認めた」と書くと言い過ぎ。\n> - **搬出動産は「自分に渡せ」ではなく「元の場所に戻せ」**。抵当権は非占有担保。\n> - **旧短期賃貸借（旧395条）を答案に書かない**。平成15年改正で廃止済み。現行395条は**明渡猶予**の規定である。\n\n---","hanrei":[["最判平3・3・22（民集45巻3号268頁）","抵当権者は占有関係に干渉する権原を有しないこと等を理由に、占有者に対する請求を**全面的に否定**していた","平11大法廷で変更。百選Ⅰ〔第8版〕p.180 解説1"],["**最大判平11・11・24**（民集53巻8号1899頁）","不法占有により交換価値の実現が妨げられ優先弁済請求権の行使が困難となる状態があれば抵当権侵害。**担保価値維持請求権を被保全債権とし、423条の法意により所有者の妨害排除請求権を代位行使**できる。抵当権に基づく妨害排除請求は**傍論**で言及","百選リストに掲載なし（民法百選）。講義 物権・担保物権法 p.319"],["**最判平17・3・10**（民集59巻2号356頁）","占有権原の設定を受けた占有者についても、①客観的要件＋②占有権原の設定に競売手続妨害目的があれば、**抵当権に基づく妨害排除請求**ができる。所有者に適切な維持管理が期待できない場合は**直接自己への明渡し**を請求できる。**賃料相当損害金は否定**","**百選Ⅰ〔第8版〕89番（＝〔第7版〕86番・〔第9版〕86番）**田髙寛貴解説"],["**最判昭57・3・12**（民集36巻3号349頁）","**工場抵当法2条**により抵当権の目的とされた動産が同意なく搬出された場合、第三者が即時取得しない限り、抵当権者は**元の備付場所に戻すこと**を求めることができる","**百選Ⅰ〔第8版〕90番（＝〔第7版〕87番・〔第9版〕87番）**青木則幸解説。工場抵当法5条が前提"],["最判平8・9・13（民集50巻8号2374頁）","賃貸借は正常型であっても抵当不動産の価値を減少させうる","百選Ⅰ〔第8版〕p.181 が**要件②を必要とする側の論拠**として引用（不要説の論拠ではない）"],["大判昭6・10・21","抵当権設定者が通常の使用収益の範囲を超えた場合、抵当権に基づく妨害排除請求が可能","アガルート総合講義-民法 p.161（設定者による侵害の項）"]],"field":"抵当権","order":19},{"name":"損害賠償の範囲_416条","subject":"民法","rank":"A","path":"まとめ/民法/論証/損害賠償の範囲_416条.md","cards":[{"id":"民法/損害賠償の範囲_416条#1","block":"第1〔416条の法意〕","kind":"cloze","masked":"損害賠償制度の趣旨は当事者間の公平な損害の分配にあるところ、事実的因果関係のある損害のすべてを賠償させるとすれば、債務者の責任は無限に拡大しかねない。そこで416条は、賠償されるべき損害を、当該債務不履行から生ずるのが⟦ア⟧といえる範囲に限定した規定であると解する。\nすなわち、同条1項は、通常の事情に基づき通常生ずべき損害（通常損害）を、⟦イ⟧賠償範囲に取り込んだものであり、同条2項は、特別の事情によって生じた損害（特別損害）については、当事者がその事情を⟦ウ⟧場合に限り、当該事情を⟦エ⟧に取り込み、賠償範囲に含める趣旨である。","body":"損害賠償制度の趣旨は当事者間の公平な損害の分配にあるところ、事実的因果関係のある損害のすべてを賠償させるとすれば、債務者の責任は無限に拡大しかねない。そこで416条は、賠償されるべき損害を、当該債務不履行から生ずるのが⟪相当⟫といえる範囲に限定した規定であると解する。\nすなわち、同条1項は、通常の事情に基づき通常生ずべき損害（通常損害）を、⟪予見可能性を問うことなく⟫賠償範囲に取り込んだものであり、同条2項は、特別の事情によって生じた損害（特別損害）については、当事者がその事情を⟪予見すべきであった⟫場合に限り、当該事情を⟪相当性判断の基礎⟫に取り込み、賠償範囲に含める趣旨である。","answers":["相当","予見可能性を問うことなく","予見すべきであった","相当性判断の基礎"],"check":"1 ／ ①公平な損害の分配／責任の無限拡大の防止 ②416条＝相当な範囲への限定 ③**1項＝通常損害・予見可能性不要** ④**2項＝特別損害・予見すべきであった場合のみ** ⑤2項が取り込むのは**相当性判断の基礎となる「事情」**（予見できた事情から出た損害が何でも入るのではない） ／ ③④の項ズレは致命的（1項と2項を取り違えたら −2）。⑤が飛んだら −1","notes":[],"law":"","cites":["民法/416"],"rate":11,"designed":true,"ref":false,"hash":"2032c8617b39"},{"id":"民法/損害賠償の範囲_416条#2","block":"第2〔通常損害と特別損害の振り分け〕","kind":"cloze","masked":"ある損害が1項の⟦イ⟧にあたるか2項の⟦ウ⟧にあたるかは、当該契約の類型、当事者の職業、目的物の性質、契約の目的、取引慣行等に照らし、その種の契約において⟦ア⟧から生じた損害といえるかによって決すべきである。\n⟦ア⟧から生じた損害であれば⟦イ⟧として当然に賠償範囲に入り、そうでなければ⟦ウ⟧として⟦エ⟧を要する。","body":"ある損害が1項の通常損害にあたるか2項の特別損害にあたるかは、当該契約の類型、当事者の職業、目的物の性質、契約の目的、取引慣行等に照らし、その種の契約において⟪定型的に予定される事態⟫から生じた損害といえるかによって決すべきである。\n定型的に予定される事態から生じた損害であれば⟪通常損害⟫として当然に賠償範囲に入り、そうでなければ⟪特別損害⟫として⟪予見可能性の審査⟫を要する。","answers":["定型的に予定される事態","通常損害","特別損害","予見可能性の審査"],"check":"2 ／ ①契約類型・当事者の職業・目的物の性質・契約の目的 ②**「定型的に予定される事態」から生じた損害か** ／ 基準を出さず結論だけなら −1","notes":[],"law":"","cites":[],"rate":0,"designed":true,"ref":false,"hash":"8c0d4330ef86"},{"id":"民法/損害賠償の範囲_416条#3","block":"第3〔予見の主体・時期・対象〕","kind":"cloze","masked":"⦅416条2項の「当事者」とは⟦ア⟧をいい、予見の有無は債務の履行期まで、すなわち⟦イ⟧を基準として判断する。また、予見の対象は損害そのものではなく特別の「⟦ウ⟧」である⦆⟨1⟩。\nなぜなら、特別の事情を予見したのであればそこから損害が生ずることも予知しうるのであって、これを予知しながら履行せず、または履行を不能にした債務者に当該損害を賠償させても酷とはいえないからである。\nなお、「予見すべきであった」とは、現に予見しえたかという事実の問題ではなく、当該契約に照らしてその事情を予見すべきであったといえるかという⟦エ⟧をいう。","body":"⦅416条2項の「当事者」とは⟪債務者⟫をいい、予見の有無は債務の履行期まで、すなわち⟪債務不履行の時⟫を基準として判断する。また、予見の対象は損害そのものではなく特別の「⟪事情⟫」である⦆⟨1⟩。\nなぜなら、特別の事情を予見したのであればそこから損害が生ずることも予知しうるのであって、これを予知しながら履行せず、または履行を不能にした債務者に当該損害を賠償させても酷とはいえないからである。\nなお、「予見すべきであった」とは、現に予見しえたかという事実の問題ではなく、当該契約に照らしてその事情を予見すべきであったといえるかという⟪規範的評価⟫をいう。","answers":["債務者","債務不履行の時","事情","規範的評価"],"check":"3 ／ ①主体＝**債務者** ②時期＝**履行期まで＝債務不履行時** ③対象＝特別の**「事情」**（損害ではない） ④理由＝予知しながら履行しない債務者に賠償させても酷でない ⑤「予見すべきであった」＝**規範的評価** ／ **3つ（主体・時期・対象）のうち1つでも欠けたら合格ラインを割る**。ここが本論点の核","notes":[{"n":1,"label":"大判大正7・8・27","case":"大判大正7・8・27 民録24輯1658頁","gist":"416条2項の予見の**主体＝債務者**、**時期＝債務の履行期まで（＝債務不履行時）**、**対象＝特別の「事情」**。理由は、予知しながら履行しなかった債務者に賠償させても過酷ではないから"}],"law":"","cites":["民法/416"],"rate":6,"designed":true,"ref":false,"hash":"4e4465bafc49"},{"id":"民法/損害賠償の範囲_416条#4","block":"第4〔履行不能の場合の損害額の算定〕","kind":"cloze","masked":"⦅目的物の引渡債務が履行不能となった場合、履行に代わる損害賠償の額は、原則として⟦ア⟧による⦆⟨1⟩（1項）。\nもっとも、債務者が目的物を⟦イ⟧したために債務が履行不能となった後もその目的物の⟦ウ⟧という特別の事情があり、かつ、債務者が履行を不能にした際にその事情を知りまたは知ることができたときは、債権者は、⟦エ⟧を基準として算定した損害の賠償を請求することができる（2項）。⦅この場合、債権者が目的物を他に処分したであろうと予想されたことは必要でなく⦆⟨2⟩、⦅債権者が目的物を自己の使用に供する目的で取得していたときも同様である⦆⟨3⟩。債務不履行がなければ、債権者は騰貴した価格のある目的物を現に保有しえたはずだからである。\n⦅これに対し、価格がいったん騰貴した後に下落した場合において、その中間の最高価格を基準とするためには、債権者がその時点で転売その他の方法により当該価格に相当する利益を⟦オ⟧という事情についてまで、債務者が予見すべきであったことを要する⦆⟨4⟩。","body":"⦅目的物の引渡債務が履行不能となった場合、履行に代わる損害賠償の額は、原則として⟪履行不能時の目的物の価格⟫による⦆⟨1⟩（1項）。\nもっとも、債務者が目的物を⟪不法に処分⟫したために債務が履行不能となった後もその目的物の⟪価格が騰貴を続けている⟫という特別の事情があり、かつ、債務者が履行を不能にした際にその事情を知りまたは知ることができたときは、債権者は、⟪騰貴した現在の価格⟫を基準として算定した損害の賠償を請求することができる（2項）。⦅この場合、債権者が目的物を他に処分したであろうと予想されたことは必要でなく⦆⟨2⟩、⦅債権者が目的物を自己の使用に供する目的で取得していたときも同様である⦆⟨3⟩。債務不履行がなければ、債権者は騰貴した価格のある目的物を現に保有しえたはずだからである。\n⦅これに対し、価格がいったん騰貴した後に下落した場合において、その中間の最高価格を基準とするためには、債権者がその時点で転売その他の方法により当該価格に相当する利益を⟪確実に取得したであろう⟫という事情についてまで、債務者が予見すべきであったことを要する⦆⟨4⟩。","answers":["履行不能時の目的物の価格","不法に処分","価格が騰貴を続けている","騰貴した現在の価格","確実に取得したであろう"],"check":"4 ／ ①原則＝**履行不能時の価格（1項）** ②騰貴継続＋**履行不能時**の債務者の予見可能性→**現在の価格（2項）** ③**他に処分する予定は不要／自己使用目的でも同じ** ④理由＝騰貴した価格の物を**現に保有しえたはず** ⑤中間最高価格→**確実に利益を取得したであろう**ことの予見可能性が必要 ／ ③⑤のどちらかが飛んだら −1（③は昭47判決、⑤は富喜丸の核）","notes":[{"n":1,"label":"最判昭和37・11・16","case":"最判昭和37・11・16 民集16巻11号2280頁","gist":"①填補賠償額は**履行不能時の時価**が原則 ②価格が騰貴しつつあるという特別事情を債務者が**履行不能時**に知りまたは知りえたときは**現在の時価**による ③「現在において債権者がこれを他に処分するであろうと予想されたこと」は**不要**"},{"n":2,"label":"最判昭和37・11・16","case":"最判昭和37・11・16 民集16巻11号2280頁","gist":"①填補賠償額は**履行不能時の時価**が原則 ②価格が騰貴しつつあるという特別事情を債務者が**履行不能時**に知りまたは知りえたときは**現在の時価**による ③「現在において債権者がこれを他に処分するであろうと予想されたこと」は**不要**"},{"n":3,"label":"最判昭和47・4・20","case":"最判昭和47・4・20 民集26巻3号520頁","gist":"上記昭和37年判決の法理は、**買主が転売目的ではなく自己の使用に供する目的で**買った場合にも妥当する。「債務不履行がなければ、騰貴した価格のあるその不動産を現に保有しえたはず」だから"},{"n":4,"label":"大連判大正15・5・22","case":"大連判大正15・5・22 民集5巻386頁〔**富喜丸事件**〕","gist":"①原則として責任原因発生時（滅失時）の交換価格 ②中間最高価格を請求するには、騰貴時に転売等により**その価格相当の利益を確実に取得した**という特別の事情の予見可能性を要する ③416条は相当因果関係を定めたもので、**不法行為にも類推適用**される"}],"law":"","cites":[],"rate":0,"designed":true,"ref":false,"hash":"14d7b6f938a5"},{"id":"民法/損害賠償の範囲_416条#5","block":"第5〔不法行為への類推〕","kind":"cloze","masked":"⦅不法行為に基づく損害賠償の範囲についても416条が⟦ア⟧され、特別の事情によって生じた損害は、加害者が⟦イ⟧にその事情を予見すべきであった場合に限り、賠償の対象となる⦆⟨1⟩。","body":"⦅不法行為に基づく損害賠償の範囲についても416条が⟪類推適用⟫され、特別の事情によって生じた損害は、加害者が⟪不法行為の時⟫にその事情を予見すべきであった場合に限り、賠償の対象となる⦆⟨1⟩。","answers":["類推適用","不法行為の時"],"check":"5 ／ ①416条の**類推適用** ②予見時期＝**不法行為の時** ／ 「類推」を「適用」と書いたら −1（条文の直接適用ではない）","notes":[{"n":1,"label":"最判昭和48・6・7","case":"最判昭和48・6・7 民集27巻6号681頁","gist":"**不法行為による損害賠償にも416条が類推適用**され、特別事情による損害は加害者がその事情を予見しまたは予見しえたときに限り賠償の対象となる"}],"law":"","cites":["民法/416"],"rate":26,"designed":true,"ref":false,"hash":"5745ed798f28"}],"setsurei":["4月1日、金属加工業を営むAは、機械メーカーBから工作機械甲を代金1000万円で買い受けた。Aは甲を自社工場で使用するつもりであり、契約時にその旨をBに伝えていた。引渡期日は6月30日と定められた。 ところが5月1日、甲と同型の機械が世界的に品薄となり、これを緊急に必要としたCが、**甲の市場価格1000万円の3倍にあたる3000万円**でAから買い取りたいと持ちかけてきた。AはCとの間で甲を3000万円で転売する契約を締結し、同日、Bに対し「甲はCに3000万円で転売するので、引渡期日を必ず守ってほしい」と書面で通知した。 Bは甲を他に処分してしまい、6月30日、Aに対する引渡債務は履行不能となった。AはBに対し、転売により得られたはずの利益2000万円の賠償を請求できるか。","Aは、自らの住居として使用する目的で、Bから、B所有の甲土地・乙建物を代金2000万円で買い受け、代金全額を支払った。登記名義はB名義のままであった。 その後Bは、甲乙をCに売却して所有権移転登記を了し、AへのB の所有権移転義務は履行不能となった。履行不能時の甲乙の時価は2100万円であった。ところがその後、近隣に新駅が開業して交通の便が格段に改善されたため、甲乙の価格は騰貴を続け、事実審の口頭弁論終結時には4200万円となっている。 (1) Aは、4200万円を基準として算定した損害の賠償を請求できるか。Aに転売の意思がなかったことは結論に影響するか。 (2) 仮に、甲乙の価格が一度4200万円まで騰貴した後に下落し、口頭弁論終結時には3000万円になっていた場合はどうか。"],"full":"損害賠償制度の趣旨は当事者間の公平な損害の分配にあるところ、事実的因果関係のある損害のすべてを賠償させるとすれば、債務者の責任は無限に拡大しかねない。そこで416条は、賠償されるべき損害を、当該債務不履行から生ずるのが⟪相当⟫といえる範囲に限定した規定であると解する。\nすなわち、同条1項は、通常の事情に基づき通常生ずべき損害（通常損害）を、⟪予見可能性を問うことなく⟫賠償範囲に取り込んだものであり、同条2項は、特別の事情によって生じた損害（特別損害）については、当事者がその事情を⟪予見すべきであった⟫場合に限り、当該事情を⟪相当性判断の基礎⟫に取り込み、賠償範囲に含める趣旨である。\n\nある損害が1項の通常損害にあたるか2項の特別損害にあたるかは、当該契約の類型、当事者の職業、目的物の性質、契約の目的、取引慣行等に照らし、その種の契約において⟪定型的に予定される事態⟫から生じた損害といえるかによって決すべきである。\n定型的に予定される事態から生じた損害であれば⟪通常損害⟫として当然に賠償範囲に入り、そうでなければ⟪特別損害⟫として⟪予見可能性の審査⟫を要する。\n\n⦅416条2項の「当事者」とは⟪債務者⟫をいい、予見の有無は債務の履行期まで、すなわち⟪債務不履行の時⟫を基準として判断する。また、予見の対象は損害そのものではなく特別の「⟪事情⟫」である⦆⟨1⟩。\nなぜなら、特別の事情を予見したのであればそこから損害が生ずることも予知しうるのであって、これを予知しながら履行せず、または履行を不能にした債務者に当該損害を賠償させても酷とはいえないからである。\nなお、「予見すべきであった」とは、現に予見しえたかという事実の問題ではなく、当該契約に照らしてその事情を予見すべきであったといえるかという⟪規範的評価⟫をいう。\n\n⦅目的物の引渡債務が履行不能となった場合、履行に代わる損害賠償の額は、原則として⟪履行不能時の目的物の価格⟫による⦆⟨1⟩（1項）。\nもっとも、債務者が目的物を⟪不法に処分⟫したために債務が履行不能となった後もその目的物の⟪価格が騰貴を続けている⟫という特別の事情があり、かつ、債務者が履行を不能にした際にその事情を知りまたは知ることができたときは、債権者は、⟪騰貴した現在の価格⟫を基準として算定した損害の賠償を請求することができる（2項）。⦅この場合、債権者が目的物を他に処分したであろうと予想されたことは必要でなく⦆⟨2⟩、⦅債権者が目的物を自己の使用に供する目的で取得していたときも同様である⦆⟨3⟩。債務不履行がなければ、債権者は騰貴した価格のある目的物を現に保有しえたはずだからである。\n⦅これに対し、価格がいったん騰貴した後に下落した場合において、その中間の最高価格を基準とするためには、債権者がその時点で転売その他の方法により当該価格に相当する利益を⟪確実に取得したであろう⟫という事情についてまで、債務者が予見すべきであったことを要する⦆⟨4⟩。\n\n⦅不法行為に基づく損害賠償の範囲についても416条が⟪類推適用⟫され、特別の事情によって生じた損害は、加害者が⟪不法行為の時⟫にその事情を予見すべきであった場合に限り、賠償の対象となる⦆⟨1⟩。","kata":"","hanrei":[["大判大正7・8・27 民録24輯1658頁","416条2項の予見の**主体＝債務者**、**時期＝債務の履行期まで（＝債務不履行時）**、**対象＝特別の「事情」**。理由は、予知しながら履行しなかった債務者に賠償させても過酷ではないから","**民法判例百選Ⅱ 債権〔第9版〕7番**（第8版7番・紙面p.16／解説：難波譲治）。マッチの売買で戦乱により価格騰貴した事案。**故意の不履行の事例であり射程を限定する余地がある**（同解説1）"],["大連判大正15・5・22 民集5巻386頁〔**富喜丸事件**〕","①原則として責任原因発生時（滅失時）の交換価格 ②中間最高価格を請求するには、騰貴時に転売等により**その価格相当の利益を確実に取得した**という特別の事情の予見可能性を要する ③416条は相当因果関係を定めたもので、**不法行為にも類推適用**される","**不法行為の事案**（船舶衝突）。百選Ⅱ第9版8番 解説では「大連中間判」と表記。**なお、この判決を基準時問題とは無関係とみる見解が有力化しつつある**（同解説2(1)）"],["最判昭和37・11・16 民集16巻11号2280頁","①填補賠償額は**履行不能時の時価**が原則 ②価格が騰貴しつつあるという特別事情を債務者が**履行不能時**に知りまたは知りえたときは**現在の時価**による ③「現在において債権者がこれを他に処分するであろうと予想されたこと」は**不要**","百選リストに**掲載なし**（grep 確認済み）。事案は、百選Ⅱ第9版8番 解説によれば**買戻特約付きで売却された不動産を買主が第三者に譲渡したため買戻特約上の債務が履行不能となった**もの。⚠️ **プラクティス p.159 は同判決の事案を「売主が目的物を第三者に売却して履行不能になったケース」と説明しており、百選の説明と食い違う**（下記「訂正履歴」の注記参照）"],["最判昭和47・4・20 民集26巻3号520頁","上記昭和37年判決の法理は、**買主が転売目的ではなく自己の使用に供する目的で**買った場合にも妥当する。「債務不履行がなければ、騰貴した価格のあるその不動産を現に保有しえたはず」だから","**民法判例百選Ⅱ 債権〔第9版〕8番**（紙面p.18／解説：坂口甲）＝**第8版9番**（紙面p.20／解説：久保宏之）。**騰貴分＝転売利益という富喜丸の連結を切り、現有価値（保有利益）と位置づけた**点に意義。2020年改正後も妥当する（同解説2(1)）"],["最判昭和48・6・7 民集27巻6号681頁","**不法行為による損害賠償にも416条が類推適用**され、特別事情による損害は加害者がその事情を予見しまたは予見しえたときに限り賠償の対象となる","**民法判例百選Ⅱ 債権〔第9版〕89番**（紙面p.180／解説：前田陽一）＝**第8版98番**（紙面p.198／解説：前田陽一）。**大隅健一郎裁判官の反対意見**あり（類推適用否定）。予見時期は不法行為の時"],["最判昭和40・4・16 集民78号615頁","株券返還債務の履行不能による損害について、予見時期を「**債務不履行の時**を標準として判断するのが相当」とした","百選Ⅱ第9版7番 解説1が引用（「とくに根拠は示されていない」との評）"],["最判昭和28・12・18 民集7巻12号1446頁","契約解除の場合の損害額算定は**解除時**を基準とする","**民法判例百選Ⅱ 債権〔第8版〕8番**（紙面p.18）。**第9版では収録から外れている**（第9版8番は昭47・4・20に差し替わった。⚠️ `判例百選_版対応表.md` は「第8版8番→第9版50番」と対応させているが、**これは同じ日付の別事件〔第9版50番＝第三者による賃借物の占有と妨害排除〕との取り違えとみられる**。年月日でのgrep結果に基づく注記）。**両請求権の併存を否定した部分は2020年改正で退けられ、その限りで先例的価値を失った**（第9版8番 解説2(2)）"],["最判平成21・1・19 民集63巻1号97頁","416条1項の「通常生ずべき損害」の解釈において、**債権者が損害を回避・軽減する措置をとることができた場合**にそれを考慮して賠償責任を一定範囲で制限しうる","**民法判例百選Ⅱ 債権〔第9版〕6番**（第8版6番・賃貸人修繕義務不履行と賃借人の損害回避減少措置）。**損害軽減義務は本論証のスコープ外だが、条文上は416条1項の解釈問題として現れる**点に注意（新 プリメール民法3 p.98）"]],"field":"債務不履行・損害賠償","order":25},{"name":"損害賠償の範囲_416条_契約責任説","subject":"民法","rank":"A","path":"まとめ/民法/論証/損害賠償の範囲_416条_契約責任説.md","cards":[{"id":"民法/損害賠償の範囲_416条_契約責任説#1","block":"第1〔416条の法意 ― 契約責任的構成〕","kind":"cloze","masked":"債務不履行に基づく損害賠償責任の根拠は、債務者の過失ではなく⟦ア⟧にある。契約当事者は、契約を締結することによって、不履行の際に債権者に生ずる損失を予測し、これを両者の間に⟦イ⟧しているのであって、賠償されるべき損害は、当該契約に照らして⟦ウ⟧損害に限られる（⟦エ⟧の原則）。\nそこで416条は、事実的因果関係の認められる損害のうち、いずれが契約規範によって保護された利益に対応するものとして債務者に負担させられるべきかという、⟦オ⟧の確定を定めた規定であると解する。","body":"債務不履行に基づく損害賠償責任の根拠は、債務者の過失ではなく⟪契約の拘束力⟫にある。契約当事者は、契約を締結することによって、不履行の際に債権者に生ずる損失を予測し、これを両者の間に⟪分配⟫しているのであって、賠償されるべき損害は、当該契約に照らして⟪債務者に分配された⟫損害に限られる（⟪制限賠償⟫の原則）。\nそこで416条は、事実的因果関係の認められる損害のうち、いずれが契約規範によって保護された利益に対応するものとして債務者に負担させられるべきかという、⟪保護範囲⟫の確定を定めた規定であると解する。","answers":["契約の拘束力","分配","債務者に分配された","制限賠償","保護範囲"],"check":"1 ／ ①責任の根拠＝**契約の拘束力**（過失ではない） ②契約による**損害リスクの分配** ③**制限賠償**の原則 ④416条＝**保護範囲**を定めた規定 ／ ①か④が飛んだら、判例ルートとの違いが出ないので −2","notes":[],"law":"","cites":["民法/416"],"rate":2,"designed":true,"ref":false,"hash":"4ec51a72343c"},{"id":"民法/損害賠償の範囲_416条_契約責任説#2","block":"第2〔三段階の切り分け〕","kind":"cloze","masked":"賠償されるべき損害の確定は、次の三段階に区別すべきである。すなわち、(1)債務不履行と損害との間の⟦ア⟧（「あれなければこれなし」により判断される、過去の事実の復元としての⟦イ⟧の問題）、(2)そのうちいずれが契約規範の⟦ウ⟧に入るかという⟦エ⟧、(3)損害の⟦オ⟧、である。\n「相当因果関係」の一語でこれらを一括するのは、⟦カ⟧させるものであって相当でない。したがって、目的物の⟦キ⟧は、予見の対象たる「事情」の問題ではなく、(3)の⟦ク⟧の問題として別に扱うべきことになる。","body":"賠償されるべき損害の確定は、次の三段階に区別すべきである。すなわち、(1)債務不履行と損害との間の⟪事実的因果関係⟫（「あれなければこれなし」により判断される、過去の事実の復元としての⟪事実認定⟫の問題）、(2)そのうちいずれが契約規範の⟪保護範囲⟫に入るかという⟪規範的価値判断⟫、(3)損害の⟪金銭的評価⟫、である。\n「相当因果関係」の一語でこれらを一括するのは、⟪異質な作業を混在⟫させるものであって相当でない。したがって、目的物の⟪価格の変動⟫は、予見の対象たる「事情」の問題ではなく、(3)の⟪算定の基準時⟫の問題として別に扱うべきことになる。","answers":["事実的因果関係","事実認定","保護範囲","規範的価値判断","金銭的評価","異質な作業を混在","価格の変動","算定の基準時"],"check":"2 ／ ①**事実的因果関係**（事実認定・あれなければこれなし） ②**保護範囲**（規範的価値判断） ③**金銭的評価** ④相当因果関係は**異質な作業の混在** ⑤**価格変動は(3)の問題** ／ ①〜③のどれか1つでも欠けたら合格ラインを割る。⑤は −1","notes":[],"law":"","cites":[],"rate":0,"designed":true,"ref":false,"hash":"f510d61a8e5a"},{"id":"民法/損害賠償の範囲_416条_契約責任説#3","block":"第3〔保護範囲の確定基準〕","kind":"cloze","masked":"ある損害が保護範囲に入るかは、当該契約規範の⟦ア⟧に即して個別に判断すべきであり、その際、契約当事者の⟦イ⟧、契約対象の種類、⟦ウ⟧、⟦エ⟧等を考慮した規範的価値判断によるべきである。\nそして、416条1項は、当該契約類型において⟦オ⟧といえる損害を、2項は、⟦カ⟧による損害につき、その事情を⟦キ⟧場合に限って債務者にリスクが分配されることを、それぞれ定めたものと解される。","body":"ある損害が保護範囲に入るかは、当該契約規範の⟪目的⟫に即して個別に判断すべきであり、その際、契約当事者の⟪職業⟫、契約対象の種類、⟪契約の目的⟫、⟪取引慣行⟫等を考慮した規範的価値判断によるべきである。\nそして、416条1項は、当該契約類型において⟪当然に分配されている⟫といえる損害を、2項は、⟪特別の事情⟫による損害につき、その事情を⟪予見すべきであった⟫場合に限って債務者にリスクが分配されることを、それぞれ定めたものと解される。","answers":["目的","職業","契約の目的","取引慣行","当然に分配されている","特別の事情","予見すべきであった"],"check":"3 ／ ①契約規範の**目的**に即した個別判断 ②**職業・契約の目的・取引慣行** ③1項＝当該契約類型で**当然に分配されている**損害／2項＝**特別の事情**を**予見すべきであった**場合 ／ ②の考慮要素が1つも出なければ −1","notes":[],"law":"","cites":["民法/416"],"rate":6,"designed":true,"ref":false,"hash":"7f87704620ff"},{"id":"民法/損害賠償の範囲_416条_契約責任説#4","block":"第4〔予見の主体・時期〕","kind":"cloze","masked":"もっとも、賠償されるべき損害を⟦ア⟧に予見すべきであったものに限らなければならない必然性はない。契約を締結して契約利益の実現を保障した以上、債務者は、契約締結後も、債権者のもとで契約利益が実現されるよう契約を尊重して⟦イ⟧すべきだからである（1条2項）。そうである以上、⟦ア⟧から不履行時までに予見すべきであった事情に由来するリスクを、債務不履行をした債務者ではなく⟦ウ⟧に負担させるのは適切でない。\nしたがって、予見の主体は⟦エ⟧、予見の時期は⟦オ⟧と解する。","body":"もっとも、賠償されるべき損害を⟪契約締結時⟫に予見すべきであったものに限らなければならない必然性はない。契約を締結して契約利益の実現を保障した以上、債務者は、契約締結後も、債権者のもとで契約利益が実現されるよう契約を尊重して⟪誠実に行動⟫すべきだからである（1条2項）。そうである以上、契約締結時から不履行時までに予見すべきであった事情に由来するリスクを、債務不履行をした債務者ではなく⟪債権者⟫に負担させるのは適切でない。\nしたがって、予見の主体は⟪債務者⟫、予見の時期は⟪債務不履行時⟫と解する。","answers":["契約締結時","誠実に行動","債権者","債務者","債務不履行時"],"check":"4 ／ ①契約時に限る**必然性はない** ②理由＝**1条2項の誠実行動義務**（契約締結後も契約利益の実現に向けて） ③リスクを**債権者に負担させるのは適切でない** ④主体＝**債務者** ⑤時期＝**債務不履行時** ／ **④⑤が出なければこの論証は失敗**（契約時説に流れると判例と結論が割れる）。②が飛んだら −1","notes":[],"law":"","cites":["民法/1"],"rate":0,"designed":true,"ref":false,"hash":"69dd825b38ab"},{"id":"民法/損害賠償の範囲_416条_契約責任説#5","block":"第5〔不法行為への類推の否定〕","kind":"cloze","masked":"416条は⟦ア⟧による損害リスクの分配を定めた規定であるから、契約関係にない者の間で突発する不法行為責任には⟦イ⟧（⦅判例は416条の類推適用を認める⦆⟨1⟩）。過失による不法行為においては損害の予見可能性を問題とする意味に乏しく、なお類推すれば通常損害や予見可能性を⟦ウ⟧せざるをえなくなるからである。\n不法行為において賠償されるべき損害の範囲は、故意による場合は原則として⟦エ⟧、過失による場合は過失の評価規範としての⟦オ⟧内にある損害と解すべきである（⟦カ⟧説）。","body":"416条は⟪契約規範⟫による損害リスクの分配を定めた規定であるから、契約関係にない者の間で突発する不法行為責任には⟪類推適用されない⟫（⦅判例は416条の類推適用を認める⦆⟨1⟩）。過失による不法行為においては損害の予見可能性を問題とする意味に乏しく、なお類推すれば通常損害や予見可能性を⟪擬制⟫せざるをえなくなるからである。\n不法行為において賠償されるべき損害の範囲は、故意による場合は原則として⟪全損害⟫、過失による場合は過失の評価規範としての⟪損害回避義務の射程⟫内にある損害と解すべきである（⟪義務射程⟫説）。","answers":["契約規範","類推適用されない","擬制","全損害","損害回避義務の射程","義務射程"],"check":"5 ／ ①416条は**類推適用しない** ②理由＝過失不法行為では予見可能性を問う意味に乏しく**擬制**を強いる ③故意＝**全損害**／過失＝**損害回避義務の射程**（**義務射程説**） ／ ①が逆になったら −2（判例ルートと同じになってしまう）","notes":[{"n":1,"label":"最判昭和48・6・7","case":"最判昭和48・6・7 民集27巻6号681頁","gist":"**不法行為による損害賠償にも416条が類推適用**され、特別事情による損害は加害者がその事情を予見しまたは予見しえたときに限り賠償の対象となる"}],"law":"","cites":["民法/416"],"rate":2,"designed":true,"ref":false,"hash":"fa6674b3f0f7"}],"setsurei":["4月1日、金属加工業を営むAは、機械メーカーBから工作機械甲を代金1000万円で買い受けた。Aは甲を自社工場で使用するつもりであり、契約時にその旨をBに伝えていた。引渡期日は6月30日と定められた。 ところが5月1日、甲と同型の機械が世界的に品薄となり、これを緊急に必要としたCが、**甲の市場価格1000万円の3倍にあたる3000万円**でAから買い取りたいと持ちかけてきた。AはCとの間で甲を3000万円で転売する契約を締結し、同日、Bに対し「甲はCに3000万円で転売するので、引渡期日を必ず守ってほしい」と書面で通知した。 Bは甲を他に処分してしまい、6月30日、Aに対する引渡債務は履行不能となった。**416条を契約責任的根拠から説明する立場に立って**、AがBに対し転売により得られたはずの利益2000万円の賠償を請求できるかを論ぜよ。","Aは、絵画甲（時価500万円）を所有し、自宅に飾っていた。**Aとは何の取引関係もない**運送業者Bの従業員が、別の顧客の荷物を運搬中、過失により運送車両をA宅に衝突させ、甲を毀損した。甲は修復不能となり滅失した。その後、甲の作者が世界的に再評価されたため、同種の作品の市場価格は騰貴を続け、事実審の口頭弁論終結時における甲の評価額は1500万円となっている。 (1) AがBに対し不法行為に基づく損害賠償を請求する場合、賠償範囲の画し方について、416条を類推適用すべきか。 (2) Aが1500万円を請求できるかは、416条2項の予見可能性の問題として扱うべきか。"],"full":"債務不履行に基づく損害賠償責任の根拠は、債務者の過失ではなく⟪契約の拘束力⟫にある。契約当事者は、契約を締結することによって、不履行の際に債権者に生ずる損失を予測し、これを両者の間に⟪分配⟫しているのであって、賠償されるべき損害は、当該契約に照らして⟪債務者に分配された⟫損害に限られる（⟪制限賠償⟫の原則）。\nそこで416条は、事実的因果関係の認められる損害のうち、いずれが契約規範によって保護された利益に対応するものとして債務者に負担させられるべきかという、⟪保護範囲⟫の確定を定めた規定であると解する。\n\n賠償されるべき損害の確定は、次の三段階に区別すべきである。すなわち、(1)債務不履行と損害との間の⟪事実的因果関係⟫（「あれなければこれなし」により判断される、過去の事実の復元としての⟪事実認定⟫の問題）、(2)そのうちいずれが契約規範の⟪保護範囲⟫に入るかという⟪規範的価値判断⟫、(3)損害の⟪金銭的評価⟫、である。\n「相当因果関係」の一語でこれらを一括するのは、⟪異質な作業を混在⟫させるものであって相当でない。したがって、目的物の⟪価格の変動⟫は、予見の対象たる「事情」の問題ではなく、(3)の⟪算定の基準時⟫の問題として別に扱うべきことになる。\n\nある損害が保護範囲に入るかは、当該契約規範の⟪目的⟫に即して個別に判断すべきであり、その際、契約当事者の⟪職業⟫、契約対象の種類、⟪契約の目的⟫、⟪取引慣行⟫等を考慮した規範的価値判断によるべきである。\nそして、416条1項は、当該契約類型において⟪当然に分配されている⟫といえる損害を、2項は、⟪特別の事情⟫による損害につき、その事情を⟪予見すべきであった⟫場合に限って債務者にリスクが分配されることを、それぞれ定めたものと解される。\n\nもっとも、賠償されるべき損害を⟪契約締結時⟫に予見すべきであったものに限らなければならない必然性はない。契約を締結して契約利益の実現を保障した以上、債務者は、契約締結後も、債権者のもとで契約利益が実現されるよう契約を尊重して⟪誠実に行動⟫すべきだからである（1条2項）。そうである以上、契約締結時から不履行時までに予見すべきであった事情に由来するリスクを、債務不履行をした債務者ではなく⟪債権者⟫に負担させるのは適切でない。\nしたがって、予見の主体は⟪債務者⟫、予見の時期は⟪債務不履行時⟫と解する。\n\n416条は⟪契約規範⟫による損害リスクの分配を定めた規定であるから、契約関係にない者の間で突発する不法行為責任には⟪類推適用されない⟫（⦅判例は416条の類推適用を認める⦆⟨1⟩）。過失による不法行為においては損害の予見可能性を問題とする意味に乏しく、なお類推すれば通常損害や予見可能性を⟪擬制⟫せざるをえなくなるからである。\n不法行為において賠償されるべき損害の範囲は、故意による場合は原則として⟪全損害⟫、過失による場合は過失の評価規範としての⟪損害回避義務の射程⟫内にある損害と解すべきである（⟪義務射程⟫説）。","kata":"","hanrei":[["大判大正7・8・27 民録24輯1658頁","416条2項の予見の**主体＝債務者**、**時期＝債務の履行期まで（＝債務不履行時）**、**対象＝特別の「事情」**","**民法判例百選Ⅱ 債権〔第9版〕7番**（第8版7番・紙面p.16／解説：難波譲治）。**結論（不履行時）は本論証と一致するが、判例の理由付けは相当因果関係説**。解説6は「もはや相当因果関係説によって本判決を基礎付けることはできない」とする"],["大連判大正15・5・22 民集5巻386頁〔**富喜丸事件**〕","416条は相当因果関係を定めたもので、**不法行為にも類推適用**される。中間最高価格を請求するには、騰貴時にその価格相当の利益を確実に取得したという特別事情の予見可能性を要する","**不法行為の事案**（船舶衝突）。**本論証は類推適用を否定するので、この判例と正面から対立する**。百選収録は確認できず（grep 済み）"],["最判昭和48・6・7 民集27巻6号681頁","**不法行為による損害賠償にも416条が類推適用**され、特別事情による損害は加害者がその事情を予見しまたは予見しえたときに限り賠償の対象となる","**民法判例百選Ⅱ 債権〔第9版〕89番**（紙面p.180／解説：前田陽一）＝**第8版98番**（紙面p.198／解説：前田陽一）。**大隅健一郎裁判官の反対意見**が類推適用を否定しており、学説の批判（義務射程説）と方向を同じくする"],["最判昭和47・4・20 民集26巻3号520頁","履行不能後の価格騰貴について、買主が自己使用目的で買った場合にも騰貴した現在の価格を基準とする","**民法判例百選Ⅱ 債権〔第9版〕8番**（紙面p.18／解説：坂口甲）＝**第8版9番**（紙面p.20／解説：久保宏之）。**判例は価格騰貴を416条で処理する**が、本論証は金銭的評価の問題として416条の外で扱う"],["最判昭和59・2・16 裁判集民事141号201頁","**拡大損害**（養魚池の堤防の修繕工事中の集中豪雨で飼養されていた鰻が流失した事案）について、これを完全性利益の保護義務違反とはみず、**仕事完成義務の履行遅滞から生じた拡大損害として、416条2項の特別損害の問題**として処理した","基本講義 債権各論Ⅰ p.243〔DB p0267〕・プラクティス p.132〔紙面115〕で確認。**予見時期や価格騰貴の判例ではない**ので、本論証の文脈で引く場面はない。プラクティス p.137 が大判大正7・8・27 と並べて挙げるのは「416条を相当因果関係と解する判例」の例示として"]],"field":"債務不履行・損害賠償","order":26},{"name":"時効の援用権喪失_信義則","subject":"民法","rank":"B","path":"まとめ/民法/論証/時効の援用権喪失_信義則.md","cards":[{"id":"民法/時効の援用権喪失_信義則#1","block":"第1","kind":"cloze","masked":"時効の利益はあらかじめ放棄することができないが（⟦ア⟧）、同条の⟦イ⟧上、完成後に放棄することは許される。もっとも、放棄は⟦ウ⟧であるところ、⦅債務者が時効完成後に債務を承認するときは、⟦エ⟧であるから、承認の事実から⟦オ⟧することは許されない⦆⟨1⟩。","body":"時効の利益はあらかじめ放棄することができないが（⟪146条⟫）、同条の⟪反対解釈⟫上、完成後に放棄することは許される。もっとも、放棄は⟪時効完成を知ってする意思表示⟫であるところ、⦅債務者が時効完成後に債務を承認するときは、⟪その完成を知らないのが通常⟫であるから、承認の事実から⟪時効完成を知ってされたものと推定⟫することは許されない⦆⟨1⟩。","answers":["146条","反対解釈","時効完成を知ってする意思表示","その完成を知らないのが通常","時効完成を知ってされたものと推定"],"check":"","notes":[{"n":1,"label":"最大判 昭和41・4・20","case":"最大判 昭和41・4・20（民集20巻4号702頁）","gist":"時効完成後の債務承認から「時効完成を知ってした」と推定することは許されない。しかし承認をした以上、時効完成を知らなかったときでも、信義則上、その後に消滅時効を援用することは許されない"}],"law":"","cites":["民法/146"],"rate":13,"designed":true,"ref":false,"hash":"8aa89aa8d5d0"},{"id":"民法/時効の援用権喪失_信義則#2","block":"第2","kind":"cloze","masked":"しかし、時効完成後に債務を承認することは、⟦ア⟧行為であり、相手方も⟦イ⟧であると考えるから、⦅その後に債務者が時効を援用することは、⟦ウ⟧と解する⦆⟨1⟩。","body":"しかし、時効完成後に債務を承認することは、⟪時効による債務消滅の主張と相容れない⟫行為であり、相手方も⟪債務者はもはや時効を援用しない趣旨⟫であると考えるから、⦅その後に債務者が時効を援用することは、⟪信義則上許されない⟫と解する⦆⟨1⟩。","answers":["時効による債務消滅の主張と相容れない","債務者はもはや時効を援用しない趣旨","信義則上許されない"],"check":"","notes":[{"n":1,"label":"最大判 昭和41・4・20","case":"最大判 昭和41・4・20（民集20巻4号702頁）","gist":"時効完成後の債務承認から「時効完成を知ってした」と推定することは許されない。しかし承認をした以上、時効完成を知らなかったときでも、信義則上、その後に消滅時効を援用することは許されない"}],"law":"","cites":[],"rate":0,"designed":true,"ref":false,"hash":"369c47f4702f"},{"id":"民法/時効の援用権喪失_信義則#3","block":"第3","kind":"cloze","masked":"もっとも、援用権の喪失は⟦ア⟧であるから、その効力は⟦イ⟧生じ、⟦ウ⟧。","body":"もっとも、援用権の喪失は⟪信義則に基づく効果⟫であるから、その効力は⟪承認をした者についてのみ⟫生じ、⟪他の援用権者には及ばない⟫。","answers":["信義則に基づく効果","承認をした者についてのみ","他の援用権者には及ばない"],"check":"","notes":[],"law":"","cites":[],"rate":0,"designed":true,"ref":false,"hash":"c2b35590d943"}],"setsurei":["AはBに対して貸金債権（元本100万円・利息付き）を有していたが、弁済期から消滅時効期間が経過した。その後、Bは時効完成を知らないまま、Aに「利息を免除して元本だけにしてくれれば分割で払う」と書いた手紙を送った。さらにその後、BはAの請求に対して消滅時効を援用した。Bの援用は認められるか。","AはBに対して貸金債権を有し、Cがその保証人、Dが自己所有の不動産に抵当権を設定した物上保証人である。主債務の消滅時効期間が経過した後、Bは時効完成を知らないままAに対して主債務を承認した。その後、AがCに保証債務の履行を求め、Dに対して抵当権を実行した。C・Dは主債務の消滅時効を援用できるか。"],"full":"時効の利益はあらかじめ放棄することができないが（⟪146条⟫）、同条の⟪反対解釈⟫上、完成後に放棄することは許される。もっとも、放棄は⟪時効完成を知ってする意思表示⟫であるところ、⦅債務者が時効完成後に債務を承認するときは、⟪その完成を知らないのが通常⟫であるから、承認の事実から⟪時効完成を知ってされたものと推定⟫することは許されない⦆⟨1⟩。\n\nしかし、時効完成後に債務を承認することは、⟪時効による債務消滅の主張と相容れない⟫行為であり、相手方も⟪債務者はもはや時効を援用しない趣旨⟫であると考えるから、⦅その後に債務者が時効を援用することは、⟪信義則上許されない⟫と解する⦆⟨1⟩。\n\nもっとも、援用権の喪失は⟪信義則に基づく効果⟫であるから、その効力は⟪承認をした者についてのみ⟫生じ、⟪他の援用権者には及ばない⟫。","kata":"| # | 落としてはいけない要素 | 合格に必要か（ランクB） |\n|---|---|---|\n| 1 | 146条（事前放棄禁止）と、その反対解釈＝完成後の放棄は可 | ○（条文番号まで） |\n| 2 | 放棄には時効完成の認識が要る／承認からは「知っていた」と推定できない | ○（幹） |\n| 3 | **それでも信義則上、援用は許されない**（結論の方向） | ◎ 必須 |\n| 4 | 理由付け（承認は時効消滅の主張と相容れない＋相手方の信頼） | △ 文言は問わない |\n| 5 | **援用権喪失は相対効**（他の援用権者に及ばない） | ○（設例2の核。落としたら△） |\n| 6 | 145条括弧書（保証人・物上保証人・第三取得者が援用権者） | △ 条文番号が出れば加点 |\n| 7 | 〔副〕客観的範囲限定説の存在と決め手（一部承認の事案で結論が変わる） | 「あると言えれば可」 |\n\n**勝負どころ**：\n1. 「推定は許されない」と「それでも援用は許されない」を**2段で書き分ける**こと。ここを1段にまとめると、旧判例（推定構成）と昭和41年判決（信義則構成）の違いが消える。\n2. **相対効**を落とさないこと。設問が保証人・物上保証人を登場させていたら、そこが出題の主眼である。\n3. 「放棄」と「援用権喪失」を**別概念として扱う**こと（要件事実が違う）。\n\n> ⚠️ **間違えやすい点**：\n> - 「承認」を152条1項の**時効の更新**事由と混同しない。152条の承認は**時効完成前**の事由であり、時効完成後の承認は更新ではない（更新事由としての承認の効力は当事者及びその承継人の間でのみ生ずる〔153条3項〕点も別問題）。\n> - 援用権喪失を「時効利益の放棄」と書かない。放棄は意思表示（時効完成の認識＋行為能力・処分権限が必要）、承認は観念の通知（管理能力で足りる）。\n> - 援用権を失っても**そこで終わりではない**。承認時から新たな時効が進行し、再度完成すれば援用できる。\n> - 相対効は「主債務者→保証人」の方向だけでなく「保証人→主債務者」の方向でも同じ。\n> - **相対効を「保証人は絶対に主債務の時効を援用できる」と読み替えない。**保証人自身が主債務者の承認を知って保証債務を承認していれば、保証人も主債務の援用権を失う（最判昭和44・3・20）。相対効が否定するのは**効果の自動的な波及**であって、保証人固有の信義則違反の検討まで免除するものではない。","hanrei":[["最大判 昭和41・4・20（民集20巻4号702頁）","時効完成後の債務承認から「時効完成を知ってした」と推定することは許されない。しかし承認をした以上、時効完成を知らなかったときでも、信義則上、その後に消滅時効を援用することは許されない","**民法百選Ⅰ〔第9版〕39番＝〔第8版〕43番＝〔第7版〕42番**。請求異議事件。昭和35・6・23判決を変更。⚠️ **解説執筆者は第8版＝金山直樹／第9版＝齋藤由起**。本論証が引く〔副〕客観的範囲限定説は**第8版（金山）解説のもの**なので、第9版を開いても同じ記述があるとは限らない"],["最判 昭和35・6・23（民集14巻8号1498頁）","承認から時効完成を知っていたと推定する（旧判例）。時効利益の放棄には時効完成を知っていることを要する","昭和41年大法廷判決により**変更**。ただし「放棄には完成の認識が必要」という部分は現在も引用される（『完全講義』p.133）"],["最判 昭和45・5・21（民集24巻5号393頁）","放棄・援用権喪失の後、新たに時効が進行する（新たな時効は援用できる）","『スタートアップ民法・民法総則』p.443、佐久間 p.462"],["最判 昭和56・6・30（判時1011号52頁）","代表取締役が会社の自己に対する貸付金を記載した決算報告書の作成に関与し、決算内容を承知してこれを会社に提出した場合は「承認」に当たる","百選Ⅰ〔第8版〕43番解説より"],["最判 昭和44・3・20（判時557号237頁）","主債務の時効完成後に主債務者が承認し、**保証人が主債務者の債務承認を知って保証債務を承認した**場合には、保証人がその後主債務の消滅時効を援用することは信義則に照して許されない","相対効の裏面。**保証人も「主債務の」援用権を失いうる**。『完全講義 民事訴訟実務の基礎 上巻〔第3版〕』p.255 の引用で確認（判例集本文はDB未収録）"],["最判 平成7・9・8（金法1441号29頁）","保証人による債務承認的行為には昭和41年判決の射程が及ばない","百選Ⅰ〔第8版〕43番解説が引用。**判例集本文はDB未収録**（解説の引用でのみ確認）。上の昭和44・3・20と緊張関係にある"],["最判 昭和61・3・17（民集40巻2号420頁）","時効の効果につき停止条件説（不確定効果説）","民法百選Ⅰ〔第9版〕37番＝〔第8版〕41番＝〔第7版〕40番「時効援用の効果」。援用権喪失の理論構成の前提"]],"field":"時効","order":6},{"name":"根抵当権_398条の2以下","subject":"民法","rank":"A","path":"まとめ/民法/論証/根抵当権_398条の2以下.md","cards":[{"id":"民法/根抵当権_398条の2以下#1","block":"第1〔極度額の意味〕","kind":"cloze","masked":"　根抵当権は、設定行為で定めるところにより、一定の範囲に属する不特定の債権を、極度額の限度において担保する（⟦ア⟧）。根抵当権者は、確定した元本並びに利息その他の定期金及び債務不履行による損害賠償の⟪全部⟫について、極度額を限度として根抵当権を行使することができる（⟦イ⟧）。したがって、極度額を超えない限り、利息・損害金は⟦ウ⟧（375条の適用はない）。\n　⦅もっとも、極度額の定めは、後順位担保権者その他の第三者に対する優先弁済権の制約にとどまらず、進んで根抵当権者が目的物件について有する⟦エ⟧としての意味を有すると解する。したがって、後順位担保権者など配当を受けうる第三者がなく競売代金に余剰が生じた場合であっても、根抵当権者は、極度額を超える部分についてその⟦オ⟧⦆⟨1⟩。","body":"　根抵当権は、設定行為で定めるところにより、一定の範囲に属する不特定の債権を、極度額の限度において担保する（⟪398条の2第1項⟫）。根抵当権者は、確定した元本並びに利息その他の定期金及び債務不履行による損害賠償の⟪全部⟫について、極度額を限度として根抵当権を行使することができる（⟪398条の3第1項⟫）。したがって、極度額を超えない限り、利息・損害金は⟪最後の2年分に限られない⟫（375条の適用はない）。\n　⦅もっとも、極度額の定めは、後順位担保権者その他の第三者に対する優先弁済権の制約にとどまらず、進んで根抵当権者が目的物件について有する⟪換価権能の限度⟫としての意味を有すると解する。したがって、後順位担保権者など配当を受けうる第三者がなく競売代金に余剰が生じた場合であっても、根抵当権者は、極度額を超える部分についてその⟪交付を受けることはできない⟫⦆⟨1⟩。","answers":["398条の2第1項","398条の3第1項","最後の2年分に限られない","換価権能の限度","交付を受けることはできない"],"check":"","notes":[{"n":1,"label":"最判昭和48・10・4","case":"最判昭和48・10・4（判時723号42頁）","gist":"根抵当権者は、利息・損害金と元本の合計が極度額を超えない限り被担保債権額の全部について優先弁済を受けられるが、極度額を超える部分については優先弁済権を主張できない。**極度額の定めは、後順位担保権者など第三者に対する優先弁済権の制約にとどまらず、進んで根抵当権者が目的物件について有する換価権能の限度としての意味を有する**。その結果、後順位担保権者など配当を受けることのできる第三者がなく競売代金に余剰が生じた場合でも、根抵当権者は極度額を超える部分について当該競売手続でその交付を受けることができない"}],"law":"","cites":["民法/398の2","民法/398の3","民法/375"],"rate":30,"designed":true,"ref":false,"hash":"b3fb3f790a59"},{"id":"民法/根抵当権_398条の2以下#2","block":"第2〔元本確定前——付従性・随伴性の否定〕","kind":"cloze","masked":"　元本の確定前においては、根抵当権は個々の債権と特定的に結び付いていない。そこで、確定前に根抵当権者から債権を取得した者、および債務者のために又は債務者に代わって弁済をした者は、その債権について根抵当権を行使することができない（⟦ア⟧）。個々の債権に根抵当権を随伴させると、⟦イ⟧して法律関係が複雑になり、後順位者の利害をも害するうえ、物権である根抵当権は⟦ウ⟧からである。同様に、確定前の債務引受け・更改によっても根抵当権を引受人の債務・更改後の債務に移すことはできない（同条2項〜4項）。\n　したがって、譲受人に担保を及ぼしたければ、⟦エ⟧から債権を譲渡する必要がある。","body":"　元本の確定前においては、根抵当権は個々の債権と特定的に結び付いていない。そこで、確定前に根抵当権者から債権を取得した者、および債務者のために又は債務者に代わって弁済をした者は、その債権について根抵当権を行使することができない（⟪398条の7第1項⟫）。個々の債権に根抵当権を随伴させると、⟪担保枠が細分化⟫して法律関係が複雑になり、後順位者の利害をも害するうえ、物権である根抵当権は⟪部分的に実行することができない⟫からである。同様に、確定前の債務引受け・更改によっても根抵当権を引受人の債務・更改後の債務に移すことはできない（同条2項〜4項）。\n　したがって、譲受人に担保を及ぼしたければ、⟪先に元本を確定させて⟫から債権を譲渡する必要がある。","answers":["398条の7第1項","担保枠が細分化","部分的に実行することができない","先に元本を確定させて"],"check":"","notes":[],"law":"398条の7第1項〜4項（元本確定前の付従性・随伴性の否定）","cites":["民法/398の7"],"rate":28,"designed":true,"ref":false,"hash":"3a3d7d0ba084"},{"id":"民法/根抵当権_398条の2以下#3","block":"第3〔元本確定前——変更と処分の制限〕","kind":"cloze","masked":"　元本の確定前は、担保すべき債権の範囲および債務者を変更することができ、これには後順位の抵当権者その他の第三者の⟦ア⟧（⟦イ⟧）。この変更によっても極度額という担保価値支配の⟦ウ⟧、後順位者に不測の不利益を与えないからである。ただし、元本の確定前に登記をしなければ、変更をしなかったものとみなされる（同条3項）。これに対し、⟦エ⟧から、⟦オ⟧を得なければすることができない（398条の5）。\n　また、元本の確定前は、376条1項による処分（順位の譲渡・放棄等）をすることができず、⟦カ⟧のみが許される（398条の11第1項）。代わりに、⟪担保枠そのものを移転する方法⟫として、根抵当権の全部譲渡（398条の12第1項）、二個に分割してその一方を譲り渡す分割譲渡（同条2項）、および譲渡人・譲受人が共有となる一部譲渡（398条の13）が認められる。いずれについても、⟪設定者は自己の不動産でいかなる債権を担保するかについて利害を有する⟫から、⟦キ⟧を要する。分割譲渡ではさらに、分割前の根抵当権を目的とする権利が譲り渡した根抵当権について消滅するため、⟪その権利者の承諾⟫も要する（398条の12第2項後段・3項）。一部譲渡によって根抵当権を共有した者は、別段の定めがない限り、⟪それぞれその債権額の割合⟫に応じて弁済を受ける（398条の14第1項）。","body":"　元本の確定前は、担保すべき債権の範囲および債務者を変更することができ、これには後順位の抵当権者その他の第三者の⟪承諾を要しない⟫（⟪398条の4第1項・2項⟫）。この変更によっても極度額という担保価値支配の⟪枠に変動はなく⟫、後順位者に不測の不利益を与えないからである。ただし、元本の確定前に登記をしなければ、変更をしなかったものとみなされる（同条3項）。これに対し、⟪極度額の変更は枠それ自体を動かす⟫から、⟪利害関係を有する者の承諾⟫を得なければすることができない（398条の5）。\n　また、元本の確定前は、376条1項による処分（順位の譲渡・放棄等）をすることができず、⟪転抵当⟫のみが許される（398条の11第1項）。代わりに、⟪担保枠そのものを移転する方法⟫として、根抵当権の全部譲渡（398条の12第1項）、二個に分割してその一方を譲り渡す分割譲渡（同条2項）、および譲渡人・譲受人が共有となる一部譲渡（398条の13）が認められる。いずれについても、⟪設定者は自己の不動産でいかなる債権を担保するかについて利害を有する⟫から、⟪根抵当権設定者の承諾⟫を要する。分割譲渡ではさらに、分割前の根抵当権を目的とする権利が譲り渡した根抵当権について消滅するため、⟪その権利者の承諾⟫も要する（398条の12第2項後段・3項）。一部譲渡によって根抵当権を共有した者は、別段の定めがない限り、⟪それぞれその債権額の割合⟫に応じて弁済を受ける（398条の14第1項）。","answers":["承諾を要しない","398条の4第1項・2項","枠に変動はなく","極度額の変更は枠それ自体を動かす","利害関係を有する者の承諾","転抵当","根抵当権設定者の承諾"],"check":"","notes":[],"law":"398条の4・398条の5・398条の11〜398条の14（確定前の変更と処分の制限）","cites":["民法/398の4","民法/398の5","民法/376","民法/398の11","民法/398の12","民法/398の13","民法/398の14"],"rate":25,"designed":true,"ref":false,"hash":"9f0cfd840c9a"},{"id":"民法/根抵当権_398条の2以下#4","block":"第4〔元本の確定〕","kind":"cloze","masked":"　元本の確定とは、不特定の債権を担保する状態から、確定時に存在する元本を具体的に担保する状態に移すことをいう。確定期日の定めがあればその到来により確定し、期日は定め又は変更した日から⟦ア⟧でなければならない（398条の6第1項・3項）。確定期日の定めがないときは、設定者は設定の時から⟦イ⟧を経過すれば確定請求をすることができ、⟦ウ⟧の経過により、根抵当権者は⟦エ⟧確定請求をすることができ、請求の時に、それぞれ元本が確定する（⟦オ⟧）。設定者の請求権は、自己の不動産が長期にわたり担保の負担を受け続けないようにするためであり、根抵当権者の請求権は、債権の譲渡等のために自ら枠を閉じる必要があるからである。確定期日の定めがあるときは、⟦カ⟧（同条3項）。\n　加えて、根抵当権者が競売・担保不動産収益執行・物上代位による差押えを申し立てたとき（手続の開始又は差押えがあったときに限る）、根抵当権者が滞納処分による差押えをしたとき、第三者による競売手続の開始等を根抵当権者が知った時から2週間を経過したとき、債務者又は設定者が破産手続開始決定を受けたときは、元本は確定する（398条の20第1項各号）。いずれも根抵当権者が⟦キ⟧だからである。","body":"　元本の確定とは、不特定の債権を担保する状態から、確定時に存在する元本を具体的に担保する状態に移すことをいう。確定期日の定めがあればその到来により確定し、期日は定め又は変更した日から⟪5年以内⟫でなければならない（398条の6第1項・3項）。確定期日の定めがないときは、設定者は設定の時から⟪3年⟫を経過すれば確定請求をすることができ、⟪請求の時から2週間⟫の経過により、根抵当権者は⟪いつでも⟫確定請求をすることができ、請求の時に、それぞれ元本が確定する（⟪398条の19第1項・2項⟫）。設定者の請求権は、自己の不動産が長期にわたり担保の負担を受け続けないようにするためであり、根抵当権者の請求権は、債権の譲渡等のために自ら枠を閉じる必要があるからである。確定期日の定めがあるときは、⟪いずれの確定請求もできない⟫（同条3項）。\n　加えて、根抵当権者が競売・担保不動産収益執行・物上代位による差押えを申し立てたとき（手続の開始又は差押えがあったときに限る）、根抵当権者が滞納処分による差押えをしたとき、第三者による競売手続の開始等を根抵当権者が知った時から2週間を経過したとき、債務者又は設定者が破産手続開始決定を受けたときは、元本は確定する（398条の20第1項各号）。いずれも根抵当権者が⟪優先弁済権を発動させるべき局面⟫だからである。","answers":["5年以内","3年","請求の時から2週間","いつでも","398条の19第1項・2項","いずれの確定請求もできない","優先弁済権を発動させるべき局面"],"check":"","notes":[],"law":"398条の6・398条の19・398条の20（元本確定の事由）","cites":["民法/398の6","民法/398の19","民法/398の20"],"rate":24,"designed":true,"ref":false,"hash":"498d80396194"},{"id":"民法/根抵当権_398条の2以下#5","block":"第5〔確定後の効果〕","kind":"cloze","masked":"　元本が確定すると、確定時に存在する元本のみが具体的に担保され、その後に発生する元本は担保されない。確定後の根抵当権は、確定元本とそこから生ずる利息・定期金・遅延損害金だけを担保するものとなり、⟦ア⟧を持つに至るから、398条の7の制限も及ばず、被担保債権の移転に伴って根抵当権も移転する。\n　もっとも、確定後も利息・損害金は極度額まで無制限に担保されるため、担保の⟦イ⟧が次第に食い潰される。そこで、設定者は、極度額を、現に存する債務の額と⟦ウ⟧その他の定期金及び債務不履行による損害賠償の額とを加えた額に減額することを請求できる（⟦エ⟧）。これは形成権であり、請求により直ちに減額の効果が生ずる。\n　逆に、確定後に現に存する債務の額が極度額を超えるときは、⟪物上保証人および抵当不動産の第三取得者等⟫は、⟦オ⟧を払い渡し又は供託して根抵当権の⟦カ⟧できる（398条の22第1項）。設定者は極度額までの担保価値支配を容認したにすぎないから、その額を提供すれば負担から解放されるべきだからである。この払渡し等は弁済の効力を有し、払い渡した者は債務者に対する求償権を取得する。⟪被担保債権の全額を弁済しなければ担保が消えない第三者弁済とは、この点で異なる。⟫ただし、主たる債務者・保証人およびその承継人は、抵当不動産の第三取得者となっても⟦キ⟧（同条3項・380条）。債務の全額について弁済義務を負う者だからである。","body":"　元本が確定すると、確定時に存在する元本のみが具体的に担保され、その後に発生する元本は担保されない。確定後の根抵当権は、確定元本とそこから生ずる利息・定期金・遅延損害金だけを担保するものとなり、⟪普通抵当権に近い性質⟫を持つに至るから、398条の7の制限も及ばず、被担保債権の移転に伴って根抵当権も移転する。\n　もっとも、確定後も利息・損害金は極度額まで無制限に担保されるため、担保の⟪空き枠⟫が次第に食い潰される。そこで、設定者は、極度額を、現に存する債務の額と⟪以後2年間に生ずべき利息⟫その他の定期金及び債務不履行による損害賠償の額とを加えた額に減額することを請求できる（⟪398条の21第1項⟫）。これは形成権であり、請求により直ちに減額の効果が生ずる。\n　逆に、確定後に現に存する債務の額が極度額を超えるときは、⟪物上保証人および抵当不動産の第三取得者等⟫は、⟪極度額に相当する金額⟫を払い渡し又は供託して根抵当権の⟪消滅を請求⟫できる（398条の22第1項）。設定者は極度額までの担保価値支配を容認したにすぎないから、その額を提供すれば負担から解放されるべきだからである。この払渡し等は弁済の効力を有し、払い渡した者は債務者に対する求償権を取得する。⟪被担保債権の全額を弁済しなければ担保が消えない第三者弁済とは、この点で異なる。⟫ただし、主たる債務者・保証人およびその承継人は、抵当不動産の第三取得者となっても⟪消滅請求をすることができない⟫（同条3項・380条）。債務の全額について弁済義務を負う者だからである。","answers":["普通抵当権に近い性質","空き枠","以後2年間に生ずべき利息","398条の21第1項","極度額に相当する金額","消滅を請求","消滅請求をすることができない"],"check":"","notes":[],"law":"398条の7・398条の21・398条の22・380条（確定後の効果・減額請求・消滅請求）","cites":["民法/398の7","民法/398の21","民法/398の22","民法/380"],"rate":20,"designed":true,"ref":false,"hash":"3c0485735f80"}],"setsurei":["A株式会社は、B銀行との継続的な融資取引のため、自己所有の甲土地（時価5000万円）に、極度額3000万円、債務者A、担保すべき債権の範囲を「B・A間の銀行取引によって生ずる債権」とする1番根抵当権を設定し、登記した。その後、CはAに対する債権を担保するため甲土地に2番抵当権の設定を受けた。元本確定期日の定めはない。 (1) Bは、Aに対する貸付金債権のうち1000万円をDに譲渡した。Dは甲土地の根抵当権を行使できるか。Dに担保を及ぼすにはどうすればよいか。 (2) BとAは、担保すべき債権の範囲を「銀行取引」から「銀行取引および保証委託取引」に変更しようとしている。2番抵当権者Cの承諾は必要か。また、極度額を3000万円から4000万円に増額する場合はどうか。 (3) Bは、この根抵当権をE銀行に全部譲渡したいと考えている。どのような手続が必要か。分割して極度額1000万円分だけをEに譲り渡す場合はどうか。","Fは、その子Gの事業資金の借入れのため、自己所有の乙建物（時価4000万円）に、H銀行を根抵当権者・債務者をG・極度額2000万円とする1番根抵当権を設定し、登記した。その後、IはGに対する1500万円の貸金債権を担保するため乙建物に2番抵当権の設定を受けた。元本確定期日の定めはなく、設定から5年が経過している。 (1) Fは元本を確定させることができるか。Hはどうか。 (2) 元本確定時のGの債務が元本800万円のみであった場合（遅延損害金は年5パーセント）、Fは何を請求できるか。 (3) 元本確定時のGの債務が元本2500万円であった場合、Fは何をすることができ、いくら支払うことになるか。また、Fが何もせず、Hが乙建物を競売して4000万円で売却されたとき、H・I・Fにはそれぞれいくら配当されるか。"],"full":"　根抵当権は、設定行為で定めるところにより、一定の範囲に属する不特定の債権を、極度額の限度において担保する（⟪398条の2第1項⟫）。根抵当権者は、確定した元本並びに利息その他の定期金及び債務不履行による損害賠償の⟪全部⟫について、極度額を限度として根抵当権を行使することができる（⟪398条の3第1項⟫）。したがって、極度額を超えない限り、利息・損害金は⟪最後の2年分に限られない⟫（375条の適用はない）。\n　⦅もっとも、極度額の定めは、後順位担保権者その他の第三者に対する優先弁済権の制約にとどまらず、進んで根抵当権者が目的物件について有する⟪換価権能の限度⟫としての意味を有すると解する。したがって、後順位担保権者など配当を受けうる第三者がなく競売代金に余剰が生じた場合であっても、根抵当権者は、極度額を超える部分についてその⟪交付を受けることはできない⟫⦆⟨1⟩。\n\n　元本の確定前においては、根抵当権は個々の債権と特定的に結び付いていない。そこで、確定前に根抵当権者から債権を取得した者、および債務者のために又は債務者に代わって弁済をした者は、その債権について根抵当権を行使することができない（⟪398条の7第1項⟫）。個々の債権に根抵当権を随伴させると、⟪担保枠が細分化⟫して法律関係が複雑になり、後順位者の利害をも害するうえ、物権である根抵当権は⟪部分的に実行することができない⟫からである。同様に、確定前の債務引受け・更改によっても根抵当権を引受人の債務・更改後の債務に移すことはできない（同条2項〜4項）。\n　したがって、譲受人に担保を及ぼしたければ、⟪先に元本を確定させて⟫から債権を譲渡する必要がある。\n\n　元本の確定前は、担保すべき債権の範囲および債務者を変更することができ、これには後順位の抵当権者その他の第三者の⟪承諾を要しない⟫（⟪398条の4第1項・2項⟫）。この変更によっても極度額という担保価値支配の⟪枠に変動はなく⟫、後順位者に不測の不利益を与えないからである。ただし、元本の確定前に登記をしなければ、変更をしなかったものとみなされる（同条3項）。これに対し、⟪極度額の変更は枠それ自体を動かす⟫から、⟪利害関係を有する者の承諾⟫を得なければすることができない（398条の5）。\n　また、元本の確定前は、376条1項による処分（順位の譲渡・放棄等）をすることができず、⟪転抵当⟫のみが許される（398条の11第1項）。代わりに、⟪担保枠そのものを移転する方法⟫として、根抵当権の全部譲渡（398条の12第1項）、二個に分割してその一方を譲り渡す分割譲渡（同条2項）、および譲渡人・譲受人が共有となる一部譲渡（398条の13）が認められる。いずれについても、⟪設定者は自己の不動産でいかなる債権を担保するかについて利害を有する⟫から、⟪根抵当権設定者の承諾⟫を要する。分割譲渡ではさらに、分割前の根抵当権を目的とする権利が譲り渡した根抵当権について消滅するため、⟪その権利者の承諾⟫も要する（398条の12第2項後段・3項）。一部譲渡によって根抵当権を共有した者は、別段の定めがない限り、⟪それぞれその債権額の割合⟫に応じて弁済を受ける（398条の14第1項）。\n\n　元本の確定とは、不特定の債権を担保する状態から、確定時に存在する元本を具体的に担保する状態に移すことをいう。確定期日の定めがあればその到来により確定し、期日は定め又は変更した日から⟪5年以内⟫でなければならない（398条の6第1項・3項）。確定期日の定めがないときは、設定者は設定の時から⟪3年⟫を経過すれば確定請求をすることができ、⟪請求の時から2週間⟫の経過により、根抵当権者は⟪いつでも⟫確定請求をすることができ、請求の時に、それぞれ元本が確定する（⟪398条の19第1項・2項⟫）。設定者の請求権は、自己の不動産が長期にわたり担保の負担を受け続けないようにするためであり、根抵当権者の請求権は、債権の譲渡等のために自ら枠を閉じる必要があるからである。確定期日の定めがあるときは、⟪いずれの確定請求もできない⟫（同条3項）。\n　加えて、根抵当権者が競売・担保不動産収益執行・物上代位による差押えを申し立てたとき（手続の開始又は差押えがあったときに限る）、根抵当権者が滞納処分による差押えをしたとき、第三者による競売手続の開始等を根抵当権者が知った時から2週間を経過したとき、債務者又は設定者が破産手続開始決定を受けたときは、元本は確定する（398条の20第1項各号）。いずれも根抵当権者が⟪優先弁済権を発動させるべき局面⟫だからである。\n\n　元本が確定すると、確定時に存在する元本のみが具体的に担保され、その後に発生する元本は担保されない。確定後の根抵当権は、確定元本とそこから生ずる利息・定期金・遅延損害金だけを担保するものとなり、⟪普通抵当権に近い性質⟫を持つに至るから、398条の7の制限も及ばず、被担保債権の移転に伴って根抵当権も移転する。\n　もっとも、確定後も利息・損害金は極度額まで無制限に担保されるため、担保の⟪空き枠⟫が次第に食い潰される。そこで、設定者は、極度額を、現に存する債務の額と⟪以後2年間に生ずべき利息⟫その他の定期金及び債務不履行による損害賠償の額とを加えた額に減額することを請求できる（⟪398条の21第1項⟫）。これは形成権であり、請求により直ちに減額の効果が生ずる。\n　逆に、確定後に現に存する債務の額が極度額を超えるときは、⟪物上保証人および抵当不動産の第三取得者等⟫は、⟪極度額に相当する金額⟫を払い渡し又は供託して根抵当権の⟪消滅を請求⟫できる（398条の22第1項）。設定者は極度額までの担保価値支配を容認したにすぎないから、その額を提供すれば負担から解放されるべきだからである。この払渡し等は弁済の効力を有し、払い渡した者は債務者に対する求償権を取得する。⟪被担保債権の全額を弁済しなければ担保が消えない第三者弁済とは、この点で異なる。⟫ただし、主たる債務者・保証人およびその承継人は、抵当不動産の第三取得者となっても⟪消滅請求をすることができない⟫（同条3項・380条）。債務の全額について弁済義務を負う者だからである。","kata":"| # | 落としてはいけない要素 | キーワード | 条文 |\n|---|---|---|---|\n| 1 | 定義 | 一定の範囲に属する不特定の債権／極度額の限度 | 398条の2第1項 |\n| 2 | 極度額の効果（表） | 利息・損害金は**最後の2年分に限られない**（375条不適用） | 398条の3第1項 |\n| 3 | 極度額の効果（裏） | **換価権能の限度**／余剰があっても超過部分の交付を受けられない | （判例） |\n| 4 | 随伴性の否定 | 確定前に債権を取得した者・代位弁済者は**行使できない** | 398条の7第1項 |\n| 5 | 4の理由 | 個々の債権との**特定的結びつきがない**／画一的法定・後順位者の利害・**部分的実行ができない** | — |\n| 6 | 承諾**不要**の変更 | 範囲・債務者・確定期日／**極度額に変動がない**から | 398条の4第1項2項、398条の6第2項 |\n| 7 | 承諾**必要**の変更 | 極度額の変更（**増額も減額も**）／利害関係人 | 398条の5 |\n| 8 | 登記の失効 | 範囲・債務者の変更は**確定前に登記しないと変更しなかったものとみなす** | 398条の4第3項 |\n| 9 | 処分の制限 | 376条1項の処分は**不可**、転抵当だけ可 | 398条の11第1項 |\n| 10 | 3種の譲渡＋承諾 | 全部／分割／一部、いずれも**設定者の承諾**。分割はさらに**目的とする権利者の承諾** | 398条の12、398条の13 |\n| 11 | 共有の配当 | 別段の定めなき限り**債権額の割合**に応じて | 398条の14第1項 |\n| 12 | 確定請求の非対称 | 設定者＝**3年経過後・請求から2週間**／根抵当権者＝**いつでも・請求の時** | 398条の19第1項2項 |\n| 13 | 法定確定事由 | 競売等の申立て（手続開始が要件）／滞納処分の差押え／**知った時から2週間**／破産手続開始決定 | 398条の20第1項各号 |\n| 14 | 確定の効果 | 確定時の元本のみ担保、以後の元本は担保されない／随伴性の回復 | — |\n| 15 | 減額請求 | 現存債務額＋**以後2年間**の利息等／設定者／形成権 | 398条の21第1項 |\n| 16 | 消滅請求 | 現存債務額が**極度額を超える**とき／物上保証人・第三取得者等／極度額相当額の払渡し・供託／主債務者・保証人は不可 | 398条の22第1項3項 |\n\n**勝負どころ**\n1. **「元本確定前か後か」を答案の最初に切る。**根抵当権の設問はほぼすべてこの分岐で決まる。確定前なら398条の7・398条の11〜13（切り離し）、確定後なら398条の21・22（清算）。\n2. **承諾の要否を条文ごとに正確に出せるか**（上表6・7・10）。「後順位抵当権者の承諾」と「設定者の承諾」を混ぜないこと。\n3. **極度額を「上限」だけでなく「換価権能の限度」として説明できるか**（最判昭和48・10・4）。ここまで書けると配当計算の理由づけが1段深くなる。\n\n> ⚠️ **間違えやすい点**\n> - **承諾を要求する相手が違う。**範囲・債務者・確定期日の変更は**後順位抵当権者の承諾が不要**（398条の4第2項）。譲渡は**設定者の承諾が必要**（398条の12・13）。極度額の変更は**利害関係人の承諾が必要**（398条の5）。「根抵当は承諾がいらない／いる」と一括りにすると必ず外す。\n> - **極度額の変更は減額でも承諾が要る**（398条の5。転抵当権者が不利益を被りうるため）。「減額なら誰も損しないから不要」と考えない。\n> - **確定請求の効果発生時期が当事者で違う。**設定者＝請求から**2週間**、根抵当権者＝請求の**時**（398条の19第1項・2項）。設定者側にだけ「設定から3年」の要件がある。\n> - **398条の20第1項1号には但書がある。**根抵当権者の競売等の申立てだけでは足りず、「**競売手続若しくは担保不動産収益執行手続の開始又は差押えがあったときに限る**」。申立て＝確定と短絡しない。\n> - **確定後も375条は適用されない。**「確定すれば普通抵当権と同じだから利息は2年分」は誤り。確定後も極度額まで無制限に担保される（398条の3第1項。だからこそ398条の21の減額請求が要る）。\n> - **元本確定期日は設定契約の必須要素ではない。**定めなくても設定は有効（『体系別短答過去問題集 民法(上)』p.672 肢ア）。必須なのは債務者・債権の範囲・極度額（398条の2）。\n> - **確定＝実行可能ではない。**実行には具体的に担保されている債権のうち1つ以上の債務不履行が必要。\n> - **共同根抵当は例外・累積根抵当が原則。**「複数不動産＝392条の割付け」と考えると逆。割付けが働くのは**設定と同時に共同根抵当の登記をした場合だけ**（398条の16・398条の18）。\n> - **根保証に引き写さない。**根保証では元本確定前の随伴性が肯定されている（最二小判平成24・12・14）。\n> - **［DBで確認できなかった点］設定者の承諾を欠く根抵当権譲渡の効力。**DBに見つかったのは「承諾を得て譲り渡すことができる」「承諾を得なければならない」という記述までで、承諾を欠く譲渡が**無効なのか、設定者に対抗できないにとどまるのか**を明示する記述は見つからなかった。答案では「398条の12第1項が設定者の承諾を要件とするから、承諾を得る必要がある」という書き方にとどめ、効力論に踏み込まないのが安全。","hanrei":[["最判昭和48・10・4（判時723号42頁）","根抵当権者は、利息・損害金と元本の合計が極度額を超えない限り被担保債権額の全部について優先弁済を受けられるが、極度額を超える部分については優先弁済権を主張できない。**極度額の定めは、後順位担保権者など第三者に対する優先弁済権の制約にとどまらず、進んで根抵当権者が目的物件について有する換価権能の限度としての意味を有する**。その結果、後順位担保権者など配当を受けることのできる第三者がなく競売代金に余剰が生じた場合でも、根抵当権者は極度額を超える部分について当該競売手続でその交付を受けることができない","判旨の引用は『体系別短答過去問題集 民法(上)』p.668。**百選には未収録**（`判例百選_収録判例リスト.md` を「昭和48・10・4」でgrepし0件を確認）"],["最二小判平成24・12・14","根保証において、被保証債権を譲り受けた者は、その譲渡が元本確定期日前にされた場合であっても、**別段の合意がない限り**、保証人に対し保証債務の履行を求めることができる（元本確定前の履行請求・随伴性をいずれも肯定）","**根保証の判例であり、根抵当権の論点ではない**。398条の7と結論が逆になる理由（画一的法定・後順位者の利害・部分的実行の不能）を押さえるための対比として置く。**民法判例百選Ⅱ 債権〔第9版〕20番**（`判例百選_収録判例リスト.md` で確認。同リスト冒頭の「この一覧の見方」表により、民法判例百選Ⅱは第9版が索引収録の現行版）"]],"field":"抵当権","order":20},{"name":"法定地上権_再築・共同抵当・共有","subject":"民法","rank":"A","path":"まとめ/民法/論証/法定地上権_再築・共同抵当・共有.md","cards":[{"id":"民法/法定地上権_再築・共同抵当・共有#1","block":"第1〔土地のみに抵当権が設定され、その後建物が再築された場合〕","kind":"cloze","masked":"この場合も法定地上権は⟦ア⟧。抵当権設定時に土地上に抵当権設定者の建物が存在した以上、抵当権者は⟦イ⟧して土地を評価していたからである。もっとも、新建物を基準とすれば負担が旧建物のためのそれより重くなり抵当権者に不測の損害を与えるから、⦅その内容は⟦ウ⟧として定まると解する⦆⟨1⟩。","body":"この場合も法定地上権は⟪成立する⟫。抵当権設定時に土地上に抵当権設定者の建物が存在した以上、抵当権者は⟪法定地上権の負担を覚悟⟫して土地を評価していたからである。もっとも、新建物を基準とすれば負担が旧建物のためのそれより重くなり抵当権者に不測の損害を与えるから、⦅その内容は⟪旧建物を基準⟫として定まると解する⦆⟨1⟩。","answers":["成立する","法定地上権の負担を覚悟","旧建物を基準"],"check":"","notes":[{"n":1,"label":"大判 昭和10・8・10","case":"大判 昭和10・8・10　民集14巻1549頁","gist":"土地のみに抵当権が設定された後に建物が再築された場合、法定地上権は成立するが、その内容は**旧建物を基準**として定まる。"}],"law":"","cites":[],"rate":0,"designed":true,"ref":false,"hash":"c9ec971f03d1"},{"id":"民法/法定地上権_再築・共同抵当・共有#2","block":"第2〔土地および建物に共同抵当権が設定され、その後建物が再築された場合〕","kind":"cloze","masked":"⦅この場合は、新建物の所有者が土地の所有者と⟦ア⟧であり、かつ、新建物が建築された時点で土地の抵当権者が新建物につき土地の抵当権と⟦イ⟧の設定を受けたとき等の⟦ウ⟧がない限り、新建物のために法定地上権は⟦エ⟧と解する⦆⟨1⟩。","body":"⦅この場合は、新建物の所有者が土地の所有者と⟪同一⟫であり、かつ、新建物が建築された時点で土地の抵当権者が新建物につき土地の抵当権と⟪同順位の共同抵当権⟫の設定を受けたとき等の⟪特段の事情⟫がない限り、新建物のために法定地上権は⟪成立しない⟫と解する⦆⟨1⟩。","answers":["同一","同順位の共同抵当権","特段の事情","成立しない"],"check":"","notes":[{"n":1,"label":"最三小判 平成9・2・14","case":"最三小判 平成9・2・14　民集51巻2号375頁","gist":"所有者が土地及び地上建物に共同抵当権を設定した後、建物が取り壊され新建物が建築された場合、**新建物の所有者が土地の所有者と同一であり、かつ新建物につき土地の抵当権と同順位の共同抵当権の設定を受けたとき等特段の事情のない限り、新建物のために法定地上権は成立しない**。"}],"law":"","cites":[],"rate":0,"designed":true,"ref":false,"hash":"edc6be7aa4b6"},{"id":"民法/法定地上権_再築・共同抵当・共有#3","block":"第3","kind":"cloze","masked":"土地および建物に共同抵当権が設定された場合、抵当権者は⟦ア⟧の担保価値を把握しているのであって、抵当権の設定された建物が存続する限りは当該建物のための法定地上権の成立を許容するが、建物が取り壊されたときは土地について法定地上権の制約のない⟦イ⟧を把握しようとするのが、抵当権設定当事者の⟦ウ⟧である。抵当権の設定されない新建物のために法定地上権の成立を認めれば、抵当権者は当初把握していた土地全体の価値を、法定地上権の価額相当額だけ減少した価値に限定されることになり、⟦エ⟧を被るからである。建物保護の公益的要請は、抵当権設定当事者の⟦ウ⟧に反してまで重視すべきものではない。","body":"土地および建物に共同抵当権が設定された場合、抵当権者は⟪土地および建物全体⟫の担保価値を把握しているのであって、抵当権の設定された建物が存続する限りは当該建物のための法定地上権の成立を許容するが、建物が取り壊されたときは土地について法定地上権の制約のない⟪更地としての担保価値⟫を把握しようとするのが、抵当権設定当事者の⟪合理的意思⟫である。抵当権の設定されない新建物のために法定地上権の成立を認めれば、抵当権者は当初把握していた土地全体の価値を、法定地上権の価額相当額だけ減少した価値に限定されることになり、⟪不測の損害⟫を被るからである。建物保護の公益的要請は、抵当権設定当事者の合理的意思に反してまで重視すべきものではない。","answers":["土地および建物全体","更地としての担保価値","合理的意思","不測の損害"],"check":"","notes":[],"law":"","cites":[],"rate":0,"designed":true,"ref":false,"hash":"886bbef2f350"},{"id":"民法/法定地上権_再築・共同抵当・共有#4","block":"第4〔土地が共有の場合〕","kind":"cloze","masked":"共有者は各自、共有物について所有権と性質を同じくする⟦ア⟧を有し、かつ、共有地全体に対する地上権は⟦イ⟧となる。したがって、⦅土地共有者の一人だけについて⟦ウ⟧により地上権を設定したものとみなすべき事由が生じたとしても、他の共有者らがその持分に基づく使用収益権を⟦エ⟧し、当該共有者の処分にゆだねていたことなどにより、法定地上権の発生を⟦オ⟧していたとみることができる特段の事情がある場合でない限り、共有土地について法定地上権は⟦カ⟧と解する⦆⟨1⟩。","body":"共有者は各自、共有物について所有権と性質を同じくする⟪独立の持分⟫を有し、かつ、共有地全体に対する地上権は⟪共有者全員の負担⟫となる。したがって、⦅土地共有者の一人だけについて⟪388条本文⟫により地上権を設定したものとみなすべき事由が生じたとしても、他の共有者らがその持分に基づく使用収益権を⟪事実上放棄⟫し、当該共有者の処分にゆだねていたことなどにより、法定地上権の発生を⟪あらかじめ容認⟫していたとみることができる特段の事情がある場合でない限り、共有土地について法定地上権は⟪成立しない⟫と解する⦆⟨1⟩。","answers":["独立の持分","共有者全員の負担","388条本文","事実上放棄","あらかじめ容認","成立しない"],"check":"","notes":[{"n":1,"label":"最三小判 平成6・12・20","case":"最三小判 平成6・12・20　民集48巻8号1470頁","gist":"土地共有者の1人だけについて388条本文の事由が生じても、**他の共有者らが法定地上権の発生をあらかじめ容認していたとみることができる特段の事情**がない限り成立しない。特段の事情の有無は、**共有者間の人的関係のような公示されない事情ではなく客観的事情から**判断する。"}],"law":"","cites":["民法/388"],"rate":2,"designed":true,"ref":false,"hash":"4e09d8acdbad"},{"id":"民法/法定地上権_再築・共同抵当・共有#5","block":"第5","kind":"cloze","masked":"そして、⦅特段の事情の有無は、⟦ア⟧等によって⟦イ⟧に外部に公示された事情から判断すべきであり、共有者間の⟦ウ⟧のように第三者がうかがい知ることのできない事情によってこれを決してはならない⦆⟨1⟩。法定地上権の成否は、他の共有者のみならず、一般債権者・後順位抵当権者・競落人など第三者の⟦エ⟧に影響し、ひいては⟦オ⟧を左右するからである。","body":"そして、⦅特段の事情の有無は、⟪登記簿の記載⟫等によって⟪客観的かつ明確⟫に外部に公示された事情から判断すべきであり、共有者間の⟪人的関係⟫のように第三者がうかがい知ることのできない事情によってこれを決してはならない⦆⟨1⟩。法定地上権の成否は、他の共有者のみならず、一般債権者・後順位抵当権者・競落人など第三者の⟪期待と予測⟫に影響し、ひいては⟪執行手続の法的安定⟫を左右するからである。","answers":["登記簿の記載","客観的かつ明確","人的関係","期待と予測","執行手続の法的安定"],"check":"","notes":[{"n":1,"label":"最三小判 平成6・12・20","case":"最三小判 平成6・12・20　民集48巻8号1470頁","gist":"土地共有者の1人だけについて388条本文の事由が生じても、**他の共有者らが法定地上権の発生をあらかじめ容認していたとみることができる特段の事情**がない限り成立しない。特段の事情の有無は、**共有者間の人的関係のような公示されない事情ではなく客観的事情から**判断する。"}],"law":"","cites":[],"rate":0,"designed":true,"ref":false,"hash":"de27fd99a09a"},{"id":"民法/法定地上権_再築・共同抵当・共有#6","block":"第6〔建物が共有で、土地が単独所有の場合〕","kind":"cloze","masked":"⦅この場合は法定地上権が⟦ア⟧。建物共有者の一人がその敷地を単独で所有するときは、同人は⟦イ⟧のためにも⟦ウ⟧というべきだからである⦆⟨1⟩。","body":"⦅この場合は法定地上権が⟪成立する⟫。建物共有者の一人がその敷地を単独で所有するときは、同人は⟪自己のみならず他の建物共有者⟫のためにも⟪土地の利用を認めている⟫というべきだからである⦆⟨1⟩。","answers":["成立する","自己のみならず他の建物共有者","土地の利用を認めている"],"check":"","notes":[{"n":1,"label":"最判 昭和46・12・21","case":"最判 昭和46・12・21　民集25巻9号1610頁","gist":"**建物共有者の1人がその敷地を単独で所有する**場合、同人は自己のみならず他の建物共有者のためにも土地の利用を認めているというべきであるから、法定地上権が成立する。"}],"law":"","cites":[],"rate":0,"designed":true,"ref":false,"hash":"a13fd5ff1a5d"}],"setsurei":["Yは、A信用金庫のために、甲土地と地上の乙建物に共同根抵当権を設定した。その後YはAの承諾を得て乙建物を取り壊し、Aは甲土地を更地として担保価値を再評価して極度額を増額した。その後、甲土地上に丙建物が新築された。Aが甲土地の競売を申し立て、Xが買い受けた場合、丙建物のために法定地上権は成立するか。仮に、**丙建物についてAが甲土地の抵当権と同順位の共同抵当権の設定を受けていた**場合はどうか。","甲土地はA・B・Cの共有（B・CはAの妻子）、甲土地上の乙建物はA・D・Eの共有である。A・B・Cは、共同して、Aを債務者とする**金融機関Fに対する**債務を担保するため、甲土地の各持分に抵当権を設定した。抵当権が実行されXが甲土地を買い受け、Xが乙建物の共有者に対し建物収去土地明渡しを請求した。乙建物のために法定地上権は成立するか。**土地がAの単独所有で、乙建物のみがA・D・Eの共有であった**場合はどうか。"],"full":"(1) 土地のみに抵当権が設定され、その後建物が再築された場合\nこの場合も法定地上権は⟪成立する⟫。抵当権設定時に土地上に抵当権設定者の建物が存在した以上、抵当権者は⟪法定地上権の負担を覚悟⟫して土地を評価していたからである。もっとも、新建物を基準とすれば負担が旧建物のためのそれより重くなり抵当権者に不測の損害を与えるから、⦅その内容は⟪旧建物を基準⟫として定まると解する⦆⟨1⟩。\n\n(2) 土地および建物に共同抵当権が設定され、その後建物が再築された場合\n⦅この場合は、新建物の所有者が土地の所有者と⟪同一⟫であり、かつ、新建物が建築された時点で土地の抵当権者が新建物につき土地の抵当権と⟪同順位の共同抵当権⟫の設定を受けたとき等の⟪特段の事情⟫がない限り、新建物のために法定地上権は⟪成立しない⟫と解する⦆⟨1⟩。\n\n土地および建物に共同抵当権が設定された場合、抵当権者は⟪土地および建物全体⟫の担保価値を把握しているのであって、抵当権の設定された建物が存続する限りは当該建物のための法定地上権の成立を許容するが、建物が取り壊されたときは土地について法定地上権の制約のない⟪更地としての担保価値⟫を把握しようとするのが、抵当権設定当事者の⟪合理的意思⟫である。抵当権の設定されない新建物のために法定地上権の成立を認めれば、抵当権者は当初把握していた土地全体の価値を、法定地上権の価額相当額だけ減少した価値に限定されることになり、⟪不測の損害⟫を被るからである。建物保護の公益的要請は、抵当権設定当事者の合理的意思に反してまで重視すべきものではない。\n\n(3) 土地が共有の場合\n共有者は各自、共有物について所有権と性質を同じくする⟪独立の持分⟫を有し、かつ、共有地全体に対する地上権は⟪共有者全員の負担⟫となる。したがって、⦅土地共有者の一人だけについて⟪388条本文⟫により地上権を設定したものとみなすべき事由が生じたとしても、他の共有者らがその持分に基づく使用収益権を⟪事実上放棄⟫し、当該共有者の処分にゆだねていたことなどにより、法定地上権の発生を⟪あらかじめ容認⟫していたとみることができる特段の事情がある場合でない限り、共有土地について法定地上権は⟪成立しない⟫と解する⦆⟨1⟩。\n\nそして、⦅特段の事情の有無は、⟪登記簿の記載⟫等によって⟪客観的かつ明確⟫に外部に公示された事情から判断すべきであり、共有者間の⟪人的関係⟫のように第三者がうかがい知ることのできない事情によってこれを決してはならない⦆⟨1⟩。法定地上権の成否は、他の共有者のみならず、一般債権者・後順位抵当権者・競落人など第三者の⟪期待と予測⟫に影響し、ひいては⟪執行手続の法的安定⟫を左右するからである。\n\n(4) 建物が共有で、土地が単独所有の場合\n⦅この場合は法定地上権が⟪成立する⟫。建物共有者の一人がその敷地を単独で所有するときは、同人は⟪自己のみならず他の建物共有者⟫のためにも⟪土地の利用を認めている⟫というべきだからである⦆⟨1⟩。","kata":"","hanrei":[["最三小判 平成9・2・14　民集51巻2号375頁","所有者が土地及び地上建物に共同抵当権を設定した後、建物が取り壊され新建物が建築された場合、**新建物の所有者が土地の所有者と同一であり、かつ新建物につき土地の抵当権と同順位の共同抵当権の設定を受けたとき等特段の事情のない限り、新建物のために法定地上権は成立しない**。","**百選Ⅰ〔第9版〕89番＝〔第8版〕92番＝〔第7版〕89番**（解説は第8版・第9版とも道垣内弘人）。**大判昭13・5・25 を変更**。判時1597号、判タ936号111頁"],["最三小判 平成6・12・20　民集48巻8号1470頁","土地共有者の1人だけについて388条本文の事由が生じても、**他の共有者らが法定地上権の発生をあらかじめ容認していたとみることができる特段の事情**がない限り成立しない。特段の事情の有無は、**共有者間の人的関係のような公示されない事情ではなく客観的事情から**判断する。","**百選Ⅰ〔第9版〕90番＝〔第8版〕93番＝〔第7版〕90番**（解説は第8版＝髙橋眞／**第9版＝平野秀文**）。判時1519号73頁。千種秀夫裁判官の補足意見あり"],["最判 平成9・6・5　民集51巻5号2116頁","新建物につき土地抵当権と同順位の共同抵当権の設定を受けた場合でも、**新建物の抵当権の被担保債権に法律上優先する債権が存在する**ときは、特段の事情にあたらず法定地上権は成立しない。","事案は抵当権に優先する国税債権"],["最判 平成10・7・3　判時1652号","新建物につき土地抵当権者のために**第3順位**の抵当権が設定された事案は、特段の事情のある場合に該当しない。",""],["東京高決 昭和53・3・27　判時888号93頁","更地に抵当権が設定された後に築造された建物につき抵当権者が共同抵当権の設定を受けた場合、抵当権の実行により**法定地上権が成立する**。","成立を認めても抵当権者の利益を害しない"],["大判 昭和10・8・10　民集14巻1549頁","土地のみに抵当権が設定された後に建物が再築された場合、法定地上権は成立するが、その内容は**旧建物を基準**として定まる。",""],["最判 昭和52・10・11　民集31巻6号785頁","抵当権者が設定時に非堅固建物から堅固建物への建替えに同意し、堅固建物を基準とする法定地上権の成立を前提に担保価値を評価していた場合、「特段の事情」として**新建物を基準**とする法定地上権の成立を認める。","教科書は**事案限りの判断**とし、一般化を批判。答案で一般命題として使わない"],["最判 昭和29・12・23　民集8巻12号2235頁","共有者の一部がした共有地の地上権設定行為に**同意しなかった共有者の持分**はその処分に服すべきいわれがなく、法定地上権も同様。土地共有者の1人の持分への抵当権設定では成立しない。","共有型の出発点"],["最判 昭和44・11・4　民集23巻11号1968頁","土地共有・建物単独所有で建物に抵当権が設定された場合、原則として成立しないが、**他の共有者が事態の発生をあらかじめ容認していた**ときはこの原則は妥当しない。","百選解説は、事案は厳密には共有地上建物の法定地上権の事案とはいえないと指摘"],["最判 平成6・4・7　民集48巻3号889頁","土地も建物もA・B共有の場合に、**土地の共有持分が強制競売により売却された**とき、法定地上権は成立しない。持分に対する抵当権に基づく競売も同様。","民執81条の事例。理由＝Bがその意思に基づかず使用収益権を害される"],["最判 昭和46・12・21　民集25巻9号1610頁","**建物共有者の1人がその敷地を単独で所有する**場合、同人は自己のみならず他の建物共有者のためにも土地の利用を認めているというべきであるから、法定地上権が成立する。",""],["東京地裁執行処分 平成4・6・8","敷地の抵当権者が滅失した旧建物についても抵当権の設定を受けることにより土地の担保価値の全部を把握していたとして、新建物のための法定地上権の成立を否定。","平9・2・14 の先駆け。出典表記はDB内で金法1324号36頁／判タ785号198頁の両方が見られ、**確定できない**（`[カニの推論]` として、答案では引用しない）"]],"field":"抵当権","order":15},{"name":"法定地上権_成立要件","subject":"民法","rank":"A","path":"まとめ/民法/論証/法定地上権_成立要件.md","cards":[{"id":"民法/法定地上権_成立要件#1","block":"第1〔要件〕","kind":"cloze","masked":"法定地上権が成立するには、①抵当権設定時に土地上に⟦ア⟧すること、②抵当権設定時に土地と建物が⟦イ⟧に属すること、③その土地または建物につき抵当権が設定されたこと、④⟦ウ⟧により所有者を異にするに至ったことを要する。","body":"法定地上権が成立するには、①抵当権設定時に土地上に⟪建物が存在⟫すること、②抵当権設定時に土地と建物が⟪同一の所有者⟫に属すること、③その土地または建物につき抵当権が設定されたこと、④⟪抵当権の実行⟫により所有者を異にするに至ったことを要する。","answers":["建物が存在","同一の所有者","抵当権の実行"],"check":"①**設定時に建物存在**（明文なし）②**設定時に同一所有者**③土地又は建物に抵当権④**実行により所有者を異にするに至った**","notes":[],"law":"","cites":[],"rate":0,"designed":true,"ref":false,"hash":"c1b0f37f5d9d"},{"id":"民法/法定地上権_成立要件#2","block":"第2〔基準時〕","kind":"cloze","masked":"①②の基準時は⟦ア⟧であり、競売時の事情は問わない。⦅設定時に同一所有者であれば、その後別人所有となっても成立する⦆⟨1⟩。⦅逆に設定時に別人所有であれば、競売時にたまたま同一人に帰していても⟦イ⟧⦆⟨2⟩。設定時に別人所有であったなら、当事者は⟦ウ⟧を設定する機会があった以上、法定地上権による保護を与える必要がないからである。","body":"①②の基準時は⟪抵当権設定時⟫であり、競売時の事情は問わない。⦅設定時に同一所有者であれば、その後別人所有となっても成立する⦆⟨1⟩。⦅逆に設定時に別人所有であれば、競売時にたまたま同一人に帰していても⟪成立しない⟫⦆⟨2⟩。設定時に別人所有であったなら、当事者は⟪約定利用権⟫を設定する機会があった以上、法定地上権による保護を与える必要がないからである。","answers":["抵当権設定時","成立しない","約定利用権"],"check":"**抵当権設定時**／後に別人化しても成立／設定時別人なら競売時同一でも不成立＝**約定利用権を設定する機会があった**","notes":[{"n":1,"label":"大連判大12・12・14","case":"大連判 大正12・12・14","gist":"抵当権設定時に同一所有者であれば、その後所有者が別人となっても法定地上権が成立する。"},{"n":2,"label":"最判昭44・2・14","case":"最判 昭和44・2・14","gist":"抵当権設定当時に土地・建物の所有者が各別である以上、競売の際にたまたま同一人に帰していても**388条は適用も準用もされない**。"}],"law":"","cites":[],"rate":0,"designed":true,"ref":false,"hash":"88d2ee6cbe26"},{"id":"民法/法定地上権_成立要件#3","block":"第3〔複数抵当権〕","kind":"cloze","masked":"⦅抵当権が複数存在するときは、競売により消滅する⟦ア⟧の設定時を基準とする⦆⟨1⟩。抵当権は被担保債権の存する限度でしか存続しない以上、後順位抵当権者は、先順位抵当権の消滅による⟦イ⟧と法定地上権成立の不利益とを、あらかじめ織り込んで⟦ウ⟧を把握すべきだからである。⦅したがって競売前にすでに消滅していた抵当権は⟦エ⟧⦆⟨2⟩。","body":"⦅抵当権が複数存在するときは、競売により消滅する⟪最先順位の抵当権⟫の設定時を基準とする⦆⟨1⟩。抵当権は被担保債権の存する限度でしか存続しない以上、後順位抵当権者は、先順位抵当権の消滅による⟪順位上昇の利益⟫と法定地上権成立の不利益とを、あらかじめ織り込んで⟪担保余力⟫を把握すべきだからである。⦅したがって競売前にすでに消滅していた抵当権は⟪基準とならない⟫⦆⟨2⟩。","answers":["最先順位の抵当権","順位上昇の利益","担保余力","基準とならない"],"check":"**競売により消滅する最先順位の抵当権の設定時**／**競売前に消滅した抵当権は基準にしない**／理由＝**順位上昇の利益と不利益の織り込み**","notes":[{"n":1,"label":"最判平19・7・6","case":"最二小判 平成19・7・6　民集61巻5号1940頁","gist":"甲（先順位）抵当権が設定契約の解除により**競売前に消滅**し、その後乙（後順位）抵当権の実行により所有者を異にした場合、甲抵当権設定時に同一所有者でなくても、**乙抵当権設定時に同一所有者であれば法定地上権が成立**する。"},{"n":2,"label":"最判平19・7・6","case":"最二小判 平成19・7・6　民集61巻5号1940頁","gist":"甲（先順位）抵当権が設定契約の解除により**競売前に消滅**し、その後乙（後順位）抵当権の実行により所有者を異にした場合、甲抵当権設定時に同一所有者でなくても、**乙抵当権設定時に同一所有者であれば法定地上権が成立**する。"}],"law":"","cites":[],"rate":0,"designed":true,"ref":false,"hash":"7acf0ac27395"},{"id":"民法/法定地上権_成立要件#4","block":"第4〔登記〕","kind":"cloze","masked":"⦅②は⟦ア⟧によって判断され、登記の具備は⟦イ⟧⦆⟨1⟩⟨2⟩。抵当権者は⟦ウ⟧により建物の存在と所有関係を知りうるから、不測の損害を被るおそれがないためである。","body":"⦅②は⟪実体上の所有関係⟫によって判断され、登記の具備は⟪要件ではない⟫⦆⟨1⟩⟨2⟩。抵当権者は⟪現況調査⟫により建物の存在と所有関係を知りうるから、不測の損害を被るおそれがないためである。","answers":["実体上の所有関係","要件ではない","現況調査"],"check":"**不要**（実体上の所有関係）＝**現況調査で知りうる＝不測の損害なし**","notes":[{"n":1,"label":"最判昭48・9・18","case":"最判 昭和48・9・18　民集27巻8号1066頁","gist":"**土地に抵当権を設定した時点で、建物の所有名義が前主Mのまま**（Aへの移転登記未了）でも法定地上権が成立する。"},{"n":2,"label":"最判昭53・9・29","case":"最判 昭和53・9・29　民集32巻6号1210頁","gist":"**土地の所有名義が前主のまま**（建物のみに抵当権）でも法定地上権が成立する。"}],"law":"","cites":[],"rate":0,"designed":true,"ref":false,"hash":"2fcae961566f"},{"id":"民法/法定地上権_成立要件#5","block":"第5〔更地〕","kind":"cloze","masked":"⦅他方、更地に抵当権が設定された後に建物が築造された場合は⟦ア⟧、法定地上権は成立しない⦆⟨1⟩。抵当権者は⟦イ⟧を把握して設定を受けたからであり、⦅抵当権者が建築をあらかじめ⟦ウ⟧としても結論は変わらない⦆⟨2⟩。この場合、抵当権者は土地とともに建物を競売できるが（⟦エ⟧・389条1項本文）、優先権は⟦オ⟧についてのみ行使できる（⟦カ⟧）。","body":"⦅他方、更地に抵当権が設定された後に建物が築造された場合は⟪①を欠き⟫、法定地上権は成立しない⦆⟨1⟩。抵当権者は⟪更地としての担保価値⟫を把握して設定を受けたからであり、⦅抵当権者が建築をあらかじめ⟪承認していた⟫としても結論は変わらない⦆⟨2⟩。この場合、抵当権者は土地とともに建物を競売できるが（⟪一括競売⟫・389条1項本文）、優先権は⟪土地の代価⟫についてのみ行使できる（⟪同項ただし書⟫）。","answers":["①を欠き","更地としての担保価値","承認していた","一括競売","土地の代価","同項ただし書"],"check":"①の欠缺で不成立＝**更地としての担保価値の把握**／承認があっても同じ／**389条1項＝一括競売・優先権は土地の代価のみ**","notes":[{"n":1,"label":"最判昭36・2・10","case":"最判 昭和36・2・10　民集15巻2号219頁","gist":"土地の抵当権設定当時に建物が存在しなければ、**抵当権者が建物の築造をあらかじめ承認していても**法定地上権は成立しない。"},{"n":2,"label":"最判昭36・2・10","case":"最判 昭和36・2・10　民集15巻2号219頁","gist":"土地の抵当権設定当時に建物が存在しなければ、**抵当権者が建物の築造をあらかじめ承認していても**法定地上権は成立しない。"}],"law":"","cites":["民法/389"],"rate":12,"designed":true,"ref":false,"hash":"7154ee5538c9"}],"setsurei":["A所有の甲土地上にA所有の乙建物が建っている。甲土地にBの抵当権が設定され、実行によりCが甲土地を取得した。もっとも乙建物の登記名義は、抵当権設定時にはAの前主M名義のままであった。乙建物のために法定地上権は成立するか。","甲土地はA、その上の乙建物はDの所有であった。甲土地にBの1番抵当権が設定された後、DがAから甲土地を買い受け、甲土地にCの2番抵当権が設定された。Cの申立てにより甲土地が競売され、Eが買い受けた。法定地上権は成立するか。**1番抵当権が競売前に解除により消滅していた場合**はどうか。"],"full":"法定地上権が成立するには、①抵当権設定時に土地上に⟪建物が存在⟫すること、②抵当権設定時に土地と建物が⟪同一の所有者⟫に属すること、③その土地または建物につき抵当権が設定されたこと、④⟪抵当権の実行⟫により所有者を異にするに至ったことを要する。\n\n①②の基準時は⟪抵当権設定時⟫であり、競売時の事情は問わない。⦅設定時に同一所有者であれば、その後別人所有となっても成立する⦆⟨1⟩。⦅逆に設定時に別人所有であれば、競売時にたまたま同一人に帰していても⟪成立しない⟫⦆⟨2⟩。設定時に別人所有であったなら、当事者は⟪約定利用権⟫を設定する機会があった以上、法定地上権による保護を与える必要がないからである。\n\n⦅抵当権が複数存在するときは、競売により消滅する⟪最先順位の抵当権⟫の設定時を基準とする⦆⟨1⟩。抵当権は被担保債権の存する限度でしか存続しない以上、後順位抵当権者は、先順位抵当権の消滅による⟪順位上昇の利益⟫と法定地上権成立の不利益とを、あらかじめ織り込んで⟪担保余力⟫を把握すべきだからである。⦅したがって競売前にすでに消滅していた抵当権は⟪基準とならない⟫⦆⟨2⟩。\n\n⦅②は⟪実体上の所有関係⟫によって判断され、登記の具備は⟪要件ではない⟫⦆⟨1⟩⟨2⟩。抵当権者は⟪現況調査⟫により建物の存在と所有関係を知りうるから、不測の損害を被るおそれがないためである。\n\n⦅他方、更地に抵当権が設定された後に建物が築造された場合は⟪①を欠き⟫、法定地上権は成立しない⦆⟨1⟩。抵当権者は⟪更地としての担保価値⟫を把握して設定を受けたからであり、⦅抵当権者が建築をあらかじめ⟪承認していた⟫としても結論は変わらない⦆⟨2⟩。この場合、抵当権者は土地とともに建物を競売できるが（⟪一括競売⟫・389条1項本文）、優先権は⟪土地の代価⟫についてのみ行使できる（⟪同項ただし書⟫）。","kata":"","hanrei":[["最二小判 平成19・7・6　民集61巻5号1940頁","甲（先順位）抵当権が設定契約の解除により**競売前に消滅**し、その後乙（後順位）抵当権の実行により所有者を異にした場合、甲抵当権設定時に同一所有者でなくても、**乙抵当権設定時に同一所有者であれば法定地上権が成立**する。","**百選Ⅰ〔第9版〕88番（＝〔第8版〕91番・〔第7版〕88番）**。解説執筆者は第9版＝阿部裕介／第8版＝松本恒雄。事案は建物共有"],["最判 平成2・1・22　民集44巻1号314頁","土地の1番抵当権設定当時に土地・建物の所有者が異なっていた場合、その後同一人に帰属して後順位抵当権が設定されても、**競落により1番抵当権が消滅するときは法定地上権は成立しない**。","1番抵当権者が把握した担保価値を損なわせるから"],["最判 昭和44・2・14","抵当権設定当時に土地・建物の所有者が各別である以上、競売の際にたまたま同一人に帰していても**388条は適用も準用もされない**。","理由＝土地利用権は混同の例外（179条1項ただし書）として存続"],["大連判 大正12・12・14","抵当権設定時に同一所有者であれば、その後所有者が別人となっても法定地上権が成立する。","設定時基準の反対側"],["最判 昭和36・2・10　民集15巻2号219頁","土地の抵当権設定当時に建物が存在しなければ、**抵当権者が建物の築造をあらかじめ承認していても**法定地上権は成立しない。","更地として評価して設定された"],["最判 昭和47・11・2","**先順位**抵当権の設定当時に建物がなければ、後順位抵当権者の申立てによる競売でも法定地上権は成立しない。","民集の巻号頁はDB内に出典なし（判示内容は短答2箇所で裏取り済み）"],["大判 昭和14・12・19","抵当権設定当時に地上建物の**保存登記がなくても**法定地上権が成立する。","同上"],["最判 昭和53・9・29　民集32巻6号1210頁","**土地の所有名義が前主のまま**（建物のみに抵当権）でも法定地上権が成立する。",""],["最判 昭和48・9・18　民集27巻8号1066頁","**土地に抵当権を設定した時点で、建物の所有名義が前主Mのまま**（Aへの移転登記未了）でも法定地上権が成立する。","**2026-07-29 にDBで裏が取れたので復活**（`講義 物権・担保物権法』p.340＝判示＋登載誌／アガルート『総合講義-民法』p.163）。**昭53・9・29 と対になる**（あちらは建物に抵当権・土地が前主名義）"]],"field":"抵当権","order":14},{"name":"法定解除の要件_541条・542条","subject":"民法","rank":"A","path":"まとめ/民法/論証/法定解除の要件_541条・542条.md","cards":[{"id":"民法/法定解除の要件_541条・542条#1","block":"第1〔解除の性質と債務者の帰責事由〕","kind":"cloze","masked":"債務不履行を理由とする解除は、債務者に対する⟦ア⟧の手段ではなく、債務の履行を得られなかった債権者を⟦イ⟧するための手段である。したがって、債務者の⟦ウ⟧。債務者が「不履行は自己の責めに帰することができない事由による」と主張しても、⟦エ⟧である。","body":"債務不履行を理由とする解除は、債務者に対する⟪責任追及⟫の手段ではなく、債務の履行を得られなかった債権者を⟪契約の拘束力から解放⟫するための手段である。したがって、債務者の⟪帰責事由は解除の要件ではない⟫。債務者が「不履行は自己の責めに帰することができない事由による」と主張しても、⟪主張自体失当⟫である。","answers":["責任追及","契約の拘束力から解放","帰責事由は解除の要件ではない","主張自体失当"],"check":"①解除＝責任追及ではなく**債権者を契約の拘束力から解放**する制度 ②**債務者の帰責事由は要件でない** ③債務者の「自分に帰責事由がない」という主張は**主張自体失当**","notes":[],"law":"","cites":[],"rate":0,"designed":true,"ref":false,"hash":"b6bc34c9d487"},{"id":"民法/法定解除の要件_541条・542条#2","block":"第2〔催告解除の要件（541条本文）〕","kind":"cloze","masked":"当事者の一方がその債務を履行しない場合において、相手方が⟦ア⟧その履行の催告をし、その期間内に履行がないときは、相手方は契約を解除することができる（⟦イ⟧）。すなわち、①債務の不履行、②履行の催告、③催告後の相当期間の経過、④⟦ウ⟧が要件である。双務契約において自己の債務が先履行でないときは、⑤催告に先立つ⟦エ⟧も必要である。⟦オ⟧が存在する限り相手方の不履行は正当化されるから、これを否定しなければ解除は認められないからである。\n催告は、債務者に⟪最後の履行の機会⟫を与える趣旨であるから、⦅相当の期間を定めなかった催告や不相当に短い期間を定めた催告も⟦カ⟧であり、催告の時から⟪客観的に相当の期間が経過⟫すれば解除することができる⦆⟨1⟩と解する。同じ趣旨から、催告に際して履行がなければ解除する旨を⟦キ⟧。また、期限の定めのない債務については、履行遅滞に付するための催告（412条3項）と解除のための催告（541条）を兼ねることができ、⟦ク⟧。","body":"当事者の一方がその債務を履行しない場合において、相手方が⟪相当の期間を定めて⟫その履行の催告をし、その期間内に履行がないときは、相手方は契約を解除することができる（⟪541条本文⟫）。すなわち、①債務の不履行、②履行の催告、③催告後の相当期間の経過、④⟪解除の意思表示⟫が要件である。双務契約において自己の債務が先履行でないときは、⑤催告に先立つ⟪反対給付の履行の提供⟫も必要である。⟪同時履行の抗弁権⟫が存在する限り相手方の不履行は正当化されるから、これを否定しなければ解除は認められないからである。\n催告は、債務者に⟪最後の履行の機会⟫を与える趣旨であるから、⦅相当の期間を定めなかった催告や不相当に短い期間を定めた催告も⟪有効⟫であり、催告の時から⟪客観的に相当の期間が経過⟫すれば解除することができる⦆⟨1⟩と解する。同じ趣旨から、催告に際して履行がなければ解除する旨を⟪付言することも要しない⟫。また、期限の定めのない債務については、履行遅滞に付するための催告（412条3項）と解除のための催告（541条）を兼ねることができ、⟪二度の催告を要しない⟫。","answers":["相当の期間を定めて","541条本文","解除の意思表示","反対給付の履行の提供","同時履行の抗弁権","有効","付言することも要しない","二度の催告を要しない"],"check":"①**541条本文** ②要件＝**不履行／催告／催告後の相当期間の経過／解除の意思表示** ③双務契約で先履行でなければ**催告に先立つ反対給付の履行の提供**（理由＝同時履行の抗弁の存在を否定する必要） ④**相当期間を定めない催告・不相当に短い催告も有効**（客観的に相当期間が経過すれば解除できる） ⑤理由＝催告の趣旨は**最後の履行の機会を与える**こと ⑥**「解除する」旨の付言は不要** ⑦**二重催告不要**（412条3項の催告と541条の催告は兼ねられる）","notes":[{"n":1,"label":"最判昭29・12・21","case":"**最判 昭29・12・21**（民集8巻12号2211頁）／大判 昭2・2・2（民集6巻133頁）","gist":"**相当の期間を定めない催告・不相当に短い期間を定めた催告も無効ではなく**、催告の時から客観的にみて相当の期間が経過すれば解除権が発生する"}],"law":"","cites":["民法/541","民法/412"],"rate":16,"designed":true,"ref":false,"hash":"722107741906"},{"id":"民法/法定解除の要件_541条・542条#3","block":"第3〔軽微性（541条ただし書）〕","kind":"cloze","masked":"ただし、催告期間を経過した時における債務の不履行が、その契約及び⟦ア⟧に照らして⟦イ⟧であるときは、解除をすることができない（⟦ウ⟧）。不履行が軽微にとどまる場合は、債権者は⟪損害賠償等の救済⟫によって満足すべきであり、契約の拘束力を失わせるまでの必要がないからである。\n軽微か否かは、⟦エ⟧を基準に、①違反された⟦オ⟧が契約全体からみて軽微か（付随的な債務にすぎないか）、②義務違反の⟦カ⟧が軽微か（不履行部分が数量的にわずかにとどまるか）を、当該契約の性質・目的・締結に至る経緯その他の取引上の事情に照らして判断すると解する。\nもっとも、軽微性は⟪契約目的の達成が不能⟫であることと同義ではないから、債務者が「契約目的の達成はなお可能である」と主張・立証しても、それだけでは解除を免れない。契約に付加された債務の不履行であっても、それが⦅⟦キ⟧を与える⦆⟨1⟩ときは、軽微とはいえず、解除が認められる。\n軽微であることは、⟦ク⟧が主張・立証責任を負う。","body":"ただし、催告期間を経過した時における債務の不履行が、その契約及び⟪取引上の社会通念⟫に照らして⟪軽微⟫であるときは、解除をすることができない（⟪541条ただし書⟫）。不履行が軽微にとどまる場合は、債権者は⟪損害賠償等の救済⟫によって満足すべきであり、契約の拘束力を失わせるまでの必要がないからである。\n軽微か否かは、⟪催告期間の経過時⟫を基準に、①違反された⟪債務自体⟫が契約全体からみて軽微か（付随的な債務にすぎないか）、②義務違反の⟪態様⟫が軽微か（不履行部分が数量的にわずかにとどまるか）を、当該契約の性質・目的・締結に至る経緯その他の取引上の事情に照らして判断すると解する。\nもっとも、軽微性は⟪契約目的の達成が不能⟫であることと同義ではないから、債務者が「契約目的の達成はなお可能である」と主張・立証しても、それだけでは解除を免れない。契約に付加された債務の不履行であっても、それが⦅⟪契約締結の目的の達成に重大な影響⟫を与える⦆⟨1⟩ときは、軽微とはいえず、解除が認められる。\n軽微であることは、⟪解除を争う債務者⟫が主張・立証責任を負う。","answers":["取引上の社会通念","軽微","541条ただし書","催告期間の経過時","債務自体","態様","契約締結の目的の達成に重大な影響","解除を争う債務者"],"check":"①**541条ただし書** ②文言＝「その契約及び**取引上の社会通念**に照らして**軽微**であるとき」 ③判断基準時＝**催告期間の経過時** ④考慮要素＝**(a)違反された債務自体の軽微さ（付随的な債務にすぎないか）／(b)違反の態様の軽微さ（数量的にわずかか）／(c)契約の性質・目的・締結の経緯等の取引上の事情** ⑤理由＝軽微なら**損害賠償等で満足すべき** ⑥**「契約目的の達成は可能」の主張だけでは解除を免れない**（軽微性≠目的達成不能） ⑦**契約締結の目的の達成に重大な影響を与える**ときは軽微でない ⑧**主張立証責任は解除を争う債務者**（ただし書方式・規範的要件なので評価根拠事実）","notes":[{"n":1,"label":"最判昭43・2・23","case":"**最二小判 昭43・2・23**（民集22巻2号281頁）","gist":"分割払いの土地売買に付された「代金完済まで買主は土地上に工作物を築造しない」旨の特別の約款は、外見上付随的で契約締結の目的には必要不可欠でないが、**売主にとって代金の完全な支払の確保のために重要な意義**をもち買主もその趣旨で合意した以上、その不履行は**契約締結の目的の達成に重大な影響を与える**から、当該約款の債務は要素たる債務に入り、その不履行を理由に売主は解除できる"}],"law":"","cites":["民法/541"],"rate":9,"designed":true,"ref":false,"hash":"487d2b53dc98"},{"id":"民法/法定解除の要件_541条・542条#4","block":"第4〔無催告解除（542条1項）——全部不能・全部拒絶〕","kind":"cloze","masked":"次の場合には、債権者は、541条の催告をすることなく、⟦ア⟧をすることができる（⟦イ⟧。2項の一部解除と対比して全部解除である）。債務者に⟦ウ⟧からである。\n⟪1号⟫ 債務の⟦エ⟧であるとき。\n⟪2号⟫ 債務者がその債務の⟦オ⟧したとき。\n履行不能には後発的不能のみならず⟦カ⟧も含まれ、明確な履行拒絶には履行期後のものだけでなく⟦キ⟧のものも含まれる。","body":"次の場合には、債権者は、541条の催告をすることなく、⟪直ちに契約の解除⟫をすることができる（⟪542条1項⟫。2項の一部解除と対比して全部解除である）。債務者に⟪履行の機会を与えても意味がない⟫からである。\n⟪1号⟫ 債務の⟪全部の履行が不能⟫であるとき。\n⟪2号⟫ 債務者がその債務の⟪全部の履行を拒絶する意思を明確に表示⟫したとき。\n履行不能には後発的不能のみならず⟪原始的不能⟫も含まれ、明確な履行拒絶には履行期後のものだけでなく⟪履行期前⟫のものも含まれる。","answers":["直ちに契約の解除","542条1項","履行の機会を与えても意味がない","全部の履行が不能","全部の履行を拒絶する意思を明確に表示","原始的不能","履行期前"],"check":"①**542条1項** ②趣旨＝**履行の機会を与えても意味がない** ③**1号＝全部の履行不能** ④**2号＝全部の履行拒絶の意思の明確な表示** ⑤履行不能は**原始的不能を含む**・履行拒絶は**履行期前を含む**","notes":[],"law":"","cites":["民法/541","民法/542"],"rate":23,"designed":true,"ref":false,"hash":"dc9320c9a44c"},{"id":"民法/法定解除の要件_541条・542条#5","block":"第5〔無催告解除（542条1項）——一部不能・定期行為・受け皿〕","kind":"cloze","masked":"⟪3号⟫ 債務の⟪一部⟫の履行が不能である場合、又は債務者がその債務の⟪一部⟫の履行を拒絶する意思を明確に表示した場合において、⟦ア⟧とき（この場合は⟦イ⟧解除である）。\n⟪4号⟫ 契約の性質又は当事者の意思表示により、特定の日時又は一定の期間内に履行をしなければ契約をした目的を達することができない場合（⟦ウ⟧）において、債務者が履行をしないで⟦エ⟧したとき。\n⟪5号⟫ 前各号のほか、債務者がその債務の履行をせず、⟦オ⟧ことが明らかであるとき。契約目的の達成不能を理由とする解除の⟦カ⟧となる規定である。","body":"⟪3号⟫ 債務の⟪一部⟫の履行が不能である場合、又は債務者がその債務の⟪一部⟫の履行を拒絶する意思を明確に表示した場合において、⟪残存する部分のみでは契約をした目的を達することができない⟫とき（この場合は⟪全部⟫解除である）。\n⟪4号⟫ 契約の性質又は当事者の意思表示により、特定の日時又は一定の期間内に履行をしなければ契約をした目的を達することができない場合（⟪定期行為⟫）において、債務者が履行をしないで⟪その時期を経過⟫したとき。\n⟪5号⟫ 前各号のほか、債務者がその債務の履行をせず、⟪催告をしても契約をした目的を達するのに足りる履行がされる見込みがない⟫ことが明らかであるとき。契約目的の達成不能を理由とする解除の⟪受け皿⟫となる規定である。","answers":["残存する部分のみでは契約をした目的を達することができない","全部","定期行為","その時期を経過","催告をしても契約をした目的を達するのに足りる履行がされる見込みがない","受け皿"],"check":"①**3号＝一部不能・一部拒絶＋残存部分のみでは契約目的を達することができない**→**全部**解除 ②**4号＝定期行為**（特定の日時・一定の期間内に履行しなければ目的を達せない場合に、履行せず時期を経過） ③**5号＝催告をしても契約目的を達するのに足りる履行の見込みがないことが明らか**（受け皿規定）","notes":[],"law":"","cites":[],"rate":0,"designed":true,"ref":false,"hash":"14c01f1ead89"},{"id":"民法/法定解除の要件_541条・542条#6","block":"第6〔一部解除（542条2項）〕","kind":"cloze","masked":"債務の⟪一部⟫の履行が不能であるとき（1号）、又は債務者がその債務の⟪一部⟫の履行を拒絶する意思を明確に表示したとき（2号）は、債権者は、催告をすることなく直ちに⟦ア⟧を解除することができる（⟦イ⟧）。⟦ウ⟧ときは全部解除（⟦エ⟧）となり、達することができるときは一部解除にとどまる。","body":"債務の⟪一部⟫の履行が不能であるとき（1号）、又は債務者がその債務の⟪一部⟫の履行を拒絶する意思を明確に表示したとき（2号）は、債権者は、催告をすることなく直ちに⟪契約の一部⟫を解除することができる（⟪542条2項⟫）。⟪残存部分のみでは契約目的を達することができない⟫ときは全部解除（⟪542条1項3号⟫）となり、達することができるときは一部解除にとどまる。","answers":["契約の一部","542条2項","残存部分のみでは契約目的を達することができない","542条1項3号"],"check":"①**542条2項** ②**1号＝一部不能／2号＝一部の履行拒絶** ③効果＝催告なしに**契約の一部**の解除 ④**1項3号との振り分け＝残存部分のみで契約目的を達せるか**（達せない→1項3号で全部／達せる→2項で一部）","notes":[],"law":"","cites":["民法/542"],"rate":40,"designed":true,"ref":false,"hash":"0e1f3e98bab6"},{"id":"民法/法定解除の要件_541条・542条#7","block":"第7〔債権者の帰責事由（543条）〕","kind":"cloze","masked":"債務の不履行が⟦ア⟧の責めに帰すべき事由によるものであるときは、債権者は、⟦イ⟧による契約の解除をすることができない（⟦ウ⟧）。不履行の⟦エ⟧は帰責事由のある債権者が負担すべきであり、債権者に契約の拘束力からの離脱を認める必要はないからである。","body":"債務の不履行が⟪債権者⟫の責めに帰すべき事由によるものであるときは、債権者は、⟪541条・542条⟫による契約の解除をすることができない（⟪543条⟫）。不履行の⟪リスク⟫は帰責事由のある債権者が負担すべきであり、債権者に契約の拘束力からの離脱を認める必要はないからである。","answers":["債権者","541条・542条","543条","リスク"],"check":"①**543条** ②向き＝**債務の不履行が「債権者」の責めに帰すべき事由によるときは「債権者」は解除できない** ③かかる範囲＝**「前二条」＝541条・542条の両方** ④理由＝不履行のリスクは帰責事由のある債権者が負担すべき ⑤**536条2項と同趣旨** ⑥**双方無帰責なら543条は適用されず解除できる**","notes":[],"law":"","cites":["民法/541","民法/542","民法/543"],"rate":32,"designed":true,"ref":false,"hash":"a59a4dbcc4be"}],"setsurei":["甲は、令和5年4月1日、乙に対し、甲所有の本件土地を代金600万円で売った。代金は、契約時に内金80万円を支払い、残額は同月以降毎月11日に5万円ずつ分割して支払うものとされた。あわせて、(ア)所有権移転登記手続は代金完済と同時にすること、(イ)代金完済まで乙は本件土地上に建物その他の工作物を築造しないこと、という約定が付された。 乙の分割金の支払は滞っていない。ところが乙は、令和6年6月頃から、甲に無断で本件土地上に住宅建築のためのブロック基礎工事を始めた。甲は、同年7月1日、乙に対し、2週間の期限を定めて工事の中止と原状回復を催告したが、乙は理由なくこれを拒絶し、期限を過ぎても工事を続けた。甲は同月20日、乙に対し本件売買契約を解除する旨の意思表示をした。 (1) 甲の解除は有効か。 (2) 乙の違反が、本件土地の隅に高さ30cmの犬小屋を1つ置いたにとどまり、催告後もこれを撤去しなかったというものであった場合はどうか。","甲は、令和6年3月1日、乙に対し、甲所有の中古工作機械3台（A機・B機・C機。いずれも代金500万円、合計1500万円）を売り、引渡しと代金の支払はいずれも同年5月1日と定めた。3台は乙の新工場の製造ラインを構成するもので、3台そろわなければラインは稼働しない。この点は契約締結時に甲乙間で確認されていた。 (1) 同年4月10日、機械が保管されていた甲の倉庫が落雷による火災で焼失し、A機・B機・C機のすべてが滅失した。乙は、代金を支払うことなく本件売買契約を解除することができるか。 (2) (1)の火災が、乙が甲の倉庫を下見した際にくわえていたタバコの火の不始末によるものであった場合はどうか。 (3) 同じ火災でC機のみが滅失し、A機・B機は無事であった場合はどうか。(ア)3台そろわなければラインが稼働しない場合と、(イ)C機は同型機を他から容易に調達でき、A機・B機の2台だけでも当面の生産に支障がない場合とを分けて論じよ。"],"full":"債務不履行を理由とする解除は、債務者に対する⟪責任追及⟫の手段ではなく、債務の履行を得られなかった債権者を⟪契約の拘束力から解放⟫するための手段である。したがって、債務者の⟪帰責事由は解除の要件ではない⟫。債務者が「不履行は自己の責めに帰することができない事由による」と主張しても、⟪主張自体失当⟫である。\n\n当事者の一方がその債務を履行しない場合において、相手方が⟪相当の期間を定めて⟫その履行の催告をし、その期間内に履行がないときは、相手方は契約を解除することができる（⟪541条本文⟫）。すなわち、①債務の不履行、②履行の催告、③催告後の相当期間の経過、④⟪解除の意思表示⟫が要件である。双務契約において自己の債務が先履行でないときは、⑤催告に先立つ⟪反対給付の履行の提供⟫も必要である。⟪同時履行の抗弁権⟫が存在する限り相手方の不履行は正当化されるから、これを否定しなければ解除は認められないからである。\n催告は、債務者に⟪最後の履行の機会⟫を与える趣旨であるから、⦅相当の期間を定めなかった催告や不相当に短い期間を定めた催告も⟪有効⟫であり、催告の時から⟪客観的に相当の期間が経過⟫すれば解除することができる⦆⟨1⟩と解する。同じ趣旨から、催告に際して履行がなければ解除する旨を⟪付言することも要しない⟫。また、期限の定めのない債務については、履行遅滞に付するための催告（412条3項）と解除のための催告（541条）を兼ねることができ、⟪二度の催告を要しない⟫。\n\nただし、催告期間を経過した時における債務の不履行が、その契約及び⟪取引上の社会通念⟫に照らして⟪軽微⟫であるときは、解除をすることができない（⟪541条ただし書⟫）。不履行が軽微にとどまる場合は、債権者は⟪損害賠償等の救済⟫によって満足すべきであり、契約の拘束力を失わせるまでの必要がないからである。\n軽微か否かは、⟪催告期間の経過時⟫を基準に、①違反された⟪債務自体⟫が契約全体からみて軽微か（付随的な債務にすぎないか）、②義務違反の⟪態様⟫が軽微か（不履行部分が数量的にわずかにとどまるか）を、当該契約の性質・目的・締結に至る経緯その他の取引上の事情に照らして判断すると解する。\nもっとも、軽微性は⟪契約目的の達成が不能⟫であることと同義ではないから、債務者が「契約目的の達成はなお可能である」と主張・立証しても、それだけでは解除を免れない。契約に付加された債務の不履行であっても、それが⦅⟪契約締結の目的の達成に重大な影響⟫を与える⦆⟨1⟩ときは、軽微とはいえず、解除が認められる。\n軽微であることは、⟪解除を争う債務者⟫が主張・立証責任を負う。\n\n次の場合には、債権者は、541条の催告をすることなく、⟪直ちに契約の解除⟫をすることができる（⟪542条1項⟫。2項の一部解除と対比して全部解除である）。債務者に⟪履行の機会を与えても意味がない⟫からである。\n⟪1号⟫ 債務の⟪全部の履行が不能⟫であるとき。\n⟪2号⟫ 債務者がその債務の⟪全部の履行を拒絶する意思を明確に表示⟫したとき。\n履行不能には後発的不能のみならず⟪原始的不能⟫も含まれ、明確な履行拒絶には履行期後のものだけでなく⟪履行期前⟫のものも含まれる。\n\n⟪3号⟫ 債務の⟪一部⟫の履行が不能である場合、又は債務者がその債務の⟪一部⟫の履行を拒絶する意思を明確に表示した場合において、⟪残存する部分のみでは契約をした目的を達することができない⟫とき（この場合は⟪全部⟫解除である）。\n⟪4号⟫ 契約の性質又は当事者の意思表示により、特定の日時又は一定の期間内に履行をしなければ契約をした目的を達することができない場合（⟪定期行為⟫）において、債務者が履行をしないで⟪その時期を経過⟫したとき。\n⟪5号⟫ 前各号のほか、債務者がその債務の履行をせず、⟪催告をしても契約をした目的を達するのに足りる履行がされる見込みがない⟫ことが明らかであるとき。契約目的の達成不能を理由とする解除の⟪受け皿⟫となる規定である。\n\n債務の⟪一部⟫の履行が不能であるとき（1号）、又は債務者がその債務の⟪一部⟫の履行を拒絶する意思を明確に表示したとき（2号）は、債権者は、催告をすることなく直ちに⟪契約の一部⟫を解除することができる（⟪542条2項⟫）。⟪残存部分のみでは契約目的を達することができない⟫ときは全部解除（⟪542条1項3号⟫）となり、達することができるときは一部解除にとどまる。\n\n債務の不履行が⟪債権者⟫の責めに帰すべき事由によるものであるときは、債権者は、⟪541条・542条⟫による契約の解除をすることができない（⟪543条⟫）。不履行の⟪リスク⟫は帰責事由のある債権者が負担すべきであり、債権者に契約の拘束力からの離脱を認める必要はないからである。","kata":"","hanrei":[["**最判 昭29・12・21**（民集8巻12号2211頁）／大判 昭2・2・2（民集6巻133頁）","**相当の期間を定めない催告・不相当に短い期間を定めた催告も無効ではなく**、催告の時から客観的にみて相当の期間が経過すれば解除権が発生する","`基礎法\\民事\\基本講義 債権各論Ⅰ` p.78。**541条本文の文言は改正で実質的に変わっていないので現行法でも生きている**（同書が現行法の解説として引用）。`判例百選_収録判例リスト.md` を年月日で grep したが**掲載なし**。**2026-07-30 の査読で追加**（覚える論証 第2の注釈先が表に無く `build_cards.py` が警告を出したため）"],["**最三小判 昭36・11・21**（民集15巻10号2507頁）","解除を認める趣意は契約の要素をなす債務の履行がないために契約をした目的を達することができない場合を救済することにあり、**主たる目的の達成に必須的でない附随的義務の履行を怠ったに過ぎない場合は、特段の事情の存しない限り解除できない**","**百選Ⅱ〔第9版〕37番＝〔第8版〕42番**（解説：第9版＝岩川隆嗣／第8版＝渡辺達徳。**版で解説者が替わっている**）。**そのままの形では通用しない。**現行法では「541条ただし書の『軽微』に該当するか」という形で問題となる（第9版37番解説1）。要素／付随的の区別自体は「意味を持たない」と評価されている（同解説2(4)）"],["**最二小判 昭43・2・23**（民集22巻2号281頁）","分割払いの土地売買に付された「代金完済まで買主は土地上に工作物を築造しない」旨の特別の約款は、外見上付随的で契約締結の目的には必要不可欠でないが、**売主にとって代金の完全な支払の確保のために重要な意義**をもち買主もその趣旨で合意した以上、その不履行は**契約締結の目的の達成に重大な影響を与える**から、当該約款の債務は要素たる債務に入り、その不履行を理由に売主は解除できる","**百選Ⅱ〔第9版〕38番＝〔第8版〕43番**（解説：福本忍。第8版も福本忍）。**541条ただし書のリーディング・ケースとして読み替えられる**（第9版38番解説3）。⚠️ 同判決は**無催告解除の事案**であり催告解除の軽微性とは関係しないとの批判がある（第9版37番解説2(3)は「無催告解除の事案」と明記／38番解説3・4）"],["**最三小判 平8・11・12**（民集50巻10号2673頁）","複数の契約の目的が相互に密接に関連付けられており、社会通念上いずれかが履行されるだけでは契約を締結した目的が全体として達成されないと認められる場合には、**契約の全体を解除することができる**","**百選Ⅱ〔第9版〕39番＝〔第8版〕44番**（解説：鹿野菜穂子。第8版も鹿野菜穂子）。`アガルート/総合講義-民法` 紙面p.288 が「百選44」として引用。**複合契約の解除は本論証の射程外**（間接目的の措定の問題。第9版37番解説4）"],["**大判 昭2・2・2**（民集6巻133頁）／**最判 昭29・12・21**（民集8巻12号2211頁）／**最判 昭31・12・6**","**相当の期間を定めない催告・不相当に短い期間を定めた催告も有効**であり、催告の時から客観的に相当の期間が経過すれば解除できる","**現行法でも維持**（541条本文の文言は改正されていない）。`基本講義 債権各論Ⅰ` p.78／`アガルート/総合講義-民法` 紙面p.287／`短答/体系別短答過去問題集 民法(下)` p.394 肢ア。百選リストに掲載なし"],["**大判 昭15・9・3**／**最判 昭48・4・19**","催告は債務者に債務の履行を促せば足り、**履行がなければ解除する旨の通知（付言）までは必要でない**","**現行法でも維持**。昭15・9・3＝`短答/体系別短答過去問題集 民法(下)` p.388 肢ウ／昭48・4・19＝`短答/伊藤真の速習短答過去問 民法` p.272（H29-24-ウ）。百選リストに掲載なし"],["**大判 昭9・6・2**","**金銭債務の履行の催告にあたって、必ずしも金額を明示する必要はない**","**現行法でも維持**。`アガルート/総合講義-民法` 紙面p.287（司H19-23-アイ）。百選リストに掲載なし"],["**大判 大6・6・27**（民録23輯1153頁）","期限の定めのない債務について、**付遅滞のための催告（412条3項）と解除の要件としての催告（541条）は兼ねることができ、二重の催告は不要**","**現行法でも維持**。`完全講義 民事訴訟実務の基礎 上巻` p.214／`基本講義 債権各論Ⅰ` p.79／`アガルート/総合講義-民法` 紙面p.287。百選リストに掲載なし"],["**最判 昭43・11・21**（民集22巻12号2741頁）","**催告不要の特約も契約自由の原則により有効**（90条・消費者契約法10条の問題は残る）","**現行法でも維持**。`基本講義 債権各論Ⅰ` p.79。約定解除の領域なので本論証の対象外"],["**大判 昭7・7・7**","契約解除のため相当期間を定めてした履行の催告に対し、**債務者が履行拒絶の意思を表示したときは、債権者はその期間内であっても契約を解除できる**","**現行法でも維持**（`短答/伊藤真の速習短答過去問 民法` p.272＝H29-24-エ改題）。現行法では542条1項2号（明確な履行拒絶）としても説明しうるが、**この読み替えを述べる出典はDBで確認できていない** `[カニの推論]`"],["**最判 昭36・6・22**","弁済提供と催告の関係につき、**催告は弁済提供の後に改めてする必要はなく、弁済提供と同時にすればよい**","`アガルート/総合講義-民法` 紙面p.287。**民集の巻号頁はDBで確認できなかった**ので引用しない"],["**大判 大14・12・3**","債権者が指定した履行の場所が不明確であったときは債務者が問い合わせるべきであり、これをしないで債務者が漫然と履行しない場合は**催告は有効**","`アガルート/総合講義-民法` 紙面p.287（司H19-23-5）。百選リストに掲載なし"],["~~**大判 大6・7・10**（民録23輯1128頁）~~","相当期間経過前に、債権者に対し遅延賠償を含め債務の本旨に従った履行の提供をしたことを債務者が主張立証すれば解除を免れる、という文脈で `基本講義 債権各論Ⅰ` p.78〜79 が引用する判例","**DBのページ跨ぎで判示の主語・射程を確認できなかった**（p.78 末尾が「大判」で切れ、p.79 冒頭に「大6・7・10民録23-1128)。」だけが残っている）。**判示内容が未確認なので答案で引用しない。**"],["**大判 大7・2・17**（新聞1388号29頁）","映写契約における「相手方以外の活動写真を賃借・映写しない義務」の不履行は、報酬金取得という直接目的の妨げにはならないとしても、契約で達しようとした自家の写真発展という目的を達することができなくなるとして、解除を認めた","改正前の「特段の事情」の一例（**間接目的**への影響）。百選Ⅱ〔第9版〕37番解説2(3)②第1が引用。**現行法では軽微性の判断における考慮要素として読み替えられる**"],["**最判 昭50・2・20**（民集29巻2号99頁）","ショッピングセンターの店舗賃貸借において、センターの正常な運営を目的とした賃借人の約定義務の違反を理由とする賃貸人の解除を認めた（信頼関係破壊の法理による無催告解除の事案）","百選Ⅱ〔第9版〕37番解説2(3)②第2が引用。⚠️ **`判例百選_収録判例リスト.md` を「昭和50・2・20」でgrepしたところ、ヒットしたのは憲法判例百選Ⅰ（神戸簡判 昭和50・2・20・牧会活動の自由と犯人蔵匿罪）であり、別事件である。**本判例は民法百選には掲載されていない"],["**最判 昭42・4・6**（民集21巻3号533頁）／**最判 昭51・12・20**（民集30巻11号1064頁）／**最判 昭47・11・28**（集民107号265頁）","農地法5条の許可申請義務の不履行・買主の公租公課負担義務の不履行について、**売主の代金取得への影響の有無**で解除の可否を分けた一連の改正前判例","百選Ⅱ〔第9版〕37番解説2(3)①が引用。**現行法では軽微性の判断（契約目的への影響）に吸収される。**答案で規範として立てない"],["**最判 平11・11・30**（判時1701号69頁／同日・金判1088号32頁）","ゴルフ場入会契約の解除につき、ホテル等の施設利用債務が対価的かを問題とした","百選Ⅱ〔第9版〕37番解説2(2)が引用。**改正前の「要素をなす債務」の判定例**であり、現行法では軽微性の判断材料"]],"field":"契約の解除","order":35},{"name":"無権代理と相続_資格の同一人帰属","subject":"民法","rank":"A","path":"まとめ/民法/論証/無権代理と相続_資格の同一人帰属.md","cards":[{"id":"民法/無権代理と相続_資格の同一人帰属#1","block":"第1〔無権代理人が本人を単独相続した場合〕","kind":"cloze","masked":"無権代理行為は、本人がその追認をしなければ本人に対して効力を生じない（⟦ア⟧）。もっとも、無権代理人が本人を相続し、両資格が同一人に帰属した場合に、なお本人の資格で追認を拒絶しうるかが問題となる。\nこの点、相続によって両資格は融合せず⟦イ⟧と解すべきである。相続という偶然の事情によって、相手方の取消権（115条）や無権代理人の責任（117条）の帰趨まで当然に変動させるべきではないからである。\nしかし、自ら無権代理行為をしておきながら、本人の資格において追認を拒絶することは、相手方に対する自己の⟦ウ⟧する態度であって、⟦エ⟧上許されない（1条2項）。\nしたがって、⦅無権代理人は⟦オ⟧、無権代理行為は本人が自ら法律行為をしたのと同様に扱われる⦆⟨1⟩。","body":"無権代理行為は、本人がその追認をしなければ本人に対して効力を生じない（⟪113条1項⟫）。もっとも、無権代理人が本人を相続し、両資格が同一人に帰属した場合に、なお本人の資格で追認を拒絶しうるかが問題となる。\nこの点、相続によって両資格は融合せず⟪併存する⟫と解すべきである。相続という偶然の事情によって、相手方の取消権（115条）や無権代理人の責任（117条）の帰趨まで当然に変動させるべきではないからである。\nしかし、自ら無権代理行為をしておきながら、本人の資格において追認を拒絶することは、相手方に対する自己の⟪先行行為に矛盾⟫する態度であって、⟪信義則⟫上許されない（1条2項）。\nしたがって、⦅無権代理人は⟪追認を拒絶することができず⟫、無権代理行為は本人が自ら法律行為をしたのと同様に扱われる⦆⟨1⟩。","answers":["113条1項","併存する","先行行為に矛盾","信義則","追認を拒絶することができず"],"check":"**✗**（信義則違反） ／ 本人が自ら法律行為をしたのと同様に扱う ／ 資格併存＋**先行行為に矛盾する態度**／1条2項","notes":[{"n":1,"label":"最判昭和40・6・18","case":"最判昭和40・6・18 民集19巻4号986頁","gist":"同上。「本人と代理人の資格が同一人に帰するに至った場合には、本人が自ら法律行為をしたのと同様な法律上の地位を生じたものとなる」"}],"law":"","cites":["民法/113","民法/115","民法/117","民法/1"],"rate":10,"designed":true,"ref":false,"hash":"68c168803d05"},{"id":"民法/無権代理と相続_資格の同一人帰属#2","block":"第2〔無権代理人が他の相続人とともに本人を共同相続した場合〕","kind":"cloze","masked":"もっとも、共同相続の場合には、無権代理行為をしていない他の共同相続人の追認拒絶権をも考慮しなければならない。\n無権代理行為を追認する権利は、その性質上、相続人全員に⟦ア⟧する。追認は、本人に対して効力を生じていなかった法律行為を本人に対する関係において有効なものにするという効果を生じさせるものだからである。\nそこで、⦅⟦イ⟧追認権を行使しない限り、無権代理行為は、無権代理人の⟦ウ⟧においても、当然に⟦エ⟧と解する⦆⟨1⟩。\nもっとも、他の共同相続人全員が追認をしている場合に、無権代理人だけが追認を拒絶することは⟦オ⟧。この場合には、無権代理行為の効果は本人の地位を承継した者の全部に帰属する。","body":"もっとも、共同相続の場合には、無権代理行為をしていない他の共同相続人の追認拒絶権をも考慮しなければならない。\n無権代理行為を追認する権利は、その性質上、相続人全員に⟪不可分的に帰属⟫する。追認は、本人に対して効力を生じていなかった法律行為を本人に対する関係において有効なものにするという効果を生じさせるものだからである。\nそこで、⦅⟪共同相続人全員が共同して⟫追認権を行使しない限り、無権代理行為は、無権代理人の⟪相続分に相当する部分⟫においても、当然に⟪有効となるものではない⟫と解する⦆⟨1⟩。\nもっとも、他の共同相続人全員が追認をしている場合に、無権代理人だけが追認を拒絶することは⟪信義則上許されない⟫。この場合には、無権代理行為の効果は本人の地位を承継した者の全部に帰属する。","answers":["不可分的に帰
