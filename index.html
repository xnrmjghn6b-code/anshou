ことができる（⟦ウ⟧）。\n履行を拒んでも債務者は⟦エ⟧。また、この場合の譲渡人は、⟦オ⟧を与えられるにとどまり、債務者に対して履行を請求する権限を有しない。\n悪意・重過失の判断基準時は⟦カ⟧であり、その主張立証責任は、抗弁を主張する⟦キ⟧が負う。","body":"もっとも、譲渡制限の意思表示は、⟪弁済の相手方を固定⟫することについての債務者の利益を保護するためのものである。そこで、譲渡制限の意思表示がされたことを知り、又は重大な過失によって知らなかった譲受人その他の第三者に対しては、債務者は、⟪その債務の履行を拒む⟫ことができ、かつ、譲渡人に対する弁済その他の債務を消滅させる事由をもってその第三者に対抗することができる（⟪466条3項⟫）。\n履行を拒んでも債務者は⟪履行遅滞に陥らない⟫。また、この場合の譲渡人は、⟪法定の受領権限⟫を与えられるにとどまり、債務者に対して履行を請求する権限を有しない。\n悪意・重過失の判断基準時は⟪債権譲渡契約の締結時⟫であり、その主張立証責任は、抗弁を主張する⟪債務者⟫が負う。","answers":["弁済の相手方を固定","その債務の履行を拒む","466条3項","履行遅滞に陥らない","法定の受領権限","債権譲渡契約の締結時","債務者"],"check":"","notes":[],"law":"","cites":["民法/466"],"rate":34,"designed":true,"ref":false,"hash":"39f1dace6028"},{"id":"民法/譲渡制限の意思表示#3","block":"第3〔抗弁の失効——催告・承諾〕","kind":"cloze","masked":"(1) 債務者が債務を履行しない場合において、譲受人その他の第三者が相当の期間を定めて⟦ア⟧履行の催告をし、その期間内に履行がないときは、その債務者について466条3項は⟦イ⟧（⟦ウ⟧）。譲渡人も譲受人も履行を請求できないという⟦エ⟧し、譲受人を保護する趣旨である。\n(2) 債務者が譲渡人又は譲受人に対して当該債権の譲渡を承諾したときも、譲渡制限の意思表示に基づく⟦オ⟧したものといえるから、債務者はこれを譲受人に対抗することができない。承諾の時期は⟦カ⟧。","body":"(1) 債務者が債務を履行しない場合において、譲受人その他の第三者が相当の期間を定めて⟪譲渡人への⟫履行の催告をし、その期間内に履行がないときは、その債務者について466条3項は⟪適用されない⟫（⟪466条4項⟫）。譲渡人も譲受人も履行を請求できないという⟪こう着状態を解消⟫し、譲受人を保護する趣旨である。\n(2) 債務者が譲渡人又は譲受人に対して当該債権の譲渡を承諾したときも、譲渡制限の意思表示に基づく⟪抗弁を放棄⟫したものといえるから、債務者はこれを譲受人に対抗することができない。承諾の時期は⟪譲渡の前後を問わない⟫。","answers":["譲渡人への","適用されない","466条4項","こう着状態を解消","抗弁を放棄","譲渡の前後を問わない"],"check":"","notes":[],"law":"","cites":["民法/466"],"rate":32,"designed":true,"ref":false,"hash":"91ee877f9d99"},{"id":"民法/譲渡制限の意思表示#4","block":"第4〔供託〕","kind":"cloze","masked":"債務者は、譲渡制限の意思表示がされた金銭債権が譲渡されたときは、譲受人の⟦ア⟧、その債権の全額に相当する金銭を⟦イ⟧に供託することができる（⟦ウ⟧）。譲受人の主観の判断を誤る危険を債務者から取り除く趣旨である。\nまた、譲渡人について破産手続開始の決定があったときは、債権の⟦エ⟧を譲り受けた者であって⟦オ⟧譲受人は、悪意・重過失であっても、債務者に全額を供託させることができる（466条の3）。\nいずれの場合も、供託金の還付を請求できるのは⟦カ⟧。","body":"債務者は、譲渡制限の意思表示がされた金銭債権が譲渡されたときは、譲受人の⟪主観を問わず⟫、その債権の全額に相当する金銭を⟪債務の履行地の供託所⟫に供託することができる（⟪466条の2第1項⟫）。譲受人の主観の判断を誤る危険を債務者から取り除く趣旨である。\nまた、譲渡人について破産手続開始の決定があったときは、債権の⟪全額⟫を譲り受けた者であって⟪第三者対抗要件を備えた⟫譲受人は、悪意・重過失であっても、債務者に全額を供託させることができる（466条の3）。\nいずれの場合も、供託金の還付を請求できるのは⟪譲受人に限られる⟫。","answers":["主観を問わず","債務の履行地の供託所","466条の2第1項","全額","第三者対抗要件を備えた","譲受人に限られる"],"check":"","notes":[],"law":"466条の2第1項・466条の3（債務者の供託権と、破産時の全額譲受人による供託請求）","cites":["民法/466の2","民法/466の3"],"rate":39,"designed":true,"ref":false,"hash":"3fd01e0f2b1f"},{"id":"民法/譲渡制限の意思表示#5","block":"第5〔差押債権者〕","kind":"cloze","masked":"私人間の合意によって⟦ア⟧を作り出すことは認められない。そこで、譲渡制限の意思表示がされた債権に対して強制執行をした差押債権者に対しては、466条3項は適用されず、債務者は、その善意・悪意を問わず⟦イ⟧（⟦ウ⟧）。\nもっとも、悪意又は重過失のある譲受人の債権者が当該債権を差し押さえたときは、⟦エ⟧を差押債権者に認めるべきではないから、債務者は、その債務の⟦オ⟧、かつ、譲渡人に対する弁済その他の債務を消滅させる事由をもって差押債権者に対抗することができる（466条の4第2項）。","body":"私人間の合意によって⟪差押禁止財産⟫を作り出すことは認められない。そこで、譲渡制限の意思表示がされた債権に対して強制執行をした差押債権者に対しては、466条3項は適用されず、債務者は、その善意・悪意を問わず⟪履行を拒むことができない⟫（⟪466条の4第1項⟫）。\nもっとも、悪意又は重過失のある譲受人の債権者が当該債権を差し押さえたときは、⟪執行債務者である譲受人が有する以上の権利⟫を差押債権者に認めるべきではないから、債務者は、その債務の⟪履行を拒み⟫、かつ、譲渡人に対する弁済その他の債務を消滅させる事由をもって差押債権者に対抗することができる（466条の4第2項）。","answers":["差押禁止財産","履行を拒むことができない","466条の4第1項","執行債務者である譲受人が有する以上の権利","履行を拒み"],"check":"","notes":[],"law":"466条の4第1項・2項（差押債権者には抗弁できない／悪意重過失の譲受人の債権者には抗弁できる）","cites":["民法/466","民法/466の4"],"rate":33,"designed":true,"ref":false,"hash":"2af3ba729b03"},{"id":"民法/譲渡制限の意思表示#6","block":"第6〔預貯金債権の特則〕","kind":"cloze","masked":"預貯金債権について当事者がした譲渡制限の意思表示は、466条2項の規定にかかわらず、これがされたことを知り、又は重大な過失によって知らなかった譲受人その他の第三者に⟦ア⟧（⟦イ⟧）。すなわち、その者との関係では⟦ウ⟧であり、債権者は⟦エ⟧である。預貯金債権は大量に存在し、⟦オ⟧を確保する必要が高いからである。\nただし、預貯金債権に対して強制執行をした差押債権者に対しては、これを⟦カ⟧（466条の5第2項）。","body":"預貯金債権について当事者がした譲渡制限の意思表示は、466条2項の規定にかかわらず、これがされたことを知り、又は重大な過失によって知らなかった譲受人その他の第三者に⟪対抗することができる⟫（⟪466条の5第1項⟫）。すなわち、その者との関係では⟪譲渡自体が無効⟫であり、債権者は⟪なお譲渡人⟫である。預貯金債権は大量に存在し、⟪払戻事務の円滑⟫を確保する必要が高いからである。\nただし、預貯金債権に対して強制執行をした差押債権者に対しては、これを⟪対抗することができない⟫（466条の5第2項）。","answers":["対抗することができる","466条の5第1項","譲渡自体が無効","なお譲渡人","払戻事務の円滑","対抗することができない"],"check":"","notes":[],"law":"466条の5第1項・2項（預貯金債権の特則と、差押債権者への不対抗）","cites":["民法/466","民法/466の5"],"rate":39,"designed":true,"ref":false,"hash":"9a023d9a882e"},{"id":"民法/譲渡制限の意思表示#7","block":"第7〔将来債権譲渡の後に付された譲渡制限〕","kind":"cloze","masked":"将来債権が譲渡された場合において、⟦ア⟧に譲渡制限の意思表示がされたときは、譲受人その他の第三者は⟦イ⟧、466条3項（預貯金債権の場合は466条の5第1項）が適用される（⟦ウ⟧）。反対に、債務者対抗要件の具備後に譲渡制限の意思表示がされたときは、譲受人の主観を問わず、債務者はこれを譲受人に⟦エ⟧。","body":"将来債権が譲渡された場合において、⟪債務者対抗要件が具備された時まで⟫に譲渡制限の意思表示がされたときは、譲受人その他の第三者は⟪そのことを知っていたものとみなされ⟫、466条3項（預貯金債権の場合は466条の5第1項）が適用される（⟪466条の6第3項⟫）。反対に、債務者対抗要件の具備後に譲渡制限の意思表示がされたときは、譲受人の主観を問わず、債務者はこれを譲受人に⟪対抗することができない⟫。","answers":["債務者対抗要件が具備された時まで","そのことを知っていたものとみなされ","466条の6第3項","対抗することができない"],"check":"","notes":[],"law":"466条の6第3項・466条3項（対抗要件具備時までに付された譲渡制限は悪意擬制）","cites":["民法/466","民法/466の5","民法/466の6"],"rate":36,"designed":true,"ref":false,"hash":"eea1faa3c304"}],"setsurei":["建設業者Gは、S市に対し、下水道工事の請負報酬債権α（300万円）を有している。工事請負契約書には「Gは本件工事に係る請負報酬債権を他人に譲渡することができない」との条項がある。Gは、α債権を同業者Aに譲渡し、S市に確定日付のある証書で通知した。Aは、この種の請負報酬債権に譲渡制限条項が付いていることを知っていた。 S市はAへの支払を拒み、Gにも支払わない。Aは300万円を回収できるか。","Gは、S銀行に総合預金口座を開設しており、普通預金債権β（300万円）を有している。通帳の「ご注意事項」欄には、この取引に係る一切の権利を譲渡・質入れできない旨の記載がある。 (1) Gは、β債権をAに譲渡し、S銀行に通知した。その後、Aに対する債権者Bが、β債権を差し押さえた。 (2) 他方、Gに対する一般債権者Cも、β債権を差し押さえた。 S銀行は、B・Cそれぞれに対し、譲渡制限の意思表示を対抗できるか。"],"full":"債権は、譲り渡すことができる（466条1項本文）。そして、当事者が債権の譲渡を禁止し、又は制限する旨の意思表示（譲渡制限の意思表示）をしたときであっても、債権の譲渡は、⟪その効力を妨げられない⟫（⟪466条2項⟫）。債権の自由な譲渡性を重視し、⟪債権の流動化⟫を確保する趣旨である。\nしたがって、譲受人は、譲渡制限の意思表示について悪意であっても重過失があっても⟪債権を取得⟫し、譲渡人は⟪もはや債権者ではない⟫。\n\nもっとも、譲渡制限の意思表示は、⟪弁済の相手方を固定⟫することについての債務者の利益を保護するためのものである。そこで、譲渡制限の意思表示がされたことを知り、又は重大な過失によって知らなかった譲受人その他の第三者に対しては、債務者は、⟪その債務の履行を拒む⟫ことができ、かつ、譲渡人に対する弁済その他の債務を消滅させる事由をもってその第三者に対抗することができる（⟪466条3項⟫）。\n履行を拒んでも債務者は⟪履行遅滞に陥らない⟫。また、この場合の譲渡人は、⟪法定の受領権限⟫を与えられるにとどまり、債務者に対して履行を請求する権限を有しない。\n悪意・重過失の判断基準時は⟪債権譲渡契約の締結時⟫であり、その主張立証責任は、抗弁を主張する⟪債務者⟫が負う。\n\n(1) 債務者が債務を履行しない場合において、譲受人その他の第三者が相当の期間を定めて⟪譲渡人への⟫履行の催告をし、その期間内に履行がないときは、その債務者について466条3項は⟪適用されない⟫（⟪466条4項⟫）。譲渡人も譲受人も履行を請求できないという⟪こう着状態を解消⟫し、譲受人を保護する趣旨である。\n(2) 債務者が譲渡人又は譲受人に対して当該債権の譲渡を承諾したときも、譲渡制限の意思表示に基づく⟪抗弁を放棄⟫したものといえるから、債務者はこれを譲受人に対抗することができない。承諾の時期は⟪譲渡の前後を問わない⟫。\n\n債務者は、譲渡制限の意思表示がされた金銭債権が譲渡されたときは、譲受人の⟪主観を問わず⟫、その債権の全額に相当する金銭を⟪債務の履行地の供託所⟫に供託することができる（⟪466条の2第1項⟫）。譲受人の主観の判断を誤る危険を債務者から取り除く趣旨である。\nまた、譲渡人について破産手続開始の決定があったときは、債権の⟪全額⟫を譲り受けた者であって⟪第三者対抗要件を備えた⟫譲受人は、悪意・重過失であっても、債務者に全額を供託させることができる（466条の3）。\nいずれの場合も、供託金の還付を請求できるのは⟪譲受人に限られる⟫。\n\n私人間の合意によって⟪差押禁止財産⟫を作り出すことは認められない。そこで、譲渡制限の意思表示がされた債権に対して強制執行をした差押債権者に対しては、466条3項は適用されず、債務者は、その善意・悪意を問わず⟪履行を拒むことができない⟫（⟪466条の4第1項⟫）。\nもっとも、悪意又は重過失のある譲受人の債権者が当該債権を差し押さえたときは、⟪執行債務者である譲受人が有する以上の権利⟫を差押債権者に認めるべきではないから、債務者は、その債務の⟪履行を拒み⟫、かつ、譲渡人に対する弁済その他の債務を消滅させる事由をもって差押債権者に対抗することができる（466条の4第2項）。\n\n預貯金債権について当事者がした譲渡制限の意思表示は、466条2項の規定にかかわらず、これがされたことを知り、又は重大な過失によって知らなかった譲受人その他の第三者に⟪対抗することができる⟫（⟪466条の5第1項⟫）。すなわち、その者との関係では⟪譲渡自体が無効⟫であり、債権者は⟪なお譲渡人⟫である。預貯金債権は大量に存在し、⟪払戻事務の円滑⟫を確保する必要が高いからである。\nただし、預貯金債権に対して強制執行をした差押債権者に対しては、これを⟪対抗することができない⟫（466条の5第2項）。\n\n将来債権が譲渡された場合において、⟪債務者対抗要件が具備された時まで⟫に譲渡制限の意思表示がされたときは、譲受人その他の第三者は⟪そのことを知っていたものとみなされ⟫、466条3項（預貯金債権の場合は466条の5第1項）が適用される（⟪466条の6第3項⟫）。反対に、債務者対抗要件の具備後に譲渡制限の意思表示がされたときは、譲受人の主観を問わず、債務者はこれを譲受人に⟪対抗することができない⟫。","kata":"| # | 落としてはいけない要素 | 条文 |\n|---|---|---|\n| 1 | 譲渡制限があっても**譲渡は有効**／譲受人が債権者・譲渡人は債権者でない | 466条2項 |\n| 2 | 悪意**又は重過失**の譲受人その他の第三者に**履行拒絶**できる | 466条3項前段 |\n| 3 | **譲渡人に対する弁済その他の債務消滅事由**を対抗できる | 466条3項後段 |\n| 4 | 譲渡人は**受領権限のみ・取立権限なし**／債務者は履行遅滞に陥らない | 466条3項 |\n| 5 | 悪意重過失の**基準時＝譲渡契約締結時**／**立証責任は債務者** | — |\n| 6 | 催告は「**譲渡人へ**履行せよ」＋相当の期間＋期間内に履行なし | 466条4項 |\n| 7 | **承諾**でも抗弁を失う（時期は譲渡の前後を問わない） | — |\n| 8 | 債務者は**全額**を**履行地**の供託所に供託できる／還付は**譲受人のみ** | 466条の2 |\n| 9 | 譲渡人**破産**時、**全額**譲受け＋**第三者対抗要件**具備なら供託請求できる | 466条の3 |\n| 10 | 差押債権者には**対抗できない**（原則） | 466条の4第1項 |\n| 11 | ただし**悪意譲受人の債権者**の差押えには**対抗できる** | 466条の4第2項 |\n| 12 | **預貯金債権**は悪意重過失の譲受人に**対抗できる＝譲渡が無効** | 466条の5第1項 |\n| 13 | 預貯金債権でも**差押債権者**には対抗できない | 466条の5第2項 |\n| 14 | 将来債権譲渡：**債務者対抗要件具備時**までの譲渡制限は**悪意擬制** | 466条の6第3項 |\n\n**勝負どころ**\n1. **「譲渡は有効」から始められるか。** 答案の第一文で「本件譲渡は無効である」と書いた瞬間に旧法の答案になる。まず466条2項で譲渡が有効・譲受人が債権者であることを確定させ、そのうえで「債務者が履行を拒めるか」という**抗弁の問題**に落とす。\n2. **催告の宛先と内容。** 466条4項の催告は「**譲渡人へ**履行せよ」である。「自分（譲受人）へ払え」という催告では効果が生じない（R4予備 第9問 肢イ）。ここは短答でも論文でも狙われる。\n3. **差押債権者は1項と2項で結論が逆。** 「誰の債権者が差し押さえたか」（譲渡人の債権者か、悪意譲受人の債権者か）を最初に特定してから条文を選ぶ。\n4. **預貯金債権かどうかを最初に確認する。** 466条の5に当たると、466条2項〜4項・466条の2・466条の3が**まるごと適用されなくなる**。\n\n> ⚠️ **間違えやすい点**\n> - **「債務者の承諾で遡って有効になる」は旧法**。現行法では譲渡は当初から有効なので、遡及効を論じる余地がない（体系別短答（下）紙面p.180／DB p0192 肢5）。承諾の効果は**抗弁の放棄**である。\n> - **供託は債権者不確知供託（494条2項）ではない**。譲受人が債権者であることは確定しているので不確知にあたらず、466条の2という別の供託権が用意されている。債務者の過失の有無も問わない。\n> - **466条の3の供託請求は「全額の譲受人」に限る**。一部譲受人・債権質権者は請求できない。かつ**第三者**対抗要件（債務者対抗要件では足りない）を要する。\n> - **絶対的構成**：善意無重過失の譲受人を経由すれば、その後の悪意の転得者に対しても債務者は対抗できない。逆に、悪意の譲受人からの善意無重過失の転得者も保護される。\n> - **一般債権では、悪意の譲受人も「債権者」である。** 「悪意だから債権を取得できない」と書けるのは預貯金債権だけ。\n> - **466条の6第3項の基準は債務者対抗要件具備時のみ。** 譲受人が現実に譲渡制限を知っていたか否かは問わない（悪意の擬制）。","hanrei":[["最一小判 平9・6・5 民集51-5-2053<br>**民法判例百選Ⅱ 債権〔第9版〕21番**（〔第8版〕25番）","譲渡禁止特約につき悪意又は重過失の譲受人への譲渡でも、債務者が後に承諾すれば譲渡の時にさかのぼって有効となるが、116条の法意に照らし第三者の権利を害することはできない","**※改正により前提が変わった。** 物権的無効を前提とする遡及効の法理であり、**現行法では預貯金債権にのみ妥当し、一般の債権には妥当しない**（466条2項により譲渡は当初から有効なので遡及効を論じる余地がない）。百選解説自身が「同改正後は、預貯金債権については維持されるものの……その他の債権には妥当しない」と明記（DB p0021 解説4末尾）"],["最一小判 昭52・3・17 民集31-2-308","譲渡禁止特約付債権の譲渡につき債務者が承諾すれば譲渡時にさかのぼって有効となり、確定日付ある譲渡通知がされている限り、承諾後に差押え・転付命令を得た第三者にも対抗できる","**※改正により前提が変わった。** 平9・6・5 と同じ理由で、一般の債権には妥当しない（出典：百選Ⅱ〔第9版〕21番 判旨・解説）"],["最判 昭48・7・19 民集27-7-823","①譲受人が保護されるには善意かつ無重過失を要する（重過失は悪意と同視できる）②預金債権には一般に譲渡禁止特約が付され、これは銀行取引の経験のある者にとって周知の事柄である","**なお生きている。** ①の悪意・重過失基準は**466条3項として明文化**された（百選Ⅱ〔第9版〕21番解説1）。②は預貯金債権の重過失判断としてなお有効（プラクティス memo90・紙面p.489／DB p0506）"],["最判 平21・3・27 民集63-3-449","譲渡禁止特約に反して債権を譲渡した債権者は、特約の存在を理由に譲渡の無効を主張する独自の利益を有せず、債務者に無効を主張する意思があることが明らかであるなどの特段の事情がない限り、無効の主張は許されない","**※改正により前提が変わった。** 譲渡が無効であることを前提とする判示であり、一般の債権では466条2項により譲渡が有効なのでこの問題自体が生じない（出典：百選Ⅱ〔第9版〕21番解説3）。**預貯金債権になお及ぶかはDBで確認できなかった**〔カニの推論：構造は同じなので及びうるが、DB未確認〕"],["最判 昭28・5・29 民集7-5-608","事前の承諾によっても譲渡制限は解消されうる","承諾＝抗弁の放棄という現行法の理解と整合（出典：百選Ⅱ〔第9版〕21番解説3）"],["最判 昭45・4・10 民集24-4-240","譲渡禁止特約付債権を差し押さえた債権者は、その善意・悪意を問わず差押命令・転付命令を得られる","**条文化された。** 466条の4第1項・466条の5第2項がこれを明文化したもの（体系別短答（下）紙面p.180／DB p0192 肢4の解説）"],["大判 昭13・5・14","悪意の譲受人からの転得者が善意（無重過失）であれば、債務者は譲渡禁止特約を転得者に対抗できない","現行法下でも参照される（体系別短答（下）紙面p.187／DB p0199 肢ウの解説）"]],"field":"債権譲渡","order":31},{"name":"譲渡担保_法的構成と実行","subject":"民法","rank":"A","path":"まとめ/民法/論証/譲渡担保_法的構成と実行.md","cards":[{"id":"民法/譲渡担保_法的構成と実行#1","block":"第1〔法的構成〕","kind":"cloze","masked":"譲渡担保は、債権担保の目的で目的物の所有権を移転する形式を採るものであるが、その実質は担保にすぎない。そうだとすれば、その実質を重視すべきであり、⦅所有権の移転は債権担保の目的を達するのに⟦ア⟧においてのみ生じ、設定者にも⟦イ⟧が留保されると解する⦆⟨1⟩。\nしたがって、設定者は、実行が完了するまでは被担保債権を弁済して⟦ウ⟧することができ、また、⦅⟦エ⟧、正当な権原なく目的物を占有する者に対してその⟦オ⟧することができる⦆⟨2⟩。","body":"譲渡担保は、債権担保の目的で目的物の所有権を移転する形式を採るものであるが、その実質は担保にすぎない。そうだとすれば、その実質を重視すべきであり、⦅所有権の移転は債権担保の目的を達するのに⟪必要な範囲内⟫においてのみ生じ、設定者にも⟪所有権的な権利の一部⟫が留保されると解する⦆⟨1⟩。\nしたがって、設定者は、実行が完了するまでは被担保債権を弁済して⟪完全な所有権を回復⟫することができ、また、⦅⟪特段の事情のない限り⟫、正当な権原なく目的物を占有する者に対してその⟪返還を請求⟫することができる⦆⟨2⟩。","answers":["必要な範囲内","所有権的な権利の一部","完全な所有権を回復","特段の事情のない限り","返還を請求"],"check":"実質は担保／**債権担保の目的を達するのに必要な範囲内**でのみ所有権移転／設定者に所有権的権利の一部が留保／帰結2つ（受戻し・**特段の事情のない限り**不法占有者への返還請求）","notes":[{"n":1,"label":"最判 昭和57・9・28","case":"最判 昭和57・9・28 判時1062号81頁","gist":"譲渡担保による所有権移転は「**債権担保の目的を達するのに必要な範囲内**」でのみ生じる。設定者は、**特段の事情のない限り**、正当な権原なく目的物を占有する者に**返還を請求できる**"},{"n":2,"label":"最判 昭和57・9・28","case":"最判 昭和57・9・28 判時1062号81頁","gist":"譲渡担保による所有権移転は「**債権担保の目的を達するのに必要な範囲内**」でのみ生じる。設定者は、**特段の事情のない限り**、正当な権原なく目的物を占有する者に**返還を請求できる**"}],"law":"","cites":[],"rate":0,"designed":true,"ref":false,"hash":"07ef027500f0"},{"id":"民法/譲渡担保_法的構成と実行#2","block":"第2〔実行の手続と清算義務〕","kind":"cloze","masked":"債務者が弁済期に債務を弁済しないときは、債権者は⟦ア⟧を取得し、この権能に基づき、目的物を適正に評価された価額で確定的に自己の所有に帰せしめ（⟦イ⟧）、又は第三者に売却等をして換価処分し（⟦ウ⟧）、その評価額又は売却代金をもって自己の債権の弁済に充てることができる。そして、⦅その結果⟦エ⟧は、これを⟦オ⟧として設定者に支払うことを要すると解する⦆⟨1⟩。譲渡担保はあくまで債権の満足を得るための手段であり、債権額を超える価値まで債権者に取得させることは担保の目的を超えるからである。\nそして、債権者が実行として目的物の引渡し又は明渡しを求めた場合において、設定者が清算金の支払と引換えにこれをなすべき旨を主張したときは、⦅特段の事情のない限り、債権者の請求は清算金の支払と⟦カ⟧される⦆⟨2⟩。清算金の現実の支払を確保する必要があるからである。","body":"債務者が弁済期に債務を弁済しないときは、債権者は⟪目的物を処分する権能⟫を取得し、この権能に基づき、目的物を適正に評価された価額で確定的に自己の所有に帰せしめ（⟪帰属清算型⟫）、又は第三者に売却等をして換価処分し（⟪処分清算型⟫）、その評価額又は売却代金をもって自己の債権の弁済に充てることができる。そして、⦅その結果⟪剰余が生じるとき⟫は、これを⟪清算金⟫として設定者に支払うことを要すると解する⦆⟨1⟩。譲渡担保はあくまで債権の満足を得るための手段であり、債権額を超える価値まで債権者に取得させることは担保の目的を超えるからである。\nそして、債権者が実行として目的物の引渡し又は明渡しを求めた場合において、設定者が清算金の支払と引換えにこれをなすべき旨を主張したときは、⦅特段の事情のない限り、債権者の請求は清算金の支払と⟪引換えにのみ認容⟫される⦆⟨2⟩。清算金の現実の支払を確保する必要があるからである。","answers":["目的物を処分する権能","帰属清算型","処分清算型","剰余が生じるとき","清算金","引換えにのみ認容"],"check":"弁済期に不履行 → **処分権能**を取得／帰属清算（適正評価額で自己に帰属）・処分清算（第三者に売却等）／**剰余は清算金として支払う**／理由＝丸取りは担保の目的を超える／**引換給付**（特段の事情のない限り）","notes":[{"n":1,"label":"最一小判 昭和46・3・25","case":"最一小判 昭和46・3・25 民集25巻2号208頁","gist":"譲渡担保権者は、目的物の価額から自己の債権額を差し引いた残額を**清算金**として債務者に支払うことを要する。引渡・明渡請求に対し債務者が引換給付を主張したときは、特段の事情のある場合を除き、清算金の支払と**引換えにのみ**認容される"},{"n":2,"label":"最一小判 昭和46・3・25","case":"最一小判 昭和46・3・25 民集25巻2号208頁","gist":"譲渡担保権者は、目的物の価額から自己の債権額を差し引いた残額を**清算金**として債務者に支払うことを要する。引渡・明渡請求に対し債務者が引換給付を主張したときは、特段の事情のある場合を除き、清算金の支払と**引換えにのみ**認容される"}],"law":"","cites":[],"rate":0,"designed":true,"ref":false,"hash":"ed0f57cfe6cc"},{"id":"民法/譲渡担保_法的構成と実行#3","block":"第3〔受戻権と消滅時期〕","kind":"cloze","masked":"設定者は、弁済期の経過後であっても、⟦ア⟧の間は、債務の全額を弁済して譲渡担保権を消滅させ、目的物の所有権を回復することができる（⟦イ⟧）。弁済期を過ぎても債権者が債権の満足を得られるのであれば、なお設定者に目的物を取り戻させるのが担保の目的に適うからである。\n⦅実行の完了とは、⟪帰属清算型⟫においては、目的物の適正評価額が債務額を上回る場合には⟦ウ⟧がされた時、上回らない場合には⟦エ⟧がされた時をいい、⟪処分清算型⟫においては⟦オ⟧をいうと解する⦆⟨1⟩。","body":"設定者は、弁済期の経過後であっても、⟪担保権の実行が完了するまで⟫の間は、債務の全額を弁済して譲渡担保権を消滅させ、目的物の所有権を回復することができる（⟪受戻権⟫）。弁済期を過ぎても債権者が債権の満足を得られるのであれば、なお設定者に目的物を取り戻させるのが担保の目的に適うからである。\n⦅実行の完了とは、⟪帰属清算型⟫においては、目的物の適正評価額が債務額を上回る場合には⟪清算金の支払又はその提供⟫がされた時、上回らない場合には⟪その旨の通知⟫がされた時をいい、⟪処分清算型⟫においては⟪処分の時⟫をいうと解する⦆⟨1⟩。","answers":["担保権の実行が完了するまで","受戻権","清算金の支払又はその提供","その旨の通知","処分の時"],"check":"弁済期経過後も**実行完了まで**受戻し可／帰属清算型＝清算金の支払・提供時／清算金なしの場合＝**その旨の通知時**／処分清算型＝**処分時**","notes":[{"n":1,"label":"最一小判 昭和62・2・12","case":"最一小判 昭和62・2・12 民集41巻1号67頁","gist":"実行の枠組み（処分権能→換価処分→弁済充当→清算金）。受戻権は**担保権の実行を完了するまで**。完了時期＝帰属清算型は清算金の支払・提供時／上回らない旨の通知時、処分清算型は処分時"}],"law":"","cites":[],"rate":0,"designed":true,"ref":false,"hash":"a6c2b2c3aeed"},{"id":"民法/譲渡担保_法的構成と実行#4","block":"第4〔弁済期後に第三者へ譲渡された場合〕","kind":"cloze","masked":"債権者は、譲渡担保契約が帰属清算型であると処分清算型であるとを⟦ア⟧、弁済期の経過により目的物を処分する権能を取得する。したがって、⦅債権者がこの権能に基づいて目的物を第三者に譲渡したときは、原則として、譲受人は目的物の所有権を⟦イ⟧し、設定者は、清算金がある場合にその支払を求めることができるにとどまり、残債務を弁済して目的物を⟦ウ⟧と解する⦆⟨1⟩。\n⦅この理は、譲受人が⟦エ⟧に当たる場合であっても⟦オ⟧⦆⟨2⟩。そう解さないと、権利関係の確定しない状態が続くばかりでなく、譲受人が⟦エ⟧に当たるかどうかを確知し得る立場にあるとは限らない債権者に、不測の損害を被らせるおそれを生ずるからである。\nもっとも、⦅設定者は、債権者に対する⟦カ⟧を被担保債権とする⟦キ⟧をもって、譲受人及びその転得者からの明渡請求を拒むことができる⦆⟨3⟩。","body":"債権者は、譲渡担保契約が帰属清算型であると処分清算型であるとを⟪問わず⟫、弁済期の経過により目的物を処分する権能を取得する。したがって、⦅債権者がこの権能に基づいて目的物を第三者に譲渡したときは、原則として、譲受人は目的物の所有権を⟪確定的に取得⟫し、設定者は、清算金がある場合にその支払を求めることができるにとどまり、残債務を弁済して目的物を⟪受け戻すことはできない⟫と解する⦆⟨1⟩。\n⦅この理は、譲受人が⟪背信的悪意者⟫に当たる場合であっても⟪異ならない⟫⦆⟨2⟩。そう解さないと、権利関係の確定しない状態が続くばかりでなく、譲受人が背信的悪意者に当たるかどうかを確知し得る立場にあるとは限らない債権者に、不測の損害を被らせるおそれを生ずるからである。\nもっとも、⦅設定者は、債権者に対する⟪清算金支払請求権⟫を被担保債権とする⟪留置権⟫をもって、譲受人及びその転得者からの明渡請求を拒むことができる⦆⟨3⟩。","answers":["問わず","確定的に取得","受け戻すことはできない","背信的悪意者","異ならない","清算金支払請求権","留置権"],"check":"**帰属清算型・処分清算型を問わず**処分権能／譲受人が確定的に取得／設定者は清算金請求にとどまる／**背信的悪意者でも同じ**／理由2つ（権利関係が確定しない・債権者に不測の損害）／**清算金請求権を被担保債権とする留置権**","notes":[{"n":1,"label":"最三小判 平成6・2・22","case":"最三小判 平成6・2・22 民集48巻2号414頁","gist":"弁済期に弁済がないときは、**帰属清算型・処分清算型を問わず**債権者は処分権能を取得し、これに基づく譲渡により譲受人は所有権を**確定的に取得**、債務者は受戻し不可。**背信的悪意者でも同じ**"},{"n":2,"label":"最三小判 平成6・2・22","case":"最三小判 平成6・2・22 民集48巻2号414頁","gist":"弁済期に弁済がないときは、**帰属清算型・処分清算型を問わず**債権者は処分権能を取得し、これに基づく譲渡により譲受人は所有権を**確定的に取得**、債務者は受戻し不可。**背信的悪意者でも同じ**"},{"n":3,"label":"最判 平成9・4・11","case":"最判 平成9・4・11 集民183号241頁","gist":"設定者は、第三者や転得者からの明渡請求に対し、譲渡担保権者に対する**清算金支払請求権を被担保債権とする留置権**を主張できる"}],"law":"","cites":[],"rate":0,"designed":true,"ref":false,"hash":"6151f01a337b"},{"id":"民法/譲渡担保_法的構成と実行#5","block":"第5〔弁済期前の処分・設定者側からの処分〕","kind":"cloze","masked":"これに対し、⟪弁済期前⟫は、債権者は債権担保の目的を達するのに必要な範囲内で所有権を有するにすぎず、⟦ア⟧。したがって、その譲受人は担保の負担を免れた所有権を取得することはできず、設定者は、被担保債権を弁済して譲受人に⟦イ⟧することができる。ただし、目的物が動産であるときは⟦ウ⟧により、不動産であるときは設定者に外観作出の帰責性があり譲受人が善意であるときは⟦エ⟧により、譲受人が完全な所有権を取得することがある。\n逆に、⟪設定者⟫が目的動産を第三者に譲渡した場合、譲受人は⟦オ⟧を取得するにとどまり、担保の負担のない所有権を取得するには⟦ウ⟧の要件を満たすことを要する。","body":"これに対し、⟪弁済期前⟫は、債権者は債権担保の目的を達するのに必要な範囲内で所有権を有するにすぎず、⟪処分権能を有しない⟫。したがって、その譲受人は担保の負担を免れた所有権を取得することはできず、設定者は、被担保債権を弁済して譲受人に⟪所有権を主張⟫することができる。ただし、目的物が動産であるときは⟪即時取得⟫により、不動産であるときは設定者に外観作出の帰責性があり譲受人が善意であるときは⟪94条2項の類推適用⟫により、譲受人が完全な所有権を取得することがある。\n逆に、⟪設定者⟫が目的動産を第三者に譲渡した場合、譲受人は⟪譲渡担保の負担が付いた地位⟫を取得するにとどまり、担保の負担のない所有権を取得するには即時取得の要件を満たすことを要する。","answers":["処分権能を有しない","所有権を主張","即時取得","94条2項の類推適用","譲渡担保の負担が付いた地位"],"check":"弁済期前は**処分権能なし**／動産＝192条・不動産＝**94条2項類推**（帰責性＋善意）／設定者側からの処分＝譲受人は負担付き・即時取得で負担なし","notes":[],"law":"","cites":["民法/94"],"rate":2,"designed":true,"ref":false,"hash":"71042fdcad0e"}],"setsurei":["AはBから2000万円を借り受け、その担保としてA所有の甲土地（時価3000万円）につきBを譲渡担保権者とする譲渡担保契約を締結し、Bへの所有権移転登記を経由した。契約では、Aが弁済しないときはBが甲を適正に評価してその所有権を確定的に取得し、差額を清算する旨が合意されていた（帰属清算型）。甲の占有はAが継続していた。 弁済期が経過してもAは弁済せず、Bは清算金の支払も提供も、清算金がない旨の通知もしないまま、譲渡担保の事情を知り、かつAが早晩弁済して甲を取り戻すのを封じる目的で、Cに甲を**贈与**して移転登記を了した。その後Aは残債務2000万円全額を弁済供託し、甲の受戻しを主張している。 (1) Aは、Cに対して甲の所有権を主張できるか。 (2) Cから甲の明渡しを求められたAは、これを拒むことができるか。","AはBから500万円を借り受け、その担保としてA所有の機械乙（時価800万円）につきBを譲渡担保権者とする譲渡担保契約を締結し、占有改定の方法で引渡しをした。乙はAの工場に置かれたままAが使用していた。 ところが、**弁済期の到来前に**、BはCに乙を600万円で売却した。乙はなおAの工場にあり、Cは現実の引渡しを受けていない。その後、Aは弁済期に500万円全額をBに弁済した。 (1) Aは、Cに対して乙の所有権を主張できるか。 (2) Cが乙の現実の引渡しを受け、譲渡担保の事実を知らず知らないことに過失もなかった場合はどうか。"],"full":"譲渡担保は、債権担保の目的で目的物の所有権を移転する形式を採るものであるが、その実質は担保にすぎない。そうだとすれば、その実質を重視すべきであり、⦅所有権の移転は債権担保の目的を達するのに⟪必要な範囲内⟫においてのみ生じ、設定者にも⟪所有権的な権利の一部⟫が留保されると解する⦆⟨1⟩。\nしたがって、設定者は、実行が完了するまでは被担保債権を弁済して⟪完全な所有権を回復⟫することができ、また、⦅⟪特段の事情のない限り⟫、正当な権原なく目的物を占有する者に対してその⟪返還を請求⟫することができる⦆⟨2⟩。\n\n債務者が弁済期に債務を弁済しないときは、債権者は⟪目的物を処分する権能⟫を取得し、この権能に基づき、目的物を適正に評価された価額で確定的に自己の所有に帰せしめ（⟪帰属清算型⟫）、又は第三者に売却等をして換価処分し（⟪処分清算型⟫）、その評価額又は売却代金をもって自己の債権の弁済に充てることができる。そして、⦅その結果⟪剰余が生じるとき⟫は、これを⟪清算金⟫として設定者に支払うことを要すると解する⦆⟨1⟩。譲渡担保はあくまで債権の満足を得るための手段であり、債権額を超える価値まで債権者に取得させることは担保の目的を超えるからである。\nそして、債権者が実行として目的物の引渡し又は明渡しを求めた場合において、設定者が清算金の支払と引換えにこれをなすべき旨を主張したときは、⦅特段の事情のない限り、債権者の請求は清算金の支払と⟪引換えにのみ認容⟫される⦆⟨2⟩。清算金の現実の支払を確保する必要があるからである。\n\n設定者は、弁済期の経過後であっても、⟪担保権の実行が完了するまで⟫の間は、債務の全額を弁済して譲渡担保権を消滅させ、目的物の所有権を回復することができる（⟪受戻権⟫）。弁済期を過ぎても債権者が債権の満足を得られるのであれば、なお設定者に目的物を取り戻させるのが担保の目的に適うからである。\n⦅実行の完了とは、⟪帰属清算型⟫においては、目的物の適正評価額が債務額を上回る場合には⟪清算金の支払又はその提供⟫がされた時、上回らない場合には⟪その旨の通知⟫がされた時をいい、⟪処分清算型⟫においては⟪処分の時⟫をいうと解する⦆⟨1⟩。\n\n債権者は、譲渡担保契約が帰属清算型であると処分清算型であるとを⟪問わず⟫、弁済期の経過により目的物を処分する権能を取得する。したがって、⦅債権者がこの権能に基づいて目的物を第三者に譲渡したときは、原則として、譲受人は目的物の所有権を⟪確定的に取得⟫し、設定者は、清算金がある場合にその支払を求めることができるにとどまり、残債務を弁済して目的物を⟪受け戻すことはできない⟫と解する⦆⟨1⟩。\n⦅この理は、譲受人が⟪背信的悪意者⟫に当たる場合であっても⟪異ならない⟫⦆⟨2⟩。そう解さないと、権利関係の確定しない状態が続くばかりでなく、譲受人が背信的悪意者に当たるかどうかを確知し得る立場にあるとは限らない債権者に、不測の損害を被らせるおそれを生ずるからである。\nもっとも、⦅設定者は、債権者に対する⟪清算金支払請求権⟫を被担保債権とする⟪留置権⟫をもって、譲受人及びその転得者からの明渡請求を拒むことができる⦆⟨3⟩。\n\nこれに対し、⟪弁済期前⟫は、債権者は債権担保の目的を達するのに必要な範囲内で所有権を有するにすぎず、⟪処分権能を有しない⟫。したがって、その譲受人は担保の負担を免れた所有権を取得することはできず、設定者は、被担保債権を弁済して譲受人に⟪所有権を主張⟫することができる。ただし、目的物が動産であるときは⟪即時取得⟫により、不動産であるときは設定者に外観作出の帰責性があり譲受人が善意であるときは⟪94条2項の類推適用⟫により、譲受人が完全な所有権を取得することがある。\n逆に、⟪設定者⟫が目的動産を第三者に譲渡した場合、譲受人は⟪譲渡担保の負担が付いた地位⟫を取得するにとどまり、担保の負担のない所有権を取得するには即時取得の要件を満たすことを要する。","kata":"","hanrei":[["最一小判 昭和46・3・25 民集25巻2号208頁","譲渡担保権者は、目的物の価額から自己の債権額を差し引いた残額を**清算金**として債務者に支払うことを要する。引渡・明渡請求に対し債務者が引換給付を主張したときは、特段の事情のある場合を除き、清算金の支払と**引換えにのみ**認容される","**民法百選Ⅰ〔第9版〕94番（＝〔第8版〕97番・〔第7版〕96番）**。事案＝時価349万余円の土地／債務246万余円"],["最三小判 平成6・2・22 民集48巻2号414頁","弁済期に弁済がないときは、**帰属清算型・処分清算型を問わず**債権者は処分権能を取得し、これに基づく譲渡により譲受人は所有権を**確定的に取得**、債務者は受戻し不可。**背信的悪意者でも同じ**","**民法百選Ⅰ〔第9版〕95番（＝〔第8版〕98番・〔第7版〕97番）**。事案は**贈与**による処分"],["最一小判 昭和62・2・12 民集41巻1号67頁","実行の枠組み（処分権能→換価処分→弁済充当→清算金）。受戻権は**担保権の実行を完了するまで**。完了時期＝帰属清算型は清算金の支払・提供時／上回らない旨の通知時、処分清算型は処分時","百選未収録（グレップ確認済み）"],["最判 昭和57・9・28 判時1062号81頁","譲渡担保による所有権移転は「**債権担保の目的を達するのに必要な範囲内**」でのみ生じる。設定者は、**特段の事情のない限り**、正当な権原なく目的物を占有する者に**返還を請求できる**","百選未収録（グレップ確認済み）。**小法廷はDBで確認できなかったため「最判」とだけ表記**（DB内の全出典が小法廷を特定していない）"],["最判 平成8・11・22","譲渡担保権設定者は、清算金の支払・提供も清算金がない旨の通知もない間に**受戻権を放棄しても、清算金の支払を請求できない**","百選未収録。出典＝『体系別短答過去問題集 民法(上)』p.692・704"],["最判 平成9・4・11 集民183号241頁","設定者は、第三者や転得者からの明渡請求に対し、譲渡担保権者に対する**清算金支払請求権を被担保債権とする留置権**を主張できる","百選未収録。出典＝百選Ⅰ〔第9版〕95番解説4、『伊藤真の速習短答過去問 民法』p.255"],["最判 平成18・10・20 民集60巻8号3098頁","**弁済期前**の差押え＝譲渡担保権者に処分権能はなく、設定者が弁済期までに全額弁済して受け戻したときは第三者異議可。**弁済期後**の差押え＝設定者は換価を受忍すべき立場にあり、差押登記後に弁済しても第三者異議不可","百選未収録（平18重判〔6〕）"],["最判 平成5・2・26 民集47巻2号1653頁","譲渡担保設定者は目的不動産について**所有者としての被保険利益**を有し、有効に火災保険契約を締結できる","百選未収録"],["最判 昭和56・12・17 民集35巻9号1328頁／最判 昭和58・2・24 判時1078号76頁","動産譲渡担保設定者の一般債権者による強制執行に対し、譲渡担保権者は**第三者異議の訴え**を提起できる","百選未収録"],["最一小判 平成18・7・20 民集60巻6号2499頁","重複して譲渡担保を設定すること自体は許されるが、**劣後する譲渡担保に独自の私的実行の権限は認められない**","**民法百選Ⅰ〔第9版〕97番（＝〔第8版〕99番・〔第7版〕98番）**。集合動産の事案。集合動産の論点は別論証"],["最一小判 昭和35・2・11 民集14巻2号168頁","**占有改定**は192条の「占有を始めた」に含まれない","**民法百選Ⅰ〔第9版〕64番（＝〔第8版〕68番・〔第7版〕65番）**。前提論点（別論証『即時取得_192条〜194条』）"],["最判 昭和51・9・21","借地上の建物を譲渡担保としたときは、特別の事情がない限り譲渡担保権の効力は**土地の賃借権にも及び**、実行により建物所有権を取得した者に賃借権も譲渡される","百選未収録。出典＝『体系別短答』p.692、『速習短答』p.255"],["最判 昭和61・7・15","譲渡担保の**被担保債権の範囲**は、強行法規・公序良俗に反しない限り当事者間で自由に定められ、抵当権（375条）のような制限はない","百選未収録。出典＝『伊藤真の速習短答過去問 民法』p.254"]],"field":"非典型担保","order":21},{"name":"錯誤_95条","subject":"民法","rank":"A","path":"まとめ/民法/論証/錯誤_95条.md","cards":[{"id":"民法/錯誤_95条#1","block":"第1〔1 類型〕","kind":"cloze","masked":"意思表示は、①⟦ア⟧（⟦イ⟧）、または②⟦ウ⟧についてのその⟦エ⟧（⟦オ⟧）に基づくものであって、その錯誤が⟦カ⟧なものであるときは、取り消すことができる。","body":"意思表示は、①⟪意思表示に対応する意思を欠く錯誤⟫（⟪95条1項1号⟫）、または②⟪表意者が法律行為の基礎とした事情⟫についてのその⟪認識が真実に反する錯誤⟫（⟪同項2号⟫）に基づくものであって、その錯誤が⟪法律行為の目的及び取引上の社会通念に照らして重要⟫なものであるときは、取り消すことができる。","answers":["意思表示に対応する意思を欠く錯誤","95条1項1号","表意者が法律行為の基礎とした事情","認識が真実に反する錯誤","同項2号","法律行為の目的及び取引上の社会通念に照らして重要"],"check":"1号（意思を欠く）／2号（基礎事情）の**振り分け**＋1項柱書の重要性 ／ 「意思表示に対応する意思を欠く」／「法律行為の基礎とした事情」／「目的及び取引上の社会通念に照らして重要」","notes":[],"law":"","cites":["民法/95"],"rate":59,"designed":true,"ref":true,"hash":"1734157b1281"},{"id":"民法/錯誤_95条#2","block":"第2〔2 表示要件〕","kind":"cloze","masked":"もっとも、2号の錯誤による取消しは、その事情が法律行為の基礎とされていることが表示されていたときに限りすることができる（同条2項）。\nそこで、「表示されていた」の意味が問題となる。\n思うに、動機は本来表意者の内心にとどまる事情であり、その誤りによる不利益は本来表意者が負担すべきものである。にもかかわらず取消しを認めることは、その不利益を相手方に引き受けさせることを意味するから、相手方に不利益を負担させるだけの根拠がなければならず、⦅表意者が⟦ア⟧というべきである⦆⟨1⟩。\nしたがって、「その事情が法律行為の基礎とされていることが表示されていた」とは、当該事情についての表意者の⟦イ⟧、相手方においてもこれを⟦ウ⟧、⦅⟦エ⟧ことをいうと解する⦆⟨2⟩。⦅なお、この表示は⟦オ⟧⦆⟨3⟩。","body":"もっとも、2号の錯誤による取消しは、その事情が法律行為の基礎とされていることが表示されていたときに限りすることができる（同条2項）。\nそこで、「表示されていた」の意味が問題となる。\n思うに、動機は本来表意者の内心にとどまる事情であり、その誤りによる不利益は本来表意者が負担すべきものである。にもかかわらず取消しを認めることは、その不利益を相手方に引き受けさせることを意味するから、相手方に不利益を負担させるだけの根拠がなければならず、⦅表意者が⟪一方的に動機を表示しただけでは足りない⟫というべきである⦆⟨1⟩。\nしたがって、「その事情が法律行為の基礎とされていることが表示されていた」とは、当該事情についての表意者の⟪認識が相手方に示され⟫、相手方においてもこれを⟪法律行為の前提として受け入れ⟫、⦅⟪法律行為の内容となっていた⟫ことをいうと解する⦆⟨2⟩。⦅なお、この表示は⟪黙示のものでも足りる⟫⦆⟨3⟩。","answers":["一方的に動機を表示しただけでは足りない","認識が相手方に示され","法律行為の前提として受け入れ","法律行為の内容となっていた","黙示のものでも足りる"],"check":"**2号のときだけ**2項が働くこと／表示の意味の**立場を明示**／理由（不利益の引受け）／**黙示可** ／ 「基礎とされていることが表示されていたときに限り」／**法律行為の内容となっていた**／一方的表示では足りない／黙示","notes":[{"n":1,"label":"最判昭和37・12・25","case":"最判昭和37・12・25　訟月9巻1号38頁","gist":"動機が表意者から一方的に表示されて相手方に伝わっても、意思表示の効力否定原因とならない場合がある"},{"n":2,"label":"最判平成28・1・12","case":"最判平成28・1・12　民集70巻1号1頁","gist":"信用保証協会の保証契約において、「主債務者が反社会的勢力でないこと」は、それを想定した定めを置くなどの個別事情がない限り**保証契約の内容とならない**。動機が表示されても法律行為の内容とならない場合があることを明らかにした。"},{"n":3,"label":"最判平成元・9・14","case":"最判平成元・9・14　判時1336号93頁","gist":"離婚に伴う財産分与で、分与者に譲渡所得税が課されることを知らずに夫が妻への課税を気遣う発言をし、妻も自己に課税されると認識していた事案。特段の事情がない限り、夫は自己に課税されないことを当然の前提とし、**その旨を黙示的に表示していた**として95条適用の可能性を認めた。"}],"law":"","cites":[],"rate":0,"designed":true,"ref":false,"hash":"4b958af9c28d"},{"id":"民法/錯誤_95条#3","block":"第3〔3 重要性〕","kind":"cloze","masked":"「重要なもの」といえるためには、⟦ア⟧という関係（⟦イ⟧）があり、かつ、⟦ウ⟧といえること（⟦エ⟧）が必要である。","body":"「重要なもの」といえるためには、⟪その錯誤がなければ表意者はその意思表示をしなかったであろう⟫という関係（⟪主観的因果性⟫）があり、かつ、⟪通常人であってもその意思表示をしなかったであろう⟫といえること（⟪客観的重要性⟫）が必要である。","answers":["その錯誤がなければ表意者はその意思表示をしなかったであろう","主観的因果性","通常人であってもその意思表示をしなかったであろう","客観的重要性"],"check":"**主観的因果性＋客観的重要性**の2本立て ／ その錯誤がなければしなかった／通常人でもしなかった","notes":[],"law":"","cites":[],"rate":0,"designed":true,"ref":false,"hash":"6fb59fc1cea3"},{"id":"民法/錯誤_95条#4","block":"第4〔4 重過失〕","kind":"cloze","masked":"錯誤が表意者の⟦ア⟧によるものであった場合には、取消しをすることができない（⟦イ⟧）。表意者の⟦ウ⟧からである。\nただし、①相手方が表意者に⟦エ⟧とき（同項1号）、②相手方が表意者と⟦オ⟧とき（同項2号）は、この限りでない。いずれも、⟦カ⟧からである。","body":"錯誤が表意者の⟪重大な過失⟫によるものであった場合には、取消しをすることができない（⟪95条3項柱書⟫）。表意者の⟪保護に値する程度が低い⟫からである。\nただし、①相手方が表意者に⟪錯誤があることを知り、又は重大な過失によって知らなかった⟫とき（同項1号）、②相手方が表意者と⟪同一の錯誤に陥っていた⟫とき（同項2号）は、この限りでない。いずれも、⟪相手方に保護に値する信頼がない⟫からである。","answers":["重大な過失","95条3項柱書","保護に値する程度が低い","錯誤があることを知り、又は重大な過失によって知らなかった","同一の錯誤に陥っていた","相手方に保護に値する信頼がない"],"check":"3項柱書の原則＋**1号・2号の例外を両方** ／ 相手方の悪意・重過失／**共通錯誤**／理由＝相手方に保護に値する信頼なし","notes":[],"law":"95条3項柱書・1号・2号（重過失と、相手方悪意・共通錯誤の例外）","cites":["民法/95"],"rate":37,"designed":true,"ref":false,"hash":"1eea0aedf1ea"},{"id":"民法/錯誤_95条#5","block":"第5〔5 第三者〕","kind":"cloze","masked":"錯誤による意思表示の取消しは、⟦ア⟧第三者に対抗することができない（⟦イ⟧）。\n同項の趣旨は、取消しの遡及効（121条）によって害される第三者を保護する点にあるから、同項の「第三者」とは、⟦ウ⟧、錯誤による意思表示を前提として⟦エ⟧を有するに至った者をいうと解する。\nまた、同項の第三者として保護されるために、⟦オ⟧と解する。明文がないうえ、詐欺の被害者と異なり錯誤に陥った表意者を厚く保護すべき理由はなく、これを要求すると⦅⟦カ⟧⦆⟨1⟩からである。\nなお、表意者と第三者は前主・後主の関係に立ち対抗関係にないから、⟦キ⟧。","body":"錯誤による意思表示の取消しは、⟪善意でかつ過失がない⟫第三者に対抗することができない（⟪95条4項⟫）。\n同項の趣旨は、取消しの遡及効（121条）によって害される第三者を保護する点にあるから、同項の「第三者」とは、⟪取消し前に⟫、錯誤による意思表示を前提として⟪新たに独立した法律上の利害関係⟫を有するに至った者をいうと解する。\nまた、同項の第三者として保護されるために、⟪権利保護資格要件としての登記は必要でない⟫と解する。明文がないうえ、詐欺の被害者と異なり錯誤に陥った表意者を厚く保護すべき理由はなく、これを要求すると⦅⟪錯誤者を被詐欺者より厚く保護することになって均衡を失する⟫⦆⟨1⟩からである。\nなお、表意者と第三者は前主・後主の関係に立ち対抗関係にないから、⟪対抗要件としての登記も必要でない⟫。","answers":["善意でかつ過失がない","95条4項","取消し前に","新たに独立した法律上の利害関係","権利保護資格要件としての登記は必要でない","錯誤者を被詐欺者より厚く保護することになって均衡を失する","対抗要件としての登記も必要でない"],"check":"4項／**善意かつ無過失**（善意だけでない）／**取消前**の第三者／権利保護資格要件としての**登記不要**＋理由 ／ 「善意でかつ過失がない第三者」／121条の遡及効／新たに独立した法律上の利害関係／詐欺より厚く保護することになる","notes":[{"n":1,"label":"最判昭和49・9・26","case":"最判昭和49・9・26　民集28巻6号1213頁","gist":"96条3項の第三者として保護されるために、**対抗要件を備えたものに限定しなければならない理由は見出し難い**として**登記不要説**に立つ。"}],"law":"","cites":["民法/95","民法/121"],"rate":10,"designed":true,"ref":false,"hash":"1f4f0da6683f"}],"setsurei":["Gは、妻Hとの離婚に伴い、自己所有の丁土地をHに財産分与する旨の契約を締結した。契約の際、Gは「これで自分に税金はかからないはずだ」と述べ、Hも「そうだね、もらう私に贈与税がかかるだけだろう」と応じていた。実際には、財産分与をした**Gの側に多額の譲渡所得税**が課された。Gは驚き、Hに対し財産分与契約を錯誤により取り消す旨の意思表示をした。 ところが取消しの前に、Hは丁土地をIに売却していた。Iは、GH間の事情を知らず、知らないことに過失もなかったが、**所有権移転登記はH名義のままで、Iに移転していない**。 (1) Gは財産分与契約を錯誤取消しできるか。 (2) Gは、Iに対して取消しを対抗できるか。","Aは、自宅のテレビが映らなくなったので故障したと思い込み、家電量販店Bで新品のテレビを50万円で購入した。契約の際、Aは店員に「うちのテレビが壊れてしまって」と告げていた。帰宅後に確認したところ、**テレビのコンセントが抜けていただけ**で故障はしていなかった。なお、Aは購入前にコンセントを一目見れば抜けていることが分かる状態であった。 また、Aは申込書に「50万円」と書くつもりで**誤って「500万円」と記載**しており、Bもそのまま500万円で契約書を作成していた。 (1) Aは「テレビが故障していた」という点の錯誤を理由に取消しできるか。 (2) 代金額の記載についてはどうか。"],"full":"1　錯誤の類型\n意思表示は、①⟪意思表示に対応する意思を欠く錯誤⟫（⟪95条1項1号⟫）、または②⟪表意者が法律行為の基礎とした事情⟫についてのその⟪認識が真実に反する錯誤⟫（⟪同項2号⟫）に基づくものであって、その錯誤が⟪法律行為の目的及び取引上の社会通念に照らして重要⟫なものであるときは、取り消すことができる。\n\n2　基礎事情の錯誤における表示要件（2号のとき）\nもっとも、2号の錯誤による取消しは、その事情が法律行為の基礎とされていることが表示されていたときに限りすることができる（同条2項）。\nそこで、「表示されていた」の意味が問題となる。\n思うに、動機は本来表意者の内心にとどまる事情であり、その誤りによる不利益は本来表意者が負担すべきものである。にもかかわらず取消しを認めることは、その不利益を相手方に引き受けさせることを意味するから、相手方に不利益を負担させるだけの根拠がなければならず、⦅表意者が⟪一方的に動機を表示しただけでは足りない⟫というべきである⦆⟨1⟩。\nしたがって、「その事情が法律行為の基礎とされていることが表示されていた」とは、当該事情についての表意者の⟪認識が相手方に示され⟫、相手方においてもこれを⟪法律行為の前提として受け入れ⟫、⦅⟪法律行為の内容となっていた⟫ことをいうと解する⦆⟨2⟩。⦅なお、この表示は⟪黙示のものでも足りる⟫⦆⟨3⟩。\n\n3　重要性（1項柱書）\n「重要なもの」といえるためには、⟪その錯誤がなければ表意者はその意思表示をしなかったであろう⟫という関係（⟪主観的因果性⟫）があり、かつ、⟪通常人であってもその意思表示をしなかったであろう⟫といえること（⟪客観的重要性⟫）が必要である。\n\n4　重過失（3項）\n錯誤が表意者の⟪重大な過失⟫によるものであった場合には、取消しをすることができない（⟪95条3項柱書⟫）。表意者の⟪保護に値する程度が低い⟫からである。\nただし、①相手方が表意者に⟪錯誤があることを知り、又は重大な過失によって知らなかった⟫とき（同項1号）、②相手方が表意者と⟪同一の錯誤に陥っていた⟫とき（同項2号）は、この限りでない。いずれも、⟪相手方に保護に値する信頼がない⟫からである。\n\n5　第三者との関係（4項）\n錯誤による意思表示の取消しは、⟪善意でかつ過失がない⟫第三者に対抗することができない（⟪95条4項⟫）。\n同項の趣旨は、取消しの遡及効（121条）によって害される第三者を保護する点にあるから、同項の「第三者」とは、⟪取消し前に⟫、錯誤による意思表示を前提として⟪新たに独立した法律上の利害関係⟫を有するに至った者をいうと解する。\nまた、同項の第三者として保護されるために、⟪権利保護資格要件としての登記は必要でない⟫と解する。明文がないうえ、詐欺の被害者と異なり錯誤に陥った表意者を厚く保護すべき理由はなく、これを要求すると⦅⟪錯誤者を被詐欺者より厚く保護することになって均衡を失する⟫⦆⟨1⟩からである。\nなお、表意者と第三者は前主・後主の関係に立ち対抗関係にないから、⟪対抗要件としての登記も必要でない⟫。","kata":"","hanrei":[["最判平成28・1・12　民集70巻1号1頁","信用保証協会の保証契約において、「主債務者が反社会的勢力でないこと」は、それを想定した定めを置くなどの個別事情がない限り**保証契約の内容とならない**。動機が表示されても法律行為の内容とならない場合があることを明らかにした。","**改正前95条の事案（旧法）**だが、2項の解釈の土台。〔主〕内容化重視説の判例上の根拠。**民法判例百選Ⅰ〔第9版〕22番＝〔第8版〕24番**「動機（法律行為の基礎とした事情）についての錯誤」（解説：山下純司。第9版は紙面 p.46〜47・第8版は p.50）"],["最判平成14・7・11　判時1805号56頁","空クレジット（商品購入を伴わない立替払契約）の連帯保証について、「**保証契約は、特定の主債務を保証する契約であるから、主債務がいかなるものであるかは、保証契約の重要な内容である**」として錯誤無効を認めた。**動機の表示に言及していない**","**[旧法]**。平28・1・12 との**対比**が重要——「主債務が何か」は当然に契約内容になるが、「主債務者が反社会的勢力でないこと」は主債務者に関する事情の一つにすぎない。百選Ⅰ〔第9版〕22番 解説 3(3) が引用"],["最判平成28・12・19　判時2327号21頁","信用保証契約において「主債務者が〔融資要件としての〕中小企業者の実体を有する」ことについての錯誤。平28・1・12 と同じ判断枠組み","**[旧法]**。同解説 4(4) が引用"],["最判昭和37・12・25　訟月9巻1号38頁","動機が表意者から一方的に表示されて相手方に伝わっても、意思表示の効力否定原因とならない場合がある","**[旧法]**。同解説 3(2) が引用"],["最判平成元・9・14　判時1336号93頁","離婚に伴う財産分与で、分与者に譲渡所得税が課されることを知らずに夫が妻への課税を気遣う発言をし、妻も自己に課税されると認識していた事案。特段の事情がない限り、夫は自己に課税されないことを当然の前提とし、**その旨を黙示的に表示していた**として95条適用の可能性を認めた。","**[旧法]**（改正前95条の事案）。**百選Ⅰ〔第7版〕24番。第8版・第9版では削除**されており、いま索引に載っている第9版には無い（判旨自体は第9版22番の解説 3(2) に引用されている）。**黙示の表示**の根拠。設例1の下敷き"],["最判昭和29・11・26　民集8巻11号2087頁","「動機は表意者が当該意思表示の内容としてこれを相手方に表示した場合でない限り法律行為の要素とはならない」。家屋の現居住者と同居できると誤信して購入した事案で、動機の表示がなかったとして錯誤無効を認めなかった。","**[旧法]**。二元説の定式。『民法判例百選Ⅰ［第8版］』p.63 で引用"],["大判明治38・12・19　民録11輯1786頁","意思表示の動機（縁由）についての錯誤は、意思表示の無効原因とはならない（原則）。","**[旧法]**。二元説の出発点。同 p.63 で引用"],["最判昭和49・9・26　民集28巻6号1213頁","96条3項の第三者として保護されるために、**対抗要件を備えたものに限定しなければならない理由は見出し難い**として**登記不要説**に立つ。","**95条4項の登記の要否を論じる際の参照判例**（`R6_採点実感_民事系` p.6 が明示的に参照を求めている）。**民法判例百選Ⅰ〔第9版〕23番＝〔第8版〕23番＝〔第7版〕23番**「詐欺における第三者の登記の必要性」（解説：竹中悟人。第8版は紙面 p.48）。**3版とも23番**。**詐欺側の詳細は別論証の担当**——本論証では95条4項の均衡論の材料としてのみ用いる"]],"field":"意思表示（錯誤・詐欺）","order":0},{"name":"集合動産譲渡担保_特定性と処分権限","subject":"民法","rank":"A","path":"まとめ/民法/論証/集合動産譲渡担保_特定性と処分権限.md","cards":[{"id":"民法/集合動産譲渡担保_特定性と処分権限#1","block":"第1〔集合物としての有効性＝特定性〕","kind":"cloze","masked":"⦅構成部分の変動する集合動産であっても、その⟦ア⟧を指定するなどの方法によって目的物の範囲が特定される場合には、⟦イ⟧として譲渡担保の目的とすることができると解する⦆⟨1⟩。\nなぜなら、営業資産を利用させたまま担保に取る社会的必要性が高く、他方、目的物の範囲を画する⟦ウ⟧さえ示されていれば、実行の対象を確定でき、第三者にも不測の損害を与えないからである。\nしたがって、量を明示したために目的物が集合体の一部分にとどまり、どの部分かを画せない場合（部分的指定）⟨2⟩や、「家財一切」のようにどの物が該当するか識別できない場合は、⟦エ⟧である⟨3⟩。","body":"⦅構成部分の変動する集合動産であっても、その⟪種類、所在場所及び量的範囲⟫を指定するなどの方法によって目的物の範囲が特定される場合には、⟪一個の集合物⟫として譲渡担保の目的とすることができると解する⦆⟨1⟩。\nなぜなら、営業資産を利用させたまま担保に取る社会的必要性が高く、他方、目的物の範囲を画する⟪基準⟫さえ示されていれば、実行の対象を確定でき、第三者にも不測の損害を与えないからである。\nしたがって、量を明示したために目的物が集合体の一部分にとどまり、どの部分かを画せない場合（部分的指定）⟨2⟩や、「家財一切」のようにどの物が該当するか識別できない場合は、⟪特定を欠き無効⟫である⟨3⟩。","answers":["種類、所在場所及び量的範囲","一個の集合物","基準","特定を欠き無効"],"check":"「構成部分の変動する集合動産」／**種類・所在場所・量的範囲**の3点セット／「一個の集合物」／理由＝実行対象の画定＋第三者の不測の損害防止／量的一部の指定は特定を欠きうる","notes":[{"n":1,"label":"最判昭和54・2・15","case":"最判昭和54・2・15 民集33巻1号51頁","gist":"構成部分の変動する集合動産も、種類・所在場所・量的範囲を指定するなどの方法で範囲が特定されれば一個の集合物として譲渡担保の目的となりうる。ただし本件（「M倉庫業者に寄託中の乾燥ネギ44トンのうちの28トン」）は**特定性を否定**"},{"n":2,"label":"最判昭和54・2・15","case":"最判昭和54・2・15 民集33巻1号51頁","gist":"構成部分の変動する集合動産も、種類・所在場所・量的範囲を指定するなどの方法で範囲が特定されれば一個の集合物として譲渡担保の目的となりうる。ただし本件（「M倉庫業者に寄託中の乾燥ネギ44トンのうちの28トン」）は**特定性を否定**"},{"n":3,"label":"最判昭和57・10・14","case":"最判昭和57・10・14 判時1060号78頁","gist":"「家財一切」との指定は、個々の物件が該当するか識別困難として**特定性を否定**"}],"law":"","cites":[],"rate":0,"designed":true,"ref":false,"hash":"26ac12165804"},{"id":"民法/集合動産譲渡担保_特定性と処分権限#2","block":"第2〔対抗要件と構成部分の変動〕","kind":"cloze","masked":"集合動産譲渡担保の対抗要件は、動産の引渡し（178条）であり、⟦ア⟧（183条）で足りる。\nそして、設定者がその構成部分である動産の占有を取得したときは債権者が⟦ア⟧の方法によりその占有を取得する旨の合意があるときは、設定者が現に存在する動産の占有を取得した時点で対抗要件が具備され、⦅この対抗要件具備の効力は、その後構成部分が変動しても、⟦イ⟧が損なわれない限り、⟦ウ⟧を包含する集合物に及ぶと解する⦆⟨1⟩。\n集合物を一個の物としてとらえる以上、対抗要件も集合物について⟦エ⟧からである。\nなお、設定者が法人であるときは、⟦オ⟧によることもでき、この登記は引渡しとみなされる。","body":"集合動産譲渡担保の対抗要件は、動産の引渡し（178条）であり、⟪占有改定⟫（183条）で足りる。\nそして、設定者がその構成部分である動産の占有を取得したときは債権者が占有改定の方法によりその占有を取得する旨の合意があるときは、設定者が現に存在する動産の占有を取得した時点で対抗要件が具備され、⦅この対抗要件具備の効力は、その後構成部分が変動しても、⟪集合物としての同一性⟫が損なわれない限り、⟪新たに構成部分となった動産⟫を包含する集合物に及ぶと解する⦆⟨1⟩。\n集合物を一個の物としてとらえる以上、対抗要件も集合物について⟪一度具備すれば足りる⟫からである。\nなお、設定者が法人であるときは、⟪動産譲渡登記⟫によることもでき、この登記は引渡しとみなされる。","answers":["占有改定","集合物としての同一性","新たに構成部分となった動産","一度具備すれば足りる","動産譲渡登記"],"check":"引渡し=**178条**／**占有改定=183条**／事前の合意＋現存動産の占有取得で具備／「**集合物としての同一性が損なわれない限り**」新構成部分に及ぶ／（法人なら動産譲渡登記＝引渡しとみなす）","notes":[{"n":1,"label":"最判昭和62・11・10","case":"**最判昭和62・11・10 民集41巻8号1559頁**","gist":"①「第1ないし第4倉庫内及び同敷地・ヤード内」の「普通棒鋼、異形棒鋼等一切の在庫商品」につき**特定性を肯定**（最高裁として初）②占有改定による対抗要件具備の効力は、集合物としての同一性が損なわれない限り新構成部分に及ぶ③譲渡担保権者は**333条の第三取得者**に当たり、特段の事情のない限り第三者異議の訴えで動産競売の不許を求められる"}],"law":"","cites":["民法/178","民法/183"],"rate":2,"designed":true,"ref":false,"hash":"a3a6b099e4b9"},{"id":"民法/集合動産譲渡担保_特定性と処分権限#3","block":"第3〔設定者の処分権限と処分の効果〕","kind":"cloze","masked":"集合物の内容は設定者の営業活動を通じて当然に変動することが予定されているから、設定者には、⟦ア⟧で、目的物を構成する動産を⟦イ⟧が付与されていると解する。したがって、⦅この権限内でされた処分の相手方は、当該動産につき、譲渡担保の拘束を受けることなく⟦ウ⟧する⦆⟨1⟩（搬出の有無を問わない）。\n他方、⦅設定者が⟪通常の営業の範囲を超える売却処分⟫をした場合、当該処分は右権限に基づかないから、保管場所から搬出されるなどして⟦エ⟧したと認められる場合でない限り、処分の相手方は目的物の所有権を⟦オ⟧と解する⦆⟨2⟩。\n「通常の営業の範囲」内かは、設定者の営業内容・契約の定め・処分の規模と価格・時期（危機時期か）・反復継続性などから判断する。目的物の全部を一括して売却するような、営業の継続を不可能にする処分は、通常の営業の範囲を超えるものと⟪評価しうる⟫。\nなお、⦅占有改定による引渡ししか受けていない相手方は、⟦カ⟧（192条）によっても保護されない⦆⟨3⟩。","body":"集合物の内容は設定者の営業活動を通じて当然に変動することが予定されているから、設定者には、⟪通常の営業の範囲内⟫で、目的物を構成する動産を⟪処分する権限⟫が付与されていると解する。したがって、⦅この権限内でされた処分の相手方は、当該動産につき、譲渡担保の拘束を受けることなく⟪確定的に所有権を取得⟫する⦆⟨1⟩（搬出の有無を問わない）。\n他方、⦅設定者が⟪通常の営業の範囲を超える売却処分⟫をした場合、当該処分は右権限に基づかないから、保管場所から搬出されるなどして⟪集合物から離脱⟫したと認められる場合でない限り、処分の相手方は目的物の所有権を⟪承継取得することができない⟫と解する⦆⟨2⟩。\n「通常の営業の範囲」内かは、設定者の営業内容・契約の定め・処分の規模と価格・時期（危機時期か）・反復継続性などから判断する。目的物の全部を一括して売却するような、営業の継続を不可能にする処分は、通常の営業の範囲を超えるものと⟪評価しうる⟫。\nなお、⦅占有改定による引渡ししか受けていない相手方は、⟪即時取得⟫（192条）によっても保護されない⦆⟨3⟩。","answers":["通常の営業の範囲内","処分する権限","確定的に所有権を取得","集合物から離脱","承継取得することができない","即時取得"],"check":"「営業活動を通じて当然に変動することが予定」／「**通常の営業の範囲内**」の処分権限／範囲内→**搬出不要で確定的に取得**／範囲を超える→「**集合物から離脱したと認められる場合でない限り承継取得できない**」／占有改定では**即時取得（192条）不可**","notes":[{"n":1,"label":"最一小判 平成18・7・20","case":"**最判平成18・7・20 民集60巻6号2499頁**","gist":"①重複設定自体は許されるが、**後順位譲渡担保権者による私的実行は認められない**②設定者には**通常の営業の範囲内**での処分権限が付与され、その相手方は確定的に所有権を取得する③**通常の営業の範囲を超える処分**では、集合物から離脱したと認められる場合でない限り承継取得できない"},{"n":2,"label":"最一小判 平成18・7・20","case":"**最判平成18・7・20 民集60巻6号2499頁**","gist":"①重複設定自体は許されるが、**後順位譲渡担保権者による私的実行は認められない**②設定者には**通常の営業の範囲内**での処分権限が付与され、その相手方は確定的に所有権を取得する③**通常の営業の範囲を超える処分**では、集合物から離脱したと認められる場合でない限り承継取得できない"},{"n":3,"label":"最判昭和35・2・11","case":"最判昭和35・2・11","gist":"占有改定では即時取得は成立しない"}],"law":"","cites":["民法/192"],"rate":1,"designed":true,"ref":false,"hash":"d42712d72adc"},{"id":"民法/集合動産譲渡担保_特定性と処分権限#4","block":"第4〔動産売買先取特権との優劣〕","kind":"cloze","masked":"譲渡担保は目的物の所有権を担保権者に移転する形式を採るから、⦅譲渡担保権者は先取特権に優先する「⟦ア⟧」（⟦イ⟧）に当たる⦆⟨1⟩⦅同条の「引渡し」には⟦ウ⟧も含まれる⦆⟨2⟩。\nそして、対抗要件を具備した集合動産譲渡担保の目的である集合物に、動産売買先取特権の目的動産が構成部分として加入した場合、譲渡担保権者は当該動産についても引渡しを受けたものとして譲渡担保権を主張でき、⦅先取特権者が動産競売を申し立てたときは、特段の事情のない限り、⟦イ⟧の⟦ア⟧として、⟦エ⟧によりその競売の不許を求めることができると解する⦆⟨3⟩。","body":"譲渡担保は目的物の所有権を担保権者に移転する形式を採るから、⦅譲渡担保権者は先取特権に優先する「⟪第三取得者⟫」（⟪333条⟫）に当たる⦆⟨1⟩⦅同条の「引渡し」には⟪占有改定⟫も含まれる⦆⟨2⟩。\nそして、対抗要件を具備した集合動産譲渡担保の目的である集合物に、動産売買先取特権の目的動産が構成部分として加入した場合、譲渡担保権者は当該動産についても引渡しを受けたものとして譲渡担保権を主張でき、⦅先取特権者が動産競売を申し立てたときは、特段の事情のない限り、333条の第三取得者として、⟪第三者異議の訴え⟫によりその競売の不許を求めることができると解する⦆⟨3⟩。","answers":["第三取得者","333条","占有改定","第三者異議の訴え"],"check":"311条5号・321条／**333条の「第三取得者」に当たる**／「引渡し」に**占有改定を含む**／「**特段の事情のない限り**」／手段＝**第三者異議の訴え**","notes":[{"n":1,"label":"最判昭和62・11・10","case":"**最判昭和62・11・10 民集41巻8号1559頁**","gist":"①「第1ないし第4倉庫内及び同敷地・ヤード内」の「普通棒鋼、異形棒鋼等一切の在庫商品」につき**特定性を肯定**（最高裁として初）②占有改定による対抗要件具備の効力は、集合物としての同一性が損なわれない限り新構成部分に及ぶ③譲渡担保権者は**333条の第三取得者**に当たり、特段の事情のない限り第三者異議の訴えで動産競売の不許を求められる"},{"n":2,"label":"大判大正6・7・26","case":"大判大正6・7・26","gist":"333条の「引渡し」には**占有改定を含む**"},{"n":3,"label":"最判昭和62・11・10","case":"**最判昭和62・11・10 民集41巻8号1559頁**","gist":"①「第1ないし第4倉庫内及び同敷地・ヤード内」の「普通棒鋼、異形棒鋼等一切の在庫商品」につき**特定性を肯定**（最高裁として初）②占有改定による対抗要件具備の効力は、集合物としての同一性が損なわれない限り新構成部分に及ぶ③譲渡担保権者は**333条の第三取得者**に当たり、特段の事情のない限り第三者異議の訴えで動産競売の不許を求められる"}],"law":"","cites":["民法/333"],"rate":5,"designed":true,"ref":false,"hash":"e422458308ad"},{"id":"民法/集合動産譲渡担保_特定性と処分権限#5","block":"第5〔物上代位〕","kind":"cloze","masked":"集合物譲渡担保権は、集合動産を構成するに至った動産の価値を担保として把握するものであるから、⦅その効力は、目的動産が滅失した場合にその損害をてん補するため設定者に支払われる⟦ア⟧に係る請求権に及ぶ⦆⟨1⟩（⟦イ⟧）。\nもっとも、集合物譲渡担保契約は設定者が目的動産を販売して営業を継続することを前提とするものであるから、⦅設定者が⟦ウ⟧している場合には、直ちに物上代位権を行使できる旨の合意があるなどの特段の事情のない限り、⟦エ⟧と解する⦆⟨2⟩。","body":"集合物譲渡担保権は、集合動産を構成するに至った動産の価値を担保として把握するものであるから、⦅その効力は、目的動産が滅失した場合にその損害をてん補するため設定者に支払われる⟪損害保険金⟫に係る請求権に及ぶ⦆⟨1⟩（⟪304条類推⟫）。\nもっとも、集合物譲渡担保契約は設定者が目的動産を販売して営業を継続することを前提とするものであるから、⦅設定者が⟪通常の営業を継続⟫している場合には、直ちに物上代位権を行使できる旨の合意があるなどの特段の事情のない限り、⟪物上代位権を行使することは許されない⟫と解する⦆⟨2⟩。","answers":["損害保険金","304条類推","通常の営業を継続","物上代位権を行使することは許されない"],"check":"**304条類推**／効力は**損害保険金請求権に及ぶ**／もっとも**通常の営業を継続している間は特段の事情がない限り行使不可**／払渡し前の差押えが必要","notes":[{"n":1,"label":"最決平成22・12・2","case":"最決平成22・12・2 民集64巻8号1990頁","gist":"集合物譲渡担保権の効力は目的動産滅失時の**損害保険金請求権に及ぶ**。もっとも設定者が**通常の営業を継続している場合**には、特段の事情がない限り物上代位権の行使は許されない"},{"n":2,"label":"最決平成22・12・2","case":"最決平成22・12・2 民集64巻8号1990頁","gist":"集合物譲渡担保権の効力は目的動産滅失時の**損害保険金請求権に及ぶ**。もっとも設定者が**通常の営業を継続している場合**には、特段の事情がない限り物上代位権の行使は許されない"}],"law":"","cites":["民法/304"],"rate":1,"designed":true,"ref":false,"hash":"5272dd562d04"}],"setsurei":["鋼材問屋A社は、B銀行から融資を受けるにあたり、B銀行との間で、「A社の第1ないし第3倉庫内および同敷地内を保管場所とし、現にこの場所内に存在する普通棒鋼、異形棒鋼等一切の在庫商品」を目的とし、極度額2億円の根譲渡担保権を設定した。A社が構成動産の占有を取得したときはB銀行が占有改定の方法により占有を取得する旨の合意があり、A社は契約時に現存する在庫の占有を取得していた。 その後A社は、D社から異形棒鋼8,000本（代金600万円）を買い受け、代金未払のまま第2倉庫に搬入した。A社が両債務とも履行しないため、D社は当該異形棒鋼につき動産売買先取特権に基づく動産競売を申し立てた。 B銀行はどのような主張をすることができるか。","ブリ養殖業を営むE社は、F銀行との間で、「甲漁場の生簀内にある養殖魚全部」を目的とする集合動産譲渡担保権（極度額3億円）を設定し、占有改定により引き渡した。契約では、E社が通常の営業の範囲内で養殖魚を出荷・販売することが認められていた。設定当時、甲漁場の生簀内には養殖ブリ20万尾があった。 (1) E社は、例年どおりの出荷として、G社に養殖ブリ3万尾を売却し、生簀から搬出して引き渡した。 (2) その約2か月後、資金繰りに窮したE社は、H社との間で、甲漁場の生簀内の養殖魚**全部（20万尾）**を一括して売却する契約を締結したが、引渡しは占有改定によるものとされ、養殖魚は生簀に置かれたままであった。 (3) さらにその後、E社は廃業して養殖を停止し、間もなく赤潮により生簀内の養殖魚が死滅したため、E社は保険会社に対する損害保険金請求権を取得した。 G社・H社は養殖魚の所有権を取得するか。また、F銀行は損害保険金請求権に物上代位できるか。"],"full":"⦅構成部分の変動する集合動産であっても、その⟪種類、所在場所及び量的範囲⟫を指定するなどの方法によって目的物の範囲が特定される場合には、⟪一個の集合物⟫として譲渡担保の目的とすることができると解する⦆⟨1⟩。\nなぜなら、営業資産を利用させたまま担保に取る社会的必要性が高く、他方、目的物の範囲を画する⟪基準⟫さえ示されていれば、実行の対象を確定でき、第三者にも不測の損害を与えないからである。\nしたがって、量を明示したために目的物が集合体の一部分にとどまり、どの部分かを画せない場合（部分的指定）⟨2⟩や、「家財一切」のようにどの物が該当するか識別できない場合は、⟪特定を欠き無効⟫である⟨3⟩。\n\n集合動産譲渡担保の対抗要件は、動産の引渡し（178条）であり、⟪占有改定⟫（183条）で足りる。\nそして、設定者がその構成部分である動産の占有を取得したときは債権者が占有改定の方法によりその占有を取得する旨の合意があるときは、設定者が現に存在する動産の占有を取得した時点で対抗要件が具備され、⦅この対抗要件具備の効力は、その後構成部分が変動しても、⟪集合物としての同一性⟫が損なわれない限り、⟪新たに構成部分となった動産⟫を包含する集合物に及ぶと解する⦆⟨1⟩。\n集合物を一個の物としてとらえる以上、対抗要件も集合物について⟪一度具備すれば足りる⟫からである。\nなお、設定者が法人であるときは、⟪動産譲渡登記⟫によることもでき、この登記は引渡しとみなされる。\n\n集合物の内容は設定者の営業活動を通じて当然に変動することが予定されているから、設定者には、⟪通常の営業の範囲内⟫で、目的物を構成する動産を⟪処分する権限⟫が付与されていると解する。したがって、⦅この権限内でされた処分の相手方は、当該動産につき、譲渡担保の拘束を受けることなく⟪確定的に所有権を取得⟫する⦆⟨1⟩（搬出の有無を問わない）。\n他方、⦅設定者が⟪通常の営業の範囲を超える売却処分⟫をした場合、当該処分は右権限に基づかないから、保管場所から搬出されるなどして⟪集合物から離脱⟫したと認められる場合でない限り、処分の相手方は目的物の所有権を⟪承継取得することができない⟫と解する⦆⟨2⟩。\n「通常の営業の範囲」内かは、設定者の営業内容・契約の定め・処分の規模と価格・時期（危機時期か）・反復継続性などから判断する。目的物の全部を一括して売却するような、営業の継続を不可能にする処分は、通常の営業の範囲を超えるものと⟪評価しうる⟫。\nなお、⦅占有改定による引渡ししか受けていない相手方は、⟪即時取得⟫（192条）によっても保護されない⦆⟨3⟩。\n\n譲渡担保は目的物の所有権を担保権者に移転する形式を採るから、⦅譲渡担保権者は先取特権に優先する「⟪第三取得者⟫」（⟪333条⟫）に当たる⦆⟨1⟩⦅同条の「引渡し」には⟪占有改定⟫も含まれる⦆⟨2⟩。\nそして、対抗要件を具備した集合動産譲渡担保の目的である集合物に、動産売買先取特権の目的動産が構成部分として加入した場合、譲渡担保権者は当該動産についても引渡しを受けたものとして譲渡担保権を主張でき、⦅先取特権者が動産競売を申し立てたときは、特段の事情のない限り、333条の第三取得者として、⟪第三者異議の訴え⟫によりその競売の不許を求めることができると解する⦆⟨3⟩。\n\n集合物譲渡担保権は、集合動産を構成するに至った動産の価値を担保として把握するものであるから、⦅その効力は、目的動産が滅失した場合にその損害をてん補するため設定者に支払われる⟪損害保険金⟫に係る請求権に及ぶ⦆⟨1⟩（⟪304条類推⟫）。\nもっとも、集合物譲渡担保契約は設定者が目的動産を販売して営業を継続することを前提とするものであるから、⦅設定者が⟪通常の営業を継続⟫している場合には、直ちに物上代位権を行使できる旨の合意があるなどの特段の事情のない限り、⟪物上代位権を行使することは許されない⟫と解する⦆⟨2⟩。","kata":"","hanrei":[["最判昭和54・2・15 民集33巻1号51頁","構成部分の変動する集合動産も、種類・所在場所・量的範囲を指定するなどの方法で範囲が特定されれば一個の集合物として譲渡担保の目的となりうる。ただし本件（「M倉庫業者に寄託中の乾燥ネギ44トンのうちの28トン」）は**特定性を否定**","規範を示した最初の判決。結論は特定性否定なので混同注意。百選リストに掲載なし"],["最判昭和57・10・14 判時1060号78頁","「家財一切」との指定は、個々の物件が該当するか識別困難として**特定性を否定**","百選96番解説3(2)経由。百選リストに掲載なし"],["**最判昭和62・11・10 民集41巻8号1559頁**","①「第1ないし第4倉庫内及び同敷地・ヤード内」の「普通棒鋼、異形棒鋼等一切の在庫商品」につき**特定性を肯定**（最高裁として初）②占有改定による対抗要件具備の効力は、集合物としての同一性が損なわれない限り新構成部分に及ぶ③譲渡担保権者は**333条の第三取得者**に当たり、特段の事情のない限り第三者異議の訴えで動産競売の不許を求められる","**百選Ⅰ〔第9版〕96番**（第7版・第8版には未収録＝第9版で新規収録）"],["**最判平成18・7・20 民集60巻6号2499頁**","①重複設定自体は許されるが、**後順位譲渡担保権者による私的実行は認められない**②設定者には**通常の営業の範囲内**での処分権限が付与され、その相手方は確定的に所有権を取得する③**通常の営業の範囲を超える処分**では、集合物から離脱したと認められる場合でない限り承継取得できない","**百選Ⅰ〔第9版〕97番**（＝〔第8版〕99番・〔第7版〕98番）。原審に差戻し"],["最決平成22・12・2 民集64巻8号1990頁","集合物譲渡担保権の効力は目的動産滅失時の**損害保険金請求権に及ぶ**。もっとも設定者が**通常の営業を継続している場合**には、特段の事情がない限り物上代位権の行使は許されない","事案は廃業により営業停止しており、物上代位を**肯定**（百選97番解説）。百選リストに掲載なし"],["最決平成11・5・17 民集53巻5号863頁","動産譲渡担保権に基づき、処分権限に基づく転売の代金債権に**物上代位できる**（304条類推）。同旨・最決平成29・5・10","**個別動産**の譲渡担保の事案。集合動産型への射程は判例未確定"],["最判昭和35・2・11","占有改定では即時取得は成立しない","**百選Ⅰ〔第9版〕64番**（＝〔第8版〕68番・〔第7版〕65番）。最判昭和32・12・27も同旨"],["大判大正6・7・26","333条の「引渡し」には**占有改定を含む**","体系別短答過去問題集 民法(上) p.712"],["名古屋地判平成15・4・9 金法1687号47頁","時計店が一定の所在場所に保管する「全ての製品」を目的とする集合動産譲渡担保を有効とした","下級審。包括的指定でも特定性が認められた例"]],"field":"非典型担保","order":22}],"laws":{"民法/94":{"label":"94条","kou":["相手方と通じてした虚偽の意思表示は、無効とする。","前項の規定による意思表示の無効は、善意の第三者に対抗することができない。"]},"民法/110":{"label":"110条","kou":["前条第一項本文の規定は、代理人がその権限外の行為をした場合において、第三者が代理人の権限があると信ずべき正当な理由があるときについて準用する。"]},"民法/472":{"label":"472条","kou":["免責的債務引受の引受人は債務者が債権者に対して負担する債務と同一の内容の債務を負担し、債務者は自己の債務を免れる。","免責的債務引受は、債権者と引受人となる者との契約によってすることができる。この場合において、免責的債務引受は、債権者が債務者に対してその契約をした旨を通知した時に、その効力を生ずる。","免責的債務引受は、債務者と引受人となる者が契約をし、債権者が引受人となる者に対して承諾をすることによってもすることができる。"]},"民法/470":{"label":"470条","kou":["併存的債務引受の引受人は、債務者と連帯して、債務者が債権者に対して負担する債務と同一の内容の債務を負担する。","併存的債務引受は、債権者と引受人となる者との契約によってすることができる。","併存的債務引受は、債務者と引受人となる者との契約によってもすることができる。この場合において、併存的債務引受は、債権者が引受人となる者に対して承諾をした時に、その効力を生ずる。","前項の規定によってする併存的債務引受は、第三者のためにする契約に関する規定に従う。"]},"民法/462":{"label":"462条","kou":["第四百五十九条の二第一項の規定は、主たる債務者の委託を受けないで保証をした者が債務の消滅行為をした場合について準用する。","主たる債務者の意思に反して保証をした者は、主たる債務者が現に利益を受けている限度においてのみ求償権を有する。この場合において、主たる債務者が求償の日以前に相殺の原因を有していたことを主張するときは、保証人は、債権者に対し、その相殺によって消滅すべきであった債務の履行を請求することができる。","第四百五十九条の二第三項の規定は、前二項に規定する保証人が主たる債務の弁済期前に債務の消滅行為をした場合における求償権の行使について準用する。"]},"民法/537":{"label":"537条","kou":["契約により当事者の一方が第三者に対してある給付をすることを約したときは、その第三者は、債務者に対して直接にその給付を請求する権利を有する。","前項の契約は、その成立の時に第三者が現に存しない場合又は第三者が特定していない場合であっても、そのためにその効力を妨げられない。","第一項の場合において、第三者の権利は、その第三者が債務者に対して同項の契約の利益を享受する意思を表示した時に発生する。"]},"民法/441":{"label":"441条","kou":["第四百三十八条、第四百三十九条第一項及び前条に規定する場合を除き、連帯債務者の一人について生じた事由は、他の連帯債務者に対してその効力を生じない。ただし、債権者及び他の連帯債務者の一人が別段の意思を表示したときは、当該他の連帯債務者に対する効力は、その意思に従う。"]},"民法/442":{"label":"442条","kou":["連帯債務者の一人が弁済をし、その他自己の財産をもって共同の免責を得たときは、その連帯債務者は、その免責を得た額が自己の負担部分を超えるかどうかにかかわらず、他の連帯債務者に対し、その免責を得るために支出した財産の額（その財産の額が共同の免責を得た額を超える場合にあっては、その免責を得た額）のうち各自の負担部分に応じた額の求償権を有する。","前項の規定による求償は、弁済その他免責があった日以後の法定利息及び避けることができなかった費用その他の損害の賠償を包含する。"]},"民法/471":{"label":"471条","kou":["引受人は、併存的債務引受により負担した自己の債務について、その効力が生じた時に債務者が主張することができた抗弁をもって債権者に対抗することができる。","債務者が債権者に対して取消権又は解除権を有するときは、引受人は、これらの権利の行使によって債務者がその債務を免れるべき限度において、債権者に対して債務の履行を拒むことができる。"]},"民法/439":{"label":"439条","kou":["連帯債務者の一人が債権者に対して債権を有する場合において、その連帯債務者が相殺を援用したときは、債権は、全ての連帯債務者の利益のために消滅する。","前項の債権を有する連帯債務者が相殺を援用しない間は、その連帯債務者の負担部分の限度において、他の連帯債務者は、債権者に対して債務の履行を拒むことができる。"]},"民法/472の2":{"label":"472の2条","kou":["引受人は、免責的債務引受により負担した自己の債務について、その効力が生じた時に債務者が主張することができた抗弁をもって債権者に対抗することができる。","債務者が債権者に対して取消権又は解除権を有するときは、引受人は、免責的債務引受がなければこれらの権利の行使によって債務者がその債務を免れることができた限度において、債権者に対して債務の履行を拒むことができる。"]},"民法/472の3":{"label":"472の3条","kou":["免責的債務引受の引受人は、債務者に対して求償権を取得しない。"]},"民法/472の4":{"label":"472の4条","kou":["債権者は、第四百七十二条第一項の規定により債務者が免れる債務の担保として設定された担保権を引受人が負担する債務に移すことができる。ただし、引受人以外の者がこれを設定した場合には、その承諾を得なければならない。","前項の規定による担保権の移転は、あらかじめ又は同時に引受人に対してする意思表示によってしなければならない。","前二項の規定は、第四百七十二条第一項の規定により債務者が免れる債務の保証をした者があるときについて準用する。","前項の場合において、同項において準用する第一項の承諾は、書面でしなければ、その効力を生じない。","前項の承諾がその内容を記録した電磁的記録によってされたときは、その承諾は、書面によってされたものとみなして、同項の規定を適用する。"]},"民法/423":{"label":"423条","kou":["債権者は、自己の債権を保全するため必要があるときは、債務者に属する権利（以下「被代位権利」という。）を行使することができる。ただし、債務者の一身に専属する権利及び差押えを禁じられた権利は、この限りでない。","債権者は、その債権の期限が到来しない間は、被代位権利を行使することができない。ただし、保存行為は、この限りでない。","債権者は、その債権が強制執行により実現することのできないものであるときは、被代位権利を行使することができない。"]},"民法/423の7":{"label":"423の7条","kou":["登記又は登録をしなければ権利の得喪及び変更を第三者に対抗することができない財産を譲り受けた者は、その譲渡人が第三者に対して有する登記手続又は登録手続をすべきことを請求する権利を行使しないときは、その権利を行使することができる。この場合においては、前三条の規定を準用する。"]},"民法/423の2":{"label":"423の2条","kou":["債権者は、被代位権利を行使する場合において、被代位権利の目的が可分であるときは、自己の債権の額の限度においてのみ、被代位権利を行使することができる。"]},"民法/423の3":{"label":"423の3条","kou":["債権者は、被代位権利を行使する場合において、被代位権利が金銭の支払又は動産の引渡しを目的とするものであるときは、相手方に対し、その支払又は引渡しを自己に対してすることを求めることができる。この場合において、相手方が債権者に対してその支払又は引渡しをしたときは、被代位権利は、これによって消滅する。"]},"民法/468":{"label":"468条","kou":["債務者は、対抗要件具備時までに譲渡人に対して生じた事由をもって譲受人に対抗することができる。","第四百六十六条第四項の場合における前項の規定の適用については、同項中「対抗要件具備時」とあるのは、「第四百六十六条第四項の相当の期間を経過した時」とし、第四百六十六条の三の場合における同項の規定の適用については、同項中「対抗要件具備時」とあるのは、「第四百六十六条の三の規定により同条の譲受人から供託の請求を受けた時」とする。"]},"民法/469":{"label":"469条","kou":["債務者は、対抗要件具備時より前に取得した譲渡人に対する債権による相殺をもって譲受人に対抗することができる。","債務者が対抗要件具備時より後に取得した譲渡人に対する債権であっても、その債権が次に掲げるものであるときは、前項と同様とする。ただし、債務者が対抗要件具備時より後に他人の債権を取得したときは、この限りでない。一対抗要件具備時より前の原因に基づいて生じた債権二前号に掲げるもののほか、譲受人の取得した債権の発生原因である契約に基づいて生じた債権","第四百六十六条第四項の場合における前二項の規定の適用については、これらの規定中「対抗要件具備時」とあるのは、「第四百六十六条第四項の相当の期間を経過した時」とし、第四百六十六条の三の場合におけるこれらの規定の適用については、これらの規定中「対抗要件具備時」とあるのは、「第四百六十六条の三の規定により同条の譲受人から供託の請求を受けた時」とする。"]},"民法/466":{"label":"466条","kou":["債権は、譲り渡すことができる。ただし、その性質がこれを許さないときは、この限りでない。","当事者が債権の譲渡を禁止し、又は制限する旨の意思表示（以下「譲渡制限の意思表示」という。）をしたときであっても、債権の譲渡は、その効力を妨げられない。","前項に規定する場合には、譲渡制限の意思表示がされたことを知り、又は重大な過失によって知らなかった譲受人その他の第三者に対しては、債務者は、その債務の履行を拒むことができ、かつ、譲渡人に対する弁済その他の債務を消滅させる事由をもってその第三者に対抗することができる。","前項の規定は、債務者が債務を履行しない場合において、同項に規定する第三者が相当の期間を定めて譲渡人への履行の催告をし、その期間内に履行がないときは、その債務者については、適用しない。"]},"民法/466の3":{"label":"466の3条","kou":["前条第一項に規定する場合において、譲渡人について破産手続開始の決定があったときは、譲受人（同項の債権の全額を譲り受けた者であって、その債権の譲渡を債務者その他の第三者に対抗することができるものに限る。）は、譲渡制限の意思表示がされたことを知り、又は重大な過失によって知らなかったときであっても、債務者にその債権の全額に相当する金銭を債務の履行地の供託所に供託させることができる。この場合においては、同条第二項及び第三項の規定を準用する。"]},"民法/392":{"label":"392条","kou":["債権者が同一の債権の担保として数個の不動産につき抵当権を有する場合において、同時にその代価を配当すべきときは、その各不動産の価額に応じて、その債権の負担を按分する。","債権者が同一の債権の担保として数個の不動産につき抵当権を有する場合において、ある不動産の代価のみを配当すべきときは、抵当権者は、その代価から債権の全部の弁済を受けることができる。この場合において、次順位の抵当権者は、その弁済を受ける抵当権者が前項の規定に従い他の不動産の代価から弁済を受けるべき金額を限度として、その抵当権者に代位して抵当権を行使することができる。"]},"民法/499":{"label":"499条","kou":["債務者のために弁済をした者は、債権者に代位する。"]},"民法/501":{"label":"501条","kou":["前二条の規定により債権者に代位した者は、債権の効力及び担保としてその債権者が有していた一切の権利を行使することができる。","前項の規定による権利の行使は、債権者に代位した者が自己の権利に基づいて債務者に対して求償をすることができる範囲内（保証人の一人が他の保証人に対して債権者に代位する場合には、自己の権利に基づいて当該他の保証人に対して求償をすることができる範囲内）に限り、することができる。","第一項の場合には、前項の規定によるほか、次に掲げるところによる。一第三取得者（債務者から担保の目的となっている財産を譲り受けた者をいう。以下この項において同じ。）は、保証人及び物上保証人に対して債権者に代位しない。二第三取得者の一人は、各財産の価格に応じて、他の第三取得者に対して債権者に代位する。三前号の規定は、物上保証人の一人が他の物上保証人に対して債権者に代位する場合について準用する。四保証人と物上保証人との間においては、その数に応じて、債権者に代位する。ただし、物上保証人が数人あるときは、保証人の負担部分を除いた残額について、各財産の価格に応じて、債権者に代位する。五第三取得者から担保の目的となっている財産を譲り受けた者は、第三取得者とみなして第一号及び第二号の規定を適用し、物上保証人から担保の目的となっている財産を譲り受けた者は、物上保証人とみなして第一号、第三号及び前号の規定を適用する。"]},"民法/372":{"label":"372条","kou":["第二百九十六条、第三百四条及び第三百五十一条の規定は、抵当権について準用する。"]},"民法/304":{"label":"304条","kou":["先取特権は、その目的物の売却、賃貸、滅失又は損傷によって債務者が受けるべき金銭その他の物に対しても、行使することができる。ただし、先取特権者は、その払渡し又は引渡しの前に差押えをしなければならない。","債務者が先取特権の目的物につき設定した物権の対価についても、前項と同様とする。"]},"民法/251":{"label":"251条","kou":["政府は、地方公共団体が事務及び事業を自主的かつ自立的に執行できるよう、国と地方公共団体との役割分担に応じた地方税財源の充実確保の方途について、経済情勢の推移等を勘案しつつ検討し、その結果に基づいて必要な措置を講ずるものとする。附　則"]},"民法/252":{"label":"252条","kou":["共有物の管理に関する事項（次条第一項に規定する共有物の管理者の選任及び解任を含み、共有物に前条第一項に規定する変更を加えるものを除く。次項において同じ。）は、各共有者の持分の価格に従い、その過半数で決する。共有物を使用する共有者があるときも、同様とする。","裁判所は、次の各号に掲げるときは、当該各号に規定する他の共有者以外の共有者の請求により、当該他の共有者以外の共有者の持分の価格に従い、その過半数で共有物の管理に関する事項を決することができる旨の裁判をすることができる。一共有者が他の共有者を知ることができず、又はその所在を知ることができないとき。二共有者が他の共有者に対し相当の期間を定めて共有物の管理に関する事項を決することについて賛否を明らかにすべき旨を催告した場合において、当該他の共有者がその期間内に賛否を明らかにしないとき。","前二項の規定による決定が、共有者間の決定に基づいて共有物を使用する共有者に特別の影響を及ぼすべきときは、その承諾を得なければならない。","共有者は、前三項の規定により、共有物に、次の各号に掲げる賃借権その他の使用及び収益を目的とする権利（以下この項において「賃借権等」という。）であって、当該各号に定める期間を超えないものを設定することができる。一樹木の栽植又は伐採を目的とする山林の賃借権等十年二前号に掲げる賃借権等以外の土地の賃借権等五年三建物の賃借権等三年四動産の賃借権等六箇月","各共有者は、前各項の規定にかかわらず、保存行為をすることができる。"]},"民法/249":{"label":"249条","kou":["各共有者は、共有物の全部について、その持分に応じた使用をすることができる。","共有物を使用する共有者は、別段の合意がある場合を除き、他の共有者に対し、自己の持分を超える使用の対価を償還する義務を負う。","共有者は、善良な管理者の注意をもって、共有物の使用をしなければならない。"]},"民法/256":{"label":"256条","kou":["各共有者は、いつでも共有物の分割を請求することができる。ただし、五年を超えない期間内は分割をしない旨の契約をすることを妨げない。","前項ただし書の契約は、更新することができる。ただし、その期間は、更新の時から五年を超えることができない。"]},"民法/258":{"label":"258条","kou":["共有物の分割について共有者間に協議が調わないとき、又は協議をすることができないときは、その分割を裁判所に請求することができる。","裁判所は、次に掲げる方法により、共有物の分割を命ずることができる。一共有物の現物を分割する方法二共有者に債務を負担させて、他の共有者の持分の全部又は一部を取得させる方法","前項に規定する方法により共有物を分割することができないとき、又は分割によってその価格を著しく減少させるおそれがあるときは、裁判所は、その競売を命ずることができる。","裁判所は、共有物の分割の裁判において、当事者に対して、金銭の支払、物の引渡し、登記義務の履行その他の給付を命ずることができる。"]},"民法/258の2":{"label":"258の2条","kou":["共有物の全部又はその持分が相続財産に属する場合において、共同相続人間で当該共有物の全部又はその持分について遺産の分割をすべきときは、当該共有物又はその持分について前条の規定による分割をすることができない。","共有物の持分が相続財産に属する場合において、相続開始の時から十年を経過したときは、前項の規定にかかわらず、相続財産に属する共有物の持分について前条の規定による分割をすることができる。ただし、当該共有物の持分について遺産の分割の請求があった場合において、相続人が当該共有物の持分について同条の規定による分割をすることに異議の申出をしたときは、この限りでない。","相続人が前項ただし書の申出をする場合には、当該申出は、当該相続人が前条第一項の規定による請求を受けた裁判所から当該請求があった旨の通知を受けた日から二箇月以内に当該裁判所にしなければならない。"]},"民法/198":{"label":"198条","kou":["占有者がその占有を妨害されたときは、占有保持の訴えにより、その妨害の停止及び損害の賠償を請求することができる。"]},"民法/199":{"label":"199条","kou":["占有者がその占有を妨害されるおそれがあるときは、占有保全の訴えにより、その妨害の予防又は損害賠償の担保を請求することができる。"]},"民法/200":{"label":"200条","kou":["占有者がその占有を奪われたときは、占有回収の訴えにより、その物の返還及び損害の賠償を請求することができる。","占有回収の訴えは、占有を侵奪した者の特定承継人に対して提起することができない。ただし、その承継人が侵奪の事実を知っていたときは、この限りでない。"]},"民法/197":{"label":"197条","kou":["占有者は、次条から第二百二条までの規定に従い、占有の訴えを提起することができる。他人のために占有をする者も、同様とする。"]},"民法/201":{"label":"201条","kou":["占有保持の訴えは、妨害の存する間又はその消滅した後一年以内に提起しなければならない。ただし、工事により占有物に損害を生じた場合において、その工事に着手した時から一年を経過し、又はその工事が完成したときは、これを提起することができない。","占有保全の訴えは、妨害の危険の存する間は、提起することができる。この場合において、工事により占有物に損害を生ずるおそれがあるときは、前項ただし書の規定を準用する。","占有回収の訴えは、占有を奪われた時から一年以内に提起しなければならない。"]},"民法/202":{"label":"202条","kou":["占有の訴えは本権の訴えを妨げず、また、本権の訴えは占有の訴えを妨げない。","占有の訴えについては、本権に関する理由に基づいて裁判をすることができない。"]},"民法/192":{"label":"192条","kou":["取引行為によって、平穏に、かつ、公然と動産の占有を始めた者は、善意であり、かつ、過失がないときは、即時にその動産について行使する権利を取得する。"]},"民法/186":{"label":"186条","kou":["占有者は、所有の意思をもって、善意で、平穏に、かつ、公然と占有をするものと推定する。","前後の両時点において占有をした証拠があるときは、占有は、その間継続したものと推定する。"]},"民法/188":{"label":"188条","kou":["占有者が占有物について行使する権利は、適法に有するものと推定する。"]},"民法/193":{"label":"193条","kou":["前条の場合において、占有物が盗品又は遺失物であるときは、被害者又は遺失者は、盗難又は遺失の時から二年間、占有者に対してその物の回復を請求することができる。"]},"民法/194":{"label":"194条","kou":["占有者が、盗品又は遺失物を、競売若しくは公の市場において、又はその物と同種の物を販売する商人から、善意で買い受けたときは、被害者又は遺失者は、占有者が支払った代価を弁償しなければ、その物を回復することができない。"]},"民法/177":{"label":"177条","kou":["不動産に関する物権の得喪及び変更は、不動産登記法（平成十六年法律第百二十三号）その他の登記に関する法律の定めるところに従いその登記をしなければ、第三者に対抗することができない。"]},"民法/413":{"label":"413条","kou":["債権者が債務の履行を受けることを拒み、又は受けることができない場合において、その債務の目的が特定物の引渡しであるときは、債務者は、履行の提供をした時からその引渡しをするまで、自己の財産に対するのと同一の注意をもって、その物を保存すれば足りる。","債権者が債務の履行を受けることを拒み、又は受けることができないことによって、その履行の費用が増加したときは、その増加額は、債権者の負担とする。"]},"民法/492":{"label":"492条","kou":["債務者は、弁済の提供の時から、債務を履行しないことによって生ずべき責任を免れる。"]},"民法/493":{"label":"493条","kou":["弁済の提供は、債務の本旨に従って現実にしなければならない。ただし、債権者があらかじめその受領を拒み、又は債務の履行について債権者の行為を要するときは、弁済の準備をしたことを通知してその受領の催告をすれば足りる。"]},"民法/400":{"label":"400条","kou":["債権の目的が特定物の引渡しであるときは、債務者は、その引渡しをするまで、契約その他の債権の発生原因及び取引上の社会通念に照らして定まる善良な管理者の注意をもって、その物を保存しなければならない。"]},"民法/413の2":{"label":"413の2条","kou":["債務者がその債務について遅滞の責任を負っている間に当事者双方の責めに帰することができない事由によってその債務の履行が不能となったときは、その履行の不能は、債務者の責めに帰すべき事由によるものとみなす。","債権者が債務の履行を受けることを拒み、又は受けることができない場合において、履行の提供があった時以後に当事者双方の責めに帰することができない事由によってその債務の履行が不能となったときは、その履行の不能は、債権者の責めに帰すべき事由によるものとみなす。"]},"民法/536":{"label":"536条","kou":["当事者双方の責めに帰することができない事由によって債務を履行することができなくなったときは、債権者は、反対給付の履行を拒むことができる。","債権者の責めに帰すべき事由によって債務を履行することができなくなったときは、債権者は、反対給付の履行を拒むことができない。この場合において、債務者は、自己の債務を免れたことによって利益を得たときは、これを債権者に償還しなければならない。"]},"民法/543":{"label":"543条","kou":["債務の不履行が債権者の責めに帰すべき事由によるものであるときは、債権者は、前二条の規定による契約の解除をすることができない。"]},"民法/567":{"label":"567条","kou":["売主が買主に目的物（売買の目的として特定したものに限る。以下この条において同じ。）を引き渡した場合において、その引渡しがあった時以後にその目的物が当事者双方の責めに帰することができない事由によって滅失し、又は損傷したときは、買主は、その滅失又は損傷を理由として、履行の追完の請求、代金の減額の請求、損害賠償の請求及び契約の解除をすることができない。この場合において、買主は、代金の支払を拒むことができない。","売主が契約の内容に適合する目的物をもって、その引渡しの債務の履行を提供したにもかかわらず、買主がその履行を受けることを拒み、又は受けることができない場合において、その履行の提供があった時以後に当事者双方の責めに帰することができない事由によってその目的物が滅失し、又は損傷したときも、前項と同様とする。"]},"民法/415":{"label":"415条","kou":["債務者がその債務の本旨に従った履行をしないとき又は債務の履行が不能であるときは、債権者は、これによって生じた損害の賠償を請求することができる。ただし、その債務の不履行が契約その他の債務の発生原因及び取引上の社会通念に照らして債務者の責めに帰することができない事由によるものであるときは、この限りでない。","前項の規定により損害賠償の請求をすることができる場合において、債権者は、次に掲げるときは、債務の履行に代わる損害賠償の請求をすることができる。一債務の履行が不能であるとき。二債務者がその債務の履行を拒絶する意思を明確に表示したとき。三債務が契約によって生じたものである場合において、その契約が解除され、又は債務の不履行による契約の解除権が発生したとき。"]},"民法/542":{"label":"542条","kou":["次に掲げる場合には、債権者は、前条の催告をすることなく、直ちに契約の解除をすることができる。一債務の全部の履行が不能であるとき。二債務者がその債務の全部の履行を拒絶する意思を明確に表示したとき。三債務の一部の履行が不能である場合又は債務者がその債務の一部の履行を拒絶する意思を明確に表示した場合において、残存する部分のみでは契約をした目的を達することができないとき。四契約の性質又は当事者の意思表示により、特定の日時又は一定の期間内に履行をしなければ契約をした目的を達することができない場合において、債務者が履行をしないでその時期を経過したとき。五前各号に掲げる場合のほか、債務者がその債務の履行をせず、債権者が前条の催告をしても契約をした目的を達するのに足りる履行がされる見込みがないことが明らかであるとき。","次に掲げる場合には、債権者は、前条の催告をすることなく、直ちに契約の一部の解除をすることができる。一債務の一部の履行が不能であるとき。二債務者がその債務の一部の履行を拒絶する意思を明確に表示したとき。"]},"民法/541":{"label":"541条","kou":["当事者の一方がその債務を履行しない場合において、相手方が相当の期間を定めてその履行の催告をし、その期間内に履行がないときは、相手方は、契約の解除をすることができる。ただし、その期間を経過した時における債務の不履行がその契約及び取引上の社会通念に照らして軽微であるときは、この限りでない。"]},"民法/422の2":{"label":"422の2条","kou":["債務者が、その債務の履行が不能となったのと同一の原因により債務の目的物の代償である権利又は利益を取得したときは、債権者は、その受けた損害の額の限度において、債務者に対し、その権利の移転又はその利益の償還を請求することができる。"]},"民法/466の6":{"label":"466の6条","kou":["債権の譲渡は、その意思表示の時に債権が現に発生していることを要しない。","債権が譲渡された場合において、その意思表示の時に債権が現に発生していないときは、譲受人は、発生した債権を当然に取得する。","前項に規定する場合において、譲渡人が次条の規定による通知をし、又は債務者が同条の規定による承諾をした時（以下「対抗要件具備時」という。）までに譲渡制限の意思表示がされたときは、譲受人その他の第三者がそのことを知っていたものとみなして、第四百六十六条第三項（譲渡制限の意思表示がされた債権が預貯金債権の場合にあっては、前条第一項）の規定を適用する。"]},"民法/90":{"label":"90条","kou":["公の秩序又は善良の風俗に反する法律行為は、無効とする。"]},"民法/467":{"label":"467条","kou":["債権の譲渡（現に発生していない債権の譲渡を含む。）は、譲渡人が債務者に通知をし、又は債務者が承諾をしなければ、債務者その他の第三者に対抗することができない。","前項の通知又は承諾は、確定日付のある証書によってしなければ、債務者以外の第三者に対抗することができない。"]},"民法/178":{"label":"178条","kou":["動産に関する物権の譲渡は、その動産の引渡しがなければ、第三者に対抗することができない。"]},"民法/1":{"label":"1条","kou":["この法律は、公布の日から起算して二年六月を超えない範囲内において政令で定める日から施行する。ただし、次の各号に掲げる規定は、当該各号に定める日から施行する。一附則第九条の規定公布の日二第一条中民法第八百九十一条第五号の改正規定、同法第九百六十八条の改正規定（次号に掲げる改正規定を除く。）、同法第九百七十条第一項及び第九百七十三条の改正規定（同条第一項の改正規定を除く。）、同法第九百七十四条の改正規定、同法第九百七十六条の見出しを削り、同条の前に見出しを付する改正規定、同条第一項の改正規定、同条の次に一条を加える改正規定、同法第九百七十九条の見出しを削り、同条の前に見出しを付する改正規定、同条第一項及び第三項の改正規定、同条の次に一条を加える改正規定並びに同法第九百八十条から第九百八十二条まで、第九百八十四条、第千四条（見出しを含む。）、第千五条及び第千二十四条（見出しを含む。）の改正規定並びに第四条中家事事件手続法第二百十一条、第二百十二条及び第二百十四条第二号の改正規定並びに同法別表第一の百二の項及び百三の項の改正規定並びに附則第五条の規定公布の日から起算して一年を超えない範囲内において政令で定める日三第一条中民法第九百六十七条の改正規定、同法第九百六十八条第二項の改正規定（「含む」の下に「。第九百六十八条の三第二項において同じ」を加える部分に限る。）及び同条の次に二条を加える改正規定並びに第五条の規定公布の日から起算して三年を超えない範囲内において政令で定める日"]},"民事執行法/159":{"label":"民事執行法159条","kou":["執行裁判所は、差押債権者の申立てにより、支払に代えて券面額で差し押さえられた金銭債権を差押債権者に転付する命令（以下「転付命令」という。）を発することができる。","転付命令は、債務者及び第三債務者に送達しなければならない。","転付命令が第三債務者に送達される時までに、転付命令に係る金銭債権について、他の債権者が差押え、仮差押えの執行又は配当要求をしたときは、転付命令は、その効力を生じない。","第一項の申立てについての決定に対しては、執行抗告をすることができる。","転付命令は、確定しなければその効力を生じない。","差し押さえられた金銭債権が第百五十二条第一項各号に掲げる債権又は同条第二項に規定する債権である場合（差押債権者の債権に第百五十一条の二第一項各号に掲げる義務に係る金銭債権が含まれているときを除く。）における前項の規定の適用については、同項中「確定しなければ」とあるのは、「確定し、かつ、債務者に対して差押命令が送達された日から四週間を経過するまでは、」とする。","転付命令が発せられた後に第三十九条第一項第七号又は第八号に掲げる文書を提出したことを理由として執行抗告がされたときは、抗告裁判所は、他の理由により転付命令を取り消す場合を除き、執行抗告についての裁判を留保しなければならない。"]},"民事執行法/160":{"label":"民事執行法160条","kou":["転付命令が効力を生じた場合においては、差押債権者の債権及び執行費用は、転付命令に係る金銭債権が存する限り、その券面額で、転付命令が第三債務者に送達された時に弁済されたものとみなす。"]},"民法/369":{"label":"369条","kou":["抵当権者は、債務者又は第三者が占有を移転しないで債務の担保に供した不動産について、他の債権者に先立って自己の債権の弁済を受ける権利を有する。","地上権及び永小作権も、抵当権の目的とすることができる。この場合においては、この章の規定を準用する。"]},"民法/395":{"label":"395条","kou":["抵当権者に対抗することができない賃貸借により抵当権の目的である建物の使用又は収益をする者であって次に掲げるもの（次項において「抵当建物使用者」という。）は、その建物の競売における買受人の買受けの時から六箇月を経過するまでは、その建物を買受人に引き渡すことを要しない。一競売手続の開始前から使用又は収益をする者二強制管理又は担保不動産収益執行の管理人が競売手続の開始後にした賃貸借により使用又は収益をする者","前項の規定は、買受人の買受けの時より後に同項の建物の使用をしたことの対価について、買受人が抵当建物使用者に対し相当の期間を定めてその一箇月分以上の支払の催告をし、その相当の期間内に履行がない場合には、適用しない。"]},"民法/416":{"label":"416条","kou":["債務の不履行に対する損害賠償の請求は、これによって通常生ずべき損害の賠償をさせることをその目的とする。","特別の事情によって生じた損害であっても、当事者がその事情を予見すべきであったときは、債権者は、その賠償を請求することができる。"]},"民法/146":{"label":"146条","kou":["時効の利益は、あらかじめ放棄することができない。"]},"民法/398の2":{"label":"398の2条","kou":["抵当権は、設定行為で定めるところにより、一定の範囲に属する不特定の債権を極度額の限度において担保するためにも設定することができる。","前項の規定による抵当権（以下「根抵当権」という。）の担保すべき不特定の債権の範囲は、債務者との特定の継続的取引契約によって生ずるものその他債務者との一定の種類の取引によって生ずるものに限定して、定めなければならない。","特定の原因に基づいて債務者との間に継続して生ずる債権、手形上若しくは小切手上の請求権又は電子記録債権（電子記録債権法（平成十九年法律第百二号）第二条第一項に規定する電子記録債権をいう。次条第二項において同じ。）は、前項の規定にかかわらず、根抵当権の担保すべき債権とすることができる。"]},"民法/398の3":{"label":"398の3条","kou":["根抵当権者は、確定した元本並びに利息その他の定期金及び債務の不履行によって生じた損害の賠償の全部について、極度額を限度として、その根抵当権を行使することができる。","債務者との取引によらないで取得する手形上若しくは小切手上の請求権又は電子記録債権を根抵当権の担保すべき債権とした場合において、次に掲げる事由があったときは、その前に取得したものについてのみ、その根抵当権を行使することができる。ただし、その後に取得したものであっても、その事由を知らないで取得したものについては、これを行使することを妨げない。一債務者の支払の停止二債務者についての破産手続開始、再生手続開始、更生手続開始又は特別清算開始の申立て三抵当不動産に対する競売の申立て又は滞納処分による差押え"]},"民法/375":{"label":"375条","kou":["抵当権者は、利息その他の定期金を請求する権利を有するときは、その満期となった最後の二年分についてのみ、その抵当権を行使することができる。ただし、それ以前の定期金についても、満期後に特別の登記をしたときは、その登記の時からその抵当権を行使することを妨げない。","前項の規定は、抵当権者が債務の不履行によって生じた損害の賠償を請求する権利を有する場合におけるその最後の二年分についても適用する。ただし、利息その他の定期金と通算して二年分を超えることができない。"]},"民法/398の7":{"label":"398の7条","kou":["元本の確定前に根抵当権者から債権を取得した者は、その債権について根抵当権を行使することができない。元本の確定前に債務者のために又は債務者に代わって弁済をした者も、同様とする。","元本の確定前に債務の引受けがあったときは、根抵当権者は、引受人の債務について、その根抵当権を行使することができない。","元本の確定前に免責的債務引受があった場合における債権者は、第四百七十二条の四第一項の規定にかかわらず、根抵当権を引受人が負担する債務に移すことができない。","元本の確定前に債権者の交替による更改があった場合における更改前の債権者は、第五百十八条第一項の規定にかかわらず、根抵当権を更改後の債務に移すことができない。元本の確定前に債務者の交替による更改があった場合における債権者も、同様とする。"]},"民法/398の4":{"label":"398の4条","kou":["元本の確定前においては、根抵当権の担保すべき債権の範囲の変更をすることができる。債務者の変更についても、同様とする。","前項の変更をするには、後順位の抵当権者その他の第三者の承諾を得ることを要しない。","第一項の変更について元本の確定前に登記をしなかったときは、その変更をしなかったものとみなす。"]},"民法/398の5":{"label":"398の5条","kou":["根抵当権の極度額の変更は、利害関係を有する者の承諾を得なければ、することができない。"]},"民法/376":{"label":"376条","kou":["抵当権者は、その抵当権を他の債権の担保とし、又は同一の債務者に対する他の債権者の利益のためにその抵当権若しくはその順位を譲渡し、若しくは放棄することができる。","前項の場合において、抵当権者が数人のためにその抵当権の処分をしたときは、その処分の利益を受ける者の権利の順位は、抵当権の登記にした付記の前後による。"]},"民法/398の11":{"label":"398の11条","kou":["元本の確定前においては、根抵当権者は、第三百七十六条第一項の規定による根抵当権の処分をすることができない。ただし、その根抵当権を他の債権の担保とすることを妨げない。","第三百七十七条第二項の規定は、前項ただし書の場合において元本の確定前にした弁済については、適用しない。"]},"民法/398の12":{"label":"398の12条","kou":["元本の確定前においては、根抵当権者は、根抵当権設定者の承諾を得て、その根抵当権を譲り渡すことができる。","根抵当権者は、その根抵当権を二個の根抵当権に分割して、その一方を前項の規定により譲り渡すことができる。この場合において、その根抵当権を目的とする権利は、譲り渡した根抵当権について消滅する。","前項の規定による譲渡をするには、その根抵当権を目的とする権利を有する者の承諾を得なければならない。"]},"民法/398の13":{"label":"398の13条","kou":["元本の確定前においては、根抵当権者は、根抵当権設定者の承諾を得て、その根抵当権の一部譲渡（譲渡人が譲受人と根抵当権を共有するため、これを分割しないで譲り渡すことをいう。以下この節において同じ。）をすることができる。"]},"民法/398の14":{"label":"398の14条","kou":["根抵当権の共有者は、それぞれその債権額の割合に応じて弁済を受ける。ただし、元本の確定前に、これと異なる割合を定め、又はある者が他の者に先立って弁済を受けるべきことを定めたときは、その定めに従う。","根抵当権の共有者は、他の共有者の同意を得て、第三百九十八条の十二第一項の規定によりその権利を譲り渡すことができる。"]},"民法/398の6":{"label":"398の6条","kou":["根抵当権の担保すべき元本については、その確定すべき期日を定め又は変更することができる。","第三百九十八条の四第二項の規定は、前項の場合について準用する。","第一項の期日は、これを定め又は変更した日から五年以内でなければならない。","第一項の期日の変更についてその変更前の期日より前に登記をしなかったときは、担保すべき元本は、その変更前の期日に確定する。"]},"民法/398の19":{"label":"398の19条","kou":["根抵当権設定者は、根抵当権の設定の時から三年を経過したときは、担保すべき元本の確定を請求することができる。この場合において、担保すべき元本は、その請求の時から二週間を経過することによって確定する。","根抵当権者は、いつでも、担保すべき元本の確定を請求することができる。この場合において、担保すべき元本は、その請求の時に確定する。","前二項の規定は、担保すべき元本の確定すべき期日の定めがあるときは、適用しない。"]},"民法/398の20":{"label":"398の20条","kou":["次に掲げる場合には、根抵当権の担保すべき元本は、確定する。一根抵当権者が抵当不動産について競売若しくは担保不動産収益執行又は第三百七十二条において準用する第三百四条の規定による差押えを申し立てたとき。ただし、競売手続若しくは担保不動産収益執行手続の開始又は差押えがあったときに限る。二根抵当権者が抵当不動産に対して滞納処分による差押えをしたとき。三根抵当権者が抵当不動産に対する競売手続の開始又は滞納処分による差押えがあったことを知った時から二週間を経過したとき。四債務者又は根抵当権設定者が破産手続開始の決定を受けたとき。","前項第三号の競売手続の開始若しくは差押え又は同項第四号の破産手続開始の決定の効力が消滅したときは、担保すべき元本は、確定しなかったものとみなす。ただし、元本が確定したものとしてその根抵当権又はこれを目的とする権利を取得した者があるときは、この限りでない。"]},"民法/398の21":{"label":"398の21条","kou":["元本の確定後においては、根抵当権設定者は、その根抵当権の極度額を、現に存する債務の額と以後二年間に生ずべき利息その他の定期金及び債務の不履行による損害賠償の額とを加えた額に減額することを請求することができる。","第三百九十八条の十六の登記がされている根抵当権の極度額の減額については、前項の規定による請求は、そのうちの一個の不動産についてすれば足りる。"]},"民法/398の22":{"label":"398の22条","kou":["元本の確定後において現に存する債務の額が根抵当権の極度額を超えるときは、他人の債務を担保するためその根抵当権を設定した者又は抵当不動産について所有権、地上権、永小作権若しくは第三者に対抗することができる賃借権を取得した第三者は、その極度額に相当する金額を払い渡し又は供託して、その根抵当権の消滅請求をすることができる。この場合において、その払渡し又は供託は、弁済の効力を有する。","第三百九十八条の十六の登記がされている根抵当権は、一個の不動産について前項の消滅請求があったときは、消滅する。","第三百八十条及び第三百八十一条の規定は、第一項の消滅請求について準用する。"]},"民法/380":{"label":"380条","kou":["主たる債務者、保証人及びこれらの者の承継人は、抵当権消滅請求をすることができない。"]},"民法/388":{"label":"388条","kou":["土地及びその上に存する建物が同一の所有者に属する場合において、その土地又は建物につき抵当権が設定され、その実行により所有者を異にするに至ったときは、その建物について、地上権が設定されたものとみなす。この場合において、地代は、当事者の請求により、裁判所が定める。"]},"民法/389":{"label":"389条","kou":["抵当権の設定後に抵当地に建物が築造されたときは、抵当権者は、土地とともにその建物を競売することができる。ただし、その優先権は、土地の代価についてのみ行使することができる。","前項の規定は、その建物の所有者が抵当地を占有するについて抵当権者に対抗することができる権利を有する場合には、適用しない。"]},"民法/412":{"label":"412条","kou":["債務の履行について確定期限があるときは、債務者は、その期限の到来した時から遅滞の責任を負う。","債務の履行について不確定期限があるときは、債務者は、その期限の到来した後に履行の請求を受けた時又はその期限の到来したことを知った時のいずれか早い時から遅滞の責任を負う。","債務の履行について期限を定めなかったときは、債務者は、履行の請求を受けた時から遅滞の責任を負う。"]},"民法/113":{"label":"113条","kou":["代理権を有しない者が他人の代理人としてした契約は、本人がその追認をしなければ、本人に対してその効力を生じない。","追認又はその拒絶は、相手方に対してしなければ、その相手方に対抗することができない。ただし、相手方がその事実を知ったときは、この限りでない。"]},"民法/115":{"label":"115条","kou":["代理権を有しない者がした契約は、本人が追認をしない間は、相手方が取り消すことができる。ただし、契約の時において代理権を有しないことを相手方が知っていたときは、この限りでない。"]},"民法/117":{"label":"117条","kou":["他人の代理人として契約をした者は、自己の代理権を証明したとき、又は本人の追認を得たときを除き、相手方の選択に従い、相手方に対して履行又は損害賠償の責任を負う。","前項の規定は、次に掲げる場合には、適用しない。一他人の代理人として契約をした者が代理権を有しないことを相手方が知っていたとき。二他人の代理人として契約をした者が代理権を有しないことを相手方が過失によって知らなかったとき。ただし、他人の代理人として契約をした者が自己に代理権がないことを知っていたときは、この限りでない。三他人の代理人として契約をした者が行為能力の制限を受けていたとき。"]},"民法/295":{"label":"295条","kou":["他人の物の占有者は、その物に関して生じた債権を有するときは、その債権の弁済を受けるまで、その物を留置することができる。ただし、その債権が弁済期にないときは、この限りでない。","前項の規定は、占有が不法行為によって始まった場合には、適用しない。"]},"民法/107":{"label":"107条","kou":["代理人が自己又は第三者の利益を図る目的で代理権の範囲内の行為をした場合において、相手方がその目的を知り、又は知ることができたときは、その行為は、代理権を有しない者がした行為とみなす。"]},"民法/545":{"label":"545条","kou":["当事者の一方がその解除権を行使したときは、各当事者は、その相手方を原状に復させる義務を負う。ただし、第三者の権利を害することはできない。","前項本文の場合において、金銭を返還するときは、その受領の時から利息を付さなければならない。","第一項本文の場合において、金銭以外の物を返還するときは、その受領の時以後に生じた果実をも返還しなければならない。","解除権の行使は、損害賠償の請求を妨げない。"]},"民法/424":{"label":"424条","kou":["債権者は、債務者が債権者を害することを知ってした行為の取消しを裁判所に請求することができる。ただし、その行為によって利益を受けた者（以下この款において「受益者」という。）がその行為の時において債権者を害することを知らなかったときは、この限りでない。","前項の規定は、財産権を目的としない行為については、適用しない。","債権者は、その債権が第一項に規定する行為の前の原因に基づいて生じたものである場合に限り、同項の規定による請求（以下「詐害行為取消請求」という。）をすることができる。","債権者は、その債権が強制執行により実現することのできないものであるときは、詐害行為取消請求をすることができない。"]},"民法/424の2":{"label":"424の2条","kou":["債務者が、その有する財産を処分する行為をした場合において、受益者から相当の対価を取得しているときは、債権者は、次に掲げる要件のいずれにも該当する場合に限り、その行為について、詐害行為取消請求をすることができる。一その行為が、不動産の金銭への換価その他の当該処分による財産の種類の変更により、債務者において隠匿、無償の供与その他の債権者を害することとなる処分（以下この条において「隠匿等の処分」という。）をするおそれを現に生じさせるものであること。二債務者が、その行為の当時、対価として取得した金銭その他の財産について、隠匿等の処分をする意思を有していたこと。三受益者が、その行為の当時、債務者が隠匿等の処分をする意思を有していたことを知っていたこと。"]},"民法/424の3":{"label":"424の3条","kou":["債務者がした既存の債務についての担保の供与又は債務の消滅に関する行為について、債権者は、次に掲げる要件のいずれにも該当する場合に限り、詐害行為取消請求をすることができる。一その行為が、債務者が支払不能（債務者が、支払能力を欠くために、その債務のうち弁済期にあるものにつき、一般的かつ継続的に弁済することができない状態をいう。次項第一号において同じ。）の時に行われたものであること。二その行為が、債務者と受益者とが通謀して他の債権者を害する意図をもって行われたものであること。","前項に規定する行為が、債務者の義務に属せず、又はその時期が債務者の義務に属しないものである場合において、次に掲げる要件のいずれにも該当するときは、債権者は、同項の規定にかかわらず、その行為について、詐害行為取消請求をすることができる。一その行為が、債務者が支払不能になる前三十日以内に行われたものであること。二その行為が、債務者と受益者とが通謀して他の債権者を害する意図をもって行われたものであること。"]},"民法/424の4":{"label":"424の4条","kou":["債務者がした債務の消滅に関する行為であって、受益者の受けた給付の価額がその行為によって消滅した債務の額より過大であるものについて、第四百二十四条に規定する要件に該当するときは、債権者は、前条第一項の規定にかかわらず、その消滅した債務の額に相当する部分以外の部分については、詐害行為取消請求をすることができる。"]},"民法/424の5":{"label":"424の5条","kou":["債権者は、受益者に対して詐害行為取消請求をすることができる場合において、受益者に移転した財産を転得した者があるときは、次の各号に掲げる区分に応じ、それぞれ当該各号に定める場合に限り、その転得者に対しても、詐害行為取消請求をすることができる。一その転得者が受益者から転得した者である場合その転得者が、転得の当時、債務者がした行為が債権者を害することを知っていたとき。二その転得者が他の転得者から転得した者である場合その転得者及びその前に転得した全ての転得者が、それぞれの転得の当時、債務者がした行為が債権者を害することを知っていたとき。"]},"民法/424の7":{"label":"424の7条","kou":["詐害行為取消請求に係る訴えについては、次の各号に掲げる区分に応じ、それぞれ当該各号に定める者を被告とする。一受益者に対する詐害行為取消請求に係る訴え受益者二転得者に対する詐害行為取消請求に係る訴えその詐害行為取消請求の相手方である転得者","債権者は、詐害行為取消請求に係る訴えを提起したときは、遅滞なく、債務者に対し、訴訟告知をしなければならない。"]},"民法/426":{"label":"426条","kou":["詐害行為取消請求に係る訴えは、債務者が債権者を害することを知って行為をしたことを債権者が知った時から二年を経過したときは、提起することができない。行為の時から十年を経過したときも、同様とする。"]},"民法/424の6":{"label":"424の6条","kou":["債権者は、受益者に対する詐害行為取消請求において、債務者がした行為の取消しとともに、その行為によって受益者に移転した財産の返還を請求することができる。受益者がその財産の返還をすることが困難であるときは、債権者は、その価額の償還を請求することができる。","債権者は、転得者に対する詐害行為取消請求において、債務者がした行為の取消しとともに、転得者が転得した財産の返還を請求することができる。転得者がその財産の返還をすることが困難であるときは、債権者は、その価額の償還を請求することができる。"]},"民法/424の8":{"label":"424の8条","kou":["債権者は、詐害行為取消請求をする場合において、債務者がした行為の目的が可分であるときは、自己の債権の額の限度においてのみ、その行為の取消しを請求することができる。","債権者が第四百二十四条の六第一項後段又は第二項後段の規定により価額の償還を請求する場合についても、前項と同様とする。"]},"民法/424の9":{"label":"424の9条","kou":["債権者は、第四百二十四条の六第一項前段又は第二項前段の規定により受益者又は転得者に対して財産の返還を請求する場合において、その返還の請求が金銭の支払又は動産の引渡しを求めるものであるときは、受益者に対してその支払又は引渡しを、転得者に対してその引渡しを、自己に対してすることを求めることができる。この場合において、受益者又は転得者は、債権者に対してその支払又は引渡しをしたときは、債務者に対してその支払又は引渡しをすることを要しない。","債権者が第四百二十四条の六第一項後段又は第二項後段の規定により受益者又は転得者に対して価額の償還を請求する場合についても、前項と同様とする。"]},"民法/425":{"label":"425条","kou":["詐害行為取消請求を認容する確定判決は、債務者及びその全ての債権者に対してもその効力を有する。"]},"民法/425の2":{"label":"425の2条","kou":["債務者がした財産の処分に関する行為（債務の消滅に関する行為を除く。）が取り消されたときは、受益者は、債務者に対し、その財産を取得するためにした反対給付の返還を請求することができる。債務者がその反対給付の返還をすることが困難であるときは、受益者は、その価額の償還を請求することができる。"]},"民法/425の3":{"label":"425の3条","kou":["債務者がした債務の消滅に関する行為が取り消された場合（第四百二十四条の四の規定により取り消された場合を除く。）において、受益者が債務者から受けた給付を返還し、又はその価額を償還したときは、受益者の債務者に対する債権は、これによって原状に復する。"]},"民法/96":{"label":"96条","kou":["詐欺又は強迫による意思表示は、取り消すことができる。","相手方に対する意思表示について第三者が詐欺を行った場合においては、相手方がその事実を知り、又は知ることができたときに限り、その意思表示を取り消すことができる。","前二項の規定による詐欺による意思表示の取消しは、善意でかつ過失がない第三者に対抗することができない。"]},"民法/121":{"label":"121条","kou":["取り消された行為は、初めから無効であったものとみなす。"]},"民法/95":{"label":"95条","kou":["意思表示は、次に掲げる錯誤に基づくものであって、その錯誤が法律行為の目的及び取引上の社会通念に照らして重要なものであるときは、取り消すことができる。一意思表示に対応する意思を欠く錯誤二表意者が法律行為の基礎とした事情についてのその認識が真実に反する錯誤","前項第二号の規定による意思表示の取消しは、その事情が法律行為の基礎とされていることが表示されていたときに限り、することができる。","錯誤が表意者の重大な過失によるものであった場合には、次に掲げる場合を除き、第一項の規定による意思表示の取消しをすることができない。一相手方が表意者に錯誤があることを知り、又は重大な過失によって知らなかったとき。二相手方が表意者と同一の錯誤に陥っていたとき。","第一項の規定による意思表示の取消しは、善意でかつ過失がない第三者に対抗することができない。"]},"民法/466の2":{"label":"466の2条","kou":["債務者は、譲渡制限の意思表示がされた金銭の給付を目的とする債権が譲渡されたときは、その債権の全額に相当する金銭を債務の履行地（債務の履行地が債権者の現在の住所により定まる場合にあっては、譲渡人の現在の住所を含む。次条において同じ。）の供託所に供託することができる。","前項の規定により供託をした債務者は、遅滞なく、譲渡人及び譲受人に供託の通知をしなければならない。","第一項の規定により供託をした金銭は、譲受人に限り、還付を請求することができる。"]},"民法/466の4":{"label":"466の4条","kou":["第四百六十六条第三項の規定は、譲渡制限の意思表示がされた債権に対する強制執行をした差押債権者に対しては、適用しない。","前項の規定にかかわらず、譲受人その他の第三者が譲渡制限の意思表示がされたことを知り、又は重大な過失によって知らなかった場合において、その債権者が同項の債権に対する強制執行をしたときは、債務者は、その債務の履行を拒むことができ、かつ、譲渡人に対する弁済その他の債務を消滅させる事由をもって差押債権者に対抗することができる。"]},"民法/466の5":{"label":"466の5条","kou":["預金口座又は貯金口座に係る預金又は貯金に係る債権（以下「預貯金債権」という。）について当事者がした譲渡制限の意思表示は、第四百六十六条第二項の規定にかかわらず、その譲渡制限の意思表示がされたことを知り、又は重大な過失によって知らなかった譲受人その他の第三者に対抗することができる。","前項の規定は、譲渡制限の意思表示がされた預貯金債権に対する強制執行をした差押債権者に対しては、適用しない。"]},"民法/183":{"label":"183条","kou":["代理人が自己の占有物を以後本人のために占有する意思を表示したときは、本人は、これによって占有権を取得する。"]},"民法/333":{"label":"333条","kou":["先取特権は、債務者がその目的である動産をその第三取得者に引き渡した後は、その動産について行使することができない。"]}},"toc":[{"subject":"民法","field":"意思表示（錯誤・詐欺）"},{"subject":"民法","field":"代理"},{"subject":"民法","field":"時効"},{"subject":"民法","field":"物権総論・物権的請求権"},{"subject":"民法","field":"不動産物権変動（177条）"},{"subject":"民法","field":"動産物権変動・即時取得"},{"subject":"民法","field":"占有権"},{"subject":"民法","field":"所有権・共有"},{"subject":"民法","field":"留置権"},{"subject":"民法","field":"抵当権"},{"subject":"民法","field":"非典型担保"},{"subject":"民法","field":"債務不履行・損害賠償"},{"subject":"民法","field":"責任財産の保全"},{"subject":"民法","field":"債権譲渡"},{"subject":"民法","field":"債務引受"},{"subject":"民法","field":"契約の解除"}]};
const KEY = "gomo_anshou_v1";
const NEW_INTERVAL = 3;      // 新しいカードの初回間隔（日）
const FIX_INTERVAL = 3;      // 論証が直されたカードを戻す間隔（日）

/* ---------- 日付 ---------- */
function today(){ return fmt(new Date()); }
function fmt(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0")
       + "-" + String(d.getDate()).padStart(2,"0");
}
function addDays(ymd, n){
  const [y,m,d] = ymd.split("-").map(Number);
  const t = new Date(y, m-1, d);
  t.setDate(t.getDate() + Math.round(n));
  return fmt(t);
}
function daysBetween(a, b){
  const p = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
  return Math.round((p(b) - p(a)) / 86400000);
}

/* ---------- GitHubへの自動保存 ----------
   端末の中の保存（localStorage）だけだと、端末が変わると進捗が分かれてしまう。
   非公開リポジトリに progress.json を置き、解くたびに（30秒に1回まで）書き戻す。
   鍵はアプリの中には入れない。こもごもさんが1回だけ貼り、この端末の中にだけ残る。 */
const CKEY = "gomo_anshou_cloud_v1";
let C = { owner:"xnrmjghn6b-code", repo:"anshou-progress", path:"progress.json", token:"" };
try{ Object.assign(C, JSON.parse(localStorage.getItem(CKEY) || "{}")); }catch(e){}
function cloudOn(){ return !!C.token; }
function cloudSaveCfg(){ try{ localStorage.setItem(CKEY, JSON.stringify(C)); }catch(e){} }

let cloudSha = null;        // いまリポジトリに載っている版の目印（上書きに要る）
let cloudBusy = false;
let cloudDirty = false;
let cloudTimer = null;
let cloudLast = "";         // 最後に送った中身（同じなら送らない）
let cloudState = "";        // 画面に出す一言

function b64enc(str){
  const bytes = new TextEncoder().encode(str);
  let bin = "", CH = 0x8000;
  for(let i = 0; i < bytes.length; i += CH){
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
  }
  return btoa(bin);
}
function b64dec(b64){
  const bin = atob(String(b64).replace(/\s/g, ""));
  const bytes = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function ghUrl(){
  return "https://api.github.com/repos/" + C.owner + "/" + C.repo
       + "/contents/" + encodeURIComponent(C.path);
}
/* エラーのとき、GitHubが返した理由まで出す（「HTTP 401」だけでは直せない） */
async function ghWhy(res){
  let why = "HTTP " + res.status;
  try{
    const j = await res.json();
    if(j && j.message) why += "：" + j.message;
  }catch(e){}
  return why;
}
/* 鍵そのものは見せずに、形だけ見せる（欠けて貼られていないかの確認用） */
function tokShape(){
  const t = C.token || "";
  if(!t) return "鍵なし";
  return t.length + "文字・先頭 " + t.slice(0, 11) + "…末尾 " + t.slice(-4);
}
function ghFetch(method, body){
  const opt = { method: method, cache: "no-store", headers: {
    "Authorization": "Bearer " + C.token,
    "Accept": "application/vnd.github+json",
    "X-GitHub-Api-Version": "2022-11-28" } };
  if(body){
    opt.body = JSON.stringify(body);
    opt.headers["Content-Type"] = "application/json";
  }
  return fetch(ghUrl() + (method === "GET" ? "?t=" + Date.now() : ""), opt);
}
function hhmm(){
  const d = new Date();
  return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}
function paintCloud(){
  const h = document.getElementById("cloudHdr");
  if(h) h.textContent = cloudOn() ? ("☁ " + (cloudState || "待機")) : (cloudState || "");
  const m = document.getElementById("cloudMsg");

}

/* カード1枚ずつ、進んでいるほう（採点回数が多いほう）を採る。
   端末をまたいで解いても、どちらかの記録が丸ごと消えることがないようにするため。 */
function mergeProgress(remote){
  if(!remote || !remote.cards) return false;
  let changed = false;
  Object.keys(remote.cards).forEach(id => {
    const r = remote.cards[id], l = S.cards[id];
    if(!l){ S.cards[id] = r; changed = true; return; }
    const rr = r.reps || 0, lr = l.reps || 0;
    if(rr > lr || (rr === lr && (r.last || "") > (l.last || ""))){
      S.cards[id] = r; changed = true;
    }
  });
  // 参照の判定・1日の枚数は、あとから触ったほうを採る
  if((remote.updated || "") > (S.updated || "")){
    if(remote.ref){ S.ref = remote.ref; changed = true; }
    if(remote.cap){ S.cap = remote.cap; changed = true; }
  }
  return changed;
}

async function cloudPull(){
  if(!cloudOn()) return false;
  cloudState = "読み込み中"; paintCloud();
  try{
    const res = await ghFetch("GET");
    if(res.status === 404){          // まだ1回も保存していない
      cloudSha = null;
      cloudState = "保存はまだ無い";
      paintCloud();
      return false;
    }
    if(!res.ok) throw new Error(await ghWhy(res));
    const j = await res.json();
    cloudSha = j.sha;
    const changed = mergeProgress(JSON.parse(b64dec(j.content)));
    if(changed){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
    cloudState = changed ? "取り込んだ " + hhmm() : "同期済み " + hhmm();
    paintCloud();
    return changed;
  }catch(e){
    cloudState = "読めない（" + e.message + "）";
    paintCloud();
    return false;
  }
}

async function cloudPush(force){
  if(!cloudOn() || cloudBusy) return;
  if(!cloudDirty && !force) return;
  const text = JSON.stringify(S, null, 1);
  if(text === cloudLast && !force) { cloudDirty = false; return; }
  cloudBusy = true; cloudDirty = false;
  cloudState = "保存中"; paintCloud();
  try{
    for(let attempt = 0; attempt < 2; attempt++){
      const body = { message: "進捗 " + new Date().toISOString().slice(0,16).replace("T"," "),
                     content: b64enc(text) };
      if(cloudSha) body.sha = cloudSha;
      const res = await ghFetch("PUT", body);
      if(res.ok){
        const j = await res.json();
        cloudSha = (j.content && j.content.sha) || null;
        cloudLast = text;
        cloudState = "保存した " + hhmm();
        break;
      }
      if((res.status === 409 || res.status === 422) && attempt === 0){
        await cloudPull();           // 別の端末が先に書いた → 取り込んでからもう一度
        continue;
      }
      throw new Error(await ghWhy(res));
    }
  }catch(e){
    cloudDirty = true;               // 次の機会に送り直す
    cloudState = "保存できない（" + e.message + "）";
  }
  cloudBusy = false;
  paintCloud();
}

function cloudTouch(){
  if(!cloudOn()) return;
  cloudDirty = true;
  if(cloudTimer) return;
  cloudTimer = setTimeout(() => { cloudTimer = null; cloudPush(); }, 30000);
}

document.addEventListener("visibilitychange", () => {

});

/* 全カードを平らに並べ、進捗を初期化・訂正を検出する */
const CARDS = [];
DATA.books.forEach(b => b.cards.forEach(c => CARDS.push(Object.assign({book:b}, c))));
const LAWS = DATA.laws || {};

/* 暗唱の対象か、参照でよいか。
   既定は build_cards.py の判定（条文の引き写し・覚える語の指定なし）で、
   こもごもさんが押した結果が常にそれに勝つ。 */
function isRef(c){
  if(S.ref && S.ref[c.id] !== undefined) return S.ref[c.id];
  return !!c.ref;
}
function setRef(id, v){
  S.ref = S.ref || {};
  S.ref[id] = v;
  save();
}

function sync(){
  let fixed = 0;
  CARDS.forEach(c => {
    let st = S.cards[c.id];
    if(!st){
      // 初回は当日から出す（既存の暗唱レーンは大半が期日超過だったため）。
      // 間隔の起点は3日で、最初の採点から伸び始める。
      S.cards[c.id] = { due: today(), interval: NEW_INTERVAL,
                        hash: c.hash, reps: 0, streak5: 0, grade: null, hist: [] };
      return;
    }
    if(st.hash !== c.hash){          // 論証が直された → そのカードだけ期日を戻す
      st.hash = c.hash;
      st.due = addDays(today(), FIX_INTERVAL);
      st.interval = FIX_INTERVAL;
      st.streak5 = 0;
      st.fixed = today();
      fixed++;
    }
  });
  Object.keys(S.cards).forEach(id => {   // 消えた論証の進捗は残しておく（害がない）
    if(!CARDS.some(c => c.id === id)) S.cards[id].gone = true;
  });
  if(fixed) save();
  return fixed;
}

/* ---------- 出題の順番 ---------- */
/* 条文どおりのカード（台帳で判定したもの）は、その日の出題の最後に回す。
   法律に書いてあることを並べただけのものは、判例法理より暗唱の優先度が落ちるため
   （2026-07-30 こもごもさん指示）。暗唱から外しはしない。 */
function isLaw(c){ return !!c.law; }
function dueCards(){
  const t = today();
  return CARDS.filter(c => !isRef(c) && S.cards[c.id].due <= t)
              .sort((a,b) => (isLaw(a) - isLaw(b))
                          || S.cards[a.id].due.localeCompare(S.cards[b.id].due)
                          || a.id.localeCompare(b.id));
}
function cap(){ return S.cap || 12; }
function refCards(){ return CARDS.filter(isRef); }

/* 通しモード（L2）：その本の暗唱カード全部が2回続けて5 になったら開く */
function bookReady(b){
  const cs = b.cards.filter(c => !isRef(Object.assign({book:b}, c)));
  return cs.length > 0 && cs.every(c => (S.cards[c.id].streak5 || 0) >= 2);
}

/* ---------- 採点 → 次の期日 ---------- */
function grade(id, g){
  const st = S.cards[id];
  const prev = st.interval || NEW_INTERVAL;
  let next;
  if(g === 5)      next = prev * 2;
  else if(g === 4) next = Math.ceil(prev * 1.5);
  else if(g === 3) next = prev;
  else if(g === 2) next = 3;
  else             next = 1;
  st.interval = next;
  st.due = addDays(today(), next);
  st.grade = g;
  st.reps = (st.reps || 0) + 1;
  st.streak5 = (g === 5) ? (st.streak5 || 0) + 1 : 0;
  st.last = today();
  delete st.fixed;
  st.hist = (st.hist || []).concat([[today(), g]]).slice(-10);
  save();
  return next;
}

/* ---------- 画面 ---------- */
const view = () => document.getElementById("view");
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
/* 本文を読むとき、本来穴になっていた箇所（＝覚える所）を色で示す */
function emph(s){
  return esc(s).replace(/⟪(.+?)⟫/g, '<span class="em">$1</span>');
}
const MARKS = "アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモ";
function holes(s, answers){
  // 穴の記号は ⟦ア⟧。論証が小見出しに使う 【…】 とは別の記号にしてある。
  // 幅は答えの字数ぶん取る（答えを見ると、この空欄にそのまま赤字が入る）。
  // 穴にしなかった太字（⟪…⟫）は問題文でも強調して出す
  return emph(s).replace(/⟦(.+?)⟧/g, (m, mark) => {
    const i = MARKS.indexOf(mark);
    const a = (i >= 0 && answers) ? (answers[i] || "") : "";
    const n = Array.from(a).length;
    const mk = '<span class="mk">' + mark + '</span>';
    if(!n) return '<span class="hole">' + mk + '</span>';
    // 幅は答えの字数ぶん。ただし画面幅で止める（min()）——止めないと、答えが長い穴が
    // iPhoneで画面外に飛び出す（2026-07-30 こもごもさん報告：錯誤 第3 のア29字・ウ24字）
    return '<span class="hole" data-h="' + i + '" style="min-width:min(' + n + 'em,100%)">'
         + mk + '</span>';
  });
}
/* 答えを見たとき、問題文の空欄そのものに赤字で答えを入れる（別表に並べない） */
function fillHoles(answers){
  view().querySelectorAll(".hole[data-h]").forEach(el => {
    const i = +el.dataset.h;
    el.classList.add("filled");
    el.innerHTML = '<span class="mk">' + (MARKS[i] || ("№"+(i+1))) + '</span>'
                 + esc(answers[i] || "");
  });
}
/* 論証mdから持ってきた文字列の **太字** を太字として出す（記号のまま見せない） */
function md(s){ return esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'); }
/* 空欄を元に戻す（答えを隠すとき） */
function clearHoles(){
  view().querySelectorAll(".hole[data-h]").forEach(el => {
    el.classList.remove("filled");
    el.innerHTML = '<span class="mk">' + (MARKS[+el.dataset.h] || "") + '</span>';
  });
}
/* 判例の注釈。⦅…⦆ が引用の範囲、⟨n⟩ がその番号（build_cards.py が付ける） */
function deco(s, notes){
  s = s.replace(/⦅([\s\S]+?)⦆/g, '<span class="quote">$1</span>');
  return (notes && notes.length)
    ? s.replace(/⟨(\d+)⟩/g, '<sup class="note">$1</sup>')
    : s.replace(/⟨\d+⟩/g, "");
}
/* 注釈の一覧（小さく出す）。判示は答えを見るまで伏せる（規範が漏れるため） */
function noteList(notes, withGist){
  if(!notes || !notes.length) return "";
  let h = '<div class="notes">';
  notes.forEach(n => {
    h += '<p><span class="n">' + n.n + '</span><span class="case">'
       + md(n.case || n.label) + '</span>';
    if(withGist && n.gist) h += '　' + md(n.gist);
    h += '</p>';
  });
  if(!withGist) h += '<p>点線が引用にあたる部分。判示は答えを見ると出る。</p>';
  return h + '</div>';
}
