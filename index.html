<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-title" content="論証暗唱">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<title>論証暗唱</title>
</head>
<body>
<style>
  /* 六法・判例集の紙面から採った配色。地は冷たい紙、差し色は藍、警告だけ朱。
     本文は明朝（法律文書の書体）、ラベルと数字はゴシックで役割を分ける。 */
  :root{
    --bg:#f4f5f7; --fg:#15171c; --dim:#61656e; --line:#dcdfe5; --card:#fdfdfe;
    --accent:#2f4b7c; --accent-soft:#e6ebf4;
    --hole:#eef2f8; --holeline:#2f4b7c; --ok:#2c6146; --ng:#a2352a; --em:#a8352a; --ans:#c62828;
  }
  /* 端末やビューアがダークでも紙の色のまま出す（2026-07-30 こもごもさん指示） */
  :root{ color-scheme:light }
  :root[data-theme=light],:root[data-theme=dark]{
    --bg:#f4f5f7; --fg:#15171c; --dim:#61656e; --line:#dcdfe5; --card:#fdfdfe;
    --accent:#2f4b7c; --accent-soft:#e6ebf4;
    --hole:#eef2f8; --holeline:#2f4b7c; --ok:#2c6146; --ng:#a2352a; --em:#a8352a; --ans:#c62828;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font-family:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP","Times New Roman",serif;
    line-height:1.9;-webkit-text-size-adjust:100%}
  .dim,.meta,.pill,.glabel,th,td,button,textarea,h1{
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif}
  th,td,.big,.grades button{font-variant-numeric:tabular-nums}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  /* 下端のヒント列に隠れないだけの余白を取る（列が折り返して高くなっても追従する） */
  .wrap{max-width:44rem;margin:0 auto;padding:1rem 1rem calc(var(--railh, 3rem) + 3rem)}
  header{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap;
    padding:.2rem 0 .8rem;border-bottom:1px solid var(--line);margin-bottom:1rem}
  h1{font-size:1.05rem;margin:0;letter-spacing:.04em}
  .grow{flex:1}
  .dim{color:var(--dim);font-size:.82rem;letter-spacing:.02em}
  button{font-family:inherit;font-size:1rem;color:var(--fg);background:var(--card);
    border:1px solid var(--line);border-radius:.5rem;padding:.55rem .9rem;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
  button.link{background:none;border:none;color:var(--dim);text-decoration:underline;
    padding:.2rem .3rem;font-size:.82rem}
  /* 「もどる」「とばす」は同じ大きさで、「答えを見る」より一回り小さく */
  button.sub{font-size:.85rem;padding:.4rem .2rem;min-width:5rem;color:var(--dim)}
  button.sub[disabled]{opacity:.35;cursor:default;border-color:var(--line)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:.7rem;
    padding:1.1rem 1.15rem;margin-bottom:1rem}
  .meta{display:flex;gap:.5rem;align-items:baseline;flex-wrap:wrap;
    font-size:.8rem;color:var(--dim);margin-bottom:.5rem}
  .book{font-size:.95rem;color:var(--fg);font-weight:600}
  .block{font-size:1.02rem;font-weight:700;margin:.3rem 0 .7rem;color:var(--accent)}
  .body{white-space:pre-wrap;word-break:normal;overflow-wrap:anywhere}
  /* 穴の幅は答えの字数ぶん確保する。答えを見ると、この幅にそのまま赤字が入る
     （空欄の長さ＝答えの長さなので、何字ぶん書くのかが解く前に分かる） */
  .hole{background:var(--hole);border-bottom:2px solid var(--holeline);
    padding:0 .35em;border-radius:.2em;font-weight:600;
    display:inline-block;text-align:center;max-width:100%;color:var(--accent);
    vertical-align:baseline;overflow-wrap:anywhere}
  /* 答えが入った状態。地色を消して赤字だけを残す */
  .hole.filled{background:none;color:var(--ans);text-align:left;
    border-bottom-color:var(--ans);font-weight:700}
  .hole .mk{font-size:.62em;font-weight:400;color:var(--dim);vertical-align:.4em;
    margin-right:.15em;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif}
  /* 本来穴になっていた箇所（＝覚える所）。参照や答えを読み返すときに目で拾えるように */
  .em{color:var(--em);font-weight:700}
  /* 判例の引用にあたる部分（注釈で範囲を示したもの） */
  .quote{border-bottom:1px dotted var(--dim)}
  sup.note{font-size:.6em;vertical-align:.5em;color:var(--accent);font-weight:700;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
    margin:0 .1em}
  .notes{font-size:.76rem;line-height:1.7;color:var(--dim);margin-top:.7rem;
    border-left:2px solid var(--line);padding-left:.6rem;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif}
  .notes .n{color:var(--accent);font-weight:700;margin-right:.25em}
  .notes .case{color:var(--fg)}
  .notes p{margin:.2rem 0}
  details.hanrei{margin-top:.7rem;font-size:.76rem;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif}
  details.hanrei summary{color:var(--dim);cursor:pointer}
  details.hanrei table{font-size:.74rem;margin-top:.4rem}
  /* 判例名は途中で折らない（日付が2行に割れると読みにくい） */
  details.hanrei td.nm{white-space:nowrap}
  /* 狭い画面では表をやめて縦に積む。横並びのままだと、判例名の列に幅を取られて
     判示が1行4文字になる（2026-07-30 こもごもさんiPhone報告） */
  @media (max-width:34rem){
    details.hanrei table,details.hanrei tbody,details.hanrei tr,details.hanrei td{
      display:block;width:auto}
    details.hanrei tr{border-bottom:1px solid var(--line);padding:.4rem 0}
    details.hanrei td{border:none;padding:0}
    details.hanrei td.nm{white-space:normal;color:var(--accent);font-weight:700;
      margin-bottom:.15rem}
  }
  .ans{border-top:1px dashed var(--line);margin-top:1rem;padding-top:.8rem}
  .ans ol{margin:.2rem 0;padding-left:1.4rem}
  .ans li{margin:.15rem 0}
  .ans b{color:var(--accent)}
  .check{font-size:.86rem;color:var(--dim);margin-top:.7rem;
    border-left:3px solid var(--line);padding-left:.7rem}
  .grades{display:flex;gap:.4rem;margin-top:1rem}
  .grades button{flex:1;font-size:1.15rem;font-weight:700;padding:.7rem .2rem}
  .glabel{display:block;font-size:.62rem;font-weight:400;color:var(--dim);margin-top:.2rem}
  .row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
  table{border-collapse:collapse;width:100%;font-size:.82rem}
  th,td{border-bottom:1px solid var(--line);padding:.35rem .4rem;text-align:left;
    vertical-align:top}
  th{color:var(--dim);font-weight:400}
  .scroll{overflow-x:auto}
  .pill{display:inline-block;font-size:.7rem;border:1px solid var(--line);
    border-radius:1em;padding:0 .5em;color:var(--dim)}
  .due{color:var(--ng);font-weight:700}
  .pill.law{border-color:var(--dim)}
  .pill.case{border-color:var(--accent);color:var(--accent)}
  .srcnote{display:block;font-size:.72rem;font-weight:400;color:var(--dim);
    margin:.15rem 0 .1rem;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif}
  textarea{width:100%;min-height:7rem;font-family:ui-monospace,monospace;font-size:.75rem;
    background:var(--card);color:var(--fg);border:1px solid var(--line);
    border-radius:.5rem;padding:.6rem}
  .warn{border:1px solid var(--ng);color:var(--ng);border-radius:.5rem;
    padding:.6rem .8rem;font-size:.84rem;margin-bottom:1rem}
  .hide{display:none}
  /* 画面の下端に置く小さなヒント列。詰まったらここから条文と制度を引く。
     iPhone対策（2026-07-30 こもごもさん指摘）：**横スクロールを作らない**。
     画面下端で横に払う操作はiOSがアプリ切替に取るので、指が届かない場所ができてしまう。
     ボタンは「条文」「前提」の2個までに畳み、中身は上に開くパネルで縦に読む。
     ホームバーに重ならないよう safe-area ぶん持ち上げる。 */
  .rail{position:fixed;left:0;right:0;bottom:0;background:var(--card);
    border-top:1px solid var(--line);display:flex;gap:.4rem;
    padding:.4rem .6rem calc(.4rem + env(safe-area-inset-bottom));
    flex-wrap:wrap;align-items:center;z-index:5}
  .rail .tag{color:var(--dim);font-size:.7rem;letter-spacing:.08em;flex:none;padding-right:.2rem}
  .rail button{flex:none;font-size:.82rem;padding:.4rem .8rem;border-radius:1em;
    background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}
  .rail button.on{background:var(--accent);color:#fff}
  .railpanel{position:fixed;left:0;right:0;bottom:var(--railh,2.7rem);max-height:60vh;
    overflow-y:auto;-webkit-overflow-scrolling:touch;
    background:var(--card);border-top:1px solid var(--line);
    box-shadow:0 -8px 24px rgba(0,0,0,.14);padding:.9rem 1rem 1.1rem;z-index:4}
  .railpanel .wrapin{max-width:44rem;margin:0 auto}
  .railpanel h3{font-size:.9rem;margin:0 0 .5rem;color:var(--accent);
    display:flex;align-items:baseline;gap:.5rem}
  .railpanel h3 .grow{flex:1}
  .railpanel .close{font-size:.78rem;padding:.25rem .7rem;border-radius:1em;font-weight:600}
  .railpanel .art{margin-bottom:.9rem}
  .railpanel .art b{font-size:.82rem;color:var(--dim);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif}
  .railpanel .art p{margin:.15rem 0}
  .railpanel .kou{color:var(--dim);font-size:.78rem;margin-right:.3rem}
  /* 目次（分野＞論証＞ブロック）。短答アプリの目次と同じ色分けの約束
     ——未＝灰／出来た＝緑／あやふや＝黄／落ちた＝朱／参照＝取り消し線。 */
  .tocsub{font-size:.72rem;color:var(--dim);letter-spacing:.14em;margin:1.2rem 0 .3rem}
  details.field{border:1px solid var(--line);border-radius:.6rem;background:var(--card);
    margin-bottom:.5rem;padding:.5rem .7rem}
  details.field>summary{cursor:pointer;font-weight:700;font-size:.95rem;color:var(--accent);
    list-style:none;display:flex;gap:.5rem;align-items:baseline}
  details.field>summary::-webkit-details-marker{display:none}
  details.field>summary::before{content:"▸";color:var(--dim);font-size:.8em}
  details.field[open]>summary::before{content:"▾"}
  details.field>summary .n{font-weight:400;font-size:.76rem;color:var(--dim);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif}
  .tocbook{border-top:1px dashed var(--line);padding:.5rem 0 .3rem;margin-top:.4rem}
  .tocbook .nm{font-size:.88rem;font-weight:600;background:none;border:none;padding:0;
    text-align:left;color:var(--fg);cursor:pointer;text-decoration:underline dotted}
  .tocbook .nm:hover{color:var(--accent)}
  .chips{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.35rem}
  .chip{min-width:2.1rem;font-size:.8rem;padding:.2rem .35rem;border-radius:.4rem;
    border:1px solid var(--line);background:var(--card);color:var(--dim);cursor:pointer}
  .chip.ok{border-color:var(--ok);color:var(--ok);background:#eef5f1}
  .chip.mid{border-color:#8a6410;color:#8a6410;background:#fbf4e4}
  .chip.ng{border-color:var(--ng);color:var(--ng);background:#fbeeec}
  .chip.ref{text-decoration:line-through;opacity:.55;cursor:default}
  .chip .dot{color:#b8621a;font-size:.62em;vertical-align:.35em;margin-left:.1em}
  .big{font-size:1.6rem;font-weight:700}
  .setsurei{background:var(--hole);border-left:3px solid var(--accent);
    border-radius:0 .4rem .4rem 0;padding:.8rem .9rem;margin:.5rem 0}
</style>

<div class="wrap">
  <header>
    <h1>論証暗唱</h1>
    <span class="grow"></span>
    <span class="dim" id="hdr"></span>
    <span class="dim" id="cloudHdr"></span>
    <button class="link" id="btnSave">保存</button>
    <button class="link" id="btnToc">目次</button>
    <button class="link" id="btnHome">ホーム</button>
  </header>

  <div id="noStore" class="warn hide">
    このブラウザでは進捗を保存できません（localStorage が使えない）。
    このまま進めると採点結果が消えます。
  </div>

  <div id="view"></div>
</div>
<div class="railpanel hide" id="railpanel"></div>
<div class="rail hide" id="rail"></div>

<script>

const DATA = {"books":[{"name":"独立当事者参加_一人の上訴と合一確定_利益変更禁止","subject":"民事訴訟法","rank":null,"path":"まとめ/民事訴訟法/論証/独立当事者参加_一人の上訴と合一確定_利益変更禁止.md","cards":[],"setsurei":[],"full":"","kata":"| ブロック | 書くこと | キーワード |\n|---|---|---|\n| (1) | 利益変更禁止（304条・296条1項＝処分権主義）から上訴しない者に不利な変更は不可のはず→合一確定（47条4項・40条）と衝突、と問題提起 | 304条／処分権主義／合一確定 |\n| (2) | 一人の上訴で全部確定遮断（116条2項）・移審（上訴不可分）。上訴しない者は40条2項で**被上訴人** | 116条2項／上訴不可分／40条2項 |\n| (3) | **合一確定の要請が利益変更禁止に優先し、必要な限度で変更可**（最判昭48.7.20）。限度を超えれば不可 | 合一確定に必要な限度 |\n| (4) | あてはめ：原判決を残すと上訴人の勝訴判断と矛盾するか→矛盾する部分だけ変更 | 矛盾／必要な限度 |\n\n**勝負どころ（第(3)）**：①利益変更禁止は処分権主義に基づく→②しかし独立当事者参加は三者間の矛盾なき一挙解決の制度→③合一確定の要請が優先し**必要な限度で**変更可→④ただし「不利益変更禁止ではなく利益変更禁止の問題」と一言切り分ける。\n\n> ⚠️ **射程（必要な限度の例）**\n> | 場面 | 可否 |\n> |---|---|\n> | 上訴人Zを認容に変更（不服の範囲内） | 可 |\n> | Zの勝訴に矛盾する相手方の勝訴部分を変更 | **可**（合一確定に必要） |\n> | 上訴人Zを不服の範囲を超えて利する変更 | **不可**（合一確定に不要→利益変更禁止が復活） |\n\n---","hanrei":[["最判昭48・7・20　民集27巻7号863頁","独立当事者参加で敗訴者の一人が上訴したとき、全体が移審し、**合一確定に必要な範囲で**上訴しなかった当事者の原判決部分を変更できる（利益変更禁止の修正）","**民訴百選106番**（山本和彦解説）。事案は請負代金債権の二重譲渡（0/100の帰属争い）"],["最判昭50・3〔民集29巻3号233頁〕","上訴の相手方とされず自ら上訴もしなかった敗訴当事者は被上訴人の地位に立つ","40条2項準用の根拠"]],"field":"多数当事者訴訟","order":37},{"name":"詐害防止参加_権利が害されるの意義","subject":"民事訴訟法","rank":null,"path":"まとめ/民事訴訟法/論証/詐害防止参加_権利が害されるの意義.md","cards":[],"setsurei":[],"full":"","kata":"| ブロック | 書くこと | キーワード |\n|---|---|---|\n| (1) | 既判力はYに及ばない（115条1項）→それでも「害される」か問題提起 | 47条1項前段／115条1項 |\n| (2) | 判決効説＝狭すぎ（補助参加等で足りる）／利害関係説＝補助参加との役割分担が不明確、を潰す | 馴れ合い訴訟からの救済 |\n| (3) | **詐害意思説（客観説）**：当事者の訴訟追行が**客観的に詐害的**といえるか | 客観的詐害性／沿革 |\n| (4) | あてはめ：①訴訟物の帰結が参加人の地位の前提を崩すか ②当事者の訴訟追行に詐害の兆候（欠席・不争・自白）があるか | |\n\n**勝負どころ（第(2)→(3)）**：①「判決効説だと既判力の相対効（115条1項）ゆえ場面がほぼ消え、その程度なら共同訴訟的補助参加で足りる」→②「利害関係説は詐害性を問わないので補助参加との棲み分けが崩れる」→③「だから**客観的な詐害性**で絞る（詐害意思説・客観説）」。\n\n**あてはめで書き落としやすい点**：(4)で「参加人の地位が崩れる」だけ書いて終わらないこと。**当事者の訴訟追行態度（欠席・争わない・安易な自白）を必ず拾う**——それが客観的詐害性の認定資料になる。\n\n> ⚠️ **3説の帰結の違い（同じ設例での処理）**\n> | 説 | 設例の処理 |\n> |---|---|\n> | 判決効説 | 要件を**満たさない**（YにXA間判決の効力は及ばない） |\n> | 利害関係説（＝権利侵害説） | 要件を**満たす**（事実上の影響で足りる） |\n> | 詐害意思説（ e","masked":"真の権利者が⟦ア⟧場合、および⦅他人が作り出した不実の外観の存在を知りながら、これを存続させることを⟦イ⟧していた場合⦆⟨1⟩には、不実の外観を自らの意思により引き受けたものといえるから、②の帰責性が認められる。\n真の権利者が不実の外観の存在を⟦ウ⟧場合であっても、その帰責性の程度が、自ら外観の作出に積極的に関与した場合やこれを知りながらあえて放置した場合と⟦エ⟧ときは、②の帰責性を認めてよい。","body":"真の権利者が⟪自ら不実の外観を作り出した⟫場合、および⦅他人が作り出した不実の外観の存在を知りながら、これを存続させることを⟪明示または黙示に承認⟫していた場合⦆⟨1⟩には、不実の外観を自らの意思により引き受けたものといえるから、②の帰責性が認められる。\n真の権利者が不実の外観の存在を⟪認識していなかった⟫場合であっても、その帰責性の程度が、自ら外観の作出に積極的に関与した場合やこれを知りながらあえて放置した場合と⟪同視し得るほど重い⟫ときは、②の帰責性を認めてよい。","answers":["自ら不実の外観を作り出した","明示または黙示に承認","認識していなかった","同視し得るほど重い"],"check":"","notes":[{"n":1,"label":"最判昭45・9・22","case":"**最判昭和45・9・22**（民集24巻10号1424頁）","gist":"「不実の所有権移転登記の経由が所有者の不知の間に他人の専断によってされた場合でも、**所有者が右不実の登記のされていることを知りながら、これを存続せしめることを明示または黙示に承認していたときは、右94条2項を類推適用**し…登記名義人が所有権を取得していないことをもって〔**善意の第三者に**〕対抗することをえない」。理由＝**承認が登記経由の事前に与えられたか事後に与えられたかによって、外形に信頼した第三者の保護に差等を設けるべき理由はない**"}],"law":"","cites":[],"rate":0,"designed":true,"ref":false,"hash":"e9fc9d14a7db"},{"id":"民法/94条2項の類推適用#4","block":"第4〔③第三者の主観的保護要件は、②の帰責性の程度に応じて決まる〕","kind":"cloze","masked":"⟪(i) 意思外形対応型⟫——第三者が信頼した外観が、真の権利者が自ら作出しまたは承認した外観⟪そのもの⟫であるときは、権利者には虚偽表示者と同等の帰責性があるから、第三者は⟦ア⟧であれば足り、⟦イ⟧であることを要しない（⟦ウ⟧）。\n⟪(ii) 意思外形非対応型⟫——第三者が信頼した外観が、真の権利者が承認した第一の外観をもとに⟪他人がこれを超えて作り出した第二の外観⟫であるときは、権利者の帰責性は前者ほど大きくないから、⦅第三者は⟦エ⟧であることを要する⦆⟨1⟩（⟦オ⟧）。\n⟪(iii) 外形与因型（権利者が不実の外観を認識していない場合）⟫——帰責性が同様に小さいから、⦅⟦エ⟧を要する⦆⟨2⟩（⟦カ⟧）。","body":"⟪(i) 意思外形対応型⟫——第三者が信頼した外観が、真の権利者が自ら作出しまたは承認した外観⟪そのもの⟫であるときは、権利者には虚偽表示者と同等の帰責性があるから、第三者は⟪善意⟫であれば足り、⟪無過失⟫であることを要しない（⟪94条2項の類推適用⟫）。\n⟪(ii) 意思外形非対応型⟫——第三者が信頼した外観が、真の権利者が承認した第一の外観をもとに⟪他人がこれを超えて作り出した第二の外観⟫であるときは、権利者の帰責性は前者ほど大きくないから、⦅第三者は⟪善意かつ無過失⟫であることを要する⦆⟨1⟩（⟪94条2項および110条の法意⟫）。\n⟪(iii) 外形与因型（権利者が不実の外観を認識していない場合）⟫——帰責性が同様に小さいから、⦅善意かつ無過失を要する⦆⟨2⟩（⟪94条2項および110条の類推適用⟫）。","answers":["善意","無過失","94条2項の類推適用","善意かつ無過失","94条2項および110条の法意","94条2項および110条の類推適用"],"check":"","notes":[{"n":1,"label":"最判昭43・10・17","case":"最判昭和43・10・17（民集22巻10号2188頁）","gist":"**意思外形非対応型**。「外観上の仮登記義務者は、その本登記の無効をもって**善意無過失**の第三者に対抗できない…けだし、仮登記の外観を仮装した者がその外観に基づいてされた本登記を信頼した善意無過失の第三者に対して、責に任ずべきことは、**民法94条2項、同法110条の法意に照らし、外観尊重および取引保護の要請**というべきだからである」"},{"n":2,"label":"最判平18・2・23","case":"**最判平成18・2・23**（民集60巻2号546頁）","gist":"権利者が**不実の登記の存在を知らなかった**事案で、「本件登記手続をすることができたのは、上記のような X の**余りにも不注意な行為**によるものであり、…X の帰責性の程度は、**自ら外観の作出に積極的に関与した場合やこれを知りながらあえて放置した場合と同視し得るほど重いもの**というべきである」として、**善意無過失**の第三者を「**民法94条2項、110条の類推適用により**」保護した"}],"law":"","cites":["民法/94","民法/110"],"rate":1,"designed":true,"ref":false,"hash":"ac4aa154813d"},{"id":"民法/94条2項の類推適用#5","block":"第5〔結論の効果〕","kind":"cloze","masked":"以上の要件が充たされるとき、真の権利者は、登記名義人が⟦ア⟧ことを当該第三者に対して⟦イ⟧。","body":"以上の要件が充たされるとき、真の権利者は、登記名義人が⟪権利を取得していない⟫ことを当該第三者に対して⟪主張することができない⟫。","answers":["権利を取得していない","主張することができない"],"check":"","notes":[],"law":"","cites":[],"rate":0,"designed":true,"ref":false,"hash":"f21788c24247"}],"setsurei":["A は甲土地を所有していた。A と内縁関係にあった B は、A に無断で A の実印と権利証を使用し、A・B 間の売買を原因とする B 名義への所有権移転登記を経由した。A はその直後にこれを知り、B も名義回復を約束したが、登記費用の都合から抹消登記手続は見送られ、その後 A・B が婚姻して同居した事情もあって、B 名義のまま数年が経過した。その間に A は銀行から融資を受けるにあたり、**B 名義のままで甲土地に抵当権を設定する登記を経由した**。 その後、B は甲土地を C に売却し、C への所有権移転登記が経由された。C は、甲土地が B の所有に属しないことを知らなかったが、A が甲土地を現に占有していたのであるから、少し調べれば B が所有者でないと気づけたはずであり、**C には調査を怠った過失があった**。 A は C に対し、所有権に基づき C 名義の登記の抹消登記手続を求めた。A の請求は認められるか。","A は甲土地を所有していた。A は、知人 B から「個人名義の不動産がないと取引先の信用が得られないので名義を貸してほしい」と頼まれ、B との間で将来 B に売却する旨の**売買予約を仮装して、B のために所有権移転請求権保全の仮登記**を経由した。ところが B は、A の委任状を偽造して、A に無断で**売買を原因とする B 名義への所有権移転の本登記**に改める手続をした。 その後、B は甲土地を C に売却し、C への所有権移転登記が経由された。C は、B 名義の本登記から B が所有者であると信じていたが、**登記記録上、本登記の直前に売買予約による仮登記がされた経緯が読み取れ、かつ A が甲土地を現に占有し固定資産税も納めていたのに、C は A に何ら確認せず調査もしなかった**。 A は C に対し、所有権に基づき C 名義の登記の抹消登記手続を求めた。A の請求は認められるか。 **設例1と設例2の関係**：どちらも「第三者は善意だが過失がある」で共通させてある。**引く条文と第三者の要件が変わるので、結論が逆になる**（設例1＝94条2項の類推適用・善意で足りる → C 保護／設例2＝94条2項および110条の法意・善意無過失が必要 → C 不保護）。暗唱で交互に出すこと。"],"full":"(1) 直接適用の否定\n不動産登記には⟪公信力⟫がないから、登記名義人が無権利者である以上、そこから譲り受けた第三者は原則として権利を取得しない。また、真の権利者と登記名義人との間に「相手方と通じてした虚偽の意思表示」（⟪94条1項⟫）がない本件では、94条2項を直接適用することもできない。\nしかし、これでは登記という外観を信頼して取引に入った者の⟪取引の安全⟫が害される。\n\n(2) 類推適用の一般規範（3要件）\n94条2項の趣旨は、虚偽の外観の作出につき帰責性のある者の犠牲において、その外観を信頼した第三者を保護する点（⟪権利外観法理⟫）にある。\nそうであれば、①ある者に権利が帰属することを推定させる⟪不実の外観⟫が存在し、②通謀がなくとも、その外観の作出または存続について真の権利者に⟪帰責性⟫があり、③第三者がその外観を⟪正当に信頼⟫した場合には、94条2項の適用の場合と同様の利益状況にあるといえるから、同項を⟪類推適用⟫して第三者を保護すべきと解する。\nそして、②の⟪帰責性の程度⟫によって、③第三者に求められる⟪主観的保護要件⟫が変わると解すべきである。真の権利者の帰責性が小さい場合にまで第三者を厚く保護すれば、真の権利者の利益を不当に害するからである。\n\n(3) ②帰責性の内容\n真の権利者が⟪自ら不実の外観を作り出した⟫場合、および⦅他人が作り出した不実の外観の存在を知りながら、これを存続させることを⟪明示または黙示に承認⟫していた場合⦆⟨1⟩には、不実の外観を自らの意思により引き受けたものといえるから、②の帰責性が認められる。\n真の権利者が不実の外観の存在を⟪認識していなかった⟫場合であっても、その帰責性の程度が、自ら外観の作出に積極的に関与した場合やこれを知りながらあえて放置した場合と⟪同視し得るほど重い⟫ときは、②の帰責性を認めてよい。\n\n(4) ③第三者の主観的保護要件は、②の帰責性の程度に応じて決まる\n⟪(i) 意思外形対応型⟫——第三者が信頼した外観が、真の権利者が自ら作出しまたは承認した外観⟪そのもの⟫であるときは、権利者には虚偽表示者と同等の帰責性があるから、第三者は⟪善意⟫であれば足り、⟪無過失⟫であることを要しない（⟪94条2項の類推適用⟫）。\n⟪(ii) 意思外形非対応型⟫——第三者が信頼した外観が、真の権利者が承認した第一の外観をもとに⟪他人がこれを超えて作り出した第二の外観⟫であるときは、権利者の帰責性は前者ほど大きくないから、⦅第三者は⟪善意かつ無過失⟫であることを要する⦆⟨1⟩（⟪94条2項および110条の法意⟫）。\n⟪(iii) 外形与因型（権利者が不実の外観を認識していない場合）⟫——帰責性が同様に小さいから、⦅善意かつ無過失を要する⦆⟨2⟩（⟪94条2項および110条の類推適用⟫）。\n\n(5) 結論の効果\n以上の要件が充たされるとき、真の権利者は、登記名義人が⟪権利を取得していない⟫ことを当該第三者に対して⟪主張することができない⟫。","kata":"| # | 落としてはいけない要素 | ランクAでの扱い |\n|---|---|---|\n| 1 | **不動産登記に公信力がない**こと／**通謀・虚偽の意思表示がないから94条2項を直接適用できない**こと（94条1項） | **必須**（ここを飛ばすと、そもそも「類推」の話にならない） |\n| 2 | 94条2項の趣旨＝**権利外観法理**（虚偽の外観の作出につき帰責性のある者の犠牲において外観への信頼を保護する） | **必須** |\n| 3 | 類推の**3要件**＝①権利帰属を推定させる不実の外観の存在 ②通謀がなくとも外観の作出・存続について真の権利者に帰責性があること ③第三者の正当な信頼 | **必須**（3つ全部。番号を振って書けること） |\n| 4 | ②の中身＝**自ら作出**した場合／**他人が作出した外形を知りながら存続を明示または黙示に承認**した場合 | **必須**（「承認」という語まで） |\n| 5 | ②の下限＝認識がない場合も、**作出への積極的関与・あえて放置と同視し得るほど重い**帰責性があれば足りる | **必須** |\n| 6 | ③が**②の帰責性の程度に応じて変わる**という枠組み自体 | **必須**（この相関が言えないと型の判定ができない） |\n| 7 | **意思外形対応型＝善意で足りる／無過失は不要**（94条2項の類推適用） | **必須**（「無過失は不要」まで言えること） |\n| 8 | **意思外形非対応型＝善意無過失が必要**（94条2項および**110条の法意**） | **必須**（条文の引き方まで） |\n| 9 | **権利者に認識がない型＝善意無過失が必要**（94条2項および110条の**類推適用**） | **必須**（「法意」と「類推適用」を取り違えないこと） |\n| 10 | 効果＝真の権利者は**登記名義人が権利を取得していないことを第三者に主張できない** | 必須 |\n| 11 | 第三者に**登記は不要**／不実の登記につき**登記名義人の承諾（通謀）も不要** | **落としても4**（枝。設問で問われたら書く） |\n| 12 | 〔副〕一元化説の存在と決め手（結論は変わらず、変わるのは引く条文と説明の筋道） | **存在と決め手が言えれば可** |\n| 13 | 判例の年月日・百選番号・学説の帰属（平野説・潮見説など） | **不要**（答案に書かないので暗記対象外） |\n\n**勝負どころ**：\n1. **型の判定を先にやれるか。**「A が意思により認めた外形」と「第三者が信じた外形」を**別々に認定して並べる**のが出発点。ここが一致していれば善意で足り、ズレていれば善意無過失。**第三者の主観から書き始めると型判定が飛ぶ。**\n2. **「放置」を「承認」と言い切らないこと。**不実の登記の存在を知っていただけでは足りず、**不実の登記を前提とする行為を自ら行った**（設例1なら B 名義のままの抵当権設定）といった、承認と評価できる具体的事実を拾う。\n3. **条文の引き方を3通り書き分けられるか。**「94条2項の類推適用」／「94条2項・110条の**法意**」／「94条2項・110条の**類推適用**」。これは判例の文言なので、混ぜると読み手にすぐ分かる。\n\n> ⚠️ **間違えやすい点**\n> - **すべての型で「善意無過失」と書く**——意思外形対応型では**無過失は不要**。94条2項の直接適用と同じく善意で足りる（`民法の基礎１総則-佐久間毅` p.163）。逆に**すべての型で「善意」と書く**のも誤り。\n> - **「法意」と「類推適用」を取り違える**——非対応型（仮登記→本登記）が「**法意**」（昭43・10・17）、権利者に認識がない型が「**類推適用**」（平18・2・23）。**逆に書くと判例の理解を疑われる。**\n> - **不実の登記を知りながら放置していただけで「承認」と認定する**——`スタートアップ民法・民法総則` p.241 は、単なる放置の場合の処理は「**今後の課題**」とされていると述べる。判例が承認を認めた事案には、必ず不実の登記を前提とする権利者自身の行為がある。\n> - **「A はひどく不注意だったから帰責性あり」で済ませる**——平15・6・13 は、相当ひどい不注意があった事案で**保護を否定している**。不注意の程度だけでは決まらず、**他人に対外的な処分を可能にする地位を与えたか**を見る（`民法の基礎１総則-佐久間毅` p.167〜168）。\n> - **動産の事案で94条2項類推を持ち出す**——動産には占有の公信力があるので（192条）、94条2項を類推適用する必要はない。本論点は不動産で問題になる（`スタートアップ民法・民法総則` p.456 のコメント）。\n> - **錯誤の第三者保護を94条2項類推で書く**——現行法は**95条4項**で明文化されている（`法改正年表`）。","hanrei":[["最判昭和29・8・20（民集8巻8号1505頁）","**94条2項類推適用のリーディングケース**。A のために代理人 C が買い受けた建物を、相談のうえ売主から C へ直接移転登記した事案で、その移転登記が **A の意思に基づくもの（承認があった）ならば、A・C 間で虚偽表示がされた場合と異ならないから94条2項の類推適用が認められる**とし、承認の有無を確定させるため差し戻した","百選Ⅰ〔第9版〕p.20 解説2(1)・p.21 解説2、`民法の基礎１総則-佐久間毅` p.159。**百選リストに掲載なし**（2026-07-30 に年月日で grep 済み）"],["最判昭和41・3・18（⚠️ **民集の巻号頁はDBで確認できていない**。当初「民集20巻3号451頁」と書いていたが裏が取れず、2026-07-30 の査読で削除した。**答案で巻号頁を書かないこと**）","⚠️ **事案の説明が蔵書間で食い違っている。答案でこの判例の事案を語らないこと**（2026-07-30 査読で判明）。`アガルート\\総合講義-民法` p.39 は**意思外形対応型(i)「本人が積極的に関与するケース」**として「権利者Aが、**Bの承諾を得ずに**不実の登記を作出したところ、BがCに処分した場合」と説明する。他方、百選Ⅰ〔第9版〕p.20 解説2(1) からは建物の**保存登記**が真の権利者でない者の名義でされた事案と読める。**「承諾を得た／得ない」が正反対**で、判旨原文もDBに無い。型の分類（意思外形対応型）だけは2冊で一致しているので、そこまでにとどめる。保存登記には権利変動に向けられた意思表示の外形がおよそ現れないため、**登記どおりに権利が帰属しているという外形への信頼それ自体**が端的に保護される場面であることがはっきり出る","百選Ⅰ〔第9版〕p.20 解説2(1)。`スタートアップ民法・民法総則` p.241 の傍注は、**外形自己作出型**の例としてこの判例を挙げる。**民法百選リストに掲載なし**（同日付で民事訴訟法百選〔第5版〕21番「給付の訴え——登記請求訴訟」がヒットするが**別事件**。2026-07-30 に grep 済み）"],["最判昭和45・4・16（民集24巻4号266頁）","他人が作出した不実の登記を真の権利者が**事後に承認**した場合に類推適用を認めた（昭45・9・22 が引用）。固定資産課税台帳上の所有者の記録を類推適用の基礎となる外形と認めた判例としても引かれる","百選Ⅰ〔第9版〕p.20 解説2(2)・判旨中の引用、`民法の基礎１総則-佐久間毅` p.161。**百選リストに掲載なし**（2026-07-30 に grep 済み）"],["最判昭和45・7・24（民集24巻7号1116頁）","他人に無断でその者を名義人とする**不実の登記を真の権利者が作出**した場合にも類推適用を認めた。**不実の登記について登記名義人の承諾（通謀）は不要**","百選Ⅰ〔第9版〕p.20 解説2(2)、`民法の基礎１総則-佐久間毅` p.162。**百選リストに掲載なし**（2026-07-30 に grep 済み）"],["**最判昭和45・9・22**（民集24巻10号1424頁）","「不実の所有権移転登記の経由が所有者の不知の間に他人の専断によってされた場合でも、**所有者が右不実の登記のされていることを知りながら、これを存続せしめることを明示または黙示に承認していたときは、右94条2項を類推適用**し…登記名義人が所有権を取得していないことをもって〔**善意の第三者に**〕対抗することをえない」。理由＝**承認が登記経由の事前に与えられたか事後に与えられたかによって、外形に信頼した第三者の保護に差等を設けるべき理由はない**","民法判例百選Ⅰ**〔第9版〕20番（＝〔第8版〕21番・〔第7版〕21番）**「民法94条2項の類推適用」（**第9版・第8版の解説者はいずれも野々上敬介**——リストの解説者欄で確認。第7版の節には解説者欄がないため未確認だが、第9版解説の参考文献欄が「磯村保・本百選Ⅰ〈第7版〉44頁」を挙げており、`[カニの推論]` **第7版の解説者は磯村保**と思われる〔DB裏付けなし〕）。`スタートアップ民法・民法総則` p.242 は判例シリーズ4事件としても収録。**承認の認定で決定的だったのは「B 名義のままで根抵当権設定登記を経由した」点**（横山長・最判解民事篇昭和45年度(下)671頁参照）"],["最判昭和43・10・17（民集22巻10号2188頁）","**意思外形非対応型**。「外観上の仮登記義務者は、その本登記の無効をもって**善意無過失**の第三者に対抗できない…けだし、仮登記の外観を仮装した者がその外観に基づいてされた本登記を信頼した善意無過失の第三者に対して、責に任ずべきことは、**民法94条2項、同法110条の法意に照らし、外観尊重および取引保護の要請**というべきだからである」","`短答\\体系別短答過去問題集　民法(上)総則・物権[第３版]` p.92（判示の引用）、百選Ⅰ〔第9版〕p.20 解説4・p.21 解説2、`民法の基礎１総則-佐久間毅` p.163、`スタートアップ民法・民法総則` p.242、`アガルート\\総合講義-民法` p.39。**百選リストに掲載なし**（2026-07-30 に grep 済み）"],["最判昭和47・11・28（民集26巻9号1715頁）","**意思外形非対応型**。「94条2項、110条の**法意に照らして**」第三者が**善意無過失**の場合に保護を認めた","`伊藤塾\\新・伊藤塾試験対策問題集 論文1 民法` p.43（「この類型に関する判例」として挙げ、判示の言い回しを引く）、`民法の基礎１総則-佐久間毅` p.163（法意併用型の判例として昭43・10・17・昭45・6・2 と並べて列挙）。**2冊で一致**。**百選リストに掲載なし**（2026-07-30 に grep 済み）"],["最判昭和45・6・2（民集24巻6号465頁）","**意思外形非対応型**（94条2項と110条の法意併用型の判例として列挙されているもの）","`民法の基礎１総則-佐久間毅` p.163。**判示の中身はDBで確認できていない**ので、答案で内容を語らないこと。**百選リストに掲載なし**（2026-07-30 に grep 済み）"],["最判昭和45・11・19（民集24巻12号1916頁）","依頼した登記とは別の内容の登記が司法書士によってされた事案で、本件登記は「**A の意思に基づくものというべきであ**」り、前掲昭43・10・17 の「**趣旨からみて**」善意無過失の第三者を保護すべきとした","`民法の基礎１総則-佐久間毅` p.168。同書は**94条2項と110条の法意を併用したものとみる立場が有力**とする。**百選リストに掲載なし**（2026-07-30 に grep 済み）"],["最判平成15・6・13（判時1831号99頁）","騙されて登記済証・白紙委任状・印鑑証明書を交付し、後に補充された委任状の写しを受け取っても深く考えずやり過ごしていた事案で、**権利者は不実の外形の作出につき何ら積極的な関与をしておらず、登記を放置していたとみることもできない**として、94条2項および110条の法意に照らしても対抗できないとする事情はないとし、**権利者の請求を認めた（第三者は保護されなかった）**","`民法の基礎１総則-佐久間毅` p.167。**帰責性の下限を示す対照判例**。**百選リストに掲載なし**（2026-07-30 に grep 済み）"],["**最判平成18・2・23**（民集60巻2号546頁）","権利者が**不実の登記の存在を知らなかった**事案で、「本件登記手続をすることができたのは、上記のような X の**余りにも不注意な行為**によるものであり、…X の帰責性の程度は、**自ら外観の作出に積極的に関与した場合やこれを知りながらあえて放置した場合と同視し得るほど重いもの**というべきである」として、**善意無過失**の第三者を「**民法94条2項、110条の類推適用により**」保護した","民法判例百選Ⅰ**〔第9版〕21番（＝〔第8版〕22番・〔第7版〕22番）**「民法94条2項・110条の類推適用」（解説は各版とも**佐久間毅**）。⚠️ **版によって番号が動く判例なので注意**——〔第9版〕**21**番／〔第7版〕〔第8版〕**22**番（2026-07-30 に年月日で grep し、3つの節すべてで突き合わせて確認）。なお `短答\\体系別短答過去問題集　民法(上)総則・物権[第３版]` p.92 が付す「百選[第9版]〔21〕」は**正しい**（当初この論証は `論証作成キュー.md` の表を信じて「短答本の表記は誤り」と書いていたが、**キューの表のほうが版を取り違えていた**。2026-07-30 に親カニがリストを引いて撤回・キュー側も訂正済み）。**第9版の22番は最判平28・1・12（動機の錯誤）。**`スタートアップ民法・民法総則` p.242〜243 は**外形与因型**と呼び、`アガルート\\総合講義-民法` p.39 は**意思外形非対応型(ii)**に分類する（本によって類型名が違う）"]],"field":"意思表示（錯誤・詐欺）","order":3},{"name":"仮登記担保_私的実行と後順位担保権者","subject":"民法","rank":"A","path":"まとめ/民法/論証/仮登記担保_私的実行と後順位担保権者.md","cards":[{"id":"民法/仮登記担保_私的実行と後順位担保権者#1","block":"第1","kind":"cloze","masked":"仮登記担保とは、金銭債権の担保として、債務不履行があれば債務者等の所有する土地等をもって⟦ア⟧等をし、その権利を保全するため⟦イ⟧を経ておく担保方法をいう。仮登記担保契約に関する法律（仮登記担保法）が規律する。","body":"仮登記担保とは、金銭債権の担保として、債務不履行があれば債務者等の所有する土地等をもって⟪代物弁済する旨の予約⟫等をし、その権利を保全するため⟪所有権移転請求権保全の仮登記⟫を経ておく担保方法をいう。仮登記担保契約に関する法律（仮登記担保法）が規律する。","answers":["代物弁済する旨の予約","所有権移転請求権保全の仮登記"],"check":"","notes":[],"law":"","cites":[],"rate":0,"designed":true,"ref":true,"hash":"5eecebfed072"},{"id":"民法/仮登記担保_私的実行と後順位担保権者#2","block":"第2","kind":"cloze","masked":"私的実行は、次の手順による。\n(1) 債権者は、設定者に対し、⟦ア⟧（清算金がないと認めるときはその旨）を通知する。通知には、清算期間経過時における土地等の見積価額と債権等の額を明らかにしなければならない。\n(2) 通知が到達した日から⟦イ⟧が経過してはじめて、土地等の所有権が債権者に移転し、被担保債権が消滅する。土地等の価額が債権額に満たないときは、⟦ウ⟧でのみ債権が消滅する。\n(3) 清算期間経過時の土地等の価額が債権等の額を超えるときは、債権者はその⟦エ⟧を清算金として支払わなければならず、この清算金支払債務は、設定者の負う本登記・引渡しの債務と⟦オ⟧の関係に立つ。これに反する設定者に不利な特約は無効である。\n(4) 債権者は、通知した見積額より清算金が少なかったと⟦カ⟧。","body":"私的実行は、次の手順による。\n(1) 債権者は、設定者に対し、⟪清算金の見積額⟫（清算金がないと認めるときはその旨）を通知する。通知には、清算期間経過時における土地等の見積価額と債権等の額を明らかにしなければならない。\n(2) 通知が到達した日から⟪2か月の清算期間⟫が経過してはじめて、土地等の所有権が債権者に移転し、被担保債権が消滅する。土地等の価額が債権額に満たないときは、⟪その価額の限度⟫でのみ債権が消滅する。\n(3) 清算期間経過時の土地等の価額が債権等の額を超えるときは、債権者はその⟪超過額⟫を清算金として支払わなければならず、この清算金支払債務は、設定者の負う本登記・引渡しの債務と⟪同時履行⟫の関係に立つ。これに反する設定者に不利な特約は無効である。\n(4) 債権者は、通知した見積額より清算金が少なかったと⟪主張することはできない⟫。","answers":["清算金の見積額","2か月の清算期間","その価額の限度","超過額","同時履行","主張することはできない"],"check":"","notes":[],"law":"仮登記担保法2条1項2項・3条1項2項3項（清算金見積額の通知・2か月の清算期間・清算金と同時履行・不利な特約の無効）","cites":[],"rate":0,"designed":true,"ref":false,"hash":"6ef0c58ddc98"},{"id":"民法/仮登記担保_私的実行と後順位担保権者#3","block":"第3","kind":"cloze","masked":"清算期間が経過した後であっても、設定者は、⟦ア⟧は、⟦イ⟧を提供して土地等の所有権の受戻しを請求することができる。担保である以上、実行が完了するまでは目的物を取り戻す機会を保障すべきだからである。\nただし、⟦ウ⟧が経過したとき、または⟦エ⟧したときは、受戻しはできない。","body":"清算期間が経過した後であっても、設定者は、⟪清算金の支払を現実に受けるまで⟫は、⟪債権等の額に相当する金銭⟫を提供して土地等の所有権の受戻しを請求することができる。担保である以上、実行が完了するまでは目的物を取り戻す機会を保障すべきだからである。\nただし、⟪清算期間の経過時から5年⟫が経過したとき、または⟪第三者が所有権を取得⟫したときは、受戻しはできない。","answers":["清算金の支払を現実に受けるまで","債権等の額に相当する金銭","清算期間の経過時から5年","第三者が所有権を取得"],"check":"","notes":[],"law":"仮登記担保法11条本文・ただし書（受戻権と、5年の経過・第三者の所有権取得という限界）","cites":[],"rate":0,"designed":true,"ref":false,"hash":"34874e9e68cf"},{"id":"民法/仮登記担保_私的実行と後順位担保権者#4","block":"第4","kind":"cloze","masked":"後順位の担保権者は、その順位に従い、設定者が支払を受けるべき清算金に対して⟦ア⟧を行使することができ、そのためには⟦イ⟧なければならない。\nその行使を確保するため、債権者は後順位担保権者に対しても実行開始と清算金見積額を通知しなければならず、清算期間中の清算金支払請求権の処分は⟦ウ⟧とされ、清算期間経過前の弁済および通知を欠く弁済は⟦エ⟧。","body":"後順位の担保権者は、その順位に従い、設定者が支払を受けるべき清算金に対して⟪物上代位権⟫を行使することができ、そのためには⟪清算金の払渡し前に差し押さえ⟫なければならない。\nその行使を確保するため、債権者は後順位担保権者に対しても実行開始と清算金見積額を通知しなければならず、清算期間中の清算金支払請求権の処分は⟪無効⟫とされ、清算期間経過前の弁済および通知を欠く弁済は⟪後順位担保権者に対抗できない⟫。","answers":["物上代位権","清算金の払渡し前に差し押さえ","無効","後順位担保権者に対抗できない"],"check":"","notes":[],"law":"仮登記担保法4条1項（後順位担保権者の物上代位・払渡し前の差押え）・5条（実行通知）・6条1項2項（清算期間中の処分の無効・弁済の対抗不能）","cites":[],"rate":0,"designed":true,"ref":false,"hash":"ea726ba8afcf"},{"id":"民法/仮登記担保_私的実行と後順位担保権者#5","block":"第5","kind":"cloze","masked":"私的実行が開始した後でも競売の申立ては妨げられず、競売の申立てが⟪清算金の支払前⟫（清算金がないときは清算期間の経過前）にされ、それに基づいて競売開始決定があったときは、私的実行は中止され、⟦ア⟧する（⟦イ⟧）。\nこの場合、担保仮登記に係る権利は⟦ウ⟧、債権者は⟦エ⟧を基準とする順位で優先弁済を受けるにとどまる。","body":"私的実行が開始した後でも競売の申立ては妨げられず、競売の申立てが⟪清算金の支払前⟫（清算金がないときは清算期間の経過前）にされ、それに基づいて競売開始決定があったときは、私的実行は中止され、⟪競売手続が優先⟫する（⟪先着手主義⟫）。\nこの場合、担保仮登記に係る権利は⟪抵当権とみなされ⟫、債権者は⟪担保仮登記のされた時⟫を基準とする順位で優先弁済を受けるにとどまる。","answers":["競売手続が優先","先着手主義","抵当権とみなされ","担保仮登記のされた時"],"check":"","notes":[],"law":"仮登記担保法15条1項（競売の申立てによる私的実行の中止）・13条1項（担保仮登記を抵当権とみなし、その順位で優先弁済）","cites":[],"rate":0,"designed":true,"ref":false,"hash":"94db3654b828"}],"setsurei":["Gは、Sに対する2,000万円の貸金債権を担保するため、S所有の甲土地について、債務不履行があればこれをもって代物弁済する旨の予約をし、所有権移転請求権保全の仮登記を経由した。その後、SはHのために甲土地に800万円の被担保債権額の抵当権を設定し、その登記も経由された。 Sが弁済期に弁済しなかったので、Gは予約完結の意思表示をし、Sに対し「清算期間経過時の甲土地の見積価額3,000万円、債権等の額2,000万円、清算金の見積額1,000万円」と通知した。通知は4月1日にSに到達した。 (1) 甲土地の所有権はいつGに移り、Sは何を請求できるか。 (2) Sは甲土地を取り戻せるか。取り戻せるとして、いくら支払う必要があるか。 (3) Hはどのようにして自らの債権を回収するか。","設例1と同じ事実関係のもとで、次の各場合はどうなるか。 (1) 清算期間経過時の甲土地の価額が**1,500万円**であった場合（債権等の額2,000万円を下回る場合）、Gの債権はどうなるか。Sは甲土地を受け戻せるか。 (2) Gの通知の到達後、清算金が支払われる前に、**HがGに先んじて甲土地の競売を申し立て、競売開始決定があった**場合、G・Hの優劣はどうなるか。 (3) 甲土地上にS所有の乙建物が建っていた場合、Sは乙建物のために甲土地を使用しうる権原を有するか。"],"full":"仮登記担保とは、金銭債権の担保として、債務不履行があれば債務者等の所有する土地等をもって⟪代物弁済する旨の予約⟫等をし、その権利を保全するため⟪所有権移転請求権保全の仮登記⟫を経ておく担保方法をいう。仮登記担保契約に関する法律（仮登記担保法）が規律する。\n\n私的実行は、次の手順による。\n(1) 債権者は、設定者に対し、⟪清算金の見積額⟫（清算金がないと認めるときはその旨）を通知する。通知には、清算期間経過時における土地等の見積価額と債権等の額を明らかにしなければならない。\n(2) 通知が到達した日から⟪2か月の清算期間⟫が経過してはじめて、土地等の所有権が債権者に移転し、被担保債権が消滅する。土地等の価額が債権額に満たないときは、⟪その価額の限度⟫でのみ債権が消滅する。\n(3) 清算期間経過時の土地等の価額が債権等の額を超えるときは、債権者はその⟪超過額⟫を清算金として支払わなければならず、この清算金支払債務は、設定者の負う本登記・引渡しの債務と⟪同時履行⟫の関係に立つ。これに反する設定者に不利な特約は無効である。\n(4) 債権者は、通知した見積額より清算金が少なかったと⟪主張することはできない⟫。\n\n清算期間が経過した後であっても、設定者は、⟪清算金の支払を現実に受けるまで⟫は、⟪債権等の額に相当する金銭⟫を提供して土地等の所有権の受戻しを請求することができる。担保である以上、実行が完了するまでは目的物を取り戻す機会を保障すべきだからである。\nただし、⟪清算期間の経過時から5年⟫が経過したとき、または⟪第三者が所有権を取得⟫したときは、受戻しはできない。\n\n後順位の担保権者は、その順位に従い、設定者が支払を受けるべき清算金に対して⟪物上代位権⟫を行使することができ、そのためには⟪清算金の払渡し前に差し押さえ⟫なければならない。\nその行使を確保するため、債権者は後順位担保権者に対しても実行開始と清算金見積額を通知しなければならず、清算期間中の清算金支払請求権の処分は⟪無効⟫とされ、清算期間経過前の弁済および通知を欠く弁済は⟪後順位担保権者に対抗できない⟫。\n\n私的実行が開始した後でも競売の申立ては妨げられず、競売の申立てが⟪清算金の支払前⟫（清算金がないときは清算期間の経過前）にされ、それに基づいて競売開始決定があったときは、私的実行は中止され、⟪競売手続が優先⟫する（⟪先着手主義⟫）。\nこの場合、担保仮登記に係る権利は⟪抵当権とみなされ⟫、債権者は⟪担保仮登記のされた時⟫を基準とする順位で優先弁済を受けるにとどまる。","kata":"| # | 落としてはいけない要素 |\n|---|---|\n| 1 | 被担保債権は**金銭債権**に限る |\n| 2 | 実行(1)＝**清算金見積額の通知**（見積価額と債権等の額を明示） |\n| 3 | 実行(2)＝通知到達から**2か月の清算期間**の経過ではじめて所有権移転・債権消滅 |\n| 4 | 価額が債権額に満たないときは**その価額の限度でのみ**債権消滅 |\n| 5 | 実行(3)＝**清算金支払義務**／本登記・引渡債務と**同時履行**／不利な特約は無効 |\n| 6 | 債権者は**見積額より低いと主張できない** |\n| 7 | 受戻権＝**清算金の現実の支払を受けるまで**「債権等の額に相当する金銭」の提供で受戻し |\n| 8 | 受戻しの限界＝**5年**の経過／**第三者の所有権取得**（本登記を経由した者） |\n| 9 | 後順位担保権者＝**清算金への物上代位（払渡し前の差押えが必要）** |\n| 10 | 競売が申し立てられれば**私的実行は中止**され、仮登記担保権は**抵当権とみなされる** |\n| 11 | 順位の基準は**担保仮登記のされた時** |\n\n**勝負どころ**：\n1. **数字（2か月・5年）と「清算金の支払を受けるまで」という受戻しの基準時。**手続法的な論点なので、数字と基準時を落とすと点が入らない。\n2. **受戻権の有無が「清算金が生じるか」で決まることを言えるか。**清算金がない場合は実行手続が終了しており受戻権はない（設例2(1)）。「常に受戻せる」と書くと誤り。\n3. **後順位担保権者の2つの道（物上代位／競売）を切り分けられるか。**そのうえで、見積額の拘束（8条2項）が物上代位側の弱点であることまで書けると差がつく。\n\n> ⚠️ **間違えやすい点**\n> - **受戻しに払うのは「清算金」ではなく「債権等の額に相当する金銭」。**清算期間経過で債権はすでに消滅しているので、条文はこの持って回った言い方をしている。「清算金を返す」と書くと逆。\n> - **清算金がない場合には受戻権は生じない。**実行手続はそこで終了しているから（`講義` p.460）。「常に受戻せる」と書かない。\n> - **仮登記担保権者は自分から競売を申し立てられない**（`講義` p.462 注13）。「抵当権とみなされるから競売申立てもできる」と書かない。\n> - **競売手続で権利を届け出ないと仮登記担保権は消滅する**（同16条1項）。「抵当権とみなされるから自動的に配当を受けられる」と書かない。\n> - **法定借地権（仮登記担保10条）が生じるのは「土地」に担保仮登記がされたとき。**建物に設定された場合は含まれない。**388条の法定地上権とは別物**で、生じるのは**地上権ではなく賃貸借**。\n> - **後順位担保権者の物上代位には払渡し前の差押えが必要**（4条1項）。抵当権の物上代位（304条1項ただし書）と同じ構造だが、条文は仮登記担保法4条1項。\n> - **私的実行の中止の分水嶺は「競売の申立て」が清算金支払前にされたか**であって、「競売開始決定」が清算金支払前にあったかではない（15条1項。申立てが期限内でも開始決定が遅れる事案で結論を誤る）。\n\n---","hanrei":[["最判昭和42・11・16 民集21巻9号2430頁","権利移転型の担保について、はじめて担保権者の**清算義務**を明言したリーディング・ケース","`講義` p.454 注1"],["最大判昭和49・10・23 民集28巻7号1473頁","仮登記担保法制定前の判例法理の集大成","`講義` p.453。仮登記担保法（昭和53年）はこれを立法化したもの"],["最判昭和58・3・31 民集37巻2号152頁","仮登記担保の設定者は、清算金支払請求権について目的土地等に**留置権**を主張でき、その後の第三取得者にも対抗できる","`講義` p.458 注6・p.459"]],"field":"非典型担保","order":24},{"name":"債務引受_470条〜472条の4","subject":"民法","rank":"A","path":"まとめ/民法/論証/債務引受_470条〜472条の4.md","cards":[{"id":"民法/債務引受_470条〜472条の4#1","block":"第1〔総論と区別〕","kind":"cloze","masked":"債務引受とは、契約により、債務者の債務と同一内容の債務を、引受人が債権者に対して負担することをいう。債務者が当該債務を免れるものを⟦ア⟧といい（⟦イ⟧）、債務者が離脱せず引受人と併存して債務を負うものを⟦ウ⟧という（⟦エ⟧）。\nいずれにあたるかは、⟦オ⟧があるかによって決まると解する。契約書の名称は決め手とならない。\nなお、引受人が債権者に対しては債務を負わず、債務者に対して債務者の債務を履行する義務のみを負う場合は、⟦カ⟧にとどまり、債権者は引受人に履行を請求できない。","body":"債務引受とは、契約により、債務者の債務と同一内容の債務を、引受人が債権者に対して負担することをいう。債務者が当該債務を免れるものを⟪免責的債務引受⟫といい（⟪472条1項⟫）、債務者が離脱せず引受人と併存して債務を負うものを⟪併存的債務引受⟫という（⟪470条1項⟫）。\nいずれにあたるかは、⟪債務から免責させる合意⟫があるかによって決まると解する。契約書の名称は決め手とならない。\nなお、引受人が債権者に対しては債務を負わず、債務者に対して債務者の債務を履行する義務のみを負う場合は、⟪履行引受⟫にとどまり、債権者は引受人に履行を請求できない。","answers":["免責的債務引受","472条1項","併存的債務引受","470条1項","債務から免責させる合意","履行引受"],"check":"","notes":[],"law":"","cites":["民法/472","民法/470"],"rate":15,"designed":true,"ref":false,"hash":"c4ea4a3e82b5"},{"id":"民法/債務引受_470条〜472条の4#2","block":"第2〔併存的債務引受の成立〕","kind":"cloze","masked":"併存的債務引受は、三者の契約によるほか、次の二つの方法ですることができる。\n(1) ⟪債権者と引受人となる者との契約⟫によってすることができる（⟦ア⟧）。この場合、⟦イ⟧。併存的債務引受は機能的に保証に類似する信用補完であり、保証も主たる債務者の意思に反してすることができる（⟦ウ⟧参照）からである。\n(2) ⟪債務者と引受人となる者との契約⟫によってもすることができるが、この場合は、⟦エ⟧をした時にその効力を生ずる（⟦オ⟧）。この契約は⟦カ⟧であり（同条4項）、債権者の承諾は受益の意思表示（537条3項）に相当する⟦キ⟧であって、債務引受の事実を債権者に対抗するための対抗要件ではない。\n債務引受の効果を第三者に対抗するために対抗要件は要しない。","body":"併存的債務引受は、三者の契約によるほか、次の二つの方法ですることができる。\n(1) ⟪債権者と引受人となる者との契約⟫によってすることができる（⟪470条2項⟫）。この場合、⟪債務者の意思に反してもよい⟫。併存的債務引受は機能的に保証に類似する信用補完であり、保証も主たる債務者の意思に反してすることができる（⟪462条2項⟫参照）からである。\n(2) ⟪債務者と引受人となる者との契約⟫によってもすることができるが、この場合は、⟪債権者が引受人となる者に対して承諾⟫をした時にその効力を生ずる（⟪470条3項⟫）。この契約は⟪第三者のためにする契約⟫であり（同条4項）、債権者の承諾は受益の意思表示（537条3項）に相当する⟪効力発生要件⟫であって、債務引受の事実を債権者に対抗するための対抗要件ではない。\n債務引受の効果を第三者に対抗するために対抗要件は要しない。","answers":["470条2項","債務者の意思に反してもよい","462条2項","債権者が引受人となる者に対して承諾","470条3項","第三者のためにする契約","効力発生要件"],"check":"","notes":[],"law":"","cites":["民法/470","民法/462","民法/537"],"rate":27,"designed":true,"ref":false,"hash":"e6f36bca35e7"},{"id":"民法/債務引受_470条〜472条の4#3","block":"第3〔併存的債務引受の効果〕","kind":"cloze","masked":"引受人は、債務者と連帯して、債務者が債権者に対して負担する債務と同一の内容の債務を負担する（470条1項）。すなわち両者は⟦ア⟧の関係に立ち、次の帰結が導かれる。\n(1) 影響関係は⟦イ⟧が原則である（⟦ウ⟧）。したがって債務者の債務について消滅時効が完成しても、引受人の債務は影響を受けず、債権者は引受人に全額を請求できる。\n(2) 弁済をした引受人は、負担部分に応じて債務者に求償することができる（⟦エ⟧）。\n(3) 引受人は、⟪効力が生じた時⟫に債務者が主張することができた抗弁をもって債権者に対抗することができる（⟦オ⟧）。引受人の債務は債務者の債務と同一だからである。\n(4) 引受人は債務発生原因である契約の取消権・解除権を行使することはできないが、債務者がこれらを有するときは、⟪債務を免れるべき限度⟫において、債権者に対して債務の履行を拒むことができる（⟦カ⟧）。債務者が相殺権を有するときも、⟦キ⟧で履行を拒むことができる（470条1項・⟦ク⟧）。","body":"引受人は、債務者と連帯して、債務者が債権者に対して負担する債務と同一の内容の債務を負担する（470条1項）。すなわち両者は⟪連帯債務⟫の関係に立ち、次の帰結が導かれる。\n(1) 影響関係は⟪相対効⟫が原則である（⟪441条本文⟫）。したがって債務者の債務について消滅時効が完成しても、引受人の債務は影響を受けず、債権者は引受人に全額を請求できる。\n(2) 弁済をした引受人は、負担部分に応じて債務者に求償することができる（⟪442条1項⟫）。\n(3) 引受人は、⟪効力が生じた時⟫に債務者が主張することができた抗弁をもって債権者に対抗することができる（⟪471条1項⟫）。引受人の債務は債務者の債務と同一だからである。\n(4) 引受人は債務発生原因である契約の取消権・解除権を行使することはできないが、債務者がこれらを有するときは、⟪債務を免れるべき限度⟫において、債権者に対して債務の履行を拒むことができる（⟪471条2項⟫）。債務者が相殺権を有するときも、⟪その負担部分の限度⟫で履行を拒むことができる（470条1項・⟪439条2項⟫）。","answers":["連帯債務","相対効","441条本文","442条1項","471条1項","471条2項","その負担部分の限度","439条2項"],"check":"","notes":[],"law":"","cites":["民法/470","民法/441","民法/442","民法/471","民法/439"],"rate":31,"designed":true,"ref":false,"hash":"579c73172a62"},{"id":"民法/債務引受_470条〜472条の4#4","block":"第4〔免責的債務引受の成立〕","kind":"cloze","masked":"免責的債務引受の引受人は、債務者が債権者に対して負担する債務と同一の内容の債務を負担し、債務者は自己の債務を免れる（472条1項）。三者の契約によるほか、次の二つの方法ですることができる。\n(1) ⟪債権者と引受人となる者との契約⟫によってすることができるが、この場合は、⟦ア⟧その契約をした旨を⟦イ⟧した時にその効力を生ずる（⟦ウ⟧）。\n(2) ⟪債務者と引受人となる者が契約⟫をし、⟦エ⟧をすることによってもすることができる（⟦オ⟧）。\n債務者の交替により債務の引当てとなる⟦カ⟧が変わるから、債権者の関与のないまま効力を生じさせることは認められない。他方、(1)で要求されるのは債務者の⟦キ⟧である。債務者はこれによって⟦ク⟧であるから、その意思に反してもさしつかえないからである。","body":"免責的債務引受の引受人は、債務者が債権者に対して負担する債務と同一の内容の債務を負担し、債務者は自己の債務を免れる（472条1項）。三者の契約によるほか、次の二つの方法ですることができる。\n(1) ⟪債権者と引受人となる者との契約⟫によってすることができるが、この場合は、⟪債権者が債務者に対して⟫その契約をした旨を⟪通知⟫した時にその効力を生ずる（⟪472条2項⟫）。\n(2) ⟪債務者と引受人となる者が契約⟫をし、⟪債権者が引受人となる者に対して承諾⟫をすることによってもすることができる（⟪472条3項⟫）。\n債務者の交替により債務の引当てとなる⟪責任財産⟫が変わるから、債権者の関与のないまま効力を生じさせることは認められない。他方、(1)で要求されるのは債務者の⟪同意ではなく通知⟫である。債務者はこれによって⟪利益を受けるだけ⟫であるから、その意思に反してもさしつかえないからである。","answers":["債権者が債務者に対して","通知","472条2項","債権者が引受人となる者に対して承諾","472条3項","責任財産","同意ではなく通知","利益を受けるだけ"],"check":"","notes":[],"law":"","cites":["民法/472"],"rate":34,"designed":true,"ref":false,"hash":"a82684c76ce5"},{"id":"民法/債務引受_470条〜472条の4#5","block":"第5〔免責的債務引受の効果——抗弁と求償〕","kind":"cloze","masked":"(1) ⟪抗弁⟫　引受人は、免責的債務引受の効力が生じた時に債務者が主張することができた抗弁をもって債権者に対抗することができる（⟦ア⟧）。取消権・解除権自体は行使できないが、債務者がこれらを有するときは、⟪免責的債務引受がなければ⟫その行使によって債務者がその債務を免れることができた限度において、履行を拒むことができる（同条2項）。これに対し、債務者の有する⟦イ⟧については、⟦ウ⟧（併存的債務引受と異なる点である）。債務者は完全に免責され、その相殺権は引受人の債務の帰趨に影響しないうえ、⟦エ⟧となるからである。\n(2) ⟪求償⟫　引受人は、債務者に対して⟦オ⟧（⟦カ⟧）。引受人は他人の債務を自己の債務として引き受け、自己の債務として履行するのであって、⟦キ⟧を欠くからである。もっとも同条は⟦ク⟧であり、別途の合意があれば請求できる。","body":"(1) ⟪抗弁⟫　引受人は、免責的債務引受の効力が生じた時に債務者が主張することができた抗弁をもって債権者に対抗することができる（⟪472条の2第1項⟫）。取消権・解除権自体は行使できないが、債務者がこれらを有するときは、⟪免責的債務引受がなければ⟫その行使によって債務者がその債務を免れることができた限度において、履行を拒むことができる（同条2項）。これに対し、債務者の有する⟪相殺権⟫については、⟪その援用も履行の拒絶もできない⟫（併存的債務引受と異なる点である）。債務者は完全に免責され、その相殺権は引受人の債務の帰趨に影響しないうえ、⟪他人の権利の処分⟫となるからである。\n(2) ⟪求償⟫　引受人は、債務者に対して⟪求償権を取得しない⟫（⟪472条の3⟫）。引受人は他人の債務を自己の債務として引き受け、自己の債務として履行するのであって、⟪求償関係を生じさせる基礎⟫を欠くからである。もっとも同条は⟪任意規定⟫であり、別途の合意があれば請求できる。","answers":["472条の2第1項","相殺権","その援用も履行の拒絶もできない","他人の権利の処分","求償権を取得しない","472条の3","求償関係を生じさせる基礎","任意規定"],"check":"","notes":[],"law":"","cites":["民法/472の2","民法/472の3"],"rate":27,"designed":true,"ref":false,"hash":"d67f68faa3cb"},{"id":"民法/債務引受_470条〜472条の4#6","block":"第6〔担保の移転（472条の4）〕","kind":"cloze","masked":"債権者は、債務者が免れる債務の担保として設定された担保権を引受人が負担する債務に移すことができる（⟦ア⟧）。ただし、⟦イ⟧（⟦ウ⟧）がこれを設定したときは、⟦エ⟧を得なければならない（同項ただし書）。\nまた、移転は⟦オ⟧、引受人に対してする⟪意思表示⟫によってしなければならない（同条2項）。担保権の消滅における⟦カ⟧との抵触を避ける趣旨である。\n保証をした者があるときも同様であり（同条3項）、この場合の保証人の承諾は、⟦キ⟧によらなければ効力を生じない（同条4項。⟦ク⟧による承諾は書面によるものとみなす。同条5項）。承諾が得られなければ、担保・保証は旧債務の消滅に伴って消滅する。","body":"債権者は、債務者が免れる債務の担保として設定された担保権を引受人が負担する債務に移すことができる（⟪472条の4第1項本文⟫）。ただし、⟪引受人以外の者⟫（⟪債務者も含む⟫）がこれを設定したときは、⟪その者の承諾⟫を得なければならない（同項ただし書）。\nまた、移転は⟪あらかじめ又は同時に⟫、引受人に対してする⟪意思表示⟫によってしなければならない（同条2項）。担保権の消滅における⟪付従性⟫との抵触を避ける趣旨である。\n保証をした者があるときも同様であり（同条3項）、この場合の保証人の承諾は、⟪書面⟫によらなければ効力を生じない（同条4項。⟪電磁的記録⟫による承諾は書面によるものとみなす。同条5項）。承諾が得られなければ、担保・保証は旧債務の消滅に伴って消滅する。","answers":["472条の4第1項本文","引受人以外の者","債務者も含む","その者の承諾","あらかじめ又は同時に","付従性","書面","電磁的記録"],"check":"","notes":[],"law":"","cites":["民法/472の4"],"rate":32,"designed":true,"ref":false,"hash":"d0ec6ec147ae"}],"setsurei":["AはBに甲土地を売り、500万円の代金債権を有している。Bは甲土地をさらにCに売り、Cは、Bに代金を支払うかわりに、BのAに対する代金債務を引き受けようとしている。なお、Cはまだ甲土地の引渡しを受けていない。 (1) CがBとともにAに対して債務を負うためには、誰と誰が契約することが必要か。このような引受けが行われたとして、Cは、甲土地の引渡しをまだ受けていないことを理由にAからの履行請求を拒むことができるか。また、引受けの後に、BのAに対する債務について消滅時効が完成したとき、CのAに対する債務はどうなるか。 (2) CがBのかわりにAに対して債務を負い、BがAに対する債務を免れるようにするためには、誰と誰が契約することが必要か。このような引受けが行われたとして、Cは、甲土地の引渡しをまだ受けていないことを理由にAからの履行請求を拒むことができるか。また、引受けの前に、BのAに対する債務についてDが保証していたとき、Dは引受け後のCのAに対する債務を保証するか。","Gは、Sに対して1000万円を貸し付けている。この債権を担保するために、**S所有の甲土地**と**D所有の乙土地**に抵当権が設定されており、さらに**Bが連帯保証人**となっている。 (1) SはYとの間で、この借入金債務をYが引き受けてSは債務から解放される旨を合意した。**GはYに対し、これを承諾する旨を伝えた。**この免責的債務引受はいつ効力を生ずるか。（⚠️ **承諾を誰に対してしたかを必ず読むこと。**472条3項の承諾は「**引受人となる者に対して**」しなければ効力を生じない。設問が「SがGの承諾を得た」とだけ書いている場合は、**承諾の相手方がYでなければ効力を生じない**ことを論点として拾う。） (2) Gが、甲土地の抵当権・乙土地の抵当権・Bの連帯保証を、いずれもYの債務の担保として維持するためには、それぞれ何が必要か。 (3) これに対し、**GとYが合意して**Sの債務をYが引き受けSを債務から解放することにした場合、(1)(2) の答えはどう変わるか。 (4) 甲土地に設定されていたのが**根抵当権で、元本の確定前**だった場合はどうか。"],"full":"債務引受とは、契約により、債務者の債務と同一内容の債務を、引受人が債権者に対して負担することをいう。債務者が当該債務を免れるものを⟪免責的債務引受⟫といい（⟪472条1項⟫）、債務者が離脱せず引受人と併存して債務を負うものを⟪併存的債務引受⟫という（⟪470条1項⟫）。\nいずれにあたるかは、⟪債務から免責させる合意⟫があるかによって決まると解する。契約書の名称は決め手とならない。\nなお、引受人が債権者に対しては債務を負わず、債務者に対して債務者の債務を履行する義務のみを負う場合は、⟪履行引受⟫にとどまり、債権者は引受人に履行を請求できない。\n\n併存的債務引受は、三者の契約によるほか、次の二つの方法ですることができる。\n(1) ⟪債権者と引受人となる者との契約⟫によってすることができる（⟪470条2項⟫）。この場合、⟪債務者の意思に反してもよい⟫。併存的債務引受は機能的に保証に類似する信用補完であり、保証も主たる債務者の意思に反してすることができる（⟪462条2項⟫参照）からである。\n(2) ⟪債務者と引受人となる者との契約⟫によってもすることができるが、この場合は、⟪債権者が引受人となる者に対して承諾⟫をした時にその効力を生ずる（⟪470条3項⟫）。この契約は⟪第三者のためにする契約⟫であり（同条4項）、債権者の承諾は受益の意思表示（537条3項）に相当する⟪効力発生要件⟫であって、債務引受の事実を債権者に対抗するための対抗要件ではない。\n債務引受の効果を第三者に対抗するために対抗要件は要しない。\n\n引受人は、債務者と連帯して、債務者が債権者に対して負担する債務と同一の内容の債務を負担する（470条1項）。すなわち両者は⟪連帯債務⟫の関係に立ち、次の帰結が導かれる。\n(1) 影響関係は⟪相対効⟫が原則である（⟪441条本文⟫）。したがって債務者の債務について消滅時効が完成しても、引受人の債務は影響を受けず、債権者は引受人に全額を請求できる。\n(2) 弁済をした引受人は、負担部分に応じて債務者に求償することができる（⟪442条1項⟫）。\n(3) 引受人は、⟪効力が生じた時⟫に債務者が主張することができた抗弁をもって債権者に対抗することができる（⟪471条1項⟫）。引受人の債務は債務者の債務と同一だからである。\n(4) 引受人は債務発生原因である契約の取消権・解除権を行使することはできないが、債務者がこれらを有するときは、⟪債務を免れるべき限度⟫において、債権者に対して債務の履行を拒むことができる（⟪471条2項⟫）。債務者が相殺権を有するときも、⟪その負担部分の限度⟫で履行を拒むことができる（470条1項・⟪439条2項⟫）。\n\n免責的債務引受の引受人は、債務者が債権者に対して負担する債務と同一の内容の債務を負担し、債務者は自己の債務を免れる（472条1項）。三者の契約によるほか、次の二つの方法ですることができる。\n(1) ⟪債権者と引受人となる者との契約⟫によってすることができるが、この場合は、⟪債権者が債務者に対して⟫その契約をした旨を⟪通知⟫した時にその効力を生ずる（⟪472条2項⟫）。\n(2) ⟪債務者と引受人となる者が契約⟫をし、⟪債権者が引受人となる者に対して承諾⟫をすることによってもすることができる（⟪472条3項⟫）。\n債務者の交替により債務の引当てとなる⟪責任財産⟫が変わるから、債権者の関与のないまま効力を生じさせることは認められない。他方、(1)で要求されるのは債務者の⟪同意ではなく通知⟫である。債務者はこれによって⟪利益を受けるだけ⟫であるから、その意思に反してもさしつかえないからである。\n\n(1) ⟪抗弁⟫　引受人は、免責的債務引受の効力が生じた時に債務者が主張することができた抗弁をもって債権者に対抗することができる（⟪472条の2第1項⟫）。取消権・解除権自体は行使できないが、債務者がこれらを有するときは、⟪免責的債務引受がなければ⟫その行使によって債務者がその債務を免れることができた限度において、履行を拒むことができる（同条2項）。これに対し、債務者の有する⟪相殺権⟫については、⟪その援用も履行の拒絶もできない⟫（併存的債務引受と異なる点である）。債務者は完全に免責され、その相殺権は引受人の債務の帰趨に影響しないうえ、⟪他人の権利の処分⟫となるからである。\n(2) ⟪求償⟫　引受人は、債務者に対して⟪求償権を取得しない⟫（⟪472条の3⟫）。引受人は他人の債務を自己の債務として引き受け、自己の債務として履行するのであって、⟪求償関係を生じさせる基礎⟫を欠くからである。もっとも同条は⟪任意規定⟫であり、別途の合意があれば請求できる。\n\n債権者は、債務者が免れる債務の担保として設定された担保権を引受人が負担する債務に移すことができる（⟪472条の4第1項本文⟫）。ただし、⟪引受人以外の者⟫（⟪債務者も含む⟫）がこれを設定したときは、⟪その者の承諾⟫を得なければならない（同項ただし書）。\nまた、移転は⟪あらかじめ又は同時に⟫、引受人に対してする⟪意思表示⟫によってしなければならない（同条2項）。担保権の消滅における⟪付従性⟫との抵触を避ける趣旨である。\n保証をした者があるときも同様であり（同条3項）、この場合の保証人の承諾は、⟪書面⟫によらなければ効力を生じない（同条4項。⟪電磁的記録⟫による承諾は書面によるものとみなす。同条5項）。承諾が得られなければ、担保・保証は旧債務の消滅に伴って消滅する。","kata":"| # | 落としてはいけない要素 | よくある崩れ方 |\n|---|---|---|\n| 1 | 区別の基準＝**債務者を免責させる合意の有無**／名称は決め手でない | 「引受人が全額負う気だったか」など主観で切る |\n| 2 | 履行引受＝債権者は引受人に請求**できない** | 債務引受と同じに扱う |\n| 3 | 併存的・**債権者と引受人**＝470条**2項**・追加要件なし | 「承諾が要る」と足す |\n| 4 | 併存的・**債務者と引受人**＝470条**3項**・**債権者の承諾**で効力発生 | 「通知」と書く／対抗要件と書く |\n| 5 | 併存的・債務者の意思に反しても可（462条2項参照） | 「反する場合は無効」 |\n| 6 | 470条**4項**＝第三者のためにする契約 | 落とす |\n| 7 | 効果＝**連帯債務**（470条**1項**） | 「不真正連帯債務」と書く（改正前の議論） |\n| 8 | **441条本文＝相対効**（債務者の時効消滅は引受人に及ばない） | 改正前439条の負担部分絶対効で書く |\n| 9 | 求償**あり**（442条1項） | 落とす |\n| 10 | 471条**1項**＝効力発生時に債務者が主張できた抗弁 | 「引受契約上の抗弁」と混ぜる |\n| 11 | 471条**2項**＝行使不可・**債務者が免れるべき限度**で履行拒絶 | 「引受人が取消しできる」 |\n| 12 | 免責的・**債権者と引受人**＝472条**2項**・**債権者が債務者に通知** | 「承諾」と書く／通知を引受人がすると書く |\n| 13 | 免責的・**債務者と引受人**＝472条**3項**・**債権者が引受人に承諾** | 「通知」と書く |\n| 14 | 472条の2第**2項**＝**引受けがなければ免れることができた限度** | 471条2項と同じ文言で書く |\n| 15 | 免責的では**相殺の履行拒絶もできない**（併存的はできる） | 併存的と同じに扱う |\n| 16 | **472条の3＝求償権を取得しない**（任意規定・委託があれば649条650条） | 落とす／「負担部分に応じて求償」 |\n| 17 | 472条の4第**1項ただし書**＝**引受人以外の**設定者の承諾（**債務者も含む**） | 債務者所有の担保は承諾不要と書く |\n| 18 | 472条の4第**2項**＝あらかじめ又は同時に**引受人に対する意思表示** | 落とす／事後でよいと書く |\n| 19 | 472条の4第**3項・4項**＝保証は**書面**（5項＝電磁的記録） | 書面要件を物上保証人にも及ぼす／落とす |\n| 20 | 承諾がなければ担保・保証は**消滅**する | 「当然に移る」 |\n\n**勝負どころ**\n\n1. **併存的の2項・3項と免責的の2項・3項を取り違えないこと。**「併存的は債権者側から手ぶら／免責的はどちらから来ても債権者の関与（通知か承諾）」で覚える。\n2. **472条の3と472条の4を落とさないこと。**設問が「引受人は債務者に求償できるか」「保証人・抵当権はどうなるか」で聞いてくる型が短答・論文ともに繰り返し出ている（H22司第20問、H29司第20問、R3司予第20問）。\n3. **改正前判例の結論を書かないこと。**とくに**債務者の債務の時効消滅**は、改正前は負担部分につき引受人に及んだが、現行法では及ばない（441条本文）。\n\n> ⚠️ **間違えやすい点**\n> - **472条の4の書面要件は「保証人の承諾」だけ**（同条4項は3項の場合に限る）。物上保証人の承諾（1項ただし書）に方式はない。\n> - **債務者が設定した担保も、債務者の承諾が要る**（債務者は「引受人以外の者」）。\n> - **引受人自身が設定者・保証人であるときは、その承諾は不要**（472条の4第1項ただし書の反対解釈。プラクティス紙面p.548 no.3、伊藤真の速習短答 紙面p.258の一覧も同旨）。\n> - **元本確定前の根抵当権は移せない**（398条の7第3項）。\n> - **併存的債務引受でも、引受人は債務発生原因である契約の取消権・解除権を行使できない**（471条2項は履行拒絶権しか与えない。R3司予第20問肢オ・H29司第20問肢オがこの点を突いている）。\n> - **併存的債務引受と保証の線引き**：プラクティス紙面p.537は、「保証契約書」「債務引受契約書」といった名称は決め手にならず、**保証を主たる目的とするものには保証人保護に関わる規定（方式要件を含む）を準用すべき**とする。ただしこれは同書の主張であり、他の蔵書で同旨を確認できなかった。答案で使うなら「同書の見解」として使う。","hanrei":[["最三小判 昭41・12・20（民集20巻10号2139頁、判時475号33頁、判タ202号108頁）","「重畳的債務引受がなされた場合には、反対に解すべき特段の事情のないかぎり、原債務者と引受人との関係について連帯債務関係が生ずる」／原債務者の債務の時効消滅の効果は、改正前439条の適用上、その負担部分について引受人にも及ぶ","**百選Ⅱ〔第8版〕31番**（解説：沖野眞已・紙面p.64〜65）。⚠️ **〔第9版〕で削除された判例なので新版の番号は存在しない**（`判例百選_版対応表.md`「〔第9版〕で削除された判例」の表）。**前段は470条1項へ／後段は現行法では妥当しない**（441条本文）"],["大判 昭11・4・15（民集15巻781頁）","「重畳的債務引受アリタルトキハ爾後原債務者ト引受人トハ連帯債務ヲ負担スルモノト解スルヲ相当トス」（特段の事情の留保なし）","上記のリーディングケース。出典＝百選Ⅱ〔第8版〕紙面p.64〜65。百選収録なし"],["大判 昭14・8・24（新聞4467号9頁）","時効消滅の影響につき改正前439条を適用","出典＝百選Ⅱ〔第8版〕紙面p.65。現行法では441条本文により結論が異なる。百選収録なし"],["大判 大11・3・1","主たる債務について免責的債務引受がされた場合、保証債務は保証人の承諾がない限り消滅する","472条の4第3項・4項に受け継がれた。⚠️ **DB内の出典は `体系別短答過去問題集 民法(下)』紙面p.196 の1冊のみ**で、判例集の原典・他の蔵書では確認できていない（同じ日付で刑法の別事件〔大判大11・3・1・連鎖的教唆〕がDBにあるので混同しないこと）"],["最判 平8・7・12（民集50巻7号1918頁）","預託金会員制ゴルフクラブの会員たる地位の譲渡を**債権譲渡と構成**し、第三者に対抗するには467条2項の確定日付ある証書による通知・承諾を要するとした","契約上の地位の移転（539条の2）との区別の限界例。出典＝プラクティス紙面p.550 memo102（同書はこの処理を疑問視し、河合裁判官の反対意見を挙げる）。百選収録なし"]],"field":"債務引受","order":34},{"name":"債権者代位権_要件と転用","subject":"民法","rank":"A","path":"まとめ/民法/論証/債権者代位権_要件と転用.md","cards":[{"id":"民法/債権者代位権_要件と転用#1","block":"第1〔制度趣旨・要件〕","kind":"cloze","masked":"債権者代位権は、⟦ア⟧となる債務者の⟦イ⟧するための制度である。もっとも、権利を行使するか否かは本来⟦ウ⟧であるから、その⟦エ⟧は必要な範囲に限られなければならない。そこで、その行使には次の要件を要すると解する。","body":"債権者代位権は、⟪強制執行の引当て⟫となる債務者の⟪責任財産を保全⟫するための制度である。もっとも、権利を行使するか否かは本来⟪債務者の自由⟫であるから、その⟪財産管理への干渉⟫は必要な範囲に限られなければならない。そこで、その行使には次の要件を要すると解する。","answers":["強制執行の引当て","責任財産を保全","債務者の自由","財産管理への干渉"],"check":"","notes":[],"law":"","cites":[],"rate":0,"designed":true,"ref":false,"hash":"18987d19825b"},{"id":"民法/債権者代位権_要件と転用#2","block":"第2","kind":"cloze","masked":"① 被保全債権が存在し、かつ⟦ア⟧できるものであること（⟦イ⟧）。責任財産を保全しても強制執行ができないのでは意味がないからである。\n② 被保全債権の⟪期限が到来⟫していること（⟦ウ⟧）。ただし⟦エ⟧は、債務者に不利益がなく緊急を要するから、期限到来前でも許される（同項ただし書）。\n③ ⟪債権を保全する必要⟫があること（423条1項本文）。\n④ 被代位権利が、債務者の⟦オ⟧および⟪差押えを禁じられた権利⟫でないこと（⟦カ⟧）。\n⑤ ⟦キ⟧こと。債務者がすでに権利を行使している以上、その方法や結果が不十分・不適当であっても、債権者が重ねて代位行使することは許されない。","body":"① 被保全債権が存在し、かつ⟪強制執行により実現⟫できるものであること（⟪423条3項⟫）。責任財産を保全しても強制執行ができないのでは意味がないからである。\n② 被保全債権の⟪期限が到来⟫していること（⟪423条2項本文⟫）。ただし⟪保存行為⟫は、債務者に不利益がなく緊急を要するから、期限到来前でも許される（同項ただし書）。\n③ ⟪債権を保全する必要⟫があること（423条1項本文）。\n④ 被代位権利が、債務者の⟪一身に専属する権利⟫および⟪差押えを禁じられた権利⟫でないこと（⟪423条1項ただし書⟫）。\n⑤ ⟪債務者が自ら被代位権利を行使していない⟫こと。債務者がすでに権利を行使している以上、その方法や結果が不十分・不適当であっても、債権者が重ねて代位行使することは許されない。","answers":["強制執行により実現","423条3項","423条2項本文","保存行為","一身に専属する権利","423条1項ただし書","債務者が自ら被代位権利を行使していない"],"check":"","notes":[],"law":"","cites":["民法/423"],"rate":14,"designed":true,"ref":false,"hash":"3d768fe47174"},{"id":"民法/債権者代位権_要件と転用#3","block":"第3〔保全の必要性＝無資力〕","kind":"cloze","masked":"⦅③の「保全の必要性」とは、被保全債権が⟦ア⟧である場合には、⟦イ⟧であること、すなわち代位権を行使しなければ債務者の責任財産が債権を満足させるに足りなくなる⟦ウ⟧があることをいう⦆⟨1⟩。債務者に十分な資力があるなら、債権者はその財産に強制執行すれば足り、なお代位を認めるのは債務者の⟦エ⟧となるからである。","body":"⦅③の「保全の必要性」とは、被保全債権が⟪金銭債権⟫である場合には、⟪債務者が無資力⟫であること、すなわち代位権を行使しなければ債務者の責任財産が債権を満足させるに足りなくなる⟪おそれ⟫があることをいう⦆⟨1⟩。債務者に十分な資力があるなら、債権者はその財産に強制執行すれば足り、なお代位を認めるのは債務者の⟪財産管理に対する不当な干渉⟫となるからである。","answers":["金銭債権","債務者が無資力","おそれ","財産管理に対する不当な干渉"],"check":"","notes":[{"n":1,"label":"最判昭49・11・29","case":"最判昭49・11・29 民集28巻8号1670頁","gist":"「交通事故による損害賠償債権も金銭債権にほかならない」から、代位行使には債務者の「資力が債権を弁済するについて十分でないときであることを要する」"}],"law":"","cites":[],"rate":0,"designed":true,"ref":false,"hash":"2ae758b63d93"},{"id":"民法/債権者代位権_要件と転用#4","block":"第4〔一身専属権〕","kind":"cloze","masked":"④の「一身専属する権利」とは、⟦ア⟧、すなわち行使するか否かを⟦イ⟧に委ねるべき権利をいう。責任財産保全という債権者の利益と、権利行使の自由を尊重されるべき債務者の利益とを比較衡量して判断する。身分関係そのものの得喪変更を目的とする権利のほか、⟦ウ⟧の慰謝料請求権がこれに当たる。他方、⟦エ⟧や取消権・解除権等の⟦オ⟧は一身専属権ではなく、代位の対象となる。","body":"④の「一身専属する権利」とは、⟪行使上の一身専属権⟫、すなわち行使するか否かを⟪専ら権利者本人の意思⟫に委ねるべき権利をいう。責任財産保全という債権者の利益と、権利行使の自由を尊重されるべき債務者の利益とを比較衡量して判断する。身分関係そのものの得喪変更を目的とする権利のほか、⟪額が確定するまで⟫の慰謝料請求権がこれに当たる。他方、⟪時効の援用権⟫や取消権・解除権等の⟪形成権⟫は一身専属権ではなく、代位の対象となる。","answers":["行使上の一身専属権","専ら権利者本人の意思","額が確定するまで","時効の援用権","形成権"],"check":"","notes":[],"law":"","cites":[],"rate":0,"designed":true,"ref":false,"hash":"8415555772fd"},{"id":"民法/債権者代位権_要件と転用#5","block":"第5〔転用型（特定債権の保全）〕","kind":"cloze","masked":"これに対し、⟪特定債権を保全するための代位行使⟫では、責任財産の保全とは関係がないから、⟦ア⟧。すなわち、当該債権の⟦イ⟧である限り、資力を問わず代位行使が認められる。登記・登録請求権の保全については明文がある（⟦ウ⟧）。同条後段は代位行使の範囲（423条の2）と直接引渡し（423条の3）を準用していないから、⟦エ⟧と請求できるにとどまり、⟦オ⟧。","body":"これに対し、⟪特定債権を保全するための代位行使⟫では、責任財産の保全とは関係がないから、⟪債務者の無資力は要件とならない⟫。すなわち、当該債権の⟪保全に適切かつ必要⟫である限り、資力を問わず代位行使が認められる。登記・登録請求権の保全については明文がある（⟪423条の7⟫）。同条後段は代位行使の範囲（423条の2）と直接引渡し（423条の3）を準用していないから、⟪登記名義を債務者へ移せ⟫と請求できるにとどまり、⟪自己名義への移転は請求できない⟫。","answers":["債務者の無資力は要件とならない","保全に適切かつ必要","423条の7","登記名義を債務者へ移せ","自己名義への移転は請求できない"],"check":"","notes":[],"law":"","cites":["民法/423の7","民法/423の2","民法/423の3"],"rate":0,"designed":true,"ref":false,"hash":"10f6ec61a907"},{"id":"民法/債権者代位権_要件と転用#6","block":"第6","kind":"cloze","masked":"なお、⦅金銭債権を被保全債権とする場合であっても、その行使が⟦ア⟧であるときは、⟦イ⟧と解すべきである⦆⟨1⟩。","body":"なお、⦅金銭債権を被保全債権とする場合であっても、その行使が⟪責任財産の保全と無関係⟫であるときは、⟪無資力を要しない⟫と解すべきである⦆⟨1⟩。","answers":["責任財産の保全と無関係","無資力を要しない"],"check":"","notes":[{"n":1,"label":"最判昭50・3・6","case":"最判昭50・3・6 民集29巻3号203頁","gist":"買主の「同時履行の抗弁権を失わせて買主に対する自己の代金債権を保全するため、債務者たる買主の資力の有無を問わず民法423条1項本文により、買主に代位して登記に応じない相続人に対する買主の所有権移転登記手続請求権を行使することができる」"}],"law":"","cites":[],"rate":0,"designed":true,"ref":false,"hash":"d7ac6eec7063"}],"setsurei":["AはBに対し1000万円の貸金債権を有する。BはCに対し1000万円の売掛金債権を有するが、**この売掛金債権のほかにみるべき財産がなく、Aのほかに E に対しても800万円の債務を負っている**。それにもかかわらず、BはCに請求しないまま消滅時効の完成が迫っている。AはCに対して何ができるか。また、Aの請求後にBが自らCから取立てをすることは許されるか。","Cは自己所有の甲土地をAに売却し、代金の一部を受領したまま登記を移転せずに死亡し、B・DがCを相続した。AはB・Dに残代金を支払うよう求められたが、Dが登記手続に協力しないため、Aは同時履行の抗弁（533条）を理由に支払を拒んでいる。BはAに対する残代金債権を被保全債権として、AのDに対する登記請求権を代位行使できるか。Aが無資力でない場合はどうか。"],"full":"（1）制度趣旨・要件\n債権者代位権は、⟪強制執行の引当て⟫となる債務者の⟪責任財産を保全⟫するための制度である。もっとも、権利を行使するか否かは本来⟪債務者の自由⟫であるから、その⟪財産管理への干渉⟫は必要な範囲に限られなければならない。そこで、その行使には次の要件を要すると解する。\n\n① 被保全債権が存在し、かつ⟪強制執行により実現⟫できるものであること（⟪423条3項⟫）。責任財産を保全しても強制執行ができないのでは意味がないからである。\n② 被保全債権の⟪期限が到来⟫していること（⟪423条2項本文⟫）。ただし⟪保存行為⟫は、債務者に不利益がなく緊急を要するから、期限到来前でも許される（同項ただし書）。\n③ ⟪債権を保全する必要⟫があること（423条1項本文）。\n④ 被代位権利が、債務者の⟪一身に専属する権利⟫および⟪差押えを禁じられた権利⟫でないこと（⟪423条1項ただし書⟫）。\n⑤ ⟪債務者が自ら被代位権利を行使していない⟫こと。債務者がすでに権利を行使している以上、その方法や結果が不十分・不適当であっても、債権者が重ねて代位行使することは許されない。\n\n（2）保全の必要性＝無資力\n⦅③の「保全の必要性」とは、被保全債権が⟪金銭債権⟫である場合には、⟪債務者が無資力⟫であること、すなわち代位権を行使しなければ債務者の責任財産が債権を満足させるに足りなくなる⟪おそれ⟫があることをいう⦆⟨1⟩。債務者に十分な資力があるなら、債権者はその財産に強制執行すれば足り、なお代位を認めるのは債務者の⟪財産管理に対する不当な干渉⟫となるからである。\n\n（3）一身専属権\n④の「一身専属する権利」とは、⟪行使上の一身専属権⟫、すなわち行使するか否かを⟪専ら権利者本人の意思⟫に委ねるべき権利をいう。責任財産保全という債権者の利益と、権利行使の自由を尊重されるべき債務者の利益とを比較衡量して判断する。身分関係そのものの得喪変更を目的とする権利のほか、⟪額が確定するまで⟫の慰謝料請求権がこれに当たる。他方、⟪時効の援用権⟫や取消権・解除権等の⟪形成権⟫は一身専属権ではなく、代位の対象となる。\n\n（4）転用型（特定債権の保全）\nこれに対し、⟪特定債権を保全するための代位行使⟫では、責任財産の保全とは関係がないから、⟪債務者の無資力は要件とならない⟫。すなわち、当該債権の⟪保全に適切かつ必要⟫である限り、資力を問わず代位行使が認められる。登記・登録請求権の保全については明文がある（⟪423条の7⟫）。同条後段は代位行使の範囲（423条の2）と直接引渡し（423条の3）を準用していないから、⟪登記名義を債務者へ移せ⟫と請求できるにとどまり、⟪自己名義への移転は請求できない⟫。\n\nなお、⦅金銭債権を被保全債権とする場合であっても、その行使が⟪責任財産の保全と無関係⟫であるときは、⟪無資力を要しない⟫と解すべきである⦆⟨1⟩。","kata":"| # | 落としてはいけない要素 | 語 |\n|---|---|---|\n| 1 | 制度趣旨 | 責任財産の保全／干渉は必要な範囲に限る |\n| 2 | 被保全債権 | 存在＋**強制執行により実現可能**（423条3項） |\n| 3 | 期限 | 到来（423条2項本文）／**保存行為は例外**（同ただし書） |\n| 4 | 保全の必要性 | 423条1項本文 |\n| 5 | 無資力の定義 | 責任財産が債権の満足に不足するおそれ |\n| 6 | 無資力の理由付け | 資力があれば強制執行で足り、代位は不当な干渉 |\n| 7 | 被代位権利 | 一身専属権・差押禁止権利でない（423条1項**ただし書**） |\n| 8 | 一身専属権の定義 | **行使上**の一身専属権＝行使を専ら本人の意思に委ねるべき権利／利益衡量 |\n| 9 | 具体例 | 慰謝料請求権（額確定前）は該当／時効援用権・形成権は非該当 |\n| 10 | 権利不行使 | 債務者が行使していれば、方法・結果が不十分でも重ねて代位不可 |\n| 11 | 転用 | 特定債権保全では**無資力不要**／「保全に適切かつ必要な限り」 |\n| 12 | 条文 | 登記・登録請求権は**423条の7** |\n| 13 | 転用の効果の限界 | 423条の2・423条の3は**準用なし**→自己名義への移転登記は請求できない |\n\n**勝負どころ**\n1. **無資力が要るか要らないかの振り分けを、条文（423条1項「保全するため必要があるとき」）の解釈として示せるか。**「転用だから不要」と結論だけ書くと理由がない。\n2. **423条の7後段が423条の2・3を準用していないことに気づけるか**（登記は債務者名義へ、が結論）。\n3. **423条の5を正しく書けるか**——代位行使しても債務者の処分権は残る。旧判例で書くと即失点。\n\n> ⚠️ **間違えやすい点**\n> - **「代位行使すると債務者は処分権を失う」は旧判例。現行法では誤り**（423条の5）。訴訟告知後・勝訴判決確定後でも変わらない。\n> - **一身専属権は「行使上」と「帰属上」を区別する。**423条1項ただし書が排除するのは**行使上**の一身専属権。財産分与請求権・慰謝料請求権は行使上は一身専属だが帰属上はそうでない。\n> - **慰謝料請求権は「額が確定すれば」一身専属性を失う**。丸ごと対象外ではない。\n> - **被保全債権は被代位権利より前に成立している必要はない**（詐害行為取消権〔424条3項〕と混同しない）。\n> - **無資力の要否は「金銭債権か」だけで機械的に決めない**（最判昭50・3・6）。\n> - 代位権の行使に**訴えの提起は不要**（詐害行為取消権は裁判上の行使が必須〔424条1項〕）。","hanrei":[["最判昭50・3・6 民集29巻3号203頁","買主の「同時履行の抗弁権を失わせて買主に対する自己の代金債権を保全するため、債務者たる買主の資力の有無を問わず民法423条1項本文により、買主に代位して登記に応じない相続人に対する買主の所有権移転登記手続請求権を行使することができる」","**民法判例百選Ⅱ〔第9版〕9番＝〔第8版〕12番**（解説：工藤祐巌）。金銭債権だが無資力不要"],["最判昭49・11・29 民集28巻8号1670頁","「交通事故による損害賠償債権も金銭債権にほかならない」から、代位行使には債務者の「資力が債権を弁済するについて十分でないときであることを要する」","**民法判例百選Ⅱ〔第9版〕10番＝〔第8版〕13番**（解説：小峯庸平。第9版の表題は「交通事故被害者による保険金請求権の代位行使」）。責任保険金請求権の代位行使"],["大判明43・7・6 民録16輯537頁","特定債権（登記請求権）保全のための代位行使を認め、「債権の保全に適切にして且必要なる限り」無資力を要しないとした","転用の先例。現在は423条の7が明文化"],["最判昭29・9・24","建物賃借人は、賃借権保全のため賃貸人（所有者）の妨害排除請求権を代位行使でき、**直接自己への明渡し**を請求できる","巻号頁はDBのOCRが崩れており未確認"],["最大判平11・11・24 民集53巻8号1899頁","抵当権者は、抵当不動産を適切に維持・保存するよう求める請求権を保全するため、所有者の不法占有者に対する妨害排除請求権を代位行使できる","抵当権自体に基づく妨害排除も可（最判平17・3・10。プリメール p.99 が言及）"],["最判昭38・4・23","借地上建物の賃借人は、自己の建物賃借権を保全するために建物賃貸人の**建物買取請求権を代位行使できない**","代位で債務者が得るのは金銭債権、保全対象は借家権で、保全関係がない"],["最判昭28・12・14 民集7巻12号1386頁","債務者がすでに権利を行使しているときは、方法・結果のいかんを問わず債権者は重ねて代位行使できない",""],["最判昭58・10・6 民集37巻8号1041頁","名誉毀損の慰謝料請求権は、「被害者が右請求権を行使する意思を表示しただけでいまだその具体的な金額が当事者間において客観的に確定しない間は、被害者がなおその請求意思を貫くかどうかをその自律的判断に委ねるのが相当である」","代位が行使された事案ではない（プリメール p.103 の注記）"],["最判平13・11・22 民集55巻6号1033頁","遺留分減殺請求権は、権利行使の確定的意思を外部に表明したと認められる特段の事情がある場合を除き、債権者代位の目的とすることができない","**民法判例百選Ⅲ〔第3版〕96番＝〔第2版〕93番**（第3版解説：幡野弘樹）。※**同日付に別事件（集合債権の譲渡担保）がある**——そちらは百選Ⅱ〔第9版〕98番＝〔第8版〕100番＝〔第7版〕99番。**混同しないこと**"],["最判昭55・7・11 民集34巻4号628頁","財産分与請求権は「協議あるいは審判等によつて具体的内容が形成されるまでは、その範囲及び内容が不確定・不明確」であり、被保全債権とならない",""],["最判昭43・9・26 民集22巻9号2002頁","消滅時効の援用権は一身専属権にあたらず、債権者代位の目的となる","⚠️ **判旨原文・事案の詳細はDB未確認**（民法演習サブノート210問 p.82 が「時効の援用権者」の項目に掲げるのみ）。**答案で事案に踏み込んで引用しない。**当初「物上保証人の有する援用権」と書いていたが、その事案設定はDBで裏づけられなかったため削除（2026-07-22 検証）"],["最判昭33・7・15","被保全債権は被代位権利より前に成立している必要はない","裁判集民32巻805頁（プリメール p.98。巻号はOCR崩れあり）"],["最判昭40・10・12","無資力の意義（積極財産の総額が消極財産の総額を下回ること）","**アガルート総合講義-民法 p.204 が引用しているのみで、判示原文はDB未確認**"],["最判昭44・6・24","金銭債権について債権者代位権を行使できる範囲","**〔第8版〕11番。第9版では削除**（423条の2で明文化されたため落ちたと解される。第9版のⅢ責任財産の保全は9・10番＝代位、11〜14番＝詐害行為で構成される）。論点として書かない"],["大判昭14・5・16","債権者が代位行使し債務者がこれを知ったときは、債務者は自ら訴えを提起できない","**423条の5により立法で否定された。答案で使わない**"]],"field":"責任財産の保全","order":28},{"name":"債権譲渡と相殺_469条","subject":"民法","rank":"A","path":"まとめ/民法/論証/債権譲渡と相殺_469条.md","cards":[{"id":"民法/債権譲渡と相殺_469条#1","block":"第1〔条文の振り分けと原則——具備時より前に取得した債権〕","kind":"cloze","masked":"まず、債務者が譲渡人に対して有する債権を自働債権として相殺する場合は、468条1項の「事由」の問題ではなく、⟦ア⟧の問題である。そして、⟦ア⟧の適用にあたっては、債務者が⟦イ⟧のが⟦ウ⟧より前か後かを確定し、前であれば1項、後であれば2項各号を検討する。\n債務者は、⟦ウ⟧より前に取得した譲渡人に対する債権による相殺をもって、譲受人に対抗することができる（⟦エ⟧）。このとき、自働債権と受働債権の⟦オ⟧。\n相殺は、相対立する債権を簡易・公平に決済する合理的な制度であり、相殺権者に受働債権につきあたかも⟦カ⟧を与えるものであって、この地位はできる限り尊重されるべきである。そして、⟦ウ⟧までに債権の対立が生じていれば、その時点で債務者に⟦キ⟧が既に生じているといえるから、弁済期の先後を問わず相殺を対抗させるのが相当である。","body":"まず、債務者が譲渡人に対して有する債権を自働債権として相殺する場合は、468条1項の「事由」の問題ではなく、⟪469条⟫の問題である。そして、469条の適用にあたっては、債務者が⟪自働債権を取得した⟫のが⟪対抗要件具備時⟫より前か後かを確定し、前であれば1項、後であれば2項各号を検討する。\n債務者は、対抗要件具備時より前に取得した譲渡人に対する債権による相殺をもって、譲受人に対抗することができる（⟪469条1項⟫）。このとき、自働債権と受働債権の⟪弁済期の先後は問わない⟫。\n相殺は、相対立する債権を簡易・公平に決済する合理的な制度であり、相殺権者に受働債権につきあたかも⟪担保権を有するに似た地位⟫を与えるものであって、この地位はできる限り尊重されるべきである。そして、対抗要件具備時までに債権の対立が生じていれば、その時点で債務者に⟪相殺への期待⟫が既に生じているといえるから、弁済期の先後を問わず相殺を対抗させるのが相当である。","answers":["469条","自働債権を取得した","対抗要件具備時","469条1項","弁済期の先後は問わない","担保権を有するに似た地位","相殺への期待"],"check":"","notes":[],"law":"","cites":["民法/468","民法/469"],"rate":17,"designed":true,"ref":false,"hash":"e4ee5f50d317"},{"id":"民法/債権譲渡と相殺_469条#2","block":"第2〔例外その1——具備時より前の原因に基づいて生じた債権〕","kind":"cloze","masked":"債務者が対抗要件具備時より後に取得した債権であっても、その債権が⟦ア⟧に基づいて生じたものであるときは、なお相殺をもって譲受人に対抗することができる（⟦イ⟧）。対抗要件具備時に反対債権が未発生であっても、その時点で⟦ウ⟧が存在するのであれば、相殺への期待は保護に値するからである。\nここにいう「原因」は⟦エ⟧、不法行為・不当利得もこれに含まれる。\nもっとも、自働債権の⟦ウ⟧が⟦オ⟧に対抗要件具備時より前に存在していたというだけでは足りず、自働債権と受働債権の内容および⟦カ⟧を考慮したときに、⟦キ⟧が認められるか否かによって判断すべきである。","body":"債務者が対抗要件具備時より後に取得した債権であっても、その債権が⟪対抗要件具備時より前の原因⟫に基づいて生じたものであるときは、なお相殺をもって譲受人に対抗することができる（⟪469条2項1号⟫）。対抗要件具備時に反対債権が未発生であっても、その時点で⟪発生原因⟫が存在するのであれば、相殺への期待は保護に値するからである。\nここにいう「原因」は⟪契約に限られず⟫、不法行為・不当利得もこれに含まれる。\nもっとも、自働債権の発生原因が⟪形式的・客観的⟫に対抗要件具備時より前に存在していたというだけでは足りず、自働債権と受働債権の内容および⟪相互の関連性⟫を考慮したときに、⟪相殺への合理的期待⟫が認められるか否かによって判断すべきである。","answers":["対抗要件具備時より前の原因","469条2項1号","発生原因","契約に限られず","形式的・客観的","相互の関連性","相殺への合理的期待"],"check":"","notes":[],"law":"","cites":["民法/469"],"rate":23,"designed":true,"ref":false,"hash":"40edcaa85f8a"},{"id":"民法/債権譲渡と相殺_469条#3","block":"第3〔例外その2——譲渡債権の発生原因である契約から生じた債権〕","kind":"cloze","masked":"さらに、対抗要件具備時より⟪後の⟫原因に基づいて生じた債権であっても、それが⟦ア⟧に基づいて生じた債権であるときは、相殺をもって譲受人に対抗することができる（⟦イ⟧）。両債権が同一の契約から生じており⟦ウ⟧が認められること、および、将来債権が譲渡された後も債務者が譲渡人との⟦エ⟧し続ける誘因を与える必要があることによる。\nなお、本号自体は反対債権の原因が具備時より後であることを要件としているわけではなく、「⟦オ⟧」と定めて1号で拾えない場合の⟦カ⟧とされているにすぎない。したがって、原因が具備時より前にあるなら1号で処理すべきであり、本号を用いるのは原因が具備時より後にある場合である。\nしたがって本号は、⟪将来債権が譲渡され、対抗要件が具備された後に譲渡債権を発生させる契約が締結され、その同一の契約から債務者の反対債権も生じた場面⟫に、事実上その適用が限られる。反対債権の原因である契約と譲渡債権の原因である契約が同一と評価できないときは、本号にあたらない。","body":"さらに、対抗要件具備時より⟪後の⟫原因に基づいて生じた債権であっても、それが⟪譲受人の取得した債権の発生原因である契約⟫に基づいて生じた債権であるときは、相殺をもって譲受人に対抗することができる（⟪469条2項2号⟫）。両債権が同一の契約から生じており⟪牽連性⟫が認められること、および、将来債権が譲渡された後も債務者が譲渡人との⟪取引関係を維持⟫し続ける誘因を与える必要があることによる。\nなお、本号自体は反対債権の原因が具備時より後であることを要件としているわけではなく、「⟪前号に掲げるもののほか⟫」と定めて1号で拾えない場合の⟪受け皿⟫とされているにすぎない。したがって、原因が具備時より前にあるなら1号で処理すべきであり、本号を用いるのは原因が具備時より後にある場合である。\nしたがって本号は、⟪将来債権が譲渡され、対抗要件が具備された後に譲渡債権を発生させる契約が締結され、その同一の契約から債務者の反対債権も生じた場面⟫に、事実上その適用が限られる。反対債権の原因である契約と譲渡債権の原因である契約が同一と評価できないときは、本号にあたらない。","answers":["譲受人の取得した債権の発生原因である契約","469条2項2号","牽連性","取引関係を維持","前号に掲げるもののほか","受け皿"],"check":"","notes":[],"law":"","cites":["民法/469"],"rate":17,"designed":true,"ref":false,"hash":"6d387c306f5f"},{"id":"民法/債権譲渡と相殺_469条#4","block":"第4〔1号・2号に共通する限界——他人から取得した債権〕","kind":"cloze","masked":"ただし、債務者が対抗要件具備時より後に⟦ア⟧したときは、⟦イ⟧に形式上あたるとしても、その債権による相殺をもって譲受人に対抗することができない（⟦ウ⟧）。対抗要件具備時に債務者のもとで⟦エ⟧からである。","body":"ただし、債務者が対抗要件具備時より後に⟪他人の債権を取得⟫したときは、⟪1号・2号のいずれ⟫に形式上あたるとしても、その債権による相殺をもって譲受人に対抗することができない（⟪469条2項柱書ただし書⟫）。対抗要件具備時に債務者のもとで⟪相殺への期待が形成されていない⟫からである。","answers":["他人の債権を取得","1号・2号のいずれ","469条2項柱書ただし書","相殺への期待が形成されていない"],"check":"","notes":[],"law":"","cites":["民法/469"],"rate":35,"designed":true,"ref":false,"hash":"8bb4906290a9"},{"id":"民法/債権譲渡と相殺_469条#5","block":"第5〔基準時の修正〕","kind":"cloze","masked":"譲渡制限の意思表示がされた債権が譲渡された場合には、1項・2項の「対抗要件具備時」が⟦ア⟧（⟦イ⟧）。すなわち、譲受人が悪意又は重過失であって譲渡人への履行を催告した場合（⟦ウ⟧の場合）には「⟦エ⟧」、譲渡人について破産手続開始の決定があった場合（⟦オ⟧の場合）には「⟦カ⟧」が、それぞれ基準時となる。債務者が譲渡制限の意思表示をもって譲受人に対抗することができなくなった時点を基準とするのが相当だからである。","body":"譲渡制限の意思表示がされた債権が譲渡された場合には、1項・2項の「対抗要件具備時」が⟪後にずれる⟫（⟪469条3項⟫）。すなわち、譲受人が悪意又は重過失であって譲渡人への履行を催告した場合（⟪466条4項⟫の場合）には「⟪相当の期間を経過した時⟫」、譲渡人について破産手続開始の決定があった場合（⟪466条の3⟫の場合）には「⟪譲受人から供託の請求を受けた時⟫」が、それぞれ基準時となる。債務者が譲渡制限の意思表示をもって譲受人に対抗することができなくなった時点を基準とするのが相当だからである。","answers":["後にずれる","469条3項","466条4項","相当の期間を経過した時","466条の3","譲受人から供託の請求を受けた時"],"check":"","notes":[],"law":"","cites":["民法/469","民法/466","民法/466の3"],"rate":35,"designed":true,"ref":false,"hash":"37fc7cfdbd27"}],"setsurei":["1. 令和2年5月20日、Ａは甲土地・乙建物をＢに売却した（契約①）。乙建物が特に優れた防音性能を備えた物件であることが合意内容とされ、代金は6000万円と定められた。Ｂは契約時に1000万円を支払い、残額は引渡日から1か月以内に支払うこととされた。 2. 令和2年7月25日、Ａは契約①に基づく残代金債権5000万円をＣに代金4500万円で売却し、Ｃへの債権譲渡を通知する内容証明郵便が同月30日にＢに到達した。 3. 令和2年9月25日、Ｂは甲土地・乙建物の引渡しを受けた。同年10月10日、乙建物が契約①で合意された防音性能を備えていないことが判明した。 4. Ｂは、防音性能を備えさせる工事費用の見積書を示して、費用を負担するか工事を自ら手配するかを選択して履行するようＡに求めたが、Ａからの応答はない。 5. 令和2年10月30日、ＣはＢに残代金5000万円の支払を求めた。 Ｂは、**追完に代わる損害賠償請求権を自働債権とする相殺**をもってＣに対抗できるか。","Ａは、Ｂのために部品を製造して供給していた。この取引は、ＡがＢから毎月注文を受けて月内に部品を納入し、その翌月にＢが代金を支払うという約定だった。2021年1月、Ａは、Ｃから融資を受けるのに際し、**同年中にＡがＢに対して取得する売買代金債権**について、Ｃのために譲渡担保を設定した。同年4月、Ａはこの債権譲渡をＢに通知した。 (2) Ｂは、2021年2月、Ａに対し、弁済期を同年5月として100万円を貸し付けていた。Ｂは、同年6月、この貸付金と**3月分の代金債務**を相殺したとしてＣの請求を拒んだ。これは認められるか。 (3) 通知後もＡＢ間の取引は継続したが、2021年**7月**にＡが納入した部品に欠陥があったため、Ｂの製造ラインが一時ストップする事故が生じた。Ｂは、この事故によりＡに対して取得した損害賠償請求権を**7月分の代金債務**と相殺したとしてＣの請求を拒んだ。これは認められるか。"],"full":"まず、債務者が譲渡人に対して有する債権を自働債権として相殺する場合は、468条1項の「事由」の問題ではなく、⟪469条⟫の問題である。そして、469条の適用にあたっては、債務者が⟪自働債権を取得した⟫のが⟪対抗要件具備時⟫より前か後かを確定し、前であれば1項、後であれば2項各号を検討する。\n債務者は、対抗要件具備時より前に取得した譲渡人に対する債権による相殺をもって、譲受人に対抗することができる（⟪469条1項⟫）。このとき、自働債権と受働債権の⟪弁済期の先後は問わない⟫。\n相殺は、相対立する債権を簡易・公平に決済する合理的な制度であり、相殺権者に受働債権につきあたかも⟪担保権を有するに似た地位⟫を与えるものであって、この地位はできる限り尊重されるべきである。そして、対抗要件具備時までに債権の対立が生じていれば、その時点で債務者に⟪相殺への期待⟫が既に生じているといえるから、弁済期の先後を問わず相殺を対抗させるのが相当である。\n\n債務者が対抗要件具備時より後に取得した債権であっても、その債権が⟪対抗要件具備時より前の原因⟫に基づいて生じたものであるときは、なお相殺をもって譲受人に対抗することができる（⟪469条2項1号⟫）。対抗要件具備時に反対債権が未発生であっても、その時点で⟪発生原因⟫が存在するのであれば、相殺への期待は保護に値するからである。\nここにいう「原因」は⟪契約に限られず⟫、不法行為・不当利得もこれに含まれる。\nもっとも、自働債権の発生原因が⟪形式的・客観的⟫に対抗要件具備時より前に存在していたというだけでは足りず、自働債権と受働債権の内容および⟪相互の関連性⟫を考慮したときに、⟪相殺への合理的期待⟫が認められるか否かによって判断すべきである。\n\nさらに、対抗要件具備時より⟪後の⟫原因に基づいて生じた債権であっても、それが⟪譲受人の取得した債権の発生原因である契約⟫に基づいて生じた債権であるときは、相殺をもって譲受人に対抗することができる（⟪469条2項2号⟫）。両債権が同一の契約から生じており⟪牽連性⟫が認められること、および、将来債権が譲渡された後も債務者が譲渡人との⟪取引関係を維持⟫し続ける誘因を与える必要があることによる。\nなお、本号自体は反対債権の原因が具備時より後であることを要件としているわけではなく、「⟪前号に掲げるもののほか⟫」と定めて1号で拾えない場合の⟪受け皿⟫とされているにすぎない。したがって、原因が具備時より前にあるなら1号で処理すべきであり、本号を用いるのは原因が具備時より後にある場合である。\nしたがって本号は、⟪将来債権が譲渡され、対抗要件が具備された後に譲渡債権を発生させる契約が締結され、その同一の契約から債務者の反対債権も生じた場面⟫に、事実上その適用が限られる。反対債権の原因である契約と譲渡債権の原因である契約が同一と評価できないときは、本号にあたらない。\n\nただし、債務者が対抗要件具備時より後に⟪他人の債権を取得⟫したときは、⟪1号・2号のいずれ⟫に形式上あたるとしても、その債権による相殺をもって譲受人に対抗することができない（⟪469条2項柱書ただし書⟫）。対抗要件具備時に債務者のもとで⟪相殺への期待が形成されていない⟫からである。\n\n譲渡制限の意思表示がされた債権が譲渡された場合には、1項・2項の「対抗要件具備時」が⟪後にずれる⟫（⟪469条3項⟫）。すなわち、譲受人が悪意又は重過失であって譲渡人への履行を催告した場合（⟪466条4項⟫の場合）には「⟪相当の期間を経過した時⟫」、譲渡人について破産手続開始の決定があった場合（⟪466条の3⟫の場合）には「⟪譲受人から供託の請求を受けた時⟫」が、それぞれ基準時となる。債務者が譲渡制限の意思表示をもって譲受人に対抗することができなくなった時点を基準とするのが相当だからである。","kata":"| # | 落としてはいけない要素 |\n|---|---|\n| 1 | **468条ではなく469条**の問題であるという振り分け（自働債権＝譲渡人に対する別の債権） |\n| 2 | **自働債権の取得が具備時より前か後か → 1項／2項**の順で分析すること |\n| 3 | 469条**1項**・具備時より前に**取得**・**弁済期の先後を問わない** |\n| 4 | 1項の理由＝相殺の担保的機能／具備時までに債権の対立があれば相殺の期待が既に生じている |\n| 5 | 469条**2項1号**・「具備時より**前の原因**に基づいて生じた債権」 |\n| 6 | 1号の「原因」＝契約に限らず**不法行為・不当利得も含む** |\n| 7 | 1号の限定＝形式的・客観的な先行では足りず、**両債権の内容および相互の関連性から相殺への合理的期待**を判断 |\n| 8 | 469条**2項2号**・「**譲受人の取得した債権の発生原因である契約**に基づいて生じた債権」 |\n| 9 | 2号の理由＝**同一契約からの牽連性**／将来債権譲渡後も**取引を継続する誘因**を債務者に与える |\n| 10 | 2号の射程＝**将来債権譲渡**で、具備後に原因契約が締結された場面に事実上限られる |\n| 11 | 469条**2項柱書ただし書**・具備時より後に**他人の債権**を取得したときは1号・2号とも不可 |\n| 12 | ただし書の理由＝**債務者のもとで**具備時までに相殺の期待が形成されていない |\n| 13 | 469条**3項**の2つの読み替え（466条4項→**相当の期間を経過した時**／466条の3→**供託の請求を受けた時**） |\n\n**勝負どころ**\n\n1. 🚨 **「1項か2項か」を先に確定すること。**令和2年の採点実感が「1号か2号かという以前に1項か2項かの分析ができていない答案が相当数あった」と名指しした点。**号の議論に飛び込む前に、反対債権の取得時期を具備時と比較して1行書く。**\n2. 🚨 **468条との振り分け。**同じ契約不適合から出発しても、**代金減額請求（形成権）＝468条1項／譲渡人に対する債権を自働債権とする相殺＝469条**。採点実感は**両方向の取り違え**を減点事由にしている。\n3. **1号と2号の使い分け。**既発生債権の譲渡なら原因契約が具備時前にあるので1号。将来債権譲渡で具備後に原因契約が締結された場合だけ2号。\n\n> ⚠️ **間違えやすい点**\n> - **468条2項と469条3項の混同。**同じ2つの読み替え（466条4項＝相当期間経過時／466条の3＝供託請求時）が**両方の条文に別々に置かれている**。抗弁一般＝468条2項、相殺＝**469条3項**。\n> - **ただし書は柱書に置かれている**ので**1号・2号の両方にかかる**。1号だけの限定と書くと誤り。\n> - **2号は「前号に掲げるもののほか」。**1号で拾える事案を2号で処理すると条文の構造に反する。\n> - **1項は「取得」時、2項1号は「原因」の存在時が基準。**「1項でも原因があればよい」と混ぜないこと。\n> - **「対抗要件具備時」は債務者対抗要件（467条1項＝通知・承諾）の具備時。**確定日付ある証書（467条2項）ではない。定義は466条の6第3項の括弧書。\n> - **他人から取得した債権でも、取得が具備時より前なら1項で相殺できる。**1項は取得の経路を問わず「具備時より前に取得した」ことだけを要件とし、ただし書が排除するのは「具備時より**後に**他人の債権を取得した」場合だけである（**条文の文言からの読み**。上の逐語表を参照）。\n> - **`アガルート/総合講義-民法` 紙面234頁の「基準時の修正がある(469Ⅱ)」は、条文では3項。**同ページは項号の印字が落ちている箇所が複数ある。条文DBを見ること。\n> - **`短答/司法試験&予備試験 単年度版 短答過去問題集 令和3年` DB p0089 の解説冒頭は「債権者が対抗要件具備時より後に取得した」と印字されているが、条文の主体は「債務者」。**引用箇所のOCR崩れ。","hanrei":[["**最大判 昭和45・6・24**（民集24巻6号587頁）","旧511条につき**無制限説**を採用。「相殺の制度は……相殺権を行使する債権者の立場からすれば……受働債権につきあたかも担保権を有するにも似た地位が与えられるという機能を営む」「この制度によって保護される当事者の地位は、できるかぎり尊重すべきものであって……明文の根拠なくして、たやすくこれを否定すべきものではない」「第三債務者は、その債権が差押後に取得されたものでないかぎり、**自働債権および受働債権の弁済期の前後を問わず**、相殺適状に達しさえすれば、差押後においても、これを自働債権として相殺をなしうる」。あわせて**相殺予約**の対外効を肯定。昭和39・12・23（制限説）を変更","**維持。**511条1項として明文化され（`民事執行・保全法〔第6版〕` DB p0204）、**469条1項も「差押えと共に（511条1項）無制限説を明文化したもの」**（百選Ⅱ〔第8版〕28番解説4／DB p0070）。**判示は511条についてのものである。**⚠️ `[カニの推論]`（DB裏付けなし）：**「相殺の担保的機能という理由付けを469条1項の趣旨としてそのまま使える」というのは本まとめの橋渡しで、百選解説はそこまで書いていない**（解説が言うのは「511条1項と共に無制限説を明文化」「相殺期待を定型的に保護」まで）。暗唱ブロック第1の理由付けはこの橋渡しに乗っているので、答案では「**相殺の担保的機能に対する期待を定型的に保護する趣旨**」という解説の言い方に寄せるのが安全。百選Ⅱ〔第9版〕**32番**（＝〔第8版〕**39番**）・解説＝北居功"],["**最大判 昭和39・12・23**（民集18巻10号2217頁）","旧511条につき**制限説**（自働債権の弁済期が受働債権より先に到来する場合に限り相殺を差押債権者に優先させる）","**前提が失われた。**昭和45・6・24 で判例変更され、さらに511条1項・469条1項が無制限説を明文化した。**「かつて争われたが立法で解決済み」として一言触れるにとどめる。**"],["**最判 昭和50・12・8**（民集29巻11号1864頁）","旧468条2項の「事由」につき、債務者対抗要件具備時に両債権の弁済期が未到来で、**かつ受働債権の弁済期が先に到来する**場合の相殺も「事由」に該当するとした（**事例判断**）。一般論について多数意見が形成されず、補足意見2（無制限説）・反対意見2（制限説）が付いた","**論点としての先例価値は失われた。**「本件のように同具備時前に自働債権が『取得』されている事例では、**469条1項により一般的に相殺の対抗が認められるようになる**」（百選Ⅱ〔第8版〕28番解説4／DB p0070）。百選Ⅱ〔**第8版**〕**28番**・解説＝岩川隆嗣。**〔第9版〕では削除**されており新版の番号は無い（`判例百選_版対応表.md`「〔第9版〕で削除された判例」）。**それでも解説は改正法469条の立法趣旨・学説対立の一次的な整理として最も詳しいので、資料としては第8版を読む。**"],["**最判 平成24・5・28**（民集66巻7号3123頁）","**委託を受けていない**保証人が弁済して取得した求償権との相殺は許されない。「相殺を認めると債務者の意思や法定の原因と無関係に優先的な債権の作出を認め、ひいては**他人の債権を譲り受けて相殺するのに類似する**ため」（百選Ⅱ〔第9版〕32番解説3／DB p0032。破産法の場面）","469条2項柱書**ただし書の類推適用**が論じられる文脈で引かれる（百選Ⅱ〔第8版〕28番解説5(1)／DB p0071が部会資料69A・30頁、潮見『新債権総論Ⅱ』311頁を挙げる）。**469条についての判例ではない。**射程を超えて引かないこと"],["**最判 令和2・9・8**（民集74巻6号1643頁）","建築請負人が仕事未完成で支払停止となり、それを知った注文者が請負契約の条項に基づいて解除して取得した違約金債権は「前の原因」に基づく債権であるため、既履行工事分の報酬債務と相殺できる（百選Ⅱ〔第9版〕32番解説3は「このことを前提とした判決である」と紹介）","**511条2項の「前の原因」**についての判断。469条2項1号の「前の原因」は511条2項と同趣旨とされる（`プラクティス` DB p0524）ので**参考になるが、469条についての判例ではない。**"],["~~最判 平成7・7・18（判時1570号60頁）~~","相殺予約に基づく相殺が実質的に債権譲渡といえる場合、差押え後の相殺の意思表示を差押債権者に対抗できない","相殺予約の論点。**469条の論点ではない**ので答案では引かない。出典＝百選Ⅱ〔第9版〕32番解説3／DB p0032"]],"field":"債権譲渡","order":33},{"name":"共同抵当_392条","subject":"民法","rank":"A","path":"まとめ/民法/論証/共同抵当_392条.md","cards":[{"id":"民法/共同抵当_392条#1","block":"第1〔目的不動産がすべて債務者の所有に属する場合〕","kind":"cloze","masked":"　同時に代価を配当すべきときは、各不動産の価額に応じて債権の負担が按分される（⟦ア⟧）。ある不動産の代価のみを配当すべきときは、抵当権者はその代価から債権全部の弁済を受けられるが、次順位の抵当権者は、抵当権者が同項に従い他の不動産の代価から弁済を受けるべきであった金額を限度として、その抵当権者に代位して抵当権を行使することができる（⟦イ⟧）。\n　けだし、後順位抵当権者は、先順位の共同抵当権の負担が各不動産の価額に応じて⟦ウ⟧られることを前提に、そこに生ずる⟦エ⟧して抵当権の設定を受けているのが通常であり、先に実行された不動産が⟦オ⟧によってその期待を害されるべきではないからである。","body":"　同時に代価を配当すべきときは、各不動産の価額に応じて債権の負担が按分される（⟪392条1項⟫）。ある不動産の代価のみを配当すべきときは、抵当権者はその代価から債権全部の弁済を受けられるが、次順位の抵当権者は、抵当権者が同項に従い他の不動産の代価から弁済を受けるべきであった金額を限度として、その抵当権者に代位して抵当権を行使することができる（⟪同条2項後段⟫）。\n　けだし、後順位抵当権者は、先順位の共同抵当権の負担が各不動産の価額に応じて⟪割り付け⟫られることを前提に、そこに生ずる⟪余剰価値を期待⟫して抵当権の設定を受けているのが通常であり、先に実行された不動産が⟪どれかという偶然⟫によってその期待を害されるべきではないからである。","answers":["392条1項","同条2項後段","割り付け","余剰価値を期待","どれかという偶然"],"check":"","notes":[],"law":"","cites":["民法/392"],"rate":33,"designed":true,"ref":true,"hash":"02131cf5ba69"},{"id":"民法/共同抵当_392条#2","block":"第2〔債務者所有の不動産と物上保証人所有の不動産が共同抵当の目的である場合〕","kind":"cloze","masked":"　⦅392条2項は、目的不動産のすべてが同一の所有者に属する場合を前提とする規定であるから、物上保証人所有の不動産が含まれる場合には適用されない⦆⟨1⟩。この場合は⟦ア⟧の規律によって処理すべきものと解する。\n　1　物上保証人所有の不動産が先に実行されたときは、物上保証人は債務者に対する求償権を取得するとともに、その範囲で債権者に代位して債務者所有の不動産上の1番抵当権を取得する。⦅この物上保証人は、⟦イ⟧に優先すると解する⦆⟨2⟩。物上保証人は、⟦ウ⟧から他の共同抵当物件たる債務者所有の不動産から自己の求償権の満足を得ることを期待していたのであり、その期待は、⟦エ⟧によって失われるべきではないからである。\n　2　もっとも、物上保証人所有の不動産の後順位抵当権者は、物上保証人に移転した1番抵当権が自己の被担保債権をも担保するものとなる結果、あたかも右1番抵当権の上に⟦オ⟧をするのと同様に、その順位に従って優先弁済を受けることができると解する⟨3⟩。⦅この優先弁済権の主張に、⟦カ⟧⦆⟨4⟩。\n　3　これに対し、債務者所有の不動産が先に実行されたときは、被担保債権の消滅により⟦キ⟧によって物上保証人所有の不動産上の抵当権も消滅するから、⟦イ⟧が物上保証人所有の不動産上の1番抵当権に⟦ク⟧。","body":"　⦅392条2項は、目的不動産のすべてが同一の所有者に属する場合を前提とする規定であるから、物上保証人所有の不動産が含まれる場合には適用されない⦆⟨1⟩。この場合は⟪弁済による代位（499条・501条）⟫の規律によって処理すべきものと解する。\n　1　物上保証人所有の不動産が先に実行されたときは、物上保証人は債務者に対する求償権を取得するとともに、その範囲で債権者に代位して債務者所有の不動産上の1番抵当権を取得する。⦅この物上保証人は、⟪債務者所有の不動産の後順位抵当権者⟫に優先すると解する⦆⟨2⟩。物上保証人は、⟪共同抵当の設定時⟫から他の共同抵当物件たる債務者所有の不動産から自己の求償権の満足を得ることを期待していたのであり、その期待は、⟪共同抵当設定後に設定された後順位抵当権⟫によって失われるべきではないからである。\n　2　もっとも、物上保証人所有の不動産の後順位抵当権者は、物上保証人に移転した1番抵当権が自己の被担保債権をも担保するものとなる結果、あたかも右1番抵当権の上に⟪物上代位（372条・304条1項本文）⟫をするのと同様に、その順位に従って優先弁済を受けることができると解する⟨3⟩。⦅この優先弁済権の主張に、⟪登記も差押えも要しない⟫⦆⟨4⟩。\n　3　これに対し、債務者所有の不動産が先に実行されたときは、被担保債権の消滅により⟪付従性⟫によって物上保証人所有の不動産上の抵当権も消滅するから、債務者所有の不動産の後順位抵当権者が物上保証人所有の不動産上の1番抵当権に⟪代位することはできない⟫。","answers":["弁済による代位（499条・501条）","債務者所有の不動産の後順位抵当権者","共同抵当の設定時","共同抵当設定後に設定された後順位抵当権","物上代位（372条・304条1項本文）","登記も差押えも要しない","付従性","代位することはできない"],"check":"","notes":[{"n":1,"label":"大判昭4・1・30","case":"大判昭4・1・30（新聞2945号12頁）","gist":"392条2項は債務者所有の数個の不動産に共同抵当が設定された場合の規定であり、第三者所有の不動産が債務者所有の不動産とともに目的物となっている場合には適用されない"},{"n":2,"label":"最一小判昭44・7・3","case":"最一小判昭44・7・3（民集23巻8号1297頁）","gist":"共同抵当権者が物上保証人所有の乙の抵当権を放棄して債務者所有の甲の抵当権を実行した場合でも、先順位抵当権者に代位する物上保証人は甲の代価から債権全額の満足を受けられる。理由＝物上保証人の求償の期待は、後から設定された後順位抵当権に害されない"},{"n":3,"label":"最三小判昭53・7・4","case":"最三小判昭53・7・4（民集32巻5号785頁）","gist":"物上保証人所有不動産が先に競売されたとき、その後順位抵当権者は、物上保証人に移転した1番抵当権から優先弁済を受けられる（372条・304条1項本文の物上代位と同様）。登記・差押え不要"},{"n":4,"label":"最三小判昭53・7・4","case":"最三小判昭53・7・4（民集32巻5号785頁）","gist":"物上保証人所有不動産が先に競売されたとき、その後順位抵当権者は、物上保証人に移転した1番抵当権から優先弁済を受けられる（372条・304条1項本文の物上代位と同様）。登記・差押え不要"}],"law":"","cites":["民法/392","民法/499","民法/501","民法/372","民法/304"],"rate":8,"designed":true,"ref":false,"hash":"a64e74d01246"},{"id":"民法/共同抵当_392条#3","block":"第3〔目的不動産がすべて同一の物上保証人の所有に属する場合〕","kind":"cloze","masked":"　⦅この場合には、⟦ア⟧により、先に実行された不動産の後順位抵当権者は、先順位の共同抵当権者が同条1項に従い他の不動産から弁済を受けることができた金額に満つるまで、先順位の共同抵当権者に⟦イ⟧することができると解する⦆⟨1⟩。後順位抵当権者の余剰価値への期待を保護すべきことは債務者が自己所有の不動産に共同抵当を設定した場合と異ならず、他方、物上保証人は自己所有の他の不動産については⟦ウ⟧、⟦エ⟧として後順位抵当権の設定に応じているのだから、代位を認めても⟦オ⟧からである。\n　⦅なお、先順位の共同抵当権者が⟦カ⟧したときは、後順位抵当権者が代位し得た限度で、先に実行された不動産につき後順位抵当権者に⟦キ⟧⦆⟨2⟩。","body":"　⦅この場合には、⟪392条2項後段⟫により、先に実行された不動産の後順位抵当権者は、先順位の共同抵当権者が同条1項に従い他の不動産から弁済を受けることができた金額に満つるまで、先順位の共同抵当権者に⟪代位して他の不動産上の抵当権を行使⟫することができると解する⦆⟨1⟩。後順位抵当権者の余剰価値への期待を保護すべきことは債務者が自己所有の不動産に共同抵当を設定した場合と異ならず、他方、物上保証人は自己所有の他の不動産については⟪法定代位を生ずる余地がなく⟫、⟪割付けを前提⟫として後順位抵当権の設定に応じているのだから、代位を認めても⟪不測の損害を受けない⟫からである。\n　⦅なお、先順位の共同抵当権者が⟪代位の対象となる他の不動産上の抵当権を放棄⟫したときは、後順位抵当権者が代位し得た限度で、先に実行された不動産につき後順位抵当権者に⟪優先することができない⟫⦆⟨2⟩。","answers":["392条2項後段","代位して他の不動産上の抵当権を行使","法定代位を生ずる余地がなく","割付けを前提","不測の損害を受けない","代位の対象となる他の不動産上の抵当権を放棄","優先することができない"],"check":"","notes":[{"n":1,"label":"最二小判平4・11・6","case":"最二小判平4・11・6（民集46巻8号2625頁）","gist":"共同抵当の目的不動産がすべて同一の物上保証人所有の場合、後順位抵当権者は392条2項後段により先順位共同抵当権者に代位できる。先順位者が代位の対象たる抵当権を放棄したときは、代位し得た限度で後順位抵当権者に優先できず、超過分は不当利得となる"},{"n":2,"label":"最二小判平4・11・6","case":"最二小判平4・11・6（民集46巻8号2625頁）","gist":"共同抵当の目的不動産がすべて同一の物上保証人所有の場合、後順位抵当権者は392条2項後段により先順位共同抵当権者に代位できる。先順位者が代位の対象たる抵当権を放棄したときは、代位し得た限度で後順位抵当権者に優先できず、超過分は不当利得となる"}],"law":"","cites":["民法/392"],"rate":11,"designed":true,"ref":false,"hash":"b6d1a1fc3cbf"}],"setsurei":["GはSに対し4000万円の貸金債権αを有し、これを担保するため、物上保証人D所有の甲土地（評価額4000万円）とS所有の乙土地（評価額3000万円）に第1順位の共同抵当権の設定を受けた。その後、X1はDに対する2000万円の債権を担保するため甲土地に第2順位の抵当権の設定を受け、X2はSに対する1500万円の債権を担保するため乙土地に第2順位の抵当権の設定を受けた。 Gが甲土地の抵当権のみを実行し、売却代金4000万円からα債権全額の弁済を受けた。乙土地の売却代金3000万円は、D・X1・X2にどのように配当されるか。 （応用）逆に、**乙土地の評価額が5000万円であったとして**、Gが乙土地の抵当権のみを実行し、売却代金5000万円からα債権全額4000万円の満足を得ていた場合はどうか。 ※応用では乙土地の価額を差し替えている。本体の3000万円のままだと、乙土地だけで4000万円の債権を満足させることができず、設問が成り立たないため（**債務者所有不動産だけで全額回収できる場面**を作らないと、この応用の論点は生じない）。","GはSに対し4000万円の貸金債権αを有し、これを担保するため、物上保証人D所有の甲土地（評価額5000万円）と同じくD所有の乙土地（評価額3000万円）に第1順位の共同抵当権の設定を受けた。その後、X1はDに対する2000万円の債権を担保するため甲土地に第2順位の抵当権の設定を受けた。 Gが甲土地の抵当権のみを実行し、売却代金5000万円からα債権全額の弁済を受けた。X1はいくら回収できるか。 （応用）Gが甲土地の実行に先立って乙土地上の抵当権を放棄していた場合、GとX1の優劣はどうなるか。"],"full":"第1　目的不動産がすべて債務者の所有に属する場合\n　同時に代価を配当すべきときは、各不動産の価額に応じて債権の負担が按分される（⟪392条1項⟫）。ある不動産の代価のみを配当すべきときは、抵当権者はその代価から債権全部の弁済を受けられるが、次順位の抵当権者は、抵当権者が同項に従い他の不動産の代価から弁済を受けるべきであった金額を限度として、その抵当権者に代位して抵当権を行使することができる（⟪同条2項後段⟫）。\n　けだし、後順位抵当権者は、先順位の共同抵当権の負担が各不動産の価額に応じて⟪割り付け⟫られることを前提に、そこに生ずる⟪余剰価値を期待⟫して抵当権の設定を受けているのが通常であり、先に実行された不動産が⟪どれかという偶然⟫によってその期待を害されるべきではないからである。\n\n第2　債務者所有の不動産と物上保証人所有の不動産が共同抵当の目的である場合\n　⦅392条2項は、目的不動産のすべてが同一の所有者に属する場合を前提とする規定であるから、物上保証人所有の不動産が含まれる場合には適用されない⦆⟨1⟩。この場合は⟪弁済による代位（499条・501条）⟫の規律によって処理すべきものと解する。\n　1　物上保証人所有の不動産が先に実行されたときは、物上保証人は債務者に対する求償権を取得するとともに、その範囲で債権者に代位して債務者所有の不動産上の1番抵当権を取得する。⦅この物上保証人は、⟪債務者所有の不動産の後順位抵当権者⟫に優先すると解する⦆⟨2⟩。物上保証人は、⟪共同抵当の設定時⟫から他の共同抵当物件たる債務者所有の不動産から自己の求償権の満足を得ることを期待していたのであり、その期待は、⟪共同抵当設定後に設定された後順位抵当権⟫によって失われるべきではないからである。\n　2　もっとも、物上保証人所有の不動産の後順位抵当権者は、物上保証人に移転した1番抵当権が自己の被担保債権をも担保するものとなる結果、あたかも右1番抵当権の上に⟪物上代位（372条・304条1項本文）⟫をするのと同様に、その順位に従って優先弁済を受けることができると解する⟨3⟩。⦅この優先弁済権の主張に、⟪登記も差押えも要しない⟫⦆⟨4⟩。\n　3　これに対し、債務者所有の不動産が先に実行されたときは、被担保債権の消滅により⟪付従性⟫によって物上保証人所有の不動産上の抵当権も消滅するから、債務者所有の不動産の後順位抵当権者が物上保証人所有の不動産上の1番抵当権に⟪代位することはできない⟫。\n\n第3　目的不動産がすべて同一の物上保証人の所有に属する場合\n　⦅この場合には、⟪392条2項後段⟫により、先に実行された不動産の後順位抵当権者は、先順位の共同抵当権者が同条1項に従い他の不動産から弁済を受けることができた金額に満つるまで、先順位の共同抵当権者に⟪代位して他の不動産上の抵当権を行使⟫することができると解する⦆⟨1⟩。後順位抵当権者の余剰価値への期待を保護すべきことは債務者が自己所有の不動産に共同抵当を設定した場合と異ならず、他方、物上保証人は自己所有の他の不動産については⟪法定代位を生ずる余地がなく⟫、⟪割付けを前提⟫として後順位抵当権の設定に応じているのだから、代位を認めても⟪不測の損害を受けない⟫からである。\n　⦅なお、先順位の共同抵当権者が⟪代位の対象となる他の不動産上の抵当権を放棄⟫したときは、後順位抵当権者が代位し得た限度で、先に実行された不動産につき後順位抵当権者に⟪優先することができない⟫⦆⟨2⟩。","kata":"| # | 落としてはいけない要素 | 落ちやすさ |\n|---|---|---|\n| 1 | 同時配当＝各不動産の価額に応じて按分（**392条1項**） | 低 |\n| 2 | 異時配当＝抵当権者は全部弁済を受けられる／次順位者は**同時配当なら他の不動産から弁済を受けるべき金額を限度に**代位（**392条2項後段**） | 中（「限度」を落として「全額代位できる」と書きがち） |\n| 3 | 代位の趣旨＝割付け後の**余剰価値への期待**の保護／実行順という偶然で結論を変えない | 中 |\n| 4 | 混合型では**392条は適用されない**（同一所有者に属する場合の規定） | 高 |\n| 5 | 混合型は**弁済による代位（499条・501条）**で処理する（500条と書かない） | 高 |\n| 6 | 物上保証人 ＞ 債務者所有不動産の後順位抵当権者。理由＝**共同抵当設定時からの求償の期待**は、後から設定された後順位抵当権に害されない | 中 |\n| 7 | 物上保証人所有不動産の後順位抵当権者は、移転した1番抵当権に**物上代位するのと同様に**（**372条・304条1項本文**）優先弁済を受ける | 高（条文2つセットで出るか） |\n| 8 | その主張に**登記も差押えも不要** | 高 |\n| 9 | 債務者所有不動産が先に実行されたときは**付従性**で他方の抵当権も消滅し、債務者所有不動産の後順位抵当権者は代位できない | 高（逆パターンを問われると崩れる） |\n| 10 | 同一物上保証人型は**392条2項後段による**。理由＝期待は債務者所有の場合と同じ／物上保証人には**自己所有不動産について法定代位を生ずる余地がない**から不測の損害なし | 中 |\n| 11 | 先順位者が代位の対象たる抵当権を**放棄**したときは、代位し得た限度で後順位抵当権者に優先できない | 中 |\n\n**勝負どころ**：\n1. **誰が所有者かで規律が3つに分岐する**こと（全部債務者所有＝392条／混合＝代位／全部同一物上保証人＝392条2項後段）を、答案の冒頭で切り分けられるか。\n2. **どちらの不動産が先に実行されたか**で結論が逆転すること（設例1の応用）。\n3. 混合型で「物上代位するのと同様に」という**判例の言い回し**と、**登記・差押え不要**まで出せるか。\n\n> ⚠️ **間違えやすい点**：\n> - **弁済による代位の条文は現行法では499条・501条**。判例や古い教科書は「500条・501条」と書いているが、2020年4月施行の改正で500条は467条準用（対抗要件）の規定になり、正当な利益を有する者は500条の対象から除かれた（`CorpusDb/条文/民法/p0027.txt`）。答案で500条を引くと減点されうる。\n> - 392条2項の代位は「**抵当権者への代位**」であって「原債権者への代位」ではない（『プラクティス民法債権総論〔第5版補訂〕』p.408）。499条の弁済者代位と混同しない。\n> - 混合型（設例1）では**割付けによる上限がない**（物上保証人の求償権の範囲で丸ごと代位する）が、同一物上保証人型（設例2）では**割付額が上限**になる。ここを取り違えると配当額を間違える。\n> - 昭60判決が一部代位につき引用する「502条1項」は**改正前**のもの。現行502条1項は「債権者の同意を得て」権利行使できる旨に改められ、債権者優先は502条3項が明文化した。","hanrei":[["大判昭4・1・30（新聞2945号12頁）","392条2項は債務者所有の数個の不動産に共同抵当が設定された場合の規定であり、第三者所有の不動産が債務者所有の不動産とともに目的物となっている場合には適用されない","出典＝『体系別短答過去問題集 民法(上)』p.658、『伊藤真の速習短答過去問 民法』p.227、『民法判例百選Ⅰ〔第8版〕』p.203。**判例集の巻号は百選解説の記載による**"],["最一小判昭44・7・3（民集23巻8号1297頁）","共同抵当権者が物上保証人所有の乙の抵当権を放棄して債務者所有の甲の抵当権を実行した場合でも、先順位抵当権者に代位する物上保証人は甲の代価から債権全額の満足を受けられる。理由＝物上保証人の求償の期待は、後から設定された後順位抵当権に害されない","参照条文：392条・504条"],["最三小判昭53・7・4（民集32巻5号785頁）","物上保証人所有不動産が先に競売されたとき、その後順位抵当権者は、物上保証人に移転した1番抵当権から優先弁済を受けられる（372条・304条1項本文の物上代位と同様）。登記・差押え不要","参照条文：304条1項・351条・372条・392条2項・177条。大判昭11・12・9（民集15巻2172頁）を参照判例として引用"],["最一小判昭60・5・23（民集39巻4号940頁）","昭53判決の規律を確認。代位権不行使特約があっても、後順位抵当権者が物上保証人の取得した抵当権から優先弁済を受ける権利は左右されない。一部代位の場合、配当については債権者が優先する","**百選Ⅰ〔第9版〕91番（＝〔第8版〕**94番**・〔第7版〕91番）**。**第8版だけ3番ずれる**ので、蔵書を開くときは94番。一部代位の点は現行502条3項が明文化"],["最二小判平4・11・6（民集46巻8号2625頁）","共同抵当の目的不動産がすべて同一の物上保証人所有の場合、後順位抵当権者は392条2項後段により先順位共同抵当権者に代位できる。先順位者が代位の対象たる抵当権を放棄したときは、代位し得た限度で後順位抵当権者に優先できず、超過分は不当利得となる","**百選Ⅰ〔第9版〕92番（＝〔第8版〕**95番**・〔第7版〕92番）**。最判平3・3・22（民集45巻3号322頁）を参照判例として引用"]],"field":"抵当権","order":16},{"name":"共有（持分権に基づく請求・管理変更・共有物分割）","subject":"民法","rank":"A","path":"まとめ/民法/論証/共有（持分権に基づく請求・管理変更・共有物分割）.md","cards":[{"id":"民法/共有（持分権に基づく請求・管理変更・共有物分割）#1","block":"第1","kind":"cloze","masked":"共有物に⟪変更⟫を加えるには、他の共有者⟦ア⟧を要する（⟦イ⟧）。もっとも、⟦ウ⟧を伴わないもの（軽微変更）は変更から除かれ、管理として扱われる。\n共有物の⟪管理に関する事項⟫は、⟦エ⟧で決する（252条1項前段）。共有物を使用する共有者があるときも、同様である（同項後段）。\nただし、この決定が、共有者間の決定に基づいて共有物を使用する共有者に⟦オ⟧を及ぼすべきときは、その⟦カ⟧を得なければならない（252条3項）。\n⟪保存行為⟫は、⟦キ⟧ですることができる（252条5項）。共有者全員の利益になるからである。","body":"共有物に⟪変更⟫を加えるには、他の共有者⟪全員の同意⟫を要する（⟪251条1項⟫）。もっとも、⟪形状又は効用の著しい変更⟫を伴わないもの（軽微変更）は変更から除かれ、管理として扱われる。\n共有物の⟪管理に関する事項⟫は、⟪各共有者の持分の価格に従い、その過半数⟫で決する（252条1項前段）。共有物を使用する共有者があるときも、同様である（同項後段）。\nただし、この決定が、共有者間の決定に基づいて共有物を使用する共有者に⟪特別の影響⟫を及ぼすべきときは、その⟪承諾⟫を得なければならない（252条3項）。\n⟪保存行為⟫は、⟪各共有者が単独⟫ですることができる（252条5項）。共有者全員の利益になるからである。","answers":["全員の同意","251条1項","形状又は効用の著しい変更","各共有者の持分の価格に従い、その過半数","特別の影響","承諾","各共有者が単独"],"check":"変更＝**全員同意（251Ⅰ）**／**「形状又は効用の著しい変更を伴わないものを除く」（軽微変更）**／管理＝**持分の価格の過半数（252Ⅰ前段）**／**使用する共有者があるときも同様（252Ⅰ後段）**／**特別の影響→承諾（252Ⅲ）**／保存＝**単独（252Ⅴ）**","notes":[],"law":"","cites":["民法/251","民法/252"],"rate":30,"designed":true,"ref":true,"hash":"f3a8cfe41583"},{"id":"民法/共有（持分権に基づく請求・管理変更・共有物分割）#2","block":"第2〔第三者に対して〕","kind":"cloze","masked":"各共有者は、共有物の全部について、その持分に応じた使用をすることができる（⟦ア⟧）。したがって、第三者が共有物を不法に占有し、又は妨害しているときは、各共有者は⟦イ⟧、共有物の全部について明渡し又は妨害の排除を請求することができる。これは共有物の⟦ウ⟧（252条5項）にあたり、共有者全員でする必要がないからである。","body":"各共有者は、共有物の全部について、その持分に応じた使用をすることができる（⟪249条1項⟫）。したがって、第三者が共有物を不法に占有し、又は妨害しているときは、各共有者は⟪単独で⟫、共有物の全部について明渡し又は妨害の排除を請求することができる。これは共有物の⟪保存行為⟫（252条5項）にあたり、共有者全員でする必要がないからである。","answers":["249条1項","単独で","保存行為"],"check":"各共有者は**単独で共有物の全部**について明渡し・妨害排除可／根拠＝**249Ⅰ＋保存行為（252Ⅴ）**","notes":[],"law":"","cites":["民法/249","民法/252"],"rate":25,"designed":true,"ref":false,"hash":"5e4c7dbb129c"},{"id":"民法/共有（持分権に基づく請求・管理変更・共有物分割）#3","block":"第3〔共有者の一人が占有しているとき〕","kind":"cloze","masked":"⦅これに対し、共有者の一人が共有物を単独で占有している場合、他の共有者は、持分の価格の過半数を有していても、⟦ア⟧⦆⟨1⟩。占有する共有者もまた、⟦イ⟧を有し、これに基づいて占有しているからである（249条1項）。\nしたがって、⦅明渡しを求めるには、⟦ウ⟧を主張立証しなければならない⦆⟨2⟩。持分の価格の過半数によって、その共有者以外の者に使用させる旨の⟦エ⟧をしたことは、この「理由」に⟦オ⟧（252条1項後段）。\n⦅⟪共有者の一部から占有使用を承認された第三者⟫に対しても、同様である⦆⟨3⟩。","body":"⦅これに対し、共有者の一人が共有物を単独で占有している場合、他の共有者は、持分の価格の過半数を有していても、⟪当然にはその明渡しを請求することができない⟫⦆⟨1⟩。占有する共有者もまた、⟪自己の持分によって共有物を使用収益する権原⟫を有し、これに基づいて占有しているからである（249条1項）。\nしたがって、⦅明渡しを求めるには、⟪明渡しを求める理由⟫を主張立証しなければならない⦆⟨2⟩。持分の価格の過半数によって、その共有者以外の者に使用させる旨の⟪管理に関する決定⟫をしたことは、この「理由」に⟪あたる⟫（252条1項後段）。\n⦅⟪共有者の一部から占有使用を承認された第三者⟫に対しても、同様である⦆⟨3⟩。","answers":["当然にはその明渡しを請求することができない","自己の持分によって共有物を使用収益する権原","明渡しを求める理由","管理に関する決定","あたる"],"check":"**登記によって共有不動産に対する妨害状態が生じている**／**単独で抹消登記手続**請求可／自己の持分の登記が正しくても可","notes":[{"n":1,"label":"最一小判 昭和41・5・19","case":"**最一小判 昭和41・5・19**（民集20巻5号947頁）","gist":"多数持分権者も、共有物を現に占有する少数持分権者に対し**当然には明渡しを請求できない**。少数持分権者は自己の持分によって使用収益する権原を有するから。明渡しを求めるには**その理由を主張立証**しなければならない"},{"n":2,"label":"最一小判 昭和41・5・19","case":"**最一小判 昭和41・5・19**（民集20巻5号947頁）","gist":"多数持分権者も、共有物を現に占有する少数持分権者に対し**当然には明渡しを請求できない**。少数持分権者は自己の持分によって使用収益する権原を有するから。明渡しを求めるには**その理由を主張立証**しなければならない"},{"n":3,"label":"最判 昭和63・5・20","case":"最判 昭和63・5・20（判時1277号116頁）","gist":"共有者の一部から占有使用を**承認された第三者**に対しても、承認しなかった共有者は当然には明渡しを請求できない"}],"law":"","cites":["民法/249","民法/252"],"rate":14,"designed":true,"ref":false,"hash":"af6d2ec3915c"},{"id":"民法/共有（持分権に基づく請求・管理変更・共有物分割）#4","block":"第4〔使用の対価〕","kind":"cloze","masked":"共有物を使用する共有者は、⟦ア⟧、他の共有者に対し、⟦イ⟧を償還する義務を負う（⟦ウ⟧）。明渡しが認められない場合でも、他の共有者は、⟦エ⟧を請求することができる。","body":"共有物を使用する共有者は、⟪別段の合意がある場合を除き⟫、他の共有者に対し、⟪自己の持分を超える使用の対価⟫を償還する義務を負う（⟪249条2項⟫）。明渡しが認められない場合でも、他の共有者は、⟪自己の持分割合に応じた賃料相当額⟫を請求することができる。","answers":["別段の合意がある場合を除き","自己の持分を超える使用の対価","249条2項","自己の持分割合に応じた賃料相当額"],"check":"256Ⅰ本文いつでも／258Ⅰ協議不調・不能／**258Ⅱ①現物・②賠償**／**258Ⅲ競売は補充**（「できないとき、又は価格を著しく減少させるおそれ」）／全面的価格賠償＝**①相当性（5つの考慮要素）＋②実質的公平（適正評価・支払能力）の特段の事情**／理由＝**非訟事件・裁量**／**258の2Ⅰ遺産分割すべきときは258不可・Ⅱ10年経過で可**","notes":[],"law":"249条2項（使用の対価の償還。**令和3年改正で明文化**され、最判平12・4・7 の判例法理は決着済み）","cites":["民法/249"],"rate":42,"designed":true,"ref":false,"hash":"dc6bc254a346"},{"id":"民法/共有（持分権に基づく請求・管理変更・共有物分割）#5","block":"第3(1)〔登記名義人が全くの無権利者であるとき〕","kind":"cloze","masked":"各共有者は、その持分権に基づき、共有不動産に加えられた妨害を排除することができるところ、不実の持分移転登記がされている場合には、その登記によって共有不動産に対する⟦ア⟧といえる。したがって、⦅共有者の一人は、⟦イ⟧を請求することができる⦆⟨1⟩。自己の持分の登記が正しくされている場合であっても、その不実登記によって⟦ウ⟧などの事情があるときは、なお持分に対する妨害があるといえる。","body":"各共有者は、その持分権に基づき、共有不動産に加えられた妨害を排除することができるところ、不実の持分移転登記がされている場合には、その登記によって共有不動産に対する⟪妨害状態が生じている⟫といえる。したがって、⦅共有者の一人は、⟪単独でその登記の抹消登記手続⟫を請求することができる⦆⟨1⟩。自己の持分の登記が正しくされている場合であっても、その不実登記によって⟪共有不動産の処分が妨げられる⟫などの事情があるときは、なお持分に対する妨害があるといえる。","answers":["妨害状態が生じている","単独でその登記の抹消登記手続","共有不動産の処分が妨げられる"],"check":"**登記によって共有不動産に対する妨害状態が生じている**／**単独で抹消登記手続**請求可／自己の持分の登記が正しくても可","notes":[{"n":1,"label":"最二小判 平成15・7・11","case":"**最二小判 平成15・7・11**（民集57巻7号787頁）","gist":"不実の持分移転登記がされている場合、その登記によって**共有不動産に対する妨害状態が生じている**から、共有者の一人は**単独でその抹消登記手続を請求できる**"}],"law":"","cites":[],"rate":0,"designed":true,"ref":false,"hash":"dd2fc12154ad"},{"id":"民法/共有（持分権に基づく請求・管理変更・共有物分割）#6","block":"第3(2)〔共有者名義〕","kind":"cloze","masked":"これに対し、共有者の一人が自己単独名義の登記を経由している場合、その登記はその者の持分の限りでは⟦ア⟧する。また、他の共有者は⟦イ⟧妨害排除請求権を有するにすぎない。したがって、⦅請求できるのは登記の全部抹消ではなく、⟦ウ⟧に限られ⦆⟨1⟩、⦅請求していない他の共有者の持分についての更正までは求められない⦆⟨2⟩。","body":"これに対し、共有者の一人が自己単独名義の登記を経由している場合、その登記はその者の持分の限りでは⟪実体関係に符合⟫する。また、他の共有者は⟪自己の持分についてのみ⟫妨害排除請求権を有するにすぎない。したがって、⦅請求できるのは登記の全部抹消ではなく、⟪自己の持分についての更正登記手続⟫に限られ⦆⟨1⟩、⦅請求していない他の共有者の持分についての更正までは求められない⦆⟨2⟩。","answers":["実体関係に符合","自己の持分についてのみ","自己の持分についての更正登記手続"],"check":"**その者の持分の限りでは実体関係に符合**／**自己の持分についてのみ**妨害排除請求権／**更正登記手続に限られる**／他の共有者の持分までは求められない","notes":[{"n":1,"label":"最判 昭和38・2・22","case":"最判 昭和38・2・22","gist":"共有者の一人が単独名義の登記をした事案。他の共有者が請求できるのは**自己の持分についてのみの一部抹消（更正）登記手続**"},{"n":2,"label":"最判 平成22・4・20","case":"**最判 平成22・4・20*
