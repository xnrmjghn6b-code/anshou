属","共同相続人全員が共同して","相続分に相当する部分","有効となるものではない","信義則上許されない"],"check":"✗だが**それだけでは足りない** ／ **全員が共同行使**しなければ、**無権代理人の相続分についても**当然有効とならない ／ **その性質上不可分的に帰属**／条文は挙げない／全員追認なら全部帰属","notes":[{"n":1,"label":"最一小判平成5・1・21","case":"最一小判平成5・1・21 民集47巻1号265頁","gist":"追認権は性質上相続人全員に不可分的に帰属し、全員が共同行使しない限り、無権代理人の相続分についても当然有効とならない（追認不可分説）"}],"law":"","cites":[],"rate":0,"designed":true,"ref":false,"hash":"47c5203602cc"},{"id":"民法/無権代理と相続_資格の同一人帰属#3","block":"第3〔本人が無権代理人を相続した場合〕","kind":"cloze","masked":"逆に本人が無権代理人を相続した場合、本人は追認を拒絶できるか。\nこの場合も両資格は併存する。そして、本人は自ら無権代理行為をした者ではないから、追認を拒絶しても何ら⟦ア⟧。したがって、⦅無権代理行為は、相続により当然に有効となるものではなく、本人は⟦イ⟧⦆⟨1⟩。\nもっとも、⦅本人は、相続により無権代理人の⟦ウ⟧をも承継する⦆⟨2⟩。本人の資格で追認を拒絶しうる地位にあったからといって、この債務を免れることはできない。\nただし、相手方が「履行」を選択した場合において、その債務が⟦エ⟧を目的とするときは、履行責任まで負わせると追認拒絶を認めた意味が失われるから、本人は履行を拒み、⟦オ⟧を負うにとどまると解すべきである。","body":"逆に本人が無権代理人を相続した場合、本人は追認を拒絶できるか。\nこの場合も両資格は併存する。そして、本人は自ら無権代理行為をした者ではないから、追認を拒絶しても何ら⟪信義に反するところはない⟫。したがって、⦅無権代理行為は、相続により当然に有効となるものではなく、本人は⟪追認を拒絶することができる⟫⦆⟨1⟩。\nもっとも、⦅本人は、相続により無権代理人の⟪117条の債務⟫をも承継する⦆⟨2⟩。本人の資格で追認を拒絶しうる地位にあったからといって、この債務を免れることはできない。\nただし、相手方が「履行」を選択した場合において、その債務が⟪特定物の給付⟫を目的とするときは、履行責任まで負わせると追認拒絶を認めた意味が失われるから、本人は履行を拒み、⟪損害賠償責任⟫を負うにとどまると解すべきである。","answers":["信義に反するところはない","追認を拒絶することができる","117条の債務","特定物の給付","損害賠償責任"],"check":"**○**（自ら行為していない＝矛盾でない） ／ ただし**117条の債務は承継**。特定物の給付は履行を拒め、損害賠償にとどまる ／ 「拒絶可＋責任承継」の**二段構え**／特定物の例外","notes":[{"n":1,"label":"最二小判昭和37・4・20","case":"最二小判昭和37・4・20 民集16巻4号955頁","gist":"無権代理人が本人を相続した場合は信義則上追認拒絶の余地がなく当然有効となるが、**本人が無権代理人を相続した場合はこれと同様に論じられず**、追認を拒絶しても何ら信義に反しないから、当然有効となるものではない"},{"n":2,"label":"最二小判昭和48・7・3","case":"最二小判昭和48・7・3 民集27巻7号751頁","gist":"117条の債務は相続の対象となり、本人は追認拒絶しうる地位にあったことを理由にこれを免れない（無権代理人を共同相続した場合も同じ）"}],"law":"","cites":["民法/117"],"rate":1,"designed":true,"ref":false,"hash":"88703b318e78"},{"id":"民法/無権代理と相続_資格の同一人帰属#4","block":"第4〔本人が追認を拒絶した後に相続が生じた場合〕","kind":"cloze","masked":"本人が追認を拒絶すれば、無権代理行為の効果が本人に及ばないことが⟦ア⟧し、その後は本人であっても⟦イ⟧。\n⦅この効果は、その後に無権代理人が本人を相続したことによって影響を受けるものではなく、相続した無権代理人が追認拒絶の効果を主張することも、それ自体が⟦ウ⟧⦆⟨1⟩。","body":"本人が追認を拒絶すれば、無権代理行為の効果が本人に及ばないことが⟪確定⟫し、その後は本人であっても⟪追認によって有効とすることはできない⟫。\n⦅この効果は、その後に無権代理人が本人を相続したことによって影響を受けるものではなく、相続した無権代理人が追認拒絶の効果を主張することも、それ自体が⟪信義則に反するものではない⟫⦆⟨1⟩。","answers":["確定","追認によって有効とすることはできない","信義則に反するものではない"],"check":"拒絶の効果が確定・覆らない ／ 相続しても有効にならない。効果主張も信義則違反でない ／ **効果不帰属の確定**","notes":[{"n":1,"label":"最二小判平成10・7・17","case":"最二小判平成10・7・17 民集52巻5号1296頁","gist":"追認拒絶により効果不帰属が確定した後は、無権代理人が本人を相続しても覆らず、拒絶の効果を主張しても信義則に反しない"}],"law":"","cites":[],"rate":0,"designed":true,"ref":false,"hash":"3e1644cec2d1"},{"id":"民法/無権代理と相続_資格の同一人帰属#5","block":"第5〔第三者が無権代理人と本人を順次相続した場合〕","kind":"cloze","masked":"⦅第三者が⟦ア⟧を承継した後にさらに本人を相続した場合、その者は⟦ア⟧を⟦イ⟧している以上、自ら無権代理行為をしていないとしても、本人の資格で追認を拒絶する⟦ウ⟧⦆⟨1⟩。","body":"⦅第三者が無権代理人の地位を承継した後にさらに本人を相続した場合、その者は⟪無権代理人の地位⟫を⟪包括的に承継⟫している以上、自ら無権代理行為をしていないとしても、本人の資格で追認を拒絶する⟪余地はない⟫⦆⟨1⟩。","answers":["無権代理人の地位","包括的に承継","余地はない"],"check":"無権代理人 → 本人の順なら **✗** ／ 無権代理人の地位を包括承継している以上、自ら行為していなくても同じ ／ 包括承継／**順序で結論が変わる**","notes":[{"n":1,"label":"最判昭和63・3・1","case":"最判昭和63・3・1 家月41巻10号104頁","gist":"無権代理人の地位を包括承継した者は、その後本人を相続しても本人の資格で追認拒絶する余地はない。自ら無権代理行為をしていないことは理由にならない"}],"law":"","cites":[],"rate":0,"designed":true,"ref":false,"hash":"73ea992169fc"}],"setsurei":["Aは、B所有の甲土地について何らの代理権もないのに、Bの代理人と称してCに甲土地を売却した。次の各場合において、Cは甲土地の所有権移転登記を得られるか。 1. その後Bが死亡し、**AがBを単独相続**した場合 2. 1で、AがBの妻Dとともに**共同相続**した場合（Dは追認を拒んでいる） 3. 逆に、先にAが死亡し、**BがAを相続**した場合。Bが追認を拒絶したとき、CはBに何を請求できるか 4. Bが生前にすでに**追認を拒絶していた**場合","Eは、母F名義の乙建物について代理権がないのに、Fの代理人と称してGに乙建物を売却し、代金を受け取った。その後、Eが死亡してその子Jが単独でEを相続し、さらにFが死亡してJがFをも相続した。 1. Jは、本人Fの資格で追認を拒絶し、Gの移転登記請求を拒めるか。 2. これに対し、**先にFが死亡してJがFを相続し、その後にEが死亡してJがEを相続した**場合はどうか。 3. 仮にFが生前に追認を拒絶していた場合、1の結論は変わるか。"],"full":"無権代理行為は、本人がその追認をしなければ本人に対して効力を生じない（⟪113条1項⟫）。もっとも、無権代理人が本人を相続し、両資格が同一人に帰属した場合に、なお本人の資格で追認を拒絶しうるかが問題となる。\nこの点、相続によって両資格は融合せず⟪併存する⟫と解すべきである。相続という偶然の事情によって、相手方の取消権（115条）や無権代理人の責任（117条）の帰趨まで当然に変動させるべきではないからである。\nしかし、自ら無権代理行為をしておきながら、本人の資格において追認を拒絶することは、相手方に対する自己の⟪先行行為に矛盾⟫する態度であって、⟪信義則⟫上許されない（1条2項）。\nしたがって、⦅無権代理人は⟪追認を拒絶することができず⟫、無権代理行為は本人が自ら法律行為をしたのと同様に扱われる⦆⟨1⟩。\n\nもっとも、共同相続の場合には、無権代理行為をしていない他の共同相続人の追認拒絶権をも考慮しなければならない。\n無権代理行為を追認する権利は、その性質上、相続人全員に⟪不可分的に帰属⟫する。追認は、本人に対して効力を生じていなかった法律行為を本人に対する関係において有効なものにするという効果を生じさせるものだからである。\nそこで、⦅⟪共同相続人全員が共同して⟫追認権を行使しない限り、無権代理行為は、無権代理人の⟪相続分に相当する部分⟫においても、当然に⟪有効となるものではない⟫と解する⦆⟨1⟩。\nもっとも、他の共同相続人全員が追認をしている場合に、無権代理人だけが追認を拒絶することは⟪信義則上許されない⟫。この場合には、無権代理行為の効果は本人の地位を承継した者の全部に帰属する。\n\n逆に本人が無権代理人を相続した場合、本人は追認を拒絶できるか。\nこの場合も両資格は併存する。そして、本人は自ら無権代理行為をした者ではないから、追認を拒絶しても何ら⟪信義に反するところはない⟫。したがって、⦅無権代理行為は、相続により当然に有効となるものではなく、本人は⟪追認を拒絶することができる⟫⦆⟨1⟩。\nもっとも、⦅本人は、相続により無権代理人の⟪117条の債務⟫をも承継する⦆⟨2⟩。本人の資格で追認を拒絶しうる地位にあったからといって、この債務を免れることはできない。\nただし、相手方が「履行」を選択した場合において、その債務が⟪特定物の給付⟫を目的とするときは、履行責任まで負わせると追認拒絶を認めた意味が失われるから、本人は履行を拒み、⟪損害賠償責任⟫を負うにとどまると解すべきである。\n\n本人が追認を拒絶すれば、無権代理行為の効果が本人に及ばないことが⟪確定⟫し、その後は本人であっても⟪追認によって有効とすることはできない⟫。\n⦅この効果は、その後に無権代理人が本人を相続したことによって影響を受けるものではなく、相続した無権代理人が追認拒絶の効果を主張することも、それ自体が⟪信義則に反するものではない⟫⦆⟨1⟩。\n\n⦅第三者が無権代理人の地位を承継した後にさらに本人を相続した場合、その者は⟪無権代理人の地位⟫を⟪包括的に承継⟫している以上、自ら無権代理行為をしていないとしても、本人の資格で追認を拒絶する⟪余地はない⟫⦆⟨1⟩。","kata":"","hanrei":[["大判昭和2・3・22 民集6巻106頁","両資格が同一人に帰した場合、本人が自ら法律行為をしたのと同様になる（資格融合）","無権代理人が本人を単独相続 ／ 百選未収録"],["最判昭和40・6・18 民集19巻4号986頁","同上。「本人と代理人の資格が同一人に帰するに至った場合には、本人が自ら法律行為をしたのと同様な法律上の地位を生じたものとなる」","同上 ／ 百選未収録"],["最二小判昭和37・4・20 民集16巻4号955頁","無権代理人が本人を相続した場合は信義則上追認拒絶の余地がなく当然有効となるが、**本人が無権代理人を相続した場合はこれと同様に論じられず**、追認を拒絶しても何ら信義に反しないから、当然有効となるものではない","**本人**が無権代理人を相続 ／ **百選Ⅰ〔第9版〕32番＝〔第8版〕35番**（第8版72頁・解説 前田陽一）"],["最二小判昭和48・7・3 民集27巻7号751頁","117条の債務は相続の対象となり、本人は追認拒絶しうる地位にあったことを理由にこれを免れない（無権代理人を共同相続した場合も同じ）","本人が無権代理人を相続 ／ 百選未収録"],["最一小判平成5・1・21 民集47巻1号265頁","追認権は性質上相続人全員に不可分的に帰属し、全員が共同行使しない限り、無権代理人の相続分についても当然有効とならない（追認不可分説）","無権代理人が本人を共同相続 ／ **百選Ⅰ〔第9版〕33番＝〔第8版〕36番**（第8版74頁・解説 第9版は髙秀成／第8版は後藤巻則）"],["最二小判平成10・7・17 民集52巻5号1296頁","追認拒絶により効果不帰属が確定した後は、無権代理人が本人を相続しても覆らず、拒絶の効果を主張しても信義則に反しない","追認拒絶後に無権代理人が本人を相続 ／ 百選未収録"],["最判昭和63・3・1 家月41巻10号104頁","無権代理人の地位を包括承継した者は、その後本人を相続しても本人の資格で追認拒絶する余地はない。自ら無権代理行為をしていないことは理由にならない","第三者が無権代理人 → 本人の順に相続 ／ 百選未収録。学説は相続順序で結論が変わる点を批判"],["最大判昭和49・9・4 民集28巻6号1169頁","権利者は相続後も権利移転につき諾否の自由を保有し、信義則に反する特別の事情のない限り、売主としての履行義務を拒否できる","（参考）他人物売買の売主を権利者が相続 ／ 本人相続型で「履行」を拒めるかの参考。本人相続型の履行選択を直接扱った判例は存在しない"]],"field":"代理","order":5},{"name":"物権的請求権","subject":"民法","rank":"B","path":"まとめ/民法/論証/物権的請求権.md","cards":[{"id":"民法/物権的請求権#1","block":"第1〔根拠と3類型〕","kind":"cloze","masked":"物権的請求権については明文の規定がない。しかし、物権は物を⟦ア⟧であるから、その円満な支配状態が侵害され、又は侵害されるおそれがある場合には、物権の効力として当然にその⟦イ⟧できると解する。⟦ウ⟧が占有の訴えとは別に「本権の訴え」を認めているのも、これを前提とするものである。\nそして、その態様は、侵害の態様に応じて、(1) 他人の⟦エ⟧によって物権が侵害されている場合の⟪返還請求権⟫、(2) ⟦オ⟧の方法によって侵害されている場合の⟪妨害排除請求権⟫、(3) ⟦カ⟧がある場合の⟪妨害予防請求権⟫の3つに分かれる。","body":"物権的請求権については明文の規定がない。しかし、物権は物を⟪直接排他的に支配する権利⟫であるから、その円満な支配状態が侵害され、又は侵害されるおそれがある場合には、物権の効力として当然にその⟪除去又は予防を請求⟫できると解する。⟪202条1項⟫が占有の訴えとは別に「本権の訴え」を認めているのも、これを前提とするものである。\nそして、その態様は、侵害の態様に応じて、(1) 他人の⟪占有⟫によって物権が侵害されている場合の⟪返還請求権⟫、(2) ⟪占有以外⟫の方法によって侵害されている場合の⟪妨害排除請求権⟫、(3) ⟪侵害のおそれ⟫がある場合の⟪妨害予防請求権⟫の3つに分かれる。","answers":["直接排他的に支配する権利","除去又は予防を請求","202条1項","占有","占有以外","侵害のおそれ"],"check":"","notes":[],"law":"","cites":["民法/202"],"rate":3,"designed":true,"ref":false,"hash":"b2b76a14be2d"},{"id":"民法/物権的請求権#2","block":"第2〔要件と相手方〕","kind":"cloze","masked":"⦅物権的請求権は、⟦ア⟧又はそのおそれがあれば足り、相手方の⟦イ⟧は要件とならない⦆⟨1⟩。物権の円満な支配状態の回復を目的とする権利だからである。\nしたがって相手方は、⟦ウ⟧し、これを⟦エ⟧であり、侵害の原因を作った者である必要はない。\nもっとも、⦅他人の土地上の建物の所有権を取得した者が⟪自らの意思に基づいて⟫所有権取得の登記を経由した場合には、その建物を他に譲渡しても、⟦オ⟧、土地所有者に対して⟦カ⟧と解する⦆⟨2⟩。実質的所有者の探求を土地所有者に強いるのは酷であり、登記名義を保有しながら所有権の喪失を主張することは⟦キ⟧からである。","body":"⦅物権的請求権は、⟪客観的に違法な侵害状態⟫又はそのおそれがあれば足り、相手方の⟪故意・過失や責任能力⟫は要件とならない⦆⟨1⟩。物権の円満な支配状態の回復を目的とする権利だからである。\nしたがって相手方は、⟪現に違法な侵害状態を支配⟫し、これを⟪除去しうべき地位にある者⟫であり、侵害の原因を作った者である必要はない。\nもっとも、⦅他人の土地上の建物の所有権を取得した者が⟪自らの意思に基づいて⟫所有権取得の登記を経由した場合には、その建物を他に譲渡しても、⟪引き続き登記名義を保有する限り⟫、土地所有者に対して⟪建物収去土地明渡義務を免れない⟫と解する⦆⟨2⟩。実質的所有者の探求を土地所有者に強いるのは酷であり、登記名義を保有しながら所有権の喪失を主張することは⟪信義に反し公平を欠く⟫からである。","answers":["客観的に違法な侵害状態","故意・過失や責任能力","現に違法な侵害状態を支配","除去しうべき地位にある者","引き続き登記名義を保有する限り","建物収去土地明渡義務を免れない","信義に反し公平を欠く"],"check":"","notes":[{"n":1,"label":"大判昭和12・11・19","case":"大判昭和12・11・19 民集16巻1881頁","gist":"所有権の円満な状態が侵害されるおそれが生じたときは、所有権の効力として、**現に危険を生じさせつつある者**に対しその危険の防止を請求できる。侵害・危険が**自己の行為に基づくかを問わず、故意過失の有無も問わない**。ただし侵害・危険が**不可抗力に基因する場合**、または被害者が侵害を認容すべき義務を負う場合は除く"},{"n":2,"label":"最判平成6・2・8","case":"最判平成6・2・8 民集48巻2号373頁","gist":"建物収去土地明渡しの相手方は「現実に建物を所有することによってその土地を占拠し、土地所有権を侵害している者」。**もっとも、自らの意思に基づいて所有権取得の登記を経由した者は、建物を他に譲渡しても、引き続き登記名義を保有する限り**、収去・明渡義務を免れない"}],"law":"","cites":[],"rate":0,"designed":true,"ref":false,"hash":"b4be5d5d1579"},{"id":"民法/物権的請求権#3","block":"第3〔費用負担〕","kind":"cloze","masked":"物権的請求権の内容は、侵害者に対して侵害除去に必要な行為を請求する権利（⟦ア⟧）であると解する。したがって除去に要する費用は⟦イ⟧する。\n物権的請求権は、侵害状態を作り出したことについての責任ではなく、⟦ウ⟧についての責任だからである。","body":"物権的請求権の内容は、侵害者に対して侵害除去に必要な行為を請求する権利（⟪行為請求権⟫）であると解する。したがって除去に要する費用は⟪相手方が負担⟫する。\n物権的請求権は、侵害状態を作り出したことについての責任ではなく、⟪自己の所有物によって現に侵害状態を継続していること⟫についての責任だからである。","answers":["行為請求権","相手方が負担","自己の所有物によって現に侵害状態を継続していること"],"check":"","notes":[],"law":"","cites":[],"rate":0,"designed":true,"ref":false,"hash":"46bcffcae38e"}],"setsurei":["B所有の乙土地に生育していた樹木が、台風により隣接するA所有の甲土地に倒れ込んだ。 (1) AはBに対し、樹木の撤去を請求できるか。撤去費用は誰が負担するか。 (2) 逆にBがAに対し、樹木の所有権に基づいて樹木の返還を請求してきた場合、Aは応じなければならないか。費用はどうなるか。","A所有の甲土地上に、Bが無権原で乙建物を建て、自らの意思に基づいて乙建物の所有権保存登記を経由した。その後BはCに乙建物を売却したが、所有権移転登記は経由されず、登記名義はBのままである。Cは乙建物をDに賃貸し、C自身は乙建物に住んでいない。 Aは、B・C・Dの誰に対して、どのような請求ができるか。"],"full":"物権的請求権については明文の規定がない。しかし、物権は物を⟪直接排他的に支配する権利⟫であるから、その円満な支配状態が侵害され、又は侵害されるおそれがある場合には、物権の効力として当然にその⟪除去又は予防を請求⟫できると解する。⟪202条1項⟫が占有の訴えとは別に「本権の訴え」を認めているのも、これを前提とするものである。\nそして、その態様は、侵害の態様に応じて、(1) 他人の⟪占有⟫によって物権が侵害されている場合の⟪返還請求権⟫、(2) ⟪占有以外⟫の方法によって侵害されている場合の⟪妨害排除請求権⟫、(3) ⟪侵害のおそれ⟫がある場合の⟪妨害予防請求権⟫の3つに分かれる。\n\n⦅物権的請求権は、⟪客観的に違法な侵害状態⟫又はそのおそれがあれば足り、相手方の⟪故意・過失や責任能力⟫は要件とならない⦆⟨1⟩。物権の円満な支配状態の回復を目的とする権利だからである。\nしたがって相手方は、⟪現に違法な侵害状態を支配⟫し、これを⟪除去しうべき地位にある者⟫であり、侵害の原因を作った者である必要はない。\nもっとも、⦅他人の土地上の建物の所有権を取得した者が⟪自らの意思に基づいて⟫所有権取得の登記を経由した場合には、その建物を他に譲渡しても、⟪引き続き登記名義を保有する限り⟫、土地所有者に対して⟪建物収去土地明渡義務を免れない⟫と解する⦆⟨2⟩。実質的所有者の探求を土地所有者に強いるのは酷であり、登記名義を保有しながら所有権の喪失を主張することは⟪信義に反し公平を欠く⟫からである。\n\n物権的請求権の内容は、侵害者に対して侵害除去に必要な行為を請求する権利（⟪行為請求権⟫）であると解する。したがって除去に要する費用は⟪相手方が負担⟫する。\n物権的請求権は、侵害状態を作り出したことについての責任ではなく、⟪自己の所有物によって現に侵害状態を継続していること⟫についての責任だからである。","kata":"| # | 落としてはいけない要素 | 判定の目安 |\n|---|---|---|\n| 1 | **明文がない**ことに触れる | 落とすと問題提起が立たない |\n| 2 | 根拠＝物権の**直接排他的支配権**という性質 | 幹 |\n| 3 | 根拠条文＝**202条1項**「本権の訴え」 | Bランクでも項まで言えれば5 |\n| 4 | 3類型＝返還／妨害排除／妨害予防 | 幹（1つでも落ちたら3以下） |\n| 5 | 3類型の**振り分け基準＝占有による侵害か否か** | 名前だけ挙げて基準が無ければ4 |\n| 6 | 要件＝**客観的に違法な**侵害状態（又はそのおそれ） | 幹 |\n| 7 | **故意・過失は不要** | 幹 |\n| 8 | 相手方＝**現に侵害状態を支配し除去しうる者**（原因者でなくてよい） | 幹 |\n| 9 | 登記名義人の例外：**「自らの意思に基づく登記」＋「登記名義の保有継続」の2つ** | 片方だけなら4（要件のすり替え） |\n| 10 | 費用＝**行為請求権説→相手方負担** | 幹 |\n| 11 | 費用の理由＝**侵害状態を作った責任ではなく、自己の物で継続している責任** | Bランクでは文言不問。趣旨が言えれば5 |\n\n**勝負どころ**：\n1. **3類型の振り分けを「占有による侵害か否か」で言い切れるか。**不実の登記の抹消が妨害排除請求権であることまで出れば十分。\n2. **相手方を「原因者」と言わずに「現に侵害状態を支配する者」と言えるか。**ここを外すと、譲渡事例・自然力事例で全部間違える。\n3. **費用負担で「双方的侵害はそもそも生じない」と返せるか。**旧司H7-1型の設問はここを聞いている。\n\n> ⚠️ **間違えやすい点**\n> - **返還請求権と妨害排除請求権の取り違え。**「土地上に置かれた物の撤去」は占有侵奪ではないので**妨害排除**。「土地上の建物の収去」は建物所有者が土地を占拠しているので**返還請求権（建物収去土地明渡請求）**。区別の軸は「請求者が占有を失っているか」。\n> - **「登記名義人だから相手方になる」と短絡しない**（上記チェック9）。最判昭和35・6・17・最判昭和47・12・7で相手方にならない類型がある。\n> - **「判例は不可抗力なら物権的請求権を認めない」と一般化しない**（百選〔第9版〕46番解説の射程限定を参照）。\n> - **抵当権に返還請求権はない**（占有を内容とする権利ではないため）。所有権のノリで書かない。\n> - 202条は**1項**。2項（占有の訴えについて本権に関する理由に基づいて裁判できない）を引かない。","hanrei":[["大判昭和12・11・19 民集16巻1881頁","所有権の円満な状態が侵害されるおそれが生じたときは、所有権の効力として、**現に危険を生じさせつつある者**に対しその危険の防止を請求できる。侵害・危険が**自己の行為に基づくかを問わず、故意過失の有無も問わない**。ただし侵害・危険が**不可抗力に基因する場合**、または被害者が侵害を認容すべき義務を負う場合は除く","**民法Ⅰ百選〔第9版〕46番**（旧第7版48番・旧第8版50番）。妨害予防請求権を初めて一般的に承認。相手方は侵害地の**現所有者**（譲受人）。責任能力も不要（短答頻出）"],["最判平成6・2・8 民集48巻2号373頁","建物収去土地明渡しの相手方は「現実に建物を所有することによってその土地を占拠し、土地所有権を侵害している者」。**もっとも、自らの意思に基づいて所有権取得の登記を経由した者は、建物を他に譲渡しても、引き続き登記名義を保有する限り**、収去・明渡義務を免れない","**民法Ⅰ百選〔第9版〕47番**（旧第7版49番・旧第8版51番）。理由＝「対抗関係にも似た関係」＋実質的所有者の探求困難＋信義則・公平。**対抗の論理を持ち出した点には学説の批判が強い**（横山美夏解説）"],["最判昭和35・6・17 民集14巻8号1396頁","未登記建物を未登記のまま譲渡した者は、その意思に基づかずに譲渡人名義の登記がされても、建物所有権の喪失により土地を占有していないことを主張できる","平成6年判決が原則として引用。**この事案の登記は裁判所の嘱託による**もので譲渡人の意思に基づかない"],["最判昭和47・12・7 民集26巻10号1829頁","実際に建物を所有したことがなく、単に自己名義の登記を有するにすぎない者は、収去・明渡義務を負わない","平成6年判決が引用（仮装の保存登記の事案）"],["大判昭和13・1・28","物権の円満な支配状態は間接占有によっても侵害されるから、**間接占有者も返還請求権の相手方**となる（181条）","短答頻出。土地所有者は建物賃貸人（＝建物所有者）にも建物収去土地明渡しを請求できる"],["大判昭和11・3・13","他人の土地に無権原で建物を所有する者は、**そこに居住して土地を現実に占拠しているか否かを問わず**、建物収去土地明渡請求の相手方になる","出典＝『伊藤真の速習短答過去問 民法』p.171"],["大判昭和5・10・31 民集9巻1009頁","建物賃借人が賃借建物内に備え付けた他人（C）所有の機械を賃貸借終了後も放置した事案で、建物所有者はその**機械の所有者Cに対しても撤去を請求できる**","行為請求権説の前提となる判例。最判平成21・3・10 もこの考えを前提とする"],["最判平成21・3・10 民集63巻3号385頁","立替払により所有権を留保した者は、**残債務弁済期の経過後**は、留保所有権が担保権の性質を有することを理由に撤去義務を免れない","**民法Ⅰ百選〔第9版〕99番**（旧第7版100番・旧第8版101番）。譲渡担保権者・リース業者にも及ぶ"],["最判昭和25・12・19","不法占有者は177条の「第三者」に該当せず、これに対しては**登記がなくても**所有権の取得を対抗できる","**民法Ⅰ百選〔第9版〕56番**。物権的請求権の行使に登記が要るかという入口の論点"],["最判昭和28・12・18 民集7巻12号1515頁","対抗要件を備えた不動産賃借人は、第三者の占有に対し**妨害排除**を請求できる（建物収去土地明渡請求事件）","**民法百選Ⅱ〔第9版〕50番**（＝〔第8版〕57番）。現行法では**605条の4第1号**（妨害の停止）。DBが妨害停止側の判例として一貫して挙げるのはこちら"],["最判昭和30・4・5","対抗要件を備えた不動産賃借人は、**返還請求権**を行使できる","現行法では**605条の4第2号**（返還）が明文化（2020年施行）。答案では条文を引く。⚠️ **民集の巻号頁はDBで確認できなかったので書かない**（同日付で別事件〔民集9巻4号439頁〕がDBにあり、取り違えの危険がある）。また**妨害排除まで含めて引かない**——DBが確認できるのは返還請求権のみ"],["大判昭和7・11・9 民集11巻2277頁","侵害の危険が自然力に基づく場合には妨害予防請求が認められないことを示唆","百選〔第9版〕46番解説が引用。**同解説はこれも隣地崩落型の事案であるとして射程を限定する**"],["東京高判昭和51・4・28 判時820号67頁","高位の土地の一部が台風をきっかけに崩落しても、もともと急斜面で崩れやすい土地なら「不可抗力」によるものではない。そのうえで223条・226条等を類推し、**上下双方の土地所有者が費用を折半**して予防措置を取るべきとした","下級審。費用負担の原則（相手方負担）に相隣関係の理念で修正を加えた例"]],"field":"物権総論・物権的請求権","order":7},{"name":"留置権の第三者対抗力_債務者からの譲受人","subject":"民法","rank":"A","path":"まとめ/民法/論証/留置権の第三者対抗力_債務者からの譲受人.md","cards":[{"id":"民法/留置権の第三者対抗力_債務者からの譲受人#1","block":"第1〔牽連性（入口）〕","kind":"cloze","masked":"留置権が成立するには、債権がその物に関して生じたこと、すなわち物と債権との⟦ア⟧が必要である（⟦イ⟧）。\n牽連性が認められるのは、(1) ⟦ウ⟧、または (2) 債権が物の返還請求権と⟦エ⟧もしくは⟦オ⟧から生じた場合である。","body":"留置権が成立するには、債権がその物に関して生じたこと、すなわち物と債権との⟪牽連性⟫が必要である（⟪295条1項本文⟫）。\n牽連性が認められるのは、(1) ⟪債権が物自体から生じた場合⟫、または (2) 債権が物の返還請求権と⟪同一の法律関係⟫もしくは⟪同一の生活関係⟫から生じた場合である。","answers":["牽連性","295条1項本文","債権が物自体から生じた場合","同一の法律関係","同一の生活関係"],"check":"牽連性の2基準〔(1)**物自体から** (2)**同一の法律関係・生活関係**から〕／**295条1項本文**","notes":[],"law":"","cites":["民法/295"],"rate":5,"designed":true,"ref":false,"hash":"ca3453a7e1a1"},{"id":"民法/留置権の第三者対抗力_債務者からの譲受人#2","block":"第2〔第三者への対抗（本論）〕","kind":"cloze","masked":"次に、被担保債権の債務者はもとの所有者であり、引渡しを求める第三者はその債務者ではない。そこで、留置権を第三者に対抗できるかが問題となる。\n⦅⟦ア⟧であるから、留置権が成立した後に債務者からその目的物を譲り受けた者に対しても、留置権を⟦イ⟧⦆⟨1⟩。\n⟦ウ⟧は、留置権の行使を妨げない。\n実質的にも、これを認めなければ、⟦エ⟧容易に留置権者の債権の実現を⟦オ⟧、不当だからである。","body":"次に、被担保債権の債務者はもとの所有者であり、引渡しを求める第三者はその債務者ではない。そこで、留置権を第三者に対抗できるかが問題となる。\n⦅⟪留置権は物権⟫であるから、留置権が成立した後に債務者からその目的物を譲り受けた者に対しても、留置権を⟪主張することができる⟫⦆⟨1⟩。\n⟪第三者が被担保債務の支払義務を負う者ではないこと⟫は、留置権の行使を妨げない。\n実質的にも、これを認めなければ、⟪債務者は目的物を第三者に譲渡するだけで⟫容易に留置権者の債権の実現を⟪不確実なものとすることができ⟫、不当だからである。","answers":["留置権は物権","主張することができる","第三者が被担保債務の支払義務を負う者ではないこと","債務者は目的物を第三者に譲渡するだけで","不確実なものとすることができ"],"check":"**「留置権が物権であることに照らして明らか」**／支払義務を負わない第三者でも障害にならない／実質＝**譲渡するだけで債権実現を不確実にできるのは不当**","notes":[{"n":1,"label":"最一小判昭和47・11・16","case":"最一小判昭和47・11・16 民集26巻9号1619頁","gist":"留置権成立後に債務者から目的物を譲り受けた者に対しても留置権を主張できる（物権であることから明らか）。第三者が支払義務を負わないことは障害にならない。主文は「債務者から支払を受けるのと引換えに」明渡しを命ずる"}],"law":"","cites":[],"rate":0,"designed":true,"ref":false,"hash":"bd2a78b84c26"},{"id":"民法/留置権の第三者対抗力_債務者からの譲受人#3","block":"第3〔判決の主文（出口）〕","kind":"cloze","masked":"もっとも、留置権の抗弁が認められる場合、⟦ア⟧。物の引渡しを求める訴訟において留置権の抗弁が理由のあるときは、引渡請求を棄却することなく、その物に関して生じた⟦イ⟧である。\nそして⦅被告が支払義務を負わない第三者である場合には、⟦ウ⟧引渡しを命ずることとなる⦆⟨1⟩。原告を敗訴させなくとも、⟦エ⟧という留置権の目的は⟦オ⟧によって十分に達成できるからである。","body":"もっとも、留置権の抗弁が認められる場合、⟪請求を棄却すべきではない⟫。物の引渡しを求める訴訟において留置権の抗弁が理由のあるときは、引渡請求を棄却することなく、その物に関して生じた⟪債権の弁済と引換えに物の引渡しを命ずべき⟫である。\nそして⦅被告が支払義務を負わない第三者である場合には、⟪「債務者から弁済を受けるのと引換えに」⟫引渡しを命ずることとなる⦆⟨1⟩。原告を敗訴させなくとも、⟪引渡しの拒絶により債務の弁済を促す⟫という留置権の目的は⟪引換給付判決⟫によって十分に達成できるからである。","answers":["請求を棄却すべきではない","債権の弁済と引換えに物の引渡しを命ずべき","「債務者から弁済を受けるのと引換えに」","引渡しの拒絶により債務の弁済を促す","引換給付判決"],"check":"棄却ではなく**引換給付判決**／第三者が被告なら「**債務者から**弁済を受けるのと引換えに」／理由＝弁済を促す目的は引換給付で達成できる","notes":[{"n":1,"label":"最一小判昭和47・11・16","case":"最一小判昭和47・11・16 民集26巻9号1619頁","gist":"留置権成立後に債務者から目的物を譲り受けた者に対しても留置権を主張できる（物権であることから明らか）。第三者が支払義務を負わないことは障害にならない。主文は「債務者から支払を受けるのと引換えに」明渡しを命ずる"}],"law":"","cites":[],"rate":0,"designed":true,"ref":false,"hash":"2c0211d61341"},{"id":"民法/留置権の第三者対抗力_債務者からの譲受人#4","block":"第4〔限界——二重譲渡型〕","kind":"cloze","masked":"これに対し、譲渡人が目的物を二重に譲渡し、第一譲受人が引渡しを受けたものの第二譲受人が先に登記を備えた場合、⦅第一譲受人が譲渡人に対して取得する履行不能に基づく損害賠償請求権は、⟦ア⟧にすぎず、「その物に関して生じた債権」とは⟦イ⟧⦆⟨1⟩。\nしたがって留置権は⟦ウ⟧、第二譲受人の明渡請求を拒むことはできない。実質的にも、これに牽連性を認めれば、⟦エ⟧を留置権によって覆すことになり、⟦オ⟧からである。","body":"これに対し、譲渡人が目的物を二重に譲渡し、第一譲受人が引渡しを受けたものの第二譲受人が先に登記を備えた場合、⦅第一譲受人が譲渡人に対して取得する履行不能に基づく損害賠償請求権は、⟪その物自体を目的とする債権がその態様を変じたもの⟫にすぎず、「その物に関して生じた債権」とは⟪いえない⟫⦆⟨1⟩。\nしたがって留置権は⟪そもそも成立せず⟫、第二譲受人の明渡請求を拒むことはできない。実質的にも、これに牽連性を認めれば、⟪対抗要件主義（177条）による優劣の決定⟫を留置権によって覆すことになり、⟪価値判断が矛盾する⟫からである。","answers":["その物自体を目的とする債権がその態様を変じたもの","いえない","そもそも成立せず","対抗要件主義（177条）による優劣の決定","価値判断が矛盾する"],"check":"**「その物自体を目的とする債権がその態様を変じたもの」**＝牽連性なし／実質的理由＝**177条の対抗要件主義と抵触**／使いやすい定式＝**被担保債権の成立時に債務者と引渡請求権者が同一人か**","notes":[{"n":1,"label":"最判昭和43・11・21","case":"最判昭和43・11・21 民集22巻12号2765頁","gist":"二重譲渡で登記に負けた者の損害賠償請求権は「その物自体を目的とする債権がその態様を変じたもの」で、その物に関して生じた債権とはいえない"}],"law":"","cites":["民法/177"],"rate":0,"designed":true,"ref":false,"hash":"e373ab15c645"}],"setsurei":["Yは自己所有の土地建物をBに売却した。代金の一部（345万円）については、金銭の支払に代えて、Bが別途取得する土地建物をYに譲渡する旨の**代物弁済の予約**がされたが、Bはこれを履行しないままであった。Yは本件土地建物を占有し続けている。 その後、BはXから融資を受け、本件土地建物について**停止条件付代物弁済契約**を締結した。Bが弁済しなかったため、Xは本件土地建物の所有権を取得し、**移転登記を了した**。 XはYに対し、本件土地建物の明渡しを請求した。Yは、Bに対する**残代金債権345万円**を被担保債権として留置権を主張できるか。認められる場合、裁判所はどのような判決をすべきか。","1. Sは自己所有の丁土地をTに売却して引き渡したが、Sは代金の一部が未払いのまま丁土地の一部を占有し続けていた。その後TがUに丁土地を転売し、Uが移転登記を得てSに明渡しを求めた。Sは残代金債権を理由に明渡しを拒めるか。**Uが残代金の支払義務を負っていない**ことは結論に影響するか。 2. 事案を変え、VがWから戊土地を買って引渡しを受けたが登記未了のうちに、WがZにも戊土地を売ってZが登記を備えた。Zの明渡請求に対し、Vは「Wに対する履行不能の損害賠償請求権」を被担保債権として留置権を主張できるか。 3. 1と2で結論が分かれるとすれば、**分かれ目はどこにあるか**。"],"full":"留置権が成立するには、債権がその物に関して生じたこと、すなわち物と債権との⟪牽連性⟫が必要である（⟪295条1項本文⟫）。\n牽連性が認められるのは、(1) ⟪債権が物自体から生じた場合⟫、または (2) 債権が物の返還請求権と⟪同一の法律関係⟫もしくは⟪同一の生活関係⟫から生じた場合である。\n\n次に、被担保債権の債務者はもとの所有者であり、引渡しを求める第三者はその債務者ではない。そこで、留置権を第三者に対抗できるかが問題となる。\n⦅⟪留置権は物権⟫であるから、留置権が成立した後に債務者からその目的物を譲り受けた者に対しても、留置権を⟪主張することができる⟫⦆⟨1⟩。\n⟪第三者が被担保債務の支払義務を負う者ではないこと⟫は、留置権の行使を妨げない。\n実質的にも、これを認めなければ、⟪債務者は目的物を第三者に譲渡するだけで⟫容易に留置権者の債権の実現を⟪不確実なものとすることができ⟫、不当だからである。\n\nもっとも、留置権の抗弁が認められる場合、⟪請求を棄却すべきではない⟫。物の引渡しを求める訴訟において留置権の抗弁が理由のあるときは、引渡請求を棄却することなく、その物に関して生じた⟪債権の弁済と引換えに物の引渡しを命ずべき⟫である。\nそして⦅被告が支払義務を負わない第三者である場合には、⟪「債務者から弁済を受けるのと引換えに」⟫引渡しを命ずることとなる⦆⟨1⟩。原告を敗訴させなくとも、⟪引渡しの拒絶により債務の弁済を促す⟫という留置権の目的は⟪引換給付判決⟫によって十分に達成できるからである。\n\nこれに対し、譲渡人が目的物を二重に譲渡し、第一譲受人が引渡しを受けたものの第二譲受人が先に登記を備えた場合、⦅第一譲受人が譲渡人に対して取得する履行不能に基づく損害賠償請求権は、⟪その物自体を目的とする債権がその態様を変じたもの⟫にすぎず、「その物に関して生じた債権」とは⟪いえない⟫⦆⟨1⟩。\nしたがって留置権は⟪そもそも成立せず⟫、第二譲受人の明渡請求を拒むことはできない。実質的にも、これに牽連性を認めれば、⟪対抗要件主義（177条）による優劣の決定⟫を留置権によって覆すことになり、⟪価値判断が矛盾する⟫からである。","kata":"","hanrei":[["最一小判昭和47・11・16 民集26巻9号1619頁","留置権成立後に債務者から目的物を譲り受けた者に対しても留置権を主張できる（物権であることから明らか）。第三者が支払義務を負わないことは障害にならない。主文は「債務者から支払を受けるのと引換えに」明渡しを命ずる","**本論証の主判例**。**百選Ⅰ〔第9版〕75番＝〔第8版〕79番＝〔第7版〕76番**「留置権の対抗力」（第9版解説 岩川隆嗣／第8版解説 藤原正則）"],["最判昭和43・11・21 民集22巻12号2765頁","二重譲渡で登記に負けた者の損害賠償請求権は「その物自体を目的とする債権がその態様を変じたもの」で、その物に関して生じた債権とはいえない","限界（第4）。実質的理由＝177条との抵触"],["最判昭和51・6・17 民集30巻6号616頁","他人物売買の買主は、売主に対する履行不能の損害賠償債権をもって所有者の返還請求に留置権を主張できない。**理由＝返還を拒絶することで売主の債務の履行を間接に強制するという関係（牽連関係）が存在しない**","否定型"],["最判昭和58・3・31 民集37巻2号152頁","仮登記担保の設定者の清算金支払請求権を被担保債権とする留置権は、目的物の譲受人に対抗できる","肯定型"],["最判平成9・7・3 民集51巻6号2500頁","第三取得者が対抗要件を具備する前に留置権者が298条2項の承諾を受けていたときは、その承諾の効果を新所有者に対抗できる","承諾の承継"],["最一小判昭和27・11・27","留置権は**権利抗弁**であり、留置する旨の権利主張がなければ裁判所は判決の基礎にできない","**民事訴訟法判例百選〔第6版〕47番**（解説 福本知行）"]],"field":"留置権","order":13},{"name":"背信的悪意者排除論_177条","subject":"民法","rank":"A","path":"まとめ/民法/論証/背信的悪意者排除論_177条.md","cards":[{"id":"民法/背信的悪意者排除論_177条#1","block":"第1〔「第三者」の意義〕","kind":"cloze","masked":"177条は「第三者」の範囲を限定していないが、これを無制限に解すると、登記のない権利者があらゆる者に権利を否定されることになり、かえって不当である。同条の趣旨は、⟦ア⟧を図る点にある。\nそこで、⦅「第三者」とは、⟦イ⟧であって、不動産に関する物権の得喪及び変更の⟦ウ⟧をいうと解する⦆⟨1⟩。","body":"177条は「第三者」の範囲を限定していないが、これを無制限に解すると、登記のない権利者があらゆる者に権利を否定されることになり、かえって不当である。同条の趣旨は、⟪登記による公示を通じて不動産取引の安全⟫を図る点にある。\nそこで、⦅「第三者」とは、⟪当事者及びその包括承継人以外の者⟫であって、不動産に関する物権の得喪及び変更の⟪登記の欠缺を主張する正当の利益を有する者⟫をいうと解する⦆⟨1⟩。","answers":["登記による公示を通じて不動産取引の安全","当事者及びその包括承継人以外の者","登記の欠缺を主張する正当の利益を有する者"],"check":"","notes":[{"n":1,"label":"大連判明治41・12・15","case":"大連判明治41・12・15（民録14輯**1276**頁）","gist":"177条の「第三者」を「登記欠缺を主張する正当の利益を有する者」に制限する（制限説）。「正当ノ権原ニ因ラズシテ権利ヲ主張」する者は第三者に当たらない"}],"law":"","cites":["民法/177"],"rate":7,"designed":true,"ref":false,"hash":"2aad441ac3fa"},{"id":"民法/背信的悪意者排除論_177条#2","block":"第2〔単純悪意者〕","kind":"cloze","masked":"177条は文言上「第三者」の⟦ア⟧を要件としていない。また、⟦イ⟧の下では、他人に先行する物権変動があることを知りつつ自ら取引に入ること自体は⟦ウ⟧。\nしたがって、物権変動の事実を知るにすぎない⟦エ⟧も、「第三者」に当たると解する。","body":"177条は文言上「第三者」の⟪善意⟫を要件としていない。また、⟪自由競争⟫の下では、他人に先行する物権変動があることを知りつつ自ら取引に入ること自体は⟪違法ではない⟫。\nしたがって、物権変動の事実を知るにすぎない⟪単純悪意者⟫も、「第三者」に当たると解する。","answers":["善意","自由競争","違法ではない","単純悪意者"],"check":"","notes":[],"law":"","cites":["民法/177"],"rate":2,"designed":true,"ref":false,"hash":"ee183f5dc9c5"},{"id":"民法/背信的悪意者排除論_177条#3","block":"第3〔背信的悪意者〕","kind":"cloze","masked":"もっとも、権利の行使は信義に従い誠実に行わなければならない（⟦ア⟧）。⟦イ⟧してまで登記の欠缺を主張することは、許されるべきではない。\nそこで、⦅実体上物権変動があった事実を知る者において、その物権変動についての⟦ウ⟧がある場合には、そのような背信的悪意者は、登記の欠缺を主張するについて⟦エ⟧から、「第三者」に当たらないと解する⦆⟨1⟩。\nすなわち、背信的悪意者といえるためには、①⟦オ⟧と、②⟦カ⟧の⟪両方⟫が必要である⟨2⟩。②は、その者の行為態様が⟦キ⟧にあるかどうかによって判断する。","body":"もっとも、権利の行使は信義に従い誠実に行わなければならない（⟪1条2項⟫）。⟪自由競争の範囲を逸脱⟫してまで登記の欠缺を主張することは、許されるべきではない。\nそこで、⦅実体上物権変動があった事実を知る者において、その物権変動についての⟪登記の欠缺を主張することが信義に反すると認められる事情⟫がある場合には、そのような背信的悪意者は、登記の欠缺を主張するについて⟪正当の利益を有しない⟫から、「第三者」に当たらないと解する⦆⟨1⟩。\nすなわち、背信的悪意者といえるためには、①⟪物権変動があった事実についての悪意⟫と、②⟪登記の欠缺の主張が信義に反すると認められる事情（背信性）⟫の⟪両方⟫が必要である⟨2⟩。②は、その者の行為態様が⟪自由競争の許容する範囲内⟫にあるかどうかによって判断する。","answers":["1条2項","自由競争の範囲を逸脱","登記の欠缺を主張することが信義に反すると認められる事情","正当の利益を有しない","物権変動があった事実についての悪意","登記の欠缺の主張が信義に反すると認められる事情（背信性）","自由競争の許容する範囲内"],"check":"","notes":[{"n":1,"label":"最判昭和43・8・2","case":"**最判昭和43・8・2**（民集22巻8号1571頁）","gist":"「実体上物権変動があった事実を知る者において右物権変動についての登記の欠缺を主張することが信義に反するものと認められる事情がある場合には、かかる背信的悪意者は、登記の欠缺を主張するについて正当な利益を有しないものであって、民法177条にいう第三者に当らない」——**背信的悪意者排除論を確立**"},{"n":2,"label":"最判平成18・1・17","case":"最判平成18・1・17（民集60巻1号27頁）","gist":"悪意＋αの信義則違反という背信的悪意者排除論を堅持し、悪意と背信性の概念を明確に区別する。時効完成後の第三者との関係にも、特段の事情がない限り177条および背信的悪意者排除論が適用される（時効取得の場面では「多年にわたる占有継続」の認識で「悪意」要件は足りる）"}],"law":"","cites":["民法/1"],"rate":0,"designed":true,"ref":false,"hash":"43667caf7586"},{"id":"民法/背信的悪意者排除論_177条#4","block":"第4〔背信的悪意者からの転得者〕","kind":"cloze","masked":"背信的悪意者からさらに買い受けて登記を備えた転得者は、「第三者」に当たるか。\n背信的悪意者が「第三者」から排除されても、譲渡人との間の売買自体が⟦ア⟧から、背信的悪意者は⟦イ⟧、転得者は無権利者から買い受けたことにはならない。また、背信的悪意者が排除される理由は、その者が第一譲受人に対して登記の欠缺を主張することが信義に反する点にあるのだから、「第三者」から排除されるか否かは、⟦ウ⟧されるべきである。\nそこで、⦅転得者は、⟦エ⟧、「第三者」に当たり、登記を備えれば所有権の取得を第一譲受人に対抗することができると解する⦆⟨1⟩。","body":"背信的悪意者からさらに買い受けて登記を備えた転得者は、「第三者」に当たるか。\n背信的悪意者が「第三者」から排除されても、譲渡人との間の売買自体が⟪無効となるわけではない⟫から、背信的悪意者は⟪無権利者ではなく⟫、転得者は無権利者から買い受けたことにはならない。また、背信的悪意者が排除される理由は、その者が第一譲受人に対して登記の欠缺を主張することが信義に反する点にあるのだから、「第三者」から排除されるか否かは、⟪その者と第一譲受人との間で相対的に判断⟫されるべきである。\nそこで、⦅転得者は、⟪第一譲受人との関係で転得者自身が背信的悪意者と評価されるのでない限り⟫、「第三者」に当たり、登記を備えれば所有権の取得を第一譲受人に対抗することができると解する⦆⟨1⟩。","answers":["無効となるわけではない","無権利者ではなく","その者と第一譲受人との間で相対的に判断","第一譲受人との関係で転得者自身が背信的悪意者と評価されるのでない限り"],"check":"","notes":[{"n":1,"label":"最判平成8・10・29","case":"**最判平成8・10・29**（民集50巻9号**2506**頁／判タ947号185頁）","gist":"甲→乙（未登記）・甲→丙（背信的悪意者）→丁と譲渡された場合、「たとい丙が背信的悪意者に当たるとしても、丁は、乙に対する関係で**丁自身が背信的悪意者と評価されるのでない限り**、当該不動産の所有権取得をもって乙に対抗することができる」。理由は、〔1〕甲丙間の売買自体が無効になるわけではなく丁は無権利者から買い受けたことにならないこと、〔2〕「第三者」から排除されるかは**第一譲受人との間で相対的に判断されるべき事柄**であること"}],"law":"","cites":[],"rate":0,"designed":true,"ref":false,"hash":"c9f12de803e2"}],"setsurei":["A は所有する甲土地を B に売却し、代金を受領して引き渡したが、移転登記は未了であった。C は、A・B 間の売買と B の占有の事実を知りながら、B が登記を得ていないことを奇貨として、後に B に高値で売りつけて利益を得る目的で、A から甲土地を買い受け、移転登記を経由した。 C は B に対し、登記を備えたことを理由に甲土地の明渡しを求めた。C の請求は認められるか。","設例1と同じ経緯で C が甲土地の移転登記を経由した後、C は甲土地を D に売却し、D への移転登記が経由された。D は、甲土地が以前 B に売却されていた事実を知っていたが、C のような不当な目的は有しておらず、通常の価格で甲土地を買い受けて自ら利用するつもりであった。 B は D に対し、登記なくして甲土地の所有権を主張できるか。"],"full":"(1) 「第三者」の意義\n177条は「第三者」の範囲を限定していないが、これを無制限に解すると、登記のない権利者があらゆる者に権利を否定されることになり、かえって不当である。同条の趣旨は、⟪登記による公示を通じて不動産取引の安全⟫を図る点にある。\nそこで、⦅「第三者」とは、⟪当事者及びその包括承継人以外の者⟫であって、不動産に関する物権の得喪及び変更の⟪登記の欠缺を主張する正当の利益を有する者⟫をいうと解する⦆⟨1⟩。\n\n(2) 単純悪意者\n177条は文言上「第三者」の⟪善意⟫を要件としていない。また、⟪自由競争⟫の下では、他人に先行する物権変動があることを知りつつ自ら取引に入ること自体は⟪違法ではない⟫。\nしたがって、物権変動の事実を知るにすぎない⟪単純悪意者⟫も、「第三者」に当たると解する。\n\n(3) 背信的悪意者\nもっとも、権利の行使は信義に従い誠実に行わなければならない（⟪1条2項⟫）。⟪自由競争の範囲を逸脱⟫してまで登記の欠缺を主張することは、許されるべきではない。\nそこで、⦅実体上物権変動があった事実を知る者において、その物権変動についての⟪登記の欠缺を主張することが信義に反すると認められる事情⟫がある場合には、そのような背信的悪意者は、登記の欠缺を主張するについて⟪正当の利益を有しない⟫から、「第三者」に当たらないと解する⦆⟨1⟩。\nすなわち、背信的悪意者といえるためには、①⟪物権変動があった事実についての悪意⟫と、②⟪登記の欠缺の主張が信義に反すると認められる事情（背信性）⟫の⟪両方⟫が必要である⟨2⟩。②は、その者の行為態様が⟪自由競争の許容する範囲内⟫にあるかどうかによって判断する。\n\n(4) 背信的悪意者からの転得者\n背信的悪意者からさらに買い受けて登記を備えた転得者は、「第三者」に当たるか。\n背信的悪意者が「第三者」から排除されても、譲渡人との間の売買自体が⟪無効となるわけではない⟫から、背信的悪意者は⟪無権利者ではなく⟫、転得者は無権利者から買い受けたことにはならない。また、背信的悪意者が排除される理由は、その者が第一譲受人に対して登記の欠缺を主張することが信義に反する点にあるのだから、「第三者」から排除されるか否かは、⟪その者と第一譲受人との間で相対的に判断⟫されるべきである。\nそこで、⦅転得者は、⟪第一譲受人との関係で転得者自身が背信的悪意者と評価されるのでない限り⟫、「第三者」に当たり、登記を備えれば所有権の取得を第一譲受人に対抗することができると解する⦆⟨1⟩。","kata":"| # | 落としてはいけない要素 | ランクAでの扱い |\n|---|---|---|\n| 1 | 177条・**「第三者」の定義**＝当事者及び包括承継人以外の者で、**登記の欠缺を主張する正当の利益を有する者** | **必須**（文言でほぼ再生できること。R4採点実感が「定義に言及した答案は少数」と指摘する差のつく点） |\n| 2 | **単純悪意者は「第三者」に当たる**（177条は善意を要件としない／自由競争） | **必須**（ここを飛ばして背信的悪意者に行くと段差が説明できない） |\n| 3 | 背信的悪意者の規範＝**物権変動の事実を知る者において、登記の欠缺の主張が信義に反すると認められる事情がある場合**は正当の利益を有せず「第三者」に当たらない | **必須**（「信義に反すると認められる事情」の言い回しまで） |\n| 4 | 根拠条文として**1条2項**（信義則）を挙げる | 必須 |\n| 5 | 要件が**①悪意 ②背信性の2つ**であること／背信性は**自由競争の範囲を逸脱するか**で判断すること | **必須**（「悪意だけでは足りない」と言えること） |\n| 6 | 転得者の結論＝**転得者自身が背信的悪意者と評価されない限り「第三者」に当たる** | **必須** |\n| 7 | 転得者の理由〔1〕＝**背信的悪意者も無権利者ではない／売買自体は無効にならない** | **必須**（R4採点実感が明示的に要求） |\n| 8 | 転得者の理由〔2〕＝**排除されるかは第一譲受人との間で相対的に判断される** | **必須**（実質的理由はこちらに集約されている） |\n| 9 | 〔副〕絶対的構成の存在と決め手（前主の地位を承継するか否かで結論が逆転） | **存在と決め手が言えれば可** |\n| 10 | 判例の年月日・百選番号 | **不要**（答案に書かないので暗記対象外） |\n\n**勝負どころ**：\n1. **「単純悪意 → 背信的悪意」の2段階を踏めるか。**いきなり「悪意だから排除」と書くと、177条が善意を要件としていない出発点を無視したことになる（起草者は旧民法の善意者保護を意図的に改めている）。\n2. **背信性の当てはめで具体的事実を拾えるか。**「背信的悪意者に当たる」と結論だけ書かず、目的（嫌がらせ・高値売りつけ）・関係（親族・仲介人）・矛盾的行為といった事実を、**自由競争の逸脱**という基準に乗せて評価する。\n3. **転得者で理由を2本とも書けるか。**「相対的に判断すべき」だけだと、なぜ転得者が有効に権利を取得できるのか（＝無権利者からの取得ではないこと）が抜ける。\n\n> ⚠️ **間違えやすい点**\n> - **悪意だけで背信的悪意者と認定する**——判例は悪意と背信性を**明確に区別**している（百選Ⅰ〔第8版〕p.134・135）。「知っていた」だけでは自由競争の範囲内。\n> - **背信的悪意者を「無権利者」と書く**——最判平8・10・29 は明確に否定している。無権利者と書くと転得者の処理が絶対的構成に流れ、判例と結論が変わる。\n> - **転得者について「前主が背信的悪意者だから転得者も排除」と書く**——これは破棄された原審の立場（絶対的構成）。\n> - **転得者について「転得者が悪意だから排除」と書く**——転得者にも**悪意＋背信性**が要る。単純悪意の転得者は「第三者」に当たる。\n> - **不法占拠者に177条を持ち出す**——不法占拠者・不法行為者はそもそも「正当の利益」を欠き「第三者」に当たらない（大連判明41・12・15 の例示、最判昭25・12・19）。背信的悪意者の議論に入る前の段階の話。","hanrei":[["大連判明治41・12・15（民録14輯**1276**頁）","177条の「第三者」を「登記欠缺を主張する正当の利益を有する者」に制限する（制限説）。「正当ノ権原ニ因ラズシテ権利ヲ主張」する者は第三者に当たらない","百選Ⅰ〔第8版〕p.137 解説2 が引用。**同日付・民録14輯1301頁の別判決**（物権変動の範囲—一般論）が百選Ⅰ**〔第9版〕50番（＝〔第8版〕54番・〔第7版〕52番）**として収録されている（解説は各版とも七戸克彦）。両者を混同しないこと"],["~~最判昭和40・12・◯~~（民集19巻9号2221頁）","不動産登記法の特則（現5条）の**類推**により、第三者の信義に反する行為態様を考慮して登記の欠缺の主張を封じた（背信的悪意者排除論の前段階）","百選Ⅰ〔第8版〕p.134 解説1。**日付の「日」がOCRで判読できず。答案で日付付きで引用しないこと。**"],["**最判昭和43・8・2**（民集22巻8号1571頁）","「実体上物権変動があった事実を知る者において右物権変動についての登記の欠缺を主張することが信義に反するものと認められる事情がある場合には、かかる背信的悪意者は、登記の欠缺を主張するについて正当な利益を有しないものであって、民法177条にいう第三者に当らない」——**背信的悪意者排除論を確立**","百選Ⅰ〔第8版〕p.137、`基礎法\\民事\\講義 物件・担保物権法` p.89、`基礎法\\民事\\完全講義 民事訴訟実務の基礎 上巻[第3版]` p.289。事案は、第一譲受人の占有と登記未了を奇貨として**高値で権利証を売りつけようとした**もの。**百選Ⅰ〔第9版〕57番「民法177条の第三者の範囲(2)—背信的悪意者」（解説：武川幸嗣）として新規収録された**（第7版・第8版には未収録。2026-07-29 に確認）。**この論点の中心判例が、ようやく百選の収録判例になった**"],["~~最判昭和43・11・◯~~（民集22巻12号2765頁）","悪意者も、その**行為態様が自由競争の許容しうる範囲内にあれば**背信的悪意者に当たらない","百選Ⅰ〔第8版〕p.134 解説1。**日付の「日」がOCRで判読できず**（昭和43年・民集22巻12号2765頁までは読める）。**答案でこの判例を日付付きで引用しないこと。**「自由競争の範囲内なら背信的悪意者に当たらない」という命題自体は同解説の本文で確認済み"],["最判平成18・1・17（民集60巻1号27頁）","悪意＋αの信義則違反という背信的悪意者排除論を堅持し、悪意と背信性の概念を明確に区別する。時効完成後の第三者との関係にも、特段の事情がない限り177条および背信的悪意者排除論が適用される（時効取得の場面では「多年にわたる占有継続」の認識で「悪意」要件は足りる）","民法判例百選Ⅰ**〔第9版〕54番（＝〔第8版〕60番・〔第7版〕57番）**（第9版の表題は「時効取得と登記(2)—時効完成後の譲受人と背信的悪意者」＝**時効の側の事件として並べ替えられた**。解説は各版とも石田剛）。**時効の枝は別論証の担当**"],["**最判平成8・10・29**（民集50巻9号**2506**頁／判タ947号185頁）","甲→乙（未登記）・甲→丙（背信的悪意者）→丁と譲渡された場合、「たとい丙が背信的悪意者に当たるとしても、丁は、乙に対する関係で**丁自身が背信的悪意者と評価されるのでない限り**、当該不動産の所有権取得をもって乙に対抗することができる」。理由は、〔1〕甲丙間の売買自体が無効になるわけではなく丁は無権利者から買い受けたことにならないこと、〔2〕「第三者」から排除されるかは**第一譲受人との間で相対的に判断されるべき事柄**であること","民法判例百選Ⅰ**〔第9版〕58番（＝〔第8版〕61番・〔第7版〕58番）**（第9版の表題は「民法177条の第三者の範囲(3)—背信的悪意者からの転得者」。解説は各版とも幡野弘樹）。**背信的悪意者からの転得者について論じた最初の最高裁判決**。**民集50巻9号2506頁は 2026-07-29 に確定**（`新・伊藤塾試験対策問題集 論文1 民法』p.82。従来は百選側のOCR欠損で頁を書けていなかった）"],["最判昭和25・12・19","不法占拠者は177条の「第三者」に当たらない","民法判例百選Ⅰ**〔第9版〕56番（＝〔第8版〕62番・〔第7版〕59番）**「民法177条の第三者の範囲(1)—不法占拠者」（解説は各版とも山野目章夫）。`短答\\伊藤真の速習短答過去問 民法` p.135 も引用（同書は「百選Ⅰ62事件」と表記）。**本論証のスコープ外**（対比用）"],["東京高判昭和57・8・31（判時1055号47頁）","丙が善意・丁が背信的悪意の事案で、相対的適用を認めた（ただし甲と丁が実質的に同一人と評価できる事案）","百選Ⅰ〔第8版〕p.137 解説4 が引用。下級審"]],"field":"不動産物権変動（177条）","order":8},{"name":"虚偽表示94条の第三者と転得者","subject":"民法","rank":"A","path":"まとめ/民法/論証/虚偽表示94条の第三者と転得者.md","cards":[{"id":"民法/虚偽表示94条の第三者と転得者#1","block":"第1〔虚偽表示の効果と94条2項の趣旨〕","kind":"cloze","masked":"相手方と通じてした虚偽の意思表示は⟦ア⟧である（⟦イ⟧）。もっとも、その無効は⟦ウ⟧に対抗することができない（同条2項）。同項は、権利の不実の外形を⟦エ⟧表意者の帰責性が大きいことと、その外形を真実であると信じた者の信頼を保護する必要があることに基づく規定であり、⟦オ⟧の現れである。","body":"相手方と通じてした虚偽の意思表示は⟪無効⟫である（⟪94条1項⟫）。もっとも、その無効は⟪善意の第三者⟫に対抗することができない（同条2項）。同項は、権利の不実の外形を⟪自ら意識的に作り出した⟫表意者の帰責性が大きいことと、その外形を真実であると信じた者の信頼を保護する必要があることに基づく規定であり、⟪権利外観法理⟫の現れである。","answers":["無効","94条1項","善意の第三者","自ら意識的に作り出した","権利外観法理"],"check":"1 ／ **94条1項**・無効／**94条2項**・「善意の第三者に対抗することができない」 ／ **必須**（項番号まで）","notes":[],"law":"","cites":["民法/94"],"rate":17,"designed":true,"ref":false,"hash":"45865762279e"},{"id":"民法/虚偽表示94条の第三者と転得者#2","block":"第2〔「第三者」の意義と転得者〕","kind":"cloze","masked":"そこで「第三者」とは、虚偽表示の当事者及びその⟦ア⟧以外の者であって、虚偽表示の目的につき⟦イ⟧、⟦ウ⟧を有するに至った者をいうと解する。\nそして、仮装譲受人から権利を取得した者からさらに権利を取得した⟦エ⟧も、⦅「第三者」に含まれる⦆⟨1⟩と解する。表意者が不実の外形を作り出しこれを除去せずに放置したという帰責性の本質は、登記名義が誰に移ろうと変わらず、外形を信頼した者を保護すべき必要性も、その取引相手が仮装譲受人か直接の第三者かによって変わるものではないからである。","body":"そこで「第三者」とは、虚偽表示の当事者及びその⟪包括承継人⟫以外の者であって、虚偽表示の目的につき⟪新たに⟫、⟪独立の法律上の利害関係⟫を有するに至った者をいうと解する。\nそして、仮装譲受人から権利を取得した者からさらに権利を取得した⟪転得者⟫も、⦅「第三者」に含まれる⦆⟨1⟩と解する。表意者が不実の外形を作り出しこれを除去せずに放置したという帰責性の本質は、登記名義が誰に移ろうと変わらず、外形を信頼した者を保護すべき必要性も、その取引相手が仮装譲受人か直接の第三者かによって変わるものではないからである。","answers":["包括承継人","新たに","独立の法律上の利害関係","転得者"],"check":"3 ／ 「第三者」＝当事者及び包括承継人以外の者で、虚偽表示の目的につき**新たに独立の法律上の利害関係**を有するに至った者 ／ **必須**（「新たに」「独立の」の2語が幹）","notes":[{"n":1,"label":"最判昭45・7・24","case":"**最判昭和45・7・24（民集24巻7号1116頁）**","gist":"94条2項の「第三者」は直接の第三者に限られず、**転得者（その後の転得者を全部含む）も含まれる**"}],"law":"","cites":[],"rate":0,"designed":true,"ref":false,"hash":"fcb6a1bbb962"},{"id":"民法/虚偽表示94条の第三者と転得者#3","block":"第3〔「善意」の内容〕","kind":"cloze","masked":"「善意」とは、虚偽表示であること、すなわち当事者間に効果を発生させない旨の合意があることを知らなかったことをいう。その判定時期は、⦅第三者が⟦ア⟧⦆⟨1⟩である。\nまた、第三者は善意であれば足り、⟦イ⟧であることを要しないと解する。同項が⟦ウ⟧無過失を要求していないうえ、虚偽の外形を自ら意識的に作り出した表意者の⟦エ⟧は極めて大きく、第三者の保護要件を緩やかに解してよいからである。","body":"「善意」とは、虚偽表示であること、すなわち当事者間に効果を発生させない旨の合意があることを知らなかったことをいう。その判定時期は、⦅第三者が⟪利害関係を有するに至った時⟫⦆⟨1⟩である。\nまた、第三者は善意であれば足り、⟪無過失⟫であることを要しないと解する。同項が⟪文言上⟫無過失を要求していないうえ、虚偽の外形を自ら意識的に作り出した表意者の⟪帰責性⟫は極めて大きく、第三者の保護要件を緩やかに解してよいからである。","answers":["利害関係を有するに至った時","無過失","文言上","帰責性"],"check":"5 ／ **善意で足り、無過失は不要** ＋ 理由（条文が無過失を要求していない／帰責性が大きい） ／ **必須**（結論を「善意無過失」と書いたら ✗＝96条3項との混線）","notes":[{"n":1,"label":"最判昭55・9・11","case":"**最判昭和55・9・11（民集34巻5号683頁）**","gist":"「善意」か否かの判定時期は、**第三者が利害関係を有するに至った時**である（利害関係を有した後に悪意になってもかまわない）。あわせて、虚偽仮装の原抵当権につき**転抵当の設定を受けた者も「第三者」にあたる**とした"}],"law":"","cites":[],"rate":0,"designed":true,"ref":false,"hash":"6efa5a92d3df"},{"id":"民法/虚偽表示94条の第三者と転得者#4","block":"第4〔登記の要否〕","kind":"cloze","masked":"第三者は、表意者に対し権利の取得を主張するにあたり、⦅⟦ア⟧を備えることを要しない⦆⟨1⟩と解する。第三者と表意者とは⟦イ⟧の関係に立ち対抗関係にないから、⟦ウ⟧としての登記は不要である。また、表意者の帰責性が大きく表意者を保護する必要性が低いから、⟦エ⟧としての登記も不要である。","body":"第三者は、表意者に対し権利の取得を主張するにあたり、⦅⟪登記⟫を備えることを要しない⦆⟨1⟩と解する。第三者と表意者とは⟪前主後主⟫の関係に立ち対抗関係にないから、⟪対抗要件⟫としての登記は不要である。また、表意者の帰責性が大きく表意者を保護する必要性が低いから、⟪権利保護資格要件⟫としての登記も不要である。","answers":["登記","前主後主","対抗要件","権利保護資格要件"],"check":"7 ／ **登記不要** ＋ 2段の理由（前主後主で対抗関係でない → 対抗要件不要／帰責性大 → 権利保護資格要件も不要） ／ **必須**（結論＋どちらか一方の理由で 4、両方で 5）","notes":[{"n":1,"label":"最判昭44・5・27","case":"**最判昭和44・5・27（民集23巻6号998頁）**","gist":"94条2項の適用の結果として物権を取得した者は、その取得を虚偽表示者に対抗するために**登記を備えている必要はない**"}],"law":"","cites":[],"rate":0,"designed":true,"ref":false,"hash":"743d0b362dd9"},{"id":"民法/虚偽表示94条の第三者と転得者#5","block":"第5〔善意者が現れた後の悪意の転得者〕","kind":"cloze","masked":"ひとたび善意の第三者が現れた場合、その後の転得者は、⟦ア⟧と解する。第三者ごとに無効の対抗の可否を判断する見解（⟦イ⟧）によれば、⟦ウ⟧うえ、目的物を取り戻された転得者が前主である善意の第三者に対し契約を⟦エ⟧して代金の返還を求めることができ、善意の第三者を保護した実質が失われるからである。\nしたがって、善意の第三者が現れればその者が⟦オ⟧し、転得者は善意悪意を問わずその⟦カ⟧すると解する。\nただし、転得者が善意者を⟦キ⟧として介在させるなど、94条2項による保護を⟦ク⟧形で悪用した場合には、例外的に転得者は保護されないと解する。","body":"ひとたび善意の第三者が現れた場合、その後の転得者は、⟪悪意であっても保護される⟫と解する。第三者ごとに無効の対抗の可否を判断する見解（⟪相対的構成⟫）によれば、⟪権利関係が確定しない⟫うえ、目的物を取り戻された転得者が前主である善意の第三者に対し契約を⟪解除⟫して代金の返還を求めることができ、善意の第三者を保護した実質が失われるからである。\nしたがって、善意の第三者が現れればその者が⟪確定的に権利を取得⟫し、転得者は善意悪意を問わずその⟪地位を承継⟫すると解する。\nただし、転得者が善意者を⟪わら人形⟫として介在させるなど、94条2項による保護を⟪信義に反する⟫形で悪用した場合には、例外的に転得者は保護されないと解する。","answers":["悪意であっても保護される","相対的構成","権利関係が確定しない","解除","確定的に権利を取得","地位を承継","わら人形","信義に反する"],"check":"8 ／ 善意者出現後は**善意悪意を問わず**転得者が保護される（**絶対的構成**） ／ **必須**","notes":[],"law":"","cites":["民法/94"],"rate":3,"designed":true,"ref":false,"hash":"105f4ade1afc"}],"setsurei":["Ａは、複数の債権者から甲土地を差し押さえられることを避けるため、知人Ｂと相談のうえ、実際には売買の事実がないのに甲土地をＢに売却したように装い、甲土地の登記名義をＢに移した。 その後、資金繰りに窮したＢは、この状況を利用して甲土地をＣに売却して引き渡し、さらにＣがこれをＤに転売して引き渡した。**Ｃは、ＡＢ間に売買の事実がないことを知っていたが、Ｄはこれを知らなかった。**登記名義は現在もＢのままである。 ＡはＤに対し、甲土地の所有権に基づいて明渡しを請求した。Ａの請求は認められるか。","設例1と同じくＡＢ間で甲土地の仮装売買がされ、登記名義がＢに移された。 Ｂは甲土地をＣに売却して引き渡した。**Ｃは、ＡＢ間に売買の事実がないことを知らなかった。**その後、ＣはこれをＤに転売して引き渡したが、**Ｄは、ＡＢ間の仮装売買を知っていたうえ、自らが直接Ｂから買えば甲土地を取得できないと考え、事情を知らないＣに買わせてから自分が買い受けるという段取りを最初から組んでいた。**登記名義は現在もＢのままである。 ＡはＤに対し、甲土地の所有権に基づいて明渡しを請求した。Ａの請求は認められるか。"],"full":"相手方と通じてした虚偽の意思表示は⟪無効⟫である（⟪94条1項⟫）。もっとも、その無効は⟪善意の第三者⟫に対抗することができない（同条2項）。同項は、権利の不実の外形を⟪自ら意識的に作り出した⟫表意者の帰責性が大きいことと、その外形を真実であると信じた者の信頼を保護する必要があることに基づく規定であり、⟪権利外観法理⟫の現れである。\n\nそこで「第三者」とは、虚偽表示の当事者及びその⟪包括承継人⟫以外の者であって、虚偽表示の目的につき⟪新たに⟫、⟪独立の法律上の利害関係⟫を有するに至った者をいうと解する。\nそして、仮装譲受人から権利を取得した者からさらに権利を取得した⟪転得者⟫も、⦅「第三者」に含まれる⦆⟨1⟩と解する。表意者が不実の外形を作り出しこれを除去せずに放置したという帰責性の本質は、登記名義が誰に移ろうと変わらず、外形を信頼した者を保護すべき必要性も、その取引相手が仮装譲受人か直接の第三者かによって変わるものではないからである。\n\n「善意」とは、虚偽表示であること、すなわち当事者間に効果を発生させない旨の合意があることを知らなかったことをいう。その判定時期は、⦅第三者が⟪利害関係を有するに至った時⟫⦆⟨1⟩である。\nまた、第三者は善意であれば足り、⟪無過失⟫であることを要しないと解する。同項が⟪文言上⟫無過失を要求していないうえ、虚偽の外形を自ら意識的に作り出した表意者の⟪帰責性⟫は極めて大きく、第三者の保護要件を緩やかに解してよいからである。\n\n第三者は、表意者に対し権利の取得を主張するにあたり、⦅⟪登記⟫を備えることを要しない⦆⟨1⟩と解する。第三者と表意者とは⟪前主後主⟫の関係に立ち対抗関係にないから、⟪対抗要件⟫としての登記は不要である。また、表意者の帰責性が大きく表意者を保護する必要性が低いから、⟪権利保護資格要件⟫としての登記も不要である。\n\nひとたび善意の第三者が現れた場合、その後の転得者は、⟪悪意であっても保護される⟫と解する。第三者ごとに無効の対抗の可否を判断する見解（⟪相対的構成⟫）によれば、⟪権利関係が確定しない⟫うえ、目的物を取り戻された転得者が前主である善意の第三者に対し契約を⟪解除⟫して代金の返還を求めることができ、善意の第三者を保護した実質が失われるからである。\nしたがって、善意の第三者が現れればその者が⟪確定的に権利を取得⟫し、転得者は善意悪意を問わずその⟪地位を承継⟫すると解する。\nただし、転得者が善意者を⟪わら人形⟫として介在させるなど、94条2項による保護を⟪信義に反する⟫形で悪用した場合には、例外的に転得者は保護されないと解する。","kata":"","hanrei":[["大判大正5・11・17（民録22輯2089頁）","94条2項の「第三者」とは、虚偽表示の当事者およびその包括承継人以外の者であって、その「表示ノ目的ニ付キ法律上利害関係ヲ有スルニ至リタル者」をいう","`基礎法\\民事\\民法の基礎１総則-佐久間毅` p.147。**答案の定義の原型**（「新たに独立の」は解説・予備校本が加えた整理）"],["**最判昭和45・7・24（民集24巻7号1116頁）**","94条2項の「第三者」は直接の第三者に限られず、**転得者（その後の転得者を全部含む）も含まれる**","`基礎法\\民事\\民法の基礎１総則-佐久間毅` p.156／`基礎法\\民事\\スタートアップ民法・民法総則` p.238・p.454／`アガルート\\重要問題修得講座-民法` p.20・p.22"],["**最判昭和55・9・11（民集34巻5号683頁）**","「善意」か否かの判定時期は、**第三者が利害関係を有するに至った時**である（利害関係を有した後に悪意になってもかまわない）。あわせて、虚偽仮装の原抵当権につき**転抵当の設定を受けた者も「第三者」にあたる**とした","`基礎法\\民事\\民法の基礎１総則-佐久間毅` p.150／`基礎法\\民事\\スタートアップ民法・民法総則` p.237（「善意」の判定時期の判例として引用）／`短答\\伊藤真の速習短答過去問 民法` p.65。**2026-07-30 の査読で追加**（覚える論証 第3の注釈先が表に無く `build_cards.py` が警告を出したため）"],["**大判昭和12・8・10**","94条2項の第三者は**無過失であることを要しない**","`基礎法\\民事\\民法の基礎１総則-佐久間毅` p.151／`アガルート\\重要問題修得講座-民法` p.20。**判例集の号数が本により食い違う**（佐久間＝新聞4185号9頁／`基礎法\\民事\\スタートアップ民法・民法総則` p.237・p.232＝新聞4181号9頁）。**答案では年月日だけ引く**"],["**最判昭和44・5・27（民集23巻6号998頁）**","94条2項の適用の結果として物権を取得した者は、その取得を虚偽表示者に対抗するために**登記を備えている必要はない**","`基礎法\\民事\\民法の基礎１総則-佐久間毅` p.154・p.155／`基礎法\\民事\\スタートアップ民法・民法総則` p.238・p.453。`アガルート\\重要問題修得講座-民法` p.20 は**大判昭10・5・31**も併記する。なお佐久間 p.158 は、同判決が**虚偽表示の撤回**の場面で94条2項の適用を認めた点を「傍論ながら」と評する"],["最判昭和41・12・22","「第三者が民法第94条第2項の保護をうけるためには、**自己が善意であったことを立証しなければならない**」","判示の引用は `短答\\体系別短答過去問題集　民法(上)総則・物権[第３版]` p.92。`基礎法\\民事\\スタートアップ民法・民法総則` p.237 は民集20巻10号2168頁とする"],["最判昭和35・2・2","虚偽表示における第三者の善意の**証明責任**","`基礎法\\民事\\スタートアップ民法・民法総則` p.237。**民事訴訟法判例百選〔第5版〕63番**「証明責任の分配(1)——虚偽表示における第三者の善意」。第6版の目次は収録リストに未登録のため**第6版での番号は未確認**"],["**大判大正3・7・9（刑録20輯1475頁）／大判昭和6・10・24（新聞3334号4頁）**","善意の第三者が現れると、虚偽表示の無効は**転得者にも（その善意悪意を問わず）対抗することができない**（**絶対的構成**）","`基礎法\\民事\\民法の基礎１総則-佐久間毅` p.157（2件を判例として挙げる）／`基礎法\\民事\\スタートアップ民法・民法総則` p.239（大判大正3・7・9）／`アガルート\\重要問題修得講座-民法` p.20（大判昭6・10・24）"],["**最判昭和42・10・31**","94条2項により第三者が権利を取得する過程について、**虚偽表示者から直接権利を取得する**（法定承継取得説）。その結果、真の権利者からの譲受人との優劣は**対抗問題**となり登記の先後で決まる","`基礎法\\民事\\民法の基礎１総則-佐久間毅` p.154／`基礎法\\民事\\スタートアップ民法・民法総則` p.240／`アガルート\\総合講義-民法` p.37・p.426／`アガルート\\重要問題修得講座-民法` p.20〜21。**民集の頁が本により食い違う**（佐久間＝民集21巻8号2213頁／スタートアップ＝民集21巻8号2232頁）。**答案では年月日だけ引く**。※本論証のスコープ外の派生論点"],["最判昭28・10・1（民集7巻10号1019頁）／大判大正4・12・17（民録21輯2124頁）／大判昭和3・10・4／大決昭和8・9・18（民集12巻2437頁）／最判昭48・6・28（民集27巻6号724頁）","第三者に**該当する**例（仮装譲受人からの譲受人／抵当権の設定を受けた者／仮装債権の譲受人／目的物を差し押さえた債権者）","`基礎法\\民事\\民法の基礎１総則-佐久間毅` p.148〜149"],["最判昭38・11・28（民集17巻11号1446頁）／最判昭57・6・8（判時1049号36頁）／大判大正3・3・16／大決大正9・10・18／大判昭和8・6・16","第三者に**該当しない**例（借地上建物の仮装譲渡と土地賃貸人／土地の仮装譲受人から地上建物を賃借した者／代理の本人／取立てのための債権譲受人／仮装譲渡された債権の債務者）","`基礎法\\民事\\民法の基礎１総則-佐久間毅` p.149。土地賃貸人の例は `基礎法\\民事\\スタートアップ民法・民法総則` p.236 も扱い、学説には反対説があるとする"],["大連判明治41・12・15（民録14輯1276頁）","177条の「第三者」とは「登記の欠缺を主張するにつき正当の利益を有する者」をいう","`基礎法\\民事\\民法の基礎１総則-佐久間毅` p.154。登記不要の理由付けの前提"]],"field":"意思表示（錯誤・詐欺）","order":2},{"name":"表見代理_110条と代理権濫用_107条","subject":"民法","rank":"A","path":"まとめ/民法/論証/表見代理_110条と代理権濫用_107条.md","cards":[{"id":"民法/表見代理_110条と代理権濫用_107条#1","block":"第1","kind":"cloze","masked":"【入口＝どちらの条文か】\nまず、当該行為が⟦ア⟧か⟦イ⟧かを確定する。範囲内であれば⟦エ⟧の問題とはならず、代理人の目的いかんにより⟦ウ⟧が適用される。範囲外であれば⟦エ⟧の問題となる。","body":"【入口＝どちらの条文か】\nまず、当該行為が⟪代理権の範囲内⟫か⟪範囲外⟫かを確定する。範囲内であれば110条の問題とはならず、代理人の目的いかんにより⟪107条⟫が適用される。範囲外であれば⟪110条⟫の問題となる。","answers":["代理権の範囲内","範囲外","107条","110条"],"check":"","notes":[],"law":"","cites":["民法/110","民法/107"],"rate":5,"designed":true,"ref":true,"hash":"3319d15645fb"},{"id":"民法/表見代理_110条と代理権濫用_107条#2","block":"第2","kind":"cloze","masked":"【110条＝⟦イ⟧の表見代理】\n110条の要件は、①代理人に⟦ア⟧があること、②代理人がその⟦イ⟧をしたこと、③第三者が代理人に権限があると信じ、そう信ずべき⟦ウ⟧があることである。","body":"【110条＝権限外の行為の表見代理】\n110条の要件は、①代理人に⟪基本代理権⟫があること、②代理人がその⟪権限外の行為⟫をしたこと、③第三者が代理人に権限があると信じ、そう信ずべき⟪正当な理由⟫があることである。","answers":["基本代理権","権限外の行為","正当な理由"],"check":"","notes":[],"law":"","cites":["民法/110"],"rate":18,"designed":true,"ref":false,"hash":"bf6850da3255"},{"id":"民法/表見代理_110条と代理権濫用_107条#3","block":"第3〔基本代理権〕","kind":"cloze","masked":"同条の趣旨は、代理権を与えた⟦ア⟧のもとで、代理権の⟦イ⟧を保護し、取引の安全を図る点にある。\nそうすると、⦅基本代理権は⟦ウ⟧についての代理権であることを要し、単なる⟦エ⟧や、⟦オ⟧の代理権はこれにあたらないのが原則であると解する⦆⟨1⟩⟨2⟩。\n⦅もっとも、公法上の行為であっても、⟦カ⟧としてされるものであるときは、私法上の取引との関連性が強く、外観への信頼を保護すべき必要は私法上の行為の場合と異ならない。したがって、この場合には基本代理権にあたると解する⦆⟨3⟩。","body":"同条の趣旨は、代理権を与えた⟪本人の帰責⟫のもとで、代理権の⟪外観を信頼した相手方⟫を保護し、取引の安全を図る点にある。\nそうすると、⦅基本代理権は⟪私法上の取引行為⟫についての代理権であることを要し、単なる⟪事実行為の代行権限⟫や、⟪取引と関わりのない公法上の行為⟫の代理権はこれにあたらないのが原則であると解する⦆⟨1⟩⟨2⟩。\n⦅もっとも、公法上の行為であっても、⟪特定の私法上の取引行為の一環⟫としてされるものであるときは、私法上の取引との関連性が強く、外観への信頼を保護すべき必要は私法上の行為の場合と異ならない。したがって、この場合には基本代理権にあたると解する⦆⟨3⟩。","answers":["本人の帰責","外観を信頼した相手方","私法上の取引行為","事実行為の代行権限","取引と関わりのない公法上の行為","特定の私法上の取引行為の一環"],"check":"","notes":[{"n":1,"label":"最二小判昭35・2・19","case":"最二小判昭35・2・19（民集14巻2号250頁）","gist":"事実行為（勧誘行為）の代行権限は110条の基本代理権にあたらない"},{"n":2,"label":"最判昭39・4・2","case":"最判昭39・4・2（民集18巻4号497頁）","gist":"**印鑑証明書の下付申請**という公法上の行為の代理権について110条の適用を否定"},{"n":3,"label":"最判昭46・6・3","case":"最判昭46・6・3（民集25巻4号455頁）","gist":"登記申請行為が**私法上の契約による義務の履行**としてされるものであるときは、基本代理権となる"}],"law":"","cites":[],"rate":0,"designed":true,"ref":false,"hash":"f24ec59ac696"},{"id":"民法/表見代理_110条と代理権濫用_107条#4","block":"第4〔正当な理由〕","kind":"cloze","masked":"「正当な理由」とは、相手方が代理権の存在を信じたことにつき⟦ア⟧をいう。⟦イ⟧。\n相手方が、代理人の⟦ウ⟧とともに⟦エ⟧を徴したときは、⟪特段の事情のない限り⟫正当な理由が認められる。\nもっとも、代理行為が⟦オ⟧を課すものであるとき、⟪代理人自身が利益を受ける⟫とき、⟪基本代理権からの逸脱が大きい⟫ときなど、代理権の存在を疑うべき特段の事情があるときは、相手方は⟦カ⟧するなど可能な手段で本人の意思を確認すべきであり、これを怠れば正当な理由は認められないと解する。","body":"「正当な理由」とは、相手方が代理権の存在を信じたことにつき⟪過失がないこと⟫をいう。⟪本人の過失は要件ではない⟫。\n相手方が、代理人の⟪実印の押された書面⟫とともに⟪印鑑証明書⟫を徴したときは、⟪特段の事情のない限り⟫正当な理由が認められる。\nもっとも、代理行為が⟪本人に著しく重い負担⟫を課すものであるとき、⟪代理人自身が利益を受ける⟫とき、⟪基本代理権からの逸脱が大きい⟫ときなど、代理権の存在を疑うべき特段の事情があるときは、相手方は⟪本人に直接照会⟫するなど可能な手段で本人の意思を確認すべきであり、これを怠れば正当な理由は認められないと解する。","answers":["過失がないこと","本人の過失は要件ではない","実印の押された書面","印鑑証明書","本人に著しく重い負担","本人に直接照会"],"check":"","notes":[],"law":"","cites":[],"rate":0,"designed":true,"ref":false,"hash":"4c20c5245bfa"},{"id":"民法/表見代理_110条と代理権濫用_107条#5","block":"第5","kind":"cloze","masked":"【107条＝代理権の濫用】\n代理人が⟦ア⟧で代理権の⟪範囲内⟫の行為をした場合、行為は代理権の範囲内である以上、原則として効果は⟦イ⟧する。\nしかし、相手方がその目的を⟦ウ⟧ときは、相手方の信頼を保護する必要はない。この場合、その行為は⟦エ⟧とみなされる（107条）。\nしたがって、本人が追認しない限り、効果は⟦イ⟧しない（⟦オ⟧）。","body":"【107条＝代理権の濫用】\n代理人が⟪自己又は第三者の利益を図る目的⟫で代理権の⟪範囲内⟫の行為をした場合、行為は代理権の範囲内である以上、原則として効果は⟪本人に帰属⟫する。\nしかし、相手方がその目的を⟪知り、又は知ることができた⟫ときは、相手方の信頼を保護する必要はない。この場合、その行為は⟪代理権を有しない者がした行為⟫とみなされる（107条）。\nしたがって、本人が追認しない限り、効果は本人に帰属しない（⟪113条1項⟫）。","answers":["自己又は第三者の利益を図る目的","本人に帰属","知り、又は知ることができた","代理権を有しない者がした行為","113条1項"],"check":"","notes":[],"law":"","cites":["民法/107","民法/113"],"rate":27,"designed":true,"ref":false,"hash":"3d0500eb6228"}],"setsurei":["Aは、A所有の甲土地をCに贈与した。Aは、その履行として甲土地の所有権移転登記手続をするための代理権のみをBに与え、実印と印鑑証明書をBに預けた。ところがBは、その権限を超えて、Aの代理人として甲土地をDに3000万円で売却した。Dは、Bが実印を押した契約書と印鑑証明書を持参したことから、Bに売却の代理権があると信じた。AはDに対して責任を負うか。","Aは、A所有の甲土地を売却する代理権をBに与えた。Bは、受領する代金を自己の借入金の返済に充てるつもりで、Aの代理人としてCに甲土地を相場どおり3000万円で売却した。Cは、Bの言動から、Bが代金を自分のものにする意図であることに気づくことができた。売買の効果はAに帰属するか。また、Cから甲土地を買い受けたDはどうか。"],"full":"【入口＝どちらの条文か】\nまず、当該行為が⟪代理権の範囲内⟫か⟪範囲外⟫かを確定する。範囲内であれば110条の問題とはならず、代理人の目的いかんにより⟪107条⟫が適用される。範囲外であれば⟪110条⟫の問題となる。\n\n【110条＝権限外の行為の表見代理】\n110条の要件は、①代理人に⟪基本代理権⟫があること、②代理人がその⟪権限外の行為⟫をしたこと、③第三者が代理人に権限があると信じ、そう信ずべき⟪正当な理由⟫があることである。\n\n(1) 基本代理権\n同条の趣旨は、代理権を与えた⟪本人の帰責⟫のもとで、代理権の⟪外観を信頼した相手方⟫を保護し、取引の安全を図る点にある。\nそうすると、⦅基本代理権は⟪私法上の取引行為⟫についての代理権であることを要し、単なる⟪事実行為の代行権限⟫や、⟪取引と関わりのない公法上の行為⟫の代理権はこれにあたらないのが原則であると解する⦆⟨1⟩⟨2⟩。\n⦅もっとも、公法上の行為であっても、⟪特定の私法上の取引行為の一環⟫としてされるものであるときは、私法上の取引との関連性が強く、外観への信頼を保護すべき必要は私法上の行為の場合と異ならない。したがって、この場合には基本代理権にあたると解する⦆⟨3⟩。\n\n(2) 正当な理由\n「正当な理由」とは、相手方が代理権の存在を信じたことにつき⟪過失がないこと⟫をいう。⟪本人の過失は要件ではない⟫。\n相手方が、代理人の⟪実印の押された書面⟫とともに⟪印鑑証明書⟫を徴したときは、⟪特段の事情のない限り⟫正当な理由が認められる。\nもっとも、代理行為が⟪本人に著しく重い負担⟫を課すものであるとき、⟪代理人自身が利益を受ける⟫とき、⟪基本代理権からの逸脱が大きい⟫ときなど、代理権の存在を疑うべき特段の事情があるときは、相手方は⟪本人に直接照会⟫するなど可能な手段で本人の意思を確認すべきであり、これを怠れば正当な理由は認められないと解する。\n\n【107条＝代理権の濫用】\n代理人が⟪自己又は第三者の利益を図る目的⟫で代理権の⟪範囲内⟫の行為をした場合、行為は代理権の範囲内である以上、原則として効果は⟪本人に帰属⟫する。\nしかし、相手方がその目的を⟪知り、又は知ることができた⟫ときは、相手方の信頼を保護する必要はない。この場合、その行為は⟪代理権を有しない者がした行為⟫とみなされる（107条）。\nしたがって、本人が追認しない限り、効果は本人に帰属しない（⟪113条1項⟫）。","kata":"| # | 落としてはいけない要素 | 記号 |\n|---|---|---|\n| 1 | **入口の切り分け**：権限**内**→107条／権限**外**→110条 | — |\n| 2 | 110条の3要件：①基本代理権 ②権限外の行為 ③正当な理由 | 110 |\n| 3 | 110条の趣旨：代理権の外観への信頼保護・取引安全 | — |\n| 4 | 基本代理権の原則：**私法上の取引行為**の代理権に限る（事実行為×・取引と無関係な公法上の行為×） | — |\n| 5 | 基本代理権の例外：**特定の私法上の取引行為の一環**としてされる公法上の行為は○ | — |\n| 6 | 正当な理由＝**相手方の無過失**。**本人の過失は要件でない** | — |\n| 7 | 正当理由の原則：**実印＋印鑑証明書**を徴していれば特段の事情のない限り○ | — |\n| 8 | 正当理由の例外：特段の事情があれば**本人への直接照会等の確認義務**、怠れば× | — |\n| 9 | 107条の3要件：①自己又は第三者の利益を図る目的 ②**範囲内**の行為 ③相手方の悪意**又は有過失** | 107 |\n| 10 | 107条の効果：**無権代理とみなす**→113条1項で本人不帰属（追認可） | 113I |\n\n**勝負どころ**：\n1. **入口で条文を選び違えないこと。**「代理人が悪いことをした」で反射的に110条を出す答案が多いが、権限の範囲内なら107条一本。逆に権限外なら107条ではなく110条。\n2. **基本代理権を「原則→例外」の2段で書くこと。**「公法上の行為だから×」で切って終わると、最判昭46・6・3の例外を落とす。\n3. **正当な理由を「原則→特段の事情→確認義務」の3段で書くこと。**印鑑証明書があるかどうかだけで結論を出さない。\n\n> ⚠️ **間違えやすい点**\n> - **107条は「みなす」であって「推定する」ではない。**反証で覆らない。\n> - **107条には93条2項のような第三者保護規定がない。**転得者は94条2項類推等の一般法理で処理する（しかも本人の意思的関与が要る）。「93条2項で保護される」と書かない。\n> - **改正前の「93条但書類推」は現行法の規範ではない。**答案に書かない（法改正年表の解決済み論点リスト）。\n> - **110条の「第三者」は直接の相手方であり、転得者を含まない**（大判昭7・12・24）。\n> - **代理権が全くない者に110条は適用されない**（大判大2・6・26）。基本代理権の認定を飛ばさない。\n> - 正当な理由の主張・立証責任は**相手方**（110条）。109条1項とは逆向きなので混線しやすい。","hanrei":[["最二小判昭35・2・19（民集14巻2号250頁）","事実行為（勧誘行為）の代行権限は110条の基本代理権にあたらない","百選Ⅰ〔第9版〕28番（＝〔第8版〕29番・〔第7版〕29番）。第9版の解説も北居功"],["最判昭39・4・2（民集18巻4号497頁）","**印鑑証明書の下付申請**という公法上の行為の代理権について110条の適用を否定","百選リストに掲載なし"],["最判昭46・6・3（民集25巻4号455頁）","登記申請行為が**私法上の契約による義務の履行**としてされるものであるときは、基本代理権となる","民法百選リストに掲載なし（民訴百選117番の同日判決は別事件）"],["大判大2・6・26","110条は代理権を有する者が権限を踰越した場合にのみ適用され、何ら代理権のない者の行為には適用されない","—"],["大判昭7・12・24","110条の「第三者」は無権代理人の相手方をいい、相手方からの転得者を含まない","—"],["大判昭17・5・20","法定代理権も110条の基本代理権となりうる","—"],["最二小判昭51・6・25（民集30巻6号665頁）","印鑑証明書を徴した以上、特段の事情のない限り正当理由あり。特段の事情があるときは本人に直接照会するなど可能な手段で意思を確認すべきで、怠れば正当理由なし","百選Ⅰ〔第9版〕29番（＝〔第8版〕30番・〔第7版〕30番）。**本論点の中心判例**。解説執筆者は第8版＝早川眞一郎／第9版＝山下純司（版で交代しているので、解説の引用は版を明示する）"],["最判昭44・12・19（民集23巻12号2539頁）","代理人が本人の名を直接示して権限外の行為をした場合も、本人自身の行為と信じたことに正当な理由があれば110条を類推適用","—"],["最一小判昭42・4・20（民集21巻3号697頁）","代理権濫用につき改正前93条但書を類推適用（代理権濫用は有権代理であることが前提）","百選Ⅰ〔第9版〕25番（＝〔第8版〕26番・〔第7版〕26番）。解説は各版とも吉永一行。**現行法では107条に置き換わっており、答案では引かない**"],["最判昭44・11・14（民集23巻11号2023頁）","代理権濫用で本人が効果を否定できる場合の転得者保護につき94条2項類推","改正前の判例。現行法下では本人の意思的関与が要る（佐久間 p.278）"],["最判平4・12・10","親権者による法定代理につき、親権者に代理権を付与した法の趣旨に反すると認められる特段の事情がなければ代理権濫用にあたらない","**百選Ⅲ〔第3版〕51番（＝〔第2版〕49番）「物上保証行為と親権者の法定代理権濫用」**（第3版の解説＝石綿はる美）。2026-07-29 確定"],["最判昭34・2・5","110条の正当な理由につき、本人の過失は要件でない","アガルート p.66 の引用による。判例集の巻号頁はDB未確認"],["最判昭35・12・27（民集14巻14号3234頁）／最判昭44・6・24","「正当な理由」＝無過失","昭35・12・27 の巻号頁は佐久間『民法の基礎1 総則』p.313 で裏取り済み（同書は「正当な理由とは、代理権の存在を相手方が信じたことに過失がなかったこと（相手方の無過失）」と定義する）。昭44・6・24 の巻号頁はDB未確認"]],"field":"代理","order":4},{"name":"解除の効果・原状回復と第三者_545条","subject":"民法","rank":"A","path":"まとめ/民法/論証/解除の効果・原状回復と第三者_545条.md","cards":[{"id":"民法/解除の効果・原状回復と第三者_545条#1","block":"第1〔解除の効果〕","kind":"cloze","masked":"解除の趣旨は、解除権者を⟦ア⟧し、契約締結前の状態を回復させる点にある。そこで、解除により契約の効果は⟦イ⟧し、各当事者は相手方を原状に復させる義務（⟦ウ⟧）を負うと解する（⟦エ⟧）。未履行債務は当然に消滅する。","body":"解除の趣旨は、解除権者を⟪契約の拘束から解放⟫し、契約締結前の状態を回復させる点にある。そこで、解除により契約の効果は⟪遡及的に消滅⟫し、各当事者は相手方を原状に復させる義務（⟪原状回復義務⟫）を負うと解する（⟪545Ⅰ本文⟫）。未履行債務は当然に消滅する。","answers":["契約の拘束から解放","遡及的に消滅","原状回復義務","545Ⅰ本文"],"check":"趣旨＝契約の拘束から解放／**遡及的消滅**／原状回復義務／**545Ⅰ本文**／未履行債務は消滅","notes":[],"law":"","cites":["民法/545"],"rate":10,"designed":true,"ref":false,"hash":"ee011b301adf"},{"id":"民法/解除の効果・原状回復と第三者_545条#2","block":"第2〔原状回復義務の内容〕","kind":"cloze","masked":"原状回復義務の内容として、金銭を返還するときは⟦ア⟧を付さなければならず（⟦イ⟧）、金銭以外の物を返還するときは⟦ウ⟧をも返還しなければならない（⟦エ⟧）。契約に基づく給付がなかったのと同一の財産状態を回復させる必要があるから、目的物の引渡しを受けていた者は、⦅解除までの⟦オ⟧も返還すべき義務を負う⦆⟨1⟩。なお、解除は⟦カ⟧を妨げない（545Ⅳ）。","body":"原状回復義務の内容として、金銭を返還するときは⟪受領の時から利息⟫を付さなければならず（⟪545Ⅱ⟫）、金銭以外の物を返還するときは⟪受領時以後の果実⟫をも返還しなければならない（⟪545Ⅲ⟫）。契約に基づく給付がなかったのと同一の財産状態を回復させる必要があるから、目的物の引渡しを受けていた者は、⦅解除までの⟪使用利益⟫も返還すべき義務を負う⦆⟨1⟩。なお、解除は⟪損害賠償の請求⟫を妨げない（545Ⅳ）。","answers":["受領の時から利息","545Ⅱ","受領時以後の果実","545Ⅲ","使用利益","損害賠償の請求"],"check":"金銭＝**受領の時から利息（545Ⅱ）**／物＝**受領時以後の果実（545Ⅲ）**／**使用利益**も返還／損害賠償（545Ⅳ）","notes":[{"n":1,"label":"最判昭51・2・13","case":"最判昭51・2・13","gist":"「売買契約が解除された場合に、目的物の引渡を受けていた買主は、原状回復義務の内容として、解除までの間目的物を使用したことによる利益を売主に返還すべき義務を負う」。他人の権利の売買が解除された場合も同様。あわせて、返還不能が**給付者（売主）の責めに帰すべき事由**によるときは、給付受領者は価格返還義務を負わない"}],"law":"","cites":["民法/545"],"rate":22,"designed":true,"ref":false,"hash":"0e0f5217bcc8"},{"id":"民法/解除の効果・原状回復と第三者_545条#3","block":"第3〔「第三者」の意義〕","kind":"cloze","masked":"545条1項ただし書は、解除の⟦ア⟧して⟦イ⟧を図った規定である。したがって同項ただし書の「第三者」とは、⟦ウ⟧に、解除された契約から生じた法律関係を基礎として⟦エ⟧した者をいうと解する。","body":"545条1項ただし書は、解除の⟪遡及効を制限⟫して⟪取引の安全⟫を図った規定である。したがって同項ただし書の「第三者」とは、⟪解除前⟫に、解除された契約から生じた法律関係を基礎として⟪新たな権利を取得⟫した者をいうと解する。","answers":["遡及効を制限","取引の安全","解除前","新たな権利を取得"],"check":"ただし書＝**遡及効の制限**・取引の安全／「第三者」＝**解除前**に契約から生じた法律関係を基礎に**新たな権利を取得**した者","notes":[],"law":"","cites":["民法/545"],"rate":0,"designed":true,"ref":false,"hash":"f097de12e972"},{"id":"民法/解除の効果・原状回復と第三者_545条#4","block":"第4〔第三者の主観と登記〕","kind":"cloze","masked":"契約自体に瑕疵はなく、解除原因があっても解除するか否かは解除権者の意思による以上、第三者の⟦ア⟧は問わない。もっとも、遡及効を制限される解除者との⟦イ⟧上、第三者が保護されるためには、⦅自ら⟦ウ⟧（動産は引渡し）を備えていることを要する⦆⟨1⟩と解する（⟦エ⟧）。","body":"契約自体に瑕疵はなく、解除原因があっても解除するか否かは解除権者の意思による以上、第三者の⟪善意・悪意⟫は問わない。もっとも、遡及効を制限される解除者との⟪利益衡量⟫上、第三者が保護されるためには、⦅自ら⟪登記⟫（動産は引渡し）を備えていることを要する⦆⟨1⟩と解する（⟪権利保護資格要件⟫）。","answers":["善意・悪意","利益衡量","登記","権利保護資格要件"],"check":"**善意悪意を問わない**（＋その理由＝解除するか否かは解除権者次第）／**登記が必要**／**権利保護資格要件**","notes":[{"n":1,"label":"大判大10・5・17","case":"大判大10・5・17","gist":"解除前の第三者は登記を備えなければ保護されない"}],"law":"","cites":[],"rate":0,"designed":true,"ref":false,"hash":"b2149cc7237d"},{"id":"民法/解除の効果・原状回復と第三者_545条#5","block":"第5〔解除後の第三者〕","kind":"cloze","masked":"これに対し、解除後に現れた第三者には545条1項ただし書は適用されない。もっとも、解除により相手方から解除者への⟦ア⟧を観念でき、解除者は解除後には⟦イ⟧できたのにこれを怠っている。そこで、両者は⟦ウ⟧に立ち、⦅⟦エ⟧により登記の先後で決する⦆⟨1⟩と解する。","body":"これに対し、解除後に現れた第三者には545条1項ただし書は適用されない。もっとも、解除により相手方から解除者への⟪復帰的物権変動⟫を観念でき、解除者は解除後には⟪登記を回復⟫できたのにこれを怠っている。そこで、両者は⟪対抗関係⟫に立ち、⦅⟪177条⟫により登記の先後で決する⦆⟨1⟩と解する。","answers":["復帰的物権変動","登記を回復","対抗関係","177条"],"check":"ただし書の適用なし／**復帰的物権変動**／登記回復を怠った／**対抗関係・177**","notes":[{"n":1,"label":"最判昭35・11・29","case":"最判昭35・11・29","gist":"「不動産を目的とする売買契約に基き買主のため所有権移転登記があった後、右売買契約が解除せられ、不動産の所有権が売主に復帰した場合でも、売主は、その所有権取得の登記を了しなければ、右契約解除後において買主から不動産を取得した第三者に対し、所有権の復帰を以って対抗し得ない……その場合、第三者が善意であると否と……に拘らない」"}],"law":"","cites":["民法/545","民法/177"],"rate":1,"designed":true,"ref":false,"hash":"a1b77045ac99"},{"id":"民法/解除の効果・原状回復と第三者_545条#6","block":"第6〔同時履行〕","kind":"cloze","masked":"双方の⟦ア⟧は互いに⟦イ⟧に立つから、⟦ウ⟧の抗弁の規定が準用される（⟦エ⟧・533）。","body":"双方の⟪原状回復義務⟫は互いに⟪対価的牽連関係⟫に立つから、⟪同時履行⟫の抗弁の規定が準用される（⟪546⟫・533）。","answers":["原状回復義務","対価的牽連関係","同時履行","546"],"check":"**546**（533準用）／対価的牽連関係","notes":[],"law":"","cites":[],"rate":0,"designed":true,"ref":false,"hash":"77032493f542"}],"setsurei":["Ａは所有する甲土地をＢに代金2000万円で売り、引渡しと所有権移転登記を済ませた。ところがＢは代金のうち500万円を支払わない。Ａが相当の期間を定めて催告したうえ売買契約を解除する前に、Ｂは甲土地をＣに売却していた。Ｃは、Ｂが代金の一部を支払っていない事情を知っていた。 (1) Ｃが移転登記を備えている場合、ＡはＣに甲土地の明渡しを求められるか。 (2) 登記がなおＢのもとに残っている場合はどうか。","設例1のＡＢ間の事実（代金2000万円・500万円未払い・引渡しと移転登記済み）を前提に、**Ｃへの売却はなかったものとする**。Ｂへの引渡し後、Ｂは甲土地を月10万円で第三者に賃貸して賃料を得ていた。Ａは解除の意思表示をしたが、移転登記の抹消をしないまま放置していたところ、解除の1年後にＢが甲土地をＤに売却し、Ｄが移転登記を備えた。Ｄは解除の事実を知っていた。 (1) ＡはＤに甲土地の所有権を対抗できるか。 (2) ＡＢ間で、Ａが受領済みの代金1500万円、Ｂが得た賃料相当額について、どのような清算になるか。Ａの代金返還とＢの土地返還の関係はどうなるか。"],"full":"解除の趣旨は、解除権者を⟪契約の拘束から解放⟫し、契約締結前の状態を回復させる点にある。そこで、解除により契約の効果は⟪遡及的に消滅⟫し、各当事者は相手方を原状に復させる義務（⟪原状回復義務⟫）を負うと解する（⟪545Ⅰ本文⟫）。未履行債務は当然に消滅する。\n\n原状回復義務の内容として、金銭を返還するときは⟪受領の時から利息⟫を付さなければならず（⟪545Ⅱ⟫）、金銭以外の物を返還するときは⟪受領時以後の果実⟫をも返還しなければならない（⟪545Ⅲ⟫）。契約に基づく給付がなかったのと同一の財産状態を回復させる必要があるから、目的物の引渡しを受けていた者は、⦅解除までの⟪使用利益⟫も返還すべき義務を負う⦆⟨1⟩。なお、解除は⟪損害賠償の請求⟫を妨げない（545Ⅳ）。\n\n545条1項ただし書は、解除の⟪遡及効を制限⟫して⟪取引の安全⟫を図った規定である。したがって同項ただし書の「第三者」とは、⟪解除前⟫に、解除された契約から生じた法律関係を基礎として⟪新たな権利を取得⟫した者をいうと解する。\n\n契約自体に瑕疵はなく、解除原因があっても解除するか否かは解除権者の意思による以上、第三者の⟪善意・悪意⟫は問わない。もっとも、遡及効を制限される解除者との⟪利益衡量⟫上、第三者が保護されるためには、⦅自ら⟪登記⟫（動産は引渡し）を備えていることを要する⦆⟨1⟩と解する（⟪権利保護資格要件⟫）。\n\nこれに対し、解除後に現れた第三者には545条1項ただし書は適用されない。もっとも、解除により相手方から解除者への⟪復帰的物権変動⟫を観念でき、解除者は解除後には⟪登記を回復⟫できたのにこれを怠っている。そこで、両者は⟪対抗関係⟫に立ち、⦅⟪177条⟫により登記の先後で決する⦆⟨1⟩と解する。\n\n双方の⟪原状回復義務⟫は互いに⟪対価的牽連関係⟫に立つから、⟪同時履行⟫の抗弁の規定が準用される（⟪546⟫・533）。","kata":"","hanrei":[["最判昭35・11・29","「不動産を目的とする売買契約に基き買主のため所有権移転登記があった後、右売買契約が解除せられ、不動産の所有権が売主に復帰した場合でも、売主は、その所有権取得の登記を了しなければ、右契約解除後において買主から不動産を取得した第三者に対し、所有権の復帰を以って対抗し得ない……その場合、第三者が善意であると否と……に拘らない」","**民法判例百選Ⅰ〔第9版〕52事件**（第8版56番・第7版54番）。解除後の第三者＝177の対抗問題"],["大判昭14・7・7","解除後の第三者との関係を177の対抗問題とした先例","百選Ⅰ〔第9版〕52事件解説が引用（民集18巻748頁）"],["大判大10・5・17","解除前の第三者は登記を備えなければ保護されない","百選解説・『基本講義 債権各論Ⅰ』p.84（民録27輯929頁）。判例が対抗要件として要求したのか権利保護資格要件かは不明瞭"],["最判昭33・6・14","同上（解除前の第三者が545Ⅰただし書で保護されるには登記を要する）","『体系別短答過去問題集 民法(下)』p.1098。**同書はこの登記を「対抗要件としての登記ではなく、権利保護資格要件としての登記」と明言**しており、短答で狙われる。⚠️ **同じ日付に別事件があるので取り違えない。この解除の判例に百選番号を付けてはいけない。**同日付の別事件は「和解と錯誤」で、**民法Ⅱ百選〔第9版〕67番（〔第8版〕76番）と民訴百選93番「訴訟上の和解と錯誤」の両方**に載っている（2026-07-30 の査読で `判例百選_収録判例リスト.md` を grep して確認）。**別事件と言える根拠は登載頁**——解除の判例は民集12巻9号**1449**頁（『4訂 紛争類型別の要件事実』p.152）、和解の判例は同巻同号**1492**頁"],["大判大6・12・27","直接効果説（解除により物権関係も遡及的に消滅）","百選Ⅰ〔第9版〕52事件解説（民録23輯2262頁）"],["最判昭51・2・13","「売買契約が解除された場合に、目的物の引渡を受けていた買主は、原状回復義務の内容として、解除までの間目的物を使用したことによる利益を売主に返還すべき義務を負う」。他人の権利の売買が解除された場合も同様。あわせて、返還不能が**給付者（売主）の責めに帰すべき事由**によるときは、給付受領者は価格返還義務を負わない","**民法判例百選Ⅱ〔第9版〕40事件**（第8版45番）"],["最判昭34・9・22","使用利益の返還義務","百選Ⅱ〔第9版〕40事件解説・アガルート p.291（民集13巻11号1451頁）"],["大判昭11・5・11","使用利益の返還義務","同上（民集15巻808頁）"]],"field":"契約の解除","order":36},{"name":"詐害行為取消権_要件と効果","subject":"民法","rank":"A","path":"まとめ/民法/論証/詐害行為取消権_要件と効果.md","cards":[{"id":"民法/詐害行為取消権_要件と効果#1","block":"第1〔総論・被保全債権〕","kind":"cloze","masked":"詐害行為取消権は、債務者の責任財産を保全し、強制執行の準備をするための制度である。したがって被保全債権は、⟦ア⟧することのできる債権でなければならず（⟦イ⟧）、原則として⟦ウ⟧であることを要する。もっとも、⦅特定物の引渡請求権であっても、究極においては⟦エ⟧以上、債務者の一般財産による担保を必要とする点で⟦ウ⟧と異ならないから、被保全債権となりうると解する⦆⟨1⟩。\nまた、被保全債権は、詐害行為の⟦オ⟧に基づいて生じたものでなければならない（⟦カ⟧）。債権者は、自己の債権の発生原因が生ずる前の債務者の財産処分にまで介入すべきではないからである。","body":"詐害行為取消権は、債務者の責任財産を保全し、強制執行の準備をするための制度である。したがって被保全債権は、⟪強制執行により実現⟫することのできる債権でなければならず（⟪424条4項⟫）、原則として⟪金銭債権⟫であることを要する。もっとも、⦅特定物の引渡請求権であっても、究極においては⟪損害賠償請求権に変じうる⟫以上、債務者の一般財産による担保を必要とする点で金銭債権と異ならないから、被保全債権となりうると解する⦆⟨1⟩。\nまた、被保全債権は、詐害行為の⟪前の原因⟫に基づいて生じたものでなければならない（⟪424条3項⟫）。債権者は、自己の債権の発生原因が生ずる前の債務者の財産処分にまで介入すべきではないからである。","answers":["強制執行により実現","424条4項","金銭債権","損害賠償請求権に変じうる","前の原因","424条3項"],"check":"","notes":[{"n":1,"label":"最大判 昭和36・7・19","case":"最大判 昭和36・7・19　民集15巻7号1875頁","gist":"特定物債権も究極において損害賠償債権に変じうるから、被保全債権となりうる。また、現物返還が不可能・著しく困難で全部取消しが公平を欠く場合は価額償還による一部取消しによる。"}],"law":"","cites":["民法/424"],"rate":10,"designed":true,"ref":false,"hash":"c9a9048cf010"},{"id":"民法/詐害行為取消権_要件と効果#2","block":"第2〔詐害行為性（客観的要件）〕","kind":"cloze","masked":"取消しの対象は⟦ア⟧に限られる（424条2項）。共同担保の保全に適さない行為にまで他人の干渉を認めるべきではないからである。\n加えて、その行為により⟪債務者が無資力となること⟫を要し、無資力は⟦イ⟧の双方で必要である。責任財産が保全されている限り、取消しを認める必要がないからである。\n詐害行為にあたるかは、⟪行為の詐害性（客観面）と債務者の主観（主観面）との相関関係⟫で判断され、民法は類型ごとに要件を定める。\n(1) ⟪相当の対価を得てした財産の処分行為⟫は、財産の総額に変動がない以上、原則として詐害行為とならない。もっとも、①その行為が⟪不動産の金銭への換価その他の財産の種類の変更により、隠匿等の処分をするおそれを現に生じさせる⟫ものであり、②債務者が行為当時に⟦ウ⟧を有し、③受益者がその意思を⟪知っていた⟫ときは、取消請求ができる（424条の2各号）。\n(2) ⟪既存の債務についての担保の供与・債務の消滅に関する行為（偏頗行為）⟫は、責任財産の総額を減少させない以上、原則として詐害行為とならない。もっとも、①⟦エ⟧にされ、②債務者と受益者とが⟦オ⟧をもってされたときは、抜け駆け的な満足を与えるものとして取消請求ができる（424条の3第1項）。義務に属しない行為・時期が義務に属しない行為（期限前弁済等）は詐害性が大きいから、⟦エ⟧である必要はなく、①⟦カ⟧にされ、かつ②⟪通謀害意⟫があるときに取消請求ができる（同条2項）。\n(3) ⟪過大な代物弁済等⟫は、⟦キ⟧に相当する部分以外の部分について、424条の要件を満たす限り取消請求ができる（⟦ク⟧）。","body":"取消しの対象は⟪財産権を目的とする行為⟫に限られる（424条2項）。共同担保の保全に適さない行為にまで他人の干渉を認めるべきではないからである。\n加えて、その行為により⟪債務者が無資力となること⟫を要し、無資力は⟪詐害行為の時と取消権行使の時⟫の双方で必要である。責任財産が保全されている限り、取消しを認める必要がないからである。\n詐害行為にあたるかは、⟪行為の詐害性（客観面）と債務者の主観（主観面）との相関関係⟫で判断され、民法は類型ごとに要件を定める。\n(1) ⟪相当の対価を得てした財産の処分行為⟫は、財産の総額に変動がない以上、原則として詐害行為とならない。もっとも、①その行為が⟪不動産の金銭への換価その他の財産の種類の変更により、隠匿等の処分をするおそれを現に生じさせる⟫ものであり、②債務者が行為当時に⟪隠匿等の処分をする意思⟫を有し、③受益者がその意思を⟪知っていた⟫ときは、取消請求ができる（424条の2各号）。\n(2) ⟪既存の債務についての担保の供与・債務の消滅に関する行為（偏頗行為）⟫は、責任財産の総額を減少させない以上、原則として詐害行為とならない。もっとも、①⟪支払不能の時⟫にされ、②債務者と受益者とが⟪通謀して他の債権者を害する意図⟫をもってされたときは、抜け駆け的な満足を与えるものとして取消請求ができる（424条の3第1項）。義務に属しない行為・時期が義務に属しない行為（期限前弁済等）は詐害性が大きいから、支払不能の時である必要はなく、①⟪支払不能になる前30日以内⟫にされ、かつ②⟪通謀害意⟫があるときに取消請求ができる（同条2項）。\n(3) ⟪過大な代物弁済等⟫は、⟪消滅した債務の額⟫に相当する部分以外の部分について、424条の要件を満たす限り取消請求ができる（⟪424条の4⟫）。","answers":["財産権を目的とする行為","詐害行為の時と取消権行使の時","隠匿等の処分をする意思","支払不能の時","通謀して他の債権者を害する意図","支払不能になる前30日以内","消滅した債務の額","424条の4"],"check":"","notes":[],"law":"","cites":["民法/424","民法/424の2","民法/424の3","民法/424の4"],"rate":21,"designed":true,"ref":false,"hash":"abe17fb79cb5"},{"id":"民法/詐害行為取消権_要件と効果#3","block":"第3〔詐害意思（主観的要件）と受益者の悪意〕","kind":"cloze","masked":"債務者が、その行為によって⟦ア⟧ことを要する（⟦イ⟧）。\n他方、受益者がその行為の時において債権者を害することを⟦ウ⟧ときは、⟦エ⟧（同項ただし書）。受益者の取引の安全を害すべきでないからである。ただし書である以上、⟦オ⟧が主張立証すべきである。","body":"債務者が、その行為によって⟪債権者を害することを知っていた⟫ことを要する（⟪424条1項本文⟫）。\n他方、受益者がその行為の時において債権者を害することを⟪知らなかった⟫ときは、⟪取消請求ができない⟫（同項ただし書）。受益者の取引の安全を害すべきでないからである。ただし書である以上、⟪受益者の善意は受益者側⟫が主張立証すべきである。","answers":["債権者を害することを知っていた","424条1項本文","知らなかった","取消請求ができない","受益者の善意は受益者側"],"check":"","notes":[],"law":"","cites":["民法/424"],"rate":22,"designed":true,"ref":false,"hash":"985852374ec1"},{"id":"民法/詐害行為取消権_要件と効果#4","block":"第4〔転得者に対する請求〕","kind":"cloze","masked":"転得者に対して取消請求をするには、⟦ア⟧ことを前提として、その転得者が転得の当時、債務者がした行為が⟦イ⟧ことを要する（⟦ウ⟧）。転得者が他の転得者から転得した者であるときは、その転得者および⟦エ⟧が、それぞれの転得の当時に悪意であったことを要する（同条2号）。転得者は債務者の資産状態を知りうる立場に一般になく、途中に⟦オ⟧した場合にまで取消しを及ぼすと取引の安全を害するからである。","body":"転得者に対して取消請求をするには、⟪受益者に対して取消請求をすることができる⟫ことを前提として、その転得者が転得の当時、債務者がした行為が⟪債権者を害することを知っていた⟫ことを要する（⟪424条の5第1号⟫）。転得者が他の転得者から転得した者であるときは、その転得者および⟪その前に転得した全ての転得者⟫が、それぞれの転得の当時に悪意であったことを要する（同条2号）。転得者は債務者の資産状態を知りうる立場に一般になく、途中に⟪善意者が介在⟫した場合にまで取消しを及ぼすと取引の安全を害するからである。","answers":["受益者に対して取消請求をすることができる","債権者を害することを知っていた","424条の5第1号","その前に転得した全ての転得者","善意者が介在"],"check":"","notes":[],"law":"424条の5第1号・2号（転得者に対する請求）","cites":["民法/424の5"],"rate":34,"designed":true,"ref":false,"hash":"53121f2ad713"},{"id":"民法/詐害行為取消権_要件と効果#5","block":"第5〔行使方法〕","kind":"cloze","masked":"詐害行為取消権は、⟦ア⟧行使しなければならない（424条1項「裁判所に請求する」）。被告となるのは受益者または転得者であり、⟦イ⟧（⟦ウ⟧）。もっとも認容判決の効力は債務者に及ぶから、債権者は訴え提起後遅滞なく⟦エ⟧をしなければならない（同条2項）。債務者に訴訟に関与する機会を保障する趣旨である。\n訴えは、⟪債務者が債権者を害することを知って行為をしたことを債権者が知った時⟫から⟦オ⟧、行為の時から⟦カ⟧を経過したときは提起できない（426条）。","body":"詐害行為取消権は、⟪裁判上⟫行使しなければならない（424条1項「裁判所に請求する」）。被告となるのは受益者または転得者であり、⟪債務者は被告とならない⟫（⟪424条の7第1項⟫）。もっとも認容判決の効力は債務者に及ぶから、債権者は訴え提起後遅滞なく⟪債務者に訴訟告知⟫をしなければならない（同条2項）。債務者に訴訟に関与する機会を保障する趣旨である。\n訴えは、⟪債務者が債権者を害することを知って行為をしたことを債権者が知った時⟫から⟪2年⟫、行為の時から⟪10年⟫を経過したときは提起できない（426条）。","answers":["裁判上","債務者は被告とならない","424条の7第1項","債務者に訴訟告知","2年","10年"],"check":"","notes":[],"law":"424条1項・424条の7第1項2項・426条（行使方法・被告・出訴期間）","cites":["民法/424","民法/424の7","民法/426"],"rate":27,"designed":true,"ref":false,"hash":"438d61a67534"},{"id":"民法/詐害行為取消権_要件と効果#6","block":"第6〔効果〕","kind":"cloze","masked":"債権者は、行為の取消しとともに、⟪逸出した財産の返還⟫を請求でき、返還が困難なときは⟦ア⟧を請求できる（424条の6）。取消しの範囲は、行為の目的が⟦イ⟧であるときは⟦ウ⟧に限られ、⟪⟦ア⟧を請求する場合も同様⟫である（424条の8第1項・2項）。返還の請求が⟪金銭の支払または動産の引渡し⟫を求めるものであるときは、債権者は、受益者に対してはその支払または引渡しを、転得者に対してはその引渡しを、⟦エ⟧することを求めることができる（424条の9第1項）。債務者が受領を拒めば制度目的を達しえないからである。\n認容判決は、⟦オ⟧に対しても効力を有する（425条）。取消しの効果が債務者に及ぶ結果、財産処分行為が取り消された受益者は債務者に⟦カ⟧を請求でき（425条の2）、債務消滅行為が取り消された受益者は給付を返還すれば⟦キ⟧（425条の3）。\nなお、債権者が自己への支払を受け、これを自己の債権と相殺すれば⟦ク⟧を受けることになるが、他の債権者による分配請求も⟨1⟩、受益者である債権者による按分額の支払拒絶も⟨2⟩、認められない。","body":"債権者は、行為の取消しとともに、⟪逸出した財産の返還⟫を請求でき、返還が困難なときは⟪価額の償還⟫を請求できる（424条の6）。取消しの範囲は、行為の目的が⟪可分⟫であるときは⟪自己の債権の額の限度⟫に限られ、⟪価額の償還を請求する場合も同様⟫である（424条の8第1項・2項）。返還の請求が⟪金銭の支払または動産の引渡し⟫を求めるものであるときは、債権者は、受益者に対してはその支払または引渡しを、転得者に対してはその引渡しを、⟪自己に対して⟫することを求めることができる（424条の9第1項）。債務者が受領を拒めば制度目的を達しえないからである。\n認容判決は、⟪債務者およびその全ての債権者⟫に対しても効力を有する（425条）。取消しの効果が債務者に及ぶ結果、財産処分行為が取り消された受益者は債務者に⟪反対給付の返還⟫を請求でき（425条の2）、債務消滅行為が取り消された受益者は給付を返還すれば⟪債権が原状に復する⟫（425条の3）。\nなお、債権者が自己への支払を受け、これを自己の債権と相殺すれば⟪事実上の優先弁済⟫を受けることになるが、他の債権者による分配請求も⟨1⟩、受益者である債権者による按分額の支払拒絶も⟨2⟩、認められない。","answers":["価額の償還","可分","自己の債権の額の限度","自己に対して","債務者およびその全ての債権者","反対給付の返還","債権が原状に復する","事実上の優先弁済"],"check":"","notes":[{"n":1,"label":"最判 昭和37・10・9","case":"最判 昭和37・10・9","gist":"他の債権者による**分配請求権**は認められない。"},{"n":2,"label":"最判 昭和46・11・19","case":"最判 昭和46・11・19","gist":"受益者である債権者は、自己の債権に係る**按分額の支払を拒む**ことができない。"}],"law":"","cites":["民法/424の6","民法/424の8","民法/424の9","民法/425","民法/425の2","民法/425の3"],"rate":26,"designed":true,"ref":false,"hash":"2211395c54d6"}],"setsurei":["Aは、Bに対し弁済期の到来した1000万円の貸金債権を有している。Bには他にも債権者Xらがおり、Bは弁済期にある債務を一般的・継続的に弁済できない状態に陥っていた。この状態のもとで、Bは、債権者の一人であるCと相談のうえ、Cに対する既存の800万円の債務の弁済に代えて、Bの唯一の財産である甲不動産（時価1000万円）をCに譲渡し、移転登記を了した。Aは、B・C間の代物弁済を取り消し、甲不動産の返還を求めることができるか。**Cが「取り消されるとしても自分の債権額に応じた按分額の支払は拒める」と主張した場合**はどうか。","Bは、Aに対し1000万円の債務を負っていたところ、唯一の見るべき財産である乙不動産（時価1000万円）を、Cに代金1000万円で売却した。Bは、受け取った代金を親族名義の口座に移して債権者から隠す意図であり、Cもその事情を知っていた。その後Cは乙不動産をDに転売した。**(1) DがBの上記意図を知らなかった場合**、**(2) Dが知っていた場合**、Aは誰に対し何を請求できるか。"],"full":"1 総論・被保全債権\n詐害行為取消権は、債務者の責任財産を保全し、強制執行の準備をするための制度である。したがって被保全債権は、⟪強制執行により実現⟫することのできる債権でなければならず（⟪424条4項⟫）、原則として⟪金銭債権⟫であることを要する。もっとも、⦅特定物の引渡請求権であっても、究極においては⟪損害賠償請求権に変じうる⟫以上、債務者の一般財産による担保を必要とする点で金銭債権と異ならないから、被保全債権となりうると解する⦆⟨1⟩。\nまた、被保全債権は、詐害行為の⟪前の原因⟫に基づいて生じたものでなければならない（⟪424条3項⟫）。債権者は、自己の債権の発生原因が生ずる前の債務者の財産処分にまで介入すべきではないからである。\n\n2 詐害行為性（客観的要件）\n取消しの対象は⟪財産権を目的とする行為⟫に限られる（424条2項）。共同担保の保全に適さない行為にまで他人の干渉を認めるべきではないからである。\n加えて、その行為により⟪債務者が無資力となること⟫を要し、無資力は⟪詐害行為の時と取消権行使の時⟫の双方で必要である。責任財産が保全されている限り、取消しを認める必要がないからである。\n詐害行為にあたるかは、⟪行為の詐害性（客観面）と債務者の主観（主観面）との相関関係⟫で判断され、民法は類型ごとに要件を定める。\n(1) ⟪相当の対価を得てした財産の処分行為⟫は、財産の総額に変動がない以上、原則として詐害行為とならない。もっとも、①その行為が⟪不動産の金銭への換価その他の財産の種類の変更により、隠匿等の処分をするおそれを現に生じさせる⟫ものであり、②債務者が行為当時に⟪隠匿等の処分をする意思⟫を有し、③受益者がその意思を⟪知っていた⟫ときは、取消請求ができる（424条の2各号）。\n(2) ⟪既存の債務についての担保の供与・債務の消滅に関する行為（偏頗行為）⟫は、責任財産の総額を減少させない以上、原則として詐害行為とならない。もっとも、①⟪支払不能の時⟫にされ、②債務者と受益者とが⟪通謀して他の債権者を害する意図⟫をもってされたときは、抜け駆け的な満足を与えるものとして取消請求ができる（424条の3第1項）。義務に属しない行為・時期が義務に属しない行為（期限前弁済等）は詐害性が大きいから、支払不能の時である必要はなく、①⟪支払不能になる前30日以内⟫にされ、かつ②⟪通謀害意⟫があるときに取消請求ができる（同条2項）。\n(3) ⟪過大な代物弁済等⟫は、⟪消滅した債務の額⟫に相当する部分以外の部分について、424条の要件を満たす限り取消請求ができる（⟪424条の4⟫）。\n\n3 詐害意思（主観的要件）と受益者の悪意\n債務者が、その行為によって⟪債権者を害することを知っていた⟫ことを要する（⟪424条1項本文⟫）。\n他方、受益者がその行為の時において債権者を害することを⟪知らなかった⟫ときは、⟪取消請求ができない⟫（同項ただし書）。受益者の取引の安全を害すべきでないからである。ただし書である以上、⟪受益者の善意は受益者側⟫が主張立証すべきである。\n\n4 転得者に対する請求\n転得者に対して取消請求をするには、⟪受益者に対して取消請求をすることができる⟫ことを前提として、その転得者が転得の当時、債務者がした行為が⟪債権者を害することを知っていた⟫ことを要する（⟪424条の5第1号⟫）。転得者が他の転得者から転得した者であるときは、その転得者および⟪その前に転得した全ての転得者⟫が、それぞれの転得の当時に悪意であったことを要する（同条2号）。転得者は債務者の資産状態を知りうる立場に一般になく、途中に⟪善意者が介在⟫した場合にまで取消しを及ぼすと取引の安全を害するからである。\n\n5 行使方法\n詐害行為取消権は、⟪裁判上⟫行使しなければならない（424条1項「裁判所に請求する」）。被告となるのは受益者または転得者であり、⟪債務者は被告とならない⟫（⟪424条の7第1項⟫）。もっとも認容判決の効力は債務者に及ぶから、債権者は訴え提起後遅滞なく⟪債務者に訴訟告知⟫をしなければならない（同条2項）。債務者に訴訟に関与する機会を保障する趣旨である。\n訴えは、⟪債務者が債権者を害することを知って行為をしたことを債権者が知った時⟫から⟪2年⟫、行為の時から⟪10年⟫を経過したときは提起できない（426条）。\n\n6 効果\n債権者は、行為の取消しとともに、⟪逸出した財産の返還⟫を請求でき、返還が困難なときは⟪価額の償還⟫を請求できる（424条の6）。取消しの範囲は、行為の目的が⟪可分⟫であるときは⟪自己の債権の額の限度⟫に限られ、⟪価額の償還を請求する場合も同様⟫である（424条の8第1項・2項）。返還の請求が⟪金銭の支払または動産の引渡し⟫を求めるものであるときは、債権者は、受益者に対してはその支払または引渡しを、転得者に対してはその引渡しを、⟪自己に対して⟫することを求めることができる（424条の9第1項）。債務者が受領を拒めば制度目的を達しえないからである。\n認容判決は、⟪債務者およびその全ての債権者⟫に対しても効力を有する（425条）。取消しの効果が債務者に及ぶ結果、財産処分行為が取り消された受益者は債務者に⟪反対給付の返還⟫を請求でき（425条の2）、債務消滅行為が取り消された受益者は給付を返還すれば⟪債権が原状に復する⟫（425条の3）。\nなお、債権者が自己への支払を受け、これを自己の債権と相殺すれば⟪事実上の優先弁済⟫を受けることになるが、他の債権者による分配請求も⟨1⟩、受益者である債権者による按分額の支払拒絶も⟨2⟩、認められない。","kata":"","hanrei":[["最二小判 平成30・12・14","①詐害行為取消訴訟は**形成訴訟**であり効果は判決確定により生ずるが、②その**効果は過去に遡って生ずる**。③制度目的は詐害行為の取消し・逸出財産の回復・一般財産の保全にあり、④**受益者等が財産を逸出させた責任**を原因として回復義務を生じさせる。したがって受益者の受領金支払債務は受領時に遡って生ずるが、**期限の定めのない債務**であって、**履行の請求を受けた時**に遅滞に陥る（412条3項）","**百選Ⅱ〔第9版〕11番「詐害行為取消権の制度趣旨」**（解説：沖野眞已）。**第9版で新規収録**。**[旧法]**（改正前の制度下の事案）だが、①〜④はいずれも**はじめての最高裁判断**で、制度の基本に関わる"],["大民連判 明治44・3・24　民録17輯117頁","詐害行為取消権の性質（旧法下のいわゆる相対的取消し＝折衷説）。取消しの効果は訴訟当事者間に限定され、**債務者には及ばない**","**〔第8版〕14番。第9版では削除された**（代わりに平30・12・14 が11番に入った＝**改正を反映した入れ替え**）。**現行法では425条・424条の7が明文で決着させたので、答案で法的性質を論じない**"],["最大判 昭和36・7・19　民集15巻7号1875頁","特定物債権も究極において損害賠償債権に変じうるから、被保全債権となりうる。また、現物返還が不可能・著しく困難で全部取消しが公平を欠く場合は価額償還による一部取消しによる。","**百選Ⅱ〔第9版〕12番＝〔第8版〕15番**（解説：森田修）。理論構成は明示されていない。**後段（一部取消し）が改正後も維持されるかは不明**とする指摘がある（アガルート重要問題修得講座-民法 p.185）"],["最一小判 昭和53・10・5　民集32巻7号1332頁","特定物債権者は、取消しの結果として**自己名義への移転登記**を求めることはできない。","**百選Ⅱ〔第9版〕13番＝〔第8版〕16番**（第9版解説：片山直也／第8版：早川眞一郎）。理由＝債務者の受領が観念できない／177条の趣旨を無にする"],["最二小判 平成10・6・12","**債権譲渡の通知**（対抗要件具備行為）は詐害行為取消しの対象とならない。","**百選Ⅱ〔第9版〕14番＝〔第8版〕17番**（解説：北居功）。登記につき最判昭55・1・24 も同旨"],["最三小判 昭和63・7・19","詐害行為の一部取消しと価額償還（価額算定の基準時）","**〔第8版〕18番。第9版では削除**（第9版のⅢ責任財産の保全は11〜14番で終わる）。基準時＝事実審口頭弁論終結時（最判昭50・12・1 民集29巻11号1847頁も同旨）"],["最判 昭和58・12・19　民集37巻10号1532頁","離婚に伴う財産分与は、768条3項の趣旨に反して不相当に過大であり財産分与に仮託してされた財産処分と認めるに足りる特段の事情がない限り、詐害行為とならない。","**百選には未収録**（`判例百選_収録判例リスト.md` で民法Ⅰ〜Ⅲ全版をgrepして確認済み）"],["最判 平成12・3・9　民集54巻3号1013頁","上記特段の事情がある場合でも、取り消せるのは**不相当に過大な部分**に限られる（一部取消し）。","**百選Ⅲ〔第3版〕19番＝〔第2版〕19番**（**両版とも19番**）「離婚に伴う財産分与（金銭給付合意）と詐害行為取消しの範囲」（第3版解説：森田修）。アガルート総合講義-民法 p.214 の【百選Ⅲ19】表記は**正しかった**"],["最判 昭和49・9・20　民集28巻6号1202頁","**相続放棄**は詐害行為取消しの対象とならない。","理由＝消極的に増加を妨げるにすぎない／承認の強制になる。百選には未収録"],["最判 平成11・6・11　民集53巻5号898頁","**遺産分割協議**は、その性質上財産権を目的とする法律行為であり、取消しの対象となる。","**百選Ⅲ〔第3版〕76番＝〔第2版〕69番**「遺産分割協議と詐害行為取消権」（第3版解説：森田宏樹）"],["最判 昭和30・10・11","目的物が**不可分**であるときは、被保全債権額を超えても原則として全部の取消しが認められる。","424条の8の反対解釈として整理される"],["最判 昭和54・1・25","不当な利益を受ける者がいない場合（一般債権者への代物弁済等）は、原則どおり全部の取消しが認められる。","最判昭62・4・7 も同旨"],["最判 昭和40・9・17","転得者に対しては、登記の抹消ではなく**債務者への移転登記**を求めるべきである。","理由＝抹消では受益者名義に戻り、善意の受益者の取引安全を害する"],["最判 昭和37・10・9","他の債権者による**分配請求権**は認められない。",""],["最判 昭和46・11・19","受益者である債権者は、自己の債権に係る**按分額の支払を拒む**ことができない。","現行法では425条の3（返還が先履行）から説明できる"],["最判 昭和33・9・26　民集12巻13号3022頁","旧法下の弁済の詐害性に関する通謀的害意論。","**424条の3第1項が支払不能要件を加えて要件を加重したので、現行法では条文で処理する**（民法判例百選Ⅲ 親族・相続〔第2版〕p.53 の解説がこの経緯を明示）"]],"field":"責任財産の保全","order":29},{"name":"詐欺と第三者_96条3項","subject":"民法","rank":"B","path":"まとめ/民法/論証/詐欺と第三者_96条3項.md","cards":[{"id":"民法/詐欺と第三者_96条3項#1","block":"第1〔取消し前の第三者〕","kind":"cloze","masked":"詐欺による意思表示の取消しは、⟦ア⟧第三者に対抗することができない（⟦イ⟧）。同項は、⟦ウ⟧することによって、これにより特に害される第三者を保護する趣旨である。\nそこで⦅「第三者」とは、当事者及びその包括承継人以外の者で、詐欺による法律行為に基づき取得された権利につき、⟪取消し前に⟫⟦エ⟧を有するに至った者をいうと解する⦆⟨1⟩。\nまた、⦅第三者は表意者と⟦オ⟧から、⟦カ⟧と解する⦆⟨2⟩。","body":"詐欺による意思表示の取消しは、⟪善意でかつ過失がない⟫第三者に対抗することができない（⟪96条3項⟫）。同項は、⟪取消しの遡及効（121条）を制限⟫することによって、これにより特に害される第三者を保護する趣旨である。\nそこで⦅「第三者」とは、当事者及びその包括承継人以外の者で、詐欺による法律行為に基づき取得された権利につき、⟪取消し前に⟫⟪新たに独立の法律上の利害関係⟫を有するに至った者をいうと解する⦆⟨1⟩。\nまた、⦅第三者は表意者と⟪前主後主の関係に立ち対抗関係にない⟫から、⟪登記を備えることを要しない⟫と解する⦆⟨2⟩。","answers":["善意でかつ過失がない","96条3項","取消しの遡及効（121条）を制限","新たに独立の法律上の利害関係","前主後主の関係に立ち対抗関係にない","登記を備えることを要しない"],"check":"","notes":[{"n":1,"label":"大判昭和17・9・30","case":"大判昭和17・9・30（民集21巻911頁）","gist":"96条3項の「第三者」は「取消前より既に其の行為の効力に付利害関係を有せる第三者」に限る。取消し後に権利を取得した者は、取消しの事実を知らなかったとしても同項の保護を受けられない。取消し後の第三者との関係は177条の対抗問題となり、対抗要件を先に備えた者が優先する"},{"n":2,"label":"最判昭和49・9・26","case":"最判昭和49・9・26（民集28巻6号1213頁）","gist":"96条3項の第三者の範囲は立法趣旨に照らして合理的に画定されるべきで、「必ずしも、所有権その他の物権の転得者で、かつ、これにつき対抗要件を備えた者に限定しなければならない理由は、見出し難い」。農地につき仮登記移転の付記登記を経由した売渡担保権者を「第三者」に当たるとした"}],"law":"","cites":["民法/96","民法/121"],"rate":12,"designed":true,"ref":false,"hash":"9a7e2e4a7c48"},{"id":"民法/詐欺と第三者_96条3項#2","block":"第2〔取消し後の第三者〕","kind":"cloze","masked":"取消し後に現れた第三者には、96条3項は⟦ア⟧。もっとも、取消しの遡及効は法的な擬制にすぎず、取消しによって相手方から表意者への⟦イ⟧が生じたとみることができ、相手方を起点とする⟦ウ⟧の関係に立つ。\nそこで、⦅取消し後の第三者と表意者とは対抗関係に立ち、⟦エ⟧によって優劣が決まると解する⦆⟨1⟩（⟦オ⟧）。","body":"取消し後に現れた第三者には、96条3項は⟪適用されない⟫。もっとも、取消しの遡及効は法的な擬制にすぎず、取消しによって相手方から表意者への⟪復帰的物権変動⟫が生じたとみることができ、相手方を起点とする⟪二重譲渡類似⟫の関係に立つ。\nそこで、⦅取消し後の第三者と表意者とは対抗関係に立ち、⟪登記の先後⟫によって優劣が決まると解する⦆⟨1⟩（⟪177条⟫）。","answers":["適用されない","復帰的物権変動","二重譲渡類似","登記の先後","177条"],"check":"","notes":[{"n":1,"label":"大判昭和17・9・30","case":"大判昭和17・9・30（民集21巻911頁）","gist":"96条3項の「第三者」は「取消前より既に其の行為の効力に付利害関係を有せる第三者」に限る。取消し後に権利を取得した者は、取消しの事実を知らなかったとしても同項の保護を受けられない。取消し後の第三者との関係は177条の対抗問題となり、対抗要件を先に備えた者が優先する"}],"law":"","cites":["民法/96","民法/177"],"rate":2,"designed":true,"ref":false,"hash":"c4e26aad1e75"}],"setsurei":["A は所有する甲土地を B に売却し、移転登記を了した。ところが A の売却の意思表示は B の詐欺によるものであった。B は甲土地を C に転売したが、C はまだ移転登記を得ていない。C は、B の詐欺の事実を知らず、知らないことに過失もなかった。 その後、A は AB 間売買を詐欺により取り消し、C に対して甲土地の所有権を主張した。A の主張は認められるか。","A は所有する甲土地を B に売却し、移転登記を了した。A は、B の詐欺を理由に AB 間売買を取り消したが、登記を戻さないまま放置していた。その後、B は甲土地を C に売却し、C が先に移転登記を経由した。C は、A が既に取消しをしていた事実を**知っていた**。 A は C に対して甲土地の所有権を主張できるか。"],"full":"(1) 取消し前の第三者\n詐欺による意思表示の取消しは、⟪善意でかつ過失がない⟫第三者に対抗することができない（⟪96条3項⟫）。同項は、⟪取消しの遡及効（121条）を制限⟫することによって、これにより特に害される第三者を保護する趣旨である。\nそこで⦅「第三者」とは、当事者及びその包括承継人以外の者で、詐欺による法律行為に基づき取得された権利につき、⟪取消し前に⟫⟪新たに独立の法律上の利害関係⟫を有するに至った者をいうと解する⦆⟨1⟩。\nまた、⦅第三者は表意者と⟪前主後主の関係に立ち対抗関係にない⟫から、⟪登記を備えることを要しない⟫と解する⦆⟨2⟩。\n\n(2) 取消し後の第三者\n取消し後に現れた第三者には、96条3項は⟪適用されない⟫。もっとも、取消しの遡及効は法的な擬制にすぎず、取消しによって相手方から表意者への⟪復帰的物権変動⟫が生じたとみることができ、相手方を起点とする⟪二重譲渡類似⟫の関係に立つ。\nそこで、⦅取消し後の第三者と表意者とは対抗関係に立ち、⟪登記の先後⟫によって優劣が決まると解する⦆⟨1⟩（⟪177条⟫）。","kata":"| # | 落としてはいけない要素 | ランクBでの扱い |\n|---|---|---|\n| 1 | 96条3項・「善意でかつ**過失がない**第三者」 | **必須**（「善意の第三者」だけは✗＝旧法） |\n| 2 | 同項の趣旨＝**取消しの遡及効（121条）の制限**／第三者保護 | 必須（一言で可） |\n| 3 | 「第三者」＝**取消し前**に新たに独立の法律上の利害関係に入った者 | **必須**（「取消し前」が幹） |\n| 4 | 第三者は**登記不要**（前主後主で対抗関係でない） | 必須（結論のみで可。理由の言い回しは問わない） |\n| 5 | 取消し**後**の第三者には96条3項が適用されないこと | **必須** |\n| 6 | **復帰的物権変動**＋二重譲渡類似 → **177条**の対抗問題 | 必須（キーワード「復帰的物権変動」「177条」） |\n| 7 | 〔副〕94条2項類推説の存在と決め手（悪意者で結論が変わる） | **存在と決め手が言えれば可**（文言暗記は不要） |\n| 8 | 判例の年月日・百選番号 | **不要**（答案に書かないので暗記対象外） |\n\n**勝負どころ**：\n1. **取消しの「前」か「後」かで条文が切り替わる**ことを、場合分けとして最初に宣言できるか。ここを混ぜると答案が崩れる。\n2. **96条3項の第三者に登記が要らない**という結論と、**取消し後は登記の先後で決まる**という結論が、同じ答案の中で矛盾なく並べられるか（理由が違うから矛盾しない、と説明できるか）。\n3. 改正後の**「善意でかつ過失がない」**を落とさないこと。\n\n> ⚠️ **間違えやすい点**\n> - **「善意の第三者」（旧法の文言）で書く**——2020年4月施行の改正で**善意無過失**になっている。H27〜R1 の過去問・解説は旧文言なので、そのまま写さない。\n> - **強迫にも96条3項が使えると書く**——96条3項は**詐欺のみ**。強迫は反対解釈で第三者保護なし（取消し前の第三者には取消権者が勝つ）。ただし**取消し後**は強迫でも177条の対抗問題になる。\n> - **取消し後の第三者に96条3項を適用してしまう**——判例は「既に取消しがされた後に権利を取得した第三者は、取消しの事実を知らなかったとしても同規定の保護を受けられない」とする（大判昭和17・9・30）。\n> - **設例2で「C が悪意だから負ける」と書く**——判例（177条構成）では単純悪意は結論に影響しない。悪意で結論を変えたいなら〔副〕学説ルートに乗る必要がある。","hanrei":[["大判昭和17・9・30（民集21巻911頁）","96条3項の「第三者」は「取消前より既に其の行為の効力に付利害関係を有せる第三者」に限る。取消し後に権利を取得した者は、取消しの事実を知らなかったとしても同項の保護を受けられない。取消し後の第三者との関係は177条の対抗問題となり、対抗要件を先に備えた者が優先する","**民法判例百選Ⅰ〔第9版〕51番＝〔第8版〕55番＝〔第7版〕53番**「法律行為の取消しと登記」（解説：金子敬明。第9版は「Ⅰ 物権総則 (3) 不動産物権変動」の章）"],["最判昭和49・9・26（民集28巻6号1213頁）","96条3項の第三者の範囲は立法趣旨に照らして合理的に画定されるべきで、「必ずしも、所有権その他の物権の転得者で、かつ、これにつき対抗要件を備えた者に限定しなければならない理由は、見出し難い」。農地につき仮登記移転の付記登記を経由した売渡担保権者を「第三者」に当たるとした","**民法判例百選Ⅰ〔第9版〕23番＝〔第8版〕23番＝〔第7版〕23番**（**3版とも23番**）。表題は第9版「詐欺における第三者の登記の必要性」／第8版「詐欺における善意の第三者の登記の必要性」（解説：竹中悟人）"],["大判昭和4・2・20（民集8巻59頁）","強迫による取消し前の第三者との関係では、取消権者は取消しによる無効を第三者に対抗できる","`短答\\伊藤真の速習短答過去問 民法` p.129。**百選の収録判例としては不掲載**だが、百選Ⅰ〔第8版〕p.124 が「やや複雑な強迫の事例」として本文で論じている（巻頁もそこで確認）。なお同頁は、この法理を述べた先例として大判明治39・12・13（刑録12輯1360頁・強迫の事例）を挙げる"],["大判明治33・5・7／大判昭和7・8・9","単に反射的な利益を受けるにすぎない者は96条3項の「第三者」に含まれない","百選Ⅰ〔第8版〕p.61 が引用。**百選リストに掲載なし**"]],"field":"意思表示（錯誤・詐欺）","order":1},{"name":"譲受人に対する抗弁_468条","subject":"民法","rank":"A","path":"まとめ/民法/論証/譲受人に対する抗弁_468条.md","cards":[{"id":"民法/譲受人に対する抗弁_468条#1","block":"第1〔原則——抗弁は承継される〕","kind":"cloze","masked":"債務者は、⟦ア⟧までに譲渡人に対して⟦イ⟧をもって譲受人に対抗することができる（⟦ウ⟧）。債権譲渡は、債権の⟦エ⟧を変えることなくその帰属主体を変更するものであるから、債権に付着していた抗弁事由は譲渡後もそのまま存続し、また、⟦オ⟧債権譲渡によって債務者が不利益を受けるべきではないからである。\n対抗できる事由の例としては、弁済その他による債権の消滅、譲渡債権を発生させた契約の無効・取消し・解除による債権の不成立・消滅、同時履行の抗弁権などがある。","body":"債務者は、⟪対抗要件具備時⟫までに譲渡人に対して⟪生じた事由⟫をもって譲受人に対抗することができる（⟪468条1項⟫）。債権譲渡は、債権の⟪同一性⟫を変えることなくその帰属主体を変更するものであるから、債権に付着していた抗弁事由は譲渡後もそのまま存続し、また、⟪自らの関与しない⟫債権譲渡によって債務者が不利益を受けるべきではないからである。\n対抗できる事由の例としては、弁済その他による債権の消滅、譲渡債権を発生させた契約の無効・取消し・解除による債権の不成立・消滅、同時履行の抗弁権などがある。","answers":["対抗要件具備時","生じた事由","468条1項","同一性","自らの関与しない"],"check":"1 ／ ①**468条1項** ②「対抗要件具備時までに譲渡人に対して生じた事由」 ③趣旨2本（債権の同一性／債務者の関与なき不利益の禁止） ④例の1つ（弁済・解除・同時履行の抗弁のどれか）","notes":[],"law":"","cites":["民法/468"],"rate":12,"designed":true,"ref":false,"hash":"9647c7165f93"},{"id":"民法/譲受人に対する抗弁_468条#2","block":"第2〔基準時——対抗要件具備時〕","kind":"cloze","masked":"ここにいう「対抗要件具備時」とは、譲渡人が債務者に通知をし、又は債務者が承諾をした時、すなわち⟦ア⟧（⟦イ⟧）が具備された時をいう。したがって、債権譲渡より後に生じた事由であっても、⟦ア⟧が具備される時までに生じたものであれば、譲受人に対抗することができる。\nもっとも、譲渡制限の意思表示がされた債権が譲渡された場合には、基準時が⟦ウ⟧（⟦エ⟧）。すなわち、譲受人が悪意又は重過失であって譲受人が譲渡人への履行を催告した場合（466条4項の場合）には「⟦オ⟧」が、譲渡人について破産手続開始の決定があった場合（466条の3の場合）には「⟦カ⟧」が、それぞれ基準時となる。債務者が譲渡制限の意思表示をもって譲受人に対抗できなくなった時点を基準とするのが相当だからである。","body":"ここにいう「対抗要件具備時」とは、譲渡人が債務者に通知をし、又は債務者が承諾をした時、すなわち⟪債務者対抗要件⟫（⟪467条1項⟫）が具備された時をいう。したがって、債権譲渡より後に生じた事由であっても、債務者対抗要件が具備される時までに生じたものであれば、譲受人に対抗することができる。\nもっとも、譲渡制限の意思表示がされた債権が譲渡された場合には、基準時が⟪後にずれる⟫（⟪468条2項⟫）。すなわち、譲受人が悪意又は重過失であって譲受人が譲渡人への履行を催告した場合（466条4項の場合）には「⟪相当の期間を経過した時⟫」が、譲渡人について破産手続開始の決定があった場合（466条の3の場合）には「⟪譲受人から供託の請求を受けた時⟫」が、それぞれ基準時となる。債務者が譲渡制限の意思表示をもって譲受人に対抗できなくなった時点を基準とするのが相当だからである。","answers":["債務者対抗要件","467条1項","後にずれる","468条2項","相当の期間を経過した時","譲受人から供託の請求を受けた時"],"check":"2 ／ ①**債務者対抗要件**具備時（**467条1項**の通知・承諾） ②譲渡後・具備前の事由も対抗可 ③**468条2項**の読み替え2つ（**466条4項**→相当期間経過時／**466条の3**→供託請求を受けた時） ④読み替えは基準時を**後ろへ**ずらす（債務者に有利）／理由＝譲渡制限の意思表示で対抗できなくなった時点","notes":[],"law":"","cites":["民法/467","民法/468","民法/466","民法/466の3"],"rate":32,"designed":true,"ref":false,"hash":"fe5eae8c4bb6"},{"id":"民法/譲受人に対する抗弁_468条#3","block":"第3〔「事由」の範囲——基礎があれば足りる〕","kind":"cloze","masked":"では、基準時においてまだ抗弁事由それ自体が発生していない場合はどうか。\n468条1項の趣旨が、債務者の関与しない債権譲渡によって債務者の⟦ア⟧を害してはならない点にあることからすれば、基準時に抗弁事由それ自体が発生している必要はなく、⟦イ⟧が基準時に存在していれば足りると解する。\nしたがって、双務契約から生じた債権が譲渡された場合には、⦅基準時に⟦ウ⟧ことまでは必要でなく、⟦エ⟧や目的物の契約不適合といった解除・減額の原因が基準時までに存在していれば足りる⦆⟨1⟩。債務者は、基準時より後に解除や代金減額の意思表示をして、これによる債権の消滅・減額を譲受人に対抗することができる。\nただし、債務不履行があるかもしれないという単なる⟦オ⟧が基準時に存在したというだけでは足りない。","body":"では、基準時においてまだ抗弁事由それ自体が発生していない場合はどうか。\n468条1項の趣旨が、債務者の関与しない債権譲渡によって債務者の⟪法律上の地位⟫を害してはならない点にあることからすれば、基準時に抗弁事由それ自体が発生している必要はなく、⟪抗弁事由発生の基礎⟫が基準時に存在していれば足りると解する。\nしたがって、双務契約から生じた債権が譲渡された場合には、⦅基準時に⟪解除権が発生している⟫ことまでは必要でなく、⟪未履行の反対給付義務⟫や目的物の契約不適合といった解除・減額の原因が基準時までに存在していれば足りる⦆⟨1⟩。債務者は、基準時より後に解除や代金減額の意思表示をして、これによる債権の消滅・減額を譲受人に対抗することができる。\nただし、債務不履行があるかもしれないという単なる⟪抽象的・一般的な可能性⟫が基準時に存在したというだけでは足りない。","answers":["法律上の地位","抗弁事由発生の基礎","解除権が発生している","未履行の反対給付義務","抽象的・一般的な可能性"],"check":"3 ／ ①基準時に抗弁事由**そのものの発生は不要** ②**抗弁事由発生の基礎**があれば足りる ③理由＝債務者の法律上の地位を害さない ④双務契約なら**未履行の反対給付義務／契約不適合**が基礎になる ⑤**単なる抽象的・一般的可能性では足りない**（限界）","notes":[{"n":1,"label":"最判昭42・10・27","case":"最二小判 **昭和42・10・27**（民集21巻8号2161頁）","gist":"**判旨i**「報酬請求権が第三者に譲渡され対抗要件をそなえた後に請負人の仕事完成義務不履行が生じこれに基づき請負契約が解除された場合においても、右債権譲渡前すでに反対給付義務が発生している以上、債権譲渡時すでに契約解除を生ずるに至るべき原因が存在していたものというべきである」"}],"law":"","cites":["民法/468"],"rate":4,"designed":true,"ref":false,"hash":"48ff7b72f0c7"},{"id":"民法/譲受人に対する抗弁_468条#4","block":"第4〔第三者保護規定との調整〕","kind":"cloze","masked":"譲渡債権を発生させた契約に意思表示の瑕疵がある場合、譲受人は第三者保護規定によって保護されうるから、468条1項との適用関係が問題となる。\n虚偽の外観を作り出し、あるいは自ら誤った債務者には⟦ア⟧が認められるから、この場合には⟦イ⟧すべきである。したがって、債務者は、通謀虚偽表示による無効を⟦ウ⟧の譲受人に（⟦エ⟧）、詐欺・錯誤による取消しを⟦オ⟧の譲受人に（⟦カ⟧）対抗することができない。\nこれに対し、解除については異なる。545条1項ただし書の「第三者」とは、解除された契約から生じた法律効果を基礎として解除までに新たな権利を取得した者をいい、解除によって消滅する債権そのものの譲受人は⦅これに⟦キ⟧⦆⟨1⟩と解する。譲受人を「第三者」に含めると、双務契約上の債権を譲渡するだけで常に解除を免れることになり、⟦ク⟧が失われるからである。したがって、債務者は、解除による債権の消滅を譲受人に対抗することができる。","body":"譲渡債権を発生させた契約に意思表示の瑕疵がある場合、譲受人は第三者保護規定によって保護されうるから、468条1項との適用関係が問題となる。\n虚偽の外観を作り出し、あるいは自ら誤った債務者には⟪帰責性⟫が認められるから、この場合には⟪第三者保護規定を優先⟫すべきである。したがって、債務者は、通謀虚偽表示による無効を⟪善意⟫の譲受人に（⟪94条2項⟫）、詐欺・錯誤による取消しを⟪善意無過失⟫の譲受人に（⟪96条3項・95条4項⟫）対抗することができない。\nこれに対し、解除については異なる。545条1項ただし書の「第三者」とは、解除された契約から生じた法律効果を基礎として解除までに新たな権利を取得した者をいい、解除によって消滅する債権そのものの譲受人は⦅これに⟪含まれない⟫⦆⟨1⟩と解する。譲受人を「第三者」に含めると、双務契約上の債権を譲渡するだけで常に解除を免れることになり、⟪解除権を認めた法の趣旨⟫が失われるからである。したがって、債務者は、解除による債権の消滅を譲受人に対抗することができる。","answers":["帰責性","第三者保護規定を優先","善意","94条2項","善意無過失","96条3項・95条4項","含まれない","解除権を認めた法の趣旨"],"check":"4 ／ ①虚偽表示＝**94条2項**優先（善意で足りる） ②詐欺・錯誤＝**96条3項・95条4項**優先（善意無過失） ③解除＝譲受人は**545条1項ただし書の「第三者」にあたらない**→債務者が対抗できる ④③の理由（新たな権利の取得でない／譲渡すれば常に解除を免れることになる）","notes":[{"n":1,"label":"大判大7・9・25","case":"**大判大正7・9・25**（民録24輯1811頁）","gist":"解除された契約から生じた**債権そのものの譲受人**は、545条1項ただし書の「第三者」に**あたらない**。したがって債務者は、解除による債権の消滅を譲受人に対抗できる"}],"law":"","cites":["民法/468","民法/94","民法/96","民法/95","民法/545"],"rate":7,"designed":true,"ref":false,"hash":"c6c21f920fbc"},{"id":"民法/譲受人に対する抗弁_468条#5","block":"第5〔抗弁の切断——放棄の意思表示〕","kind":"cloze","masked":"債務者は、468条による抗弁を放棄することができる。ただし、抗弁の放棄は⟦ア⟧であるから、債務者が単に⟦イ⟧債権譲渡を承諾しただけでは足りず、放棄される⟦ウ⟧したうえで、これを放棄する旨の⟦ア⟧をすることが必要である。\n放棄の効力は、譲受人の⟦エ⟧生ずる。","body":"債務者は、468条による抗弁を放棄することができる。ただし、抗弁の放棄は⟪意思表示⟫であるから、債務者が単に⟪異議を述べずに⟫債権譲渡を承諾しただけでは足りず、放棄される⟪抗弁が何であるかを認識⟫したうえで、これを放棄する旨の意思表示をすることが必要である。\n放棄の効力は、譲受人の⟪善意・悪意を問わず⟫生ずる。","answers":["意思表示","異議を述べずに","抗弁が何であるかを認識","善意・悪意を問わず"],"check":"5 ／ ①**抗弁放棄の意思表示**が必要 ②**異議を述べずに承諾しただけでは足りない** ③放棄する抗弁を債務者が認識していること ④効力は譲受人の善意・悪意を問わない","notes":[],"law":"","cites":["民法/468"],"rate":4,"designed":true,"ref":false,"hash":"23fa0be39bb4"},{"id":"民法/譲受人に対する抗弁_468条#6","block":"第6〔相殺との振り分け〕","kind":"cloze","masked":"代金減額請求権のように、行使によって⟦ア⟧する権利は、⟦イ⟧の「事由」として処理する。これに対し、債務者が譲渡人に対して有する債権を⟦ウ⟧として相殺する場合は、468条ではなく⟦エ⟧の問題である。","body":"代金減額請求権のように、行使によって⟪譲渡債権そのものが消滅・減少⟫する権利は、⟪468条1項⟫の「事由」として処理する。これに対し、債務者が譲渡人に対して有する債権を⟪自働債権⟫として相殺する場合は、468条ではなく⟪469条⟫の問題である。","answers":["譲渡債権そのものが消滅・減少","468条1項","自働債権","469条"],"check":"6 ／ ①代金減額（形成権）＝**468条1項** ②譲渡人に対する債権を自働債権とする相殺＝**469条**","notes":[],"law":"","cites":["民法/468","民法/469"],"rate":6,"designed":true,"ref":false,"hash":"255034662c60"}],"setsurei":["1. 令和2年5月20日、AはBとの間で、甲土地及び乙建物を代金6000万円でBに売却する契約（契約①）を締結した。Bは乙建物内でチェロの練習をする予定であったため、AB間で、乙建物が特に優れた防音性能を備えた物件であることが合意の内容とされた。 2. 契約①では、Bは契約時に1000万円を支払い、残額（5000万円）を甲土地・乙建物の引渡日から1か月以内に支払うこととされた。 3. 令和2年7月25日、Aは契約①に基づく残代金債権5000万円をCに代金4500万円で売却し、Cへの債権譲渡を通知する内容証明郵便が同月30日にBに到達した。 4. 令和2年9月25日、Bは甲土地・乙建物の引渡しを受けた。 5. 令和2年10月10日、Bが業者に点検させたところ、乙建物が契約①で合意された防音性能を備えていないことが判明した。この不備は乙建物の構造そのものに由来し、引渡し前から存在していた。 6. Bは、Aに対し、相当の期間を定めて防音工事による追完を催告したが、その期間内にAは何もしなかった。 7. 令和2年10月30日、CはBに対し残代金5000万円の支払を求めた。 Bは、乙建物に住み続けることを前提に、代金減額請求（563条1項）をしてCへの支払額を減らしたいと考えている。この主張は認められるか（相殺による処理は本設例では問わない）。","1. 令和6年4月1日、甲は乙との間で、代金1000万円で建物1棟を建築する請負契約を締結した。工事完成期限は同年8月31日、報酬は仕事の完成引渡しと同時に全額を支払う約定であった。 2. 令和6年5月10日、乙は、甲に対する報酬債権1000万円を丙に譲渡し、乙による譲渡通知が同月15日に甲に到達した。 3. 乙は令和6年8月に工事を中止し、完成期限（8月31日）を過ぎても建物を完成させなかった。中止時点の工事は基礎と柱の一部までで、甲はその出来形を建物として使用できず、別の業者に引き継がせるには出来形を撤去する必要がある状態であった。 4. 令和6年9月10日、甲は乙に対し、相当の期間を定めて工事の完成を催告したが、その期間内に乙は工事を再開しなかった。そこで令和6年10月1日、甲は請負契約を解除した（541条）。 5. 令和6年10月10日、丙は甲に対し報酬1000万円の支払を求めた。これに対し甲が解除による報酬債権の消滅を主張したところ、丙は、自分は解除前に債権を譲り受けた「第三者」（545条1項ただし書）であるから解除の効果は自分に及ばない、と反論した。 甲は丙の請求を拒めるか。"],"full":"債務者は、⟪対抗要件具備時⟫までに譲渡人に対して⟪生じた事由⟫をもって譲受人に対抗することができる（⟪468条1項⟫）。債権譲渡は、債権の⟪同一性⟫を変えることなくその帰属主体を変更するものであるから、債権に付着していた抗弁事由は譲渡後もそのまま存続し、また、⟪自らの関与しない⟫債権譲渡によって債務者が不利益を受けるべきではないからである。\n対抗できる事由の例としては、弁済その他による債権の消滅、譲渡債権を発生させた契約の無効・取消し・解除による債権の不成立・消滅、同時履行の抗弁権などがある。\n\nここにいう「対抗要件具備時」とは、譲渡人が債務者に通知をし、又は債務者が承諾をした時、すなわち⟪債務者対抗要件⟫（⟪467条1項⟫）が具備された時をいう。したがって、債権譲渡より後に生じた事由であっても、債務者対抗要件が具備される時までに生じたものであれば、譲受人に対抗することができる。\nもっとも、譲渡制限の意思表示がされた債権が譲渡された場合には、基準時が⟪後にずれる⟫（⟪468条2項⟫）。すなわち、譲受人が悪意又は重過失であって譲受人が譲渡人への履行を催告した場合（466条4項の場合）には「⟪相当の期間を経過した時⟫」が、譲渡人について破産手続開始の決定があった場合（466条の3の場合）には「⟪譲受人から供託の請求を受けた時⟫」が、それぞれ基準時となる。債務者が譲渡制限の意思表示をもって譲受人に対抗できなくなった時点を基準とするのが相当だからである。\n\nでは、基準時においてまだ抗弁事由それ自体が発生していない場合はどうか。\n468条1項の趣旨が、債務者の関与しない債権譲渡によって債務者の⟪法律上の地位⟫を害してはならない点にあることからすれば、基準時に抗弁事由それ自体が発生している必要はなく、⟪抗弁事由発生の基礎⟫が基準時に存在していれば足りると解する。\nしたがって、双務契約から生じた債権が譲渡された場合には、⦅基準時に⟪解除権が発生している⟫ことまでは必要でなく、⟪未履行の反対給付義務⟫や目的物の契約不適合といった解除・減額の原因が基準時までに存在していれば足りる⦆⟨1⟩。債務者は、基準時より後に解除や代金減額の意思表示をして、これによる債権の消滅・減額を譲受人に対抗することができる。\nただし、債務不履行があるかもしれないという単なる⟪抽象的・一般的な可能性⟫が基準時に存在したというだけでは足りない。\n\n譲渡債権を発生させた契約に意思表示の瑕疵がある場合、譲受人は第三者保護規定によって保護されうるから、468条1項との適用関係が問題となる。\n虚偽の外観を作り出し、あるいは自ら誤った債務者には⟪帰責性⟫が認められるから、この場合には⟪第三者保護規定を優先⟫すべきである。したがって、債務者は、通謀虚偽表示による無効を⟪善意⟫の譲受人に（⟪94条2項⟫）、詐欺・錯誤による取消しを⟪善意無過失⟫の譲受人に（⟪96条3項・95条4項⟫）対抗することができない。\nこれに対し、解除については異なる。545条1項ただし書の「第三者」とは、解除された契約から生じた法律効果を基礎として解除までに新たな権利を取得した者をいい、解除によって消滅する債権そのものの譲受人は⦅これに⟪含まれない⟫⦆⟨1⟩と解する。譲受人を「第三者」に含めると、双務契約上の債権を譲渡するだけで常に解除を免れることになり、⟪解除権を認めた法の趣旨⟫が失われるからである。したがって、債務者は、解除による債権の消滅を譲受人に対抗することができる。\n\n債務者は、468条による抗弁を放棄することができる。ただし、抗弁の放棄は⟪意思表示⟫であるから、債務者が単に⟪異議を述べずに⟫債権譲渡を承諾しただけでは足りず、放棄される⟪抗弁が何であるかを認識⟫したうえで、これを放棄する旨の意思表示をすることが必要である。\n放棄の効力は、譲受人の⟪善意・悪意を問わず⟫生ずる。\n\n代金減額請求権のように、行使によって⟪譲渡債権そのものが消滅・減少⟫する権利は、⟪468条1項⟫の「事由」として処理する。これに対し、債務者が譲渡人に対して有する債権を⟪自働債権⟫として相殺する場合は、468条ではなく⟪469条⟫の問題である。","kata":"","hanrei":[["**大判大正7・9・25**（民録24輯1811頁）","解除された契約から生じた**債権そのものの譲受人**は、545条1項ただし書の「第三者」に**あたらない**。したがって債務者は、解除による債権の消滅を譲受人に対抗できる","`基礎法\\民事\\プラクティス民法債権総論[第５版補訂]` p.503〜504（大判明42・5・14 民録15輯490頁と並べて判例・通説として引く）／`アガルート\\総合講義-民法` p.234。**2026-07-30 の査読で追加**（覚える論証 第4の注釈先が表に無く `build_cards.py` が警告を出したため）。⚠️ **有力な反対説がある**（プラクティス p.504＝545条1項ただし書も94条2項・96条3項と同趣旨だから解除前の譲受人も保護すべき／潮見『新債権総論Ⅱ』435頁＝解除後の譲渡なら対抗できない）。**結論が変わるのは「譲受人が対抗要件を備えた後に譲渡人が不履行に陥り債務者が解除する場面」**"],["最二小判 **昭和42・10・27**（民集21巻8号2161頁）","**判旨i**「報酬請求権が第三者に譲渡され対抗要件をそなえた後に請負人の仕事完成義務不履行が生じこれに基づき請負契約が解除された場合においても、右債権譲渡前すでに反対給付義務が発生している以上、債権譲渡時すでに契約解除を生ずるに至るべき原因が存在していたものというべきである」","**百選Ⅱ〔第8版〕27番**（`判例百選_版対応表.md`により**第9版では削除**。第9版の番号は存在しない）。改正前468条1項（異議をとどめない承諾）の事件だが、**判旨iは現行468条1項の「事由」の解釈に引き継がれる**（百選第8版27番解説 2(1)）。**判旨ii・iii（異議をとどめない承諾による切断／悪意の譲受人の不保護）は規定の削除により前提を失った**"],["最判 **平成27・6・1**（民集69巻4号672頁）","改正前468条1項の抗弁切断につき、譲受人の**善意無過失**を要するとした","百選リストに掲載なし。**改正前468条1項に関する判例であり、同項の削除により意義を失った**（百選第8版27番解説 2(3)②が明示）"],["最判 **平成9・11・11**（民集51巻10号4077頁）","賭博により生じた債権について、債務者が異議をとどめずに承諾しても、公序良俗違反による無効を主張して履行を拒むことができるとした","百選リストに掲載なし。**改正前468条1項に関する判例。**現行法では「抗弁放棄の意思表示の90条による無効」という形で受け継がれる（百選第8版27番解説 2(3)②／体系別短答過去問題集 民法(上) p.184）"],["大判 **明治42・5・14**（民録15輯490頁）／大判 **大正7・9・25**（民録24輯1811頁）","解除された契約から生じた債権そのものを譲り受けた者は、545条1項ただし書の「第三者」にあたらない","百選リストに掲載なし。**現行法でも維持**（プラクティス p.521・アガルート p.234・百選第8版27番解説 1(2)・2(2)③）"],["大判 **大正3・11・20**（民録20輯963頁）／大判 **大正4・7・10**（民録21輯111頁）","債権の譲受人は 94条2項の「第三者」にあたり、債務者は善意の譲受人に通謀虚偽表示による無効を主張できない","百選リストに掲載なし。**現行法でも維持**（プラクティス p.520・百選第8版27番解説 2(2)①）"],["最一小判 **昭和49・3・7**（民集28巻2号174頁）","債権の二重譲渡の優劣は、確定日付ある通知の**到達時**の先後で決まる（到達時説）","**百選Ⅱ〔第9版〕23番＝〔第8版〕29番**。本論証の直接の対象ではないが、468条1項の基準時（債務者対抗要件具備時）を認定する前提になる（完全講義 p.445）"]],"field":"債権譲渡","order":32},{"name":"譲渡制限の意思表示","subject":"民法","rank":"A","path":"まとめ/民法/論証/譲渡制限の意思表示.md","cards":[{"id":"民法/譲渡制限の意思表示#1","block":"第1〔原則——譲渡は有効〕","kind":"cloze","masked":"債権は、譲り渡すことができる（466条1項本文）。そして、当事者が債権の譲渡を禁止し、又は制限する旨の意思表示（譲渡制限の意思表示）をしたときであっても、債権の譲渡は、⟦ア⟧（⟦イ⟧）。債権の自由な譲渡性を重視し、⟦ウ⟧を確保する趣旨である。\nしたがって、譲受人は、譲渡制限の意思表示について悪意であっても重過失があっても⟦エ⟧し、譲渡人は⟦オ⟧。","body":"債権は、譲り渡すことができる（466条1項本文）。そして、当事者が債権の譲渡を禁止し、又は制限する旨の意思表示（譲渡制限の意思表示）をしたときであっても、債権の譲渡は、⟪その効力を妨げられない⟫（⟪466条2項⟫）。債権の自由な譲渡性を重視し、⟪債権の流動化⟫を確保する趣旨である。\nしたがって、譲受人は、譲渡制限の意思表示について悪意であっても重過失があっても⟪債権を取得⟫し、譲渡人は⟪もはや債権者ではない⟫。","answers":["その効力を妨げられない","466条2項","債権の流動化","債権を取得","もはや債権者ではない"],"check":"","notes":[],"law":"","cites":["民法/466"],"rate":32,"designed":true,"ref":true,"hash":"ce5dcbb539fe"},{"id":"民法/譲渡制限の意思表示#2","block":"第2〔債務者の抗弁——履行拒絶と譲渡人への弁済〕","kind":"cloze","masked":"もっとも、譲渡制限の意思表示は、⟦ア⟧することについての債務者の利益を保護するためのものである。そこで、譲渡制限の意思表示がされたことを知り、又は重大な過失によって知らなかった譲受人その他の第三者に対しては、債務者は、⟦イ⟧ことができ、かつ、譲渡人に対する弁済その他の債務を消滅させる事由をもってその第三者に対抗する
