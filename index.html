*（判時2078号22頁）","gist":"持分を有しない者が共有名義の保存登記を有する場合、共有者の一人は**自己の持分についての更正登記手続を求められるにとどまり、他の共有者の持分についてまでは求められない**"}],"law":"","cites":[],"rate":0,"designed":true,"ref":false,"hash":"d6585ba51169"},{"id":"民法/共有（持分権に基づく請求・管理変更・共有物分割）#7","block":"第4〔分割〕","kind":"cloze","masked":"各共有者は、いつでも共有物の分割を請求することができる（256条1項本文）。協議が調わないとき、又は協議をすることができないときは、裁判所に分割を請求することができる（258条1項）。\n裁判所は、⟪現物分割⟫（258条2項1号）又は⟦ア⟧（共有者に債務を負担させて他の共有者の持分の全部又は一部を取得させる方法。同項2号）により分割を命ずることができ、これらの方法によることができないとき、又は分割によってその⟦イ⟧があるときに限り、⟦ウ⟧を命ずることができる（同条3項）。\n共有物を共有者の一人の単独所有とし、その者に他の共有者の持分の価格を賠償させる方法（全面的価格賠償）は、\n⟪[1]⟫ 共有物の性質及び形状、共有関係の発生原因、共有者の数及び持分の割合、共有物の利用状況及び分割された場合の経済的価値、分割方法についての共有者の希望及びその合理性の有無等の事情を総合的に考慮し、⟦エ⟧であると認められ、かつ\n⟪[2]⟫ その価格が適正に評価され、取得する者に⟦オ⟧があって、他の共有者にはその持分の価格を取得させることとしても共有者間の⟦カ⟧と認められる\n⦅⟪特段の事情が存するとき⟫に許される⦆⟨1⟩。裁判所による共有物の分割は、その本質は非訟事件であって、⟪共有者間の公平を保ちつつ、当該共有物の性質や共有状態の実状に合った妥当な分割を実現すべき⟫ものだからである。\nなお、共有物の全部又はその持分が相続財産に属し、⟦キ⟧は、その共有物又は持分について258条による分割をすることができない（258条の2第1項）。ただし、持分が相続財産に属する場合において⟦ク⟧を経過したときは、この限りでない（同条2項本文）。","body":"各共有者は、いつでも共有物の分割を請求することができる（256条1項本文）。協議が調わないとき、又は協議をすることができないときは、裁判所に分割を請求することができる（258条1項）。\n裁判所は、⟪現物分割⟫（258条2項1号）又は⟪賠償分割⟫（共有者に債務を負担させて他の共有者の持分の全部又は一部を取得させる方法。同項2号）により分割を命ずることができ、これらの方法によることができないとき、又は分割によってその⟪価格を著しく減少させるおそれ⟫があるときに限り、⟪競売⟫を命ずることができる（同条3項）。\n共有物を共有者の一人の単独所有とし、その者に他の共有者の持分の価格を賠償させる方法（全面的価格賠償）は、\n⟪[1]⟫ 共有物の性質及び形状、共有関係の発生原因、共有者の数及び持分の割合、共有物の利用状況及び分割された場合の経済的価値、分割方法についての共有者の希望及びその合理性の有無等の事情を総合的に考慮し、⟪当該共有物を特定の者に取得させるのが相当⟫であると認められ、かつ\n⟪[2]⟫ その価格が適正に評価され、取得する者に⟪支払能力⟫があって、他の共有者にはその持分の価格を取得させることとしても共有者間の⟪実質的公平を害しない⟫と認められる\n⦅⟪特段の事情が存するとき⟫に許される⦆⟨1⟩。裁判所による共有物の分割は、その本質は非訟事件であって、⟪共有者間の公平を保ちつつ、当該共有物の性質や共有状態の実状に合った妥当な分割を実現すべき⟫ものだからである。\nなお、共有物の全部又はその持分が相続財産に属し、⟪共同相続人間で遺産の分割をすべきとき⟫は、その共有物又は持分について258条による分割をすることができない（258条の2第1項）。ただし、持分が相続財産に属する場合において⟪相続開始の時から10年⟫を経過したときは、この限りでない（同条2項本文）。","answers":["賠償分割","価格を著しく減少させるおそれ","競売","当該共有物を特定の者に取得させるのが相当","支払能力","実質的公平を害しない","共同相続人間で遺産の分割をすべきとき","相続開始の時から10年"],"check":"256Ⅰ本文いつでも／258Ⅰ協議不調・不能／**258Ⅱ①現物・②賠償**／**258Ⅲ競売は補充**（「できないとき、又は価格を著しく減少させるおそれ」）／全面的価格賠償＝**①相当性（5つの考慮要素）＋②実質的公平（適正評価・支払能力）の特段の事情**／理由＝**非訟事件・裁量**／**258の2Ⅰ遺産分割すべきときは258不可・Ⅱ10年経過で可**","notes":[{"n":1,"label":"最一小判 平成8・10・31","case":"**最一小判 平成8・10・31**（民集50巻9号2563頁）","gist":"**全面的価格賠償**による分割も許される。要件＝①相当性（性質・形状、発生原因、共有者の数・持分割合、利用状況と分割後の経済的価値、共有者の希望とその合理性を総合考慮）＋②実質的公平（適正な価格評価・**取得者の支払能力**）の**特段の事情**"}],"law":"","cites":["民法/256","民法/258","民法/258の2"],"rate":26,"designed":true,"ref":false,"hash":"d05f1afc1d4e"}],"setsurei":["A・B・Cは、甲建物を持分各3分の1の割合で共有している。三者の間に甲建物の使用等に関する特段の合意はない。 (1) CがA・Bに無断で甲建物を独占して使用しているので、A・BはCに対し甲建物の明渡しを請求したい。この請求は認められるか。 (2) (1)が認められない場合、Aは、Cに対し甲建物の賃料相当額を請求できるか。できるとして、いくら請求できるか。 (3) A・Bが「今後は甲建物をBに使用させる」旨を協議して決めた場合はどうか。","A・B・Cは、甲土地とその上の乙建物を持分各3分の1の割合で共有している。A・Bは以前から別の所に住宅を所有して居住しており、乙建物にはCが長年居住している。甲土地・乙建物の時価は合計3000万円で、現物分割は不可能である。 (1) 甲土地の登記簿上、Cの持分について、実体上何らの権利も有しないDへの持分移転登記がされていた。Aは単独でDに対しどのような請求ができるか。また、Dへの移転ではなく、**Cが勝手に自己の単独名義の所有権移転登記**をしていた場合はどうか。 (2) A・BとCの分割協議が調わないので、A・Bは競売による分割を求めて訴えを提起した。これに対しCは、自らが甲土地・乙建物を単独取得し、A・Bに価格を賠償する方法を希望している。裁判所はどのような分割を命ずることができるか。"],"full":"共有物に⟪変更⟫を加えるには、他の共有者⟪全員の同意⟫を要する（⟪251条1項⟫）。もっとも、⟪形状又は効用の著しい変更⟫を伴わないもの（軽微変更）は変更から除かれ、管理として扱われる。\n共有物の⟪管理に関する事項⟫は、⟪各共有者の持分の価格に従い、その過半数⟫で決する（252条1項前段）。共有物を使用する共有者があるときも、同様である（同項後段）。\nただし、この決定が、共有者間の決定に基づいて共有物を使用する共有者に⟪特別の影響⟫を及ぼすべきときは、その⟪承諾⟫を得なければならない（252条3項）。\n⟪保存行為⟫は、⟪各共有者が単独⟫ですることができる（252条5項）。共有者全員の利益になるからである。\n\n(1) 第三者に対して\n各共有者は、共有物の全部について、その持分に応じた使用をすることができる（⟪249条1項⟫）。したがって、第三者が共有物を不法に占有し、又は妨害しているときは、各共有者は⟪単独で⟫、共有物の全部について明渡し又は妨害の排除を請求することができる。これは共有物の⟪保存行為⟫（252条5項）にあたり、共有者全員でする必要がないからである。\n\n(2) 共有者の一人が占有しているとき\n⦅これに対し、共有者の一人が共有物を単独で占有している場合、他の共有者は、持分の価格の過半数を有していても、⟪当然にはその明渡しを請求することができない⟫⦆⟨1⟩。占有する共有者もまた、⟪自己の持分によって共有物を使用収益する権原⟫を有し、これに基づいて占有しているからである（249条1項）。\nしたがって、⦅明渡しを求めるには、⟪明渡しを求める理由⟫を主張立証しなければならない⦆⟨2⟩。持分の価格の過半数によって、その共有者以外の者に使用させる旨の⟪管理に関する決定⟫をしたことは、この「理由」に⟪あたる⟫（252条1項後段）。\n⦅⟪共有者の一部から占有使用を承認された第三者⟫に対しても、同様である⦆⟨3⟩。\n\n(3) 使用の対価\n共有物を使用する共有者は、⟪別段の合意がある場合を除き⟫、他の共有者に対し、⟪自己の持分を超える使用の対価⟫を償還する義務を負う（⟪249条2項⟫）。明渡しが認められない場合でも、他の共有者は、⟪自己の持分割合に応じた賃料相当額⟫を請求することができる。\n\n(1) 登記名義人が全くの無権利者であるとき\n各共有者は、その持分権に基づき、共有不動産に加えられた妨害を排除することができるところ、不実の持分移転登記がされている場合には、その登記によって共有不動産に対する⟪妨害状態が生じている⟫といえる。したがって、⦅共有者の一人は、⟪単独でその登記の抹消登記手続⟫を請求することができる⦆⟨1⟩。自己の持分の登記が正しくされている場合であっても、その不実登記によって⟪共有不動産の処分が妨げられる⟫などの事情があるときは、なお持分に対する妨害があるといえる。\n\n(2) 登記名義人が他の共有者であるとき\nこれに対し、共有者の一人が自己単独名義の登記を経由している場合、その登記はその者の持分の限りでは⟪実体関係に符合⟫する。また、他の共有者は⟪自己の持分についてのみ⟫妨害排除請求権を有するにすぎない。したがって、⦅請求できるのは登記の全部抹消ではなく、⟪自己の持分についての更正登記手続⟫に限られ⦆⟨1⟩、⦅請求していない他の共有者の持分についての更正までは求められない⦆⟨2⟩。\n\n各共有者は、いつでも共有物の分割を請求することができる（256条1項本文）。協議が調わないとき、又は協議をすることができないときは、裁判所に分割を請求することができる（258条1項）。\n裁判所は、⟪現物分割⟫（258条2項1号）又は⟪賠償分割⟫（共有者に債務を負担させて他の共有者の持分の全部又は一部を取得させる方法。同項2号）により分割を命ずることができ、これらの方法によることができないとき、又は分割によってその⟪価格を著しく減少させるおそれ⟫があるときに限り、⟪競売⟫を命ずることができる（同条3項）。\n共有物を共有者の一人の単独所有とし、その者に他の共有者の持分の価格を賠償させる方法（全面的価格賠償）は、\n⟪[1]⟫ 共有物の性質及び形状、共有関係の発生原因、共有者の数及び持分の割合、共有物の利用状況及び分割された場合の経済的価値、分割方法についての共有者の希望及びその合理性の有無等の事情を総合的に考慮し、⟪当該共有物を特定の者に取得させるのが相当⟫であると認められ、かつ\n⟪[2]⟫ その価格が適正に評価され、取得する者に⟪支払能力⟫があって、他の共有者にはその持分の価格を取得させることとしても共有者間の⟪実質的公平を害しない⟫と認められる\n⦅⟪特段の事情が存するとき⟫に許される⦆⟨1⟩。裁判所による共有物の分割は、その本質は非訟事件であって、⟪共有者間の公平を保ちつつ、当該共有物の性質や共有状態の実状に合った妥当な分割を実現すべき⟫ものだからである。\nなお、共有物の全部又はその持分が相続財産に属し、⟪共同相続人間で遺産の分割をすべきとき⟫は、その共有物又は持分について258条による分割をすることができない（258条の2第1項）。ただし、持分が相続財産に属する場合において⟪相続開始の時から10年⟫を経過したときは、この限りでない（同条2項本文）。","kata":"","hanrei":[["**最一小判 昭和41・5・19**（民集20巻5号947頁）","多数持分権者も、共有物を現に占有する少数持分権者に対し**当然には明渡しを請求できない**。少数持分権者は自己の持分によって使用収益する権原を有するから。明渡しを求めるには**その理由を主張立証**しなければならない","**民法判例百選Ⅰ〔第9版〕70番**（第8版74番・第7版71番）。事案は共同相続に基づく共有"],["最判 昭和63・5・20（判時1277号116頁）","共有者の一部から占有使用を**承認された第三者**に対しても、承認しなかった共有者は当然には明渡しを請求できない","昭41・5・19の射程拡張"],["最判 昭和57・6・17（判時1054号85頁）","一部の共有者から共有地の一部を**買い受けた第三者**に対しても同じ","同上"],["**最判 平成12・4・7**（判時1713号50頁）","単独占有の権原につき特段の主張立証がない限り、他の共有者は**持分割合に応じた地代相当額**の不当利得金ないし損害賠償金を請求できる","現在は**249条2項**が明文化"],["**最二小判 平成15・7・11**（民集57巻7号787頁）","不実の持分移転登記がされている場合、その登記によって**共有不動産に対する妨害状態が生じている**から、共有者の一人は**単独でその抹消登記手続を請求できる**","**民法判例百選Ⅰ〔第9版〕71番**（第8版75番・第7版72番）。**民事訴訟法判例百選〔第6版〕93番**（第5版98番）にも収録。**判旨は「保存行為」の語を用いない**"],["最判 昭和31・5・10（民集10巻5号487頁）","無権利者が単独名義の所有権移転登記を有するとき、共有者の一人は**保存行為**として単独で**全部抹消**登記手続を請求できる","平15・7・11の先例。最判昭33・7・22（民集12巻12号1805頁）も同旨"],["最判 昭和38・2・22","共有者の一人が単独名義の登記をした事案。他の共有者が請求できるのは**自己の持分についてのみの一部抹消（更正）登記手続**","**民法判例百選Ⅲ〔第3版〕77番**（民法Ⅰでは第8版59番まで収録。第9版では外れている）"],["最判 昭和59・4・24（裁判集民141号603頁）","同上（共有者登記型）。平15・7・11は「本件とは事案を異にする」と明示",""],["**最判 平成22・4・20**（判時2078号22頁）","持分を有しない者が共有名義の保存登記を有する場合、共有者の一人は**自己の持分についての更正登記手続を求められるにとどまり、他の共有者の持分についてまでは求められない**",""],["大判 大正7・4・19（民録24輯731頁）","共有地の不法占有者に対する妨害排除・明渡請求は各共有者が単独でできる","保存行為構成。大判大10・6・13（民録27輯1155頁）も同旨"],["最判 平成10・3・24（判時1641号80頁）","共有者の一部が他の共有者の同意なく農地に宅地造成工事を施し非農地化した事案。他の共有者は**各自の共有持分権に基づき、行為の全部の禁止と原状回復**を請求できる","**同じ日付で別事件（遺留分）が百選に載っているので、番号を付けないこと**"],["**最大判 昭和62・4・22**（民集41巻3号408頁）","現物分割に際し、持分の価格以上の現物を取得する共有者に**超過分の対価を支払わせ過不足を調整**することも現物分割の一態様として許される。**一括分割・一部分割**も現物分割として許される","森林法共有林事件。**憲法判例百選Ⅰ〔第8版〕91番**（第7版96番）。憲法では森林法186条の違憲判断で有名だが、**民法では分割方法の柔軟化のリーディングケース**"],["最判 平成4・1・24（判タ789号116頁）","一部分割を認めた事例",""],["**最一小判 平成8・10・31**（民集50巻9号2563頁）","**全面的価格賠償**による分割も許される。要件＝①相当性（性質・形状、発生原因、共有者の数・持分割合、利用状況と分割後の経済的価値、共有者の希望とその合理性を総合考慮）＋②実質的公平（適正な価格評価・**取得者の支払能力**）の**特段の事情**","**民法判例百選Ⅰ〔第9版〕72番**（第8版76番・第7版73番）。**支払能力の認定を欠く原審を破棄差戻し**"],["最判 昭和46・6・18","258条3項の「分割することができないとき」には、**社会通念上適正な現物分割が著しく困難な場合**も含む",""],["最判 昭和62・9・4（判時1251号101頁）","共同相続人間の遺産共有の解消は遺産分割手続によるべきで、共有物分割訴訟によることはできない","**258条の2第1項として令和3年改正で明文化**"],["最判 昭和50・11・7（民集29巻10号1525頁）","遺産分割前に共同相続人の一人から共有持分を譲り受けた**第三者**が共有関係の解消を求める手続は、遺産分割ではなく**共有物分割訴訟**",""],["**最二小判 平成25・11・29**（民集67巻8号1736頁）","**遺産共有持分と他の共有持分とが併存**する場合の解消手続は**共有物分割訴訟**。分与された財産は遺産分割の対象となり、遺産共有持分権者は賠償金につき遺産分割まで**保管義務**を負う","**民法判例百選Ⅲ〔第3版〕73番**"],["最判 昭和29・3・12／最判 昭和39・2・25","共有物の使用貸借・賃貸借契約の**解除は管理**にあたり、持分の価格の過半数で決められる。**544条1項（解除の不可分性）の適用は排除**される","252条1項が544条1項の特則"],["最判 昭和46・10・7（民集25巻7号885頁）","共有者全員が**共有権**（数人が共同して有する1個の所有権）の確認・共有権に基づく所有権移転登記手続を求める訴えは**固有必要的共同訴訟**",""],["最判 平成11・11・9（民集53巻8号1421頁）","境界確定の訴えで非同調者がいるときは、その者を**被告**にして訴えを提起できる","共有者全員が原告・被告いずれかで関与すれば足りる"]],"field":"所有権・共有","order":12},{"name":"占有訴権（197〜202条）","subject":"民法","rank":"B","path":"まとめ/民法/論証/占有訴権（197〜202条）.md","cards":[{"id":"民法/占有訴権（197〜202条）#1","block":"第1〔どの訴えを選ぶか〕","kind":"cloze","masked":"占有者は、占有を妨害されたときは⟦ア⟧により妨害の停止及び損害賠償を（⟦イ⟧）、妨害されるおそれがあるときは⟦ウ⟧により妨害の予防又は損害賠償の担保を（199条）、占有を奪われたときは⟦エ⟧によりその物の返還及び損害賠償を（200条1項）請求できる。\nここでいう「占有者」（197条）には、⟦オ⟧も含まれる（197条後段）。\nいずれも侵害者の⟦カ⟧である（ただし損害賠償請求については別に故意・過失を要する）。","body":"占有者は、占有を妨害されたときは⟪占有保持の訴え⟫により妨害の停止及び損害賠償を（⟪198条⟫）、妨害されるおそれがあるときは⟪占有保全の訴え⟫により妨害の予防又は損害賠償の担保を（199条）、占有を奪われたときは⟪占有回収の訴え⟫によりその物の返還及び損害賠償を（200条1項）請求できる。\nここでいう「占有者」（197条）には、⟪他人のために占有をする者⟫も含まれる（197条後段）。\nいずれも侵害者の⟪故意・過失は不要⟫である（ただし損害賠償請求については別に故意・過失を要する）。","answers":["占有保持の訴え","198条","占有保全の訴え","占有回収の訴え","他人のために占有をする者","故意・過失は不要"],"check":"1 ／ 3訴権と条文（保持198／保全199／回収200Ⅰ）と請求内容の対応","notes":[],"law":"","cites":["民法/198","民法/199","民法/200","民法/197"],"rate":37,"designed":true,"ref":true,"hash":"b9c9d6282962"},{"id":"民法/占有訴権（197〜202条）#2","block":"第2〔「占有を奪われた」の意味と出訴期間〕","kind":"cloze","masked":"「占有を奪われた」（200条1項）とは、占有者が⟦ア⟧所持を奪われたことをいい、⟦イ⟧はこれに当たらないと解する。\n出訴期間は、占有保持の訴えは妨害の存する間又はその⟦ウ⟧（201条1項本文）、占有保全の訴えは妨害の危険の存する間（201条2項前段）、占有回収の訴えは⟦エ⟧（201条3項）である。","body":"「占有を奪われた」（200条1項）とは、占有者が⟪その意思に基づかないで⟫所持を奪われたことをいい、⟪詐取された場合や遺失した場合⟫はこれに当たらないと解する。\n出訴期間は、占有保持の訴えは妨害の存する間又はその⟪消滅した後1年以内⟫（201条1項本文）、占有保全の訴えは妨害の危険の存する間（201条2項前段）、占有回収の訴えは⟪占有を奪われた時から1年以内⟫（201条3項）である。","answers":["その意思に基づかないで","詐取された場合や遺失した場合","消滅した後1年以内","占有を奪われた時から1年以内"],"check":"4 ／ 「占有を奪われた」＝意思に基づかない所持の喪失。詐取・遺失は含まない","notes":[],"law":"","cites":["民法/200","民法/201"],"rate":25,"designed":true,"ref":false,"hash":"379d4a10c17f"},{"id":"民法/占有訴権（197〜202条）#3","block":"第3〔占有回収の訴えの相手方〕","kind":"cloze","masked":"占有回収の訴えは、侵奪者及びその包括承継人に対して提起できるのが原則であり、占有を侵奪した者の⟦ア⟧に対しては⟦イ⟧（⟦ウ⟧）。侵奪による⟦エ⟧がある限りで占有の訴えを認めるという趣旨だからである。\nもっとも、その承継人が⟦オ⟧ときはこの限りでない（同項ただし書）。⦅ここでいう悪意とは、何らかの形で侵奪があったことの認識をいい、侵奪の⟦カ⟧を認識していたにとどまる場合はこれに当たらないと解する⦆⟨1⟩。","body":"占有回収の訴えは、侵奪者及びその包括承継人に対して提起できるのが原則であり、占有を侵奪した者の⟪特定承継人⟫に対しては⟪提起することができない⟫（⟪200条2項本文⟫）。侵奪による⟪事実的支配の攪乱⟫がある限りで占有の訴えを認めるという趣旨だからである。\nもっとも、その承継人が⟪侵奪の事実を知っていた⟫ときはこの限りでない（同項ただし書）。⦅ここでいう悪意とは、何らかの形で侵奪があったことの認識をいい、侵奪の⟪可能性⟫を認識していたにとどまる場合はこれに当たらないと解する⦆⟨1⟩。","answers":["特定承継人","提起することができない","200条2項本文","事実的支配の攪乱","侵奪の事実を知っていた","可能性"],"check":"6 ／ 特定承継人には原則提起できない（200Ⅱ本文）","notes":[{"n":1,"label":"最判 昭和56・3・19","case":"最判 昭和56・3・19 民集35巻2号171頁","gist":"200条2項ただし書の「侵奪の事実を知っていたとき」というためには、承継人が**何らかの形での侵奪があったことについての認識**を有していたことが必要であり、**占有の侵奪の可能性についての認識にとどまる限りはこれに当たらない**"}],"law":"","cites":["民法/200"],"rate":19,"designed":true,"ref":false,"hash":"974f80df6c57"},{"id":"民法/占有訴権（197〜202条）#4","block":"第4〔本権の訴えとの関係〕","kind":"cloze","masked":"占有の訴えと本権の訴えとは要件・効果を異にする⟦ア⟧であるから、互いに妨げない（202条1項）。\nそして、占有の訴えについては⟦イ⟧に基づいて裁判をすることができない（⟦ウ⟧）から、⦅占有の訴えに対して本権を⟦エ⟧⦆⟨1⟩。\nしかし、⦅同項は裁判の理由を制限するにとどまり、別個の請求である反訴までを禁ずるものではないから、占有の訴えに対して⟦オ⟧と解する⦆⟨2⟩。","body":"占有の訴えと本権の訴えとは要件・効果を異にする⟪別個独立の請求権⟫であるから、互いに妨げない（202条1項）。\nそして、占有の訴えについては⟪本権に関する理由⟫に基づいて裁判をすることができない（⟪202条2項⟫）から、⦅占有の訴えに対して本権を⟪防御方法（抗弁）として主張することは許されない⟫⦆⟨1⟩。\nしかし、⦅同項は裁判の理由を制限するにとどまり、別個の請求である反訴までを禁ずるものではないから、占有の訴えに対して⟪本権に基づく反訴を提起することは許される⟫と解する⦆⟨2⟩。","answers":["別個独立の請求権","本権に関する理由","202条2項","防御方法（抗弁）として主張することは許されない","本権に基づく反訴を提起することは許される"],"check":"9 ／ 占有の訴えと本権の訴えは別個独立・互いに妨げない（202Ⅰ）","notes":[{"n":1,"label":"最一小判 昭和40・3・4","case":"最一小判 昭和40・3・4 民集19巻2号197頁","gist":"202条2項は占有の訴えにおいて本権に関する理由に基づいて裁判することを禁ずるものであり、占有の訴えに対し**防御方法として本権の主張をすることは許されない**が、**本権に基づく反訴を提起することは同項の禁ずるところではない**。反訴請求と本訴（占有の訴え）とを対比すれば牽連性がないとはいえない"},{"n":2,"label":"最一小判 昭和40・3・4","case":"最一小判 昭和40・3・4 民集19巻2号197頁","gist":"202条2項は占有の訴えにおいて本権に関する理由に基づいて裁判することを禁ずるものであり、占有の訴えに対し**防御方法として本権の主張をすることは許されない**が、**本権に基づく反訴を提起することは同項の禁ずるところではない**。反訴請求と本訴（占有の訴え）とを対比すれば牽連性がないとはいえない"}],"law":"","cites":["民法/202"],"rate":14,"designed":true,"ref":false,"hash":"ffdc91ddb6cf"}],"setsurei":["Ａは自ら所有し使用していたノートパソコン甲を、大学の研究室から何者かに持ち去られた。持ち去ったのはＢであり、ＢはＣに甲を売却して引き渡した。Ａは、Ｃに対し占有回収の訴えにより甲の返還を求めることができるか。 (1) Ｃが甲の来歴を何も知らなかった場合。 (2) Ｃが「Ｂは甲を盗んできたのではないか」と疑ったものの、Ｂに確認しないまま譲り受けた場合。 (3) Ｃが、ＢがＡから甲を持ち去ったことを聞かされたうえで譲り受けた場合。","Ｘは甲土地の引渡しを受けて現に占有し、その上に自己所有の建物を移築していた。甲土地について所有権移転登記を有するＹは、2026年4月10日、実力でＸの資材を撤去してＸを甲土地から排除し、その占有を奪った。 (1) Ｘが2027年5月1日に占有回収の訴えを提起した場合、この訴えは認められるか。 (2) Ｘが2026年10月1日に占有回収の訴えを提起した場合、Ｙは「甲土地は自分の所有である」と主張して争えるか。Ｙが所有権に基づく建物収去土地明渡しを求めたいときはどうすればよいか。"],"full":"占有者は、占有を妨害されたときは⟪占有保持の訴え⟫により妨害の停止及び損害賠償を（⟪198条⟫）、妨害されるおそれがあるときは⟪占有保全の訴え⟫により妨害の予防又は損害賠償の担保を（199条）、占有を奪われたときは⟪占有回収の訴え⟫によりその物の返還及び損害賠償を（200条1項）請求できる。\nここでいう「占有者」（197条）には、⟪他人のために占有をする者⟫も含まれる（197条後段）。\nいずれも侵害者の⟪故意・過失は不要⟫である（ただし損害賠償請求については別に故意・過失を要する）。\n\n「占有を奪われた」（200条1項）とは、占有者が⟪その意思に基づかないで⟫所持を奪われたことをいい、⟪詐取された場合や遺失した場合⟫はこれに当たらないと解する。\n出訴期間は、占有保持の訴えは妨害の存する間又はその⟪消滅した後1年以内⟫（201条1項本文）、占有保全の訴えは妨害の危険の存する間（201条2項前段）、占有回収の訴えは⟪占有を奪われた時から1年以内⟫（201条3項）である。\n\n占有回収の訴えは、侵奪者及びその包括承継人に対して提起できるのが原則であり、占有を侵奪した者の⟪特定承継人⟫に対しては⟪提起することができない⟫（⟪200条2項本文⟫）。侵奪による⟪事実的支配の攪乱⟫がある限りで占有の訴えを認めるという趣旨だからである。\nもっとも、その承継人が⟪侵奪の事実を知っていた⟫ときはこの限りでない（同項ただし書）。⦅ここでいう悪意とは、何らかの形で侵奪があったことの認識をいい、侵奪の⟪可能性⟫を認識していたにとどまる場合はこれに当たらないと解する⦆⟨1⟩。\n\n占有の訴えと本権の訴えとは要件・効果を異にする⟪別個独立の請求権⟫であるから、互いに妨げない（202条1項）。\nそして、占有の訴えについては⟪本権に関する理由⟫に基づいて裁判をすることができない（⟪202条2項⟫）から、⦅占有の訴えに対して本権を⟪防御方法（抗弁）として主張することは許されない⟫⦆⟨1⟩。\nしかし、⦅同項は裁判の理由を制限するにとどまり、別個の請求である反訴までを禁ずるものではないから、占有の訴えに対して⟪本権に基づく反訴を提起することは許される⟫と解する⦆⟨2⟩。","kata":"","hanrei":[["最一小判 昭和40・3・4 民集19巻2号197頁","202条2項は占有の訴えにおいて本権に関する理由に基づいて裁判することを禁ずるものであり、占有の訴えに対し**防御方法として本権の主張をすることは許されない**が、**本権に基づく反訴を提起することは同項の禁ずるところではない**。反訴請求と本訴（占有の訴え）とを対比すれば牽連性がないとはいえない","**民法判例百選Ⅰ〔第9版〕66番**（第7版67番・第8版70番）／**民事訴訟法判例百選〔第6版〕32番**（第5版34番）。事案は占有保全の訴えに対する所有権に基づく建物収去土地明渡しの反訴"],["最判 昭和56・3・19 民集35巻2号171頁","200条2項ただし書の「侵奪の事実を知っていたとき」というためには、承継人が**何らかの形での侵奪があったことについての認識**を有していたことが必要であり、**占有の侵奪の可能性についての認識にとどまる限りはこれに当たらない**","出典＝『体系別短答過去問題集 民法(上)』p.422、『民法演習サブノート210問』p.106 の参考判例欄"],["大判 大正13・5・22 民集3巻224頁","交互侵奪の事案で、盗まれた物を自力で取り戻す行為は法の禁ずる自力救済であって許されないとして、**第1の侵奪者による占有回収の訴えを認めた**","出典＝『講義 物権・担保物権法』紙面p.228、『民法演習サブノート210問』p.106 の参考判例欄。学説の多くは反対（上記(4)参照）"],["~~大判 大正11・1・27~~","詐取は「占有を奪われた」（200条1項）に当たらない","`[カニの記憶]`ではなく**アガルート総合講義-民法 紙面p.123 の記載**によるが、**判例集の出典・事案をDBで確認できていない**ので、答案で日付を引用しない。侵奪に詐取を含まないという**規律自体**は『講義 物権・担保物権法』紙面p.228 で裏が取れている"]],"field":"占有権","order":11},{"name":"即時取得_192条〜194条","subject":"民法","rank":"A","path":"まとめ/民法/論証/即時取得_192条〜194条.md","cards":[{"id":"民法/即時取得_192条〜194条#1","block":"第1〔192条の要件と趣旨〕","kind":"cloze","masked":"192条は、「取引行為によって、平穏に、かつ、公然と動産の占有を始めた者は、善意であり、かつ、過失がないときは、即時にその動産について行使する権利を取得する」と定める。\nその趣旨は、動産については占有が所有権の公示方法とされているところ、占有を信頼して取引に入った者を保護し、もって動産取引の安全を図る点にある（⟦ア⟧）。\nしたがって要件は、①目的物が動産であること、②取引行為によって占有を取得したこと、③前主が無権利者であること、④その点につき善意かつ無過失であること、⑤平穏・公然と占有を始めたことである。\n⦅制度趣旨が占有の公示に対する信頼の保護にある以上、登記・登録が公示方法とされている動産には本条の適用はない⦆⟨1⟩。また、取引の安全を図る制度であるから、相続等の包括承継や事実行為によって占有を得た場合も本条は適用されない。\nなお、本条が治癒するのは前主が⟦イ⟧であることのみであり、取引行為自体の無効・取消しの瑕疵は治癒されない。\n平穏・公然・善意は⟦ウ⟧により推定され、無過失は占有者の⟦エ⟧（⟦オ⟧）により推定されるから、⦅即時取得を主張する者は、取引行為によって占有を始めたことを主張立証すれば足り、⟦カ⟧⦆⟨2⟩。","body":"192条は、「取引行為によって、平穏に、かつ、公然と動産の占有を始めた者は、善意であり、かつ、過失がないときは、即時にその動産について行使する権利を取得する」と定める。\nその趣旨は、動産については占有が所有権の公示方法とされているところ、占有を信頼して取引に入った者を保護し、もって動産取引の安全を図る点にある（⟪占有の公信力⟫）。\nしたがって要件は、①目的物が動産であること、②取引行為によって占有を取得したこと、③前主が無権利者であること、④その点につき善意かつ無過失であること、⑤平穏・公然と占有を始めたことである。\n⦅制度趣旨が占有の公示に対する信頼の保護にある以上、登記・登録が公示方法とされている動産には本条の適用はない⦆⟨1⟩。また、取引の安全を図る制度であるから、相続等の包括承継や事実行為によって占有を得た場合も本条は適用されない。\nなお、本条が治癒するのは前主が⟪無権利⟫であることのみであり、取引行為自体の無効・取消しの瑕疵は治癒されない。\n平穏・公然・善意は⟪186条1項⟫により推定され、無過失は占有者の⟪権利適法の推定⟫（⟪188条⟫）により推定されるから、⦅即時取得を主張する者は、取引行為によって占有を始めたことを主張立証すれば足り、⟪自らの無過失を立証する必要はない⟫⦆⟨2⟩。","answers":["占有の公信力","無権利","186条1項","権利適法の推定","188条","自らの無過失を立証する必要はない"],"check":"","notes":[{"n":1,"label":"最判 昭和62・4・24","case":"最判 昭和62・4・24（判時1243号24頁）","gist":"道路運送車両法による登録を受けている自動車には192条の適用がない"},{"n":2,"label":"最一小判 昭和41・6・9","case":"最一小判 昭和41・6・9（民集20巻5号1011頁）","gist":"無過失は188条により推定され、占有取得者自身が無過失を立証する必要はない"}],"law":"","cites":["民法/192","民法/186","民法/188"],"rate":14,"designed":true,"ref":false,"hash":"29d220a8ce26"},{"id":"民法/即時取得_192条〜194条#2","block":"第2〔占有改定による即時取得の可否〕","kind":"cloze","masked":"引渡しの一態様である占有改定によって占有を取得した場合にも、「占有を始めた」といえるか。\n192条が原権利者の犠牲において取得者を保護するのは、原権利者の⟦ア⟧支配状態が取得者の下に生じたからである。占有改定においては、前主が⟦イ⟧しており、原権利者の間接占有もなお存続しているから、そのような支配状態が生じたとはいえない。\nそこで、⦅譲受人が192条によりその所有権を取得するためには、一般外観上従来の占有状態に⟦ウ⟧がごとき占有を取得することを要し、かかる状態に一般外観上変更を来たさない占有改定の方法による取得をもっては⟦エ⟧と解する⦆⟨1⟩。\nしたがって、譲受人は、後に⟦オ⟧を受けた時点を基準として、その時点で⟦カ⟧であれば即時取得する。","body":"引渡しの一態様である占有改定によって占有を取得した場合にも、「占有を始めた」といえるか。\n192条が原権利者の犠牲において取得者を保護するのは、原権利者の⟪追及を顧慮する必要がない⟫支配状態が取得者の下に生じたからである。占有改定においては、前主が⟪現実の所持を継続⟫しており、原権利者の間接占有もなお存続しているから、そのような支配状態が生じたとはいえない。\nそこで、⦅譲受人が192条によりその所有権を取得するためには、一般外観上従来の占有状態に⟪変更を生ずる⟫がごとき占有を取得することを要し、かかる状態に一般外観上変更を来たさない占有改定の方法による取得をもっては⟪足りない⟫と解する⦆⟨1⟩。\nしたがって、譲受人は、後に⟪現実の引渡し⟫を受けた時点を基準として、その時点で⟪善意・無過失⟫であれば即時取得する。","answers":["追及を顧慮する必要がない","現実の所持を継続","変更を生ずる","足りない","現実の引渡し","善意・無過失"],"check":"","notes":[{"n":1,"label":"最一小判 昭和35・2・11","case":"最一小判 昭和35・2・11（民集14巻2号168頁）","gist":"192条により所有権を取得するには「一般外観上従来の占有状態に変更を生ずるがごとき占有」を取得することを要し、占有改定では足りない"}],"law":"","cites":["民法/192"],"rate":2,"designed":true,"ref":false,"hash":"e7ae56a478b0"},{"id":"民法/即時取得_192条〜194条#3","block":"第3〔指図による占有移転による即時取得の可否〕","kind":"cloze","masked":"指図による占有移転も、現実の所持の移転を伴わない観念的な占有移転である。もっとも、上記の基準からすれば、決め手は所持の移転の有無ではなく、⟦ア⟧、取得者の支配が⟦イ⟧したといえるかにある。\nそこで、⦅原権利者の間接占有が⟦ウ⟧したままである場合には即時取得は⟦エ⟧が、指図によって⟦ア⟧、直接占有者を介する間接占有者が⟦オ⟧となった場合には、「占有を始めた」といえ、⟦カ⟧と解する⦆⟨1⟩。","body":"指図による占有移転も、現実の所持の移転を伴わない観念的な占有移転である。もっとも、上記の基準からすれば、決め手は所持の移転の有無ではなく、⟪原権利者の間接占有が失われ⟫、取得者の支配が⟪一般外観上確立⟫したといえるかにある。\nそこで、⦅原権利者の間接占有が⟪併存⟫したままである場合には即時取得は⟪認められない⟫が、指図によって原権利者の間接占有が失われ、直接占有者を介する間接占有者が⟪取得者のみ⟫となった場合には、「占有を始めた」といえ、⟪即時取得が成立し得る⟫と解する⦆⟨1⟩。","answers":["原権利者の間接占有が失われ","一般外観上確立","併存","認められない","取得者のみ","即時取得が成立し得る"],"check":"","notes":[{"n":1,"label":"最一小判 昭和57・9・7","case":"最一小判 昭和57・9・7（民集36巻8号1527頁）","gist":"寄託者台帳上の寄託者名義の変更による指図による占有移転で「192条にいう占有を取得した」とした原審の判断を是認"}],"law":"","cites":[],"rate":0,"designed":true,"ref":false,"hash":"b465afe33a3a"},{"id":"民法/即時取得_192条〜194条#4","block":"第4〔盗品・遺失物の特則（193条・194条）〕","kind":"cloze","masked":"即時取得が成立する場合でも、占有物が盗品または遺失物であるときは、被害者または遺失者は、盗難または遺失の時から⟦ア⟧、占有者に対してその物の回復を請求することができる（⟦イ⟧）。占有が原権利者の意思によらずに離れた場合にまで、原権利者に失権を強いるのは相当でないからである。\nもっとも、占有者が、盗品・遺失物を、⟪競売もしくは公の市場⟫において、またはその物と⟪同種の物を販売する商人⟫から善意で買い受けたときは、被害者または遺失者は、占有者が支払った⟦ウ⟧しなければその物を回復することができない（194条）。かかる場所・相手方から買い受けた者の信頼は特に保護に値するからである。\nでは、占有者が194条に基づき引渡しを拒みうる間、目的物の使用利益は誰に帰属するか。\n194条は、被害者等に代価弁償による回復か回復の断念かの選択を認めることで、占有者と被害者等との⟪保護の均衡⟫を図った規定である。被害者等が回復を断念すれば占有者は使用利益を享受できるのに、被害者等が代価の弁償を選択した途端に占有者が使用利益を失うとすれば、占有者の地位が著しく不安定となり、同条の趣旨に反する。また、弁償される代価には⟦エ⟧以上、その均衡上も占有者に使用収益を認めるのが公平である。\nそこで、⦅占有者が194条に基づき代価の弁償があるまで引渡しを拒むことができる場合には、占有者は、その⟦オ⟧があるまで目的物の⟦カ⟧を有すると解する⦆⟨1⟩。\nまた、⦅占有者が代価の弁償を受けないまま目的物を返還した場合であっても、被害者等が回復の断念か代価弁償かを選択し得る状況の下で後者を選択して引渡しを受けたといえるときは、占有者はなお194条に基づき⟦キ⟧することができると解する⦆⟨2⟩。","body":"即時取得が成立する場合でも、占有物が盗品または遺失物であるときは、被害者または遺失者は、盗難または遺失の時から⟪2年間⟫、占有者に対してその物の回復を請求することができる（⟪193条⟫）。占有が原権利者の意思によらずに離れた場合にまで、原権利者に失権を強いるのは相当でないからである。\nもっとも、占有者が、盗品・遺失物を、⟪競売もしくは公の市場⟫において、またはその物と⟪同種の物を販売する商人⟫から善意で買い受けたときは、被害者または遺失者は、占有者が支払った⟪代価を弁償⟫しなければその物を回復することができない（194条）。かかる場所・相手方から買い受けた者の信頼は特に保護に値するからである。\nでは、占有者が194条に基づき引渡しを拒みうる間、目的物の使用利益は誰に帰属するか。\n194条は、被害者等に代価弁償による回復か回復の断念かの選択を認めることで、占有者と被害者等との⟪保護の均衡⟫を図った規定である。被害者等が回復を断念すれば占有者は使用利益を享受できるのに、被害者等が代価の弁償を選択した途端に占有者が使用利益を失うとすれば、占有者の地位が著しく不安定となり、同条の趣旨に反する。また、弁償される代価には⟪利息が含まれない⟫以上、その均衡上も占有者に使用収益を認めるのが公平である。\nそこで、⦅占有者が194条に基づき代価の弁償があるまで引渡しを拒むことができる場合には、占有者は、その⟪弁償の提供⟫があるまで目的物の⟪使用収益を行う権限⟫を有すると解する⦆⟨1⟩。\nまた、⦅占有者が代価の弁償を受けないまま目的物を返還した場合であっても、被害者等が回復の断念か代価弁償かを選択し得る状況の下で後者を選択して引渡しを受けたといえるときは、占有者はなお194条に基づき⟪代価の弁償を請求⟫することができると解する⦆⟨2⟩。","answers":["2年間","193条","代価を弁償","利息が含まれない","弁償の提供","使用収益を行う権限","代価の弁償を請求"],"check":"","notes":[{"n":1,"label":"最三小判 平成12・6・27","case":"最三小判 平成12・6・27（民集54巻5号1737頁）","gist":"①194条に基づき引渡しを拒みうる場合、占有者は代価弁償の提供があるまで使用収益を行う権限を有する ②代価弁償を受けずに返還した後も194条に基づき代価弁償を請求できる（大判昭和4・12・11 を変更）"},{"n":2,"label":"最三小判 平成12・6・27","case":"最三小判 平成12・6・27（民集54巻5号1737頁）","gist":"①194条に基づき引渡しを拒みうる場合、占有者は代価弁償の提供があるまで使用収益を行う権限を有する ②代価弁償を受けずに返還した後も194条に基づき代価弁償を請求できる（大判昭和4・12・11 を変更）"}],"law":"","cites":["民法/193","民法/194"],"rate":15,"designed":true,"ref":false,"hash":"d3c6d88b9ec1"}],"setsurei":["A は所有する建設機械甲を B に賃貸し、B が甲を保管していた。B は、甲を自己の所有物であると称して C に売却し、以後 C のために占有する旨を告げた（占有改定）。C は、甲が B の所有であると過失なく信じていた。その後 B は甲を D にも売却し、D に現実に引き渡した。D も B が所有者であると過失なく信じていた。 A は C・D に対し、それぞれ甲の返還を求めることができるか。また、C が後に B から甲の現実の引渡しを受けていた場合はどうか。","A が所有していた土木機械乙が、平成6年10月に X らに盗まれた。B は、**無店舗で**中古土木機械の販売業等を営む商人である。C は、盗難の数日後、B から乙が盗品であることを知らず、また知らないことに過失もなく、代金300万円で乙を買い受けて現実に引渡しを受け、以後これを工事に使用していた。 A は、平成8年8月（盗難から2年以内）、C に対して乙の引渡しと、訴状送達の日の翌日から返還までの使用利益相当額の支払を求めて訴えを提起した。A の請求はどこまで認められるか。また、C が訴訟係属中に代価の支払を受けないまま乙を任意に A に返還した場合、C はなお300万円の弁償を請求できるか。"],"full":"(1) 192条の要件と趣旨\n192条は、「取引行為によって、平穏に、かつ、公然と動産の占有を始めた者は、善意であり、かつ、過失がないときは、即時にその動産について行使する権利を取得する」と定める。\nその趣旨は、動産については占有が所有権の公示方法とされているところ、占有を信頼して取引に入った者を保護し、もって動産取引の安全を図る点にある（⟪占有の公信力⟫）。\nしたがって要件は、①目的物が動産であること、②取引行為によって占有を取得したこと、③前主が無権利者であること、④その点につき善意かつ無過失であること、⑤平穏・公然と占有を始めたことである。\n⦅制度趣旨が占有の公示に対する信頼の保護にある以上、登記・登録が公示方法とされている動産には本条の適用はない⦆⟨1⟩。また、取引の安全を図る制度であるから、相続等の包括承継や事実行為によって占有を得た場合も本条は適用されない。\nなお、本条が治癒するのは前主が⟪無権利⟫であることのみであり、取引行為自体の無効・取消しの瑕疵は治癒されない。\n平穏・公然・善意は⟪186条1項⟫により推定され、無過失は占有者の⟪権利適法の推定⟫（⟪188条⟫）により推定されるから、⦅即時取得を主張する者は、取引行為によって占有を始めたことを主張立証すれば足り、⟪自らの無過失を立証する必要はない⟫⦆⟨2⟩。\n\n(2) 占有改定による即時取得の可否\n引渡しの一態様である占有改定によって占有を取得した場合にも、「占有を始めた」といえるか。\n192条が原権利者の犠牲において取得者を保護するのは、原権利者の⟪追及を顧慮する必要がない⟫支配状態が取得者の下に生じたからである。占有改定においては、前主が⟪現実の所持を継続⟫しており、原権利者の間接占有もなお存続しているから、そのような支配状態が生じたとはいえない。\nそこで、⦅譲受人が192条によりその所有権を取得するためには、一般外観上従来の占有状態に⟪変更を生ずる⟫がごとき占有を取得することを要し、かかる状態に一般外観上変更を来たさない占有改定の方法による取得をもっては⟪足りない⟫と解する⦆⟨1⟩。\nしたがって、譲受人は、後に⟪現実の引渡し⟫を受けた時点を基準として、その時点で⟪善意・無過失⟫であれば即時取得する。\n\n(3) 指図による占有移転による即時取得の可否\n指図による占有移転も、現実の所持の移転を伴わない観念的な占有移転である。もっとも、上記の基準からすれば、決め手は所持の移転の有無ではなく、⟪原権利者の間接占有が失われ⟫、取得者の支配が⟪一般外観上確立⟫したといえるかにある。\nそこで、⦅原権利者の間接占有が⟪併存⟫したままである場合には即時取得は⟪認められない⟫が、指図によって原権利者の間接占有が失われ、直接占有者を介する間接占有者が⟪取得者のみ⟫となった場合には、「占有を始めた」といえ、⟪即時取得が成立し得る⟫と解する⦆⟨1⟩。\n\n(4) 盗品・遺失物の特則（193条・194条）\n即時取得が成立する場合でも、占有物が盗品または遺失物であるときは、被害者または遺失者は、盗難または遺失の時から⟪2年間⟫、占有者に対してその物の回復を請求することができる（⟪193条⟫）。占有が原権利者の意思によらずに離れた場合にまで、原権利者に失権を強いるのは相当でないからである。\nもっとも、占有者が、盗品・遺失物を、⟪競売もしくは公の市場⟫において、またはその物と⟪同種の物を販売する商人⟫から善意で買い受けたときは、被害者または遺失者は、占有者が支払った⟪代価を弁償⟫しなければその物を回復することができない（194条）。かかる場所・相手方から買い受けた者の信頼は特に保護に値するからである。\nでは、占有者が194条に基づき引渡しを拒みうる間、目的物の使用利益は誰に帰属するか。\n194条は、被害者等に代価弁償による回復か回復の断念かの選択を認めることで、占有者と被害者等との⟪保護の均衡⟫を図った規定である。被害者等が回復を断念すれば占有者は使用利益を享受できるのに、被害者等が代価の弁償を選択した途端に占有者が使用利益を失うとすれば、占有者の地位が著しく不安定となり、同条の趣旨に反する。また、弁償される代価には⟪利息が含まれない⟫以上、その均衡上も占有者に使用収益を認めるのが公平である。\nそこで、⦅占有者が194条に基づき代価の弁償があるまで引渡しを拒むことができる場合には、占有者は、その⟪弁償の提供⟫があるまで目的物の⟪使用収益を行う権限⟫を有すると解する⦆⟨1⟩。\nまた、⦅占有者が代価の弁償を受けないまま目的物を返還した場合であっても、被害者等が回復の断念か代価弁償かを選択し得る状況の下で後者を選択して引渡しを受けたといえるときは、占有者はなお194条に基づき⟪代価の弁償を請求⟫することができると解する⦆⟨2⟩。","kata":"| # | 落としてはいけない要素 | 語 |\n|---|---|---|\n| 1 | 条文 | 192条（項なし）・193条・194条 |\n| 2 | 趣旨 | 占有が動産の公示方法／占有への信頼＝取引安全（占有の公信力） |\n| 3 | 192条の要件5つ | 動産／取引行為／前主が無権利／善意無過失／平穏・公然に占有開始 |\n| 4 | 除外 | 登記・登録動産は適用なし／包括承継・事実行為は「取引行為」でない |\n| 5 | 治癒の範囲 | 治癒されるのは**前主の無権利のみ**（行為の瑕疵は治癒しない） |\n| 6 | 推定 | 善意・無過失は推定（188条）／主張者は無過失を立証しなくてよい |\n| 7 | 占有改定の規範 | 「**一般外観上従来の占有状態に変更を生ずるがごとき占有**」を要する→占有改定では足りない |\n| 8 | 占有改定の理由 | 前主が所持を継続＝**原権利者の間接占有が存続**＝追及権を顧慮すべき |\n| 9 | 占有改定の帰結 | 後に現実の引渡しを受けた時点を基準に判断 |\n| 10 | 指図の規範 | 決め手は**原権利者の間接占有が失われたか**／併存すれば否定・取得者のみになれば肯定し得る |\n| 11 | 193条 | 盗品・遺失物／被害者・遺失者／盗難・遺失の時から**2年間**／回復請求 |\n| 12 | 194条 | 競売・公の市場・同種の物を販売する商人／**善意**で買受け／代価弁償なくば回復不可 |\n| 13 | 使用収益権の規範 | 代価弁償の**提供があるまで**使用収益を行う権限を有する |\n| 14 | 使用収益権の理由 | 回復断念なら使用利益を得られるのに弁償選択で失うのは**均衡を欠く**／代価に**利息が含まれない** |\n| 15 | 返還後の弁償請求 | 返還後も194条に基づき代価弁償を請求できる（選択し得る状況で回復を選んだ場合） |\n\n**勝負どころ**：\n1. **占有改定の規範を判例の文言で書けるか**。「一般外観上従来の占有状態に変更を生ずるがごとき占有」はキーフレーズ。ここを自分の言葉で薄めると点が落ちる。\n2. **占有改定と指図を「原権利者の間接占有が残るか」という一本の基準で説明できるか**。形式的に「占有改定＝×、指図＝○」と暗記していると、指図でも否定される事案（真の所有者→受寄者→占有改定→指図の連鎖）で誤る。\n3. **194条の使用収益権を、所有権の帰属論に踏み込まずに194条の趣旨（均衡・利息不算入）から導けるか**。所有権帰属論に降りると論点が膨らんで時間切れになる。\n\n> ⚠️ **間違えやすい点**：\n> - **192条に「1項」はない**。193条・194条も項に分かれていない。「192条1項」と書かない。\n> - **無過失を推定する条文は188条**（186条1項ではない）。186条1項は占有者自身の善意・平穏・公然の推定。答案では「186条1項・188条により推定される」と書けば足りるが、**無過失の根拠を186条1項だけにしない**。\n> - **登録済自動車は「過失あり」で落とすのではなく、そもそも192条の適用がない**（最判昭62・4・24）。構成を間違えない。\n> - **193条の「被害者」に賃借人・受寄者も含まれる**（所有者に限られない）。逆に、賃借人が被害者の場合に所有者まで「被害者」に含めてよいかには議論がある。\n> - **194条の主観要件は「善意」のみ**（条文上「善意で買い受けたとき」）。無過失は192条の要件として別途必要になるが、194条自体の文言に無過失は出てこない。\n> - **平12・6・27 は所有権の帰属を判断していない**。「判例は占有者帰属説を採った」と書くのは誤り。\n> - **昭57・9・7 は事例判決**。「指図による占有移転なら常に即時取得できる」と書かない。","hanrei":[["最一小判 昭和35・2・11（民集14巻2号168頁）","192条により所有権を取得するには「一般外観上従来の占有状態に変更を生ずるがごとき占有」を取得することを要し、占有改定では足りない","民法判例百選Ⅰ**〔第9版〕64番**（＝〔第8版〕68番／〔第7版〕65番／〔第6版〕66番）。解説は第8版・第9版とも大塚直。事案は部落住民共有の水車発電機を代表者から買い受け占有改定で引渡しを受けた例。DBに評釈あり（石田剛・法学教室2013年11月号 No.398）"],["大判 大正5・5・16（民録22輯961頁）","192条の趣旨は、一般外観上従来の占有事実の状態に変更が生じ従前の権利者の追及権を顧みなくてよい場合の保護にある。そうでない場合まで占有委託者の利害を顧慮しない趣旨ではない","昭35・2・11 の**理由**はここにある。昭35判決自身は理由を述べていない"],["最二小判 昭和32・12・27（民集11巻14号2485頁）","占有改定による即時取得を否定","昭35・2・11 が引用"],["最一小判 昭和57・9・7（民集36巻8号1527頁）","寄託者台帳上の寄託者名義の変更による指図による占有移転で「192条にいう占有を取得した」とした原審の判断を是認","**事例判決**。荷渡指図書＋取引慣行に則った名義変更という特殊事情の下での判断。`判例百選_収録判例リスト.md`（第7版）に掲載なし。評釈は商法（総則・商行為）判例百選〔第5版〕56事件と記載"],["最三小判 平成12・6・27（民集54巻5号1737頁）","①194条に基づき引渡しを拒みうる場合、占有者は代価弁償の提供があるまで使用収益を行う権限を有する ②代価弁償を受けずに返還した後も194条に基づき代価弁償を請求できる（大判昭和4・12・11 を変更）","民法判例百選Ⅰ**〔第9版〕65番**（＝〔第8版〕69番／〔第7版〕66番）。⚠️ **解説執筆者は第8版＝笠井修／第9版＝栗田昌裕**（本論証が引く「所有権の帰属に踏み込まずに使用収益権を導く」という評価は第8版・笠井解説のもの）"],["最一小判 昭和41・6・9（民集20巻5号1011頁）","無過失は188条により推定され、占有取得者自身が無過失を立証する必要はない","`基礎法\\民事\\講義 物件・担保物権法` p.131、`法律学小辞典 第5版` p.854"],["最判 昭和62・4・24（判時1243号24頁）","道路運送車両法による登録を受けている自動車には192条の適用がない","登録が公示方法とされているため。`アガルート\\重要問題修得講座-民法` p.102"],["大判 大正10・7・8（民録27輯1373頁）","①193条の「被害者」は盗難・遺失により自らの意思によらず占有を失った者をいい、所有者に限られない ②回復までの2年間の所有権は原所有者に残る（原所有者帰属説）","①は `短答\\体系別短答過去問題集　民法(上)総則・物権[第３版]` p.378・p.386、②は `CorpusDb\\判例\\民法判例百選Ⅰ 総則・物権［第8版］` p.153"],["大判 昭和4・12・11（民集8巻923頁）","194条の場面でも回復までの所有権は原所有者に残るとした","平12・6・27 により、返還後の代価弁償請求を否定する限度で**変更**された"],["最判 昭和59・4・20（判時1121号）","193条は、被害者が即時取得の要件を具えない占有者に対して返還請求権を有することを当然の前提とした規定である","`基礎法\\民事\\講義 物件・担保物権法` p.139"],["最判 昭和26・11・27","194条が適用される事案で目的物が滅失している場合、回復請求権に代わる損害賠償請求権も生じない","`アガルート\\重要問題修得講座-民法` p.304。同書は、物が現存する場合との均衡から物の客観的価値と代価弁償の差額の請求を認めるべきとする立場もあると紹介"],["~~最判 昭和47・11・21~~","~~代理人・法人代表者が取引した場合、善意・無過失はその者について判断する~~","`基礎法\\民事\\講義 物件・担保物権法` p.131 に記載があるが、**裁判所・巻号のOCRが崩れており日付以外は裏取りできていない**。答案での引用は避ける"],["~~最判 昭和45・12・4~~","~~未登録自動車・登録抹消自動車は192条の適用対象となる~~","命題自体は `基礎法\\民事\\講義 物件・担保物権法` p.129・`アガルート\\重要問題修得講座-民法` p.102 で裏が取れているが、**判例の年月日はOCRが崩れており特定できていない**。命題だけを書き、日付を引用しない"],["~~最判 昭和51・2・13~~","~~194条で無償回復された場合、前主は占有者に対し使用利益の返還を求めることができる~~","`基礎法\\民事\\講義 物件・担保物権法` p.137 に記載があるがOCRが崩れており日付を特定できていない"]],"field":"動産物権変動・即時取得","order":10},{"name":"取得時効と登記","subject":"民法","rank":"A","path":"まとめ/民法/論証/取得時効と登記.md","cards":[{"id":"民法/取得時効と登記#1","block":"第1〔177条の適用〕","kind":"cloze","masked":"177条は物権変動の⟦ア⟧。取得時効による所有権の取得も不動産に関する物権の得喪であり、その公示を要求して⟦イ⟧を図るべきことは、意思表示による取得と変わらない。\nそこで、⦅⟦ウ⟧と解する⦆⟨1⟩。","body":"177条は物権変動の⟪原因を限定していない⟫。取得時効による所有権の取得も不動産に関する物権の得喪であり、その公示を要求して⟪取引の安全⟫を図るべきことは、意思表示による取得と変わらない。\nそこで、⦅⟪取得時効による所有権の取得についても177条が適用される⟫と解する⦆⟨1⟩。","answers":["原因を限定していない","取引の安全","取得時効による所有権の取得についても177条が適用される"],"check":"","notes":[{"n":1,"label":"大連判大正14・7・8","case":"大連判大正14・7・8（民集4巻412頁）","gist":"時効取得にも177条が適用される。**時効完成後**に登記名義人から権利を取得した第三者に対しては、登記なくして対抗できない"}],"law":"","cites":["民法/177"],"rate":7,"designed":true,"ref":false,"hash":"a45cc7a627e0"},{"id":"民法/取得時効と登記#2","block":"第2〔時効完成時の所有者・時効完成前に現れた第三者（当事者準則）〕","kind":"cloze","masked":"もっとも、時効完成の時点でみれば、一方で占有者が所有権を取得し、他方で当時の所有者がこれを失うのであるから、両者は物権変動の⟦ア⟧の関係に立つ。原所有者から⟦イ⟧に目的物を譲り受けて登記を備えた者も、時効完成の時点における所有者である以上、同様である⟨1⟩。\nしたがって、⦅時効取得者は、時効完成時の所有者に対しては、⟦ウ⟧と解する⦆⟨2⟩。","body":"もっとも、時効完成の時点でみれば、一方で占有者が所有権を取得し、他方で当時の所有者がこれを失うのであるから、両者は物権変動の⟪当事者⟫の関係に立つ。原所有者から⟪時効完成前⟫に目的物を譲り受けて登記を備えた者も、時効完成の時点における所有者である以上、同様である⟨1⟩。\nしたがって、⦅時効取得者は、時効完成時の所有者に対しては、⟪登記なくして時効取得を対抗することができる⟫と解する⦆⟨2⟩。","answers":["当事者","時効完成前","登記なくして時効取得を対抗することができる"],"check":"","notes":[{"n":1,"label":"最判昭和41・11・22","case":"**最判昭和41・11・22**（民集20巻9号1901頁）","gist":"**時効完成前**に原所有者から目的物を取得した第三者も当事者であり、時効取得者は登記なくして対抗できる（準則②＝当事者準則）"},{"n":2,"label":"大判大正7・3・2","case":"大判大正7・3・2（民録24輯423頁）","gist":"時効完成時の所有者は、時効取得により権利を失うため**当事者**であり、時効取得者は登記なくして対抗できる（準則①）"}],"law":"","cites":[],"rate":0,"designed":true,"ref":false,"hash":"e87ec6e7b3fc"},{"id":"民法/取得時効と登記#3","block":"第3〔時効完成後に現れた第三者（第三者準則）〕","kind":"cloze","masked":"これに対し、時効完成後に原所有者から目的物を譲り受けた者は、原所有者を起点として、時効取得者と⟦ア⟧することができる。時効取得者は、時効完成後は⟦イ⟧のであるから、⟦ウ⟧を負うべきである。\nしたがって、⦅時効完成後に現れた第三者との関係は⟦エ⟧となり、時効取得者は、⟦オ⟧と解する⦆⟨1⟩。","body":"これに対し、時効完成後に原所有者から目的物を譲り受けた者は、原所有者を起点として、時効取得者と⟪二重に譲渡を受けた第二譲受人と同視⟫することができる。時効取得者は、時効完成後は⟪登記をしようと思えばすることができた⟫のであるから、⟪登記を怠った不利益⟫を負うべきである。\nしたがって、⦅時効完成後に現れた第三者との関係は⟪対抗問題⟫となり、時効取得者は、⟪登記をしなければ時効取得を対抗することができない⟫と解する⦆⟨1⟩。","answers":["二重に譲渡を受けた第二譲受人と同視","登記をしようと思えばすることができた","登記を怠った不利益","対抗問題","登記をしなければ時効取得を対抗することができない"],"check":"","notes":[{"n":1,"label":"最判昭和33・8・28","case":"最判昭和33・8・28（民集12巻12号1936頁）","gist":"時効による所有権取得は、**時効完成後の第三者**に対しては登記がなければ対抗できない"}],"law":"","cites":[],"rate":0,"designed":true,"ref":false,"hash":"ea61db4d797f"},{"id":"民法/取得時効と登記#4","block":"第4〔起算点の固定（起算点固定準則）〕","kind":"cloze","masked":"第三者の出現が時効完成の前か後かで結論を分ける以上、時効の起算点を動かせるとすれば、時効取得者は常に⟦ア⟧して相手方を時効完成前の当事者と位置づけることができ、右の区別が無意味になる。\nそこで、⦅時効の起算点は、⟦イ⟧、すなわち⟦ウ⟧に固定され、時効取得を主張する者が⟦エ⟧と解する⦆⟨1⟩。","body":"第三者の出現が時効完成の前か後かで結論を分ける以上、時効の起算点を動かせるとすれば、時効取得者は常に⟪現在から逆算⟫して相手方を時効完成前の当事者と位置づけることができ、右の区別が無意味になる。\nそこで、⦅時効の起算点は、⟪時効の基礎たる事実が開始した時⟫、すなわち⟪占有開始時⟫に固定され、時効取得を主張する者が⟪任意にこれを選択することはできない⟫と解する⦆⟨1⟩。","answers":["現在から逆算","時効の基礎たる事実が開始した時","占有開始時","任意にこれを選択することはできない"],"check":"","notes":[{"n":1,"label":"最判昭和35・7・27","case":"**最判昭和35・7・27**（民集14巻10号1871頁）","gist":"「必らず時効の基礎たる事実の開始した時を起算点として時効完成の時期を決定すべきものであって、取得時効を援用する者において**任意にその起算点を選択し、時効完成の時期を或いは早め或いは遅らせることはできない**」（準則④＝起算点固定準則）"}],"law":"","cites":[],"rate":0,"designed":true,"ref":false,"hash":"1f81b5a995ce"},{"id":"民法/取得時効と登記#5","block":"第5〔第三者の登記後さらに占有を継続した場合（敗者復活準則）〕","kind":"cloze","masked":"もっとも、時効取得者が第三者の登記後もさらに⟦ア⟧したときは、⟦イ⟧する。この場合、その第三者は新たな時効によって権利を失う⟦ウ⟧にほかならない。\nしたがって、⦅この場合には、時効取得者は、その第三者に対し、⟦エ⟧と解する⦆⟨1⟩。","body":"もっとも、時効取得者が第三者の登記後もさらに⟪時効取得に必要な期間占有を継続⟫したときは、⟪その第三者を起点として新たに取得時効が完成⟫する。この場合、その第三者は新たな時効によって権利を失う⟪当事者⟫にほかならない。\nしたがって、⦅この場合には、時効取得者は、その第三者に対し、⟪登記なくして時効取得を対抗することができる⟫と解する⦆⟨1⟩。","answers":["時効取得に必要な期間占有を継続","その第三者を起点として新たに取得時効が完成","当事者","登記なくして時効取得を対抗することができる"],"check":"","notes":[{"n":1,"label":"最判昭和36・7・20","case":"**最判昭和36・7・20**（民集15巻7号1903頁）","gist":"第三者の登記後、時効取得者がさらに時効取得に必要な期間占有を継続したときは、その第三者に対し登記なくして時効取得を対抗できる（準則⑤＝敗者復活準則）"}],"law":"","cites":[],"rate":0,"designed":true,"ref":false,"hash":"650da2884d99"},{"id":"民法/取得時効と登記#6","block":"第6〔時効完成後の第三者が背信的悪意者である場合〕","kind":"cloze","masked":"時効完成後の第三者であっても、物権変動があった事実を知り、かつ登記の欠缺を主張することが信義に反すると認められる事情があるときは、背信的悪意者として「第三者」から排除される。\nもっとも、取得時効は、その⟦ア⟧ものではない。そこで、⦅取得時効の場面では、第三者が⟦イ⟧、少なくとも、時効取得者による⟦ウ⟧を認識していれば「悪意」の要件は満たされると解する⦆⟨1⟩。","body":"時効完成後の第三者であっても、物権変動があった事実を知り、かつ登記の欠缺を主張することが信義に反すると認められる事情があるときは、背信的悪意者として「第三者」から排除される。\nもっとも、取得時効は、その⟪要件の充足の有無を外部から容易に認識・判断できる⟫ものではない。そこで、⦅取得時効の場面では、第三者が⟪時効の成立要件をすべて具体的に認識している必要はなく⟫、少なくとも、時効取得者による⟪多年にわたる占有継続の事実⟫を認識していれば「悪意」の要件は満たされると解する⦆⟨1⟩。","answers":["要件の充足の有無を外部から容易に認識・判断できる","時効の成立要件をすべて具体的に認識している必要はなく","多年にわたる占有継続の事実"],"check":"","notes":[{"n":1,"label":"最判平成18・1・17","case":"**最判平成18・1・17**（民集60巻1号27頁）","gist":"時効完成後の第三者にも177条・背信的悪意者排除論が適用される。「乙が甲による**多年にわたる占有継続の事実を認識している必要がある**」が、「甲が取得時効の成立要件を充足していることを**すべて具体的に認識していなくても**、背信的悪意者と認められる場合がある」"}],"law":"","cites":[],"rate":0,"designed":true,"ref":false,"hash":"1d1f97d03bcd"}],"setsurei":["A は 1995年4月1日、B 所有の甲土地を B から買い受け、同日引渡しを受けて占有を開始した。A は自己に所有権があると信じ、そう信じたことに過失はなかったが、移転登記は経由しなかった。 B は 2010年5月、甲土地を C に売却し、C は同月中に移転登記を経由した。C は 2020年、A に対して甲土地の明渡しを求めた。 A は、「2010年5月の C の登記の直前から数えても、そこまでに20年近く占有している。起算点を 2000年に置けば C は時効完成前の第三者だ」と主張している。A の主張は認められるか。","設例1と同じ事実関係のもと、A は C の登記後も甲土地の占有を継続し、2023年に至った。 (1) A は C に対し、登記なくして甲土地の時効取得を対抗できるか。 (2) かりに C が、甲土地を買い受ける際、A が長年にわたり甲土地を占有して耕作している事実を知っており、A が登記を得ていないことを奇貨として、後に A に高値で売りつける目的で買い受けていたとすればどうか。C は、A の占有が所有の意思に基づくものか、A が善意無過失であったかまでは知らなかった。"],"full":"(1) 177条の適用\n177条は物権変動の⟪原因を限定していない⟫。取得時効による所有権の取得も不動産に関する物権の得喪であり、その公示を要求して⟪取引の安全⟫を図るべきことは、意思表示による取得と変わらない。\nそこで、⦅⟪取得時効による所有権の取得についても177条が適用される⟫と解する⦆⟨1⟩。\n\n(2) 時効完成時の所有者・時効完成前に現れた第三者（当事者準則）\nもっとも、時効完成の時点でみれば、一方で占有者が所有権を取得し、他方で当時の所有者がこれを失うのであるから、両者は物権変動の⟪当事者⟫の関係に立つ。原所有者から⟪時効完成前⟫に目的物を譲り受けて登記を備えた者も、時効完成の時点における所有者である以上、同様である⟨1⟩。\nしたがって、⦅時効取得者は、時効完成時の所有者に対しては、⟪登記なくして時効取得を対抗することができる⟫と解する⦆⟨2⟩。\n\n(3) 時効完成後に現れた第三者（第三者準則）\nこれに対し、時効完成後に原所有者から目的物を譲り受けた者は、原所有者を起点として、時効取得者と⟪二重に譲渡を受けた第二譲受人と同視⟫することができる。時効取得者は、時効完成後は⟪登記をしようと思えばすることができた⟫のであるから、⟪登記を怠った不利益⟫を負うべきである。\nしたがって、⦅時効完成後に現れた第三者との関係は⟪対抗問題⟫となり、時効取得者は、⟪登記をしなければ時効取得を対抗することができない⟫と解する⦆⟨1⟩。\n\n(4) 起算点の固定（起算点固定準則）\n第三者の出現が時効完成の前か後かで結論を分ける以上、時効の起算点を動かせるとすれば、時効取得者は常に⟪現在から逆算⟫して相手方を時効完成前の当事者と位置づけることができ、右の区別が無意味になる。\nそこで、⦅時効の起算点は、⟪時効の基礎たる事実が開始した時⟫、すなわち⟪占有開始時⟫に固定され、時効取得を主張する者が⟪任意にこれを選択することはできない⟫と解する⦆⟨1⟩。\n\n(5) 第三者の登記後さらに占有を継続した場合（敗者復活準則）\nもっとも、時効取得者が第三者の登記後もさらに⟪時効取得に必要な期間占有を継続⟫したときは、⟪その第三者を起点として新たに取得時効が完成⟫する。この場合、その第三者は新たな時効によって権利を失う⟪当事者⟫にほかならない。\nしたがって、⦅この場合には、時効取得者は、その第三者に対し、⟪登記なくして時効取得を対抗することができる⟫と解する⦆⟨1⟩。\n\n(6) 時効完成後の第三者が背信的悪意者である場合\n時効完成後の第三者であっても、物権変動があった事実を知り、かつ登記の欠缺を主張することが信義に反すると認められる事情があるときは、背信的悪意者として「第三者」から排除される。\nもっとも、取得時効は、その⟪要件の充足の有無を外部から容易に認識・判断できる⟫ものではない。そこで、⦅取得時効の場面では、第三者が⟪時効の成立要件をすべて具体的に認識している必要はなく⟫、少なくとも、時効取得者による⟪多年にわたる占有継続の事実⟫を認識していれば「悪意」の要件は満たされると解する⦆⟨1⟩。","kata":"| # | 落としてはいけない要素 | ランクAでの扱い |\n|---|---|---|\n| 1 | 時効取得にも**177条が適用**される（変動原因を限定していない／公示の要請） | **必須** |\n| 2 | **時効完成時の所有者・時効完成前の第三者は「当事者」→登記不要** | **必須** |\n| 3 | 2の理由＝**時効完成の時点でみれば一方が所有権を取得し他方が失う**＝承継取得の当事者とみてよい | **必須**（理由まで） |\n| 4 | **時効完成後の第三者は「第三者」→登記必要** | **必須** |\n| 5 | 4の理由＝**原所有者を起点とする二重譲渡と同視できる／時効取得者は登記しようと思えばできた** | **必須**（理由2本とも） |\n| 6 | **起算点は占有開始時に固定**され、任意に選択できない | **必須** |\n| 7 | 6の理由＝**動かせるなら常に相手方を時効完成前の当事者にできてしまい、2と4の区別が無意味になる** | **必須**（ここを落とすと起算点固定が丸暗記になる） |\n| 8 | **第三者の登記後さらに時効期間占有すれば、その第三者に登記なくして対抗できる**（敗者復活） | **必須** |\n| 9 | 8の理由＝**その第三者を起点に新たな時効が完成し、その第三者が当事者になる** | **必須** |\n| 10 | 時効完成後の第三者が**背信的悪意者**なら「第三者」から排除される | **必須** |\n| 11 | 10における**悪意の対象＝多年にわたる占有継続の事実の認識で足りる**（成立要件のすべてを具体的に認識している必要はない） | **必須**（この論証の一番の売り。文言でほぼ再生できること） |\n| 12 | 162条1項（20年）・2項（10年・占有開始時の善意無過失）／177条の条文指摘 | 必須 |\n| 13 | 〔副〕登記尊重説の存在と決め手（時効完成**前**の第三者の場面で結論が逆転） | **存在と決め手が言えれば可** |\n| 14 | 判例の年月日・百選番号 | **不要**（答案に書かないので暗記対象外） |\n\n**勝負どころ**：\n1. **起算点固定と当事者／第三者の振り分けが「セット」であることを言えるか。**起算点固定を単独のルールとして暗記していると、なぜ必要なのかが書けない。「起算点を動かせるなら常に自分を時効完成前に置けてしまう」——この一文が書ければ、準則②③④が一本の論理でつながる。\n2. **事案の時系列を正確に切れるか。**占有開始日＋善意無過失の有無から**時効完成日を確定**し、第三者の**権利取得日**（登記日ではない）がその前か後かを判定する。最判昭和42・7・21 のとおり、第三者の**所有権取得**が時効完成前であれば、その**登記が時効完成後**でも当事者準則が働く。\n3. **背信的悪意者ルートで「悪意の対象」を書き分けられるか。**「C は A の占有を知っていたから悪意」で止めず、「取得時効の成否は外部から容易に判断できないから、成立要件をすべて認識している必要はなく、多年にわたる占有継続の認識で足りる」という**弾力化の理由**まで書く。\n\n> ⚠️ **間違えやすい点**\n> - **起算点を動かして「時効完成前の第三者」に仕立てる**——準則④が正面から禁じる。設例1の A の主張がまさにこれ。\n> - **第三者の「登記」の日で完成前後を判定する**——判定するのは第三者の**権利取得**が時効完成前かどうか。取得が完成前なら登記が完成後でも当事者準則（最判昭和42・7・21）。\n> - **敗者復活で「10年」と即断する**——新たな起算点（第三者の登記時）における占有者の主観次第。第三者の登記を知って自分が無権利と分かっていれば善意ではなく、**20年**（162条1項）が要る。\n> - **背信的悪意者の認定を「悪意」だけで済ませる**——平成18年判決は悪意要件を**弾力化した**だけで、**背信性（信義に反すると認められる事情）は別途必要**。悪意と背信性は明確に区別されている（百選Ⅰ〔第8版〕p.134）。\n> - **時効取得は原始取得だから177条は適用されない、と書く**——判例は原始取得であることを認めつつ177条を適用する。原始取得性は「当事者とみてよい」という説明の**障害にはならない**（`講義 物件・担保物権法` p.63 の括弧書き参照）。","hanrei":[["**最判昭和46・11・5**（民集25巻8号1087頁）","二重売買で第2買主が登記を備えた場合、第1買主は**当初から全く所有権を取得しなかった**ことになるから、その占有は「他人の物」の占有であり、**買受後の占有取得時から**162条の時効期間が進行する。また「時効完成当時の甲の所有者である Y は物権変動の当事者であるから、X は Y に対しその登記なくして甲の時効取得を対抗することができる」","民法判例百選Ⅰ**〔第9版〕53番（＝〔第8版〕57番・〔第7版〕55番）**「時効取得と登記(1)—時効完成前の譲受人」（解説は第8版・第9版とも村田健介）。**5準則の総まとめとして解説が置かれている事件**。頁は `講義 物件・担保物権法` p.63 の非崩れ表記で**1087頁**と確定（百選側のOCR「川 87 頁」の「川」＝10）"],["大連判大正14・7・8（民集4巻412頁）","時効取得にも177条が適用される。**時効完成後**に登記名義人から権利を取得した第三者に対しては、登記なくして対抗できない","百選Ⅰ〔第8版〕p.128・p.129、`民法の基礎１総則-佐久間毅` p.454、`伊藤塾\\新・伊藤塾試験対策問題集 論文1 民法` p.117。**百選リストに掲載なし**"],["大判大正7・3・2（民録24輯423頁）","時効完成時の所有者は、時効取得により権利を失うため**当事者**であり、時効取得者は登記なくして対抗できる（準則①）","百選Ⅰ〔第8版〕p.128、`民法の基礎１総則-佐久間毅` p.454。**百選リストに掲載なし**"],["**最判昭和41・11・22**（民集20巻9号1901頁）","**時効完成前**に原所有者から目的物を取得した第三者も当事者であり、時効取得者は登記なくして対抗できる（準則②＝当事者準則）","百選Ⅰ〔第8版〕p.128、`民法演習サブノート210問` p.92（参考判例②）、`伊藤塾\\新・伊藤塾試験対策問題集 論文1 民法` p.117。**百選リストに掲載なし**"],["最判昭和33・8・28（民集12巻12号1936頁）","時効による所有権取得は、**時効完成後の第三者**に対しては登記がなければ対抗できない","`民法の基礎１総則-佐久間毅` p.454、`民法演習サブノート210問` p.92（参考判例③）。**百選リストに掲載なし**"],["**最判昭和35・7・27**（民集14巻10号1871頁）","「必らず時効の基礎たる事実の開始した時を起算点として時効完成の時期を決定すべきものであって、取得時効を援用する者において**任意にその起算点を選択し、時効完成の時期を或いは早め或いは遅らせることはできない**」（準則④＝起算点固定準則）","`基礎法\\民事\\講義 物件・担保物権法` p.64（判旨全文）、百選Ⅰ〔第8版〕p.129、`民法演習サブノート210問` p.92（参考判例④）、`伊藤塾\\新・伊藤塾試験対策問題集 論文1 民法` p.117。同旨：大判昭和14・7・19 民集18巻856頁。**百選リストに掲載なし**"],["**最判昭和36・7・20**（民集15巻7号1903頁）","第三者の登記後、時効取得者がさらに時効取得に必要な期間占有を継続したときは、その第三者に対し登記なくして時効取得を対抗できる（準則⑤＝敗者復活準則）","百選Ⅰ〔第8版〕p.129・p.130、`講義 物件・担保物権法` p.64、`民法演習サブノート210問` p.92（参考判例⑤）、`伊藤塾\\新・伊藤塾試験対策問題集 論文1 民法` p.118。**百選リストに掲載なし**"],["**最判平成18・1・17**（民集60巻1号27頁）","時効完成後の第三者にも177条・背信的悪意者排除論が適用される。「乙が甲による**多年にわたる占有継続の事実を認識している必要がある**」が、「甲が取得時効の成立要件を充足していることを**すべて具体的に認識していなくても**、背信的悪意者と認められる場合がある」","民法判例百選Ⅰ**〔第9版〕54番（＝〔第8版〕60番・〔第7版〕57番）**（第9版の表題は「時効取得と登記(2)—時効完成後の譲受人と背信的悪意者」、第8版は「民法177条の第三者の範囲(1)—背信的悪意者」。解説はいずれも石田剛）。**本論証(6)の直接の根拠**"],["**最判平成24・3・16**（民集66巻5号2321頁）","取得時効完成後に設定・登記された抵当権についても、占有者がその後引き続き時効取得に必要な期間占有を継続したときは、**抵当権の存在を容認していたなど特段の事情がない限り**、占有者は不動産を時効取得し抵当権は消滅する（敗者復活準則を抵当権に及ぼした）","民法判例百選Ⅰ**〔第9版〕55番（＝〔第8版〕58番・〔第7版〕93番）**（第9版の表題は「時効取得と登記(3)—抵当権の設定と再度の時効取得」。解説は第8版＝松岡久和／**第9版＝石田剛**）。**民集66巻5号2321頁は 2026-07-29 に確定**（`講義 物権・担保物権法』p.364 が崩れていない形で「最判平成24・3・16 民集66巻5号2321頁【百選58】」と載せている。従来の「OCRが崩れており確度が落ちる」の留保は解消）"],["最判昭和42・7・21（民集21巻6号1653頁）","「自己の物」でも時効取得の対象となりうる。第三者の**所有権取得**が時効完成前であれば、その**登記が時効完成後**であっても、時効取得者は登記なくして対抗できる","民法判例百選Ⅰ**〔第9版〕41番（＝〔第8版〕45番・〔第7版〕44番）**「自己の物の時効取得」。頁は `講義 物件・担保物権法` p.63 の判旨引用部（「165321214267」＝1653頁・21巻6号・昭42・7・21）で**1653頁と確定**（百選側のOCR「1643頁」「I 3 頁」は崩れ）"],["大判大正9・7・16（民録26輯1108頁）","未登記の所有権取得者は、占有開始以後・時効完成前に譲渡人から設定を受けた抵当権者やその実行による買受人に対しても、登記なくして時効取得を対抗できる（397条）","百選Ⅰ〔第8版〕p.130、`民法演習サブノート210問` p.92（参考判例①）。**百選リストに掲載なし**"],["最判平成15・10・31（判時1846号7頁）","時効取得者が移転登記を得たが、その登記前に抵当権が登記されていた事例で、起算点を抵当権設定登記時にずらして再度の取得時効を主張・援用することはできないとした","百選Ⅰ〔第8版〕p.131。**最判平24・3・16 により「実質的に修正されることになろう」**と同解説（松岡久和）は評価する。**答案の幹に据えないこと**。日付はOCRが「平成 15 ・川・ 31」で「川」＝10と読んだ（他の箇所の「川」も一貫して10を指す）が、**確度は落ちる**"],["最判平成23・1・21（判時2105号9頁）","不動産の賃借権者が対抗要件を具備しない間に抵当権が設定・登記された場合、抵当権設定登記後に賃借権の時効取得に必要な期間用益しても、公売等による買受人には賃借権の時効取得を対抗できない","民法判例百選Ⅰ**〔第9版〕44番（＝〔第8版〕48番・〔第7版〕94番）**「土地賃借権の時効取得と抵当不動産の買受人への対抗」（解説は第8版・第9版とも阿部裕介）。同じく平24・3・16 により実質的修正を受けるとされる（百選Ⅰ〔第8版〕p.131）。**本論証のスコープ外**（賃借権の時効取得）"]],"field":"不動産物権変動（177条）","order":9},{"name":"受領遅滞・履行不能・代償請求権_413条・413条の2・422条の2","subject":"民法","rank":"A","path":"まとめ/民法/論証/受領遅滞・履行不能・代償請求権_413条・413条の2・422条の2.md","cards":[{"id":"民法/受領遅滞・履行不能・代償請求権_413条・413条の2・422条の2#1","block":"第1〔受領遅滞の要件〕","kind":"cloze","masked":"受領遅滞が認められるためには、1 債務者が⟦ア⟧をしたこと、2 債権者が債務の履行を⟦イ⟧、又は受けることができないこと、が必要である。2 は413条1項の文言そのものであり、1 は同項が効果の起算点を「履行の提供をした時から」と定めていることの前提である。1 の履行の提供の意義は、⟦ウ⟧（492条・493条）と同じである。","body":"受領遅滞が認められるためには、1 債務者が⟪債務の本旨に従った履行の提供⟫をしたこと、2 債権者が債務の履行を⟪受けることを拒み⟫、又は受けることができないこと、が必要である。2 は413条1項の文言そのものであり、1 は同項が効果の起算点を「履行の提供をした時から」と定めていることの前提である。1 の履行の提供の意義は、⟪弁済の提供⟫（492条・493条）と同じである。","answers":["債務の本旨に従った履行の提供","受けることを拒み","弁済の提供"],"check":"","notes":[],"law":"","cites":["民法/413","民法/492","民法/493"],"rate":25,"designed":true,"ref":true,"hash":"d57f2e2857e5"},{"id":"民法/受領遅滞・履行不能・代償請求権_413条・413条の2・422条の2#2","block":"第2〔条文が定める効果〕","kind":"cloze","masked":"(1) 債務の目的が特定物の引渡しであるときは、債務者は、履行の提供をした時からその引渡しをするまで、⟦ア⟧をもってその物を保存すれば足りる（413条1項）。本来の保存義務が⟦イ⟧（400条）であるところ、受領遅滞後の債務者は他人の物を無償で保管しているに等しいから、その程度が軽減される。\n(2) 受領を拒み、又は受けることができないことによって履行の費用が増加したときは、その増加額は⟦ウ⟧となる（413条2項）。再度の運搬費用・目的物の保管費用がこれにあたる。\n(3) 履行の提供があった時以後に、当事者双方の責めに帰することができない事由によって履行が不能となったときは、その履行の不能は⟦エ⟧によるものとみなされる（⟦オ⟧）。本旨に従った履行の提供をした債務者に不能のリスクを負わせるのは相当でないからである。\nその結果、債権者は反対給付の履行を⟦カ⟧（536条2項前段）、履行不能を理由として契約を解除することもできない（543条）。もっとも、債務者は、自己の債務を免れたことによって利益を得たときは、これを債権者に償還しなければならない（536条2項後段の⟪類推適用⟫）。\n(4) 売買においては、売主が契約の内容に適合する目的物をもって引渡債務の履行を提供したにもかかわらず買主が受領しなかった場合、その提供があった時以後に双方無責の事由により目的物が滅失し又は損傷したときは、買主は、これを理由として履行の追完の請求・代金減額の請求・損害賠償の請求及び契約の解除をすることができず、代金の支払を拒むこともできない（567条2項・1項）。\n⚠️ (3)(4)はいずれも「⟪債務者が保存義務を尽くしていること⟫」が前提である。債務者が413条1項の軽減された注意義務にすら違反した結果として履行が不能となったときは、「債務者の責めに帰すべき事由」による履行不能であるから、債権者は損害賠償を請求し（415条1項）、契約を解除し（542条1項1号）、反対給付の履行を拒むことができる。","body":"(1) 債務の目的が特定物の引渡しであるときは、債務者は、履行の提供をした時からその引渡しをするまで、⟪自己の財産に対するのと同一の注意⟫をもってその物を保存すれば足りる（413条1項）。本来の保存義務が⟪善良な管理者の注意⟫（400条）であるところ、受領遅滞後の債務者は他人の物を無償で保管しているに等しいから、その程度が軽減される。\n(2) 受領を拒み、又は受けることができないことによって履行の費用が増加したときは、その増加額は⟪債権者の負担⟫となる（413条2項）。再度の運搬費用・目的物の保管費用がこれにあたる。\n(3) 履行の提供があった時以後に、当事者双方の責めに帰することができない事由によって履行が不能となったときは、その履行の不能は⟪債権者の責めに帰すべき事由⟫によるものとみなされる（⟪413条の2第2項⟫）。本旨に従った履行の提供をした債務者に不能のリスクを負わせるのは相当でないからである。\nその結果、債権者は反対給付の履行を⟪拒むことができず⟫（536条2項前段）、履行不能を理由として契約を解除することもできない（543条）。もっとも、債務者は、自己の債務を免れたことによって利益を得たときは、これを債権者に償還しなければならない（536条2項後段の⟪類推適用⟫）。\n(4) 売買においては、売主が契約の内容に適合する目的物をもって引渡債務の履行を提供したにもかかわらず買主が受領しなかった場合、その提供があった時以後に双方無責の事由により目的物が滅失し又は損傷したときは、買主は、これを理由として履行の追完の請求・代金減額の請求・損害賠償の請求及び契約の解除をすることができず、代金の支払を拒むこともできない（567条2項・1項）。\n⚠️ (3)(4)はいずれも「⟪債務者が保存義務を尽くしていること⟫」が前提である。債務者が413条1項の軽減された注意義務にすら違反した結果として履行が不能となったときは、「債務者の責めに帰すべき事由」による履行不能であるから、債権者は損害賠償を請求し（415条1項）、契約を解除し（542条1項1号）、反対給付の履行を拒むことができる。","answers":["自己の財産に対するのと同一の注意","善良な管理者の注意","債権者の負担","債権者の責めに帰すべき事由","413条の2第2項","拒むことができず"],"check":"","notes":[],"law":"413条1項2項・400条・413条の2第2項・536条2項・567条2項（受領遅滞の効果）","cites":["民法/413","民法/400","民法/413の2","民法/536","民法/543","民法/567","民法/415","民法/542"],"rate":43,"designed":true,"ref":false,"hash":"1cc5fe887ca4"},{"id":"民法/受領遅滞・履行不能・代償請求権_413条・413条の2・422条の2#3","block":"第3〔条文が答えていない効果＝受領義務〕","kind":"cloze","masked":"⦅債権者は、原則として⟦ア⟧から、債務者は、受領遅滞それ自体を理由として損害賠償を請求し、又は契約を解除することはできないと解する⦆⟨1⟩。債権はあくまで⟦イ⟧、413条も債務者の保存義務の軽減と増加費用の債権者負担を定めるにとどまるからである。\nもっとも、⦅契約の趣旨に照らし、⟦ウ⟧なくしては債務の履行を完了することができず、かつ債務者が⟦エ⟧を費やしたなど⟦オ⟧が認められる場合には、⟦カ⟧上、債権者は目的物を⟦キ⟧を負うと解する⦆⟨2⟩。この場合、引取義務の違反は債務不履行であるから、債務者は、損害賠償を請求し（415条1項）、又は契約を解除することができる（541条・542条）。","body":"⦅債権者は、原則として⟪受領義務を負わない⟫から、債務者は、受領遅滞それ自体を理由として損害賠償を請求し、又は契約を解除することはできないと解する⦆⟨1⟩。債権はあくまで⟪権利であって義務ではなく⟫、413条も債務者の保存義務の軽減と増加費用の債権者負担を定めるにとどまるからである。\nもっとも、⦅契約の趣旨に照らし、⟪債権者の協力⟫なくしては債務の履行を完了することができず、かつ債務者が⟪履行の準備に相当の努力⟫を費やしたなど⟪取引の特殊性⟫が認められる場合には、⟪信義則⟫上、債権者は目的物を⟪引き取る義務⟫を負うと解する⦆⟨2⟩。この場合、引取義務の違反は債務不履行であるから、債務者は、損害賠償を請求し（415条1項）、又は契約を解除することができる（541条・542条）。","answers":["受領義務を負わない","権利であって義務ではなく","債権者の協力","履行の準備に相当の努力","取引の特殊性","信義則","引き取る義務"],"check":"","notes":[{"n":1,"label":"最判 昭和40・12・3","case":"最判 昭和40・12・3（民集19巻9号2090頁）","gist":"「債務者の債務不履行と債権者の受領遅滞とは、その性質が異なるのであるから、一般に後者に前者と全く同一の効果を認めることは民法の予想していないところというべきである」として、**受領遅滞を理由とする契約解除を否定**"},{"n":2,"label":"最判 昭和46・12・16","case":"最判 昭和46・12・16（民集25巻9号1472頁）**硫黄鉱石事件**","gist":"契約期間を通じてＸが採掘する鉱石の**全量**が売買の目的とされ、継続的に供給すべきものであるから、「信義則に照らして考察するときは」Ｙはこれを引き取り代金を支払うべき法律関係が存在していたとして、**買主の引取義務を肯定**"}],"law":"","cites":["民法/413","民法/415","民法/541","民法/542"],"rate":8,"designed":true,"ref":false,"hash":"8adcb4b121be"},{"id":"民法/受領遅滞・履行不能・代償請求権_413条・413条の2・422条の2#4","block":"第4〔履行遅滞中の履行不能〕","kind":"cloze","masked":"債務者がその債務について遅滞の責任を負っている間に、当事者双方の責めに帰することができない事由によって履行が不能となったときは、その履行の不能は、⟦ア⟧によるものとみなされる（⟦イ⟧）。債務者は⟦ウ⟧だからである。","body":"債務者がその債務について遅滞の責任を負っている間に、当事者双方の責めに帰することができない事由によって履行が不能となったときは、その履行の不能は、⟪債務者の責めに帰すべき事由⟫によるものとみなされる（⟪413条の2第1項⟫）。債務者は⟪履行期に給付をすることができたはず⟫だからである。","answers":["債務者の責めに帰すべき事由","413条の2第1項","履行期に給付をすることができたはず"],"check":"","notes":[],"law":"","cites":["民法/413の2"],"rate":58,"designed":true,"ref":true,"hash":"a8cc656152f4"},{"id":"民法/受領遅滞・履行不能・代償請求権_413条・413条の2・422条の2#5","block":"第5〔代償請求権〕","kind":"cloze","masked":"⦅債務者が、その債務の履行が不能となったのと⟦ア⟧により債務の目的物の⟦イ⟧を取得したときは、債権者は、⟦ウ⟧において、債務者に対し、その権利の移転又はその利益の償還を請求することができる⦆⟨1⟩（⟦エ⟧）。\n要件は、1 債務の履行が不能となったこと、2 債務者が債務の目的物の⟦イ⟧を取得したこと、3 それが履行不能と⟦ア⟧によること、4 債権者に代償以上の損害が生じたこと（「⟦ウ⟧において」）、である。\n効果は、1 代償である権利の移転、又は2 代償である利益の償還であり、いずれも⟪債権者が受けた損害の額を上限とする⟫。履行不能を契機として債権者が損害を超える利得をすることは許されないからである。\n⟦オ⟧と解する。したがって、債務者の責めに帰すべき事由によって履行が不能となった場合にも、債権者は、履行に代わる損害賠償の請求（415条2項1号）と代償請求権のいずれを行使してもよい。債権者が代償請求権を行使して利益を得たときは、その限度で損害賠償請求権が⟦カ⟧する。","body":"⦅債務者が、その債務の履行が不能となったのと⟪同一の原因⟫により債務の目的物の⟪代償である権利又は利益⟫を取得したときは、債権者は、⟪その受けた損害の額の限度⟫において、債務者に対し、その権利の移転又はその利益の償還を請求することができる⦆⟨1⟩（⟪422条の2⟫）。\n要件は、1 債務の履行が不能となったこと、2 債務者が債務の目的物の代償である権利又は利益を取得したこと、3 それが履行不能と同一の原因によること、4 債権者に代償以上の損害が生じたこと（「その受けた損害の額の限度において」）、である。\n効果は、1 代償である権利の移転、又は2 代償である利益の償還であり、いずれも⟪債権者が受けた損害の額を上限とする⟫。履行不能を契機として債権者が損害を超える利得をすることは許されないからである。\n⟪債務者に免責事由があることは要件ではない⟫と解する。したがって、債務者の責めに帰すべき事由によって履行が不能となった場合にも、債権者は、履行に代わる損害賠償の請求（415条2項1号）と代償請求権のいずれを行使してもよい。債権者が代償請求権を行使して利益を得たときは、その限度で損害賠償請求権が⟪縮減⟫する。","answers":["同一の原因","代償である権利又は利益","その受けた損害の額の限度","422条の2","債務者に免責事由があることは要件ではない","縮減"],"check":"","notes":[{"n":1,"label":"最判 昭和41・12・23","case":"最判 昭和41・12・23（民集20巻10号2211頁）**代償請求権**","gist":"「一般に履行不能を生ぜしめたと同一の原因によって、債務者が履行の目的物の代償と考えられる利益を取得した場合には、公平の観念にもとづき、債権者において債務者に対し、右履行不能により**債権者が**蒙りたる損害の限度において、その利益の償還を請求する権利を認めるのが相当であり、民法五三六条二項但書の規定は、この法理のあらわれである」。**火災保険金も代償にあたる**"}],"law":"","cites":["民法/422の2","民法/415"],"rate":29,"designed":true,"ref":false,"hash":"49255c8115ba"}],"setsurei":["中古車販売業者Ａは、Ｂとの間で、Ａが展示していた中古自動車甲（特定物）を代金200万円で売る契約を結んだ。代金は引渡しと引換えに支払う約定である。約定の引渡期日、ＡはＢの自宅に甲を運んで引渡しを申し出たが、Ｂは「駐車場の手配が済んでいない」として受領を拒んだ。Ａはやむなく甲を自社の屋外駐車場に持ち帰り、他の在庫車両と同様に施錠して保管していた。その2週間後、想定を超える規模の地震に伴う津波によって同駐車場が浸水し、甲は流失した（Ａ・Ｂのいずれにも帰責事由はない）。Ａは、再度の運搬費用と2週間分の保管費用として合計5万円を余分に支出している。 (1) Ａは、Ｂに対し、代金200万円の支払を請求することができるか。 (2) Ａは、Ｂに対し、5万円を請求することができるか。 (3) Ｂは、甲の引渡しを受けられないことを理由に、売買契約を解除することができるか。","製材業者Ｘは、家具メーカーＹとの間で、契約期間1年の間にＸが自己の山林から伐採する木材の全量をＹに継続的に売り渡す旨の契約を結んだ。**代金はＹが四半期ごとに前払いする約定**である。Ｙの増産要請に応じてＸは重機を新たに導入し伐採を進めたが、Ｙは開始半年後に市況の悪化を理由として引取りを拒絶し、Ｘは伐採済みの木材を自社倉庫に保管し続けた。Ｙは、前払いの約定に従い、この木材の代金600万円を既にＸに支払っている。 (1) Ｘは、Ｙが引取りを拒絶したことを理由に、契約を解除し、損害賠償を請求することができるか。 (2) その後、Ｙが引取拒絶を撤回して改めて受領する意思を表示したが、Ｘが引渡しの準備をしている間に、隣接工場の従業員Ｚの過失による失火で倉庫が延焼し、木材は全焼した（Ｘの保管に落ち度はない）。ＸはＺに対し、800万円の不法行為に基づく損害賠償請求権を取得した。木材の価額は600万円である。Ｙは、Ｘに対し、この請求権の移転を請求することができるか。"],"full":"受領遅滞が認められるためには、1 債務者が⟪債務の本旨に従った履行の提供⟫をしたこと、2 債権者が債務の履行を⟪受けることを拒み⟫、又は受けることができないこと、が必要である。2 は413条1項の文言そのものであり、1 は同項が効果の起算点を「履行の提供をした時から」と定めていることの前提である。1 の履行の提供の意義は、⟪弁済の提供⟫（492条・493条）と同じである。\n\n(1) 債務の目的が特定物の引渡しであるときは、債務者は、履行の提供をした時からその引渡しをするまで、⟪自己の財産に対するのと同一の注意⟫をもってその物を保存すれば足りる（413条1項）。本来の保存義務が⟪善良な管理者の注意⟫（400条）であるところ、受領遅滞後の債務者は他人の物を無償で保管しているに等しいから、その程度が軽減される。\n(2) 受領を拒み、又は受けることができないことによって履行の費用が増加したときは、その増加額は⟪債権者の負担⟫となる（413条2項）。再度の運搬費用・目的物の保管費用がこれにあたる。\n(3) 履行の提供があった時以後に、当事者双方の責めに帰することができない事由によって履行が不能となったときは、その履行の不能は⟪債権者の責めに帰すべき事由⟫によるものとみなされる（⟪413条の2第2項⟫）。本旨に従った履行の提供をした債務者に不能のリスクを負わせるのは相当でないからである。\nその結果、債権者は反対給付の履行を⟪拒むことができず⟫（536条2項前段）、履行不能を理由として契約を解除することもできない（543条）。もっとも、債務者は、自己の債務を免れたことによって利益を得たときは、これを債権者に償還しなければならない（536条2項後段の⟪類推適用⟫）。\n(4) 売買においては、売主が契約の内容に適合する目的物をもって引渡債務の履行を提供したにもかかわらず買主が受領しなかった場合、その提供があった時以後に双方無責の事由により目的物が滅失し又は損傷したときは、買主は、これを理由として履行の追完の請求・代金減額の請求・損害賠償の請求及び契約の解除をすることができず、代金の支払を拒むこともできない（567条2項・1項）。\n⚠️ (3)(4)はいずれも「⟪債務者が保存義務を尽くしていること⟫」が前提である。債務者が413条1項の軽減された注意義務にすら違反した結果として履行が不能となったときは、「債務者の責めに帰すべき事由」による履行不能であるから、債権者は損害賠償を請求し（415条1項）、契約を解除し（542条1項1号）、反対給付の履行を拒むことができる。\n\n⦅債権者は、原則として⟪受領義務を負わない⟫から、債務者は、受領遅滞それ自体を理由として損害賠償を請求し、又は契約を解除することはできないと解する⦆⟨1⟩。債権はあくまで⟪権利であって義務ではなく⟫、413条も債務者の保存義務の軽減と増加費用の債権者負担を定めるにとどまるからである。\nもっとも、⦅契約の趣旨に照らし、⟪債権者の協力⟫なくしては債務の履行を完了することができず、かつ債務者が⟪履行の準備に相当の努力⟫を費やしたなど⟪取引の特殊性⟫が認められる場合には、⟪信義則⟫上、債権者は目的物を⟪引き取る義務⟫を負うと解する⦆⟨2⟩。この場合、引取義務の違反は債務不履行であるから、債務者は、損害賠償を請求し（415条1項）、又は契約を解除することができる（541条・542条）。\n\n債務者がその債務について遅滞の責任を負っている間に、当事者双方の責めに帰することができない事由によって履行が不能となったときは、その履行の不能は、⟪債務者の責めに帰すべき事由⟫によるものとみなされる（⟪413条の2第1項⟫）。債務者は⟪履行期に給付をすることができたはず⟫だからである。\n\n⦅債務者が、その債務の履行が不能となったのと⟪同一の原因⟫により債務の目的物の⟪代償である権利又は利益⟫を取得したときは、債権者は、⟪その受けた損害の額の限度⟫において、債務者に対し、その権利の移転又はその利益の償還を請求することができる⦆⟨1⟩（⟪422条の2⟫）。\n要件は、1 債務の履行が不能となったこと、2 債務者が債務の目的物の代償である権利又は利益を取得したこと、3 それが履行不能と同一の原因によること、4 債権者に代償以上の損害が生じたこと（「その受けた損害の額の限度において」）、である。\n効果は、1 代償である権利の移転、又は2 代償である利益の償還であり、いずれも⟪債権者が受けた損害の額を上限とする⟫。履行不能を契機として債権者が損害を超える利得をすることは許されないからである。\n⟪債務者に免責事由があることは要件ではない⟫と解する。したがって、債務者の責めに帰すべき事由によって履行が不能となった場合にも、債権者は、履行に代わる損害賠償の請求（415条2項1号）と代償請求権のいずれを行使してもよい。債権者が代償請求権を行使して利益を得たときは、その限度で損害賠償請求権が⟪縮減⟫する。","kata":"| # | 落としてはいけない要素 | ランクAの合格ライン |\n|---|---|---|\n| 1 | 要件＝**本旨に従った履行の提供**＋**受領拒絶・受領不能**（413条1項） | 両方＋条文の項 |\n| 2 | 提供の意義は492条・493条と同じ | 条文2つ |\n| 3 | 保存義務の軽減＝**善管注意（400条）→自己の財産に対するのと同一の注意**（413条1項） | 400条との対比まで |\n| 4 | 「**軽減された義務すら尽くしていなければ債務者の責めに帰すべき事由になる**」という留保 | **落としたら3以下** |\n| 5 | 増加費用は債権者負担（413条**2項**）。再運搬費・保管費 | 項番号まで |\n| 6 | 受領遅滞中の双方無責の不能＝**債権者**の帰責事由と**みなす**（413条の2**第2項**） | 項番号＋「みなす」 |\n| 7 | その帰結＝536条2項**前段**（反対給付を拒めない）／**543条**（解除できない）／536条2項**後段**（利益の償還） | 3つのうち2つ以上 |\n| 8 | 売買の特則＝567条**2項**（追完・減額・賠償・解除不可、代金支払も拒めない） | 条文の項 |\n| 9 | 履行遅滞中の双方無責の不能＝**債務者**の帰責事由と**みなす**（413条の2**第1項**） | 6と方向が逆であること |\n| 10 | 受領義務は**原則否定**（債権は権利であって義務ではない／413条は2つの効果しか書いていない） | 理由付けまで |\n| 11 | **例外＝信義則上の引取義務**→415条・541条・542条 | 例外の分岐条件まで |\n| 12 | 代償請求権の要件＝**履行不能・代償の取得・同一の原因**（422条の2）＋**代償以上の損害の発生**（「その受けた損害の額の限度において」） | 前3つ全部で合格。4つ目まで出れば満点 |\n| 13 | 効果＝権利の移転 or 利益の償還、**債権者の受けた損害の額が上限** | 上限を落としたら3以下 |\n| 14 | 免責事由は**不要**（損害賠償と選択できる） | Aでは必須 |\n\n**勝負どころ**：\n\n1. **条文が答えた効果と、答えなかった効果を切り分けられるか。** 改正後の答案で「法定責任説か債務不履行責任説か」を漫然と書き出すのは、**旧法の答案**。書くのは受領義務（＝解除・損害賠償の可否）が問題になる場面だけ。\n2. **413条1項は「義務の消滅」ではなく「義務の軽減」だと分かっているか。** 軽減された注意義務の違反を検討する段を飛ばすと、413条の2第2項も567条2項も当然には効かない。H30採点実感が「善管注意義務を負う前提で検討した上で……自己の財産と同一の注意義務を負う前提で改めて検討するのが丁寧」と言っているのはここ。\n3. **413条の2の1項と2項で「誰の帰責事由とみなすか」が逆であること。** 1項＝債務者遅滞→**債務者**／2項＝債権者受領遅滞→**債権者**。\n4. **代償請求権の「損害の額の限度」を必ず書くこと。** 代償の額＞損害の額のとき、差額は債務者に残る。\n\n> ⚠️ **間違えやすい点**：\n> - **旧534条（債権者主義）を書いてしまう。** 534条・535条は**削除済み**（条文DBで確認）。特定物売買でも、契約後・引渡し前の双方無責の滅失なら536条1項で買主は代金の支払を拒める。**H27〜R1の過去問・採点実感は旧法なので、そのまま写すと致命傷。**\n> - **413条の2第2項と536条2項を混同する。** 413条の2第2項は「不能を債権者の帰責事由**によるものとみなす**」というルールで、そこから**536条2項前段が適用される**という二段構造。いきなり536条2項を持ち出すと、なぜ債権者の帰責事由になるのかが飛ぶ。\n> - **413条の2第1項で因果関係まで擬制してしまう。** 「遅滞していなくても不能になっていた」ときは因果関係がなく、債務者は免責される（不文のただし書）。\n> - **567条2項を種類物にそのまま使う。** 「売買の目的として**特定したもの**に限る」（567条1項括弧書）。種類物では401条2項の特定が先決問題。\n> - **受領遅滞の効果として「同時履行の抗弁が奪われる」と書く。** 民法は同時履行の抗弁権の排除規定を**あえて置かなかった**ので、受領遅滞に陥った債権者も、後日の反対債務の履行請求に対して同時履行の抗弁を主張でき、裁判所は引換給付判決を出すべきである（プラクティス 紙面p.296 memo57／DB p0313）。**同時履行の抗弁を失わせるのは「弁済の提供」の効果であって、受領遅滞の効果ではない**——両者を混ぜない。\n> - **昭41・12・23判決の「536条2項但書」をそのまま書く。** 現行法では**536条2項後段**（しかも直接適用ではなく**類推適用**）。代償請求権自体は422条の2で明文化されたので、答案では422条の2を根拠にする。**なお「536条2項但書はこの法理のあらわれ」という判旨の根拠づけ自体、百選Ⅱ〔第8版〕10番解説が「不適当であった」と否定している**ので、自分の理由付けには使わない。\n> - **代償請求権を求めたいのに、先に解除してしまう。**「設例のBは、契約の解除をして自らの代金債務を消滅させることができる（542Ⅰ①）。しかし、**先に解除権を行使してしまうと、もはや代償請求権を行使することができない、と解すべきである**」（民法演習サブノート210問 問83 解説1・紙面p.165〜166）。**債務者が無責で履行不能になった場面では、解除と代償請求のどちらを選ぶかを先に決める**（代償の額が大きければ解除しない）。","hanrei":[["最判 昭和40・12・3（民集19巻9号2090頁）","「債務者の債務不履行と債権者の受領遅滞とは、その性質が異なるのであるから、一般に後者に前者と全く同一の効果を認めることは民法の予想していないところというべきである」として、**受領遅滞を理由とする契約解除を否定**","判例百選収録リストに掲載なし（grep確認済み）。**この判決について「改正後も先例価値がある」と明言した記述はDBに見当たらない**（百選解説が先例価値を論じているのは昭46・12・16のほう）。もっとも百選解説は改正法が受領義務について「解釈に委ねられたまま」とし、アガルートは現行413条の下では同条により一般論として受領義務を肯定することは難しくなったとするので、**原則否定の方向は維持されていると読める**（`[カニの推論]`。百選Ⅱ〔第9版〕判例49解説5・アガルート 紙面p.202）"],["最判 昭和46・12・16（民集25巻9号1472頁）**硫黄鉱石事件**","契約期間を通じてＸが採掘する鉱石の**全量**が売買の目的とされ、継続的に供給すべきものであるから、「信義則に照らして考察するときは」Ｙはこれを引き取り代金を支払うべき法律関係が存在していたとして、**買主の引取義務を肯定**","**民法判例百選Ⅱ 債権〔第9版〕49番**（〔第8版〕では55番）。百選解説は「一般論として受領義務は肯定しておらず、原則は……受領義務否定だが、例外的に本件のような事例に限り信義則上受領義務を認めた判決と評価すべき」とし、「**改正後も、本判決の先例価値が認められる**」とする"],["最判 昭和41・12・23（民集20巻10号2211頁）**代償請求権**","「一般に履行不能を生ぜしめたと同一の原因によって、債務者が履行の目的物の代償と考えられる利益を取得した場合には、公平の観念にもとづき、債権者において債務者に対し、右履行不能により**債権者が**蒙りたる損害の限度において、その利益の償還を請求する権利を認めるのが相当であり、民法五三六条二項但書の規定は、この法理のあらわれである」。**火災保険金も代償にあたる**","**民法判例百選Ⅱ 債権〔第8版〕10番**（**〔第9版〕では削除されており、新版の番号は存在しない**。ただし**第8版の解説本文はDBに現存**：`CorpusDb/判例/民法判例百選Ⅱ 債権［第8版］/p0034.txt`・`p0035.txt`／田中宏治）。**※改正により前提が一部変わった**——判旨が引く「536条2項**但書**」は現行では536条2項**後段**であり、代償請求権自体は**422条の2で明文化**されたので、答案の根拠条文は422条の2。⚠️ **判旨の根拠づけ（「536条2項但書はこの法理のあらわれ」）は、同解説が「成功していない」「不適当であった」と明示的に否定し、「現在の裁判実務においては本判決が先例として機能している、とは言い難い」「控え目に扱うべき」とする。**したがって**この根拠づけを自分の理由付けとして書かない**。他方、**原判決の「債務者の責に帰すべき事由の存しない限り」という限定を判旨が取り込まなかった**点は、同解説3(1)も「ⓐ履行不能は、債務者の帰責事由を問わないものとして判示されている」と述べており、**免責事由不要説の根拠としては使える**"],["最判 昭和44・5・1（民集23巻6号935頁）","債権者の受領拒絶の意思が明確な場合であっても、**弁済の提供をしない限り**、債務者は債務不履行を理由とする損害賠償責任や契約の解除を免れない","出典＝プラクティス 紙面p.292／DB p0309。**受領遅滞を論じる前に「提供があったか」を必ず確認せよ**という趣旨で引く"],["最判 平成19・3・8（民集61巻2号479頁）","侵害利得の局面で、受益者が第三者に目的物を売却して得た売買代金について不当利得返還請求の対象となることを認めた","出典＝プラクティス 紙面p.76／DB p0093。**二重譲渡での第2買主からの売買代金が「代償」にあたるか**を論じる際の傍証として引かれる（代償請求権の判例ではない）"]],"field":"債務不履行・損害賠償","order":27},{"name":"将来債権譲渡（466条の6）","subject":"民法","rank":"A","path":"まとめ/民法/論証/将来債権譲渡（466条の6）.md","cards":[{"id":"民法/将来債権譲渡（466条の6）#1","block":"第1〔原則——未発生でよい／当然取得〕","kind":"cloze","masked":"債権の譲渡は、その意思表示の時に債権が⟦ア⟧（⟦イ⟧）。そして、譲渡の意思表示の時に債権が現に発生していないときであっても、譲受人は、発生した債権を⟦ウ⟧する（同条2項）。譲受人が債権を取得するために、⟦エ⟧。","body":"債権の譲渡は、その意思表示の時に債権が⟪現に発生していることを要しない⟫（⟪466条の6第1項⟫）。そして、譲渡の意思表示の時に債権が現に発生していないときであっても、譲受人は、発生した債権を⟪当然に取得⟫する（同条2項）。譲受人が債権を取得するために、⟪譲渡人の特段の行為は必要でない⟫。","answers":["現に発生していることを要しない","466条の6第1項","当然に取得","譲渡人の特段の行為は必要でない"],"check":"","notes":[],"law":"","cites":["民法/466の6"],"rate":36,"designed":true,"ref":true,"hash":"3adcf991117a"},{"id":"民法/将来債権譲渡（466条の6）#2","block":"第2〔有効性の限界〕","kind":"cloze","masked":"もっとも、無限定に効力を認めることはできないから、次の限界がある。\n⟪(1) 特定性⟫——⦅譲渡の目的とされる債権は、その⟦ア⟧等をもって特定される必要がある⦆⟨1⟩。将来の一定期間内に発生し、又は弁済期が到来すべきいくつかの債権を譲渡の目的とする場合には、適宜の方法によりその期間の⟦イ⟧を明確にするなどして、譲渡の目的とされる債権が特定されるべきである。\n⟪(2) 発生可能性は要件でない⟫——⦅これに対し、契約締結時において⟦ウ⟧ことは、契約の効力を⟦エ⟧⦆⟨2⟩。当事者は、債権の発生の基礎をなす事情をしんしゃくして債権発生の可能性の程度を考慮したうえ、債権が見込みどおり発生しなかった場合に譲受人に生ずる不利益は⟦オ⟧により清算することとして、契約を締結するものとみるべきだからである。\n⟪(3) ⟦キ⟧⟫——ただし、契約締結時における譲渡人の資産状況、当時における譲渡人の営業等の推移に関する見込み、契約内容、契約が締結された経緯等を総合的に考慮し、期間の長さ等の契約内容が譲渡人の営業活動等に対して社会通念に照らし⟦カ⟧する制限を加え、又は他の債権者に不当な不利益を与えるものであるとみられるなどの⟪特段の事情⟫が認められる場合には、⦅当該契約は⟦キ⟧に反するなどとして、その効力の全部又は一部が否定される⦆⟨3⟩（⟦ク⟧）。","body":"もっとも、無限定に効力を認めることはできないから、次の限界がある。\n⟪(1) 特定性⟫——⦅譲渡の目的とされる債権は、その⟪発生原因や譲渡に係る額⟫等をもって特定される必要がある⦆⟨1⟩。将来の一定期間内に発生し、又は弁済期が到来すべきいくつかの債権を譲渡の目的とする場合には、適宜の方法によりその期間の⟪始期と終期⟫を明確にするなどして、譲渡の目的とされる債権が特定されるべきである。\n⟪(2) 発生可能性は要件でない⟫——⦅これに対し、契約締結時において⟪債権発生の可能性が低かった⟫ことは、契約の効力を⟪当然に左右するものではない⟫⦆⟨2⟩。当事者は、債権の発生の基礎をなす事情をしんしゃくして債権発生の可能性の程度を考慮したうえ、債権が見込みどおり発生しなかった場合に譲受人に生ずる不利益は⟪譲渡人の契約上の責任の追及⟫により清算することとして、契約を締結するものとみるべきだからである。\n⟪(3) 公序良俗⟫——ただし、契約締結時における譲渡人の資産状況、当時における譲渡人の営業等の推移に関する見込み、契約内容、契約が締結された経緯等を総合的に考慮し、期間の長さ等の契約内容が譲渡人の営業活動等に対して社会通念に照らし⟪相当とされる範囲を著しく逸脱⟫する制限を加え、又は他の債権者に不当な不利益を与えるものであるとみられるなどの⟪特段の事情⟫が認められる場合には、⦅当該契約は⟪公序良俗⟫に反するなどとして、その効力の全部又は一部が否定される⦆⟨3⟩（⟪90条⟫）。","answers":["発生原因や譲渡に係る額","始期と終期","債権発生の可能性が低かった","当然に左右するものではない","譲渡人の契約上の責任の追及","相当とされる範囲を著しく逸脱","公序良俗","90条"],"check":"","notes":[{"n":1,"label":"最三小判 平成11・1・29","case":"**最三小判 平成11・1・29** 民集53-1-151","gist":"将来債権譲渡は、①発生原因や額等（期間型なら始期と終期）による**特定**が必要、②契約時の**債権発生の可能性が低いことは効力を当然に左右しない**（不発生のリスクは譲渡人の契約上の責任の追及により清算）、③もっとも営業活動への著しい制限・他の債権者への不当な不利益といった**特段の事情**があれば公序良俗違反として効力の全部又は一部が否定される"},{"n":2,"label":"最三小判 平成11・1・29","case":"**最三小判 平成11・1・29** 民集53-1-151","gist":"将来債権譲渡は、①発生原因や額等（期間型なら始期と終期）による**特定**が必要、②契約時の**債権発生の可能性が低いことは効力を当然に左右しない**（不発生のリスクは譲渡人の契約上の責任の追及により清算）、③もっとも営業活動への著しい制限・他の債権者への不当な不利益といった**特段の事情**があれば公序良俗違反として効力の全部又は一部が否定される"},{"n":3,"label":"最三小判 平成11・1・29","case":"**最三小判 平成11・1・29** 民集53-1-151","gist":"将来債権譲渡は、①発生原因や額等（期間型なら始期と終期）による**特定**が必要、②契約時の**債権発生の可能性が低いことは効力を当然に左右しない**（不発生のリスクは譲渡人の契約上の責任の追及により清算）、③もっとも営業活動への著しい制限・他の債権者への不当な不利益といった**特段の事情**があれば公序良俗違反として効力の全部又は一部が否定される"}],"law":"","cites":["民法/90"],"rate":0,"designed":true,"ref":false,"hash":"6d49247c9600"},{"id":"民法/将来債権譲渡（466条の6）#3","block":"第3〔対抗要件〕","kind":"cloze","masked":"⦅将来債権の譲渡についても、既に発生している債権の譲渡と同様、⟦ア⟧対抗要件を具備することができる⦆⟨1⟩。すなわち、譲渡人が債務者に⟦イ⟧をし、又は債務者が⟦ウ⟧をすれば債務者に対抗することができ（467条1項括弧書は「現に発生していない債権の譲渡を含む」と定める）、その通知又は承諾が⟦エ⟧によってされれば債務者以外の第三者に対抗することができる（同条2項）。⟦オ⟧。","body":"⦅将来債権の譲渡についても、既に発生している債権の譲渡と同様、⟪譲渡の時点で⟫対抗要件を具備することができる⦆⟨1⟩。すなわち、譲渡人が債務者に⟪通知⟫をし、又は債務者が⟪承諾⟫をすれば債務者に対抗することができ（467条1項括弧書は「現に発生していない債権の譲渡を含む」と定める）、その通知又は承諾が⟪確定日付のある証書⟫によってされれば債務者以外の第三者に対抗することができる（同条2項）。⟪債権が現実に発生するのを待つ必要はない⟫。","answers":["譲渡の時点で","通知","承諾","確定日付のある証書","債権が現実に発生するのを待つ必要はない"],"check":"","notes":[{"n":1,"label":"最一小判 平成13・11・22","case":"**最一小判 平成13・11・22** 民集55-6-1056","gist":"集合債権譲渡担保では、既発生・将来発生の債権が**確定的に譲渡**されており、467条2項の方法で第三者対抗要件を具備できる。取立権限の行使への協力を依頼する記載があっても対抗要件の効果を妨げない"}],"law":"","cites":["民法/467"],"rate":28,"designed":true,"ref":false,"hash":"9943fa10d844"},{"id":"民法/将来債権譲渡（466条の6）#4","block":"第4〔譲渡制限の意思表示との先後〕","kind":"cloze","masked":"譲渡人が通知をし、又は債務者が承諾をした時（対抗要件具備時）⟦ア⟧譲渡制限の意思表示がされたときは、譲受人その他の第三者は⟦イ⟧、債務者は、その債務の⟦ウ⟧ことができ、かつ、譲渡人に対する弁済その他の債務を消滅させる事由をもってその第三者に対抗することができる（⟦エ⟧・466条3項）。これに対し、⟪対抗要件具備の後に⟫譲渡制限の意思表示がされたときは、債務者は、これを譲受人に⟦オ⟧。","body":"譲渡人が通知をし、又は債務者が承諾をした時（対抗要件具備時）⟪までに⟫譲渡制限の意思表示がされたときは、譲受人その他の第三者は⟪そのことを知っていたものとみなされ⟫、債務者は、その債務の⟪履行を拒む⟫ことができ、かつ、譲渡人に対する弁済その他の債務を消滅させる事由をもってその第三者に対抗することができる（⟪466条の6第3項⟫・466条3項）。これに対し、⟪対抗要件具備の後に⟫譲渡制限の意思表示がされたときは、債務者は、これを譲受人に⟪対抗することができない⟫。","answers":["までに","そのことを知っていたものとみなされ","履行を拒む","466条の6第3項","対抗することができない"],"check":"","notes":[],"law":"","cites":["民法/466の6","民法/466"],"rate":52,"designed":true,"ref":true,"hash":"767c7db29aa6"}],"setsurei":["Ｇは診療所を経営する医師である。Ｇは、Ａから5000万円の融資を受けるにあたり、その担保として、Ａとの間で、契約日から5年間にＧが社会保険診療報酬支払基金Ｓから支払を受けるべき診療報酬債権（月額約100万円・5年間で合計約6000万円）をＡに譲渡する旨の契約を締結し、同日、確定日付のある内容証明郵便でＳに通知した。通知は翌日Ｓに到達した。 契約から3年が経過した時点で、Ｇに対して債権を有するＢが、その月に発生するＧのＳに対する診療報酬債権100万円を差し押さえ、差押命令がＳに送達された。 **(1)** ＡとＢのいずれが優先するか。 **(2)** かりにＡＧ間の契約が「譲渡」ではなく「Ｇが弁済を怠ったときはＡの予約完結の意思表示によって当該債権をＡに譲渡する」という**債権譲渡の予約**であり、予約締結の段階で確定日付のある証書によってＳに通知していた場合はどうか（予約完結権の行使はＢの差押えの後であったとする）。","Ｄは自己所有の乙建物をＥに賃貸し、Ｅに引き渡してその利用に供させている（Ｅは借地借家法31条の対抗要件を備えている）。Ｄは、Ｆに対し、ＤＥ間の賃貸借契約から生じる向こう3年間の賃料債権（月額20万円・合計720万円）を譲渡し、確定日付のある内容証明郵便でＥに通知した。通知はＥに到達した。 その半年後、Ｄは乙建物をＨに譲渡し、Ｈへの所有権移転登記がされた。 **(1)** Ｈが所有権を取得した後に発生する賃料債権は、ＦとＨのいずれに帰属するか。 **(2)** ＦがＥに賃料の支払を求めたところ、Ｅは「通知が届いた後にＤとの間で本件賃料債権を譲渡しない旨の特約をした」と主張して支払を拒んでいる。Ｅの主張は認められるか。かりにその特約が**通知の到達前に**されていた場合はどうか。"],"full":"債権の譲渡は、その意思表示の時に債権が⟪現に発生していることを要しない⟫（⟪466条の6第1項⟫）。そして、譲渡の意思表示の時に債権が現に発生していないときであっても、譲受人は、発生した債権を⟪当然に取得⟫する（同条2項）。譲受人が債権を取得するために、⟪譲渡人の特段の行為は必要でない⟫。\n\nもっとも、無限定に効力を認めることはできないから、次の限界がある。\n⟪(1) 特定性⟫——⦅譲渡の目的とされる債権は、その⟪発生原因や譲渡に係る額⟫等をもって特定される必要がある⦆⟨1⟩。将来の一定期間内に発生し、又は弁済期が到来すべきいくつかの債権を譲渡の目的とする場合には、適宜の方法によりその期間の⟪始期と終期⟫を明確にするなどして、譲渡の目的とされる債権が特定されるべきである。\n⟪(2) 発生可能性は要件でない⟫——⦅これに対し、契約締結時において⟪債権発生の可能性が低かった⟫ことは、契約の効力を⟪当然に左右するものではない⟫⦆⟨2⟩。当事者は、債権の発生の基礎をなす事情をしんしゃくして債権発生の可能性の程度を考慮したうえ、債権が見込みどおり発生しなかった場合に譲受人に生ずる不利益は⟪譲渡人の契約上の責任の追及⟫により清算することとして、契約を締結するものとみるべきだからである。\n⟪(3) 公序良俗⟫——ただし、契約締結時における譲渡人の資産状況、当時における譲渡人の営業等の推移に関する見込み、契約内容、契約が締結された経緯等を総合的に考慮し、期間の長さ等の契約内容が譲渡人の営業活動等に対して社会通念に照らし⟪相当とされる範囲を著しく逸脱⟫する制限を加え、又は他の債権者に不当な不利益を与えるものであるとみられるなどの⟪特段の事情⟫が認められる場合には、⦅当該契約は⟪公序良俗⟫に反するなどとして、その効力の全部又は一部が否定される⦆⟨3⟩（⟪90条⟫）。\n\n⦅将来債権の譲渡についても、既に発生している債権の譲渡と同様、⟪譲渡の時点で⟫対抗要件を具備することができる⦆⟨1⟩。すなわち、譲渡人が債務者に⟪通知⟫をし、又は債務者が⟪承諾⟫をすれば債務者に対抗することができ（467条1項括弧書は「現に発生していない債権の譲渡を含む」と定める）、その通知又は承諾が⟪確定日付のある証書⟫によってされれば債務者以外の第三者に対抗することができる（同条2項）。⟪債権が現実に発生するのを待つ必要はない⟫。\n\n譲渡人が通知をし、又は債務者が承諾をした時（対抗要件具備時）⟪までに⟫譲渡制限の意思表示がされたときは、譲受人その他の第三者は⟪そのことを知っていたものとみなされ⟫、債務者は、その債務の⟪履行を拒む⟫ことができ、かつ、譲渡人に対する弁済その他の債務を消滅させる事由をもってその第三者に対抗することができる（⟪466条の6第3項⟫・466条3項）。これに対し、⟪対抗要件具備の後に⟫譲渡制限の意思表示がされたときは、債務者は、これを譲受人に⟪対抗することができない⟫。","kata":"","hanrei":[["**最三小判 平成11・1・29** 民集53-1-151","将来債権譲渡は、①発生原因や額等（期間型なら始期と終期）による**特定**が必要、②契約時の**債権発生の可能性が低いことは効力を当然に左右しない**（不発生のリスクは譲渡人の契約上の責任の追及により清算）、③もっとも営業活動への著しい制限・他の債権者への不当な不利益といった**特段の事情**があれば公序良俗違反として効力の全部又は一部が否定される","**民法判例百選Ⅱ 債権〔第9版〕22番**（第8版では26番。`判例百選_版対応表.md` で対応確認）。8年3か月分の診療報酬債権譲渡を有効とした。466条の6第1項はこの法理を明文化したもの（百選解説）"],["**最一小判 平成13・11・22** 民集55-6-1056","集合債権譲渡担保では、既発生・将来発生の債権が**確定的に譲渡**されており、467条2項の方法で第三者対抗要件を具備できる。取立権限の行使への協力を依頼する記載があっても対抗要件の効果を妨げない","**民法判例百選Ⅰ 総則・物権〔第9版〕98番**（第8版100番・第7版99番）。467条1項括弧書はこの旨を明文化したもの（百選Ⅱ22番解説）"],["**最判 平成13・11・27** 民集55-6-1090（**小法廷はDBで確認できなかったので「最判」とだけ書く**）","債権譲渡の**予約**につき確定日付のある証書で通知・承諾がされても、債務者は帰属が将来変更される可能性を了知するにとどまり帰属の変更を認識しないから、**予約完結による債権譲渡を第三者に対抗できない**","将来債権譲渡との決定的な違い。停止条件付債権譲渡も同じ扱い（プラクティス 紙面p.472）"],["**最判 平成19・2・15** 民集61-1-243","将来債権譲渡担保では、効果発生を留保する特段の付款のない限り契約時に確定的に譲渡されており、債権が将来発生したときは譲渡担保権者が設定者の**特段の行為を要することなく当然に**取得する。467条2項の方法で第三者対抗要件を具備できる","466条の6第2項「当然に取得する」に対応。**承継取得か原始取得かは明言していない**（プラクティス 紙面p.465）"],["**最判 平成12・4・21** 民集54-4-1562","集合債権譲渡の**予約**でも、**予約完結時**において譲渡対象債権を他の債権から識別できる程度に特定していれば足りる","特定の基準時が予約完結時である点に注意（プラクティス 紙面p.471）"],["**最一小判 昭和49・3・7** 民集28-2-174","467条の対抗要件制度は、**債務者の債権譲渡の有無についての認識を通じ、債務者によってそれが第三者に表示されうること**を根幹とする。二重譲渡の優劣は確定日付の先後ではなく**通知の到達時・承諾の日時**の先後による","**民法判例百選Ⅱ 債権〔第9版〕23番**。平13・11・27 が予約の対抗要件を否定した理由の基礎"],["**最判 昭和53・12・15** 裁判集民125-839（百選解説の表記では判時916号25頁）","1年分の診療報酬債権の譲渡を有効とした","平11判決が判旨（三）で「当該事案の事実関係の下において……判断したにとどまり、**一般的な基準を明らかにしたものとは解し難い**」と述べ、下級審の「1年ルール」を否定した"],["**大判 昭和9・12・28** 民集13-2261","合名会社に対する将来の残余財産分配請求権の譲渡につき、改正前から将来債権譲渡の有効性を認めていた","百選Ⅱ22番解説が引くもの。判決原文はDB未収録"],["最判 平成10・3・24 民集52-2-399","賃料債権に対する**差押えが効力を生じた後**に、債務者（建物所有者・賃貸人）が建物を譲渡して**賃貸人の地位が譲受人に移転した**場合、**譲受人は賃料債権の取得を差押債権者に対抗することができない**","出典＝`基礎法/民事/民事執行・保全法〔第６版〕` DB p0200〜p0201（民事執行法百選51）。**先行する債権把握が後の不動産譲受人に優先するという発想が判例上すでに現れている**ので、〔主〕説の実質的根拠・〔副〕説への反論に使える。限界事例として**賃借人自身への建物譲渡で賃貸借が終了した場合は取立て不可**（最判平24・9・4・同ページ）"]],"field":"債権譲渡","order":30},{"name":"弁済による代位_混合共同抵当と後順位抵当権者","subject":"民法","rank":"A","path":"まとめ/民法/論証/弁済による代位_混合共同抵当と後順位抵当権者.md","cards":[{"id":"民法/弁済による代位_混合共同抵当と後順位抵当権者#1","block":"第1〔物上保証人の法定代位〕","kind":"cloze","masked":"物上保証人は、自己の所有不動産に対する抵当権の実行により被担保債権を消滅させた場合、債務者に対して求償権を取得するとともに、債務者のために弁済をした者として当然に債権者に代位する（⟦ア⟧）。そして、代位者は、⟦イ⟧に限り、債権者が有していた債権および担保権を行使することができる（⟦ウ⟧）。\nしたがって、物上保証人は、求償権の範囲で、⟦エ⟧を行使することができる。","body":"物上保証人は、自己の所有不動産に対する抵当権の実行により被担保債権を消滅させた場合、債務者に対して求償権を取得するとともに、債務者のために弁済をした者として当然に債権者に代位する（⟪499条⟫）。そして、代位者は、⟪自己の求償権の範囲内⟫に限り、債権者が有していた債権および担保権を行使することができる（⟪501条1項・2項⟫）。\nしたがって、物上保証人は、求償権の範囲で、⟪債務者所有不動産上の1番抵当権⟫を行使することができる。","answers":["499条","自己の求償権の範囲内","501条1項・2項","債務者所有不動産上の1番抵当権"],"check":"求償権の取得／**当然の代位＝499条**／範囲は求償権の範囲内＝**501条1項・2項** ／ 499条・501条2項（**500条と書いたら誤り**）","notes":[],"law":"","cites":["民法/499","民法/501"],"rate":21,"designed":true,"ref":true,"hash":"de67d7fd4f1f"},{"id":"民法/弁済による代位_混合共同抵当と後順位抵当権者#2","block":"第2〔物上保証人 vs 債務者所有不動産の後順位抵当権者〕","kind":"cloze","masked":"もっとも、債務者所有不動産には、被担保債権の消滅による1番抵当権の消滅を前提として⟦ア⟧する後順位抵当権者が存在しうる。\nしかし、物上保証人は、⟦イ⟧で、他の共同抵当物件から自己の⟦ウ⟧を得ることを期待していたのであり、その期待は、⟦エ⟧によって失われるべきものではない。\n⦅よって、物上保証人の代位は、債務者所有不動産の⟦オ⟧すると解する⦆⟨1⟩。","body":"もっとも、債務者所有不動産には、被担保債権の消滅による1番抵当権の消滅を前提として⟪順位上昇を期待⟫する後順位抵当権者が存在しうる。\nしかし、物上保証人は、⟪共同抵当が設定された時点⟫で、他の共同抵当物件から自己の⟪求償権の満足⟫を得ることを期待していたのであり、その期待は、⟪共同抵当設定後に設定された後順位抵当権⟫によって失われるべきものではない。\n⦅よって、物上保証人の代位は、債務者所有不動産の⟪後順位抵当権者に優先⟫すると解する⦆⟨1⟩。","answers":["順位上昇を期待","共同抵当が設定された時点","求償権の満足","共同抵当設定後に設定された後順位抵当権","後順位抵当権者に優先"],"check":"物上保証人が優先／理由＝**共同抵当設定時からの期待**は後から付いた後順位抵当権で失われない ／ 「共同抵当設定の後に設定された後順位抵当権によって失われるべきではない」","notes":[{"n":1,"label":"最一小判昭和44・7・3","case":"最一小判昭和44・7・3 民集23巻8号1297頁","gist":"混合共同抵当で物上保証人所有不動産が先に実行された場合、物上保証人の弁済者代位は債務者所有不動産の後順位抵当権者に優先する。物上保証人の求償権回収の期待は、共同抵当設定後に設定された後順位抵当権によって失われるべきではない"}],"law":"","cites":[],"rate":0,"designed":true,"ref":false,"hash":"ca45613dbaef"},{"id":"民法/弁済による代位_混合共同抵当と後順位抵当権者#3","block":"第3〔物上保証人所有不動産の後順位抵当権者の保護〕","kind":"cloze","masked":"では、物上保証人所有不動産に後順位抵当権者がいる場合、その者はいかなる地位に立つか。原債権者に代位できるのは物上保証人自身であって、その後順位抵当権者が直接債権者に代位することはできないからである。\nしかし、後順位抵当権者は、物上保証人から抵当権の設定を受けた者であるから、⟦ア⟧するのは当然である。また、⟦イ⟧が後順位抵当権者の代位を認めて保護を図った趣旨にも照らすべきである。\nそこで、⦅物上保証人が代位取得した1番抵当権は、⟦ウ⟧するものとなり、後順位抵当権者は、あたかもその1番抵当権の上に⟦エ⟧により物上代位をするのと同様に、⟦オ⟧優先弁済を受けることができると解する⦆⟨1⟩。\n⦅なお、この優先弁済を受けるについて、後順位抵当権者による⟦カ⟧である⦆⟨2⟩。","body":"では、物上保証人所有不動産に後順位抵当権者がいる場合、その者はいかなる地位に立つか。原債権者に代位できるのは物上保証人自身であって、その後順位抵当権者が直接債権者に代位することはできないからである。\nしかし、後順位抵当権者は、物上保証人から抵当権の設定を受けた者であるから、⟪設定者である物上保証人がこれに劣後⟫するのは当然である。また、⟪392条2項後段⟫が後順位抵当権者の代位を認めて保護を図った趣旨にも照らすべきである。\nそこで、⦅物上保証人が代位取得した1番抵当権は、⟪後順位抵当権者の被担保債権をも担保⟫するものとなり、後順位抵当権者は、あたかもその1番抵当権の上に⟪372条・304条1項本文⟫により物上代位をするのと同様に、⟪その順位に従って⟫優先弁済を受けることができると解する⦆⟨1⟩。\n⦅なお、この優先弁済を受けるについて、後順位抵当権者による⟪登記・差押えは不要⟫である⦆⟨2⟩。","answers":["設定者である物上保証人がこれに劣後","392条2項後段","後順位抵当権者の被担保債権をも担保","372条・304条1項本文","その順位に従って","登記・差押えは不要"],"check":"直接代位は不可 →(a)**設定者は自分の抵当権者に劣後** ＋(b)**392条2項後段の趣旨** → 代位取得した1番抵当権の上に**372条・304条1項本文の物上代位と同様**／**登記・差押え不要** ／ 372条・304条1項本文／304条1項ただし書と対比","notes":[{"n":1,"label":"最三小判昭和53・7・4","case":"最三小判昭和53・7・4 民集32巻5号785頁","gist":"物上保証人所有不動産の後順位抵当権者は、物上保証人が代位取得した1番抵当権の上に、372条・304条1項本文により物上代位をするのと同様に、その順位に従い優先弁済を受けられる"},{"n":2,"label":"最三小判昭和53・7・4","case":"最三小判昭和53・7・4 民集32巻5号785頁","gist":"物上保証人所有不動産の後順位抵当権者は、物上保証人が代位取得した1番抵当権の上に、372条・304条1項本文により物上代位をするのと同様に、その順位に従い優先弁済を受けられる"}],"law":"","cites":["民法/392","民法/372","民法/304"],"rate":5,"designed":true,"ref":false,"hash":"9d4944d8163f"},{"id":"民法/弁済による代位_混合共同抵当と後順位抵当権者#4","block":"第4〔逆に債務者所有不動産が先に実行された場合〕","kind":"cloze","masked":"これに対し、債務者所有不動産の抵当権が先に実行された場合には、被担保債権が⟦イ⟧結果、⟦ア⟧により物上保証人所有不動産上の1番抵当権も⟦イ⟧。\nしたがって、債務者所有不動産の後順位抵当権者は、債権者に代位して物上保証人所有不動産上の1番抵当権を⟦ウ⟧、実行された不動産の⟦エ⟧から弁済を受けうるにとどまる。他方、物上保証人所有不動産の後順位抵当権者は、1番抵当権の消滅により⟦オ⟧する。","body":"これに対し、債務者所有不動産の抵当権が先に実行された場合には、被担保債権が消滅する結果、⟪付従性⟫により物上保証人所有不動産上の1番抵当権も⟪消滅する⟫。\nしたがって、債務者所有不動産の後順位抵当権者は、債権者に代位して物上保証人所有不動産上の1番抵当権を⟪行使することはできず⟫、実行された不動産の⟪売却代金の残額⟫から弁済を受けうるにとどまる。他方、物上保証人所有不動産の後順位抵当権者は、1番抵当権の消滅により⟪順位が上昇⟫する。","answers":["付従性","消滅する","行使することはできず","売却代金の残額","順位が上昇"],"check":"債務者所有不動産が先なら**付従性で1番抵当権が消滅** → 債務者側の後順位抵当権者は代位できない／物上保証人側の後順位抵当権者は順位上昇 ／ 付従性","notes":[],"law":"","cites":[],"rate":0,"designed":true,"ref":false,"hash":"bbc4494a1a96"}],"setsurei":["GはSに対し4000万円の貸金債権αを有し、これを担保するため、物上保証人D所有の甲土地（評価額5000万円）とS所有の乙土地（評価額3000万円）に共同抵当（G1番）が設定された。甲土地にはX1がDに対する2200万円の債権を担保するため2番抵当権の設定を受け、乙土地にはX2がSに対する1000万円の債権を担保するため2番抵当権の設定を受けている。 **甲土地（D所有）の抵当権が先に実行**され、Gは売却代金5000万円からα債権4000万円全額を回収した。D・X1・X2はそれぞれどのような地位に立つか。","GはSに対し4000万円の貸金債権αを有し、これを担保するため、物上保証人D所有の甲土地（評価額3000万円）とS所有の乙土地（評価額5000万円）に共同抵当（G1番）が設定された。甲土地にはX1がDに対する1000万円の債権を担保するため2番抵当権の設定を受け、乙土地にはX2がSに対する2200万円の債権を担保するため2番抵当権の設定を受けている。 **乙土地（S所有）の抵当権が先に実行**され、Gは売却代金5000万円からα債権4000万円全額を回収した。X1・X2はそれぞれどのような地位に立つか。"],"full":"物上保証人は、自己の所有不動産に対する抵当権の実行により被担保債権を消滅させた場合、債務者に対して求償権を取得するとともに、債務者のために弁済をした者として当然に債権者に代位する（⟪499条⟫）。そして、代位者は、⟪自己の求償権の範囲内⟫に限り、債権者が有していた債権および担保権を行使することができる（⟪501条1項・2項⟫）。\nしたがって、物上保証人は、求償権の範囲で、⟪債務者所有不動産上の1番抵当権⟫を行使することができる。\n\nもっとも、債務者所有不動産には、被担保債権の消滅による1番抵当権の消滅を前提として⟪順位上昇を期待⟫する後順位抵当権者が存在しうる。\nしかし、物上保証人は、⟪共同抵当が設定された時点⟫で、他の共同抵当物件から自己の⟪求償権の満足⟫を得ることを期待していたのであり、その期待は、⟪共同抵当設定後に設定された後順位抵当権⟫によって失われるべきものではない。\n⦅よって、物上保証人の代位は、債務者所有不動産の⟪後順位抵当権者に優先⟫すると解する⦆⟨1⟩。\n\nでは、物上保証人所有不動産に後順位抵当権者がいる場合、その者はいかなる地位に立つか。原債権者に代位できるのは物上保証人自身であって、その後順位抵当権者が直接債権者に代位することはできないからである。\nしかし、後順位抵当権者は、物上保証人から抵当権の設定を受けた者であるから、⟪設定者である物上保証人がこれに劣後⟫するのは当然である。また、⟪392条2項後段⟫が後順位抵当権者の代位を認めて保護を図った趣旨にも照らすべきである。\nそこで、⦅物上保証人が代位取得した1番抵当権は、⟪後順位抵当権者の被担保債権をも担保⟫するものとなり、後順位抵当権者は、あたかもその1番抵当権の上に⟪372条・304条1項本文⟫により物上代位をするのと同様に、⟪その順位に従って⟫優先弁済を受けることができると解する⦆⟨1⟩。\n⦅なお、この優先弁済を受けるについて、後順位抵当権者による⟪登記・差押えは不要⟫である⦆⟨2⟩。\n\nこれに対し、債務者所有不動産の抵当権が先に実行された場合には、被担保債権が消滅する結果、⟪付従性⟫により物上保証人所有不動産上の1番抵当権も⟪消滅する⟫。\nしたがって、債務者所有不動産の後順位抵当権者は、債権者に代位して物上保証人所有不動産上の1番抵当権を⟪行使することはできず⟫、実行された不動産の⟪売却代金の残額⟫から弁済を受けうるにとどまる。他方、物上保証人所有不動産の後順位抵当権者は、1番抵当権の消滅により⟪順位が上昇⟫する。","kata":"","hanrei":[["最一小判昭和44・7・3 民集23巻8号1297頁","混合共同抵当で物上保証人所有不動産が先に実行された場合、物上保証人の弁済者代位は債務者所有不動産の後順位抵当権者に優先する。物上保証人の求償権回収の期待は、共同抵当設定後に設定された後順位抵当権によって失われるべきではない","物上保証人優先の基礎判例。百選未収録"],["最三小判昭和53・7・4 民集32巻5号785頁","物上保証人所有不動産の後順位抵当権者は、物上保証人が代位取得した1番抵当権の上に、372条・304条1項本文により物上代位をするのと同様に、その順位に従い優先弁済を受けられる","物上代位類似構成の提示。百選未収録"],["最一小判昭和60・5・23 民集39巻4号940頁","上記を確認したうえ、物上保証人が債権者との間で代位権不行使特約を結んでいたとしても、後順位抵当権者の権利は左右されない","**判例百選Ⅰ〔第9版〕91番＝〔第8版〕94番**（解説：池田雅則・Ⅷ 抵当権）"],["最二小判平成4・11・6 民集46巻8号2625頁","共同抵当の目的不動産が同一の物上保証人に属する場合、実行された不動産の後順位抵当権者は392条2項後段に基づき他の不動産の先順位抵当権者に代位できる","**判例百選Ⅰ〔第9版〕92番＝〔第8版〕95番**（解説：清水恵介）。スコープ外だが混同しやすい"]],"field":"抵当権","order":17},{"name":"所有権留保_法的構成と第三者関係","subject":"民法","rank":"A","path":"まとめ/民法/論証/所有権留保_法的構成と第三者関係.md","cards":[{"id":"民法/所有権留保_法的構成と第三者関係#1","block":"第1","kind":"cloze","masked":"所有権留保とは、売買契約の特約により、買主が代金を完済するまで目的物の所有権を売主に留保する担保方法をいう。\nもっとも、その実質は売買代金債権の担保にあるから、売主が留保する所有権は⟦ア⟧に制限され、買主には代金完済により所有権を取得しうる⟦イ⟧が帰属すると解する。\n⟦ウ⟧である。所有権留保においては所有権が売主のもとに留まるだけで⟦エ⟧、178条の対抗要件を観念できないからである。","body":"所有権留保とは、売買契約の特約により、買主が代金を完済するまで目的物の所有権を売主に留保する担保方法をいう。\nもっとも、その実質は売買代金債権の担保にあるから、売主が留保する所有権は⟪担保の目的に必要な範囲⟫に制限され、買主には代金完済により所有権を取得しうる⟪物権的地位⟫が帰属すると解する。\n⟪対抗要件は不要⟫である。所有権留保においては所有権が売主のもとに留まるだけで⟪物権変動が存在せず⟫、178条の対抗要件を観念できないからである。","answers":["担保の目的に必要な範囲","物権的地位","対抗要件は不要","物権変動が存在せず"],"check":"","notes":[],"law":"","cites":["民法/178"],"rate":0,"designed":true,"ref":false,"hash":"5abd787ef6dd"},{"id":"民法/所有権留保_法的構成と第三者関係#2","block":"第2","kind":"cloze","masked":"買主が代金債務の履行を怠ったときは、売主は留保所有権に基づき目的物を引き揚げ、これを換価して⟦ア⟧して代金債権に充当することができる。\nもっとも、担保である以上、目的物の価額が残債権額を超えるときは、売主は超過額を買主に⟦イ⟧を負う。そして、⟦ウ⟧は、買主は残代金を支払って目的物を⟦エ⟧と解する。","body":"買主が代金債務の履行を怠ったときは、売主は留保所有権に基づき目的物を引き揚げ、これを換価して⟪他の債権者に優先⟫して代金債権に充当することができる。\nもっとも、担保である以上、目的物の価額が残債権額を超えるときは、売主は超過額を買主に⟪清算する義務⟫を負う。そして、⟪清算金の支払が完了するまで⟫は、買主は残代金を支払って目的物を⟪受け戻すことができる⟫と解する。","answers":["他の債権者に優先","清算する義務","清算金の支払が完了するまで","受け戻すことができる"],"check":"","notes":[],"law":"","cites":[],"rate":0,"designed":true,"ref":false,"hash":"87ba29a925e5"},{"id":"民法/所有権留保_法的構成と第三者関係#3","block":"第3","kind":"cloze","masked":"⦅留保所有権者が有する権原は、⟦ア⟧で異なる。すなわち、留保所有権者は、弁済期が到来するまでは目的物の⟦イ⟧するにとどまり、⟦ウ⟧が、弁済期の経過後は⟦エ⟧を取得する⦆⟨1⟩。\nそこで、⦅留保所有権者は、弁済期が到来するまでは、特段の事情がない限り、⟦オ⟧が、弁済期の経過後は、留保所有権が担保権の性質を有することを理由にこれらを免れることはないと解する⦆⟨2⟩。占有処分権能を有する以上、⟦カ⟧にあるといえるからである。\nただし、⦅不法行為責任は、⟦キ⟧にはじめて負う⦆⟨3⟩。留保所有権者に妨害の有無を一般的に調査すべき義務まで課すのは相当でないからである。","body":"⦅留保所有権者が有する権原は、⟪残債務の弁済期の到来の前後⟫で異なる。すなわち、留保所有権者は、弁済期が到来するまでは目的物の⟪交換価値を把握⟫するにとどまり、⟪占有・使用する権原を有しない⟫が、弁済期の経過後は⟪占有し、処分することができる権能⟫を取得する⦆⟨1⟩。\nそこで、⦅留保所有権者は、弁済期が到来するまでは、特段の事情がない限り、⟪撤去義務および不法行為責任を負わない⟫が、弁済期の経過後は、留保所有権が担保権の性質を有することを理由にこれらを免れることはないと解する⦆⟨2⟩。占有処分権能を有する以上、⟪妨害状態を除去しうべき地位⟫にあるといえるからである。\nただし、⦅不法行為責任は、⟪妨害の事実を知ったとき⟫にはじめて負う⦆⟨3⟩。留保所有権者に妨害の有無を一般的に調査すべき義務まで課すのは相当でないからである。","answers":["残債務の弁済期の到来の前後","交換価値を把握","占有・使用する権原を有しない","占有し、処分することができる権能","撤去義務および不法行為責任を負わない","妨害状態を除去しうべき地位","妨害の事実を知ったとき"],"check":"","notes":[{"n":1,"label":"最判平成21・3・10","case":"最判平成21・3・10 民集63巻3号385頁","gist":"留保所有権者は、残債務弁済期が到来するまでは特段の事情がない限り目的動産の撤去義務・不法行為責任を負わないが、弁済期の経過後は留保所有権が担保権の性質を有するからといってこれを免れない。弁済期前は交換価値を把握するにとどまり、経過後は占有・処分の権能を有するから。不法行為責任は妨害の事実を知ったときに負う"},{"n":2,"label":"最判平成21・3・10","case":"最判平成21・3・10 民集63巻3号385頁","gist":"留保所有権者は、残債務弁済期が到来するまでは特段の事情がない限り目的動産の撤去義務・不法行為責任を負わないが、弁済期の経過後は留保所有権が担保権の性質を有するからといってこれを免れない。弁済期前は交換価値を把握するにとどまり、経過後は占有・処分の権能を有するから。不法行為責任は妨害の事実を知ったときに負う"},{"n":3,"label":"最判平成21・3・10","case":"最判平成21・3・10 民集63巻3号385頁","gist":"留保所有権者は、残債務弁済期が到来するまでは特段の事情がない限り目的動産の撤去義務・不法行為責任を負わないが、弁済期の経過後は留保所有権が担保権の性質を有するからといってこれを免れない。弁済期前は交換価値を把握するにとどまり、経過後は占有・処分の権能を有するから。不法行為責任は妨害の事実を知ったときに負う"}],"law":"","cites":[],"rate":0,"designed":true,"ref":false,"hash":"9c649357cd46"},{"id":"民法/所有権留保_法的構成と第三者関係#4","block":"第4","kind":"cloze","masked":"売主が買主に対し通常の営業過程での転売を容認していた場合において、⦅売主が転得者に対し留保所有権に基づき目的物の返還を請求することは、⟦ア⟧（⟦イ⟧）として許されないと解する⦆⟨1⟩。転得者は売主自身の⟦ウ⟧者であり、⟦エ⟧は本来売主が負担すべきものだからである。\nなお、この構成では転得者は返還を拒みうるにとどまり⟦オ⟧ことに留意する。","body":"売主が買主に対し通常の営業過程での転売を容認していた場合において、⦅売主が転得者に対し留保所有権に基づき目的物の返還を請求することは、⟪権利の濫用⟫（⟪1条3項⟫）として許されないと解する⦆⟨1⟩。転得者は売主自身の⟪容認のもとで必然的に現れた⟫者であり、⟪代金回収不能の危険⟫は本来売主が負担すべきものだからである。\nなお、この構成では転得者は返還を拒みうるにとどまり⟪所有権を取得するわけではない⟫ことに留意する。","answers":["権利の濫用","1条3項","容認のもとで必然的に現れた","代金回収不能の危険","所有権を取得するわけではない"],"check":"","notes":[{"n":1,"label":"最判昭和50・2・28","case":"最判昭和50・2・28 民集29巻2号193頁","gist":"ディーラーがサブディーラーの転売を容認していた場合に、ディーラーが留保所有権に基づきユーザーに自動車の返還を請求するのは**権利の濫用**"}],"law":"","cites":["民法/1"],"rate":0,"designed":true,"ref":false,"hash":"d3e6fe28cd76"},{"id":"民法/所有権留保_法的構成と第三者関係#5","block":"第5","kind":"cloze","masked":"⦅買主が目的物につき第三者に譲渡担保を設定していても、代金が完済されるまで⟦ア⟧以上、譲渡担保の効力は目的物に及ばない。よって、第三者は売主に対して⟦イ⟧⦆⟨1⟩。\nただし、これは留保された所有権が⟦ウ⟧に限られている場合の帰結であり、目的物と⟦エ⟧まで担保する趣旨の留保には及ばない。","body":"⦅買主が目的物につき第三者に譲渡担保を設定していても、代金が完済されるまで⟪所有権は移転していない⟫以上、譲渡担保の効力は目的物に及ばない。よって、第三者は売主に対して⟪譲渡担保権を主張することができない⟫⦆⟨1⟩。\nただし、これは留保された所有権が⟪当該目的物の代金債権の担保⟫に限られている場合の帰結であり、目的物と⟪牽連性のない債権⟫まで担保する趣旨の留保には及ばない。","answers":["所有権は移転していない","譲渡担保権を主張することができない","当該目的物の代金債権の担保","牽連性のない債権"],"check":"","notes":[{"n":1,"label":"最判平成30・12・7","case":"最判平成30・12・7 金法2105号6頁","gist":"期間ごとに算定される代金の完済まで所有権を留保する定めの下では、代金完済まで所有権は売主から買主に移転せず、買主から集合動産譲渡担保の設定を受けた者は売主に譲渡担保権を主張できない。転売の包括的承諾があっても所有権が移転したとはみられない"}],"law":"","cites":[],"rate":0,"designed":true,"ref":false,"hash":"2202b8974710"}],"setsurei":["Aは、平成15年10月、Xから、X所有の駐車場の1区画（本件土地）を月極で賃借した。翌月、Aは自動車販売店から自動車甲を購入し、信販会社Yがその代金300万円を立替払いした。A・Y・販売店の三者契約により、甲の所有権は販売店からYに移転し、Aが立替金債務を完済するまでYに留保される旨、およびAが分割金の支払を怠って催告を受けても支払わないときは期限の利益を失い、YはAから甲の引渡しを受けて公正な評価額で売却し代金を債務の弁済に充当できる旨が定められた。 Aは100万円を支払った後、分割金の支払を怠り、Yの催告にも応じないまま行方不明となった。甲は本件土地上に放置されている。Xは賃料不払を理由に賃貸借契約を解除したうえで、Yに対し、本件土地所有権に基づき甲の撤去と土地の明渡し、および使用料相当損害金の支払を求めた。 (1) Xの請求は認められるか。 (2) その後Yが甲を引き揚げ、甲を250万円で売却できた場合、Y・A間の法律関係はどうなるか。","建設機械の販売業者Yは、業者Aに対し、1か月を単位とする期間ごとに算定される代金の完済まで目的物の所有権を留保する旨の合意のもとで、建設機械を継続的に売却していた。YはAが通常の営業過程で目的物を転売することを包括的に承諾していた。他方Aは、金融機関Xのために、自己の在庫商品一切を目的とする集合動産譲渡担保を設定し、動産債権譲渡特例法3条1項の登記を経由していた。 Aが代金を完済しないまま、Xが譲渡担保権を実行しようとしている。 (1) Xは、Yに対して当該建設機械につき譲渡担保権を主張できるか。 (2) 仮に、YとAの合意が「Y・A間の売買代金債権が**すべて**完済されるまで、引き渡した**すべての**目的物の所有権を留保する」という内容であった場合はどうか。"],"full":"所有権留保とは、売買契約の特約により、買主が代金を完済するまで目的物の所有権を売主に留保する担保方法をいう。\nもっとも、その実質は売買代金債権の担保にあるから、売主が留保する所有権は⟪担保の目的に必要な範囲⟫に制限され、買主には代金完済により所有権を取得しうる⟪物権的地位⟫が帰属すると解する。\n⟪対抗要件は不要⟫である。所有権留保においては所有権が売主のもとに留まるだけで⟪物権変動が存在せず⟫、178条の対抗要件を観念できないからである。\n\n買主が代金債務の履行を怠ったときは、売主は留保所有権に基づき目的物を引き揚げ、これを換価して⟪他の債権者に優先⟫して代金債権に充当することができる。\nもっとも、担保である以上、目的物の価額が残債権額を超えるときは、売主は超過額を買主に⟪清算する義務⟫を負う。そして、⟪清算金の支払が完了するまで⟫は、買主は残代金を支払って目的物を⟪受け戻すことができる⟫と解する。\n\n⦅留保所有権者が有する権原は、⟪残債務の弁済期の到来の前後⟫で異なる。すなわち、留保所有権者は、弁済期が到来するまでは目的物の⟪交換価値を把握⟫するにとどまり、⟪占有・使用する権原を有しない⟫が、弁済期の経過後は⟪占有し、処分することができる権能⟫を取得する⦆⟨1⟩。\nそこで、⦅留保所有権者は、弁済期が到来するまでは、特段の事情がない限り、⟪撤去義務および不法行為責任を負わない⟫が、弁済期の経過後は、留保所有権が担保権の性質を有することを理由にこれらを免れることはないと解する⦆⟨2⟩。占有処分権能を有する以上、⟪妨害状態を除去しうべき地位⟫にあるといえるからである。\nただし、⦅不法行為責任は、⟪妨害の事実を知ったとき⟫にはじめて負う⦆⟨3⟩。留保所有権者に妨害の有無を一般的に調査すべき義務まで課すのは相当でないからである。\n\n売主が買主に対し通常の営業過程での転売を容認していた場合において、⦅売主が転得者に対し留保所有権に基づき目的物の返還を請求することは、⟪権利の濫用⟫（⟪1条3項⟫）として許されないと解する⦆⟨1⟩。転得者は売主自身の⟪容認のもとで必然的に現れた⟫者であり、⟪代金回収不能の危険⟫は本来売主が負担すべきものだからである。\nなお、この構成では転得者は返還を拒みうるにとどまり⟪所有権を取得するわけではない⟫ことに留意する。\n\n⦅買主が目的物につき第三者に譲渡担保を設定していても、代金が完済されるまで⟪所有権は移転していない⟫以上、譲渡担保の効力は目的物に及ばない。よって、第三者は売主に対して⟪譲渡担保権を主張することができない⟫⦆⟨1⟩。\nただし、これは留保された所有権が⟪当該目的物の代金債権の担保⟫に限られている場合の帰結であり、目的物と⟪牽連性のない債権⟫まで担保する趣旨の留保には及ばない。","kata":"| # | 落としてはいけない要素 |\n|---|---|\n| 1 | 実質は代金債権の担保→留保所有権は**担保目的に制限**／買主に**物権的地位** |\n| 2 | **対抗要件不要**（物権変動が無く178条を観念できない） |\n| 3 | 実行＝**引揚げ→換価→充当**。価額が残債権を超えれば**清算義務** |\n| 4 | 清算完了までは買主が**残代金を払って受戻し**できる |\n| 5 | 撤去義務：**残債務弁済期の前後で切る** |\n| 6 | 弁済期前＝**交換価値を把握するにとどまる**→原則義務なし（特段の事情を除く） |\n| 7 | 弁済期後＝**占有し処分する権能**を取得→撤去義務あり（担保権だからと免れない） |\n| 8 | 不法行為責任は**妨害の事実を知った時から** |\n| 9 | 転売容認型＝**権利濫用（1条3項）**。理由＝回収不能の危険は売主が負担すべき／転得者は代金完済 |\n| 10 | 譲渡担保との競合＝**代金完済まで所有権は移転していない**→譲渡担保の効力は及ばない |\n| 11 | 10の限定＝**当該目的物の代金を担保する限度**の留保であること |\n\n**勝負どころ**：\n1. **「弁済期の前後で権原が変わる」を言えるか。**所有権留保の第三者関係はここ一点で決まる。「担保権だから撤去義務を負わない」でも「所有者だから常に負う」でもなく、**弁済期後に占有処分権能を取得するから負う**という中間の論理が答案の核。\n2. **譲渡担保との競合で、判例の射程限定（当該目的物の代金の担保に限る）まで言えるか。**結論だけ書くと拡大された所有権留保の事案で誤る。\n3. **対抗要件不要の理由を「物権変動が無い」と言えるか。**「動産だから」ではない。\n\n> ⚠️ **間違えやすい点**\n> - **所有権留保の対抗要件は「不要」。**譲渡担保（所有権が移転する）と混線しやすい。理由は「物権変動が無い」であって「動産だから」ではない。\n> - **転売容認型の権利濫用構成では、転得者は所有権を取得しない。**「権利濫用だから転得者が所有者になる」と書くと誤り。返還を拒めるだけで登録名義を移せない、という批判までがセット。\n> - **「撤去義務を負わない」と言い切らない。**弁済期の経過後は負う。判例は担保権の性質を理由に免責することを正面から否定している。\n> - **不法行為責任と撤去義務を同じ基準で書かない。**撤去義務は弁済期の経過で発生するが、不法行為責任は**さらに妨害の事実を知ったとき**から。\n> - **平30・12・7 を「対抗要件は不要と判示した判例」として引かない。**判決文に対抗要件への言及はない（下記判例表の備考参照）。\n\n---","hanrei":[["最判平成21・3・10 民集63巻3号385頁","留保所有権者は、残債務弁済期が到来するまでは特段の事情がない限り目的動産の撤去義務・不法行為責任を負わないが、弁済期の経過後は留保所有権が担保権の性質を有するからといってこれを免れない。弁済期前は交換価値を把握するにとどまり、経過後は占有・処分の権能を有するから。不法行為責任は妨害の事実を知ったときに負う","民法百選Ⅰ〔第9版〕**99番**（＝〔第8版〕101番・〔第7版〕100番）。第9版の解説は和田勝行。`アガルート` 論点マップは**司H30**"],["最判平成30・12・7 金法2105号6頁","期間ごとに算定される代金の完済まで所有権を留保する定めの下では、代金完済まで所有権は売主から買主に移転せず、買主から集合動産譲渡担保の設定を受けた者は売主に譲渡担保権を主張できない。転売の包括的承諾があっても所有権が移転したとはみられない","民法百選Ⅰ〔第9版〕**100番**（第7版・第8版には未収録。解説は西内康人）。金属スクラップの事例判断。※**「所有権留保に対抗要件は不要」は本判決の判示ではない**——判決文に対抗要件への言及はなく、百選100番解説2(3)は「本判決は優先関係を考えていないので蛇足的な部分もある」と評する。これは `講義` p.448 の**評価**である"],["最判昭和50・2・28 民集29巻2号193頁","ディーラーがサブディーラーの転売を容認していた場合に、ディーラーが留保所有権に基づきユーザーに自動車の返還を請求するのは**権利の濫用**","最判昭和57・12・17も同旨（`アガルート` p.178）。**登録済自動車は即時取得の対象にならない**ので即時取得では救えない"],["最判平成22・6・4 民集64巻4号1107頁","立替払型の三者契約では、所有権は販売会社から信販会社に直接移転して留保される（弁済による代位の構成ではない）。民事再生手続で別除権として行使するには、開始時点で信販会社名義の登録が必要","`講義` p.445 注2・p.450"],["最判平成29・12・7 民集71巻10号1925頁","保証委託方式で信販会社が保証債務を履行し法定代位した事案。破産手続開始時点で**販売会社**を所有者とする登録があれば足り、信販会社名義の登録は不要","`講義` p.445 注2"],["最判昭和34・8・7 民集13巻10号1223頁","立木の所有権留保売買において明認方法の具備を対抗要件とした","`講義` p.448"],["最判昭和35・2・11 民集14巻2号168頁","占有改定による引渡しでは即時取得は成立しない","百選Ⅰ〔第9版〕**64番**（＝〔第8版〕68番）。設例2で譲渡担保権者が即時取得で救われない理由。**即時取得論証の担当範囲**"],["最判昭和57・9・28 判時1062号81頁","譲渡担保権者は被担保債権の弁済期の経過により目的物を「処分する権能」を取得する（平21・3・10の前提となった枠組み）","百選Ⅰ〔第9版〕99番 解説2。**譲渡担保論証の担当範囲**なので比較のみ"]],"field":"非典型担保","order":23},{"name":"抵当権の物上代位_差押えの趣旨と目的債権の処分","subject":"民法","rank":"A","path":"まとめ/民法/論証/抵当権の物上代位_差押えの趣旨と目的債権の処分.md","cards":[{"id":"民法/抵当権の物上代位_差押えの趣旨と目的債権の処分#1","block":"第1〔差押えの趣旨〕","kind":"cloze","masked":"抵当権の効力は、目的物の売却・賃貸等により債務者が受けるべき金銭にも及ぶが、抵当権者は、その払渡し又は引渡しの前に差押えをしなければならない（372条・⟦ア⟧）。\nこの差押えを要求する趣旨は、抵当権者の⟦イ⟧する点にも、目的債権の⟦ウ⟧する点にもない。抵当権の効力が目的債権に及ぶことは⟦エ⟧によって公示されているのであるから、第三者の保護は登記に委ねれば足りる。⦅差押えの趣旨は、主として、第三債務者が⟦オ⟧を強いられる危険から第三債務者を保護する点にあると解する⦆⟨1⟩。","body":"抵当権の効力は、目的物の売却・賃貸等により債務者が受けるべき金銭にも及ぶが、抵当権者は、その払渡し又は引渡しの前に差押えをしなければならない（372条・⟪304条1項ただし書⟫）。\nこの差押えを要求する趣旨は、抵当権者の⟪優先権を保全⟫する点にも、目的債権の⟪特定性を維持⟫する点にもない。抵当権の効力が目的債権に及ぶことは⟪抵当権設定登記⟫によって公示されているのであるから、第三者の保護は登記に委ねれば足りる。⦅差押えの趣旨は、主として、第三債務者が⟪二重弁済⟫を強いられる危険から第三債務者を保護する点にあると解する⦆⟨1⟩。","answers":["304条1項ただし書","優先権を保全","特定性を維持","抵当権設定登記","二重弁済"],"check":"**第三債務者保護説**／二重弁済の危険／対抗の役割は**抵当権設定登記**が担う／**372条・304条1項ただし書** ／ —","notes":[{"n":1,"label":"最二小判平成10・1・30","case":"最二小判平成10・1・30 民集52巻1号1頁","gist":"目的債権が譲渡され対抗要件が備えられた後でも、抵当権者は差し押さえて物上代位できる。差押えの趣旨＝第三債務者保護"}],"law":"","cites":["民法/372","民法/304"],"rate":17,"designed":true,"ref":false,"hash":"0fedbf823946"},{"id":"民法/抵当権の物上代位_差押えの趣旨と目的債権の処分#2","block":"第2〔債権譲渡との優劣〕","kind":"cloze","masked":"そこで、⦅目的債権が譲渡され第三者対抗要件が備えられた後であっても、抵当権者は目的債権を差し押さえて物上代位権を行使することができると解する⦆⟨1⟩。\nなぜなら、(1) 304条1項の「⟦ア⟧」という文言は当然には債権譲渡を含まず、目的債権が譲渡されたことから必然的に抵当権の効力が及ばなくなるものでもない。(2) 第三債務者は、差押命令の送達を受ける前に譲受人に弁済した分はその⟦イ⟧でき、弁済していない分は⟦ウ⟧すれば免責されるから、その利益は害されない。(3) 抵当権の効力が目的債権に及ぶことは⟦オ⟧により公示されている。(4) 譲渡が⟦キ⟧と解すると、抵当権設定者は差押え前に⟦エ⟧するだけで容易に物上代位を免れることができ、抵当権者の利益を不当に害するからである。\nよって、⟦オ⟧が債権譲渡の⟦カ⟧より先である限り、抵当権者が⟦キ⟧。","body":"そこで、⦅目的債権が譲渡され第三者対抗要件が備えられた後であっても、抵当権者は目的債権を差し押さえて物上代位権を行使することができると解する⦆⟨1⟩。\nなぜなら、(1) 304条1項の「⟪払渡し又は引渡し⟫」という文言は当然には債権譲渡を含まず、目的債権が譲渡されたことから必然的に抵当権の効力が及ばなくなるものでもない。(2) 第三債務者は、差押命令の送達を受ける前に譲受人に弁済した分はその⟪消滅を対抗⟫でき、弁済していない分は⟪供託⟫すれば免責されるから、その利益は害されない。(3) 抵当権の効力が目的債権に及ぶことは抵当権設定登記により公示されている。(4) 譲渡が優先すると解すると、抵当権設定者は差押え前に⟪債権を譲渡⟫するだけで容易に物上代位を免れることができ、抵当権者の利益を不当に害するからである。\nよって、⟪抵当権設定登記⟫が債権譲渡の⟪対抗要件具備⟫より先である限り、抵当権者が⟪優先する⟫。","answers":["払渡し又は引渡し","消滅を対抗","供託","債権を譲渡","抵当権設定登記","対抗要件具備","優先する"],"check":"4本柱：(1)「払渡し又は引渡し」に譲渡含まず (2)第三債務者は害されない〔**送達前弁済は対抗可＋未弁済は供託で免責**〕 (3)登記で公示 (4)免脱防止 ／ **登記 vs 対抗要件具備**の先後","notes":[{"n":1,"label":"最二小判平成10・1・30","case":"最二小判平成10・1・30 民集52巻1号1頁","gist":"目的債権が譲渡され対抗要件が備えられた後でも、抵当権者は差し押さえて物上代位できる。差押えの趣旨＝第三債務者保護"}],"law":"","cites":["民法/304"],"rate":3,"designed":true,"ref":false,"hash":"9dce1c5d7ecc"},{"id":"民法/抵当権の物上代位_差押えの趣旨と目的債権の処分#3","block":"第3〔転付命令との優劣〕","kind":"cloze","masked":"これに対し、⦅目的債権について転付命令が第三債務者に送達された後は、抵当権者は物上代位権を⟦ア⟧⦆⟨1⟩。\n転付命令は、その送達時に他の債権者が差押え等をしていないことを条件として、差押債権者に⟦イ⟧を与えるものであり（⟦ウ⟧）、この「差押え」には⟦エ⟧も含まれる。したがって、送達前に⟦エ⟧がされていれば転付命令は⟦オ⟧が、そうでない場合には、送達時に被転付債権が差押債権者の債権の⟦カ⟧されたものとみなされる（民執160条）。弁済されたものとみなされる以上、もはや⟦キ⟧となる債権は存在しないからである。","body":"これに対し、⦅目的債権について転付命令が第三債務者に送達された後は、抵当権者は物上代位権を⟪行使することができない⟫⦆⟨1⟩。\n転付命令は、その送達時に他の債権者が差押え等をしていないことを条件として、差押債権者に⟪独占的満足⟫を与えるものであり（⟪民執159条3項⟫）、この「差押え」には⟪物上代位による差押え⟫も含まれる。したがって、送達前に物上代位による差押えがされていれば転付命令は⟪効力を生じない⟫が、そうでない場合には、送達時に被転付債権が差押債権者の債権の⟪弁済に充当⟫されたものとみなされる（民執160条）。弁済されたものとみなされる以上、もはや⟪代位の目的⟫となる債権は存在しないからである。","answers":["行使することができない","独占的満足","民執159条3項","物上代位による差押え","効力を生じない","弁済に充当","代位の目的"],"check":"**民執159条3項**＝独占的満足／「差押え」に物上代位も含む → 先に差し押さえれば転付が死ぬ／**民執160条**＝弁済擬制で代位の対象が消える ／ **送達までに差押えをしたか**","notes":[{"n":1,"label":"最一小判平成14・3・12","case":"最一小判平成14・3・12 民集56巻3号555頁","gist":"転付命令が第三債務者に送達された後は、先に物上代位の差押えがない限り物上代位できない"}],"law":"","cites":["民事執行法/159","民事執行法/160"],"rate":17,"designed":true,"ref":false,"hash":"6c7227064b4d"},{"id":"民法/抵当権の物上代位_差押えの趣旨と目的債権の処分#4","block":"第4〔一般債権者の差押えとの優劣〕","kind":"cloze","masked":"一般債権者による差押えとの競合においては、一般債権者の処分禁止効は⟦ア⟧の第三債務者への⟦イ⟧によって生じ、抵当権者が抵当権を第三者に対抗するには⟦ウ⟧を要する。\nしたがって、⦅両者の優劣は、一般債権者の申立てによる⟦ア⟧の第三債務者への送達と、⟦ウ⟧との⟦エ⟧によって決せられる⦆⟨1⟩。送達が登記より先であれば、抵当権者は⟦オ⟧。","body":"一般債権者による差押えとの競合においては、一般債権者の処分禁止効は⟪差押命令⟫の第三債務者への⟪送達⟫によって生じ、抵当権者が抵当権を第三者に対抗するには⟪抵当権設定登記⟫を要する。\nしたがって、⦅両者の優劣は、一般債権者の申立てによる差押命令の第三債務者への送達と、抵当権設定登記との⟪先後⟫によって決せられる⦆⟨1⟩。送達が登記より先であれば、抵当権者は⟪配当を受けることができない⟫。","answers":["差押命令","送達","抵当権設定登記","先後","配当を受けることができない"],"check":"一般債権者の処分禁止効は**送達**で生じる／抵当権の対抗には**登記**が要る ／ **送達 vs 登記**の先後","notes":[{"n":1,"label":"最二小判平成10・3・26","
