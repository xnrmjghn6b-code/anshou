/* 1枚ずつ回す。back は終わったときの戻り先（目次から始めたら目次に戻る） */
function study(queue, back){
  let i = 0;
  // ひとつ前に戻ったときに、そこで付けた判定を取り消せるように、採点前の状態を積んでおく
  const undo = [];
  function one(){
    if(i >= queue.length){ done(queue.length, back); return; }
    const c = queue[i];
    const st = S.cards[c.id];
    setHdr((i+1) + " / " + queue.length);
    let h = '<div class="card">';
    h += '<div class="meta"><span class="book">' + esc(c.book.name) + '</span>'
       + '<span class="pill">' + esc(c.book.subject) + '</span>'
       + '<span>' + esc(rankLine(c.book.rank)) + '</span></div>';
    h += '<div class="block">' + esc(c.block) + srcBadge(c) + '</div>';
    if(c.kind === "cloze"){
      h += '<div class="body">' + deco(holes(c.masked, c.answers), c.notes) + '</div>';
      h += '<div id="noteBox">' + noteList(c.notes, false) + '</div>';
    }else{
      h += '<div class="dim">このブロックには穴がありません（太字なし）。'
         + '<b>見出しだけを見て、本文を思い出してから</b>答えを見る。</div>';
    }
    if(st.fixed) h += '<div class="dim" style="margin-top:.5rem">※ 論証が直されたカード。直った箇所に注意。</div>';
    h += '<div class="row" style="margin-top:1rem"><button class="primary" id="reveal">答えを見る</button>'
       + '<button class="sub" id="back"' + (i > 0 ? '' : ' disabled') + '>もどる</button>'
       + '<button class="sub" id="skip">とばす</button>'
       + '<span class="grow"></span>'
       + '<button class="link" id="toRef">暗唱しなくてよい（参照に回す）</button></div>';
    h += '<div id="ansBox"></div></div>';
    view().innerHTML = h;
    showRail(c);
    document.getElementById("skip").onclick = () => { i++; one(); };
    const bk = document.getElementById("back");
    if(bk && i > 0) bk.onclick = () => {
      i--;
      const u = undo.pop();
      // 直前に判定を付けていたら、その採点を取り消してからその札に戻る
      if(u && u.index === i){ S.cards[u.id] = u.state; save(); }
      else if(u){ undo.push(u); }
      one();
    };
    document.getElementById("toRef").onclick = () => {
      setRef(c.id, true);           // 条文を読めば済むもの・制度の確認はここで外す
      i++; one();
    };
    let shown = false;
    document.getElementById("reveal").onclick = () => {
      if(shown){                       // もう一度押すと隠れる（自分でもう一周できるように）
        clearHoles();
        const nb0 = document.getElementById("noteBox");
        if(nb0) nb0.innerHTML = noteList(c.notes, false);
        document.getElementById("ansBox").innerHTML = "";
        document.getElementById("reveal").textContent = "答えを見る";
        shown = false;
        return;
      }
      let a = '<div class="ans">';
      if(c.kind === "cloze"){
        // 答えは上の問題文の空欄に赤字で入る。ここでは重ねて並べない
        fillHoles(c.answers);
        const nb = document.getElementById("noteBox");
        if(nb) nb.innerHTML = noteList(c.notes, true);
      }else{
        a += '<div class="body">' + deco(emph(c.body), c.notes) + '</div>';
        a += noteList(c.notes, true);
      }
      if(c.check) a += '<div class="check">' + md(c.check) + '</div>';
      if(!c.check && c.book.kata) a += '<div class="check">この論証の採点チェックリストは「型の骨組み」表を見る。</div>';
      a += hanreiBox(c.book);
      a += '<div class="grades">'
         + gbtn(5) + gbtn(4) + gbtn(3) + gbtn(2) + gbtn(1)
         + '</div>';
      a += '<div class="dim" style="margin-top:.5rem">いまの間隔 ' + (st.interval||NEW_INTERVAL) + '日</div>';
      a += '</div>';
      document.getElementById("ansBox").innerHTML = a;
      document.getElementById("reveal").textContent = "答えを隠す";
      shown = true;
      view().querySelectorAll("[data-g]").forEach(el => {
        el.onclick = () => {
          undo.push({id:c.id, index:i, state:JSON.parse(JSON.stringify(S.cards[c.id]))});
          grade(c.id, +el.dataset.g);
          i++; one();
        };
      });
    };
  }
  // 数字だけ出す。「完全」「言葉落ち」等の説明は付けない
  // （2026-07-30 こもごもさん指示：判定は自分の感覚で付ける）
  function gbtn(g){
    return '<button data-g="' + g + '">' + g + '</button>';
  }
  one();
}

/* 通しモード（設例だけ見て全文） */
function fullMode(b){
  const n = (S.books[b.name] && S.books[b.name].setsurei) || 0;
  const s = b.setsurei.length ? b.setsurei[n % b.setsurei.length] : "（設例なし）";
  setHdr("通し");
  let h = '<div class="card"><div class="meta"><span class="book">' + esc(b.name) + '</span>'
        + '<span>' + esc(rankLine(b.rank)) + '</span></div>';
  h += '<div class="setsurei">' + esc(s) + '</div>';
  h += '<div class="dim">規範を、条文と理由付けを入れて全文書く。思い出せないところは「飛んだ」と書く。</div>';
  h += '<div class="row" style="margin-top:1rem"><button class="primary" id="rv">答えを見る</button></div>';
  h += '<div id="ansBox"></div></div>';
  view().innerHTML = h;
  // 通しでも、その論証に出てくる条文と前提は引ける
  const allCites = [];
  b.cards.forEach(c => (c.cites || []).forEach(k => { if(!allCites.includes(k)) allCites.push(k); }));
  showRail({book:b, cites:allCites});
  document.getElementById("rv").onclick = () => {
    // 通しでは注釈の番号は出さない（本1冊ぶんで番号が重なるため）。引用の点線だけ残る
    let a = '<div class="ans"><div class="body">' + deco(emph(b.full), null) + '</div>'
          + hanreiBox(b);
    a += '<div class="grades">'
       + '<button data-g="5">5</button><button data-g="4">4</button>'
       + '<button data-g="3">3</button><button data-g="2">2</button>'
       + '<button data-g="1">1</button></div></div>';
    document.getElementById("ansBox").innerHTML = a;
    document.getElementById("rv").disabled = true;
    view().querySelectorAll("[data-g]").forEach(el => {
      el.onclick = () => {
        const g = +el.dataset.g;
        S.books[b.name] = S.books[b.name] || {};
        S.books[b.name].setsurei = n + 1;
        S.books[b.name].last = today();
        S.books[b.name].grade = g;
        if(g <= 2){                       // ブロックに戻す
          b.cards.forEach(c => { S.cards[c.id].streak5 = 0;
                                 S.cards[c.id].due = addDays(today(), 3);
                                 S.cards[c.id].interval = 3; });
        }else{
          b.cards.forEach(c => {          // 通しで通ったら本全体の間隔を伸ばす
            const st = S.cards[c.id];
            st.interval = Math.max(st.interval || 3, g === 5 ? 60 : 30);
            st.due = addDays(today(), st.interval);
          });
        }
        save();
        home();
      };
    });
  };
}

/* ---------- 目次 ---------- */
/* 好きな分野・論証・ブロックから始める（短答アプリの目次と同じ考え方）。
   ブロックを押すと、その論証の末尾まで順に出す。
   目次から解いた分も採点・期日の伸ばし方は今日の分とまったく同じ
   （つまみ食い用の別枠は作らない。記録が二重管理になるのを避ける）。 */
function cardsOf(b){ return CARDS.filter(c => c.book === b); }
function tocGroups(){
  const groups = [];
  (DATA.toc || []).forEach(g => groups.push({subject:g.subject, field:g.field, books:[]}));
  DATA.books.filter(b => b.cards.length)
    .slice().sort((a,b) => (a.order||0) - (b.order||0) || a.name.localeCompare(b.name))
    .forEach(b => {
      let g = groups.find(x => x.subject === b.subject && x.field === b.field);
      if(!g){ g = {subject:b.subject, field:b.field, books:[]}; groups.push(g); }
      g.books.push(b);
    });
  return groups.filter(g => g.books.length);
}
/* チップの色。判定を付けていないものは灰（推測で色を付けない） */
function chipClass(c){
  if(isRef(c)) return "chip ref";
  const g = S.cards[c.id].grade;
  if(g == null) return "chip";
  if(g >= 4) return "chip ok";
  if(g === 3) return "chip mid";
  return "chip ng";
}
function blockNo(c, i){
  const m = /第(\d+)/.exec(c.block);
  return m ? m[1] : String(i + 1);
}
function queueOf(bs, from){       // 論証の配列 → 出す順（参照は飛ばす）
  let q = [];
  bs.forEach((b, k) => {
    const cs = cardsOf(b);
    q = q.concat((k === 0 && from ? cs.slice(from) : cs).filter(c => !isRef(c)));
  });
  return q;
}
function startToc(bs, from){
  const q = queueOf(bs, from || 0);
  if(!q.length){ alert("ここには暗唱するカードがありません（参照だけ）"); return; }
  study(q, toc);
}
function toc(){
  setHdr("");                       // 見出しの「目次」ボタンと二重に出さない
  hideRail();
  const t = today();
  let h = '<div class="card"><div class="book">目次</div>'
    + '<div class="dim">好きなところから始める。<b>ブロックを押すと、その論証の最後まで</b>'
    + '順に出す。論証名を押せばその論証の頭から、「この分野を丸ごと出す」で分野ぜんぶ。'
    + '採点と期日の伸び方は今日の分とまったく同じ。</div>'
    + '<div class="dim" style="margin-top:.4rem">'
    + '<span class="chip" style="cursor:default">未</span> まだ判定なし　'
    + '<span class="chip ok" style="cursor:default">4-5</span> 出た　'
    + '<span class="chip mid" style="cursor:default">3</span> 結論落ち　'
    + '<span class="chip ng" style="cursor:default">1-2</span> 出ない　'
    + '<span class="chip ref" style="cursor:default">参</span> 参照　'
    + '<span class="dot">●</span> 期日到来</div></div>';
  let sub = null;
  tocGroups().forEach((g, gi) => {
    if(g.subject !== sub){ sub = g.subject; h += '<div class="tocsub">' + esc(sub) + '</div>'; }
    const cs = g.books.reduce((a, b) => a.concat(cardsOf(b)), []);
    const mine = cs.filter(c => !isRef(c));
    const due = mine.filter(c => S.cards[c.id].due <= t).length;
    // 分野は畳んだ状態で出す（2026-07-30 こもごもさん指示。全部開くと目次が長すぎて見渡せない）
    h += '<details class="field"><summary>'
       + esc(g.field) + '<span class="n">' + mine.length + '枚'
       + (due ? '・期日 ' + due : '') + '</span></summary>'
       + '<button class="link" data-g="' + gi + '">この分野を丸ごと出す（'
       + mine.length + '枚）</button>';
    g.books.forEach(b => {
      h += '<div class="tocbook"><button class="nm" data-b="' + esc(b.name) + '">'
         + esc(b.name) + '</button> <span class="pill">' + (b.rank || '—') + '</span>'
         + (bookReady(b) ? ' <span class="pill case">通し可</span>' : '')
         + '<div class="chips">';
      cardsOf(b).forEach((c, i) => {
        const ref = isRef(c);
        const st = S.cards[c.id];
        const dot = (!ref && st.due <= t) ? '<span class="dot">●</span>' : '';
        h += '<button class="' + chipClass(c) + '" title="' + esc(c.block)
           + (ref ? '（参照。暗唱に出していない）'
                  : '／次の期日 ' + st.due + (st.grade != null ? '・前回 ' + st.grade : '')) + '"'
           + (ref ? ' disabled' : ' data-c="' + esc(c.id) + '"') + '>'
           + esc(blockNo(c, i)) + dot + '</button>';
      });
      h += '</div></div>';
    });
    h += '</details>';
  });
  view().innerHTML = h;
  const groups = tocGroups();
  view().querySelectorAll("[data-g]").forEach(el => {
    el.onclick = () => startToc(groups[+el.dataset.g].books, 0);
  });
  view().querySelectorAll("[data-b]").forEach(el => {
    el.onclick = () => startToc([DATA.books.find(b => b.name === el.dataset.b)], 0);
  });
  view().querySelectorAll("[data-c]").forEach(el => {
    el.onclick = () => {
      const c = CARDS.find(x => x.id === el.dataset.c);
      startToc([c.book], cardsOf(c.book).indexOf(c));
    };
  });
}

        cloudState = "鍵は " + me.login + " として通り、リポジトリも読めた";
      }
    }catch(e){ cloudState = "つながらない（" + e.message + "）"; }
    paintCloud();
  };
  document.getElementById("syncNow").onclick = async () => {
    if(!cloudOn()){ cloudState = "まだ鍵が無い"; paintCloud(); return; }
    const changed = await cloudPull();
    await cloudPush(true);
    if(changed) home(); else paintCloud();
  };
  const msg = document.getElementById("msg");
  document.getElementById("cp").onclick = () => {
    const ta = document.getElementById("out");
    ta.select();
    if(navigator.clipboard) navigator.clipboard.writeText(json).then(
      () => msg.textContent = "コピーした", () => msg.textContent = "自分でコピーして");
    else{ document.execCommand("copy"); msg.textContent = "コピーした"; }
  };
  // iPhone：共有シートを開いて「"ファイル"に保存」→ iCloud Drive\暗唱 に置いてもらう。
  // iOSは共有できるファイルの種類を絞っているので、通る形を順に試す（2026-07-30）。
  // 何が起きたかを画面に出す——黙って失敗すると原因が分からない
  document.getElementById("sh").onclick = async () => {
    const tries = [
      ["テキスト（.txt）", new File([json], "暗唱記録.txt", {type:"text/plain"})],
      ["JSON（.json）",    new File([json], "暗唱記録.json", {type:"application/json"})],
    ];
    if(!navigator.share){ msg.textContent = "この端末に共有の仕組みが無い"; return; }
    for(const [name, f] of tries){
      if(navigator.canShare && !navigator.canShare({files:[f]})) continue;
      try{
        await navigator.share({files:[f], title:"暗唱記録"});
        msg.textContent = name + "で共有した";
        return;
      }catch(e){
        if(e && e.name === "AbortError"){ msg.textContent = "やめた"; return; }
      }
    }
    try{                                  // ファイルが駄目なら本文だけ送る（メモ等に貼れる）
      await navigator.share({title:"暗唱記録", text:json});
      msg.textContent = "本文として共有した（ファイルは断られた）";
    }catch(e){
      msg.textContent = (e && e.name === "AbortError") ? "やめた"
        : "共有できなかった（" + ((e && e.name) || "不明") + "）。「ファイルに保存」を試す";
    }
  };
  document.getElementById("dl").onclick = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([json], {type:"application/json"}));
    a.download = "暗唱記録.json";
    a.click();
    msg.textContent = "保存した";
  };
  document.getElementById("imp").onclick = () => {
    try{
      const o = JSON.parse(document.getElementById("in").value);
      if(!o || !o.cards) throw 0;
      S = Object.assign({v:1, cards:{}, books:{}}, o);
      sync(); save(); home();
    }catch(e){ alert("読み込めなかった（JSONが壊れている）"); }
  };
}

/* ---------- 起動 ---------- */
load();
if(!storeOk) document.getElementById("noStore").classList.remove("hide");
sync();
document.getElementById("btnHome").onclick = home;
document.getElementById("btnToc").onclick = toc;
/* いつでも手で送れるようにしておく（30秒待たずに確定させたいとき・端末を持ち替えるとき） */
document.getElementById("btnSave").onclick = async () => {
  if(!cloudOn()){
    cloudState = "鍵が無い（書き出し／読み込みで貼る）";
    paintCloud();
    return;
  }
  await cloudPush(true);
};
window.addEventListener("resize", fitRail);   // 画面を回したときに高さを測り直す
home();
paintCloud();
/* 起動のたびに「読み込む → 送り返す」。送信が1回落ちても次に開いたときに追いつく */
if(cloudOn()){
  (async () => {
    const changed = await cloudPull();
    if(changed){ sync(); home(); }
    await cloudPush(true);
  })();
}
</script>
